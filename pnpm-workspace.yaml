packages:
  - apps/*
  - packages/*

allowBuilds:
  agent-browser: false
  core-js: false
  electron: false
  es5-ext: false
  esbuild: true
  lefthook: true
  sharp: false
  workerd: true

catalog:
  "@hono/node-server": ^2.0.10
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/commands": 6.11.0
  "@codemirror/language": 6.12.3
  "@codemirror/state": 6.5.0
  "@codemirror/view": 6.38.6
  "@lezer/common": 1.5.2
  "@lezer/highlight": 1.2.3
  "@lezer/lr": 1.4.10
  "@js-temporal/polyfill": ^0.5.1
  happy-dom: ^20.9.0
  hono: ^4.13.0
  yaml: ^2.9.0
  "@logtape/logtape": ^2.0.7
  "@pnpm/find-workspace-dir": ^1000.1.5
  "@std/collections": jsr:1.2.0
  "@std/async": jsr:1.4.0
  "@std/assert": jsr:1.0.19
  "@tailwindcss/vite": ^4.3.0
  "@types/node": ^26.1.2
  "@types/node-24": npm:@types/node@^24.13.3
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@types/semver": ^7.7.1
  ajv: ^8.20.0
  arkregex: ^0.0.5
  cross-env: ^10.1.0
  eta: 4.6.0
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  fflate: ^0.8.2
  monkey-around: 3.0.0
  oxfmt: ^0.55.0
  oxlint: ^1.70.0
  react: ^19.2.0
  react-dom: ^19.2.0
  semver: ^7.7.2
  tailwindcss: ^4.3.0
  tsdown: ^0.22.5
  typescript: ^7.0.2
  valibot: ^1.0.0
  vite: ^8.1.5
  vitest: ^4.0.13
  zx: ^8.8.5

# zotero-types declares two transitive deps as GitHub specs, which
# blockExoticSubdeps refuses. Scope overrides to zotero-types only so we
# don't shadow these names anywhere else in the graph.
overrides:
  # Obsidian and every Workbench host must share CodeMirror class identities.
  "@codemirror/autocomplete": 6.20.3
  "@codemirror/language": 6.12.3
  # The last lint release built for the pinned view; newer ones need view 6.42.
  "@codemirror/lint": 6.9.5
  "@codemirror/state": 6.5.0
  "@codemirror/view": 6.38.6
  "zotero-types>epubjs": 0.3.93
  "zotero-types>pdfjs-dist": workspace:*
  # ajv pins fast-uri to ^3.0.1; force the patched version (GHSA-7p8r-x3mc-p8w7).
  "ajv>fast-uri": "^3.1.5"
  # postcss (via docs' Tailwind/vite toolchain) pins nanoid to 3.3.16; force the
  # patched version (GHSA-2v37-7h3g-55p8).
  "postcss>nanoid": "^3.3.17"

# delay 3 day to reduce the risk of installing compromised packages
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: true
# hono@4.12.34 is a security patch (GHSA-8j4g-w8fx-2239); exempt it from the age
# gate to land the fix now
# eslint-plugin-obsidianmd encodes Obsidian's current review guidelines, so a
# release must be able to scan against the newest rules the day they ship. It is
# release-scoped dev tooling and never reaches the published plugin.
minimumReleaseAgeExclude:
  - hono
  - eslint-plugin-obsidianmd
