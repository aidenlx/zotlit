packages:
  - apps/*
  - packages/*

allowBuilds:
  core-js: false
  electron: false
  es5-ext: false
  esbuild: true
  lefthook: true

catalog:
  "@inlang/paraglide-js": ^2.15.1
  "@logtape/logtape": ^2.0.7
  "@types/node": ^25.5.0
  "@typescript/native-preview": 7.0.0-dev.20260421.2
  drizzle-kit: 1.0.0-rc.2
  drizzle-orm: 1.0.0-rc.2
  oxfmt: ^0.48.0
  oxlint: ^1.63.0
  tsdown: ^0.22.0

# zotero-types declares two transitive deps as GitHub specs, which
# blockExoticSubdeps refuses. Scope overrides to zotero-types only so we
# don't shadow these names anywhere else in the graph.
overrides:
  "zotero-types>epubjs": 0.3.93
  "zotero-types>pdfjs-dist": workspace:*

# delay one day to reduce the risk of installing compromised packages
minimumReleaseAge: 1440
