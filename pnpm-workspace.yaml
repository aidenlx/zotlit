packages:
  - apps/*
  - packages/*

allowBuilds:
  core-js: false
  electron: false
  es5-ext: false
  esbuild: true
  lefthook: true
  sharp: false

catalog:
  "@logtape/logtape": ^2.0.7
  "@pnpm/find-workspace-dir": ^1000.1.5
  "@std/collections": jsr:1.2.0
  "@std/async": jsr:1.4.0
  "@std/assert": jsr:1.0.19
  "@tailwindcss/vite": ^4.3.0
  "@types/node": ^25.5.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  ajv: ^8.20.0
  arkregex: ^0.0.5
  eta: 4.6.0
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  fflate: ^0.8.2
  monkey-around: 3.0.0
  oxfmt: ^0.55.0
  oxlint: ^1.70.0
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwindcss: ^4.3.0
  tsdown: ^0.22.5
  typescript: ^7.0.2
  valibot: ^1.0.0
  vite: ^8.1.5
  vitest: ^4.0.13

# zotero-types declares two transitive deps as GitHub specs, which
# blockExoticSubdeps refuses. Scope overrides to zotero-types only so we
# don't shadow these names anywhere else in the graph.
overrides:
  "zotero-types>epubjs": 0.3.93
  "zotero-types>pdfjs-dist": workspace:*
  # next@16.2.11 hard-pins its internal postcss to 8.4.31 (GHSA-r28c-9q8g-f849);
  # force the patched version until upstream bumps its own pin.
  "next>postcss": ">=8.5.18"

# delay 3 day to reduce the risk of installing compromised packages
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: true
# next 16.2.11 is a security patch; exempt it from the age gate to land the fix now
minimumReleaseAgeExclude:
  - next
  - "@next/*"
