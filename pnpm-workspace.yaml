packages:
  - apps/*
  - packages/*

allowBuilds:
  core-js: false
  electron: false
  es5-ext: false
  esbuild: true
  lefthook: true

catalog:
  "@inlang/paraglide-js": ^2.15.1
  "@logtape/logtape": ^2.0.7
  "@tailwindcss/vite": ^4.3.0
  "@types/node": ^25.5.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@typescript/native-preview": 7.0.0-dev.20260615.1
  arkregex: ^0.0.5
  eta: 4.6.0
  drizzle-kit: 1.0.0-rc.3
  drizzle-orm: 1.0.0-rc.3
  monkey-around: 3.0.0
  oxfmt: ^0.55.0
  oxlint: ^1.70.0
  react: ^19.2.0
  react-dom: ^19.2.0
  tailwindcss: ^4.3.0
  tsdown: ^0.22.0
  valibot: ^1.0.0
  vite: ^8.0.0
  vitest: ^4.0.13

# zotero-types declares two transitive deps as GitHub specs, which
# blockExoticSubdeps refuses. Scope overrides to zotero-types only so we
# don't shadow these names anywhere else in the graph.
overrides:
  "zotero-types>epubjs": 0.3.93
  "zotero-types>pdfjs-dist": workspace:*

# delay 3 day to reduce the risk of installing compromised packages
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: true
