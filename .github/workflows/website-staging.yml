name: Website Staging

# Continuous staging deploys of the TanStack Start site to the `zotlit-docs`
# worker on workers.dev, so every migration slice is inspectable in a real
# environment. Production deploys stay deliberate; see issue #846.
on:
  push:
    branches: [refactor/tanstack]
    paths:
      - "apps/website/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/website-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time: a queued run would otherwise overwrite a newer build.
concurrency:
  group: website-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # `mise run init` installs deps (frozen lockfile) and builds packages/*.
      # `--no-submodules` skips checkout since actions/checkout already fetched
      # them above.
      - uses: jdx/mise-action@v4
      # pnpm is activated by mise's corepack post-install; this step is only
      # here for the store cache.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: mise run init --no-submodules

      - name: Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: pnpm turbo run build --filter=@zotlit/website

      - name: Deploy
        run: pnpm --filter @zotlit/website exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
