name: Issue triage gate

# GitHub Issues are reserved for defects a maintainer has already confirmed
# (see notes on the community feedback loop). Issues opened directly by
# non-maintainers are redirected to Bug reports on the ZotLit forum.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  gate:
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
    steps:
      - name: Redirect to the ZotLit forum
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$(cat <<EOF
          Hi @$ISSUE_AUTHOR — GitHub Issues here are reserved for defects a maintainer has already confirmed.

          Please report this in [Bug reports](https://zotlit-forum.aidenlx.site/c/bug-reports/7) instead, using the report template. A maintainer will open a GitHub issue if they confirm the bug.

          Feature ideas go in [Feature requests](https://zotlit-forum.aidenlx.site/c/feature-requests/8), and general questions in [Help](https://zotlit-forum.aidenlx.site/c/help/6).

          If this is about **ZotLit v1**: v1 is no longer maintained and no longer accepts bug reports or feature requests. Please [upgrade to v2](https://zotlit.aidenlx.site/docs/how-to/migrate-from-v1) first.
          EOF
          )"
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason "not planned"
