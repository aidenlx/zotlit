min_version = "2024.9.5"

[tools]
node = "26"
"npm:zx" = "8"

[hooks]
postinstall = 'npx corepack enable'

[settings]
experimental = true

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[tasks.init]
description = "Bootstrap a fresh clone: trust mise, init submodules, install deps; pass a primary-worktree path to also copy .env* files; pass --no-submodules to skip submodule checkout"
run = "zx packages/scripts/scripts/init.ts"
