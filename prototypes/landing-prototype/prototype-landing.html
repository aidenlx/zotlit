        .LY-face { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 150ms ease, visibility 0s linear 150ms; }
        .LY-face.LY-on { opacity: 1; visibility: visible; transition: opacity 360ms ease calc(var(--d, 0ms) + 560ms), visibility 0s; }
        .LY-extra { position: absolute; opacity: 0; transition: opacity 150ms ease; pointer-events: none; }
        .LY-extra.LY-on { opacity: 1; transition: opacity 360ms ease var(--xd, 600ms); }
        .LY-prog { transform-origin: left center; animation: LY-prog ${LY_STEP_MS}ms linear forwards; }
        @keyframes LY-prog { from { transform: scaleX(0); } }
        .LY-paused .LY-prog { animation-play-state: paused; }
        .LY-tabs { scrollbar-width: none; }
        .LY-tabs::-webkit-scrollbar { display: none; }
        .LY-dots { background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 18px 18px;
          mask-image: radial-gradient(ellipse at 60% 45%, #000 0%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 60% 45%, #000 0%, transparent 70%); }
        @media (prefers-reduced-motion: reduce) {
          .LY-ready.LY-stage, .LY-ready .LY-rec, .LY-face, .LY-face.LY-on, .LY-extra, .LY-extra.LY-on { transition: none !important; }
          .LY-rec { animation: none; }
          .LY-prog { display: none; }

      `;

      // Small line icons in the Obsidian/lucide manner (only Search and ChevronDown are imported).
      function LY_Icon({ d, size = 14, className = "" }) {

      }
      const LY_I = {

        papers: ["M4 6h16", "M4 10h10", "M4 15h16", "M4 19h10"],
        cards: ["M3 4h8v7H3z", "M13 4h8v7h-8z", "M3 13h8v7H3z", "M13 13h8v7h-8z"],
        annotations: ["M4 4h5v16H4z", "M11 4h4v10h-4z", "M17 4h4v13h-4z"],
        doc: ["M14 3H6v18h12V7z", "M14 3v4h4"],
        lines: ["M5 7h14", "M5 12h14", "M5 17h9"],
        sort: ["M7 4v16", "M4 7l3-3 3 3", "M17 20V4", "M14 17l3 3 3-3"],
        group: ["M4 5h6v6H4z", "M4 15h6v4H4z", "M13 6h7", "M13 10h5", "M13 16h7"],
        filter: ["M4 6h16", "M7 12h10", "M10 18h4"],
        props: ["M8 6h12", "M8 12h12", "M8 18h12", "M4 6h.01", "M4 12h.01", "M4 18h.01"],
        chev: ["M9 6l6 6-6 6"],
        updown: ["M8 9l4-4 4 4", "M8 15l4 4 4-4"],
        folder: ["M3 6h6l2 2h10v11H3z"],
        x: ["M6 6l12 12", "M18 6L6 18"],
        dots: ["M5 12h.01", "M12 12h.01", "M19 12h.01"],
        pause: ["M8 5v14", "M16 5v14"],
        play: ["M7 5l12 7-12 7z"],
      };

      // The question, read as a sentence.
      function LY_Chip({ icon, strong, children }) {
        return (
          <span className={"mx-0.5 inline-flex items-center gap-1.5 rounded-full border px-2.5 py-[1px] align-[0.1em] font-body text-[0.82rem] font-medium leading-6 " + (strong ? "border-accent/40 bg-accent/10 text-accent" : "border-line bg-card text-ink")}>

      function LY_PaperFaces({ p, i, L, cols, narrow }) {
        const on = (k) => "LY-face " + (L === k ? "LY-on" : "");
        const hid = (k) => L !== k;

                  <div key={c} className={"flex h-full min-w-0 items-center px-2.5 " + (k ? "border-l border-line" : "")} style={c === "rating" ? { background: "color-mix(in oklab, var(--LY-v) 7%, transparent)" } : undefined}>
                    {c === "title" && (

                    {c === "year" && <span className="tabular-nums">{p.year}</span>}
                    {c === "pub" && <span className="truncate">{p.pub}</span>}

                    {c === "rating" && <span className="font-medium tabular-nums">{p.rating}</span>}

            </div>

            {/* Cards: the paper's title page */}
            <div className={on("cards")} aria-hidden={hid("cards")}>
              <div className="flex h-full flex-col p-3.5">
                <p className="font-mono text-[10px] uppercase tracking-[0.14em] text-muted">Journal Article</p>
                <p className="mt-1.5 font-display text-[15.5px] font-semibold leading-[1.25] text-ink" style={{ display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{p.title}</p>

            {i === LY_SANDVE && (
              <div className={on("annotations")} aria-hidden={hid("annotations")}>

                  <span className="ml-auto hidden shrink-0 text-[12px] text-muted sm:inline">
                    <span className="font-mono" style={{ color: "var(--LY-v)" }}>{p.key}</span> · 5 annotations
                  </span>
                  <span className="ml-auto shrink-0 font-mono text-[11px] sm:hidden" style={{ color: "var(--LY-v)" }}>{p.key}</span>
                </div>
              </div>

          </>

      }

      function LY_AnnFace({ a, L }) {
        return (
          <div className={"LY-face " + (L === "annotations" ? "LY-on" : "")} aria-hidden={L !== "annotations"}>
            <div className="flex h-full" style={{ background: `color-mix(in oklab, ${a.hex} 9%, var(--card))` }}>
              <span aria-hidden="true" className="w-[3px] shrink-0" style={{ background: a.hex }} />

                <p className="font-display text-[12.5px] leading-[17px] text-ink sm:text-[13.5px] sm:leading-[19px]">{a.text}</p>
                <p className="mt-auto flex justify-between gap-2 pt-1.5 font-mono text-[10.5px] text-muted">
                  <span className="truncate">{a.tag ? "#" + a.tag : ""}</span>
                  <span className="shrink-0">p. {a.page}</span>
                </p>
              </div>
            </div>
          </div>
        );
      }

      // The enacted query window: tab strip, breadcrumb, query toolbar, then the stage.
      function LY_Window({ L, label }) {
        const outer = React.useRef(null);
        const [W, setW] = useState(0);
        const [ready, setReady] = useState(false);
        const prev = React.useRef(L);
        const [from, setFrom] = useState(L);

        React.useLayoutEffect(() => {
          const el = outer.current;
          const ro = new ResizeObserver(() => setW(Math.round(el.clientWidth)));
          ro.observe(el);
          setW(Math.round(el.clientWidth));
          return () => ro.disconnect();
        }, []);
        useEffect(() => {
          if (W > 0 && !ready) {
            const id = requestAnimationFrame(() => requestAnimationFrame(() => setReady(true)));
            return () => cancelAnimationFrame(id);
          }
        }, [W, ready]);
        React.useLayoutEffect(() => {
          if (prev.current !== L) {
            setFrom(prev.current);
            prev.current = L;
          }
        }, [L]);

        const geom = useMemo(() => (W ? LY_geom(L, W) : null), [L, W]);
        const annGroups = useMemo(() => (W ? LY_geom("annotations", W).extras : []), [W]);
        const maxH = useMemo(() => (W ? Math.max(...LY_LAYOUTS.map(([k]) => LY_geom(k, W).H)) : 0), [W]);
        const cols = LY_columns(W || 600);
        const icon = LY_I[L];

        return (
          <div className="overflow-hidden rounded-xl border border-line bg-card shadow-[0_1px_2px_rgba(0,0,0,0.06),0_28px_60px_-34px_rgba(0,0,0,0.45)]">
            {/* Tab strip */}
            <div aria-hidden="true" className="flex h-9 items-end gap-1 border-b border-line bg-tint px-2 text-[12.5px]">
              <span className="hidden h-7 items-center gap-1.5 px-3 text-muted sm:flex">
                <span className="font-display text-[12px] font-bold">Z</span> Zotero library
              </span>
              <span className="-mb-px flex h-7 items-center gap-2 rounded-t-md border border-b-0 border-line bg-card px-3 text-ink">
                <LY_Icon d={LY_I.filter} size={13} className="text-muted" /> Reproducibility
                <LY_Icon d={LY_I.x} size={12} className="ml-3 text-muted" />
              </span>
              <span className="flex h-7 items-center px-2 text-muted">+</span>
            </div>
            {/* Breadcrumb */}
            <div aria-hidden="true" className="flex h-8 items-center justify-between px-3 text-[12.5px] text-muted">
              <span>Thesis <span className="mx-1 opacity-60">/</span> <span className="text-ink">Reproducibility</span></span>
              <LY_Icon d={LY_I.dots} size={16} />
            </div>
            {/* Query toolbar */}
            <div aria-hidden="true" className="flex h-10 items-center gap-3 border-b border-line px-3 text-[12.5px] text-muted">
              <span className="flex items-center gap-1.5 rounded-md border border-line px-2 py-1 text-ink">
                <LY_Icon d={icon} size={13} />
                <span key={L} className="min-w-[4.5rem]">{label}</span>
                <LY_Icon d={LY_I.updown} size={12} className="text-muted" />
              </span>
              <span style={{ color: "var(--LY-v)" }}>4 results</span>
              <span className="ml-auto flex items-center gap-3">
                <span className="flex items-center gap-1" style={{ color: "var(--LY-v)" }}><LY_Icon d={LY_I.sort} size={13} />Sort 1</span>
                <span className="hidden items-center gap-1 md:flex"><LY_Icon d={LY_I.group} size={13} />Group</span>
                <span className="flex items-center gap-1" style={{ color: "var(--LY-v)" }}><LY_Icon d={LY_I.filter} size={13} />Filter 2</span>
                <span className="hidden items-center gap-1 xl:flex"><LY_Icon d={LY_I.props} size={13} />Properties</span>
                <span className="hidden items-center gap-1 sm:flex"><Search size={13} />Search</span>
              </span>
            </div>

            {/* The stage: one set of records, re-arranged */}
            <div ref={outer} style={{ minHeight: maxH || 280 }}>
              {geom && (
                <div className={"LY-stage " + (ready ? "LY-ready" : "")} style={{ height: geom.H }}>
                  {/* Colour headers stay mounted so they fade in after the cards land */}
                  {annGroups.map((x) => (
                      <div key={x.id} className={"LY-extra " + (L === "annotations" ? "LY-on" : "")} style={{ left: x.x, top: x.y, width: x.w, height: x.h, "--xd": 640 + Number(x.id.slice(4)) * 70 + "ms" }} aria-hidden="true">
                        <span className="flex h-full items-center gap-1.5 font-mono text-[10.5px] uppercase tracking-[0.14em] text-muted">
                          <span className="h-2.5 w-2.5 rounded-[3px]" style={{ background: x.ann.hex }} />
                          {x.ann.name}
                        </span>
                      </div>
                  ))}
                  {/* Table header stays mounted so it can fade in and out */}
                  <div className={"LY-extra " + (L === "table" ? "LY-on" : "")} style={{ left: 0, top: 0, width: W, height: 34 }} aria-hidden="true">
                    <div className="grid h-full items-center border-b border-line text-[12.5px] text-muted" style={{ gridTemplateColumns: cols.tpl }}>
                      {cols.cols.map((c, k) => (
                        <div key={c} className={"flex h-full min-w-0 items-center gap-1.5 px-2.5 " + (k ? "border-l border-line" : "")} style={c === "rating" ? { background: "color-mix(in oklab, var(--LY-v) 7%, transparent)", color: "var(--ink)" } : undefined}>

                        {isAnn ? <LY_AnnFace a={LY_ANN[i - LY_PAPERS.length]} L={L} /> : <LY_PaperFaces p={LY_PAPERS[i]} i={i} L={L} cols={cols} narrow={W < 480} />}

      function H_LY() {

        const [visible, setVisible] = useState(true);
        const fig = React.useRef(null);
        const tabs = React.useRef([]);

        useEffect(() => {
          const io = new IntersectionObserver(([e]) => setVisible(e.isIntersecting), { threshold: 0.25 });
          io.observe(fig.current);
          return () => io.disconnect();
        }, []);

        const go = (k, focus) => {
          setIdx(k);
          setTick((t) => t + 1);
          if (focus) tabs.current[k]?.focus();
        };
        const onKey = (e) => {
          const n = LY_LAYOUTS.length;
          if (e.key === "ArrowRight") { e.preventDefault(); go((idx + 1) % n, true); }
          if (e.key === "ArrowLeft") { e.preventDefault(); go((idx - 1 + n) % n, true); }
        };

        useEffect(() => {
          const el = tabs.current[idx];
          const box = el && el.parentElement;
          if (box && box.scrollWidth > box.clientWidth)
            box.scrollTo({ left: el.offsetLeft - (box.clientWidth - el.offsetWidth) / 2, behavior: reduced ? "auto" : "smooth" });
        }, [idx, reduced]);
        const paused = !playing || hold || !visible;
        const [L, label] = LY_LAYOUTS[idx];

        return (
          <section className="LY-root relative overflow-hidden">
            <style>{LY_CSS}</style>
            <div className="relative mx-auto grid max-w-6xl gap-10 px-4 pt-5 pb-14 sm:px-8 lg:grid-cols-[minmax(0,0.78fr)_minmax(0,1.22fr)] lg:items-center lg:gap-12 lg:pt-8">
              <div className="lg:pb-10">
                <p className="font-mono text-[11px] uppercase tracking-[0.16em] text-muted">The Library View · ZotLit Query</p>
                <h1 className="mt-4 font-display text-[clamp(2.5rem,4.4vw,3.6rem)] leading-[1.04] font-semibold tracking-[-0.02em] text-ink text-balance">
                  A <span className="text-accent">research desk</span> for Zotero in Obsidian.
                </h1>
                <p className="mt-5 max-w-[34ch] text-lg leading-relaxed text-muted sm:text-[1.2rem]">
                  Browse your Zotero library in an Obsidian tab, and turn any collection into a live table you can sort, filter and rate.
                </p>
                <div className="mt-7 flex flex-col items-stretch gap-3 sm:flex-row sm:items-center">
                  <C_Button href="#install" filled>{FACTS.install}</C_Button>
                  <C_Button href={C_LEARN}>{FACTS.tutorial}</C_Button>
                </div>
                <p className="mt-3 text-sm text-muted">{FACTS.requirements}</p>
              </div>

              <figure
                ref={fig}
                className={"relative min-w-0 " + (paused ? "LY-paused" : "")}
                onMouseEnter={() => setHold(true)}
                onMouseLeave={() => setHold(false)}
                onFocus={() => setHold(true)}
                onBlur={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setHold(false); }}
              >
                <div aria-hidden="true" className="LY-dots pointer-events-none absolute -inset-x-6 -inset-y-8" />

                {/* The question */}
                <div className="relative">
                  <p className="font-mono text-[11px] uppercase tracking-[0.16em] text-muted">Ask your library</p>
                  <p className="mt-1.5 font-display text-[1.15rem] leading-[2.05] text-ink sm:text-[1.3rem]">

                    <span className="mx-1 text-muted">·</span> sorted by <LY_Chip icon={LY_I.sort}>year, old to new</LY_Chip>

                  </p>

                    {LY_LAYOUTS.map(([k, name], n) => {
                      const sel = n === idx;
                      return (
                        <button
                          key={k}
                          ref={(el) => (tabs.current[n] = el)}
                          role="tab"
                          id={"LY-tab-" + k}
                          aria-selected={sel}
                          aria-controls="LY-panel"
                          tabIndex={sel ? 0 : -1}
                          onClick={() => go(n)}
                          className={"relative flex shrink-0 grow items-center justify-center gap-1.5 overflow-hidden whitespace-nowrap rounded-full px-3.5 py-1.5 text-[15px] transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent " + (sel ? "bg-tint font-semibold text-ink" : "text-muted hover:text-ink")}
                        >
                          <LY_Icon d={LY_I[k]} size={14} className={sel ? "text-accent" : ""} />
                          {name}
                          {sel && !reduced && (
                            <span
                              key={tick + "-" + idx}
                              aria-hidden="true"
                              className="LY-prog absolute inset-x-3 bottom-0.5 h-[2px] rounded-full bg-accent"
                              onAnimationEnd={() => playing && go((idx + 1) % LY_LAYOUTS.length)}

                  {!reduced && (

                      type="button"
                      onClick={() => { setPlaying((p) => !p); setTick((t) => t + 1); }}
                      aria-label={playing ? "Pause the layout tour" : "Play the layout tour"}
                      className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-line bg-card text-muted hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
                    >
                      <LY_Icon d={playing ? LY_I.pause : LY_I.play} size={14} />
                    </button>
                  )}
                </div>

                <div id="LY-panel" role="tabpanel" aria-labelledby={"LY-tab-" + L} className="relative mt-4">
                  <LY_Window L={L} label={label} />
                </div>
                <figcaption className="relative mt-2.5 font-mono text-[11px] leading-relaxed text-muted">
                  Thesis/Reproducibility.zotquery · reads Zotero each time it opens, so new papers appear by themselves.
                </figcaption>
              </figure>
            </div>
          </section>
        );
      }
      // --- Hero LY END ---

      // ---- round 5: DK ----
      // DK — "The research desk, now with your library on it".
      // The desk is a collage of the library and its queries, each built in HTML/CSS with
      // the lesson vault's real data and labelled with tape: the Library View sheet (tree,
      // filters, tags, Recent with reasons), the Reading Card of Sandve 2013 set like a title
      // page, the Reproducibility.zotquery table with its rating column being filled in, the
      // same query as a fan of cards, and a chapter note that embeds the query.
      // Desktop (min 1400px): the objects lie around the headline, drop onto the desk in
      // order (library, card, table, note) and drift a few px with the pointer.
      // Below that: the library sheet and the table card in a short fanned stack.

      const DK_CSS = `
        .DK_root {
          --dk-shadow: 0 1px 1px rgba(60,45,20,.07), 0 6px 14px -6px rgba(60,45,20,.20), 0 22px 40px -20px rgba(60,45,20,.30);

      function H_DK() {
        const ref = React.useRef(null);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const fine = matchMedia("(hover: hover) and (pointer: fine)");
          const still = matchMedia("(prefers-reduced-motion: reduce)");
          let raf = 0, x = 0, y = 0;
          const apply = () => {
            raf = 0;
            el.style.setProperty("--dk-x", x.toFixed(3));
            el.style.setProperty("--dk-y", y.toFixed(3));
          };
          const queue = () => { if (!raf) raf = requestAnimationFrame(apply); };
          const move = (e) => {
            if (!fine.matches || still.matches) return;
            const r = el.getBoundingClientRect();
            x = ((e.clientX - r.left) / r.width - 0.5) * 2;
            y = ((e.clientY - r.top) / r.height - 0.5) * 2;
            queue();
          };
          const leave = () => { x = 0; y = 0; queue(); };
          el.addEventListener("pointermove", move);
          el.addEventListener("pointerleave", leave);
          return () => {
            el.removeEventListener("pointermove", move);
            el.removeEventListener("pointerleave", leave);
            cancelAnimationFrame(raf);
          };
        }, []);

        return (
          <section ref={ref} className="DK_root relative overflow-hidden min-[1400px]:h-[calc(100svh-68px)] min-[1400px]:min-h-[720px] min-[1400px]:max-h-[900px]">

      // ---- round 5 verdict: merged desk ----
      // MX — "The research desk: your library, its live table, and the work around them".

      // order (library, table, PDF, note card, draft, references) and drift with the pointer.

      const MX_CSS = `

            --mx-lift: 0 2px 4px rgba(0,0,0,.4), 0 36px 60px -20px rgba(0,0,0,.75);
            --mx-mark: rgba(255,212,0,.34);
            --mx-hy: rgba(255,212,0,.30);
            --mx-hg: rgba(95,178,54,.38);

        @media (min-width: 1280px) and (max-width: 1359.98px) { .MX_root { --mx-s: .88; } }
        @media (min-width: 1360px) and (max-width: 1439.98px) { .MX_root { --mx-s: .94; } }
        @media (min-width: 1800px) { .MX_root { --mx-s: 1.08; } }
        .MX_stage {

        .MX_drop {
          transform: rotate(var(--mx-r, 0deg));
          animation: MX_drop 780ms cubic-bezier(.18,.82,.24,1) var(--mx-d, 0ms) both;

        }
        @keyframes MX_lift { from { box-shadow: var(--mx-lift); } to { box-shadow: var(--mx-shadow); } }
        .MX_mark {
          background-image: linear-gradient(transparent 56%, var(--mx-mark) 56%, var(--mx-mark) 92%, transparent 92%);
          background-repeat: no-repeat;
          background-size: 100% 100%;

        .MX_fill { animation: MX_fill 300ms ease-out var(--mx-f, 0ms) both; }

      // The four Reproducibility papers, sorted by year, old to new.
      const MX_PAPERS = [
        { title: "Why Most Published Research Findings Are False", key: "ioannidis2005", year: 2005, pub: "PLoS Medicine", rating: 5 },

        { title: "Best Practices for Scientific Computing", key: "wilson2014", year: 2014, pub: "PLOS Biology", rating: 3 },

      const MX_HL = { yellow: "#ffd400", red: "#ff6666", green: "#5fb236" };

      // Small line icons in the app's style (stroke follows the text colour).
      function MX_Icon({ d, size = 12, className = "" }) {
        return (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={"shrink-0 " + className}>

      }
      const MX_I = {

        books: ["M4 4v16", "M8 4v16", "M12 4l4 16", "M18 4l2 16"],
        table: ["M3 3h18v18H3z", "M3 9h18", "M3 15h18", "M9 3v18"],
        sort: ["M3 16l4 4 4-4", "M7 20V4", "M21 8l-4-4-4 4", "M17 4v16"],
        filter: ["M22 3H2l8 9.5V19l4 2v-8.5z"],

        props: ["M8 6h13", "M8 12h13", "M8 18h13", "M3 6h.01", "M3 12h.01", "M3 18h.01"],

      // Greeked text: a run of the paper's other lines, shown as bars.
      function MX_Bars({ rows }) {

          <span key={i} className="my-[9px] block h-[5px] rounded-full bg-ink/10" style={{ width: w }} />
        ));
      }

      // Washi-tape label that names what the object lets you do.
      function MX_Tape({ children, style }) {
        return (
          <span
            className="MX_tape absolute -top-3 left-5 z-10 whitespace-nowrap px-3 py-[5px] font-mono text-[10.5px] font-medium uppercase leading-none tracking-[0.12em] text-ink/80"
            style={{ background: "var(--mx-tape)", transform: "rotate(-2.5deg)", ...style }}
          >
            {children}
          </span>
        );
      }

      // One object on the desk: the outer layer takes position and pointer parallax,
      // the inner one takes the object's angle and its drop onto the desk.
      function MX_Piece({ x, y, bottom, w, r, d, z = 1, label, tape, children }) {
        return (
          <div className="MX_layer absolute" style={{ left: `calc(50% + ${x}px)`, top: y, bottom, width: w, "--mx-z": z }}>
            <div className="MX_drop relative" style={{ "--mx-r": r + "deg", "--mx-d": d + "ms" }}>

      // The top strip of an Obsidian tab: one open tab with its title.
      function MX_TabStrip({ icon, children }) {

      function MX_Chip({ children, className = "" }) {

          <span className={"inline-block whitespace-nowrap rounded-[5px] border border-line px-1.5 py-[2px] text-[10.5px] leading-[1.3] text-ink/80 " + className}>

      // (1) The Library View: the tree with Recent first, then the papers you last touched.
      function MX_Library({ compact = false }) {
        const recent = [
          { title: "Ten Simple Rules for Reproducible Computational Research", meta: "Sandve, Nekrutenko, Taylor et al. · 2013", why: "read 2 h ago in Obsidian", sel: true },
          { title: "Why Most Published Research Findings Are False", meta: "Ioannidis · 2005", why: "cited yesterday in Obsidian" },
          { title: "A manifesto for reproducible science", meta: "Munafò, Nosek, Bishop et al. · 2017", why: "notes edited in Zotero yesterday" },
          { title: "Ten Simple Rules for Better Figures", meta: "Rougier, Droettboom, Bourne · 2014", why: "added to Zotero yesterday" },

        const row = "flex items-center gap-1.5 rounded-[4px] px-1.5 py-[4px] text-[11.5px] leading-tight text-ink";
        return (
          <div className="MX_paper overflow-hidden rounded-md border border-line bg-card text-left">
            <MX_TabStrip icon={MX_I.books}>Zotero library</MX_TabStrip>
            <div className={"grid " + (compact ? "grid-cols-[160px_minmax(0,1fr)]" : "grid-cols-[164px_minmax(0,1fr)]")}>
              {/* The tree, filters and tags. */}
              <div className="border-r border-line px-1.5 pt-2 pb-3">
                <div className={row} style={{ background: "var(--mx-sel)" }}>
                  <MX_Icon d={MX_I.clock} size={11} />Recent
                </div>
                <p className="mt-2 px-1.5 text-[10.5px] font-semibold text-muted">Libraries</p>
                <div className={row}>
                  <ChevronDown size={10} className="-ml-0.5 shrink-0 text-muted" />
                  <MX_Icon d={MX_I.books} size={11} className="text-muted" />

                  <span className="text-[10.5px] text-muted">5</span>
                </div>
                <div className={row + (compact ? " pl-4" : " pl-5")}>
                  <MX_Icon d={MX_I.folder} size={11} className="text-muted" />

                  <span className="text-[10.5px] text-muted">1</span>

                <div className={row + (compact ? " pl-4" : " pl-5")}>

                    </li>
                  ))}
                </ul>
              </div>
            </div>
          </div>
        );
      }

      // (2) The query file as a table: the rating column is yours, filled in as you read.
      function MX_Table({ compact = false }) {
        const cols = compact ? "minmax(0,1fr) 48px 84px" : "minmax(0,1fr) 50px 104px 96px";
        const cell = compact ? "truncate px-2 py-[6px]" : "truncate px-2 py-[10px]";

            <div className="flex items-center justify-between gap-3 whitespace-nowrap px-2.5 pt-2 pb-1.5 text-[10.5px] text-muted">

      function MX_Note() {

      // FLIP over every [data-flip] element in the stage. `snap` records where things are
      // (with any running animation included); after React commits, `play` cancels running
      // animations, measures the new places, and animates each element from old to new.
      // [data-from] lets a new element fly in from another element's old place (a token
      // of the two-line row flying into its table cell). A keyed element inside a keyed
      // element animates relative to it, so a cell is not moved twice with its row.
      function SQS_useFlip(ref) {
        const prev = React.useRef(null);
        const snap = () => {
          const root = ref.current;
          if (!root) return;
          const m = new Map();
          root.querySelectorAll("[data-flip]").forEach((el) => m.set(el.dataset.flip, el.getBoundingClientRect()));
          prev.current = m;
        };
        const play = () => {
          const root = ref.current;
          const m = prev.current;
          prev.current = null;
          if (!root || !m) return;
          const els = [...root.querySelectorAll("[data-flip]")];
          els.forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
          const delta = new Map();
          els.forEach((el) => {
            const own = m.get(el.dataset.flip);
            const from = own || (el.dataset.from && m.get(el.dataset.from));
            if (!from) return;
            const to = el.getBoundingClientRect();
            delta.set(el, { dx: from.left - to.left, dy: from.top - to.top, flown: !own });
          });
          els.forEach((el) => {
            const d = delta.get(el);
            const delay = +(el.dataset.delay || 0);
            if (!d) {
              const kind = el.dataset.enter;
              if (!kind) return;
              const start = kind === "x" ? "translateX(-14px)" : kind === "y" ? "translateY(8px)" : "none";
              el.animate([{ opacity: 0, transform: start }, { opacity: 1, transform: "none" }], { duration: 520, delay, easing: SQS_EASE, fill: "backwards" });
              return;
            }
            let { dx, dy } = d;
            const host = el.parentElement && el.parentElement.closest("[data-flip]");
            const hd = host && root.contains(host) && delta.get(host);
            if (hd) {
              dx -= hd.dx;
              dy -= hd.dy;
            }
            if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
            const t = `translate(${dx}px, ${dy}px)`;
            el.animate(d.flown ? [{ transform: t, opacity: 0.35 }, { transform: "none", opacity: 1 }] : [{ transform: t }, { transform: "none" }], { duration: d.flown ? 760 : 700, delay, easing: SQS_EASE, fill: "backwards" });
          });
        };
        return { snap, play };
      }

                  {pressed && step < 3 && (
                    <span className="SQS_pop absolute top-full right-0 z-10 mt-1.5 whitespace-nowrap rounded-[5px] bg-ink px-2 py-1 text-[11.5px] text-ground shadow-md">
                      Save as query file…
                    </span>
                  )}
                </span>
              </div>
            </div>
          </div>
        );
      }

      function SQS_Tool({ icon, label, count, active, wide, flip }) {
        return (
          <span data-flip={flip} className={"inline-flex h-[25px] items-center gap-1 rounded-[5px] px-1.5 " + (active ? "border border-line bg-tint text-ink" : "border border-transparent")}
            style={count ? { color: SQS_P } : undefined}>
            <SQS_I n={icon} s={13} />
            <span className={wide ? "" : "hidden"}>{label}</span>
            {count ? <span key={count} className="SQS_type text-[11px] opacity-70">{count}</span> : null}
          </span>
        );
      }

      function SQS_QueryBar({ step, wide }) {
        const table = step >= 5;
        return (
          <div className="flex h-10 items-center gap-2 border-b border-line px-3 text-[12.5px] text-muted">
            <span data-flip="qb-view" data-enter="y" className="inline-flex items-center gap-1.5 text-ink">
              <SQS_I key={table ? "t" : "p"} n={table ? "table" : "lib"} s={14} className="SQS_type" />
              <span className="font-medium">Papers</span>
              <SQS_I n="updown" s={12} className="text-muted" />
            </span>
            <span data-flip="qb-count" data-enter="y" data-delay="60" style={{ color: SQS_P }}>4 results</span>
            <span className="flex-1" />
            <span data-flip="qb-tools" data-enter="y" data-delay="120" className="flex items-center gap-0.5">
              <SQS_Tool icon="sort" label="Sort" count={step >= 11 ? "1" : null} active={step === 10} wide={wide} />
              <SQS_Tool icon="group" label="Group" wide={wide} />
              <SQS_Tool icon="filter" label="Filter" count="2" wide={wide} />
              <SQS_Tool icon="props" label="Properties" active={(step >= 5 && step <= 9) || step === 12} wide={wide} />
              <SQS_Tool icon="search" label="Search" wide={wide} />
            </span>
          </div>
        );
      }

      // ---- The Save as query file dialog (as in the capture) ----
      function SQS_Dialog({ step }) {
        const saving = step >= 3;
        return (
          <div className="absolute inset-0 z-20 flex items-start justify-center pt-7" style={{ background: "rgb(0 0 0 / 0.16)" }}>
            <div className="SQS_pop w-[min(25rem,calc(100%-1.5rem))] rounded-[10px] border border-line bg-card text-[12.5px] shadow-[0_18px_44px_-14px_rgb(0_0_0/0.45)]">
              <div className="flex items-center justify-between px-4 pt-3.5">
                <p className="text-[14px] font-semibold text-ink">Save as query file</p>
                <SQS_I n="x" s={13} className="text-muted" />
              </div>
              <div className="grid gap-2 px-4 pt-2.5">
                <label className="grid gap-1 text-ink">
                  Name
                  <span className="flex h-[27px] items-center rounded-[5px] border border-line bg-ground px-2">Reproducibility</span>
                </label>
                <label className="grid gap-1 text-ink">
                  Folder
                  <span className="flex h-[27px] items-center rounded-[5px] border px-2" style={{ borderColor: SQS_P }}>Thesis</span>
                </label>
                <p className="text-muted">
                  Creates <span className="font-mono text-[12px] text-ink">Thesis/Reproducibility.zotquery</span>
                </p>
              </div>
              <div className="mt-3 flex justify-end gap-2 border-t border-line px-4 py-2.5">
                <span key={saving ? "s" : "w"} className={"rounded-[5px] px-3 py-1 font-medium " + (saving ? "SQS_press" : "")} style={{ background: SQS_P, color: "#fff" }}>Save</span>
                <span className="rounded-[5px] bg-tint px-3 py-1 text-ink">Cancel</span>
              </div>
            </div>
          </div>
        );
      }

      // ---- Rows: the two-line Papers row that becomes a Table row ----
      const SQS_COLS = [
        { k: "note", label: "Literature note", icon: "file", fr: "1.12fr", at: 6 },
        { k: "year", label: "Year", icon: "hash", fr: "0.6fr", at: 7 },
        { k: "pub", label: "Publication", icon: "text", fr: "1.7fr", at: 8 },
        { k: "creators", label: "Creators", icon: "props", fr: "1.75fr", at: 9 },
        { k: "rating", label: "rating (note)", icon: "text", fr: "1.05fr", at: 12 },
      ];
      const SQS_NARROW = { year: "3.5rem", rating: "6rem" };

      // Every column track is reserved from the first Table frame, so the grid never
      // changes and no column moves sideways; each column fills in place at its beat,
      // left to right. Narrow screens keep Title, Year and rating.
      function SQS_cols(step, wide) {
        if (step < 5) return [];
        return wide ? SQS_COLS : SQS_COLS.filter((c) => SQS_NARROW[c.k]);
      }
      function SQS_template(step, wide) {
        const cols = SQS_cols(step, wide);
        // minmax(0, …) on every track: the header and each row must share one grid,
        // whatever the cells' text would ask for.
        return [wide ? "minmax(0,3fr)" : "minmax(0,1fr)", ...cols.map((c) => (wide ? `minmax(0,${c.fr})` : SQS_NARROW[c.k]))].join(" ");
      }

      function SQS_Cell({ col, p, i, step, wide }) {
        const shown = step >= col.at;
        const base = "flex min-w-0 items-center border-l transition-colors duration-500 " + (shown ? "border-line " : "border-transparent ") + (wide ? "px-2.5" : "px-2") + (!wide && col.k === "year" ? " overflow-hidden" : "");
        if (!shown) return <div className={base} />;
        if (col.k === "note")
          return (
            <div className={base}>
              {p.note ? (
                <span data-flip={"n-" + p.id} data-enter="y" data-delay={i * 60} className="block truncate underline decoration-1 underline-offset-2" style={{ color: SQS_P }}>{p.id}</span>
              ) : (
                <span data-flip={"n-" + p.id} data-enter="y" data-delay={i * 60} className="inline-flex items-center gap-1 rounded px-1 text-muted">
                  <SQS_I n="filePlus" s={12} />Create
                </span>
              )}
            </div>
          );
        if (col.k === "year")
          return (
            <div className={base}>
              <span data-flip={"y-" + p.id} data-enter="y" data-delay={i * 60} className="SQS_num block font-display text-[14px] text-ink">{p.year}</span>
            </div>
          );
        if (col.k === "pub")
          return (
            <div className={base}>
              <span data-flip={"p-" + p.id} data-enter="y" data-delay={i * 60} className="block truncate text-ink">{p.pub}</span>
            </div>
          );
        if (col.k === "creators")
          return (
            <div className={base}>
              <span data-flip={"c-" + p.id} data-enter="y" data-delay={i * 60} className="block truncate text-ink">{p.creators}</span>
            </div>
          );
        // rating (note): a property of the paper's literature note, typed one row at a time
        // with Obsidian's cell focus. A paper with no note shows "No note", as ZotLit does.
        if (!p.note)
          return (
            <div className={base}>
              <span data-flip={"r-" + p.id} data-enter="y" data-delay={i * 60} className="block truncate text-muted/60">No note</span>
            </div>
          );
        const typed = step >= 13 + i;
        const focused = step >= 13 && step < SQS_FINAL && step === 13 + i;
        return (
          <div className={base + " relative"}>
            {focused && <span data-flip="focus" className="absolute inset-0 rounded-[3px] border-[1.5px]" style={{ borderColor: SQS_P }} />}
            {typed && <span key="v" className={"SQS_num relative font-display text-[15px] font-semibold text-ink " + (focused ? "SQS_type" : "")}>{p.rating}</span>}
            {focused && <span className="SQS_caret relative ml-px inline-block h-[1.05em] w-px" style={{ background: SQS_P }} />}
          </div>
        );
      }

      function SQS_Row({ p, i, step, wide }) {
        const table = step >= 5;
        const cols = SQS_cols(step, wide);
        // The second line keeps whatever has not yet moved into a column.
        const meta = [
          !table && ["mc-", p.short],
          !table && ["my-", p.year],
          !table && ["mp-", p.pub],
        ].filter(Boolean);
        const lines2 = meta.length > 0;
        return (
          <div data-flip={"row-" + p.id} className="grid border-b border-line" style={{ gridTemplateColumns: SQS_template(step, wide), minHeight: lines2 ? 49 : 35 }}>
            <div className={"flex min-w-0 items-center gap-1.5 py-1.5 pr-2.5 pl-2" + (wide ? "" : " overflow-hidden")}>
              <span className="w-3 shrink-0 text-muted">{p.kids ? <SQS_I n="right" s={12} /> : null}</span>
              {!table && <SQS_I n="article" s={14} className="text-muted" />}
              <div className="min-w-0 flex-1 leading-snug">
                <span data-flip={"t-" + p.id} className={"block truncate text-ink " + (table ? "" : "font-medium")}>{p.title}</span>
                {lines2 && (
                  <span className="flex min-w-0 items-baseline gap-1 overflow-hidden whitespace-nowrap text-[11.5px] text-muted">
                    {meta.map(([k, v], j) => (
                      <React.Fragment key={k}>
                        {j > 0 && <span aria-hidden="true">·</span>}
                        <span data-flip={k + p.id} className={"inline-block " + (k === "my-" ? "SQS_num" : "truncate")}>{v}</span>
                      </React.Fragment>
                    ))}
                  </span>
                )}
              </div>
              {!table && (
                <span className="flex shrink-0 items-center gap-1 text-muted">
                  {p.note && <SQS_I n="note" s={13} />}
                  {p.pdf && <SQS_I n="file" s={13} />}
                </span>
              )}
            </div>
            {cols.map((c) => <SQS_Cell key={c.k} col={c} p={p} i={i} step={step} wide={wide} />)}
          </div>
        );
      }

      function SQS_HeadRow({ step, wide }) {
        const cols = SQS_cols(step, wide);
        return (
          <div className="grid border-b border-line text-[12px] text-muted" style={{ gridTemplateColumns: SQS_template(step, wide) }}>
            <span data-flip="h-title" data-enter="y" className="flex h-[30px] items-center gap-1.5 pl-[26px]">
              <SQS_I n="text" s={12} />Title
            </span>
            {cols.map((c) =>
              wide ? (
                <span key={c.k} className={"flex h-[30px] min-w-0 items-center border-l px-2.5 transition-colors duration-500 " + (step >= c.at ? "border-line" : "border-transparent")}>
                  {step >= c.at && (
                    <span data-flip={"h-" + c.k} data-enter="y" className="flex min-w-0 items-center gap-1.5">
                      <SQS_I n={c.icon} s={12} />
                      <span className="truncate">{c.label}</span>
                    </span>
                  )}
                </span>
              ) : (
                <span key={c.k} className={"flex h-[30px] min-w-0 items-center overflow-hidden border-l px-2 transition-colors duration-500 " + (step >= c.at ? "border-line" : "border-transparent")}>
                  {step >= c.at && <span data-flip={"h-" + c.k} data-enter="y" className="truncate">{c.label}</span>}
                </span>
              ),
            )}
          </div>
        );
      }

      // ---- The window ----
      function SQS_Window({ step, wide, stageRef, fading }) {
        const query = step >= 4;
        const table = step >= 5;
        const rows = step >= 11 ? SQS_SORTED : SQS_PAPERS;
        return (
          <div className="overflow-hidden rounded-[11px] border border-line bg-card text-[13px] shadow-[0_30px_70px_-34px_rgb(0_0_0/0.45),0_2px_6px_-2px_rgb(0_0_0/0.08)]">
            {/* Tab strip */}
            <div className="flex h-[34px] items-end gap-1 border-b border-line bg-tint pr-3 pl-3">
              <span aria-hidden="true" className="mr-2 mb-[12px] flex gap-[6px]">
                {[0, 1, 2].map((d) => <span key={d} className="size-[9px] rounded-full bg-line" />)}
              </span>
              <span className={"flex h-[28px] w-[9.5rem] items-center gap-1.5 rounded-t-[7px] px-2.5 text-[12.5px] sm:w-[11rem] " + (query ? "text-muted" : "border border-b-0 border-line bg-card text-ink")}>
                <span className="font-display text-[12px] font-bold">Z</span>
                <span className="flex-1 truncate">Zotero library</span>
                {!query && <SQS_I n="x" s={11} className="text-muted" />}
              </span>
              {query && (
                <span key="qtab" className="SQS_pop flex h-[28px] w-[9.5rem] items-center gap-1.5 rounded-t-[7px] border border-b-0 border-line bg-card px-2.5 text-[12.5px] text-ink sm:w-[11rem]">
                  <SQS_I n="filter" s={12} className="text-muted" />
                  <span className="flex-1 truncate">Reproducibility</span>
                  <SQS_I n="x" s={11} className="text-muted" />
                </span>
              )}
              <span className="mb-[7px] ml-1 text-muted">+</span>
            </div>
            {/* Navigation bar */}
            <div className="flex h-[34px] items-center gap-2.5 px-3.5 text-[12.5px] text-muted">
              <SQS_I n="arrowL" s={13} />
              <SQS_I n="arrowR" s={13} className="opacity-50" />
              {query ? (
                <span key="crumb" className="SQS_pop truncate text-ink/85">Thesis <span className="text-muted">/</span> Reproducibility</span>
              ) : (
                <span className="text-ink/85">Zotero library</span>
              )}
              <span className="flex-1" />
              <SQS_I n="dots" s={15} />
            </div>
            {/* The view */}
            <div ref={stageRef} data-sqs-step={step} className={"SQS_stage relative flex border-t border-line " + (fading ? "opacity-0" : "opacity-100")} style={{ height: wide ? 318 : 312 }}>
              {wide && <SQS_Tree open={!query} />}
              <div className="relative min-w-0 flex-1">
                {query ? <SQS_QueryBar step={step} wide={wide} /> : <SQS_LibHead step={step} />}
                {table && <SQS_HeadRow step={step} wide={wide} />}
                <div>
                  {rows.map((p, i) => <SQS_Row key={p.id} p={p} i={i} step={step} wide={wide} />)}
                </div>
              </div>
              {(step === 2 || step === 3) && <SQS_Dialog step={step} />}
            </div>
          </div>
        );
      }

      // ---- The caption trail ----
      function SQS_Trail({ step, cycle, still, playing }) {
        const beat = SQS_beatOf(step);
        const bar = (i) => {
          if (still || i < beat) return { width: "100%" };
          if (i > beat || !playing) return { width: "0%" };
          return { animation: `SQS_fill ${SQS_BEAT_AT[i + 1] - SQS_BEAT_AT[i]}ms linear both` };
        };
        return (
          <div aria-hidden="true" className="mt-4">
            <ol className="grid grid-cols-5 gap-2 sm:gap-5">
              {SQS_BEATS.map((b, i) => (
                <li key={b} className={"transition-colors duration-500 " + (i === beat ? "text-ink" : i < beat ? "text-muted" : "text-muted/45")}>
                  <span className="relative block h-px bg-line">
                    <span key={cycle + "-" + i} className="absolute inset-y-[-0.5px] left-0 bg-accent" style={bar(i)} />
                  </span>
                  <span className="mt-2 hidden items-baseline gap-2 md:flex">
                    <span className="SQS_num font-mono text-[11px] tracking-wider text-accent">{"0" + (i + 1)}</span>
                    <span className="font-display text-[15px] italic">{b}</span>
                  </span>
                </li>
              ))}
            </ol>
            <p className="mt-2 flex items-baseline gap-2 md:hidden">
              <span className="SQS_num font-mono text-[11px] tracking-wider text-accent">{"0" + (beat + 1)} / 05</span>
              <span key={beat} className="SQS_pop font-display text-[15px] italic text-ink">{SQS_BEATS[beat]}</span>
            </p>
          </div>
        );
      }

      function SQS_Stage() {
        const still = SQS_useMedia("(prefers-reduced-motion: reduce)");
        const wide = SQS_useMedia("(min-width: 768px)");
        const [step, setStep] = useState(() => (window.matchMedia("(prefers-reduced-motion: reduce)").matches ? SQS_FINAL : 0));
        const [cycle, setCycle] = useState(0);
        const [fading, setFading] = useState(false);
        // The demo plays while at least half of it is on screen, and starts again from
        // the collection once it has left the screen.
        const [active, setActive] = useState(false);
        const seen = React.useRef(false);
        const figRef = React.useRef(null);
        const stageRef = React.useRef(null);
        const flip = SQS_useFlip(stageRef);

        useEffect(() => {
          const el = figRef.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => {
              if (e.intersectionRatio >= 0.5) {
                seen.current = true;
                setActive(true);
              } else if (!e.isIntersecting && seen.current) {
                seen.current = false;
                setActive(false);
                setStep(0);
                setFading(false);
                setCycle((c) => c + 1);
              }
            },
            { threshold: [0, 0.5] },
          );
          io.observe(el);
          return () => io.disconnect();
        }, []);

        React.useLayoutEffect(() => {
          flip.play();
        }, [step]);

        useEffect(() => {
          if (still) {
            setStep(SQS_FINAL);
            return;
          }
          if (!active) return;
          const ids = SQS_TL.map(([t, s]) =>
            setTimeout(() => {
              flip.snap();
              setStep(s);
            }, t),
          );
          ids.push(setTimeout(() => setFading(true), SQS_END - 650));
          ids.push(
            setTimeout(() => {
              setStep(0);
              setFading(false);
              setCycle((c) => c + 1);
            }, SQS_END),
          );
          return () => ids.forEach(clearTimeout);
        }, [cycle, still, active]);

        return (
          <figure ref={figRef} className="relative">
            <div aria-hidden="true">
              <SQS_Window step={step} wide={wide} stageRef={stageRef} fading={fading} />
            </div>
            <figcaption className="sr-only">
              In the Zotero library tab in Obsidian, the Reproducibility collection is saved as the query file
              Thesis/Reproducibility.zotquery. It opens as a table with columns for literature note, year,
              publication and creators from Zotero, sorted by year from 2005 to 2017, and a rating column from
              the literature notes: 5 for Ioannidis and 5 for Sandve. Wilson and Munafò have no literature note
              yet, so their rating reads "No note" and their note column offers Create.
            </figcaption>
            <SQS_Trail step={step} cycle={cycle} still={still} playing={active} />
          </figure>
        );
      }

      function SQ_Section() {
        return (
          <section aria-labelledby="SQS-title" className="border-t border-line py-20 sm:py-28">
            <style>{SQS_CSS}</style>
            <div className="mx-auto max-w-6xl px-4 sm:px-8">
              <div className="max-w-2xl">
                <p className="font-mono text-sm uppercase tracking-wider text-muted">Before you write</p>
                <h2 id="SQS-title" className="mt-3 font-display text-3xl font-semibold text-balance sm:text-5xl">
                  Compare your papers side by side.
                </h2>
                <p className="mt-4 text-lg text-muted text-pretty">

                </p>
                <div className="mt-4">
                  <C_TextLink href={`${C_LEARN}/literature-review-table-from-zotero`}>Learn in the tutorial</C_TextLink>
                </div>
              </div>
              <div className="mt-10 sm:mt-12">
                <SQS_Stage />
              </div>
              <ul className="mt-8 grid gap-x-10 gap-y-4 text-base sm:grid-cols-3">
                <li className="border-t border-line pt-4">
                  <strong className="font-semibold text-ink">What Zotero knows.</strong>{" "}
                  <span className="text-muted">Year, journal and authors, up to date each time you open the table.</span>
                </li>
                <li className="border-t border-line pt-4">
                  <strong className="font-semibold text-ink">What you decided.</strong>{" "}
                  <span className="text-muted">Your rating, or anything else you keep in a literature note.</span>
                </li>
                <li className="border-t border-line pt-4">
                  <strong className="font-semibold text-ink">What you have not read yet.</strong>{" "}
                  <span className="text-muted">Papers without a note keep their row. Write the note when you get to them.</span>
                </li>
              </ul>
            </div>
          </section>
        );
      }
      // --- Section SQ END ---

      // --- Hero variants END ---

        return (
          <div className="min-h-full overflow-x-clip bg-ground font-body text-ink">
            {/* Header */}
            <header className="mx-auto flex max-w-6xl items-center justify-between px-4 py-5 sm:px-8">
