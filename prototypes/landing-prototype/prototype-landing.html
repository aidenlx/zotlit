    <!--
      ROUND 1 VERDICT (2026-11-12): C "Zotero to chapter" won. Owner: "C is great except
      the initial 'joint' graph": the boxed Zotero → ZotLit → Obsidian strip is out.
      ROUND 2: five graphs under C's hero. Owner: think about the whole first screen, not
      the graph; keep the specific "research desk" copy over "joins them"; every recording
      gets redone per case, so use placeholders.
      ROUND 3: five plain first screens (desk index, three moments, outcome sheet, pick
      your task, audience first). Owner: "too plain, could u be more creative and attractive?"
      ROUND 4: five editorial first screens. Owner kept 2 (draft that cites itself),
      3 (desk collage) and 5 (paper to chapter); dropped 1 (highlighter), 4 (journal cover).
      Owner also: lead with the Library View and ZotLit Query, "that's the one stand out";
      never claim highlights save back to Zotero ("not worthy").
      ROUND 5: the kept three beside four library/query heroes (live library, collection
      to table, one query many layouts, library desk). Brief: brief-round5.md.
      ROUND 5 VERDICT: "7 and 2 combined, drop the 'every highlight in one list' in 2 and
      keep 'browse your lib' and 'a live table' in 7. 5 should be kept as demo in detail
      section." Later: the demo shows Zotero fields beside a note property, with two papers
      that have no note ("No note", Create); its copy is workflow-based ("Compare your papers
      side by side."), and "And when your reading grows." is gone as a duplicate of it.
      Then: the table demo moves after the workflow (its animation takes a while).
      Hero = H_MX (library sheet + live table from 7, PDF, note card, draft,
      references from 2); collection-to-table demo = SQ_Section in the body.
      PROTOTYPE — throwaway. Question: which landing layout tells a first-time
      academic what ZotLit does at first sight, laid out the obsidian.md way
      (one-line claim, a real product view, then one section per capability with
      a real screen), replacing the "research desk" figure?
      Design plan (editorial, but borrowed from the live docs "Journal" system):
        tokens  ground #f7f5f0 · card #ffffff · ink #1b2029 · muted #5f6672
                line #e3dfd6 · accent #b9461a (dark: #121418/#1b1e24/#e9e6df/#9b978f/#2d3037/#f0793f)
        type    Gelasio (display, headlines) · Inter (body, UI) · IBM Plex Mono (labels)

      Run: open this file, or `python3 -m http.server -d apps/docs/.scratch/landing-proto 4840`.
    -->

    <script type="importmap">
      {
        "imports": {

  <body>
    <div id="root"></div>

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, { useState, useEffect, useMemo } from "react";
      import { createRoot } from "react-dom/client";
      import { Search, ChevronDown } from "lucide-react"; // any lucide icon; <Search size={16} className="text-muted" />

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return { svg: null, error: `no <script type="text/mermaid" id="${src}"> in this page` };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = { bg: "var(--ground)", fg: "var(--ink)", transparent: true };
            return {
              svg: mod.renderMermaidSVG(decodeEntities(dedent(el.textContent)), opts),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error) return <pre className="text-accent text-sm whitespace-pre-wrap">{error}</pre>;
        return <div className="overflow-x-auto" dangerouslySetInnerHTML={{ __html: svg ?? "" }} />;
      }
      // --- Diagram END ---

      // --- Shared ---
      // Real captures from the /learn lessons (3456x2296, full macOS desktop with the
      // Obsidian window centred on a wallpaper). `crop` zooms past the wallpaper.
      const MEDIA = {
        welcome:   { img: "media/connect-zotero-to-obsidian/step-1.webp", alt: "ZotLit's welcome checklist in Obsidian, showing Zotero connected" },
        library:   { img: "media/connect-zotero-to-obsidian/step-3.webp", clip: "media/connect-zotero-to-obsidian/step-3.mp4", alt: "The Zotero library in an Obsidian tab: collections on the left, papers in the middle, paper details on the right" },
        reading:   { img: "media/connect-zotero-to-obsidian/step-4.webp", clip: "media/connect-zotero-to-obsidian/step-4.mp4", alt: "A Zotero PDF open in Obsidian with its Zotero highlights in their original colours" },
        note:      { img: "media/connect-zotero-to-obsidian/step-6.webp", clip: "media/connect-zotero-to-obsidian/step-6.mp4", alt: "A literature note ZotLit wrote, with the paper's details and highlights" },
        highlight: { img: "media/annotate-pdfs-in-obsidian/step-4.webp", clip: "media/annotate-pdfs-in-obsidian/step-4.mp4", alt: "Highlighting a sentence in a PDF in Obsidian; the highlight saves to Zotero" },
        annots:    { img: "media/annotate-pdfs-in-obsidian/step-7.webp", alt: "All the paper's highlights and comments listed beside the PDF" },
        cite:      { img: "media/cite-while-writing/step-3.webp", clip: "media/cite-while-writing/step-3.mp4", alt: "Typing [@ in a chapter draft and picking a paper; the citation appears in APA style" },
        hover:     { img: "media/cite-while-writing/step-6.webp", clip: "media/cite-while-writing/step-6.mp4", alt: "Hovering a citation opens the paper beside the draft" },
        table:     { img: "media/build-a-literature-review-table/step-4.webp", clip: "media/build-a-literature-review-table/step-4.mp4", alt: "A literature review table of papers with year, journal and reading status" },
        status:    { img: "media/track-reading-status/step-3.webp", clip: "media/track-reading-status/step-3.mp4", alt: "Marking papers as read or to read in a reading list" },
        word:      { img: "media/export-to-word-with-a-bibliography/step-5.webp", alt: "The chapter exported to Word with formatted citations and a reference list" },
        exportDlg: { img: "media/export-to-word-with-a-bibliography/step-3.webp", clip: "media/export-to-word-with-a-bibliography/step-3.mp4", alt: "Choosing Word and a citation style in the export dialog" },
      };

      // A product screen in a quiet frame. `crop` (default true) trims the desktop
      // wallpaper so the Obsidian window fills the frame. `play` loops the clip.
      // Every recording will be redone for its own case: for now a Shot is a
      // placeholder whose text says what the clip must show.
      function Shot({ m, className = "" }) {
        const media = typeof m === "string" ? MEDIA[m] : m;
        return <H_Rec brief={media.alt + "."} className={className} />;
      }

      // Facts every variant must stay true to (from messages/en.json docs_home_*).
      const FACTS = {
        claimShort: "Cite Zotero sources as you write in Obsidian",
        lede: "Find, read, annotate, cite and export your Zotero papers, right beside the notes you write.",
        install: "Install ZotLit",
        tutorial: "Start the tutorial",
        requirements: "Obsidian 1.14.5 or later · Zotero 9 or 10 · Windows, macOS and Linux",
        privacy: "ZotLit reads your Zotero library on your own computer. No account and no cloud service.",
        license: "Free and open source (AGPL-3.0).",
        bbt: "Citing as you write needs the free Better BibTeX add-on for Zotero.",
        jobs: [
          ["Bring your library", "Your whole Zotero library, group libraries too, inside Obsidian. Zotero can stay closed."],
          ["Find a paper", "Browse your collections, filter what you have not read, and see a paper at a glance."],
          ["Read and annotate", "Read your Zotero PDFs beside your notes, with your Zotero highlights in their colours."],
          ["Take literature notes", "Pick a paper and ZotLit writes its note, with its details and your highlights."],
          ["Cite while you write", "Type [@ and pick a paper. The citation appears in your style as you write."],
          ["See how your sources connect", "See what each chapter cites, which notes cite each paper, and the shape of your reading."],
          ["Export and submit", "Send a chapter to Word with a correct reference list, in the style your journal asks for."],
          ["Make it yours", "Design your own note layouts, and let an AI assistant search your library."],
        ],
      };
      // --- Shared END ---

      // --- App ---
      // --- Variant C ---
      // Variant C — "From Zotero to finished chapter".
      // ZotLit as the bridge between the two apps academics already use, then the real
      // research sequence as five numbered steps (the order is true: find, read, note,
      // cite, export). Uses only MEDIA, Shot and FACTS from the shell.

      const C_LEARN = "/learn";

      const C_STEPS = [
        {
          n: 1,
          m: "library",
          title: "Find a paper.",
          body: FACTS.jobs[1][1],
          items: [
            ["Your whole library.", "Every Zotero collection, group libraries too, in an Obsidian tab."],
            ["Zotero can stay closed.", "ZotLit reads your library on your own computer."],
          ],
          lesson: "connect-zotero-to-obsidian",
        },
        {
          n: 2,
          m: "highlight",
          title: "Read and highlight.",
          body: FACTS.jobs[2][1],
          items: [
            ["Original colours.", "Your Zotero highlights appear in the colours you gave them."],
            ["Everything in one list.", "All the paper's highlights and comments sit beside the PDF."],
          ],
          lesson: "annotate-pdfs-in-obsidian",
        },
        {
          n: 3,
          m: "note",
          title: "Write the literature note.",
          body: FACTS.jobs[3][1],
          items: [
            ["Ready to think with.", "The note starts with the paper's details and your highlights."],
            ["Your own layout.", "Design the note layout that suits your field."],
          ],
          lesson: "connect-zotero-to-obsidian",
        },
        {
          n: 4,
          m: "cite",
          title: "Cite as you draft.",
          body: FACTS.jobs[4][1],
          items: [
            ["In your style.", "Citations appear formatted while you write, in APA or the style you use."],
            ["Check a source in place.", "Hover a citation to open the paper beside the draft."],
          ],
          note: FACTS.bbt,
          lesson: "cite-while-writing",
        },
        {
          n: 5,
          m: "word",
          title: "Send it to Word.",
          body: FACTS.jobs[6][1],
          items: [
            ["A correct reference list.", "Every paper you cited, listed at the end of the chapter."],
            ["The journal's style.", "Choose Word and a citation style in one export dialog."],
          ],
          lesson: "export-to-word-with-a-bibliography",
        },
      ];

      function C_Button({ href, filled, children }) {
        const base =
          "inline-flex items-center justify-center rounded-md px-5 py-3 text-base font-medium transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent";
        const look = filled
          ? "bg-accent text-accent-ink hover:opacity-90"
          : "border border-line bg-card text-ink hover:bg-tint";
        return (
          <a href={href} className={base + " " + look}>
            {children}
          </a>
        );
      }

      function C_TextLink({ href, children }) {
        return (
          <a
            href={href}
            className="inline-flex items-center gap-1 text-base font-medium text-accent underline-offset-4 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent rounded-sm"
          >
            {children}
            <span aria-hidden="true">→</span>
          </a>
        );
      }

      function C_Step({ step, flip }) {
        return (
          <li className="relative grid items-center gap-8 lg:grid-cols-2 lg:gap-24">
            {/* Marker on the connecting line (desktop). */}
            <span
              aria-hidden="true"
              className="absolute left-1/2 top-1/2 hidden h-9 w-9 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border border-line bg-ground font-mono text-sm text-accent lg:flex"
            >
              {step.n}
            </span>
            <div className={flip ? "lg:order-2" : ""}>
              <Shot m={step.m} play />
            </div>
            <div className={"max-w-xl " + (flip ? "lg:order-1 lg:justify-self-end" : "")}>
              <p className="font-mono text-sm uppercase tracking-wider text-accent">Step {step.n}</p>
              <h3 className="mt-2 font-display text-3xl font-semibold text-balance sm:text-4xl">
                {step.title}
              </h3>
              <p className="mt-3 text-lg text-muted">{step.body}</p>
              <ul className="mt-6 grid gap-4">
                {step.items.map(([lead, text]) => (
                  <li key={lead} className="border-t border-line pt-4 text-base">
                    <strong className="font-semibold text-ink">{lead}</strong>{" "}
                    <span className="text-muted">{text}</span>
                  </li>
                ))}
              </ul>
              {step.note && (
                <p className="mt-4 rounded-md bg-tint px-4 py-3 text-base text-muted">{step.note}</p>
              )}
              <div className="mt-6">
                <C_TextLink href={`${C_LEARN}/${step.lesson}`}>Learn in the tutorial</C_TextLink>
              </div>
            </div>
          </li>
        );
      }

      function C_Trust() {
        const items = [
          ["Private, on your computer.", FACTS.privacy],
          ["Free and open source.", FACTS.license],
          ["Works with Zotero 9 and 10.", FACTS.requirements + "."],
        ];
        return (
          <ul className="grid gap-8 sm:grid-cols-3">
            {items.map(([lead, text]) => (
              <li key={lead}>
                <h3 className="font-display text-xl font-semibold text-balance">{lead}</h3>
                <p className="mt-2 text-base text-muted">{text}</p>
              </li>
            ))}
          </ul>
        );
      }

      // --- Hero variants (round 3) ---
      // Question: what should the FIRST SCREEN (no scrolling) show, so a researcher who
      // has never heard of ZotLit, but keeps papers in Zotero and notes in Obsidian,
      // knows what it does and wants it? The body below the hero is C, fixed.
      // Copy keeps the "research desk" line from the desk landing. Every recording is a
      // placeholder whose text is the brief for the clip to record for that case.
      const H_KEYS = ["1"];
      let h_key = H_KEYS.includes(location.hash.slice(2)) ? location.hash.slice(2) : "1";
      const h_subs = new Set();
      const h_set = (k) => { h_key = k; history.replaceState(null, "", "#h" + k); h_subs.forEach((f) => f()); };
      const useH = () => React.useSyncExternalStore((f) => (h_subs.add(f), () => h_subs.delete(f)), () => h_key);

      // The recordings each case needs (placeholder text = the recording brief).
      const REC = {
        loop: "20 s, one paper from start to finish: open the Zotero library tab in Obsidian, open the paper's PDF, highlight a sentence, then type [@ in a chapter draft and pick the paper. The citation appears.",
        cite: "6 s: in a chapter draft, type [@, type “sandve”, press Enter. “(Sandve et al., 2013)” appears in APA style.",
        highlight: "6 s: in a Zotero PDF open in Obsidian, select a sentence and pick yellow. Cut to Zotero: the same highlight is there.",
        word: "6 s: export the chapter to Word and open it. The citations are formatted and the reference list is at the end.",
        library: "6 s: the Zotero library tab in Obsidian. Open a collection, turn on “Unread”, select a paper to see its details.",
        note: "6 s: select a paper, choose “Write literature note”. The note opens with the paper's details and highlights.",
      };

      function H_Rec({ brief, ratio = "16 / 10", className = "", compact = false }) {
        return (
          <figure className={"relative overflow-hidden rounded-xl border border-dashed border-muted/50 bg-tint " + className} style={{ aspectRatio: ratio }}>
            <div className="absolute inset-0 opacity-60" style={{ backgroundImage: "repeating-linear-gradient(135deg, transparent 0 14px, var(--line) 14px 15px)" }} />
            <figcaption className={"relative flex h-full flex-col justify-end text-left " + (compact ? "p-3" : "p-5 sm:p-6")}>
              <span className="font-mono text-[11px] uppercase tracking-wider text-accent">Recording to make</span>
              <span className={"mt-1.5 text-ink/80 text-pretty " + (compact ? "text-sm" : "text-base")}>{brief}</span>
            </figcaption>
          </figure>
        );
      }

      const H_Req = ({ className = "" }) => <p className={"text-sm text-muted " + className}>{FACTS.requirements}</p>;
      const H_Ctas = ({ center }) => (
        <div className={"flex flex-col items-stretch gap-3 sm:flex-row sm:items-center " + (center ? "justify-center" : "")}>
          <C_Button href="#install" filled>{FACTS.install}</C_Button>
          <C_Button href={C_LEARN}>{FACTS.tutorial}</C_Button>
        </div>
      );
      const H_Title = ({ className = "" }) => (
        <h1 className={"font-display font-semibold leading-[1.08] tracking-[-0.015em] text-balance " + className}>
          A <span className="text-accent">research desk</span> for Zotero in Obsidian.
        </h1>
      );

      // 1 — Desk and its index: the claim, then the eight jobs as a scannable list,
      // beside one recording of the whole loop.
      function H_DeskIndex() {
        return (
          <section className="mx-auto grid max-w-6xl items-center gap-10 px-4 pt-8 pb-16 sm:px-8 lg:grid-cols-[1fr_1.1fr] lg:pt-14">
            <div>
              <H_Title className="text-4xl sm:text-[3.4rem]" />
              <p className="mt-5 max-w-xl text-lg text-muted sm:text-xl">{FACTS.lede}</p>
              <ul className="mt-6 grid max-w-xl grid-cols-2 gap-x-6 gap-y-2 border-t border-line pt-5 text-base">
                {FACTS.jobs.map(([t]) => (
                  <li key={t} className="flex gap-2"><span aria-hidden="true" className="text-accent">✓</span>{t}</li>
                ))}
              </ul>
              <div className="mt-7"><H_Ctas /></div>
              <H_Req className="mt-3" />
            </div>
            <H_Rec brief={REC.loop} ratio="4 / 3" />
          </section>
        );
      }

      // 2 — Three moments: the claim, then the three things researchers do every week,
      // each as its own short recording with a one-line result.
      function H_Moments() {
        const moments = [
          ["Type [@, get the citation.", "In your journal's style, as you write.", REC.cite],
          ["Highlight in Obsidian, keep it in Zotero.", "With Zotero 10, every highlight saves back.", REC.highlight],
          ["Send the chapter to Word.", "With a correct reference list.", REC.word],
        ];
        return (
          <section className="mx-auto max-w-6xl px-4 pt-8 pb-16 text-center sm:px-8 lg:pt-12">
            <H_Title className="mx-auto max-w-4xl text-4xl sm:text-6xl" />
            <p className="mx-auto mt-5 max-w-2xl text-lg text-muted sm:text-xl">{FACTS.lede}</p>
            <div className="mt-7"><H_Ctas center /></div>
            <ul className="mt-10 grid gap-5 text-left md:grid-cols-3">
              {moments.map(([t, d, b]) => (
                <li key={t}>
                  <H_Rec brief={b} compact />
                  <p className="mt-3 text-base"><strong className="font-semibold">{t}</strong> <span className="text-muted">{d}</span></p>
                </li>
              ))}
            </ul>
          </section>
        );
      }

      // 3 — Outcome sheet: four concrete results, in the words of the job copy,
      // beside one large recording. Reads like the abstract of a paper.
      function H_Outcomes() {
        const outs = [
          ["Your whole Zotero library in Obsidian.", "Group libraries too. Zotero can stay closed."],
          ["Your PDFs, beside your notes.", "With Zotero 10, every highlight saves back to Zotero."],
          ["Citations as you write.", "Type [@ and pick a paper. It appears in your style."],
          ["Word, with a reference list.", "In the style your journal asks for."],
        ];
        return (
          <section className="mx-auto grid max-w-6xl items-start gap-10 px-4 pt-8 pb-16 sm:px-8 lg:grid-cols-[0.9fr_1.1fr] lg:pt-14">
            <div>
              <H_Title className="text-4xl sm:text-5xl" />
              <dl className="mt-7 grid gap-4">
                {outs.map(([t, d]) => (
                  <div key={t} className="border-t border-line pt-3">
                    <dt className="font-display text-xl font-semibold">{t}</dt>
                    <dd className="mt-0.5 text-base text-muted">{d}</dd>
                  </div>
                ))}
              </dl>
              <div className="mt-7"><H_Ctas /></div>
              <H_Req className="mt-3" />
            </div>
            <H_Rec brief={REC.loop} ratio="4 / 3" className="lg:mt-2" />
          </section>
        );
      }

      // 4 — Pick your task: the claim, then the reader picks the job they came for and
      // the recording above the fold answers it.
      function H_PickTask() {
        const tasks = [
          ["Find", "Browse your collections and filter what you have not read.", REC.library],

      // ---- round 4: HL ----
      // --- Hero HL: the highlighter (round 4) ---
      // Typography is the visual. The headline is set like the title of a printed paper;

      // the final state and reduced motion simply drops the animations.

      const HL_Z = { yellow: "#ffd400", red: "#ff6666", green: "#5fb236", blue: "#2ea8e5", purple: "#a28ae5" };

      // Timeline (ms). The headline sweep, then one verb + its note every 600 ms; the
      // citekey types last and resolves to the APA chip.
      const HL_T = { head: 300, headDur: 1050, verb0: 1550, step: 600, verbDur: 440, noteLag: 240 };
      const HL_verbAt = (i) => HL_T.verb0 + i * HL_T.step;
      const HL_noteAt = (i) => HL_verbAt(i) + HL_T.noteLag;
      const HL_typeAt = HL_noteAt(3) + 520;
      const HL_chipAt = HL_typeAt + 13 * 62 + 380;

      // A felt-tip band: rough top and bottom edges (displacement filter), ink pooling
      // where the nib rests at each end, and two dry streaks along the stroke.
      function HL_inkUrl(hex, seed) {
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" preserveAspectRatio="none">` +
          `<defs><filter id="HL_r${seed}" x="-4%" y="-30%" width="108%" height="160%">` +
          `<feTurbulence type="fractalNoise" baseFrequency="0.03 0.2" numOctaves="2" seed="${seed}"/>` +
          `<feDisplacementMap in="SourceGraphic" scale="11" xChannelSelector="R" yChannelSelector="G"/></filter></defs>` +
          `<g filter="url(#HL_r${seed})" fill="${hex}">` +
          `<path d="M8 16 C120 11 280 8 392 11 L396 87 C280 90 120 92 3 94 Z" fill-opacity=".82"/>` +
          `<path d="M6 34 C140 30 260 27 394 29 L395 66 C260 70 140 72 5 75 Z" fill-opacity=".12"/>` +
          `<path d="M3 14 L22 13 L21 93 L2 95 Z" fill-opacity=".2"/>` +
          `<path d="M378 10 L397 11 L398 87 L377 88 Z" fill-opacity=".28"/></g>` +
          `<g fill="none" stroke="#fff" stroke-linecap="round">` +
          `<path d="M20 42 C150 38 270 35 382 37" stroke-opacity=".2" stroke-width="2"/>` +
          `<path d="M16 66 C150 63 260 61 386 61" stroke-opacity=".14" stroke-width="3.5"/></g></svg>`;
        return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
      }

      const HL_GRAIN = (() => {
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><filter id="HL_g">` +
          `<feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>` +
          `<feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 1.1 -.42"/></filter>` +
          `<rect width="100%" height="100%" filter="url(#HL_g)"/></svg>`;
        return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
      })();

      const HL_CSS = `
        .HL-ink {
          position: absolute; pointer-events: none;
          background-size: 100% 100%; background-repeat: no-repeat;
          mix-blend-mode: multiply; opacity: var(--hl-o, .9);
          animation: HL-sweep var(--hl-d, 500ms) cubic-bezier(.6, .05, .3, 1) var(--hl-at, 0ms) backwards;

        @keyframes HL-sweep { from { clip-path: inset(0 100% 0 0); } }
        .HL-note { animation: HL-slide 600ms cubic-bezier(.2, .75, .25, 1) var(--hl-at, 0ms) backwards; }
        @keyframes HL-slide { from { opacity: 0; transform: translateX(-14px); } }
        .HL-type {
          display: inline-block; overflow: hidden; white-space: nowrap; vertical-align: bottom; width: 13ch;
          animation: HL-type ${13 * 62}ms steps(13, end) var(--hl-at, 0ms) backwards;
        }
        @keyframes HL-type { from { width: 0; } }
        .HL-caret {
          display: inline-block; width: 2px; height: 1.1em; margin-left: 1px; vertical-align: -0.2em;
          background: currentColor; opacity: 0;
          animation: HL-blink 800ms step-end var(--hl-at, 0ms) 3;
        }
        @keyframes HL-blink { 0% { opacity: 1; } 50% { opacity: 0; } }
        .HL-chip { animation: HL-rise 520ms cubic-bezier(.2, .75, .25, 1) var(--hl-at, 0ms) backwards; }
        @keyframes HL-rise { from { opacity: 0; transform: translateY(5px); } }
        .HL-grain { opacity: .4; mix-blend-mode: multiply; }
        @media (prefers-color-scheme: dark) {
          .HL-ink { mix-blend-mode: normal; opacity: calc(var(--hl-o, .9) * .6); }
          .HL-grain { opacity: .35; mix-blend-mode: screen; filter: invert(1); }
        }
        @media (prefers-reduced-motion: reduce) {
          .HL-ink, .HL-note, .HL-type, .HL-chip, .HL-caret { animation: none; }
        }
      `;

      // A marker band behind one run of words. `box` places the band against the type.
      function HL_Mark({ hex, seed, at, dur, o, box, tilt = -0.6, children }) {
        return (
          <span className="relative inline-block whitespace-nowrap">
            <span
              aria-hidden="true"
              className="HL-ink"
              style={{ ...box, backgroundImage: HL_inkUrl(hex, seed), transform: `rotate(${tilt}deg)`, "--hl-at": at + "ms", "--hl-d": dur + "ms", "--hl-o": o }}
            />

      const HL_VERB_BOX = { left: "-0.1em", right: "-0.12em", top: "0.2em", bottom: "0.02em" };
      const HL_VERBS = [
        ["Find", HL_Z.blue],
        ["read", HL_Z.green],
        ["annotate", HL_Z.yellow],
        ["cite", HL_Z.purple],
        ["export", HL_Z.red],

      const HL_Verb = ({ i }) => (
        <HL_Mark hex={HL_VERBS[i][1]} seed={11 + i * 7} at={HL_verbAt(i)} dur={HL_T.verbDur} o={0.62} box={HL_VERB_BOX} tilt={[-0.8, 0.5, -0.4, 0.9, -0.6][i]}>

      // A Zotero annotation card in the margin: colour swatch and the verb it belongs

                  A{" "}
                  <HL_Mark hex={HL_Z.yellow} seed={3} at={HL_T.head} dur={HL_T.headDur} o={0.9} box={{ left: "-0.07em", right: "-0.09em", top: "0.24em", bottom: "0.04em" }} tilt={-0.7}>
                    research desk
                  </HL_Mark>{" "}
                  for Zotero in Obsidian.
                </h1>

                <p className="mt-6 max-w-[34ch] font-display text-[1.3rem] leading-[1.5] text-ink sm:text-[1.6rem] lg:mt-8">
                  <HL_Verb i={0} />, <HL_Verb i={1} />, <HL_Verb i={2} />, <HL_Verb i={3} /> and <HL_Verb i={4} /> your Zotero papers, right beside the notes you write.
                </p>

                <div className="mt-7 flex flex-col items-stretch gap-3 sm:flex-row sm:items-center lg:mt-9">
                  <C_Button href="#install" filled>{FACTS.install}</C_Button>
                  <C_Button href={C_LEARN}>{FACTS.tutorial}</C_Button>
                </div>
                <p className="mt-3 text-sm text-muted">{FACTS.requirements}</p>
              </div>

              {/* The margin: one real paper, annotated as the lede reads */}
              <aside aria-label="One paper, from your library to your chapter" className="mt-10 lg:mt-0 lg:border-l lg:border-accent/30 lg:pt-5 lg:pl-6">
                <p className="font-mono text-[11px] uppercase tracking-[0.14em] text-muted">In the margin · Sandve et al., 2013</p>
                <ol className="mt-2.5 grid gap-2">
                  <HL_Note i={0} right="My Library">
                    <p className="font-display text-[15px] leading-snug font-semibold text-ink">Ten Simple Rules for Reproducible Computational Research</p>
                    <HL_Foot>PLOS Computational Biology · 2013</HL_Foot>
                  </HL_Note>

                  <HL_Note i={1} right="p. 1">
                    <HL_Quote hex={HL_Z.green}>“good habits of reproducibility may actually turn out to be a time-saver in the longer run.”</HL_Quote>
                  </HL_Note>

                  <HL_Note i={2} right="p. 1">
                    <HL_Quote hex={HL_Z.yellow}>“As a minimal requirement, you should at least be able to reproduce the results yourself.”</HL_Quote>
                    <p className="mt-1.5 hidden text-[13px] leading-snug text-ink lg:block">The bar for every analysis in my methods chapter. <HL_Tag>reproducibility</HL_Tag></p>
                  </HL_Note>

                  <HL_Note i={3} right="APA">
                    <p className="flex flex-wrap items-center gap-x-2 gap-y-1">
                      <span className="font-mono text-[13px] text-ink">
                        <span className="HL-type" style={{ "--hl-at": HL_typeAt + "ms" }}>[@sandve2013]</span>
                        <span aria-hidden="true" className="HL-caret" style={{ "--hl-at": HL_typeAt + "ms" }} />
                      </span>
                      <span aria-hidden="true" className="HL-chip text-muted" style={{ "--hl-at": HL_chipAt + "ms" }}>→</span>
                      <span
                        className="HL-chip rounded-md px-1.5 py-0.5 font-display text-[14px] text-ink"
                        style={{ "--hl-at": HL_chipAt + "ms", background: "color-mix(in oklab, #a28ae5 22%, var(--card))", boxShadow: "inset 0 0 0 1px color-mix(in oklab, #a28ae5 45%, transparent)" }}
                      >
                        (Sandve et al., 2013)
                      </span>
                    </p>
                    <HL_Foot>Type [@ in your draft and pick the paper.</HL_Foot>
                  </HL_Note>

                  <HL_Note i={4} right="Word · References">
                    <p className="pl-4 -indent-4 font-display text-[13.5px] leading-snug text-ink">
                      Sandve, G. K., Nekrutenko, A., Taylor, J., &amp; Hovig, E. (2013). Ten simple rules for reproducible computational research. <i>PLOS Computational Biology</i>.
                    </p>
                  </HL_Note>
                </ol>
              </aside>
            </div>
          </section>
        );
      }
      // --- Hero HL END ---

      // ---- round 4: DR ----
// DR — "The draft that cites itself".
// Left: the claim, the lede, the two buttons and three true facts. Right: a thesis
// page, "Chapter 3 – Presenting the results", set in Gelasio with line numbers in the
// margin, tilted and bleeding off the right edge. One loop: the caret types [@san, the
// citation list opens (the real row format from the lesson), Enter, the draft holds
// [@sandve2013], and it renders as (Sandve et al., 2013). Then the References sheet
// rises from the page foot with the APA entry. Round two cites Rougier 2014, whose
// entry files in above Sandve (alphabetical, as APA sorts).
// Fidelity: ZotLit writes the reference list when you export to Word, so the sheet
// is labelled as the Word export's list, not as something in the Obsidian note.
// Data: apps/docs/src/components/landing/replicas/papers.ts and the Fixture spec.

const DR_PAPERS = {
  sandve2013: {
    title: "Ten Simple Rules for Reproducible Computational Research",
    byline: "Sandve et al. (2013), PLOS Computational Biology, 9(10), e1003285",
    cite: "(Sandve et al., 2013)",
    apa: ["Sandve, G. K., Nekrutenko, A., Taylor, J., & Hovig, E. (2013). Ten simple rules for reproducible computational research. ", "PLOS Computational Biology, 9", "(10), e1003285."],
  },
  rougier2014: {
    title: "Ten Simple Rules for Better Figures",
    byline: "Rougier et al. (2014), PLOS Computational Biology, 10(9), e1003833",
    cite: "(Rougier et al., 2014)",
    apa: ["Rougier, N. P., Droettboom, M., & Bourne, P. E. (2014). Ten simple rules for better figures. ", "PLOS Computational Biology, 10", "(9), e1003833."],
  },
  ioannidis2005: {
    title: "Why Most Published Research Findings Are False",
    byline: "Ioannidis (2005), PLoS Medicine, 2(8), e124",
  },
  munafo2017: {
    title: "A manifesto for reproducible science",
    byline: "Munafò et al. (2017), Nature Human Behaviour, 1, 0021",
  },
};

// One round per citation: the query typed after [@, and the list as it filters.
const DR_ROUNDS = [
  { key: "sandve2013", q: "san", list: ["sandve2013", "ioannidis2005", "munafo2017"] },
  { key: "rougier2014", q: "rou", list: ["rougier2014", "sandve2013", "ioannidis2005"] },
];
const DR_DEFAULT_LIST = ["ioannidis2005", "munafo2017", "rougier2014"];

// The timeline: one frame per beat. `n` is how many characters of "[@" + q are typed.
function DR_frames() {
  const f = [];
  const base = { slot: 0, n: 0, picker: false, enter: false, raw: false, cited: [false, false], refs: 0, out: false };
  DR_ROUNDS.forEach((r, k) => {
    const prev = { ...base, slot: k, cited: [k > 0, false], refs: k };
    const typed = 2 + r.q.length;
    f.push({ ...prev, ms: k === 0 ? 1500 : 900 });
    for (let n = 1; n <= typed; n++) f.push({ ...prev, n, picker: n >= 2, ms: n === typed ? 1100 : n === 2 ? 450 : 170 });
    f.push({ ...prev, n: typed, picker: true, enter: true, ms: 320 });
    f.push({ ...prev, raw: true, ms: 750 });
    const cited = [true, k === 1];
    f.push({ ...prev, slot: -1, cited, ms: 900 });
    f.push({ ...prev, slot: -1, cited, refs: k + 1, ms: k === 0 ? 2800 : 4200 });
  });
  f.push({ ...base, slot: -1, cited: [true, true], refs: 2, out: true, ms: 900 });
  return f;
}
const DR_FRAMES = DR_frames();
const DR_FINAL = { ...DR_FRAMES[DR_FRAMES.length - 2], ms: 0 };

function DR_useTimeline() {
  // -1 shows the final state: reduced motion stays there.
  const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const [i, setI] = useState(() => (reduce() ? -1 : 0));
  useEffect(() => {
    if (reduce()) return;
    let t;
    let k = 0;
    const tick = () => {
      setI(k);
      t = setTimeout(() => {
        k = (k + 1) % DR_FRAMES.length;
        tick();
      }, DR_FRAMES[k].ms);
    };
    tick();
    return () => clearTimeout(t);
  }, []);
  return i < 0 ? DR_FINAL : DR_FRAMES[i];
}

// A citation site in the draft: the rendered citation, or the caret and what is typed.
function DR_Slot({ k, fr, caretRef }) {
  const r = DR_ROUNDS[k];
  const p = DR_PAPERS[r.key];
  if (fr.cited[k])
    return (
      <>
        {" "}
        <span
          key={"c" + k}
          className={"DR_cite " + (fr.out ? "DR_out" : "")}
        >
          {p.cite}
        </span>
      </>
    );
  if (fr.slot !== k) return null;
  const text = fr.raw ? `[@${r.key}]` : ("[@" + r.q).slice(0, fr.n);
  return (
    <>
      {text ? " " : ""}
      <span className={fr.raw ? "DR_raw" : "DR_typed"}>{text}</span>
      <span ref={caretRef} className="DR_caret" />
    </>
  );
}

// The Obsidian suggestion list, with ZotLit's own row format and instruction bar.
function DR_Picker({ fr, pos, pickerRef }) {
  const r = DR_ROUNDS[fr.slot] || DR_ROUNDS[0];
  const list = fr.n > 2 ? r.list : DR_DEFAULT_LIST;
  return (
    <div
      ref={pickerRef}
      className="DR_picker absolute z-20 overflow-hidden rounded-lg border border-line bg-card font-body"
      style={{ top: pos.top, left: pos.left, width: pos.width }}
    >
      <ul className="p-1">
        {list.map((key, idx) => (
          <li
            key={key}
            className={"rounded-md px-3 py-[7px] " + (idx === 0 ? "DR_sel" : "")}
          >
            <span className="block truncate text-[13px] font-medium leading-[1.35] text-ink">{DR_PAPERS[key].title}</span>
            <span className="mt-px block truncate text-[11.5px] leading-[1.35] text-muted">{DR_PAPERS[key].byline}</span>
          </li>
        ))}
      </ul>
      <div className="flex gap-4 border-t border-line px-3 py-1.5 font-mono text-[10.5px] whitespace-nowrap text-muted">
        <span><b className="font-medium text-ink">↑↓</b> to navigate</span>
        <span>
          <b className={"inline-block rounded-sm px-1 font-medium " + (fr.enter ? "DR_key" : "text-ink")}>↵</b> to insert citation
        </span>
        <span className="hidden sm:inline"><b className="font-medium text-ink">esc</b> to dismiss</span>
      </div>

function DR_Page() {
  const fr = DR_useTimeline();
  const bodyRef = React.useRef(null);
  const caretRef = React.useRef(null);
  const paperRef = React.useRef(null);
  const pickerRef = React.useRef(null);
  const blocks = React.useRef([]);
  const [nums, setNums] = useState([]);
  const [pos, setPos] = useState({ top: 0, left: 0, width: 340 });
  const [tick, setTick] = useState(0);

  useEffect(() => {
    const on = () => setTick((t) => t + 1);
    window.addEventListener("resize", on);
    if (document.fonts) document.fonts.ready.then(on);
    return () => window.removeEventListener("resize", on);
  }, []);

  // Line numbers follow the text as it wraps: count each block's lines.
  React.useLayoutEffect(() => {
    const out = [];
    let n = 1;
    blocks.current.forEach((el) => {
      if (!el) return;
      const lh = parseFloat(getComputedStyle(el).lineHeight) || 28;
      const lines = Math.max(1, Math.round(el.offsetHeight / lh));
      for (let i = 0; i < lines; i++) out.push({ y: el.offsetTop + i * lh, h: lh, n: n++ });
    });
    if (JSON.stringify(out) !== JSON.stringify(nums)) setNums(out);

    const body = bodyRef.current;
    const c = caretRef.current;
    if (body && c) {
      const bw = body.clientWidth;
      const visible = Math.min(bw, window.innerWidth - body.getBoundingClientRect().left - 20);
      const width = Math.min(420, visible);
      const lh = parseFloat(getComputedStyle(body).lineHeight) || 28;
      const left = Math.max(0, Math.min(c.offsetLeft - 28, visible - width));
      // Open below the caret, or above it when the page foot is too close.
      const paper = paperRef.current;
      const ph = pickerRef.current ? pickerRef.current.offsetHeight : 180;
      const bodyTop = body.getBoundingClientRect().top - paper.getBoundingClientRect().top;
      const below = c.offsetTop + lh + 2;
      const top = bodyTop + below + ph > paper.clientHeight - 8 ? c.offsetTop - ph - 8 : below;
      if (top !== pos.top || left !== pos.left || width !== pos.width) setPos({ top, left, width });
    }
  });

  const b = (i) => (el) => (blocks.current[i] = el);
  const showSheet = fr.refs > 0 && !fr.out;

  return (
    <div ref={paperRef} className="DR_paper relative overflow-hidden rounded-[3px] border border-line bg-card">
      {/* Running head */}
      <div className="flex items-baseline justify-between border-b border-line py-3 pr-6 pl-5 font-mono text-[10.5px] tracking-wider text-muted uppercase sm:pl-[3.25rem] lg:pr-32">
        <span>Thesis draft · Chapter 3</span>
        <span className="hidden sm:inline">In Obsidian · Live preview</span>
      </div>

      <div className="relative pt-5 pr-5 pl-10 sm:pl-[4.25rem] lg:pt-7 lg:pr-32">
        <div ref={bodyRef} className="DR_body relative">
          {/* Line numbers, as a thesis draft prints them. */}
          <div aria-hidden="true" className="absolute top-0 -left-8 w-5 sm:-left-12 sm:w-7">
            {nums.map((l) => (
              <span
                key={l.n}
                className="absolute right-0 font-mono text-[10px] text-muted/70 tabular-nums"
                style={{ top: l.y, lineHeight: l.h + "px" }}
              >
                {l.n}
              </span>
            ))}
          </div>

          <p ref={b(0)} className="DR_title">Chapter 3 – Presenting the results</p>
          <p ref={b(1)} className="DR_h">3.1 Why the figures come first</p>
          <p ref={b(2)} className="DR_p">
            <span className="hidden sm:inline">A reader meets this chapter through its figures
            before a word of its text, so each figure is drawn to stand on its own. </span>Every figure in this chapter comes
            from a script that records how it ran<DR_Slot k={0} fr={fr} caretRef={caretRef} />. Each one
            carries a single message, with labels large enough to read in
            print<DR_Slot k={1} fr={fr} caretRef={caretRef} />.
          </p>
          <p ref={b(3)} className="DR_h">3.2 How much to trust a single result</p>
          <p ref={b(4)} className="DR_p">
            A single result is a starting point, not a finding. This section sets out how
            much weight each result in the chapter can carry, and what new data would
            change it.
          </p>
          <p ref={b(5)} className="DR_h">3.3 Keeping each figure reproducible</p>
          <p ref={b(6)} className="DR_p">
            The scripts, the raw data and a short run log sit together in one project
            folder, one folder for each figure.
          </p>

          {fr.picker && fr.slot >= 0 && <DR_Picker fr={fr} pos={pos} pickerRef={pickerRef} />}
        </div>
      </div>

      {/* References: the list the Word export writes, rising from the page foot. */}
      <div className={"DR_sheet absolute inset-x-0 bottom-0 z-10 border-t border-line bg-card pt-4 pr-5 pb-5 pl-10 sm:pl-[4.25rem] lg:pr-32 " + (showSheet ? "DR_up" : "")}>
        <div className="flex items-baseline justify-between gap-4">

          <p className="font-mono text-[10px] tracking-wider text-muted uppercase">APA · in your Word export</p>
        </div>
        <div className="mt-2">
          <div className={"DR_grow " + (fr.refs >= 2 ? "DR_open" : "")}>
            <div className="min-h-0 overflow-hidden">

      function H_CO() {
        const ref = React.useRef(null);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const fine = matchMedia("(hover: hover) and (pointer: fine)");
          const still = matchMedia("(prefers-reduced-motion: reduce)");
          let raf = 0, x = 0, y = 0;
          const apply = () => {
            raf = 0;
            el.style.setProperty("--co-x", x.toFixed(3));
            el.style.setProperty("--co-y", y.toFixed(3));
          };
          const queue = () => { if (!raf) raf = requestAnimationFrame(apply); };
          const move = (e) => {
            if (!fine.matches || still.matches) return;
            const r = el.getBoundingClientRect();
            x = ((e.clientX - r.left) / r.width - 0.5) * 2;
            y = ((e.clientY - r.top) / r.height - 0.5) * 2;
            queue();
          };
          const leave = () => { x = 0; y = 0; queue(); };
          el.addEventListener("pointermove", move);
          el.addEventListener("pointerleave", leave);
          return () => {
            el.removeEventListener("pointermove", move);
            el.removeEventListener("pointerleave", leave);
            cancelAnimationFrame(raf);
          };

      const FL_CSS = `
        .FL_band { --fl-thread: color-mix(in oklab, var(--accent) 72%, var(--ground)); }

          border: 2px solid color-mix(in oklab, var(--ground) 45%, transparent); background: var(--ink);
          transition: background-color .4s, border-color .4s, box-shadow .4s;
        }

        .FL_band[data-fade="true"] .FL_fill { opacity: 0; }
        .FL_pulse {
          position: absolute; left: 50%; top: calc(var(--f) * 100%); width: 10px; height: 10px;
          margin: -5px 0 0 -5px; border-radius: 9999px; background: var(--fl-thread);
          box-shadow: 0 0 0 4px color-mix(in oklab, var(--fl-thread) 30%, transparent), 0 0 18px 6px color-mix(in oklab, var(--fl-thread) 55%, transparent);

      // One clock for the whole strip: --fl-p (pulse position in stations) is written to
      // the band each frame; `lit` and `fade` change only at station arrivals.
      function FL_useJourney(n) {
        const ref = React.useRef(null);
        const reduced = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const [lit, setLit] = useState(() => (reduced() ? n : 0));
        const [fade, setFade] = useState(false);
        React.useLayoutEffect(() => {
          const el = ref.current;
          const mq = window.matchMedia("(prefers-reduced-motion: reduce)");
          const DWELL = 1.9, MOVE = 1.1, T0 = 0.5, HOLD = 3.6, OUT = 0.9;
          const arrive = (i) => T0 + i * (DWELL + MOVE);
          const END = arrive(n - 1) + HOLD;
          const T = END + OUT;
          const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
          let raf = 0, start = 0, lastLit = -1, lastFade = null;
          const frame = (now) => {
            if (!start) start = now;
            const t = ((now - start) / 1000) % T;
            let l = 0, p = 0;
            const f = t >= END;
            if (f) p = n - 1;
            else {
              for (let i = 0; i < n; i++) if (t >= arrive(i)) l = i + 1;
              if (l > 0) {
                const i = l - 1, leave = arrive(i) + DWELL;
                p = i < n - 1 && t > leave ? i + ease((t - leave) / MOVE) : i;
              }
            }
            el.style.setProperty("--fl-p", p.toFixed(4));
            if (l !== lastLit) { lastLit = l; setLit(l); }
            if (f !== lastFade) { lastFade = f; setFade(f); }
            raf = requestAnimationFrame(frame);
          };
          const run = () => {
            cancelAnimationFrame(raf);
            if (mq.matches) {
              el.style.setProperty("--fl-p", String(n - 1));
              setLit(n);
              setFade(false);
            } else {
              start = 0; lastLit = -1; lastFade = null;
              el.style.setProperty("--fl-p", "0");
              raf = requestAnimationFrame(frame);
            }
          };
          run();
          mq.addEventListener("change", run);
          return () => { cancelAnimationFrame(raf); mq.removeEventListener("change", run); };
        }, [n]);
        return [ref, lit, fade];
      }

function LV_rows(node, facets, tag, q) {
  let rows =
    node === "recent"
      ? LV_RECENT.map(([k, reason]) => ({ p: LV_BY[k], reason }))
      : LV_PAPERS.filter((p) => node === "lib" || p.coll === node).map((p) => ({ p, reason: null }));
  for (const [id, , test] of LV_FACETS) if (facets.includes(id)) rows = rows.filter((r) => test(r.p));
  if (tag) rows = rows.filter((r) => r.p.tags.includes(tag));
  const s = q.trim().toLowerCase();
  if (s)
    rows = rows.filter((r) =>
      [r.p.title, r.p.short, r.p.authors, ...r.p.tags].some((t) => t.toLowerCase().includes(s)),
    );
  return rows;
}

// The library's state, its demo, and the visitor's hand on it.
function LV_useLibrary() {
  const [node, setNode] = useState("recent");
  const [facets, setFacets] = useState([]);
  const [tag, setTag] = useState(null);
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(null);
  const [phase, setPhase] = useState("demo"); // demo -> ready -> playing
  const [pointer, setPointer] = useState(null); // {x, y, click}
  const timers = React.useRef([]);
  const observer = React.useRef(null);
  const winRef = React.useRef(null);

  const rows = useMemo(() => LV_rows(node, facets, tag, q), [node, facets, tag, q]);

  const stopDemo = () => {
    if (observer.current) observer.current.disconnect();
    timers.current.forEach(clearTimeout);
    timers.current = [];
    setPointer(null);
  };

  // A paper that leaves the list leaves the Reading Card too.
  useEffect(() => {
    if (sel && !rows.some((r) => r.p.key === sel)) setSel(null);
  }, [rows, sel]);

  useEffect(() => {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) {
      setNode("repro");
      setSel("sandve2013");
      setPhase("ready");
      return;
    }
    let tick = 0;
    const at = (ms, f) => timers.current.push(setTimeout(f, ms));
    // The demo starts once the replica on screen is in view (a phone shows it below the fold).
    const run = () => {
    const aim = (id, click) => {
      const w = winRef.current;
      const el = w && w.querySelector(`[data-lv="${id}"]`);
      if (!el || !w.offsetWidth) return setPointer(null);
      const a = w.getBoundingClientRect();
      const b = el.getBoundingClientRect();
      setPointer({ x: b.left - a.left + Math.min(b.width * 0.4, 70), y: b.top - a.top + b.height * 0.62, click, n: ++tick });
    };
    at(2100, () => aim("node-repro"));
    at(2850, () => {
      aim("node-repro", true);
      setNode("repro");
    });
    at(3700, () => aim("facet-unread"));
    at(4350, () => {
      aim("facet-unread", true);
      setFacets(["unread"]);
    });
    at(6100, () => {
      aim("facet-unread", true);
      setFacets([]);
    });
    at(6850, () => aim("row-sandve2013"));
    at(7600, () => {
      aim("row-sandve2013", true);
      setSel("sandve2013");
    });
    at(8800, () => {
      setPointer(null);
      setPhase("ready");
    });
    };
    const stages = [...document.querySelectorAll("[data-lv-stage]")];
    const io = new IntersectionObserver(
      (entries) => {
        if (entries.some((e) => e.isIntersecting && e.target.offsetWidth)) {
          io.disconnect();
          run();
        }
      },
      { threshold: 0.6 },
    );
    observer.current = io;
    stages.forEach((el) => io.observe(el));
    return () => {
      io.disconnect();
      timers.current.forEach(clearTimeout);
    };
  }, []);

  // The visitor's first touch ends the demo where it stands.
  const take = () => {
    if (phase === "playing") return;
    stopDemo();
    setPhase("playing");
  };

  const pick = (n) => {
    setNode(n);
    setSel(null);
  };
  const toggleFacet = (id) => setFacets((f) => (f.includes(id) ? f.filter((x) => x !== id) : [...f, id]));
  const toggleTag = (t) => setTag((cur) => (cur === t ? null : t));
  return { node, facets, tag, q, sel, rows, phase, pointer, winRef, take, pick, toggleFacet, toggleTag, setQ, setSel };
}

      // FLIP over every [data-flip] element in the stage. `snap` records where things are
      // (with any running animation included); after React commits, `play` cancels running
      // animations, measures the new places, and animates each element from old to new.
      // [data-from] lets a new element fly in from another element's old place (a token
      // of the two-line row flying into its table cell). A keyed element inside a keyed
      // element animates relative to it, so a cell is not moved twice with its row.
      function SQ_useFlip(ref) {
        const prev = React.useRef(null);
        const snap = () => {
          const root = ref.current;
          if (!root) return;
          const m = new Map();
          root.querySelectorAll("[data-flip]").forEach((el) => m.set(el.dataset.flip, el.getBoundingClientRect()));
          prev.current = m;
        };
        const play = () => {
          const root = ref.current;
          const m = prev.current;
          prev.current = null;
          if (!root || !m) return;
          const els = [...root.querySelectorAll("[data-flip]")];
          els.forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
          const delta = new Map();
          els.forEach((el) => {
            const own = m.get(el.dataset.flip);
            const from = own || (el.dataset.from && m.get(el.dataset.from));
            if (!from) return;
            const to = el.getBoundingClientRect();
            delta.set(el, { dx: from.left - to.left, dy: from.top - to.top, flown: !own });
          });
          els.forEach((el) => {
            const d = delta.get(el);
            const delay = +(el.dataset.delay || 0);
            if (!d) {
              const kind = el.dataset.enter;
              if (!kind) return;
              const start = kind === "x" ? "translateX(-14px)" : kind === "y" ? "translateY(8px)" : "none";
              el.animate([{ opacity: 0, transform: start }, { opacity: 1, transform: "none" }], { duration: 520, delay, easing: SQ_EASE, fill: "backwards" });
              return;
            }
            let { dx, dy } = d;
            const host = el.parentElement && el.parentElement.closest("[data-flip]");
            const hd = host && root.contains(host) && delta.get(host);
            if (hd) {
              dx -= hd.dx;
              dy -= hd.dy;
            }
            if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
            const t = `translate(${dx}px, ${dy}px)`;
            el.animate(d.flown ? [{ transform: t, opacity: 0.35 }, { transform: "none", opacity: 1 }] : [{ transform: t }, { transform: "none" }], { duration: d.flown ? 760 : 700, delay, easing: SQ_EASE, fill: "backwards" });
          });
        };
        return { snap, play };
      }

                <span key={saving ? "s" : "w"} className={"rounded-[5px] px-3 py-1 font-medium " + (saving ? "SQ_press" : "")} style={{ background: SQ_P, color: "#fff" }}>Save</span>
                <span className="rounded-[5px] bg-tint px-3 py-1 text-ink">Cancel</span>
              </div>
            </div>
          </div>
        );
      }

      // ---- Rows: the two-line Papers row that becomes a Table row ----
      const SQ_COLS = [
        { k: "note", label: "Literature note", icon: "file", fr: "1.12fr", at: 9 },
        { k: "year", label: "Year", icon: "hash", fr: "0.6fr", at: 6 },
        { k: "pub", label: "Publication", icon: "text", fr: "1.7fr", at: 7 },
        { k: "creators", label: "Creators", icon: "props", fr: "1.75fr", at: 8 },
        { k: "rating", label: "rating (note)", icon: "text", fr: "1.05fr", at: 12 },
      ];
      const SQ_NARROW = { year: "3.3rem", rating: "6rem" };

      function SQ_cols(step, wide) {
        return SQ_COLS.filter((c) => step >= c.at && (wide || SQ_NARROW[c.k]));
      }
      function SQ_template(step, wide) {
        const cols = SQ_cols(step, wide);
        // minmax(0, …) on every track: the header and each row must share one grid,
        // whatever the cells' text would ask for.
        return [wide ? "minmax(0,3fr)" : "minmax(0,1fr)", ...cols.map((c) => (wide ? `minmax(0,${c.fr})` : SQ_NARROW[c.k]))].join(" ");
      }

      function SQ_Cell({ col, p, i, step, focus }) {
        const base = "flex min-w-0 items-center border-l border-line px-2.5";
        if (col.k === "note")
          return (
            <div className={base}>
              <span data-flip={"n-" + p.id} data-enter="y" data-delay={i * 70} className="block truncate underline decoration-1 underline-offset-2" style={{ color: SQ_P }}>{p.id}</span>
            </div>
          );
        if (col.k === "year")
          return (
            <div className={base}>
              <span data-flip={"y-" + p.id} data-from={"my-" + p.id} data-delay={i * 40} className="SQ_num block font-display text-[14px] text-ink">{p.year}</span>
            </div>
          );
        if (col.k === "pub")
          return (
            <div className={base}>
              <span data-flip={"p-" + p.id} data-from={"mp-" + p.id} data-delay={i * 40} className="block truncate text-ink">{p.pub}</span>
            </div>
          );
        if (col.k === "creators")
          return (
            <div className={base}>
              <span data-flip={"c-" + p.id} data-from={"mc-" + p.id} data-delay={i * 40} className="block truncate text-ink">{p.creators}</span>
            </div>
          );
        // rating (note): typed one row at a time, with Obsidian's cell focus.
        const typed = step >= 13 + i;
        const focused = step >= 13 && step < SQ_FINAL && step === 13 + i;
        return (
          <div className={base + " relative"}>
            {focused && <span data-flip="focus" className="absolute inset-0 rounded-[3px] border-[1.5px]" style={{ borderColor: SQ_P }} />}
            {typed && <span key="v" className={"SQ_num relative font-display text-[15px] font-semibold text-ink " + (focused ? "SQ_type" : "")}>{p.rating}</span>}
            {focused && <span className="SQ_caret relative ml-px inline-block h-[1.05em] w-px" style={{ background: SQ_P }} />}
          </div>
        );
      }

      function SQ_Row({ p, i, step, wide }) {
        const table = step >= 5;
        const cols = SQ_cols(step, wide);
        // The second line keeps whatever has not yet moved into a column.
        const meta = [
          step < 8 && ["mc-", p.short],
          step < 6 && ["my-", p.year],
          step < 7 && ["mp-", p.pub],
        ].filter(Boolean);
        const lines2 = meta.length > 0;
        return (
          <div data-flip={"row-" + p.id} className="grid border-b border-line" style={{ gridTemplateColumns: SQ_template(step, wide), minHeight: lines2 ? 49 : 35 }}>
            <div className="flex min-w-0 items-center gap-1.5 py-1.5 pr-2.5 pl-2">
              <span className="w-3 shrink-0 text-muted">{p.kids ? <SQ_I n="right" s={12} /> : null}</span>
              {!table && <SQ_I n="article" s={14} className="text-muted" />}
              <div className="min-w-0 flex-1 leading-snug">
                <span data-flip={"t-" + p.id} className={"block truncate text-ink " + (table ? "" : "font-medium")}>{p.title}</span>
                {lines2 && (
                  <span className="flex min-w-0 items-baseline gap-1 overflow-hidden whitespace-nowrap text-[11.5px] text-muted">
                    {meta.map(([k, v], j) => (
                      <React.Fragment key={k}>
                        {j > 0 && <span aria-hidden="true">·</span>}
                        <span data-flip={k + p.id} className={"inline-block " + (k === "my-" ? "SQ_num" : "truncate")}>{v}</span>
                      </React.Fragment>
                    ))}
                  </span>
                )}
              </div>
              {!table && (
                <span className="flex shrink-0 items-center gap-1 text-muted">
                  {p.note && <SQ_I n="note" s={13} />}
                  {p.pdf && <SQ_I n="file" s={13} />}
                </span>
              )}
            </div>
            {cols.map((c) => <SQ_Cell key={c.k} col={c} p={p} i={i} step={step} />)}
          </div>
        );
      }

      function SQ_HeadRow({ step, wide }) {
        const cols = SQ_cols(step, wide);
        return (
          <div className="grid border-b border-line text-[12px] text-muted" style={{ gridTemplateColumns: SQ_template(step, wide) }}>
            <span data-flip="h-title" data-enter="y" className="flex h-[30px] items-center gap-1.5 pl-[26px]">
              <SQ_I n="text" s={12} />Title
            </span>
            {cols.map((c) => (
              <span key={c.k} data-flip={"h-" + c.k} data-enter="x" className="flex h-[30px] min-w-0 items-center gap-1.5 border-l border-line px-2.5">
                {wide && <SQ_I n={c.icon} s={12} />}
                <span className="truncate">{c.label}</span>
              </span>
            ))}
          </div>
        );
      }

      // ---- The window ----
      function SQ_Window({ step, wide, stageRef, fading }) {
        const query = step >= 4;
        const table = step >= 5;
        const rows = step >= 11 ? SQ_SORTED : SQ_PAPERS;
        return (
          <div className="overflow-hidden rounded-[11px] border border-line bg-card text-[13px] shadow-[0_30px_70px_-34px_rgb(0_0_0/0.45),0_2px_6px_-2px_rgb(0_0_0/0.08)]">
            {/* Tab strip */}
            <div className="flex h-[34px] items-end gap-1 border-b border-line bg-tint pr-3 pl-3">
              <span aria-hidden="true" className="mr-2 mb-[12px] flex gap-[6px]">
                {[0, 1, 2].map((d) => <span key={d} className="size-[9px] rounded-full bg-line" />)}
              </span>
              <span className={"flex h-[28px] w-[9.5rem] items-center gap-1.5 rounded-t-[7px] px-2.5 text-[12.5px] sm:w-[11rem] " + (query ? "text-muted" : "border border-b-0 border-line bg-card text-ink")}>
                <span className="font-display text-[12px] font-bold">Z</span>
                <span className="flex-1 truncate">Zotero library</span>
                {!query && <SQ_I n="x" s={11} className="text-muted" />}
              </span>
              {query && (
                <span key="qtab" className="SQ_pop flex h-[28px] w-[9.5rem] items-center gap-1.5 rounded-t-[7px] border border-b-0 border-line bg-card px-2.5 text-[12.5px] text-ink sm:w-[11rem]">
                  <SQ_I n="filter" s={12} className="text-muted" />
                  <span className="flex-1 truncate">Reproducibility</span>
                  <SQ_I n="x" s={11} className="text-muted" />
                </span>
              )}
              <span className="mb-[7px] ml-1 text-muted">+</span>
            </div>
            {/* Navigation bar */}
            <div className="flex h-[34px] items-center gap-2.5 px-3.5 text-[12.5px] text-muted">
              <SQ_I n="arrowL" s={13} />
              <SQ_I n="arrowR" s={13} className="opacity-50" />
              {query ? (
                <span key="crumb" className="SQ_pop truncate text-ink/85">Thesis <span className="text-muted">/</span> Reproducibility</span>
              ) : (
                <span className="text-ink/85">Zotero library</span>
              )}
              <span className="flex-1" />
              <SQ_I n="dots" s={15} />
            </div>
            {/* The view */}
            <div ref={stageRef} data-sq-step={step} className={"SQ_stage relative flex border-t border-line " + (fading ? "opacity-0" : "opacity-100")} style={{ height: wide ? 318 : 312 }}>
              {wide && <SQ_Tree open={!query} />}
              <div className="relative min-w-0 flex-1">
                {query ? <SQ_QueryBar step={step} wide={wide} /> : <SQ_LibHead step={step} />}
                {table && <SQ_HeadRow step={step} wide={wide} />}
                <div>
                  {rows.map((p, i) => <SQ_Row key={p.id} p={p} i={i} step={step} wide={wide} />)}
                </div>
              </div>
              {(step === 2 || step === 3) && <SQ_Dialog step={step} />}
            </div>
          </div>
        );
      }

      // ---- The caption trail ----
      function SQ_Trail({ step, cycle, still }) {
        const beat = SQ_beatOf(step);
        const bar = (i) => {
          if (still || i < beat) return { width: "100%" };
          if (i > beat) return { width: "0%" };
          return { animation: `SQ_fill ${SQ_BEAT_AT[i + 1] - SQ_BEAT_AT[i]}ms linear both` };
        };
        return (
          <div aria-hidden="true" className="mt-4">
            <ol className="grid grid-cols-5 gap-2 sm:gap-5">
              {SQ_BEATS.map((b, i) => (
                <li key={b} className={"transition-colors duration-500 " + (i === beat ? "text-ink" : i < beat ? "text-muted" : "text-muted/45")}>
                  <span className="relative block h-px bg-line">
                    <span key={cycle + "-" + i} className="absolute inset-y-[-0.5px] left-0 bg-accent" style={bar(i)} />
                  </span>
                  <span className="mt-2 hidden items-baseline gap-2 md:flex">
                    <span className="SQ_num font-mono text-[11px] tracking-wider text-accent">{"0" + (i + 1)}</span>
                    <span className="font-display text-[15px] italic">{b}</span>
                  </span>
                </li>
              ))}
            </ol>
            <p className="mt-2 flex items-baseline gap-2 md:hidden">
              <span className="SQ_num font-mono text-[11px] tracking-wider text-accent">{"0" + (beat + 1)} / 05</span>
              <span key={beat} className="SQ_pop font-display text-[15px] italic text-ink">{SQ_BEATS[beat]}</span>
            </p>
          </div>
        );
      }

      function SQ_Stage() {
        const still = SQ_useMedia("(prefers-reduced-motion: reduce)");
        const wide = SQ_useMedia("(min-width: 768px)");
        const [step, setStep] = useState(() => (window.matchMedia("(prefers-reduced-motion: reduce)").matches ? SQ_FINAL : 0));
        const [cycle, setCycle] = useState(0);
        const [fading, setFading] = useState(false);
        const stageRef = React.useRef(null);
        const flip = SQ_useFlip(stageRef);

        React.useLayoutEffect(() => {
          flip.play();
        }, [step]);

        useEffect(() => {
          if (still) {
            setStep(SQ_FINAL);
            return;
          }
          const ids = SQ_TL.map(([t, s]) =>
            setTimeout(() => {
              flip.snap();
              setStep(s);
            }, t),
          );
          ids.push(setTimeout(() => setFading(true), SQ_END - 650));
          ids.push(
            setTimeout(() => {
              setStep(0);
              setFading(false);
              setCycle((c) => c + 1);
            }, SQ_END),
          );
          return () => ids.forEach(clearTimeout);
        }, [cycle, still]);

        return (
          <figure className="relative">
            <div aria-hidden="true">
              <SQ_Window step={step} wide={wide} stageRef={stageRef} fading={fading} />
            </div>
            <figcaption className="sr-only">
              In the Zotero library tab in Obsidian, the Reproducibility collection is saved as the query file
              Thesis/Reproducibility.zotquery. It opens as a table with columns for literature note, year,
              publication and creators, sorted by year from 2005 to 2017, with a rating column of 5, 5, 3 and 4.
            </figcaption>
            <SQ_Trail step={step} cycle={cycle} still={still} />
          </figure>
        );
      }

      function H_SQ() {
        return (
          <section aria-labelledby="SQ-title" className="mx-auto max-w-6xl px-4 pt-3 pb-16 sm:px-8 lg:pt-5">
            <style>{SQ_CSS}</style>
            <div className="grid gap-5 lg:grid-cols-[minmax(0,1.32fr)_minmax(0,1fr)] lg:items-end lg:gap-12">
              <div>
                <p className="font-mono text-[11px] uppercase tracking-[0.16em] text-muted">An Obsidian plugin for Zotero</p>
                <h1 id="SQ-title" className="mt-3 font-display text-[2.7rem] leading-[1.0] font-semibold tracking-[-0.025em] text-balance sm:text-[3.8rem] lg:text-[4.9rem] lg:leading-[0.96]">
                  A <em className="font-medium text-accent">research desk</em>
                  <span className="lg:block"> for Zotero in Obsidian.</span>
                </h1>
              </div>
              <div className="lg:border-l lg:border-line lg:pb-1.5 lg:pl-8">
                <p className="text-lg leading-snug text-muted text-pretty lg:text-[1.2rem]">
                  Browse your Zotero library in an Obsidian tab, and turn any collection into a live table you can sort, filter and rate.
                </p>
                <div className="mt-5 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
                  <C_Button href="#install" filled>{FACTS.install}</C_Button>
                  <C_Button href={C_LEARN}>{FACTS.tutorial}</C_Button>
                </div>
                <p className="mt-3 text-[13px] text-muted">{FACTS.requirements}</p>
              </div>
            </div>
            <div className="mt-7 lg:mt-8">
              <SQ_Stage />
            </div>
          </section>
        );
      }
      // --- Hero SQ END ---

      // ---- round 5: LY ----
      // ---- round 5: LY ----
      // --- Hero LY: "Ask your library a question, see it any way you like" (round 5) ---
      // One ZotLit Query over the Reproducibility collection, read as a sentence, and one
      // enacted query window whose records re-arrange between Layouts: Papers (two-line
      // rows) → Table (with the rating column) → Cards (title-page snippets) → Annotations
      // (Sandve's five real highlights, grouped by colour). Every record is one absolutely
      // positioned tile that moves and reshapes (shared-element motion, staggered); its
      // contents cross-fade once it lands. In Annotations the four papers converge into
      // Sandve's source strip and the highlights fan out of it, because in the lesson vault
      // only Sandve carries annotations. The switch advances when its progress bar ends,
      // so hover, focus, the pause button and leaving the screen all pause it cleanly.
      // Data: brief-round5.md and the lesson-vault fixture (DOCS_ANNOTATIONS).

      const LY_LAYOUTS = [
        ["papers", "Papers"],
        ["table", "Table"],
        ["cards", "Cards"],
        ["annotations", "Annotations"],
      ];
      const LY_STEP_MS = 4000;

      // Sorted by year, old to new (the query's sort).
      const LY_PAPERS = [
        { key: "ioannidis2005", title: "Why Most Published Research Findings Are False", short: "Ioannidis", authors: "Ioannidis, J. P. A.", year: 2005, pub: "PLoS Medicine", rating: 5, kids: true },
        { key: "sandve2013", title: "Ten Simple Rules for Reproducible Computational Research", short: "Sandve et al.", authors: "Sandve, G. K., Nekrutenko, A., Taylor, J., Hovig, E.", year: 2013, pub: "PLOS Computational Biology", rating: 5, kids: true },
        { key: "wilson2014", title: "Best Practices for Scientific Computing", short: "Wilson et al.", authors: "Wilson, G., Aruliah, D. A., Brown, C. T. et al.", year: 2014, pub: "PLOS Biology", rating: 3, kids: true },
        { key: "munafo2017", title: "A manifesto for reproducible science", short: "Munafò et al.", authors: "Munafò, M. R., Nosek, B. A., Bishop, D. V. M. et al.", year: 2017, pub: "Nature Human Behaviour", rating: 4, kids: false },
      ];
      const LY_SANDVE = 1;

      // Sandve et al. 2013, the reader's five highlights in the lesson vault, in Zotero's
      // colour order (yellow, red, green, blue, purple).
      const LY_ANN = [
        { name: "Yellow", hex: "#ffd400", text: "As a minimal requirement, you should at least be able to reproduce the results yourself.", tag: "reproducibility", page: 1 },
        { name: "Red", hex: "#ff6666", text: "a failure to take notes may make exact reproduction essentially impossible.", tag: "pitfall", page: 1 },
        { name: "Green", hex: "#5fb236", text: "good habits of reproducibility may actually turn out to be a time-saver in the longer run.", tag: "argument", page: 1 },
        { name: "Blue", hex: "#2ea8e5", text: "you should ensure that every detail that may influence the execution of the step is recorded.", tag: "workflow", page: 2 },
        { name: "Purple", hex: "#a28ae5", text: "Rule 1: For Every Result, Keep Track of How It Was Produced", tag: null, page: 2 },
      ];
      const LY_TILES = LY_PAPERS.length + LY_ANN.length;

      // Table columns by stage width (the real query's columns, fewest first to drop).
      function LY_columns(W) {
        if (W >= 760) return { cols: ["title", "note", "year", "pub", "creators", "rating"], tpl: "minmax(0,2.1fr) 132px 72px minmax(0,1.3fr) minmax(0,1.3fr) 116px" };
        if (W >= 520) return { cols: ["title", "note", "year", "pub", "rating"], tpl: "minmax(0,2fr) 132px 72px minmax(0,1.2fr) 116px" };
        return { cols: ["title", "year", "rating"], tpl: "minmax(0,1fr) 72px 112px" };
      }
      const LY_COL_LABEL = { title: "Title", note: "Literature note", year: "Year", pub: "Publication", creators: "Creators", rating: "rating (note)" };

      // Where every tile sits in one layout at stage width W. Returns tile boxes, the
      // layout's own furniture (table header, colour headers) and the stage height.
      function LY_geom(L, W) {
        const narrow = W < 480;
        const P = narrow ? 10 : 14;
        const g = narrow ? 8 : 12;
        const recs = new Array(LY_TILES);
        const extras = [];
        let H = 0;
        let sandveBox;

        if (L === "papers") {
          const rh = 60;
          LY_PAPERS.forEach((_, i) => (recs[i] = { x: P, y: P + i * rh, w: W - 2 * P, h: rh }));
          H = 2 * P + LY_PAPERS.length * rh;
        } else if (L === "table") {
          const hd = 34, rh = 38;
          extras.push({ id: "thead", x: 0, y: 0, w: W, h: hd });
          LY_PAPERS.forEach((_, i) => (recs[i] = { x: 0, y: hd + i * rh, w: W, h: rh }));
          H = hd + LY_PAPERS.length * rh + 12;
        } else if (L === "cards") {
          const cols = W >= 720 ? 4 : 2;
          const cw = (W - 2 * P - (cols - 1) * g) / cols;
          const ch = cols === 4 ? 236 : narrow ? 186 : 166;
          LY_PAPERS.forEach((_, i) => {
            const c = i % cols, r = Math.floor(i / cols);
            recs[i] = { x: P + c * (cw + g), y: P + r * (ch + g), w: cw, h: ch };
          });
          const rows = Math.ceil(LY_PAPERS.length / cols);
          H = 2 * P + rows * ch + (rows - 1) * g;
        } else {
          // Annotations: Sandve's source strip, then a board grouped by colour, each group
          // placed in the shortest column.
          const strip = { x: P, y: P, w: W - 2 * P, h: 40 };
          LY_PAPERS.forEach((_, i) => (recs[i] = i === LY_SANDVE ? strip : { ...strip, hidden: true }));
          const cols = W >= 520 ? 3 : 2;
          const cw = (W - 2 * P - (cols - 1) * g) / cols;
          const top = P + strip.h + 12;
          const colY = new Array(cols).fill(top);
          const charW = narrow ? 6.1 : 6.6, lineH = narrow ? 17 : 19;
          const cpl = Math.max(10, Math.floor((cw - 3 - 22) / charW));
          const hdH = 24;
          LY_ANN.forEach((a, j) => {
            const lines = Math.ceil((a.text.length / cpl) * 1.08);
            const h = 12 + lines * lineH + 30;
            const c = colY.indexOf(Math.min(...colY));
            const x = P + c * (cw + g);
            extras.push({ id: "grp-" + j, x, y: colY[c], w: cw, h: hdH, ann: a });
            recs[LY_PAPERS.length + j] = { x, y: colY[c] + hdH, w: cw, h };
            colY[c] += hdH + h + g + 2;
          });
          H = Math.max(...colY) - g - 2 + P;
          sandveBox = strip;
        }
        if (L !== "annotations") {
          // The highlights wait, folded into Sandve's record.
          sandveBox = recs[LY_SANDVE];
          LY_ANN.forEach((_, j) => (recs[LY_PAPERS.length + j] = { ...sandveBox, hidden: true }));
        }
        return { recs, extras, H: Math.round(H) };
      }

      // Stagger: papers converge first, then the highlights fan out; reverse on the way back.
      function LY_delay(i, to, from) {
        const isAnn = i >= LY_PAPERS.length;
        const j = isAnn ? i - LY_PAPERS.length : i;
        if (to === "annotations") {
          if (isAnn) return { d: 420 + j * 70, od: 420 + j * 70 };
          return { d: j * 55, od: j === LY_SANDVE ? j * 55 : j * 55 + 260 };
        }
        if (from === "annotations") {
          if (isAnn) return { d: j * 35, od: j * 35 + 120 };
          return { d: 240 + j * 60, od: 240 + j * 60 };
        }
        return isAnn ? { d: 0, od: 0 } : { d: j * 65, od: j * 65 };
      }

      // Each layout dresses the record differently; these morph with it.
      const LY_SKIN = {
        papers: { borderRadius: 0, background: "transparent", borderColor: "transparent transparent var(--line) transparent", boxShadow: "none" },
        table: { borderRadius: 0, background: "transparent", borderColor: "transparent transparent var(--line) transparent", boxShadow: "none" },
        cards: { borderRadius: 10, background: "var(--card)", borderColor: "var(--line)", boxShadow: "0 1px 2px rgba(0,0,0,.05), 0 10px 24px -16px rgba(0,0,0,.35)" },
        strip: { borderRadius: 8, background: "var(--tint)", borderColor: "var(--line)", boxShadow: "none" },
        ann: { borderRadius: 8, background: "var(--card)", borderColor: "var(--line)", boxShadow: "0 1px 2px rgba(0,0,0,.05)" },
      };

      const LY_CSS = `
        .LY-root { --LY-v: #8a5cf5; --LY-ease: cubic-bezier(.65, .02, .2, 1); }
        @media (prefers-color-scheme: dark) { .LY-root { --LY-v: color-mix(in oklab, #8a5cf5 68%, white); } }
        .LY-stage { position: relative; overflow: hidden; }
        .LY-ready.LY-stage { transition: height 680ms var(--LY-ease); }
        .LY-rec { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 1px solid transparent; overflow: hidden;
          animation: LY-in 720ms var(--LY-ease) var(--e, 0ms) backwards; }
        @keyframes LY-in { from { opacity: 0; translate: 0 14px; } }
        .LY-ready .LY-rec {
          transition:
            transform 780ms var(--LY-ease) var(--d, 0ms), width 780ms var(--LY-ease) var(--d, 0ms), height 780ms var(--LY-ease) var(--d, 0ms),
