      // ---------- Lesson ----------

      function E_Rail({ l, step, done }) {
        const N = l.steps.length;
        const where =
          step === 0
            ? "Before you start"
            : step > N
              ? "Lesson done"
              : `Step ${step} of ${N}`;
        const what =
          step === 0
            ? `${N} steps, about ${l.minutes} minutes`
            : step > N
              ? `All ${N} steps checked`
              : l.steps[step - 1].title;
        return (
          <nav
            aria-label="Course"
            className="border-b border-line bg-ground/95 backdrop-blur sm:sticky sm:top-0 sm:z-20"
          >
            <div className="mx-auto flex max-w-[72rem] flex-col gap-3 px-4 py-3 sm:px-8">
              <div className="flex flex-wrap items-center gap-x-4 gap-y-2">
                <button
                  type="button"
                  onClick={openHub}
                  className={`inline-flex min-h-8 items-center gap-1.5 rounded-[8px] ${E_LABEL} text-muted hover:text-ink ${E_FOCUS}`}
                >
                  <Icons.ArrowLeft
                    size={14}
                    strokeWidth={2}
                    aria-hidden="true"
                  />
                  Contents
                </button>
                <span aria-hidden="true" className="h-4 w-px bg-line" />
                <ol className="flex items-center gap-1.5">
                  {LESSONS.map((x) => {
                    const cur = x.lesson === l.lesson;
                    const isDone = done.includes(x.lesson);
                    return (
                      <li key={x.lesson}>
                        <button
                          type="button"
                          onClick={() => openLesson(x.lesson, 0)}
                          aria-label={`Lesson ${x.lesson}: ${E_SHORT[x.lesson]}${isDone ? ", done" : ""}${cur ? ", current lesson" : ""}`}
                          aria-current={cur ? "true" : undefined}
                          className={`grid size-7 place-items-center rounded-full font-mono text-xs ${
                            cur
                              ? "bg-accent text-accent-ink"
                              : isDone
                                ? "bg-ok-tint text-ok"
                                : `bg-card text-muted ${E_RING} hover:text-ink`
                          } ${E_FOCUS}`}
                        >
                          {isDone && !cur ? (
                            <Icons.Check
                              size={14}
                              strokeWidth={2.5}
                              aria-hidden="true"
                            />
                          ) : (
                            x.lesson
                          )}
                        </button>
                      </li>
                    );
                  })}
                </ol>
                <p className={E_LABEL}>
                  <span className="text-accent">Lesson {l.lesson}</span> ·{" "}
                  {E_SHORT[l.lesson]}
                </p>
              </div>
              <div className="flex flex-col gap-1.5">
                <div aria-hidden="true" className="flex gap-1">
                  {l.steps.map((st, i) => (
                    <span
                      key={st.n}
                      className={`h-1.5 flex-1 rounded-full ${i + 1 < step || step > N ? "bg-ink" : i + 1 === step ? "bg-accent" : "bg-line"}`}
                    />
                  ))}
                </div>
                <p className="text-base leading-snug">
                  <span className={`${E_LABEL} text-accent`}>{where}</span>
                  <span className="text-muted"> · </span>
                  {what}
                </p>
              </div>
            </div>
          </nav>
        );
      }

      function E_Opening({ l, h1Ref }) {
        const N = l.steps.length;
        return (
          <article>
            <div className="border-t border-ink pt-3">
              <p className={`${E_LABEL} leading-relaxed`}>
                <span className="text-accent">Lesson {l.lesson} of 6</span> ·{" "}
                {l.title}
              </p>
              <h1
                ref={h1Ref}
                tabIndex={-1}
                className="mt-4 max-w-[22ch] font-display text-[clamp(2rem,5.5vw,3.5rem)] leading-[1.1] text-balance outline-none"
              >
                In {l.minutes} minutes your screen will look like this
              </h1>
            </div>

            <figure className="m-0">
              <div className="mt-8 max-w-[62rem]">
                <E_Shot lesson={l} n={N} rounded="rounded-[14px]" />
              </div>
              <figcaption className="mt-3 grid max-w-[62rem] gap-x-4 gap-y-1 sm:grid-cols-[8rem_minmax(0,1fr)]">
                <span className={`${E_LABEL} pt-1 text-muted`}>
                  End of step {N}
                </span>
                <span className="max-w-[65ch] text-base leading-relaxed">
                  {l.end.caption}
                </span>
              </figcaption>
            </figure>

            <div className="mt-10 grid max-w-[62rem] gap-6 border-t border-line pt-6 md:grid-cols-[minmax(0,1fr)_auto] md:items-end">
              <div>
                <h2 className={`${E_LABEL} text-muted`}>You need</h2>
                <ul className="mt-3 flex flex-wrap gap-2">
                  {l.needs.map((nd) => (
                    <li
                      key={nd.item}
                      className={`max-w-full rounded-[8px] border border-transparent bg-card px-3 py-1.5 text-base leading-snug ${E_RING}`}
                    >
                      <span className="font-semibold">{nd.item}</span>
                      <span className="text-muted"> · {nd.detail}</span>
                    </li>
                  ))}
                </ul>
              </div>
              <div className="flex flex-wrap items-center gap-x-5 gap-y-2">
                <button
                  type="button"
                  onClick={() => openLesson(l.lesson, 1)}
                  className={E_BTN_PRIMARY}
                >
                  Start
                  <Icons.ArrowRight
                    size={18}
                    strokeWidth={2.25}
                    aria-hidden="true"
                  />
                </button>
                <p className="text-base text-muted">{N} steps</p>
              </div>
            </div>
          </article>
        );
      }

      function E_Fixes({ st, id, onBack, open }) {
        const [openFix, setOpenFix] = useState(0);
        return (
          <div
            id={id}
            hidden={!open}
            className="mt-4 max-w-[65ch] rounded-[10px] bg-tint p-4 sm:p-5"
          >
            <h3 className="font-display text-xl leading-tight text-balance">
              If your screen is different
            </h3>
            {st.fixes.length > 0 ? (
              <ul className="mt-3 divide-y divide-line border-t border-line">
                {st.fixes.map((f, i) => {
                  const on = openFix === i;
                  return (
                    <li key={i}>
                      <h4>
                        <button
                          type="button"
                          aria-expanded={on}
                          onClick={() => setOpenFix(on ? -1 : i)}
                          className={`flex min-h-11 w-full items-start justify-between gap-3 rounded-[8px] py-3 text-left text-base leading-snug font-medium ${E_FOCUS}`}
                        >
                          <span>
                            <E_Rich text={f.title} />
                          </span>
                          <Icons.ChevronDown
                            size={18}
                            strokeWidth={1.5}
                            aria-hidden="true"
                            className={`mt-0.5 shrink-0 text-muted ${on ? "rotate-180" : ""}`}
                          />
                        </button>
                      </h4>
                      {on && (
                        <p className="pb-4 text-base leading-relaxed text-muted">
                          <E_Rich text={f.body} />
                        </p>
                      )}
                    </li>
                  );
                })}
              </ul>
            ) : (
              <div className="mt-3">
                <p className="text-base leading-relaxed text-muted">
                  No common fixes are listed for this step. Play the recording
                  above and repeat the action. If it still looks different, go
                  back one step and check that screen first.
                </p>
                <button
                  type="button"
                  onClick={onBack}
                  className={`mt-3 ${E_QUIET}`}
                >
                  <Icons.ArrowLeft
                    size={16}
                    strokeWidth={1.5}
                    aria-hidden="true"
                  />
                  Go back one step
                </button>
              </div>
            )}
          </div>
        );
      }

      function E_Step({ l, step, zoom, setZoom, watch, setWatch, h1Ref }) {
        const st = l.steps[step - 1];
        const N = l.steps.length;
        const last = step === N;
        const [open, setOpen] = useState(false);
        const natural = !!E_NATURAL[`${l.media}/${step}`];
        const close = zoom === "close";
        const back = () => openLesson(l.lesson, step - 1);
        const fixId = `E-fixes-${l.lesson}-${step}`;
        const canWatch = !natural && hasClip(l, step);
        const playing = canWatch && watch;
        const view = natural
          ? "Zotero’s dialog, shown whole"
          : close
            ? "Close-up of the part that changes"
            : "The whole window";
        const caption = `${view} · ${playing ? "recording" : `end of step ${step}`}`;
        return (
          <article className="grid gap-x-8 lg:grid-cols-[5.5rem_minmax(0,1fr)]">
            <div
              aria-hidden="true"
              className="hidden border-t border-ink pt-3 lg:block"
            >
              <span className="font-mono text-5xl leading-none text-accent">
                {E_pad(step)}
              </span>
              <span className="mt-2 block font-mono text-xs text-muted">
                of {E_pad(N)}
              </span>
            </div>
            <div className="min-w-0">
              <header className="border-t border-ink pt-3">
                <p className={`${E_LABEL} mb-3 lg:hidden`}>
                  <span className="text-accent">
                    Step {step} of {N}
                  </span>{" "}
                  · {st.name}
                </p>
                <h1
                  ref={h1Ref}
                  tabIndex={-1}
                  className="font-display text-[clamp(1.875rem,4.5vw,2.75rem)] leading-tight text-balance outline-none"
                >
                  {st.title}
                </h1>
                <p className="mt-4 max-w-[65ch] text-lg leading-relaxed">
                  <E_Rich text={st.action} />
                </p>
              </header>

              <section aria-labelledby={`E-compare-${step}`} className="mt-8">
                <div className="flex flex-wrap items-center justify-between gap-3 border-b border-line pb-3">
                  <h2 id={`E-compare-${step}`} className={E_LABEL}>
                    Compare your screen
                  </h2>
                  {!natural && (
                    <div
                      role="group"
                      aria-label="Zoom level"
                      className="inline-flex rounded-[10px] bg-tint p-1"
                    >
                      {[
                        ["close", "Close-up"],
                        ["whole", "Whole window"],
                      ].map(([k, label]) => (
                        <button
                          key={k}
                          type="button"
                          aria-pressed={zoom === k}
                          onClick={() => setZoom(k)}
                          className={`min-h-9 rounded-[8px] px-3 text-base font-medium ${zoom === k ? `bg-card text-ink ${E_RING}` : "text-muted hover:text-ink"} ${E_FOCUS}`}
                        >
                          {label}
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                <div className="mt-4 grid gap-5 lg:grid-cols-[minmax(0,1fr)_17rem] lg:items-start">
                  <div className="min-w-0">
                    <E_Shot lesson={l} n={step} close={close} play={playing} />
                    <div className="mt-2 flex flex-wrap items-center justify-between gap-x-4 gap-y-1">
                      <p className={`${E_LABEL} text-[0.68rem] text-muted`}>
                        {caption}
                      </p>
                      {canWatch && (
                        <button
                          type="button"
                          onClick={() => setWatch((w) => !w)}
                          className={E_QUIET}
                        >
                          {playing ? (
                            <Icons.Image
                              size={16}
                              strokeWidth={1.5}
                              aria-hidden="true"
                            />
                          ) : (
                            <Icons.Play
                              size={16}
                              strokeWidth={1.5}
                              aria-hidden="true"
                            />
                          )}
                          {playing
                            ? "Show the end frame"
                            : "Play the recording"}
                        </button>
                      )}
                    </div>
                  </div>
                  <div className="rounded-[10px] bg-ok-tint p-4 sm:p-5">
                    <p className={`flex items-center gap-2 ${E_LABEL} text-ok`}>
                      <Icons.CircleCheck
                        size={16}
                        strokeWidth={2}
                        aria-hidden="true"
                      />
                      Your screen should show
                    </p>
                    <p className="mt-2 text-base leading-relaxed">
                      <E_Rich text={st.check} />
                    </p>
                  </div>
                </div>
              </section>

              <div className="mt-8 flex flex-wrap items-center gap-3">
                <button
                  type="button"
                  onClick={() => openLesson(l.lesson, step + 1)}
                  className={E_BTN_PRIMARY}
                >
                  <Icons.Check
                    size={18}
                    strokeWidth={2.25}
                    aria-hidden="true"
                  />
                  {last ? "Matches. Finish lesson" : "Matches. Next step"}
                </button>
                <button
                  type="button"
                  aria-expanded={open}
                  aria-controls={fixId}
                  onClick={() => setOpen((o) => !o)}
                  className={E_BTN_SECONDARY}
                >
                  Mine is different
                  <Icons.ChevronDown
                    size={18}
                    strokeWidth={2.25}
                    aria-hidden="true"
                    className={open ? "rotate-180" : ""}
                  />
                </button>
              </div>
              <E_Fixes st={st} id={fixId} open={open} onBack={back} />

              <button
                type="button"
                onClick={back}
                className={`mt-10 ${E_QUIET}`}
              >
                <Icons.ArrowLeft
                  size={16}
                  strokeWidth={1.5}
                  aria-hidden="true"
                />
                Back
              </button>
            </div>
          </article>
        );
      }

      function E_End({ l, h1Ref }) {
        const next = lessonBy(l.lesson + 1);
        return (
          <article className="mx-auto max-w-[60rem]">
            <div className="flex flex-col items-center text-center">
              <div className="relative grid size-32 place-items-center rounded-full border-2 border-ok text-ok sm:size-40">
                <span
                  aria-hidden="true"
                  className="absolute inset-2 rounded-full border border-dashed border-ok/60"
                />
                <span className="flex flex-col items-center gap-1">
                  <Icons.Check size={44} strokeWidth={2} aria-hidden="true" />
                  <span className="font-mono text-xs font-medium uppercase tracking-wider">
                    Lesson {E_pad(l.lesson)}
                  </span>
                </span>
              </div>
              <p className={`mt-6 ${E_LABEL} text-muted`}>
                {l.steps.length} of {l.steps.length} steps checked
              </p>
              <h1
                ref={h1Ref}
                tabIndex={-1}
                className="mt-3 font-display text-[clamp(2.25rem,6vw,3.5rem)] leading-tight text-balance outline-none"
              >
                Lesson {l.lesson} done
              </h1>
              <p className="mt-4 max-w-[52ch] text-lg leading-relaxed text-muted">
                {l.end.caption}
              </p>
            </div>

            <section
              aria-labelledby="E-next"
              className="mt-12 border-t border-ink pt-3"
            >
              <h2 id="E-next" className={E_LABEL}>
                {next ? (
                  <>
                    <span className="text-accent">Next</span> · Lesson{" "}
                    {next.lesson} of 6
                  </>
                ) : (
                  "What comes next"
                )}
              </h2>
              {next ? (
                <div
                  className={`mt-4 grid overflow-hidden rounded-[14px] border border-transparent bg-card ${E_RING} md:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)]`}
                >
                  <div className="flex flex-col p-5 sm:p-6">
                    <h3 className="font-display text-2xl leading-tight text-balance">
                      {next.title}
                    </h3>
                    <p className="mt-3 max-w-[65ch] text-base leading-relaxed text-muted">
                      {l.end.next}
                    </p>
                    <p className={`mt-4 ${E_LABEL} text-muted`}>
                      About {next.minutes} minutes · {next.steps.length} steps
                    </p>
                    <div className="mt-auto pt-6">
                      <button
                        type="button"
                        onClick={() => openLesson(next.lesson, 0)}
                        className={E_BTN_PRIMARY}
                      >
                        Start lesson {next.lesson}
                        <Icons.ArrowRight
                          size={18}
                          strokeWidth={2.25}
                          aria-hidden="true"
                        />
                      </button>
                    </div>
                  </div>
                  <div className="p-3 md:pl-0">
                    <E_Shot
                      lesson={next}
                      n={next.steps.length}
                      rounded="rounded-[10px]"
                    />
                    <p
                      className={`mt-2 px-1 ${E_LABEL} text-[0.68rem] text-muted`}
                    >
                      You end with · {E_RESULT[next.lesson]}
                    </p>
                  </div>
                </div>
              ) : (
                <div
                  className={`mt-4 rounded-[14px] border border-transparent bg-card p-5 sm:p-6 ${E_RING}`}
                >
                  <h3 className="font-display text-2xl leading-tight text-balance">
                    You finished the course
                  </h3>
                  <p className="mt-3 max-w-[65ch] text-base leading-relaxed text-muted">
                    {l.end.next}
                  </p>
                  <button
                    type="button"
                    onClick={openHub}
                    className={`mt-6 ${E_BTN_PRIMARY}`}
                  >
                    Back to the contents
                  </button>
                </div>
              )}
            </section>

            <button
              type="button"
              onClick={openHub}
              className={`mt-10 ${E_QUIET}`}
            >
              <Icons.ArrowLeft size={16} strokeWidth={1.5} aria-hidden="true" />
              Contents
            </button>
          </article>
        );
      }

      function E_Lesson({ s }) {
        const l = lessonBy(s.lesson) ?? LESSONS[0];
        const N = l.steps.length;
        const step = Math.max(0, Math.min(s.step, N + 1));
        const [zoom, setZoom] = useState("close");
        const [watch, setWatch] = useState(false);
        const h1Ref = useRef(null);
        const first = useRef(true);
        useEffect(() => {
          if (first.current) {
            first.current = false;
            return;
          }
          window.scrollTo({ top: 0 });
          h1Ref.current?.focus({ preventScroll: true });
        }, [l.lesson, step]);
        useEffect(() => {
          if (step === N + 1) finishLesson(l.lesson);
        }, [l.lesson, step, N]);
        // Keep keyboard focus clear of the sticky course rail.
        useEffect(() => {
          const root = document.documentElement;
          root.style.scrollPaddingTop = "8.5rem";
          return () => {
            root.style.scrollPaddingTop = "";
          };
        }, []);
        return (
          <div className="pb-28">
            <E_Rail l={l} step={step} done={s.done} />
            <main className="mx-auto max-w-[72rem] px-4 pt-8 sm:px-8 sm:pt-12">
              {step === 0 ? (
                <E_Opening l={l} h1Ref={h1Ref} />
              ) : step === N + 1 ? (
                <E_End l={l} h1Ref={h1Ref} />
              ) : (
                <E_Step
                  key={`${l.lesson}-${step}`}
                  l={l}
                  step={step}
                  zoom={zoom}
                  setZoom={setZoom}
                  watch={watch}
                  setWatch={setWatch}
                  h1Ref={h1Ref}
                />
              )}
            </main>
          </div>
        );
      }

      function VariantE() {
        const s = useProto();
        return (
          <div className="min-h-screen bg-ground font-body text-ink">
            {s.view === "hub" ? <E_Hub s={s} /> : <E_Lesson s={s} />}
          </div>
        );
      }
      // --- Variant E END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Next.js Learn, translated", component: VariantA },
        { key: "B", name: "Today vs with ZotLit", component: VariantB },
        { key: "C", name: "Watch, then do", component: VariantC },
        { key: "D", name: "Pick a chore", component: VariantD },
        { key: "E", name: "Your screen, step by step", component: VariantE },
      ];

      // Scenario presets — buttons that jump the shared store to a telling state
      // (e.g. "empty inbox", "3 selected"). Leave empty when the design has no such
      // states; otherwise add { label, apply() } entries that mutate the store.
      const SCENARIOS = [
        {
          label: "Course hub, first visit",
          apply: () => setProto({ view: "hub", step: 0, done: [] }),
        },
        { label: "Lesson 1, opening", apply: () => openLesson(1, 0) },
        { label: "Lesson 1, step 3", apply: () => openLesson(1, 3) },
        { label: "Lesson 3 (cite), opening", apply: () => openLesson(3, 0) },
        {
          label: "Back after lesson 1",
          apply: () => setProto({ view: "hub", step: 0, done: [1] }),
        },
      ];

      function App() {
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });
        const [pos, setPos] = useState({ right: 16, bottom: 16 });
        const [open, setOpen] = useState(() => innerWidth >= 1000);

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const onDragStart = (e) => {
          const start = { x: e.clientX, y: e.clientY, ...pos };
          const onMove = (ev) => {
            const dx = ev.clientX - start.x,
              dy = ev.clientY - start.y;
            setPos({
              right: Math.max(8, start.right - dx),
              bottom: Math.max(8, start.bottom - dy),
            });
          };
          const onUp = () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
        };

        const V = VARIANTS[idx];
        return (
          <>
            <V.component />
            <div
              style={{
                position: "fixed",
                right: pos.right,
                bottom: pos.bottom,
                background: "#1e293b",
                color: "#f8fafc",
                borderRadius: "0.75rem",
                padding: "0.75rem",
                display: "flex",
                flexDirection: "column",
                gap: "0.5rem",
                fontSize: "0.875rem",
                zIndex: 9999,
                boxShadow: "0 4px 12px rgba(0,0,0,0.3)",
                minWidth: "9rem",
              }}
            >
              <div
                onPointerDown={onDragStart}
                style={{
                  cursor: "grab",
                  fontSize: "0.75rem",
                  opacity: 0.6,
                  userSelect: "none",
                  textAlign: "center",
                }}
              >
                ⠿ drag
              </div>
              <button
                onClick={() => setOpen((o) => !o)}
                aria-expanded={open}
                style={{
                  background: "#334155",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  padding: "0.375rem 0.5rem",
                  borderRadius: "0.375rem",
                  textAlign: "left",
                }}
              >
                {open
                  ? "Hide variants"
                  : `${VARIANTS[idx].key} — ${VARIANTS[idx].name} · show`}
              </button>
              {open &&
                VARIANTS.map((v, i) => (
                  <button
                    key={v.key}
                    onClick={() => setIdx(i)}
                    style={{
                      background: i === idx ? "#334155" : "none",
                      border: "none",
                      color: "inherit",
                      cursor: "pointer",
                      textAlign: "left",
                      padding: "0.375rem 0.5rem",
                      borderRadius: "0.375rem",
                    }}
                  >
                    {v.key} — {v.name}
                  </button>
                ))}
              {open && SCENARIOS.length > 0 && (
                <div
                  style={{
                    borderTop: "1px solid #334155",
                    marginTop: "0.25rem",
                    paddingTop: "0.5rem",
                    display: "flex",
                    flexDirection: "column",
                    gap: "0.25rem",
                  }}
                >
                  {SCENARIOS.map((s, i) => (
                    <button
                      key={i}
                      onClick={s.apply}
                      style={{
                        background: "none",
                        border: "1px solid #334155",
                        color: "inherit",
                        cursor: "pointer",
                        textAlign: "left",
                        padding: "0.25rem 0.5rem",
                        borderRadius: "0.375rem",
                        fontSize: "0.75rem",
                      }}
                    >
                      {s.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
