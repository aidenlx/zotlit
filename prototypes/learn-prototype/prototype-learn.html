            </div>
          </div>
        );
      }

      // ---------- Lesson ----------

      function C_Scrubber({ l, step }) {
        const N = l.steps.length;
        const items = [
          { k: 0, num: "Start", label: "Watch" },
          ...l.steps.map((st) => ({
            k: st.n,
            num: String(st.n).padStart(2, "0"),
            label: st.name,
          })),
          { k: N + 1, num: "End", label: "Result" },
        ];
        return (
          <nav aria-label="Lesson chapters" className="mt-4">
            <ol className="grid grid-cols-3 gap-x-2 gap-y-3 sm:flex sm:gap-1.5">
              {items.map((it) => {
                const now = it.k === step;
                const past = it.k < step;
                return (
                  <li key={it.k} className="min-w-0 sm:flex-1">
                    <button
                      type="button"
                      aria-current={now ? "step" : undefined}
                      onClick={() => setProto({ step: it.k })}
                      className={`block w-full rounded-md pb-1 text-left hover:bg-white/5 ${C_FOCUS}`}
                    >
                      <span
                        aria-hidden="true"
                        className={`block h-1.5 rounded-full ${now ? "bg-accent" : past ? "bg-ground/60 dark:bg-ink/60" : C_HAIR}`}
                      />
                      <span
                        className={`mt-2 flex items-center gap-1 font-mono text-[11px] uppercase tracking-wider ${C_SOFT}`}
                      >
                        {now ? (
                          <Icons.Play
                            size={11}
                            aria-hidden="true"
                            className="text-accent"
                          />
                        ) : past ? (
                          <Icons.Check size={11} aria-hidden="true" />
                        ) : null}
                        {it.num}
                        {now && <span>Now</span>}
                      </span>
                      <span
                        className={`block text-[13px] leading-snug break-words ${now ? "font-semibold" : C_SOFT}`}
                      >
                        {it.label}
                        {past && <span className="sr-only"> (seen)</span>}
                      </span>
                    </button>
                  </li>
                );
              })}
            </ol>
          </nav>
        );
      }

      function C_useFocusOnMount(focusRef) {
        const ref = useRef(null);
        useEffect(() => {
          if (focusRef.current && ref.current) {
            focusRef.current = false;
            ref.current.focus({ preventScroll: true });
          }
        }, []);
        return ref;
      }

      function C_IntroCard({ l, go, focusRef }) {
        const h = C_useFocusOnMount(focusRef);
        const today = FACTS.today[l.lesson] || [];
        return (
          <div className={`rounded-xl bg-card p-5 text-ink sm:p-6 ${C_RING}`}>
            <p className={`${C_LABEL} text-muted`}>
              Watch the whole lesson first
            </p>
            <h2
              ref={h}
              tabIndex={-1}
              className="mt-2 font-display text-2xl leading-tight text-balance focus:outline-none"
            >
              This is where you’ll be in {l.minutes} minutes
            </h2>
            <p className="mt-3 max-w-[65ch] text-base leading-relaxed">
              <Rich text={l.lede} />
            </p>
            {today.length > 0 && (
              <div className="mt-5">
                <p className={`${C_LABEL} text-muted`}>
                  What you do by hand today
                </p>
                <ul className="mt-2 space-y-1.5">
                  {today.map((t) => (
                    <li
                      key={t}
                      className="flex gap-2 text-base leading-relaxed text-muted"
                    >
                      <Icons.Minus
                        size={16}
                        aria-hidden="true"
                        className="mt-1 shrink-0"
                      />
                      <span>{t}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}
            <p className="mt-5 flex gap-2 rounded-lg bg-tint p-3 text-base leading-relaxed">
              <Icons.Info
                size={18}
                aria-hidden="true"
                className="mt-0.5 shrink-0 text-muted"
              />
              <span>{C_NEED[l.lesson]}</span>
            </p>
            <div className="mt-6 flex flex-wrap items-center gap-3">
              <button type="button" onClick={() => go(1)} className={C_BTN}>
                Start step 1 <Icons.ArrowRight size={16} aria-hidden="true" />
              </button>
            </div>
            <p className={`${C_LABEL} mt-4 text-muted`}>
              Keep Obsidian open beside this page
            </p>
          </div>
        );
      }

      function C_DoCard({ l, step, go, focusRef }) {
        const st = l.steps[step - 1];
        const N = l.steps.length;
        const [open, setOpen] = useState(false);
        const h = C_useFocusOnMount(focusRef);
        const fig = st.figure ? C_parseTable(st.figure) : null;
        const fixId = `C-fixes-${l.lesson}-${step}`;
        return (
          <div
            className={`rounded-xl bg-card p-5 text-ink [overflow-wrap:anywhere] sm:p-6 ${C_RING}`}
          >
            <p className={`${C_LABEL} flex flex-wrap gap-x-2 text-muted`}>
              <span>
                Step {step} of {N}
              </span>
              <span aria-hidden="true">·</span>
              <span className="text-accent">Do it now</span>
            </p>
            <h2
              ref={h}
              tabIndex={-1}
              className="mt-2 font-display text-2xl leading-tight text-balance focus:outline-none"
            >
              {st.title}
            </h2>
            <p className="mt-3 max-w-[65ch] text-base leading-relaxed">
              <Rich text={C_clean(st.action)} />
            </p>

            {fig && (
              <div className="mt-4 space-y-3">
                <p className={`${C_LABEL} text-muted`}>
                  Which part of the note is yours
                </p>
                {fig.body.map((row) => (
                  <div
                    key={row[0]}
                    className="rounded-lg p-3 shadow-[0_0_0_1px_var(--line)]"
                  >
                    <p className="text-base font-semibold">
                      <Rich text={row[0]} />
                    </p>
                    <p className="mt-1 text-base leading-relaxed text-muted">
                      {row[1]}
                    </p>
                    <p className="mt-1 text-base leading-relaxed">
                      <span className="text-muted">ZotLit: </span>
                      {row[2]}
                    </p>
                  </div>
                ))}
              </div>
            )}

            <div className="mt-5 rounded-lg bg-ok-tint p-4">
              <p className={`${C_LABEL} flex items-center gap-1.5 text-ok`}>
                <Icons.Eye size={14} aria-hidden="true" /> You should see
              </p>
              <p className="mt-2 max-w-[65ch] text-base leading-relaxed">
                <Rich text={C_clean(st.check)} />
              </p>
            </div>

            <div className="mt-5 flex flex-wrap gap-3">
              <button
                type="button"
                onClick={() => go(step + 1)}
                className={C_BTN}
              >
                {step === N ? "Done, see the result" : "Done, next step"}{" "}
                <Icons.ArrowRight size={16} aria-hidden="true" />
              </button>
              <button
                type="button"
                aria-expanded={open}
                aria-controls={fixId}
                onClick={() => setOpen((v) => !v)}
                className={C_BTN_QUIET}
              >
                <Icons.Wrench size={16} aria-hidden="true" /> Mine looks
                different
              </button>
            </div>

            {open && (
              <div id={fixId} className="mt-5 border-t border-line pt-4">
                {st.fixes.length > 0 ? (
                  <ul className="space-y-4">
                    {st.fixes.map((f) => (
                      <li key={f.title}>
                        <h3 className="flex gap-2 text-base leading-snug font-semibold">
                          <Icons.CornerDownRight
                            size={16}
                            aria-hidden="true"
                            className="mt-0.5 shrink-0 text-accent"
                          />
                          <span>
                            <Rich text={C_clean(f.title)} />
                          </span>
                        </h3>
                        <p className="mt-1 pl-6 text-base leading-relaxed text-muted">
                          <Rich text={C_clean(f.body)} />
                        </p>
                      </li>
                    ))}
                  </ul>
                ) : (
                  <p className="text-base leading-relaxed text-muted">
                    This step has no known snags. Play the recording again and
                    compare its last frame with your screen. If they still
                    differ, check the step before this one.
                  </p>
                )}
                {step > 1 && (
                  <button
                    type="button"
                    onClick={() => go(step - 1)}
                    className={`mt-4 inline-flex items-center gap-2 rounded-sm text-base font-medium text-accent underline-offset-4 hover:underline ${C_FOCUS}`}
                  >
                    <Icons.RotateCcw size={15} aria-hidden="true" /> Back to
                    step {step - 1}
                  </button>
                )}
              </div>
            )}
          </div>
        );
      }

      function C_End({ l, focusRef }) {
        const N = l.steps.length;
        const next = lessonBy(l.lesson + 1);
        const h = C_useFocusOnMount(focusRef);
        return (
          <div>
            <div className="-mx-4 sm:mx-0">
              <Media
                lesson={l}
                n={N}
                rounded="rounded-none sm:rounded-xl"
                alt={l.end.caption}
              />
            </div>
            <div className="mt-8 grid gap-8 lg:mt-10 lg:grid-cols-[minmax(0,1fr)_minmax(0,26rem)] lg:items-start lg:gap-12">
              <div>
                <span className="grid size-14 place-items-center rounded-full bg-ok text-ground">
                  <Icons.Check size={28} aria-hidden="true" />
                </span>
                <p className={`${C_LABEL} mt-4 ${C_SOFT}`}>
                  Stop {l.lesson} of {LESSONS.length} · Done
                </p>
                <h2
                  ref={h}
                  tabIndex={-1}
                  className="mt-2 font-display text-[clamp(2rem,4vw,3rem)] leading-tight text-balance focus:outline-none"
                >
                  You’ve done it
                </h2>
                <p
                  className={`mt-3 max-w-[60ch] text-lg leading-relaxed ${C_SOFT}`}
                >
                  {l.end.caption}
                </p>
                <div className="mt-6 flex flex-wrap gap-3">
                  <button
                    type="button"
                    onClick={() => setProto({ step: 0 })}
                    className={C_BTN_STAGE}
                  >
                    <Icons.RotateCcw size={16} aria-hidden="true" /> Watch this
                    lesson again
                  </button>
                  <button
                    type="button"
                    onClick={openHub}
                    className={C_BTN_STAGE}
                  >
                    All stops
                  </button>
                </div>
              </div>
              <div
                className={`rounded-xl bg-card p-5 text-ink sm:p-6 ${C_RING}`}
              >
                {next ? (
                  <>
                    <p className={`${C_LABEL} text-muted`}>
                      Next stop · {next.lesson} of {LESSONS.length} ·{" "}
                      {next.minutes} min
                    </p>
                    <div className="mt-3">
                      <C_Thumb l={next} rounded="rounded-lg" />
                    </div>
                    <h3 className="mt-4 font-display text-xl leading-tight text-balance">
                      {next.title}
                    </h3>
                    <p className="mt-2 text-base leading-relaxed text-muted">
                      {l.end.next}
                    </p>
                    <button
                      type="button"
                      onClick={() => openLesson(next.lesson, 0)}
                      className={`${C_BTN} mt-5`}
                    >
                      Start stop {next.lesson}{" "}
                      <Icons.ArrowRight size={16} aria-hidden="true" />
                    </button>
                  </>
                ) : (
                  <>
                    <p className={`${C_LABEL} text-muted`}>
                      End of the journey
                    </p>
                    <h3 className="mt-2 font-display text-xl leading-tight text-balance">
                      Take it to your own projects
                    </h3>
                    <p className="mt-2 text-base leading-relaxed text-muted">
                      {l.end.next}
                    </p>
                    <button
                      type="button"
                      onClick={openHub}
                      className={`${C_BTN} mt-5`}
                    >
                      Back to all stops
                    </button>
                  </>
                )}
              </div>
            </div>
          </div>
        );
      }

      function C_Lesson({ s }) {
        const l = lessonBy(s.lesson) || LESSONS[0];
        const N = l.steps.length;
        const step = Math.max(0, Math.min(N + 1, s.step));
        const isIntro = step === 0;
        const isEnd = step === N + 1;
        const narrow = C_useNarrow();
        const bandRef = useRef(null);
        const focusNext = useRef(false);
        const firstRun = useRef(true);

        useEffect(() => {
          if (isEnd) finishLesson(l.lesson);
        }, [isEnd, l.lesson]);

        // On a step change, bring the stage back into view (the buttons sit below it on a phone).
        useEffect(() => {
          if (firstRun.current) {
            firstRun.current = false;
            return;
          }
          const el = bandRef.current;
          if (!el) return;
          const top = el.getBoundingClientRect().top;
          if (top < 0 || top > window.innerHeight * 0.6)
            el.scrollIntoView({
              block: "start",
              behavior: reducedMotion() ? "auto" : "smooth",
            });
        }, [step]);

        const go = (k) => {
          focusNext.current = true;
          setProto({ step: k });
        };

        const shown = isIntro ? N : step; // the intro plays the lesson's last step: its result
        const playing = hasClip(l, shown);
        const stageLabel = isIntro
          ? playing
            ? "Playing the result · watch first"
            : "The result · watch first"
          : `Step ${step} of ${N} · ${l.steps[step - 1]?.name ?? ""}`;

        return (
          <div className="min-h-screen bg-ground font-body text-ink">
            <header className="mx-auto max-w-[1360px] px-4 pt-5 pb-6 sm:px-6">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <button
                  type="button"
                  onClick={openHub}
                  className={`inline-flex items-center gap-2 rounded-sm text-base font-medium text-muted hover:text-ink ${C_FOCUS}`}
                >
                  <Icons.ArrowLeft size={16} aria-hidden="true" /> All stops
                </button>
                <p className={`${C_LABEL} text-muted`}>
                  Stop {l.lesson} of {LESSONS.length} · {l.minutes} min · {N}{" "}
                  steps
                </p>
              </div>
              <div className="mt-5 flex items-start gap-4">
                <span
                  aria-hidden="true"
                  className={`grid size-12 shrink-0 place-items-center rounded-full font-display text-2xl ${
                    isEnd ? "bg-ok text-ground" : `bg-card ${C_RING}`
                  }`}
                >
                  {isEnd ? <Icons.Check size={22} /> : l.lesson}
                </span>
                <h1 className="min-w-0 font-display text-[clamp(1.6rem,3.2vw,2.5rem)] leading-tight text-balance">
                  {l.title}
                </h1>
              </div>
            </header>

            <section
              ref={bandRef}
              aria-label="Lesson player"
              className={`${C_STAGE} scroll-mt-0`}
            >
              <div className="mx-auto max-w-[1360px] px-4 py-5 sm:px-6 lg:py-8">
                {isEnd ? (
                  <C_End key="end" l={l} focusRef={focusNext} />
                ) : (
                  <div className="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(320px,390px)] lg:items-start lg:gap-8">
                    <div className="min-w-0">
                      <p
                        className={`${C_LABEL} mb-3 flex items-center gap-2 ${C_SOFT}`}
                      >
                        {playing ? (
                          <Icons.Play
                            size={12}
                            aria-hidden="true"
                            className="text-accent"
                          />
                        ) : (
                          <Icons.Eye size={12} aria-hidden="true" />
                        )}
                        <span>{stageLabel}</span>
                      </p>
                      <Media
                        key={`${l.slug}-${shown}`}
                        lesson={l}
                        n={shown}
                        play
                        crop={narrow ? C_stageCrop(l, shown) : undefined}
                        rounded="rounded-lg"
                        alt={
                          isIntro
                            ? `The result of this lesson. ${l.steps[N - 1].alt}`
                            : undefined
                        }
                      />
                      <C_Scrubber l={l} step={step} />
                    </div>
                    {isIntro ? (
                      <C_IntroCard
                        key="intro"
                        l={l}
                        go={go}
                        focusRef={focusNext}
                      />
                    ) : (
                      <C_DoCard
                        key={`step-${step}`}
                        l={l}
                        step={step}
                        go={go}
                        focusRef={focusNext}
                      />
                    )}
                  </div>
                )}
              </div>
            </section>

            {isIntro && l.note && (
              <div className="mx-auto max-w-[1360px] px-4 py-8 sm:px-6">
                <p className={`${C_LABEL} text-muted`}>Good to know</p>
                <p className="mt-2 max-w-[65ch] text-base leading-relaxed text-muted">
                  {l.note}
                </p>
              </div>
            )}
          </div>
        );
      }

      function VariantC() {
        const s = useProto();
        if (s.view === "lesson") return <C_Lesson key={s.lesson} s={s} />;
        return <C_Hub s={s} />;
      }
      // --- Variant C END ---

      // --- Variant D ---
      // Variant D: "Pick a chore". Non-linear and job-based, built for a half-screen window
      // beside Obsidian. Hub = the reader's chores; lesson = a follow-along checklist.

        "focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent";
      const D_ring = "shadow-[0_0_0_1px_var(--line)]";
      const D_label = "font-mono text-xs font-medium uppercase tracking-wider";

      // Draft copy: each chore in the reader's own words, and what ZotLit does once it is done.

        1: {
          pain: "Connect Zotero once",
          does: "ZotLit now finds any paper in your Zotero library and writes its literature note, with your highlights in it.",
        },
        2: {
          pain: "I copy highlights into my notes by hand",
          does: "A highlight you make in Obsidian now shows up in your literature note, with no update to run.",
        },
        3: {
          pain: "I paste citation keys and fix them later",
          does: "You now type [@ and a name. ZotLit writes the key and shows the citation formatted, page included.",
        },
        4: {

          does: "One command now turns your draft into a Word file with formatted citations and a reference list.",
        },
        5: {

          does: "Your reading list now lives in your notes and shows only what you still need to read.",

        },

      // Prerequisites by lesson (from each lesson's `needs`).
      const D_PREREQ = {
        1: [],
        2: [1],
        3: [1, 2],
        4: [1, 2, 3],
        5: [1],

      };

          [0, 0.35, 0.6],
          [0.1, 0.3, 0.6],
        ],
        3: [
          [0.33, 0.3, 0.5],
          [0.5, 0.45, 0.5],
          [0.25, 0.5, 0.5],
          [0.25, 0.35, 0.5],
          [0.45, 0.45, 0.5],
          [0.03, 0.1, 0.55],
        ],
        4: [

          [0.23, 0.03, 0.55],
          [0.23, 0.03, 0.55],
          [0.23, 0.03, 0.55],
          [0.4, 0, 0.6],
          [0.23, 0.03, 0.55],
          [0.4, 0, 0.6],
        ],
        6: [
          [0.23, 0.03, 0.55],
          [0.23, 0.03, 0.55],
          [0.23, 0.03, 0.55],
          [0.5, 0, 0.5],
          [0.03, 0.03, 0.55],
          [0.25, 0.45, 0.55],
        ],
      };

      // The end result of each lesson: a step's final frame and a crop of it (lesson top), plus
      // a tighter crop for the small cards (hub and end block).
      const D_END = {
        1: { n: 6, crop: [0.24, 0.42, 0.52], tn: 6, thumb: [0.24, 0.5, 0.42] },
        2: { n: 7, crop: [0.13, 0.1, 0.55], tn: 7, thumb: [0.15, 0.12, 0.5] },
        3: { n: 6, crop: [0.03, 0.2, 0.5], tn: 6, thumb: [0.04, 0.28, 0.38] },
        4: { n: 5, crop: [0.15, 0.3, 0.65], tn: 5, thumb: [0.18, 0.42, 0.58] },
        5: { n: 6, crop: [0.24, 0.05, 0.72], tn: 5, thumb: [0.24, 0.1, 0.53] },
        6: { n: 6, crop: [0.25, 0.45, 0.55], tn: 6, thumb: [0.26, 0.5, 0.5] },
      };

      // Resolve the <UiLabel …/> and <Command …/> tokens in step strings (values from messages/en.json).
      const D_MSG = {
        settings_citation_engine_status_installed:
          "Pandoc {version} is installed.",
        command_pandoc_export_name: "Export note with citations",
        pandoc_export_style_changed:
          "Only this export uses this style. The note keeps {style}.",
        notice_pandoc_export_done: "Exported {file} with {style} citations.",
        query_view_properties_add_vault: "Add “{name}” vault property",
        query_view_properties_add: "Add “{name}” property",
        annot_view_save_file: "Creates {file}",
        query_view_results: "{count} results",
      };
      const D_clean = (t) =>
        !t
          ? t
          : t
              .replace(
                /<(?:UiLabel|Command)\b[^>]*?m\.(\w+)\(([\s\S]*?)\)\}\s*\/>/g,
                (_, key, args) => {
                  const vals = {};
                  for (const m of args.matchAll(
                    /(\w+):\s*(?:"([^"]*)"|(\d+))/g,
                  ))
                    vals[m[1]] = m[2] ?? m[3];
                  return `**${(D_MSG[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vals[k] ?? "")}**`;
                },
              )
              .replace(/\*\* \./g, "**.")
              // lessons.json now arrives pre-resolved, except this plural message (count: 4).
              .replace("**query_view_results**", "**4 results**");

      const D_lower = (s) => s.charAt(0).toLowerCase() + s.slice(1);
      const D_range = (a, b) =>
        Array.from({ length: Math.max(0, b - a + 1) }, (_, i) => a + i);

      // Viewport >= 1280 px: the lesson gets a sticky media panel beside the checklist.
      const D_mq = window.matchMedia("(min-width: 1280px)");
      function D_useWide() {
        return useSyncExternalStore(
          (f) => (
            D_mq.addEventListener("change", f),
            () => D_mq.removeEventListener("change", f)
          ),
          () => D_mq.matches,
        );
      }

      // The last lesson position this variant set itself. A different (lesson, step) in the store
      // came from outside (switcher scenarios), and then the rows above `step` count as ticked.
      let D_last = "";
      const D_go = (num, step, patch = {}) => {
        D_last = `${num}:${step}`;
        setProto({ view: "lesson", lesson: num, step, ...patch });
      };
      const D_ticksOf = (s, num) => (s.D_ticks ?? {})[num] ?? [];
      // Open a lesson from a card: resume at the first unticked row. A fully ticked lesson opens at
      // its top; if it is not in `done` (a scenario reset the store), its ticks are stale and go.
      const D_open = (s, num) => {
        const l = lessonBy(num);
        const t = new Set(D_ticksOf(s, num));
        const next = l.steps.find((st) => !t.has(st.n));
        if (t.size === 0) return D_go(num, 0);
        if (next) return D_go(num, next.n);
        if (s.done.includes(num)) return D_go(num, 0);
        return D_go(num, 0, { D_ticks: { ...(s.D_ticks ?? {}), [num]: [] } });
      };

      // Two chores to suggest after `num`: prerequisites met first, starting after `num`.
      function D_nextChores(num, done) {
        const order = [2, 3, 4, 5, 6].filter((n) => n !== num);
        const after = [
          ...order.filter((n) => n > num),
          ...order.filter((n) => n < num),
        ];
        const has = new Set([...done, num]);
        const open = after.filter((n) => !has.has(n));
        const ready = open.filter((n) => D_PREREQ[n].every((p) => has.has(p)));
        const rest = open.filter((n) => !ready.includes(n));
        return [...ready, ...rest, ...after.filter((n) => has.has(n))].slice(
          0,
          2,
        );
      }

      // Lesson 2 step 3 is a 968x190 Zotero dialog, not the 1440x860 window: <Media> would crop
      // its middle away, so it shows as a plain still at its own shape.
      const D_NATIVE = new Set(["annotate-pdfs-in-obsidian/3"]);
      function D_Shot(props) {
        const { lesson, n, className = "" } = props;
        if (!D_NATIVE.has(`${lesson.media}/${n}`)) return <Media {...props} />;
        return (
          <figure
            className={`m-0 overflow-hidden rounded-xl bg-card p-3 ${D_ring} ${className}`}
          >
            <img
              src={stillFor(lesson, n)}
              alt={lesson.steps[n - 1]?.alt}
              className="block h-auto w-full"
            />
          </figure>
        );
      }

      function D_DoneBadge() {
        return (
          <span
            className={`inline-flex items-center gap-1 rounded-full bg-ok-tint px-2 py-0.5 text-ok ${D_label}`}
          >
            <Icons.Check size={12} strokeWidth={3} aria-hidden="true" />
            Done
          </span>
        );
      }

      // ---------- Hub ----------

      function D_ChoreCard({ num, done, span }) {
        const l = lessonBy(num);
        const end = D_END[num];
        const s = useProto();
        return (
          <li
            className={`group relative grid gap-4 rounded-2xl bg-card p-4 sm:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] sm:items-start sm:p-5 lg:grid-cols-1 lg:content-start ${D_ring} hover:shadow-[0_0_0_1px_var(--accent)] focus-within:shadow-[0_0_0_1px_var(--accent)] ${span}`}
          >
            <div className="min-w-0">
              <p
                className={`flex flex-wrap items-center gap-x-2 gap-y-1 text-muted ${D_label}`}
              >
                <span>{l.minutes} min</span>
                <span aria-hidden="true">·</span>
                <span>{l.steps.length} steps</span>
                {done && <D_DoneBadge />}
              </p>
              <h3 className="mt-2 font-display text-[1.375rem] leading-tight text-balance text-ink">
                <button
                  type="button"
                  onClick={() => D_open(s, num)}
                  className={`rounded-sm text-left after:absolute after:inset-0 after:rounded-2xl after:content-[''] ${D_focus}`}
                >
                  “{D_CHORE[num].pain}”
                </button>
              </h3>
              <p className="mt-3 max-w-[60ch] text-base leading-relaxed text-muted">
                <span className="font-semibold text-ink">Today you </span>
                {FACTS.today[num].map(D_lower).join(", ")}.
              </p>
              <p className="mt-2 max-w-[60ch] text-base leading-relaxed text-ink">
                <span className={`mr-2 text-accent ${D_label}`}>
                  You end with
                </span>
                {l.end.caption}
              </p>
              <p className="mt-3 inline-flex items-center gap-1.5 text-base font-semibold text-accent">
                {done ? "Open it again" : "Start this chore"}
                <Icons.ArrowRight
                  size={16}
                  aria-hidden="true"
                  className="motion-safe:transition-transform group-hover:translate-x-0.5"
                />
              </p>
            </div>
            <Media
              lesson={l}
              n={end.tn}
              crop={end.thumb}
              alt={`End result: ${l.end.caption}`}
              className="order-first sm:order-none lg:order-first"
            />
          </li>
        );
      }

      function D_Hub() {
        const s = useProto();
        const l1 = lessonBy(1);
        const startDone = s.done.includes(1);
        const doneCount = s.done.length;
        return (
          <div className="mx-auto max-w-[1180px] px-4 py-10 sm:px-6 sm:py-14">
            <p
              className={`flex flex-wrap items-center gap-x-3 gap-y-1 text-muted ${D_label}`}
            >
              <span>ZotLit tutorial</span>
              {doneCount > 0 && (
                <>
                  <span aria-hidden="true">·</span>
                  <span className="text-ok">
                    {doneCount} of {LESSONS.length} done
                  </span>
                </>
              )}
            </p>
            <h1 className="mt-3 max-w-[20ch] font-display text-[2.125rem] leading-[1.1] text-balance sm:text-5xl">
              What slows you down between Zotero and Obsidian?
            </h1>
            <p className="mt-4 max-w-[58ch] text-lg leading-relaxed text-muted">
              Pick the chore you want gone. Each one is a short checklist: keep
              Obsidian open beside this page and tick each step as you do it.
            </p>

            {startDone ? (
              <section
                aria-labelledby="D-start"
                className="mt-8 flex flex-wrap items-center gap-x-4 gap-y-2 rounded-2xl bg-ok-tint px-4 py-3 sm:px-5"
              >
                <span className="grid size-8 shrink-0 place-items-center rounded-full bg-ok text-ground">
                  <Icons.Check size={18} strokeWidth={3} aria-hidden="true" />
                </span>
                <div className="min-w-0 flex-1">
                  <h2
                    id="D-start"
                    className="text-base font-semibold leading-tight"
                  >
                    Start here is done
                  </h2>
                  <p className="text-base leading-relaxed text-muted">
                    ZotLit is connected to your Zotero library.
                  </p>
                </div>
                <button
                  type="button"
                  onClick={() => D_go(1, 0)}
                  className={`rounded-sm text-base font-semibold text-ok underline decoration-1 underline-offset-4 ${D_focus}`}
                >
                  Open it again
                </button>
              </section>
            ) : (
              <section
                aria-labelledby="D-start"
                className={`relative mt-8 grid items-center gap-5 overflow-hidden rounded-2xl bg-card p-4 sm:grid-cols-[minmax(0,1fr)_minmax(0,0.8fr)] sm:p-5 ${D_ring}`}
              >
                <span
                  aria-hidden="true"
                  className="absolute inset-y-0 left-0 w-1 bg-accent"
                />
                <div className="min-w-0 sm:pl-2">
                  <p className={`text-accent ${D_label}`}>
                    Start here · about {l1.minutes} min
                  </p>
                  <h2
                    id="D-start"
                    className="mt-2 font-display text-2xl leading-tight text-balance"
                  >
                    Connect Zotero once
                  </h2>
                  <p className="mt-2 max-w-[52ch] text-base leading-relaxed text-muted">
                    Every chore below starts from this. You end with your first
                    literature note, made from a paper’s highlights, with your
                    own thoughts above them.
                  </p>
                  <button
                    type="button"
                    onClick={() => D_open(s, 1)}
                    className={`mt-4 inline-flex items-center gap-2 rounded-full bg-accent px-5 py-2.5 text-base font-semibold text-accent-ink ${D_focus}`}
                  >
                    Start here
                    <Icons.ArrowRight size={16} aria-hidden="true" />
                  </button>
                </div>
                <Media
                  lesson={l1}
                  n={D_END[1].tn}
                  crop={D_END[1].thumb}
                  alt={`End result: ${l1.end.caption}`}
                />
              </section>
            )}

            <section aria-labelledby="D-chores" className="mt-12">
              <div className="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
                <h2
                  id="D-chores"
                  className="font-display text-[1.75rem] leading-tight text-balance"
                >
                  {startDone ? "Now pick a chore" : "Then pick a chore"}
                </h2>
                <p className={`text-muted ${D_label}`}>In any order</p>
              </div>
              <ul className="mt-5 grid gap-4 lg:grid-cols-6">
                {[2, 3, 4, 5, 6].map((num, i) => (
                  <D_ChoreCard
                    key={num}
                    num={num}
                    done={s.done.includes(num)}
                    span={i < 3 ? "lg:col-span-2" : "lg:col-span-3"}
                  />
                ))}
              </ul>
            </section>

            <footer className="mt-14 grid gap-2 border-t border-line pt-6">
              <p className="max-w-[65ch] text-base leading-relaxed text-muted">
                {FACTS.privacy} {FACTS.license}
              </p>
              <p className={`text-muted ${D_label}`}>{FACTS.requirements}</p>
            </footer>
          </div>
        );
      }

      // ---------- Lesson ----------

      function D_Row({
        l,
        st,
        crop,
        ticked,
        open,
        current,
        wide,
        onTick,
        onOpen,
        onToggleOpen,
        nextOpen,
      }) {
        const [fixOpen, setFixOpen] = useState(false);
        const k = st.n;
        const fixes = st.fixes ?? [];
        return (
          <li
            id={`D-step-${k}`}
            className={`scroll-mt-28 ${open ? `my-3 rounded-2xl bg-card p-4 sm:p-5 ${D_ring}` : "border-b border-line px-1 py-3 sm:px-2"}`}
          >
            <div className="flex items-start gap-3">
              <button
                type="button"
                aria-pressed={ticked}
                aria-label={`Done: step ${k}, ${st.title}`}
                onClick={() => onTick(k)}
                className={`mt-0.5 grid size-7 shrink-0 place-items-center rounded-md ${D_focus} ${
                  ticked
                    ? "bg-ok text-ground"
                    : "bg-card shadow-[inset_0_0_0_1.5px_var(--muted)] hover:shadow-[inset_0_0_0_1.5px_var(--accent)]"
                }`}
              >
                {ticked && (
                  <Icons.Check size={16} strokeWidth={3} aria-hidden="true" />
                )}
              </button>
              <h2 className="min-w-0 flex-1">
                <button
                  type="button"
                  aria-expanded={open}
                  aria-controls={`D-body-${k}`}
                  onClick={() => (open ? onToggleOpen() : onOpen(k))}
                  className={`block w-full rounded-sm text-left ${D_focus}`}
                >
                  <span
                    className={`block ${D_label} ${current && !ticked ? "text-accent" : "text-muted"}`}
                  >
                    Step {k}
                    {ticked ? " · done" : current ? " · now" : ""}
                  </span>
                  <span
                    className={`mt-0.5 block text-lg leading-snug text-balance ${
                      ticked
                        ? "text-muted line-through decoration-muted/60 decoration-1"
                        : "font-semibold text-ink"
                    }`}
                  >
                    {st.title}
                  </span>
                </button>
              </h2>
              {!open && (
                <Icons.ChevronDown
                  size={18}
                  aria-hidden="true"
                  className="mt-2 shrink-0 text-muted"
                />
              )}
            </div>

            {open && (
              <div
                id={`D-body-${k}`}
                className="mt-3 min-w-0 [overflow-wrap:anywhere] sm:pl-10"
              >
                <p className="max-w-[65ch] text-base leading-relaxed">
                  <Rich text={D_clean(st.action)} />
                </p>
                {!wide && (
                  <D_Shot
                    lesson={l}
                    n={k}
                    play
                    crop={crop ?? undefined}
                    className="mt-4"
                  />
                )}
                <div className="mt-4 rounded-xl bg-tint p-4">
                  <p
                    className={`flex items-center gap-1.5 text-muted ${D_label}`}
                  >
                    <Icons.Eye size={14} aria-hidden="true" />
                    In Obsidian you should see
                  </p>
                  <p className="mt-1.5 max-w-[65ch] text-base leading-relaxed">
                    <Rich text={D_clean(st.check)} />
                  </p>
                </div>
                <div className="mt-4 flex flex-wrap items-center gap-x-4 gap-y-3">
                  {ticked ? (
                    <>
                      <span className="inline-flex items-center gap-1.5 text-base font-semibold text-ok">
                        <Icons.CircleCheck size={18} aria-hidden="true" />
                        Ticked
                      </span>
                      <button
                        type="button"
                        onClick={() => onOpen(nextOpen)}
                        className={`inline-flex items-center gap-1.5 rounded-full bg-card px-4 py-2 text-base font-semibold ${D_ring} ${D_focus}`}
                      >
                        {nextOpen > l.steps.length
                          ? "See the end"
                          : `Go to step ${nextOpen}`}
                        <Icons.ArrowDown size={16} aria-hidden="true" />
                      </button>
                    </>
                  ) : (
                    <button
                      type="button"
                      onClick={() => onTick(k)}
                      className={`inline-flex items-center gap-2 rounded-full bg-accent px-4 py-2 text-base font-semibold text-accent-ink ${D_focus}`}
                    >
                      <Icons.Check
                        size={16}
                        strokeWidth={3}
                        aria-hidden="true"
                      />
                      Tick step {k}
                    </button>
                  )}
                  {fixes.length > 0 && (
                    <button
                      type="button"
                      aria-expanded={fixOpen}
                      aria-controls={`D-fix-${k}`}
                      onClick={() => setFixOpen((v) => !v)}
                      className={`inline-flex items-center gap-1 rounded-sm text-base text-muted underline decoration-1 underline-offset-4 hover:text-ink ${D_focus}`}
                    >
                      Not what you see?
                      <Icons.ChevronDown
                        size={16}
                        aria-hidden="true"
                        className={`motion-safe:transition-transform ${fixOpen ? "rotate-180" : ""}`}
                      />
                    </button>
                  )}
                </div>
                {fixes.length > 0 && fixOpen && (
                  <ul id={`D-fix-${k}`} className="mt-3 grid gap-3">
                    {fixes.map((f, i) => (
                      <li key={i} className={`rounded-xl p-4 ${D_ring}`}>
                        <p className="text-base font-semibold leading-snug">
                          <Rich
                            text={D_clean(f.title)}
                            labelClass="font-bold"
                          />
                        </p>
                        <p className="mt-1 max-w-[65ch] text-base leading-relaxed text-muted">
                          <Rich text={D_clean(f.body)} />
                        </p>
                      </li>
                    ))}
                  </ul>
                )}
              </div>
            )}
          </li>
        );
      }

      function D_Lesson() {
        const s = useProto();
        const wide = D_useWide();
        const num = s.lesson;
        const l = lessonBy(num);
        const N = l.steps.length;
        const crops = D_CROPS[num];
        const end = D_END[num];
        const ticks = new Set(D_ticksOf(s, num));
        const doneCount = l.steps.filter((st) => ticks.has(st.n)).length;
        const allDone = doneCount === N;
        const openK = s.step === 0 ? 1 : s.step;
        const [closed, setClosed] = useState(false);
        const [say, setSay] = useState("");
        useEffect(() => setClosed(false), [num, s.step]);

        // A position set from outside (a switcher scenario) counts the rows above it as ticked,
        // and its opening (step 0) starts the lesson fresh.
        useEffect(() => {
          const key = `${num}:${s.step}`;
          if (key === D_last) return;
          D_last = key;
          const upto = Math.min(s.step, N + 1);
          setProto((p) => ({
            D_ticks: { ...(p.D_ticks ?? {}), [num]: D_range(1, upto - 1) },
          }));
          if (s.step === N + 1) finishLesson(num);
        }, [num, s.step]);

        useEffect(() => {
          if (s.step === 0) {
            window.scrollTo({ top: 0 });
            return;
          }
          const id = requestAnimationFrame(() =>
            document.getElementById(`D-step-${s.step}`)?.scrollIntoView({
              block: "start",
              behavior: reducedMotion() ? "auto" : "smooth",
            }),
          );
          return () => cancelAnimationFrame(id);
        }, [num, s.step]);

        // Ticks written by the reader start from what is on screen now.
        const base = () => new Set([...ticks]);
        const firstOpenAfter = (t, k) => {
          const later = l.steps.find((st) => st.n > k && !t.has(st.n));
          const any = l.steps.find((st) => !t.has(st.n));
          return (later ?? any)?.n ?? N + 1;
        };
        const write = (t, step) =>
          D_go(num, step, {
            D_ticks: {
              ...(s.D_ticks ?? {}),
              [num]: [...t].sort((a, b) => a - b),
            },
          });
        const onTick = (k) => {
          const t = base();
          if (t.has(k)) {
            t.delete(k);
            setSay(`Step ${k} is not ticked.`);
            write(t, k);
          } else {
            t.add(k);
            const next = firstOpenAfter(t, k);
            setSay(
              next > N
                ? `Step ${k} done. All ${N} steps are done.`
                : `Step ${k} done. Next: step ${next}, ${l.steps[next - 1].title}.`,
            );
            write(t, next);
            if (t.size === N) finishLesson(num);
          }
        };
        const onOpen = (k) =>
          k === openK ? setClosed(false) : write(base(), k);

        const needsStart = num !== 1 && !s.done.includes(1);
        const nextChores = D_nextChores(num, s.done);
        const panelK =
          s.step >= 1 && s.step <= N ? s.step : s.step === 0 ? 1 : null;

        return (
          <div className="pb-24">
            <header className="sticky top-0 z-20 bg-ground/90 shadow-[0_1px_0_var(--line)] backdrop-blur">
              <div className="mx-auto flex max-w-[1400px] items-center gap-3 px-4 py-2.5 sm:px-6">
                <button
                  type="button"
                  onClick={openHub}
                  className={`inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-1.5 text-base text-muted hover:text-ink ${D_focus}`}
                >
                  <Icons.ArrowLeft size={16} aria-hidden="true" />
                  Chores
                </button>
                <p className="min-w-0 flex-1 font-display text-base leading-tight text-balance">
                  {l.title}
                </p>
                <div className="flex shrink-0 flex-col items-end gap-1">
                  <p
                    className={`whitespace-nowrap ${D_label} ${allDone ? "text-ok" : "text-ink"}`}
                  >
                    {doneCount} of {N} done
                  </p>
                  <span aria-hidden="true" className="flex gap-0.5">
                    {l.steps.map((st) => (
                      <span
                        key={st.n}
                        className={`h-1.5 w-2.5 rounded-full sm:w-3.5 ${
                          ticks.has(st.n)
                            ? "bg-ok"
                            : st.n === openK
                              ? "bg-accent"
                              : "bg-line"
                        }`}
                      />
                    ))}
                  </span>
                </div>
              </div>
            </header>

            <p className="sr-only" aria-live="polite">
              {say}

            <div className="mx-auto max-w-[1400px] px-4 sm:px-6 xl:grid xl:grid-cols-[minmax(0,580px)_minmax(0,1fr)] xl:gap-12">

                <section

              {wide && (

                        Watch it here, then do it in Obsidian and tick the step.

                    <>
                      <p
                        className={`flex items-center gap-2 text-ok ${D_label}`}

                        <Icons.Check

                        {l.end.caption}

      function VariantD() {
        const s = useProto();
        return (
          <div className="min-h-screen bg-ground font-body text-ink antialiased">
            {s.view === "lesson" ? <D_Lesson /> : <D_Hub />}
          </div>
        );
      }
      // --- Variant D END ---

      // --- Variant E ---
      // Variant E: "Your screen, step by step". One step per screen, done right.
      // Hub: an editorial course cover (headline, result collage, journal-style contents).
      // Lesson: opens on its end result, then one screen per step with a tight
      // "Compare your screen" crop, the check line beside it, and inline fixes.

      const E_FOCUS =
        "focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent";
      const E_RING = "shadow-[0_0_0_1px_var(--line)]";
      const E_LABEL = "font-mono text-xs font-medium uppercase tracking-wider";
      const E_BTN = `inline-flex min-h-11 items-center justify-center gap-2 rounded-[10px] px-5 py-2.5 text-base font-semibold motion-safe:transition-transform motion-safe:duration-150 motion-safe:active:scale-[0.96] ${E_FOCUS}`;
      const E_BTN_PRIMARY = `${E_BTN} bg-ink text-ground hover:bg-ink/90`;
      const E_BTN_SECONDARY = `${E_BTN} border border-transparent bg-card text-ink ${E_RING} hover:bg-tint`;
      const E_QUIET = `inline-flex min-h-9 items-center gap-1.5 rounded-[8px] text-base text-muted underline decoration-line underline-offset-4 hover:text-ink hover:decoration-current ${E_FOCUS}`;

      const E_pad = (n) => String(n).padStart(2, "0");

      // Short names for the course rail.
      const E_SHORT = {
        1: "Connect",
        2: "Annotate",
        3: "Cite",
        4: "Export to Word",
        5: "Reading list",
        6: "Review table",
      };

      // "You end with" lines for the contents page (draft copy).
      const E_RESULT = {
        1: "A literature note with your own thoughts above the highlights",
        2: "A highlight made in Obsidian that shows in Zotero and in your note",
        3: "A draft with a cited page number and a quoted highlight",
        4: "A Word file with formatted citations and a reference list",
        5: "A reading list filtered to what you still need to read",
        6: "A review table of your papers, pasted into your chapter",
      };

      // Close-up crops per step, chosen from the final frames: [x, y, w] of the window.
      const E_CROPS = {
        "connect-zotero-to-obsidian": {
          1: [0.28, 0.17, 0.46],
          2: [0.24, 0.08, 0.54],
          3: [0.245, 0.48, 0.52],
          4: [0.5, 0.1, 0.5],
          5: [0.25, 0, 0.75],
          6: [0.25, 0.48, 0.52],
        },
        "annotate-pdfs-in-obsidian": {
          1: [0.52, 0.03, 0.44],
          2: [0.52, 0.03, 0.44],
          4: [0.08, 0.42, 0.34],
          5: [0.6, 0.6, 0.4],
          6: [0, 0.42, 0.5],
          7: [0.15, 0.12, 0.5],
        },
        "cite-while-writing": {
          1: [0.34, 0.38, 0.48],
          2: [0.6, 0.6, 0.4],
          3: [0.26, 0.56, 0.44],
          4: [0.26, 0.44, 0.5],
          5: [0.5, 0.44, 0.46],
          6: [0.04, 0.28, 0.4],
        },
        "export-to-word-with-a-bibliography": {
          1: [0.13, 0.08, 0.56],
          2: [0.29, 0.29, 0.42],
          3: [0.29, 0.28, 0.42],
          4: [0.6, 0, 0.4],
          5: [0.17, 0.27, 0.66],
        },
        "track-reading-status": {
          1: [0.24, 0, 0.54],
          2: [0.24, 0.04, 0.54],
          3: [0.38, 0.06, 0.4],
          4: [0.42, 0, 0.58],
          5: [0.38, 0.06, 0.4],
          6: [0.38, 0.04, 0.58],
        },
        "build-a-literature-review-table": {
          1: [0.24, 0, 0.54],
          2: [0.24, 0.06, 0.54],
          3: [0.24, 0.06, 0.54],
          4: [0.44, 0, 0.56],
          5: [0.03, 0.06, 0.6],
          6: [0.26, 0.46, 0.54],
        },
      };
      const E_cropFor = (l, n) => E_CROPS[l.media]?.[n];

      // Recordings that are not an Obsidian window: shown whole at their own ratio.
      const E_NATURAL = { "annotate-pdfs-in-obsidian/3": 968 / 190 };

      // The lesson MDX carries a few <UiLabel>/<Command> tags; show their English text.
      const E_UI = {
        annot_view_save_file: "Creates {file}",
        settings_citation_engine_status_installed:
          "Pandoc {version} is installed.",
        command_pandoc_export_name: "Export note with citations",
        pandoc_export_style_changed:
          "Only this export uses this style. The note keeps {style}.",
        notice_pandoc_export_done: "Exported {file} with {style} citations.",
        query_view_results: "{count} results",
        query_view_properties_add: "Add “{name}” property",
        query_view_properties_add_vault: "Add “{name}” vault property",
      };
      function E_clean(text) {
        if (!text) return text;
        return text
          .replace(
            /<(?:UiLabel|Command inline) name=\{m\.(\w+)\(([\s\S]*?)\)\} \/>/g,
            (_, key, args) => {
              const vals = {};
              for (const [, k, v] of args.matchAll(/(\w+):\s*"([^"]*)"/g))
                vals[k] = v;
              for (const [, k, v] of args.matchAll(/(\w+):\s*(\d+)/g))
                vals[k] = v;
              const tpl = E_UI[key] ?? key;
              return `**${tpl.replace(/\{(\w+)\}/g, (m, k) => vals[k] ?? m)}**`;
            },
          )
          .replace(/\*\* \./g, "**.");
      }
      function E_Rich({ text }) {
        return <Rich text={E_clean(text)} />;
      }

      // A step picture: the recording (cropped or whole), or a natural-ratio still.
      function E_Shot({
        lesson,
        n,
        close = true,
        play = false,
        rounded = "rounded-xl",
      }) {
        const ratio = E_NATURAL[`${lesson.media}/${n}`];
        if (ratio) {
          return (
            <figure
              className={`relative overflow-hidden bg-card ${E_RING} ${rounded}`}
              style={{ aspectRatio: ratio, margin: 0 }}
            >
              <img
                src={stillFor(lesson, n)}
                alt={lesson.steps[n - 1]?.alt}
                className="block size-full object-contain"
              />
            </figure>
          );
        }
        return (
          <Media
            key={`${lesson.slug}-${n}`}
            lesson={lesson}
            n={n}
            play={play}
            crop={close ? E_cropFor(lesson, n) : undefined}
            rounded={rounded}
          />
        );
      }

      // ---------- Hub ----------

      function E_Collage() {
        const items = [
          {
            l: 1,
            n: 6,
            cap: "Your thoughts above the highlights",
            cls: "self-start -rotate-[1.2deg]",
          },
          {
            l: 3,
            n: 6,
            cap: "A highlight quoted with its citation",
            cls: "self-end rotate-[0.9deg] -mt-[8%]",
          },
          {
            l: 6,
            n: 6,
            cap: "A review table in your chapter",
            cls: "self-center -rotate-[0.5deg] -mt-[8%]",
          },
        ];
        return (
          <div
            className="flex flex-col px-3 py-2"
            role="group"
            aria-label="Results from three of the lessons"
          >
            {items.map((it, i) => {
              const l = lessonBy(it.l);
              return (
                <div
                  key={it.l}
                  className={`relative w-[80%] rounded-[16px] bg-card p-1.5 ${E_RING} ${it.cls}`}
                  style={{ zIndex: i + 1 }}
                >
                  <p
                    className={`px-2 pt-1 pb-2 ${E_LABEL} text-[0.68rem] text-muted`}
                  >
                    <span className="text-accent">Lesson {E_pad(it.l)}</span> ·{" "}
                    {it.cap}
                  </p>
                  <E_Shot lesson={l} n={it.n} rounded="rounded-[10px]" />
                </div>
              );
            })}
          </div>
        );
      }

      function E_Contents({ done, nextNum }) {
        return (
          <section aria-labelledby="E-contents" className="mt-16 lg:mt-24">
            <div className="flex flex-wrap items-baseline justify-between gap-x-6 gap-y-1 border-b border-ink pb-2">
              <h2
                id="E-contents"
                className="font-display text-3xl leading-tight text-balance"
              >
                Contents
              </h2>
              <p className={`${E_LABEL} text-muted`}>
                Lesson · you end with · minutes
              </p>
            </div>
            <ol className="divide-y divide-line border-b border-line">
              {LESSONS.map((l) => {
                const isDone = done.includes(l.lesson);
                const isNext =
                  !isDone && l.lesson === nextNum && done.length > 0;
                return (
                  <li key={l.lesson}>
                    <button
                      type="button"
                      onClick={() => openLesson(l.lesson, 0)}
                      className={`group grid w-full grid-cols-[3.25rem_minmax(0,1fr)] gap-x-3 rounded-[8px] py-5 text-left hover:bg-tint/60 sm:grid-cols-[5rem_minmax(0,1fr)] sm:gap-x-4 ${E_FOCUS}`}
                    >
                      <span className="flex flex-col items-start gap-2 pl-1">
                        <span
                          className="font-mono text-2xl leading-none text-accent sm:text-3xl"
                          aria-hidden="true"
                        >
                          {E_pad(l.lesson)}
                        </span>
                        {isDone && (
                          <span className="inline-flex flex-col items-start gap-0.5 font-mono text-[0.68rem] font-medium uppercase tracking-wider text-ok">
                            <Icons.CircleCheck
                              size={16}
                              strokeWidth={2}
                              aria-hidden="true"
                            />
                            Done
                          </span>
                        )}
                        {isNext && (
                          <span className="font-mono text-[0.68rem] font-medium uppercase tracking-wider text-accent">
                            Next
                          </span>
                        )}
                      </span>
                      <span className="min-w-0 pr-1">
                        <span className="flex items-end gap-3">
                          <span className="font-display text-xl leading-tight text-balance group-hover:text-accent sm:text-2xl">
                            <span className="sr-only">Lesson {l.lesson}: </span>
                            {l.title}
                          </span>
                          <span
                            aria-hidden="true"
                            className="mb-[0.45em] min-w-6 flex-1 border-b-2 border-dotted border-line"
                          />
                          <span className="shrink-0 pb-0.5 font-mono text-sm whitespace-nowrap text-muted">
                            {l.minutes} min
                          </span>
                        </span>
                        <span className="mt-2 block max-w-[65ch] text-base leading-relaxed text-muted">
                          <span
                            className={`${E_LABEL} mr-2 text-[0.68rem] text-ink`}
                          >
                            You end with
                          </span>
                          {E_RESULT[l.lesson]}
                        </span>
                      </span>
                    </button>
                  </li>
                );
              })}
            </ol>
          </section>
        );
      }

      function E_Hub({ s }) {
        const total = LESSONS.reduce((a, l) => a + l.minutes, 0);
        const next = LESSONS.find((l) => !s.done.includes(l.lesson));
        const cta =
          s.done.length === 0
            ? { label: "Start lesson 1", n: 1 }
            : next
              ? { label: `Continue lesson ${next.lesson}`, n: next.lesson }
              : { label: "Start lesson 1 again", n: 1 };
        const ctaLesson = lessonBy(cta.n);
        return (
          <main className="mx-auto max-w-[76rem] px-4 pb-28 sm:px-8">

              <div className="flex flex-wrap items-baseline justify-between gap-x-6 gap-y-1 border-b border-ink pt-6 pb-2">
                <p className={E_LABEL}>
                  <span className="text-accent">ZotLit</span> · A short course

                <p className={`${E_LABEL} text-muted`}>
                  Six lessons · {total} minutes in all

              <div

                className="mt-[3px] border-b border-line"

                  For people who already use Zotero and Obsidian
                </p>
                <h1 className="mt-4 font-display text-[clamp(2.25rem,6vw,3.75rem)] leading-[1.08] text-balance">
                  Read, annotate and cite without leaving Obsidian

                <p className="mt-5 max-w-[52ch] text-lg leading-relaxed text-muted">

                  result on your screen: a literature note, a cited draft, a

              <E_Collage />
            </section>

            <E_Contents done={s.done} nextNum={next?.lesson} />
          </main>
        );
