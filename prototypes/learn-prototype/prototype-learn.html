    <!--
      ROUND 1 VERDICT (2026-11-12): a merge. Owner: "nextjs doesn't suit our needs since it's
      for a tech lib" (A out). Owner agreed with the merge proposed: D's chore hub ("Start
      here" lesson 1, then pick a chore) and D's ticked checklist lesson, opened by B's
      "today / instead" lists without the counts; C out. E's close-up switch replaced: "E
      Manual close-up is wrong. You should plan the tutorial video, Full screen as default
      and zoom in when you need it, similar to Screen Studio." And: "when you record it, you
      should not put the cursor back to the edges when the video ends." Built for real on
      docs/learn-checklist (site) and docs/learn-recordings (recorder + clips).
      PROTOTYPE — throwaway. Round 1 (2026-11-12).
      Question: what shape should the ZotLit tutorial (/learn hub + a lesson) take for a
      reader who already uses Zotero and Obsidian and comes to see whether ZotLit removes
      the friction between them? Owner: today's tutorial "is poorly designed and not
      considered from our target users"; reference: how nextjs.org/learn is crafted.
      Today: a hub of six feature-titled cards; a lesson cover with a Zotero → Obsidian box
      map and a "You need" version table; then one step per screen with a full-window
      screenshot too small to read, a green check box, and "I see it. Next".
      Axes the five variants disagree on: where the payoff sits against the setup work;
      linear course vs pick-your-job; long-scroll chapter vs one step per screen vs player;
      how the reader checks their own screen.
      Design plan (the live docs "Journal" system):
        tokens  ground #f7f5f0 · card #ffffff · ink #1b2029 · muted #5f6672
                line #e3dfd6 · accent #b9461a · ok #2f6b3a (dark values below)
        type    Gelasio (display) · Inter (body, UI) · IBM Plex Mono (labels)
        media   real lesson clips via ./media (public/img/learn) and their final frames
                in ./frames (window-only, 1440x860), so a still can be zoomed to a region.
      Copy: step text is the shipped MDX; any new line is a draft for Gemini to rewrite.
      Run: python3 -m http.server -d apps/docs/.scratch/learn-proto 4841
    -->

      //         (0–1), w = width fraction shown. Omit for the whole window.
      //   The frame keeps the window's 1440:860 ratio (or the crop's ratio) — no layout shift.
      function Media({
        lesson,
        n,
        play = false,
        crop,
        className = "",
        rounded = "rounded-xl",
        alt,

        const clip = play ? clipFor(lesson, n) : null;

          if (on) v.play().catch(() => {});

        const [x, y, w] = crop ?? [0, 0, 1];
        const [fw, fh] = SIZE[`${lesson.media}/${n}`] ?? [1440, 860];
        const ratio = fw / fh; // a crop scales uniformly, so the frame keeps the still's ratio
        const scale = 1 / w;

          width: "100%",
          height: "100%",
          transformOrigin: "0 0",
          transform: crop
            ? `scale(${scale}) translate(${-x * 100}%, ${-y * 100}%)`

        const label = alt ?? lesson.steps[n - 1]?.alt;

              </button>

      function Rich({ text, labelClass = "font-semibold" }) {
        if (!text) return null;
        const parts = text.split(/(\*\*[^*]+\*\*|`[^`]+`|\*[^*]+\*)/g);
        return parts.map((p, i) => {
          if (p.startsWith("**"))
            return (
              <strong key={i} className={labelClass}>
                {p.slice(2, -2)}
              </strong>
            );

                key={i}
                className="rounded bg-tint px-1 py-0.5 font-mono text-[0.88em]"

                {p.slice(1, -1)}

          return <React.Fragment key={i}>{p}</React.Fragment>;

          quiz: { after: 3, others: [1, 2], crop: [0.24, 0.08, 0.35] },
          why: {
            after: 4,
            q: "But wait, will this table go stale?",
            a: [
              "The table reads from Zotero each time it opens, so new papers show up. Your ratings live in each paper’s literature note; your Zotero library stays as it was.",
              "The copy you paste into your draft is a snapshot. Copy it again before you send the draft.",
            ],
          },
          teaser: null,
          payoff: 6,
        },
      };

      const A_MSG = {
        settings_citation_engine_status_installed: (a) =>
          `Pandoc ${a.version} is installed.`,
        command_pandoc_export_name: () => "Export note with citations",
        pandoc_export_style_changed: (a) =>
          `Only this export uses this style. The note keeps ${a.style}.`,
        notice_pandoc_export_done: (a) =>
          `Exported ${a.file} with ${a.style} citations.`,
        query_view_properties_add_vault: (a) =>
          `Add "${a.name}" vault property`,
        query_view_properties_add: (a) => `Add "${a.name}" property`,
        annot_view_save_file: (a) => `Creates ${a.file}`,
        query_view_results: (a) =>
          `${a.count} result${a.count === "1" ? "" : "s"}`,
      };

      // Turn the MDX components left in step strings into **UI labels**.
      function A_clean(text) {
        if (!text) return text;
        return text
          .replace(
            /<(?:UiLabel|Command)[^>]*?name=\{m\.(\w+)\(([\s\S]*?)\)\}\s*\/>/g,
            (_, key, args) => {
              const a = {};
              for (const m of args.matchAll(/(\w+):\s*(?:"([^"]*)"|(\d+))/g))
                a[m[1]] = m[2] ?? m[3];
              const f = A_MSG[key];
              return f ? `**${f(a)}**` : "";
            },
          )
          .replace(/\s+\./g, ".")
          .trim();
      }

      const A_icon = (name) => Icons[name] || Icons.Circle;
      const A_crop = (num, n) => A_CROPS[num]?.[n] ?? undefined;
      const A_shape = (num, n) => A_SHAPE[`${num}/${n}`] ?? "";
      const A_two = (n) => String(n).padStart(2, "0");

      function A_StepMedia({ lesson, n, play, rounded = "rounded-xl", alt }) {
        return (
          <Media
            lesson={lesson}
            n={n}
            play={play}
            crop={A_crop(lesson.lesson, n)}
            rounded={rounded}
            alt={alt}
            className={`w-full ${A_shape(lesson.lesson, n)}`}
          />
        );
      }

      // ---------------------------------------------------------------- Hub

      function A_Hub() {
        const p = useProto();
        const total = LESSONS.reduce((s, l) => s + l.minutes, 0);
        const next = LESSONS.find((l) => !p.done.includes(l.lesson));
        const l1 = lessonBy(1);
        const l3 = lessonBy(3);
        const cta =
          p.done.length === 0
            ? { label: "Start lesson 1", num: 1 }
            : next
              ? {
                  label: `Continue with lesson ${next.lesson}`,
                  num: next.lesson,
                }
              : { label: "Go over lesson 1 again", num: 1 };

        return (
          <div className="mx-auto max-w-6xl px-4 pb-28 sm:px-6">
            <header className="flex items-center justify-between border-b border-line py-5">
              <span className={`${A_LABEL} text-ink`}>
                ZotLit <span className="text-muted">· Learn</span>
              </span>
              <span className={`${A_LABEL} text-muted`}>
                {p.done.length} of {LESSONS.length} done
              </span>
            </header>

            <section className="pt-14 sm:pt-20">
              <p className={`${A_LABEL} text-accent`}>
                Free course · {LESSONS.length} lessons · under an hour
              </p>
              <h1 className="mt-4 max-w-4xl font-display text-[2.6rem] leading-tight font-semibold tracking-tight text-balance text-ink sm:text-6xl">
                Read, note and cite your Zotero papers in Obsidian
              </h1>
              <p className="mt-5 max-w-[60ch] text-lg leading-relaxed text-muted">
                Six short lessons for people who already use both apps, {total}{" "}
                minutes in all. Keep Obsidian open beside this page and follow
                along with your own papers.
              </p>
              <div className="mt-8 flex flex-wrap items-center gap-x-5 gap-y-3">
                <button
                  type="button"
                  onClick={() => openLesson(cta.num, 0)}
                  className={`inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base font-medium text-accent-ink ${A_FOCUS}`}
                >
                  {cta.label}
                  <Icons.ArrowRight size={18} aria-hidden="true" />
                </button>
                {p.done.length > 0 && (
                  <span className="inline-flex items-center gap-1.5 text-base text-muted">
                    <Icons.CircleCheck
                      size={18}
                      className="text-ok"
                      aria-hidden="true"
                    />
                    {p.done.length === LESSONS.length
                      ? "You’ve finished every lesson"
                      : `${p.done.length > 1 ? "Lessons" : "Lesson"} ${[...p.done].sort().join(", ")} done`}
                  </span>
                )}
              </div>
            </section>

            {/* What you'll have: a framed mock of the vault, built from real crops */}
            <figure className="mt-14 sm:mt-16">
              <div className={`overflow-hidden rounded-2xl bg-card ${A_RING}`}>
                <div className="flex items-center justify-between gap-3 border-b border-line px-4 py-3 sm:px-5">
                  <span className={`${A_LABEL} truncate text-muted`}>
                    Your vault after the course
                  </span>
                  <span className="flex shrink-0 gap-1.5" aria-hidden="true">
                    <span className="size-2.5 rounded-full bg-line" />
                    <span className="size-2.5 rounded-full bg-line" />
                    <span className="size-2.5 rounded-full bg-line" />
                  </span>
                </div>
                <div className="grid gap-3 p-3 sm:grid-cols-2 sm:p-4 lg:grid-cols-[2fr_1fr] lg:items-start">
                  <div className="sm:col-span-2 lg:col-span-1 lg:row-span-2">
                    <Media
                      lesson={l1}
                      n={6}
                      play
                      crop={A_crop(1, 6)}
                      rounded="rounded-lg"
                      className="w-full"
                    />
                  </div>
                  <Media
                    lesson={l1}
                    n={2}
                    crop={[0.25, 0.08, 0.38]}
                    rounded="rounded-lg"
                    className="w-full"
                  />
                  <Media
                    lesson={l3}
                    n={6}
                    crop={A_crop(3, 6)}
                    rounded="rounded-lg"
                    className="w-full"
                  />
                </div>
              </div>
              <figcaption className="mt-3 max-w-[65ch] text-sm leading-relaxed text-muted">
                <span className={`${A_LABEL} mr-2 text-ink`}>Figure 1.</span>A
                literature note with your own thoughts above the paper’s
                highlights (lesson 1), your Zotero library in a tab (lesson 1),
                and a chapter draft with a citation and a quoted highlight
                (lesson 3).
              </figcaption>
            </figure>

            <section className="mt-20 grid gap-10 lg:grid-cols-[1fr_2fr]">
              <h2 className="font-display text-3xl leading-tight font-semibold text-balance text-ink">
                What you’ll be able to do
              </h2>
              <ul className="grid gap-x-10 gap-y-7 sm:grid-cols-2">
                {[
                  [
                    "Library",
                    "Search your Zotero library and read its PDFs in Obsidian, even with Zotero closed.",
                  ],
                  [
                    "NotebookPen",
                    "Turn a paper’s highlights into a literature note, with your own thoughts kept apart.",
                  ],
                  [
                    "Quote",
                    "Cite with page numbers as you write, then send a Word file with its reference list.",
                  ],
                  [
                    "Table2",
                    "Track what you’ve read and compare papers side by side in a table.",
                  ],
                ].map(([icon, text]) => {
                  const I = A_icon(icon);
                  return (
                    <li key={icon} className="flex gap-4">
                      <span
                        className={`grid size-10 shrink-0 place-items-center rounded-full bg-card text-accent ${A_RING}`}
                      >
                        <I size={18} aria-hidden="true" />
                      </span>
                      <p className="text-base leading-relaxed text-ink">
                        {text}
                      </p>
                    </li>
                  );
                })}
              </ul>
            </section>

            <section className="mt-20">
              <div className="flex flex-wrap items-baseline justify-between gap-3 border-b border-line pb-4">
                <h2 className="font-display text-3xl leading-tight font-semibold text-balance text-ink">
                  Lessons
                </h2>
                <span className={`${A_LABEL} text-muted`}>
                  Take them in order
                </span>
              </div>
              <ol className="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                {LESSONS.map((l) => {
                  const c = A_COURSE[l.lesson];
                  const isDone = p.done.includes(l.lesson);
                  const isNext = !isDone && next?.lesson === l.lesson;
                  return (
                    <li
                      key={l.slug}
                      className={`relative flex flex-col rounded-2xl bg-card p-6 ${A_RING} ${isNext ? "shadow-[0_0_0_2px_var(--accent)]" : ""}`}
                    >
                      <div className="flex items-center justify-between gap-3">
                        <span
                          className="font-display text-4xl leading-none text-accent"
                          aria-hidden="true"
                        >
                          {A_two(l.lesson)}
                        </span>
                        {isDone ? (
                          <span
                            className={`inline-flex items-center gap-1 rounded-full bg-ok-tint px-2.5 py-1 text-ok ${A_LABEL}`}
                          >
                            <Icons.Check size={14} aria-hidden="true" /> Done
                          </span>
                        ) : isNext ? (
                          <span
                            className={`inline-flex items-center gap-1 rounded-full bg-tint px-2.5 py-1 text-accent ${A_LABEL}`}
                          >
                            <Icons.ArrowRight size={14} aria-hidden="true" /> Up
                            next
                          </span>
                        ) : (
                          <span className={`${A_LABEL} text-muted`}>
                            {l.minutes} min
                          </span>
                        )}
                      </div>
                      <h3 className="mt-5 font-display text-xl leading-tight font-semibold text-balance text-ink">
                        <button
                          type="button"
                          onClick={() => openLesson(l.lesson, 0)}
                          className={`text-left after:absolute after:inset-0 after:rounded-2xl ${A_FOCUS}`}
                        >
                          <span className="sr-only">Lesson {l.lesson}: </span>
                          {c.short}
                        </button>
                      </h3>
                      <p className="mt-2 text-base leading-relaxed text-muted">
                        {c.outcome}
                      </p>
                    </li>
                  );
                })}
              </ol>
            </section>

            <footer className="mt-20 grid gap-2 border-t border-line pt-6 text-sm leading-relaxed text-muted">
              <p>
                <span className={`${A_LABEL} mr-2 text-ink`}>You need</span>
                {FACTS.requirements}
              </p>
              <p>
                {FACTS.privacy} {FACTS.license}
              </p>
            </footer>
          </div>
        );
      }

      // ---------------------------------------------------------------- Lesson parts

      function A_Fixes({ fixes, id }) {
        const [open, setOpen] = useState(false);
        if (!fixes.length) return null;
        return (
          <div className="mt-4">
            <button
              type="button"
              aria-expanded={open}
              aria-controls={id}
              onClick={() => setOpen((v) => !v)}
              className={`inline-flex items-center gap-1.5 rounded text-base text-muted hover:text-ink ${A_FOCUS}`}
            >
              <Icons.ChevronDown
                size={16}
                aria-hidden="true"
                className={`motion-safe:transition-transform ${open ? "rotate-180" : ""}`}
              />
              Something else on your screen?
            </button>
            {open && (
              <ul
                id={id}
                className="mt-3 grid gap-3 border-l-2 border-line pl-4"
              >
                {fixes.map((f, i) => (
                  <li key={i} className="max-w-[65ch]">
                    <p className="text-base leading-relaxed font-medium text-ink">
                      <Rich text={A_clean(f.title)} />
                    </p>
                    <p className="text-base leading-relaxed text-muted">
                      <Rich text={A_clean(f.body)} />
                    </p>
                  </li>
                ))}
              </ul>
            )}
          </div>
        );
      }

      function A_Why({ why }) {
        return (
          <aside className="mt-12 rounded-2xl bg-tint p-6 sm:p-8">
            <div className="flex items-start gap-4">
              <span
                className={`grid size-10 shrink-0 place-items-center rounded-full bg-card text-accent ${A_RING}`}
              >
                <Icons.Lightbulb size={18} aria-hidden="true" />
              </span>
              <div className="min-w-0">
                <h3 className="font-display text-xl leading-tight font-semibold italic text-balance text-ink">
                  {why.q}
                </h3>
                {why.a.map((t, i) => (
                  <p
                    key={i}
                    className="mt-3 max-w-[65ch] text-base leading-relaxed text-ink"
                  >
                    {t}
                  </p>
                ))}
              </div>
            </div>
          </aside>
        );
      }

      function A_Quiz({ lesson }) {
        const q = A_COURSE[lesson.lesson].quiz;
        const target = lesson.steps[q.after - 1];
        // Fixed order per lesson, so the answer is not always in the same place.
        const order = useMemo(() => {
          const list = [q.others[0], q.others[1]];
          list.splice(lesson.lesson % 3, 0, q.after);
          return list;
        }, [lesson.lesson]);
        const [pick, setPick] = useState(null);
        const [checked, setChecked] = useState(false);
        const right = pick === q.after;
        const letters = ["A", "B", "C"];

        return (
          <section
            className={`mt-12 rounded-2xl bg-card p-5 sm:p-8 lg:-mx-24 ${A_RING}`}
            aria-labelledby={`A-quiz-${lesson.lesson}`}
          >
            <p className={`${A_LABEL} text-accent`}>Check your screen</p>
            <h3
              id={`A-quiz-${lesson.lesson}`}
              className="mt-2 font-display text-2xl leading-tight font-semibold text-balance text-ink"
            >
              You just did “{target.title.toLowerCase()}”. Which of these
              matches your screen?
            </h3>
            <div className="mt-6 grid gap-3 sm:grid-cols-3">
              {order.map((n, i) => {
                const on = pick === n;
                return (
                  <button
                    key={n}
                    type="button"
                    aria-pressed={on}
                    onClick={() => {
                      setPick(n);
                      setChecked(false);
                    }}
                    className={`rounded-xl p-2 text-left ${on ? "bg-tint shadow-[0_0_0_2px_var(--accent)]" : `bg-ground ${A_RING}`} ${A_FOCUS}`}
                  >
                    <Media
                      lesson={lesson}
                      n={n}
                      crop={q.crop}
                      rounded="rounded-lg"
                      className="w-full"
                    />
                    <span className="mt-2 flex items-center justify-between px-1 pb-0.5 text-base text-ink">
                      <span className="font-medium">Option {letters[i]}</span>
                      {on && (
                        <span
                          className={`inline-flex items-center gap-1 text-accent ${A_LABEL}`}
                        >
                          <Icons.Check size={14} aria-hidden="true" /> Chosen
                        </span>
                      )}
                    </span>
                  </button>
                );
              })}
            </div>
            <div className="mt-6 flex flex-wrap items-start gap-4">
              <button
                type="button"
                disabled={pick == null}
                onClick={() => setChecked(true)}
                className={`rounded-full bg-ink px-5 py-2.5 text-base font-medium text-ground disabled:cursor-not-allowed disabled:opacity-40 ${A_FOCUS}`}
              >
                Check answer
              </button>
              <div role="status" className="min-w-0 flex-1 basis-64">
                {checked && (
                  <p
                    className={`flex items-start gap-2 rounded-xl px-4 py-3 text-base leading-relaxed ${right ? "bg-ok-tint text-ink" : "bg-tint text-ink"}`}
                  >
                    {right ? (
                      <Icons.CircleCheck
                        size={20}
                        className="mt-0.5 shrink-0 text-ok"
                        aria-hidden="true"
                      />
                    ) : (
                      <Icons.X
                        size={20}
                        className="mt-0.5 shrink-0 text-accent"
                        aria-hidden="true"
                      />
                    )}
                    <span>
                      <strong className="font-semibold">
                        {right
                          ? "Right. "
                          : `Not quite: that screen comes from step ${pick}. `}
                      </strong>
                      {right ? "" : "Look for this: "}
                      <Rich text={A_clean(target.check)} />
                    </span>
                  </p>
                )}
              </div>
            </div>
          </section>
        );
      }

      function A_Step({ lesson, step, current }) {
        const c = A_COURSE[lesson.lesson];
        const N = lesson.steps.length;
        return (
          <section
            id={`A-step-${step.n}`}
            data-astep={step.n}
            className="scroll-mt-4 pt-16 sm:pt-20"
            aria-labelledby={`A-h-${step.n}`}
          >
            <p className={`${A_LABEL} flex items-center gap-2 text-muted`}>
              <span className={current ? "text-accent" : ""}>
                Step {step.n} of {N}
              </span>
              {current && <span className="text-accent">· You are here</span>}
            </p>
            <h2
              id={`A-h-${step.n}`}
              className="mt-2 font-display text-3xl leading-tight font-semibold text-balance text-ink"
            >
              {step.title}
            </h2>
            <p className="mt-4 max-w-[65ch] text-base leading-relaxed text-ink">
              <Rich text={A_clean(step.action)} />
            </p>
            <div className="mt-6">
              <A_StepMedia lesson={lesson} n={step.n} play={current} />
            </div>
            <div className="mt-6 rounded-xl bg-ok-tint px-5 py-4">
              <p className={`${A_LABEL} flex items-center gap-2 text-ok`}>
                <Icons.MonitorCheck size={16} aria-hidden="true" /> Your screen
                should now show…
              </p>
              <p className="mt-2 max-w-[65ch] text-base leading-relaxed text-ink">
                <Rich text={A_clean(step.check)} />
              </p>
            </div>
            <A_Fixes
              fixes={step.fixes}
              id={`A-fix-${lesson.lesson}-${step.n}`}
            />
            {c.why.after === step.n && <A_Why why={c.why} />}
            {c.quiz.after === step.n && <A_Quiz lesson={lesson} />}
          </section>
        );
      }

      function A_End({ lesson }) {
        const num = lesson.lesson;
        const N = lesson.steps.length;
        const nextL = lessonBy(num + 1);
        const nc = nextL ? A_COURSE[nextL.lesson] : null;
        return (
          <section
            id={`A-step-${N + 1}`}
            data-astep={N + 1}
            className="min-h-[85vh] scroll-mt-4 pt-24 text-center"
            aria-labelledby="A-end"
          >
            <div className="relative mx-auto grid size-20 place-items-center rounded-full border-2 border-accent font-display text-3xl text-accent">
              {num}
              <span className="absolute -right-1 -bottom-1 grid size-8 place-items-center rounded-full bg-ok text-card shadow-[0_0_0_3px_var(--ground)]">
                <Icons.Check size={16} aria-hidden="true" />
              </span>
            </div>
            <h2
              id="A-end"
              className="mt-6 font-display text-4xl leading-tight font-semibold text-balance text-ink"
            >
              You’ve completed lesson {num}
            </h2>
            <p className="mx-auto mt-3 max-w-[55ch] text-base leading-relaxed text-muted">
              Well done. Here’s what you made: {lesson.end.caption}
            </p>

            {nextL ? (
              <div
                className={`mx-auto mt-12 max-w-2xl overflow-hidden rounded-2xl bg-card text-left ${A_RING}`}
              >
                <div className="p-6 sm:p-8">
                  <p className={`${A_LABEL} text-accent`}>Next up</p>
                  <div className="mt-3 flex items-start gap-4">
                    <span
                      className="grid size-12 shrink-0 place-items-center rounded-full border-2 border-accent font-display text-xl text-accent"
                      aria-hidden="true"
                    >
                      {nextL.lesson}
                    </span>
                    <div className="min-w-0">
                      <h3 className="font-display text-2xl leading-tight font-semibold text-balance text-ink">
                        <span className="sr-only">Lesson {nextL.lesson}: </span>
                        {nc.short}
                      </h3>
                      <p className="mt-2 text-base leading-relaxed text-muted">
                        {A_COURSE[num].teaser}
                      </p>
                    </div>
                  </div>
                </div>
                <div className="px-6 sm:px-8">
                  <A_StepMedia
                    lesson={nextL}
                    n={A_COURSE[num].payoff}
                    rounded="rounded-t-xl"
                  />
                </div>
                <div className="flex flex-wrap items-center gap-4 border-t border-line p-6 sm:px-8">
                  <button
                    type="button"
                    onClick={() => {
                      finishLesson(num);
                      openLesson(num + 1, 0);
                    }}
                    className={`inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base font-medium text-accent-ink ${A_FOCUS}`}
                  >
                    Start lesson {num + 1}
                    <Icons.ArrowRight size={18} aria-hidden="true" />
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      finishLesson(num);
                      openHub();
                    }}
                    className={`rounded text-base text-muted underline underline-offset-4 hover:text-ink ${A_FOCUS}`}
                  >
                    Back to all lessons
                  </button>
                </div>
              </div>
            ) : (
              <div
                className={`mx-auto mt-12 max-w-2xl rounded-2xl bg-card p-6 text-left sm:p-8 ${A_RING}`}
              >
                <p className={`${A_LABEL} text-accent`}>That’s the course</p>
                <h3 className="mt-2 font-display text-2xl leading-tight font-semibold text-balance text-ink">
                  Your routine, shorter
                </h3>
                <p className="mt-2 text-base leading-relaxed text-muted">
                  {lesson.end.next}
                </p>
                <button
                  type="button"
                  onClick={() => {
                    finishLesson(num);
                    openHub();
                  }}
                  className={`mt-6 inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base font-medium text-accent-ink ${A_FOCUS}`}
                >
                  Back to all lessons
                  <Icons.ArrowRight size={18} aria-hidden="true" />
                </button>
              </div>
            )}
          </section>
        );
      }

      function A_Pill({ lesson, step }) {
        const N = lesson.steps.length;
        const label =
          step === 0
            ? "Before you start"
            : step > N
              ? "Lesson complete"
              : `Step ${step} of ${N} · ${lesson.steps[step - 1].title}`;
        return (
          <div className="pointer-events-none fixed inset-x-0 bottom-4 z-40 flex justify-center px-4">
            <div
              className={`pointer-events-auto flex max-w-full min-w-0 items-center gap-3 rounded-full bg-card py-1.5 pr-1.5 pl-1.5 shadow-[0_0_0_1px_var(--line),0_10px_30px_-12px_rgb(0_0_0/0.35)]`}
            >
              <span
                className="grid size-8 shrink-0 place-items-center rounded-full border-2 border-accent font-display text-sm text-accent"
                aria-hidden="true"
              >
                {lesson.lesson}
              </span>
              <p
                className="min-w-0 truncate text-sm text-ink"
                aria-live="polite"
              >
                <span className="sr-only">Lesson {lesson.lesson}, </span>
                <span className="hidden font-medium sm:inline">

      // ---------------------------------------------------------------- Lesson

      function A_Lesson({ num }) {
        const p = useProto();
        const lesson = lessonBy(num);
        const c = A_COURSE[num];
        const N = lesson.steps.length;
        const fromScroll = useRef(null);
        const stepRef = useRef(p.step);
        stepRef.current = p.step;

        // Store -> page: jump to the step the store names (scenario buttons, pill, links).
        // The jump repeats while late styles and fonts settle the layout; the observer waits.
        const settling = useRef(0);
        useEffect(() => {
          if (fromScroll.current === p.step) return;
          fromScroll.current = p.step;
          const target = p.step;
          const jump = () => {
            if (stepRef.current !== target) return;
            if (target <= 0) window.scrollTo({ top: 0 });
            else
              document
                .getElementById(`A-step-${target}`)
                ?.scrollIntoView({ block: "start" });
          };
          const until = Date.now() + 700;
          settling.current = until;
          jump();
          const timers = [80, 250, 600].map((ms) => setTimeout(jump, ms));
          return () => timers.forEach(clearTimeout);
        }, [p.step]);

        // Page -> store: the section crossing a thin band near the top is the current step.
        useEffect(() => {
          const io = new IntersectionObserver(
            (entries) => {
              if (Date.now() < settling.current) return;
              for (const e of entries) {
                if (!e.isIntersecting) continue;
                const k = Number(e.target.dataset.astep);
                if (k !== stepRef.current) {
                  fromScroll.current = k;
                  setProto({ step: k });
                }
              }
            },
            { rootMargin: "-20% 0px -70% 0px" },
          );
          document
            .querySelectorAll("[data-astep]")
            .forEach((el) => io.observe(el));
          return () => io.disconnect();
        }, []);

                <div className="min-w-0">
                  <p className={`${A_LABEL} text-muted`}>
                    Lesson {num} · about {lesson.minutes} minutes · {N} steps

      const B_CROPS = {

      const B_crop = (l, n) => B_CROPS[l.media]?.[n] ?? undefined;

      // UI strings the MDX step text names through message keys (from messages/en.json).
      const B_MSG = {

      function B_clean(text) {

      function B_Hub({ done }) {

      // ---------------------------------------------------------------- lesson

      function B_useStepSync(num, step, last) {
        const fromScroll = useRef(null);
        const lock = useRef(0);
        const cur = useRef(step);
        cur.current = step;

        // Store → page: jump to the section the store names.
        useEffect(() => {
          if (fromScroll.current === step) {
            fromScroll.current = null;
            return;
          }
          fromScroll.current = null;
          const smooth = B_smoothNext.current && !reducedMotion();
          B_smoothNext.current = false;
          lock.current = Date.now() + (smooth ? 1200 : 300);
          const behavior = smooth ? "smooth" : "auto";
          if (step === 0) window.scrollTo({ top: 0, behavior });
          else
            document
              .getElementById(`B-step-${step}`)
              ?.scrollIntoView({ block: "start", behavior });
        }, [num, step]);

        // Page → store: the section whose top passed 40% of the viewport is the current one.
        useEffect(() => {
          let raf = 0;
          const onScroll = () => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(() => {
              if (Date.now() < lock.current) return;
              const line = window.innerHeight * 0.4;
              let found = 0;
              for (let i = 1; i <= last; i++) {
                const el = document.getElementById(`B-step-${i}`);
                if (el && el.getBoundingClientRect().top <= line) found = i;
              }
              const atBottom =
                window.scrollY > 0 &&
                window.innerHeight + window.scrollY >=
                  document.documentElement.scrollHeight - 2;
              if (atBottom) found = last;
              if (found !== cur.current) {
                fromScroll.current = found;
                setProto({ step: found });
              }
            });
          };
          window.addEventListener("scroll", onScroll, { passive: true });
          return () => {
            window.removeEventListener("scroll", onScroll);
            cancelAnimationFrame(raf);
          };
        }, [num, last]);
      }

      const B_go = (step) => {
        B_smoothNext.current = true;
        setProto({ step });
      };

      function B_ProgressBar({ l, step }) {
        const N = l.steps.length;
        const label =
          step === 0
            ? `Before you start · ${N} steps`
            : step > N
              ? "Lesson done"
              : `Step ${step} of ${N}`;
        const pct = step === 0 ? 0 : step > N ? 100 : (step / N) * 100;
        return (
          <div className="sticky top-0 z-20 border-b border-line bg-ground/90 backdrop-blur">

                className={`ml-auto inline-flex shrink-0 items-center gap-1.5 tabular-nums sm:ml-0 ${B_LABEL} ${step > N ? "text-ok" : "text-ink"}`}
              >
                {step > N && <Icons.CircleCheck size={14} aria-hidden="true" />}
                {label}
              </span>
            </div>
            <div className="h-[3px] bg-line" aria-hidden="true">
              <div
                className={`h-full motion-safe:transition-[width] motion-safe:duration-300 ${step > N ? "bg-ok" : "bg-accent"}`}
                style={{ width: `${pct}%` }}
              />
            </div>
          </div>
        );
      }

      function B_Opening({ l }) {
        const N = l.steps.length;
        const today = B_today(l.lesson);
        return (

            <h1 className="mt-3 max-w-[26ch] font-display text-3xl leading-tight text-balance sm:text-4xl lg:text-5xl">
              {l.title}
            </h1>
            <p className="mt-4 font-mono text-sm leading-relaxed text-muted">
              {B_plural(today.length, "chore")} →{" "}
              {B_plural(B_AFTER_COUNT, "action")} · {N} steps to learn it ·
              about {l.minutes} min
            </p>

            <div
              className={`mt-8 grid overflow-hidden rounded-2xl sm:grid-cols-[minmax(0,0.8fr)_minmax(0,1.2fr)] ${B_RING}`}
            >
              <div className="min-w-0 bg-tint p-5 sm:p-7">
                <p className={`${B_LABEL} text-muted`}>Today</p>
                <h2 className="mt-2 font-display text-2xl leading-tight text-muted text-balance">
                  What you do today
                </h2>
                <p className="mt-6 flex items-baseline gap-2">
                  <span className="font-display text-6xl leading-none text-muted tabular-nums">
                    {today.length}
                  </span>
                  <span className="text-base text-muted">chores by hand</span>
                </p>
                <ol className="mt-5 space-y-3 text-base leading-snug text-muted">
                  {today.map((t, i) => (
                    <li key={i} className="flex gap-3">
                      <span className="font-mono text-sm tabular-nums opacity-70">
                        {B_pad(i + 1)}
                      </span>
                      <span>{t}</span>
                    </li>
                  ))}
                </ol>
              </div>
              <div className="min-w-0 border-t border-line bg-card p-5 sm:border-t-0 sm:border-l sm:p-7">
                <p className={`${B_LABEL} text-accent`}>With ZotLit</p>
                <h2 className="mt-2 font-display text-2xl leading-tight text-balance">
                  What you’ll do instead
                </h2>
                <p className="mt-6 flex items-baseline gap-2">
                  <span className="font-display text-6xl leading-none text-accent tabular-nums">
                    {B_AFTER_COUNT}
                  </span>
                  <span className="text-base">action from now on</span>
                </p>
                <p className="mt-4 text-lg leading-relaxed [overflow-wrap:anywhere]">
                  <Rich text={B_AFTER[l.lesson]} />
                </p>
                <Media
                  lesson={l}
                  n={N}
                  play
                  crop={B_crop(l, N)}
                  className="mt-5"
                  rounded="rounded-lg"
                />
                <p className="mt-3 max-w-[60ch] text-base leading-relaxed text-muted">
                  <span className="font-semibold text-ink">{l.end.title}.</span>{" "}
                  {l.end.caption}
                </p>
              </div>
            </div>

            <div className="mt-8">
              <p className={`${B_LABEL} text-muted`}>You need</p>
              <ul className="mt-3 flex flex-wrap gap-2">
                {l.needs.map((n) => (
                  <li
                    key={n.item}
                    className={`max-w-full rounded-lg bg-card px-3 py-1.5 text-base leading-snug ${B_RING}`}
                  >
                    <span className="font-semibold">{n.item}</span>{" "}
                    <span className="text-muted">· {n.detail}</span>
                  </li>
                ))}
              </ul>
              {l.note && (
                <p className="mt-4 flex max-w-[65ch] gap-2.5 text-base leading-relaxed text-muted">
                  <Icons.Info
                    size={18}
                    className="mt-1 shrink-0"
                    aria-hidden="true"
                  />
                  <span>{l.note}</span>
                </p>
              )}
              <button
                type="button"
                onClick={() => B_go(1)}
                className={`mt-7 ${B_BTN}`}
              >
                Start with step 1{" "}
                <Icons.ArrowDown size={16} aria-hidden="true" />
              </button>
            </div>
          </section>
        );
      }

      function B_Table({ md }) {
        const rows = md
          .trim()
          .split("\n")
          .map((r) =>
            r
              .trim()
              .replace(/^\||\|$/g, "")
              .split("|")
              .map((c) => c.trim()),
          );
        const [head, , ...body] = rows;
        return (
          <div
            className={`mt-4 max-w-[65ch] overflow-x-auto rounded-xl bg-card ${B_RING}`}
          >
            <table className="w-full text-left text-base leading-snug">
              <thead>
                <tr className="border-b border-line">
                  {head.map((h, i) => (
                    <th
                      key={i}
                      scope="col"
                      className={`px-3 py-2 font-normal text-muted ${B_LABEL}`}
                    >
                      {h}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {body.map((r, i) => (
                  <tr key={i} className="border-b border-line last:border-0">
                    {r.map((c, j) => (
                      <td
                        key={j}
                        className="px-3 py-2.5 align-top [overflow-wrap:anywhere]"
                      >
                        <Rich text={c} />
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }

      function B_Step({ l, st, current }) {
        const N = l.steps.length;
        const n = st.n;
        const nextTitle = l.steps[n]?.title;
        return (
          <section
            id={`B-step-${n}`}
            aria-labelledby={`B-step-${n}-title`}
            className="grid scroll-mt-20 gap-4 sm:grid-cols-[5.5rem_minmax(0,1fr)] sm:gap-8"
          >
            <div
              className={`flex flex-wrap items-baseline gap-x-2 gap-y-1 border-t-2 pt-3 sm:block ${current ? "border-accent" : "border-line"}`}
            >
              <p
                className={`font-display text-4xl leading-none tabular-nums sm:text-5xl ${current ? "text-accent" : "text-ink"}`}
              >
                {n}
              </p>
              <p className={`${B_LABEL} text-muted sm:mt-2`}>of {N}</p>
              {current && (
                <p
                  className={`inline-flex items-center gap-1 text-accent sm:mt-2 ${B_LABEL}`}
                >
                  <Icons.MapPin size={12} aria-hidden="true" /> You’re here
                </p>
              )}
            </div>

            <div className="min-w-0 sm:border-t sm:border-line sm:pt-3">
              <h2
                id={`B-step-${n}-title`}
                className="font-display text-2xl leading-tight text-balance sm:text-3xl"
              >
                {st.title}
              </h2>
              <p className="mt-3 max-w-[65ch] text-base leading-relaxed sm:text-lg [overflow-wrap:anywhere]">
                <Rich text={B_clean(st.action)} />
              </p>
              <Media
                lesson={l}
                n={n}
                play={current}
                crop={B_crop(l, n)}
                className="mt-5"
                rounded="rounded-lg"
              />
              <div className="mt-4 flex max-w-[65ch] gap-3 rounded-xl bg-ok-tint px-4 py-3 text-ok">
                <Icons.CircleCheck
                  size={20}
                  className="mt-0.5 shrink-0"
                  aria-hidden="true"
                />
                <p className="text-base leading-relaxed [overflow-wrap:anywhere]">
                  <span className="font-semibold">You should see: </span>
                  <Rich text={B_clean(st.check)} />
                </p>
              </div>
              {st.figure && <B_Table md={st.figure} />}
              {st.fixes.length > 0 && (
                <details className="group mt-3 max-w-[65ch]">
                  <summary
                    className={`inline-flex cursor-pointer list-none items-center gap-1.5 rounded-md py-1 text-base text-muted hover:text-ink [&::-webkit-details-marker]:hidden ${B_FOCUS}`}
                  >
                    <Icons.ChevronRight
                      size={16}
                      className="shrink-0 group-open:rotate-90 motion-safe:transition-transform"
                      aria-hidden="true"
                    />
                    Something else on your screen?{" "}
                    {B_plural(st.fixes.length, "fix")}
                  </summary>
                  <dl className="mt-2 space-y-3 border-l-2 border-line pl-4">
                    {st.fixes.map((f, i) => (
                      <div key={i}>
                        <dt className="text-base font-semibold leading-snug">
                          <Rich text={B_clean(f.title)} />
                        </dt>
                        <dd className="mt-1 text-base leading-relaxed text-muted [overflow-wrap:anywhere]">
                          <Rich text={B_clean(f.body)} />
                        </dd>
                      </div>
                    ))}
                  </dl>
                </details>
              )}
              <button
                type="button"
                onClick={() => B_go(n + 1)}
                className={`mt-6 inline-flex items-center gap-2 rounded-full py-1.5 text-base font-medium text-accent hover:underline ${B_FOCUS}`}
              >
                {nextTitle ? (
                  <>
                    Next: {nextTitle}{" "}
                    <Icons.ArrowDown size={16} aria-hidden="true" />
                  </>
                ) : (
                  <>
                    Finish the lesson{" "}
                    <Icons.ArrowDown size={16} aria-hidden="true" />
                  </>
                )}
              </button>
            </div>
          </section>
        );
      }

      function B_End({ l }) {
        const N = l.steps.length;
        const today = B_today(l.lesson);
        const next = lessonBy(l.lesson + 1);
        return (
          <section
            id={`B-step-${N + 1}`}
            aria-labelledby="B-end-title"
            className="mt-20 scroll-mt-20 border-t-2 border-ink pt-10"
          >
            <p
              className={`inline-flex items-center gap-2 rounded-full bg-ok-tint px-3 py-1 text-ok ${B_LABEL}`}
            >
              <Icons.CircleCheck size={14} aria-hidden="true" /> Lesson{" "}
              {l.lesson} done
            </p>
            <h2
              id="B-end-title"
              className="mt-5 font-display text-4xl leading-[1.1] text-balance sm:text-5xl lg:text-6xl"
            >
              <span className="text-muted line-through decoration-2">
                {B_plural(today.length, "chore")}
              </span>{" "}
              <span className="text-accent" aria-hidden="true">
                →
              </span>
              <span className="sr-only">down to</span>{" "}
              {B_plural(B_AFTER_COUNT, "action")}.
            </h2>
            <p className="mt-5 max-w-[60ch] text-lg leading-relaxed">
              <span className="font-semibold">{l.end.title}.</span>{" "}
              {l.end.caption}
            </p>
            <p className="mt-3 max-w-[60ch] text-base leading-relaxed text-muted [overflow-wrap:anywhere]">
              From now on: <Rich text={B_AFTER[l.lesson]} />
            </p>

            {next ? (
              <div
                className={`mt-10 grid overflow-hidden rounded-2xl bg-card sm:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] ${B_RING}`}
              >
                <div className="min-w-0 p-6 sm:p-8">
                  <p className={`${B_LABEL} text-accent`}>
                    Next up · lesson {next.lesson}
                  </p>
                  <h3 className="mt-3 font-display text-2xl leading-tight text-balance sm:text-3xl">
                    {next.end.title}
                  </h3>
                  <p className="mt-3 text-base leading-relaxed text-muted">
                    {l.end.next}
                  </p>
                  <p className="mt-4 font-mono text-sm leading-relaxed text-muted">
                    {B_plural(B_today(next.lesson).length, "chore")} →{" "}
                    {B_plural(B_AFTER_COUNT, "action")} · {next.steps.length}{" "}
                    steps · about {next.minutes} min
                  </p>
                  <button
                    type="button"
                    onClick={() => openLesson(next.lesson, 0)}
                    className={`mt-6 ${B_BTN}`}
                  >
                    Start lesson {next.lesson}{" "}
                    <Icons.ArrowRight size={16} aria-hidden="true" />
                  </button>
                </div>
                <div className="min-w-0 bg-tint p-4 sm:p-5">
                  <Media
                    lesson={next}
                    n={next.steps.length}
                    crop={B_crop(next, next.steps.length)}
                    rounded="rounded-lg"
                  />
                </div>
              </div>
            ) : (
              <div className={`mt-10 rounded-2xl bg-card p-6 sm:p-8 ${B_RING}`}>
                <p className={`${B_LABEL} text-accent`}>Course complete</p>
                <h3 className="mt-3 font-display text-2xl leading-tight text-balance sm:text-3xl">
                  {B_TOTALS.chores} chores by hand → {B_TOTALS.actions} actions
                </h3>
                <p className="mt-3 max-w-[60ch] text-base leading-relaxed text-muted">
                  {l.end.next}
                </p>
              </div>
            )}
            <button
              type="button"
              onClick={openHub}
              className={`mt-6 ${B_BTN_QUIET}`}
            >
              <Icons.ArrowLeft size={16} aria-hidden="true" /> Back to all
              lessons
            </button>
          </section>
        );
      }

      function B_Lesson({ num, step }) {
        const l = lessonBy(num) ?? LESSONS[0];
        const N = l.steps.length;
        const s = Math.max(0, Math.min(step, N + 1));
        B_useStepSync(l.lesson, s, N + 1);
        useEffect(() => {
          if (s === N + 1) finishLesson(l.lesson);
        }, [s, N, l.lesson]);
        return (
          <>
            <B_ProgressBar l={l} step={s} />
            <main className="mx-auto w-full max-w-5xl px-4 pb-32 sm:px-6">
              <B_Opening l={l} />
              <div className="mt-20 space-y-16 sm:space-y-20">
                {l.steps.map((st) => (
                  <B_Step
                    key={`${l.slug}-${st.n}`}
                    l={l}
                    st={st}
                    current={s === st.n}
                  />
                ))}
              </div>
              <B_End l={l} />
            </main>
          </>
        );
      }

      function VariantB() {
        const p = useProto();
        return (
          <div className="min-h-screen bg-ground font-body text-ink">
            {p.view === "lesson" ? (
              <B_Lesson num={p.lesson} step={p.step} />
            ) : (
              <B_Hub done={p.done} />
            )}
          </div>
        );
      }
      // --- Variant B END ---

      // --- Variant C ---
      // Variant C: "Watch, then do". One paper's journey (hub) + a lesson player.

      const C_FOCUS =
        "focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent";
      const C_LABEL = "font-mono text-xs uppercase tracking-wider";
      // The stage stays dark in both schemes; text on it follows this pair.
      const C_STAGE = "bg-ink text-ground dark:bg-[#0b0c0f] dark:text-ink";
      const C_SOFT = "text-ground/70 dark:text-ink/70";
      const C_HAIR = "bg-ground/20 dark:bg-ink/20";
      const C_RING = "shadow-[0_0_0_1px_var(--line)]";
      const C_BTN =
        "inline-flex items-center justify-center gap-2 rounded-full bg-accent px-5 py-2.5 text-base font-semibold text-accent-ink hover:opacity-90 " +
        C_FOCUS;
      const C_BTN_QUIET =
        "inline-flex items-center justify-center gap-2 rounded-full px-5 py-2.5 text-base font-medium text-ink shadow-[0_0_0_1px_var(--line)] hover:bg-tint " +
        C_FOCUS;
      const C_BTN_STAGE =
        "inline-flex items-center justify-center gap-2 rounded-full px-5 py-2.5 text-base font-medium shadow-[0_0_0_1px_rgb(255_255_255/0.25)] hover:bg-white/10 " +
        C_FOCUS;

      // MDX tags left in a few step strings → the message text they render.
      const C_MSG = {
        settings_citation_engine_status_installed: (p) =>
          `Pandoc ${p.version} is installed.`,
        command_pandoc_export_name: () => "Export note with citations",
        pandoc_export_style_changed: (p) =>
          `Only this export uses this style. The note keeps ${p.style}.`,
        notice_pandoc_export_done: (p) =>
          `Exported ${p.file} with ${p.style} citations.`,
        query_view_properties_add_vault: (p) =>
          `Add "${p.name}" vault property`,
        query_view_properties_add: (p) => `Add "${p.name}" property`,
        annot_view_save_file: (p) => `Creates ${p.file}`,
        query_view_results: (p) =>
          String(p.count) === "1" ? "1 result" : `${p.count} results`,
      };
      const C_clean = (t) =>
        t
          ? t
              .replace(
                /<(?:UiLabel|Command)\b[^]*?name=\{m\.(\w+)\(([^]*?)\)\}\s*\/>/g,
                (_, key, args) => {
                  const p = {};
                  for (const [, k, s, d] of args.matchAll(
                    /(\w+):\s*(?:"([^"]*)"|(\d+))/g,
                  ))
                    p[k] = s ?? d;
                  return `**${C_MSG[key] ? C_MSG[key](p) : key}**`;
                },
              )
              .replace(/\*\* \./g, "**.")
          : t;

      // Result crops for the hub's film cells (lesson 4's result is a still of the Word file).
      const C_RESULT_CROP = {
        1: [0.25, 0.66, 0.32],
        2: [0.155, 0.18, 0.32],
        3: [0.05, 0.29, 0.32],
        4: [0.17, 0.36, 0.64], // in the window-ratio box C_Thumb gives the Word still
        5: [0.55, 0.08, 0.36],
        6: [0.27, 0.57, 0.36],
      };

      // Light stage crops below the lg breakpoint, where the full window gets too small to read.
      // Lessons 1 and 5 record with the file panel open: drop it. The others lose only the ribbon.
      function C_stageCrop(l, n) {
        if (!hasClip(l, n)) return undefined;
        if (l.lesson === 1 || l.lesson === 5) return [0.24, 0.06, 0.76];
        return [0.03, 0, 0.97];
      }

      // Draft copy: where the paper is at each stop.
      const C_STORY = {
        1: "Sandve 2013 gets a literature note, with your own thoughts above its highlights.",
        2: "You highlight a passage in Obsidian, and the note picks it up with no update.",
        3: "Rule 1 goes into Chapter 3 as a cited quote, page number included.",
        4: "Chapter 3 leaves as a Word file, with a reference list at the end.",
        5: "Your reading plan shows only the papers you still need to read.",
        6: "Sandve 2013 takes a row in a review table inside your chapter.",
      };

      // Draft copy: each lesson's "You need" list as one sentence.
      const C_NEED = {
        1: "You need Obsidian 1.14.5 or later and Zotero 10 on the same desktop computer, and one paper with a highlighted PDF.",
        2: "You need the literature note from lesson 1, and Zotero 10 open on this computer.",
        3: "You need lessons 1 and 2 done, the Better BibTeX add-on in Zotero, and a Chapter 3 draft in Obsidian.",
        4: "You need the cited draft from lesson 3, and Zotero open on this computer.",
        5: "You need lesson 1 done. Zotero can stay closed.",
        6: "You need lesson 1 done, a Zotero collection of your papers, and a Thesis folder in Obsidian.",
      };

      function C_useNarrow() {
        const q = "(max-width: 1023.98px)";
        const [narrow, setNarrow] = useState(
          () => window.matchMedia(q).matches,
        );
        useEffect(() => {
          const m = window.matchMedia(q);
          const on = () => setNarrow(m.matches);
          m.addEventListener("change", on);
          return () => m.removeEventListener("change", on);
        }, []);
        return narrow;
      }

      function C_parseTable(md) {
        const rows = md
          .trim()
          .split("\n")
          .filter((r) => !/^\|\s*:?-/.test(r))
          .map((r) =>
            r
              .split("|")
              .slice(1, -1)
              .map((c) => c.trim()),
          );
        return { head: rows[0], body: rows.slice(1) };
      }

      // A result still held to the window's 1440:860 frame, so lesson 4's Word still lines up too.
      function C_Thumb({ l, rounded = "rounded-[3px]" }) {
        const n = l.steps.length;
        return (
          <div
            className={`relative aspect-[1440/860] overflow-hidden ${rounded}`}
          >
            <Media
              lesson={l}
              n={n}
              crop={C_RESULT_CROP[l.lesson]}
              rounded={rounded}
              className="absolute! inset-0"
              alt={l.end.caption}
            />
          </div>
        );
      }

      function C_Sprockets() {
        return (
          <span aria-hidden="true" className="flex justify-between px-1">
            {Array.from({ length: 10 }, (_, i) => (
              <span key={i} className={`h-1.5 w-2.5 rounded-[1px] ${C_HAIR}`} />
            ))}
          </span>
        );
      }

      // ---------- Hub ----------

      function C_Stop({ l, state, first, last }) {
        const n = l.lesson;
        const node =
          state === "done"
            ? "bg-ok text-ground"
            : state === "next"
              ? "bg-accent text-accent-ink"
              : `bg-card text-ink ${C_RING}`;
        return (
          <li className="relative grid grid-cols-[2rem_minmax(0,1fr)] gap-x-4 xl:flex xl:flex-col">
            <div className="flex flex-col items-center xl:mb-4 xl:flex-row xl:px-3">
              <span
                className={`relative z-[1] grid size-8 shrink-0 place-items-center rounded-full font-mono text-sm ${node}`}
              >
                {state === "done" ? (
                  <Icons.Check size={16} aria-hidden="true" />
                ) : (
                  n
                )}
              </span>
              {!last && (
                <span
                  aria-hidden="true"
                  className="mt-1 w-px flex-1 bg-line xl:mt-0 xl:ml-3 xl:h-px xl:w-auto"
                />
              )}
            </div>
            <div className="flex min-w-0 flex-col gap-3 pb-10 sm:flex-row sm:gap-5 xl:flex-col xl:gap-4 xl:pb-0">
              <div
                className={`${C_STAGE} flex flex-col gap-1.5 rounded-lg px-2 py-2 sm:w-64 sm:shrink-0 xl:w-auto ${
                  first
                    ? "xl:rounded-r-none"
                    : last
                      ? "xl:rounded-l-none"
                      : "xl:rounded-none"
                }`}
              >
                <C_Sprockets />
                <C_Thumb l={l} />
                <C_Sprockets />
              </div>
              <div className="min-w-0 xl:px-3">
                <p
                  className={`${C_LABEL} flex flex-wrap items-center gap-x-2 text-muted`}
                >
                  <span>Stop {n}</span>
                  <span aria-hidden="true">·</span>
                  <span>{l.minutes} min</span>
                  {state === "done" && (
                    <span className="inline-flex items-center gap-1 text-ok">
                      <Icons.Check size={13} aria-hidden="true" /> Done
                    </span>
                  )}
                  {state === "next" && (
                    <span className="text-accent">Up next</span>
                  )}
                </p>
                <h3 className="mt-1.5 font-display text-lg leading-tight text-balance">
                  <button
                    type="button"
                    onClick={() => openLesson(n, 0)}
                    className={`text-left hover:underline hover:decoration-1 hover:underline-offset-4 after:absolute after:inset-0 after:z-10 after:content-[''] rounded-sm ${C_FOCUS}`}
                  >
                    {l.title}
                  </button>
                </h3>
                <p className="mt-2 max-w-[48ch] text-base leading-relaxed text-muted">
                  {C_STORY[n]}
                </p>
              </div>
            </div>
          </li>
        );
      }

      function C_Hub({ s }) {
        const total = LESSONS.reduce((a, l) => a + l.minutes, 0);
        const next = LESSONS.find((l) => !s.done.includes(l.lesson));
        return (
          <div className="min-h-screen bg-ground font-body text-ink">
            <div className="mx-auto max-w-[1360px] px-4 pt-8 pb-20 sm:px-6 lg:pt-14">
              <header className="grid gap-8 lg:grid-cols-[minmax(0,1fr)_minmax(0,23rem)] lg:items-end lg:gap-12">
                <div className="max-w-[46rem]">
                  <p className={`${C_LABEL} text-muted`}>
                    ZotLit tutorial · 6 stops · about {total} minutes
                  </p>
                  <h1 className="mt-3 font-display text-[clamp(2.1rem,5vw,3.6rem)] leading-[1.08] text-balance">
                    Follow one paper from your Zotero library into your chapter
                  </h1>
                  <p className="mt-5 max-w-[60ch] text-lg leading-relaxed text-muted">
                    Each lesson takes the same paper one stop further. Every
                    lesson opens on its result, so you see where you’ll end up

                  </p>
                  <div className="mt-7 flex flex-wrap items-center gap-x-5 gap-y-3">
                    {next ? (
                      <button

                </div>
                <aside

                  <p className={`${C_LABEL} text-muted`}>
                    The paper on this journey
                  </p>
                  <p className="mt-3 font-display text-lg leading-snug">

                    (2013). Ten simple rules for reproducible computational

              <section aria-labelledby="C-journey" className="mt-14 lg:mt-20">

                  <h2
                    id="C-journey"
                    className="font-display text-2xl leading-tight text-balance"
                  >
                    One paper’s journey
                  </h2>
                  <p className={`${C_LABEL} text-muted`}>

                  </p>
                </div>
                <ol className="mt-8 flex flex-col xl:grid xl:grid-cols-6">
                  {LESSONS.map((l, i) => (
                    <C_Stop
                      key={l.slug}
                      l={l}
                      first={i === 0}
                      last={i === LESSONS.length - 1}
                      state={
                        s.done.includes(l.lesson)
                          ? "done"
                          : next && next.lesson === l.lesson
                            ? "next"
                            : "todo"
                      }
                    />
                  ))}

              <footer className="mt-16 border-t border-line pt-6">
