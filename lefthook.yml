pre-commit:
  piped: true
  commands:
    # Runs first: lint builds the working tree, so files outside the commit
    # would reach it. See packages/scripts/lib/commit-tree.ts.
    tree:
      priority: 1
      run: mise exec -- node packages/scripts/scripts/commit-tree.ts
    format:
      run: mise exec -- oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: mise exec -- turbo run //#lint:repo -- --fix {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
    worker-responsiveness:
      priority: 100
      glob:
        - "apps/obsidian/src/lib/effect*.ts"
        - "apps/obsidian/src/lib/browser-scheduler*.ts"
        - "apps/obsidian/oxlint.config.ts"
        - "apps/obsidian/src/services/zotero-reads/**"
        - "apps/obsidian/src/services/database/**"
        - "apps/obsidian/src/services/citation-index/**"
        - "packages/item-lookup/**"
        - "packages/db/**"
        - "packages/e2e/**"
        - "pnpm-lock.yaml"
        - "lefthook.yml"
      run: mise exec -- pnpm e2e:worker
