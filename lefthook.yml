pre-commit:
  piped: true
  commands:
    format:
      run: mise exec -- oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: mise exec -- oxlint --fix {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
