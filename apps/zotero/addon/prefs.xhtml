<vbox
  xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
>
  <html:link rel="localization" href="zotlit.ftl" />

  <groupbox>
    <html:h2 data-l10n-id="zotlit-prefs-notify-section" />

    <checkbox
      data-l10n-id="zotlit-prefs-notify-enable"
      preference="extensions.zotlit.notify"
      native="true"
    />

    <hbox align="center">
      <label
        data-l10n-id="zotlit-prefs-notify-url"
        control="zotlit-notify-url"
      />
      <html:input
        id="zotlit-notify-url"
        type="text"
        preference="extensions.zotlit.notify-url"
        style="flex: 1; min-width: 24em"
      />
    </hbox>
  </groupbox>

  <groupbox>
    <html:h2 data-l10n-id="zotlit-prefs-database-section" />

    <checkbox
      data-l10n-id="zotlit-prefs-wal-checkpoint"
      preference="extensions.zotlit.wal-checkpoint"
      native="true"
    />

    <description data-l10n-id="zotlit-prefs-wal-checkpoint-description" />
  </groupbox>

  <groupbox>
    <html:h2 data-l10n-id="zotlit-prefs-logging-section" />

    <hbox align="center">
      <label
        data-l10n-id="zotlit-prefs-logging-level"
        control="zotlit-log-console-level"
      />
      <menulist
        id="zotlit-log-console-level"
        preference="extensions.zotlit.log.console-level"
        native="true"
      >
        <menupopup>
          <menuitem value="trace" data-l10n-id="zotlit-prefs-log-level-trace" />
          <menuitem value="debug" data-l10n-id="zotlit-prefs-log-level-debug" />
          <menuitem value="info" data-l10n-id="zotlit-prefs-log-level-info" />
          <menuitem
            value="warning"
            data-l10n-id="zotlit-prefs-log-level-warning"
          />
          <menuitem value="error" data-l10n-id="zotlit-prefs-log-level-error" />
          <menuitem value="fatal" data-l10n-id="zotlit-prefs-log-level-fatal" />
        </menupopup>
      </menulist>
    </hbox>
  </groupbox>
</vbox>
