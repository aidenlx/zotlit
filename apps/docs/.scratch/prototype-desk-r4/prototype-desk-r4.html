        Which modern academic style suits the desk page? Both variants share one page

        Hero: the approved copy, then the desk as "Figure 1" at full width with a numbered
        key. Past the hero, the desk shrinks into the sticky contents column beside the job
        sections (scroll-linked; with motion off or reduced motion it cross-fades). Under

        working demo(s), the full feature list. Then setup and the footer.

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, {
        useState,
        useEffect,
        useMemo,
        useRef,
        useCallback,
        useLayoutEffect,
        useSyncExternalStore,
        Fragment,
      } from "react";
      import { createRoot } from "react-dom/client";
      // Every lucide icon, as Icons.Search, Icons.Quote, ... (variants cannot add imports).
      import * as Icons from "lucide-react";
      // motion (framer-motion): Motion.motion.div, Motion.AnimatePresence, Motion.useScroll ...
      import * as Motion from "motion/react";

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // --- App ---
      // --- Shared ---
      // Shared by every variant: the mock store, animation hooks, the brand mark, and one
      // mock research library (a thesis on language models and situated knowledge). Variants
      // read all of it from module scope and take no props, so a trimmed winner renders bare.

      // ---------- Store ----------
      // motion: false freezes every loop (switcher toggle, and prefers-reduced-motion).
      // paper: the featured Zotero item, by citation key.
      const protoStore = (() => {
        let state = {
          motion: !window.matchMedia("(prefers-reduced-motion: reduce)")
            .matches,
          paper: "vaswani2017",
        };
        const subs = new Set();
        return {
          get: () => state,
          set: (patch) => {
            state = {
              ...state,
              ...(typeof patch === "function" ? patch(state) : patch),
            };
            subs.forEach((f) => f());
          },
          subscribe: (f) => {
            subs.add(f);
            return () => subs.delete(f);
          },
        };
      })();
      function useProtoState() {
        return useSyncExternalStore(protoStore.subscribe, protoStore.get);
      }
      const setProto = protoStore.set;

      // ---------- Animation hooks ----------
      // useLoop(stepMs, count): an index that cycles 0..count-1. Holds still when motion is off.
      function useLoop(stepMs, count, { active = true, start = 0 } = {}) {
        const { motion } = useProtoState();
        const [i, setI] = useState(start);
        useEffect(() => {
          if (!motion || !active) return;
          const id = setInterval(() => setI((n) => (n + 1) % count), stepMs);
          return () => clearInterval(id);
        }, [motion, active, stepMs, count]);
        return i;
      }

      // useTimeline([ms, ms, ...]): the index of the current step; step k lasts durations[k],
      // then the timeline loops. With motion off it rests on the last step (the finished state).
      function useTimeline(durations, { active = true, loop = true } = {}) {
        const { motion } = useProtoState();
        const [i, setI] = useState(0);
        const key = durations.join(",");
        useEffect(() => {
          if (!motion) {
            setI(durations.length - 1);
            return;
          }
          if (!active) return;
          let cancelled = false;
          let t;
          let k = 0;
          setI(0);
          const next = () => {
            t = setTimeout(() => {
              if (cancelled) return;
              if (k === durations.length - 1 && !loop) return;
              k = (k + 1) % durations.length;
              setI(k);
              next();
            }, durations[k]);
          };
          next();
          return () => {
            cancelled = true;
            clearTimeout(t);
          };
        }, [motion, active, key, loop]);
        return i;
      }

      // useTypewriter(text): the typed prefix of text. Full text when motion is off or done.
      function useTypewriter(
        text,
        { cps = 28, active = true, delay = 0 } = {},
      ) {
        const { motion } = useProtoState();
        const [n, setN] = useState(motion ? 0 : text.length);
        useEffect(() => {
          if (!motion) {
            setN(text.length);
            return;
          }
          if (!active) {
            setN(0);
            return;
          }
          setN(0);
          let i = 0;
          let iv;
          const t = setTimeout(() => {
            iv = setInterval(() => {
              i += 1;
              setN(i);
              if (i >= text.length) clearInterval(iv);
            }, 1000 / cps);
          }, delay);
          return () => {
            clearTimeout(t);
            clearInterval(iv);
          };
        }, [text, cps, active, delay, motion]);
        return text.slice(0, n);
      }

      // useInView(ref): true while the element is on screen (or once, with { once: true }).
      function useInView(ref, { threshold = 0.3, once = false } = {}) {
        const [inView, setInView] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => {
              if (e.isIntersecting) {
                setInView(true);
                if (once) io.disconnect();
              } else if (!once) setInView(false);
            },
            { threshold },
          );
          io.observe(el);
          return () => io.disconnect();
        }, [threshold, once]);
        return inView;
      }

      // useScrollProgress(ref): 0 when the element's top meets the viewport bottom,
      // 1 when its bottom meets the viewport top. For scroll-driven stages.
      function useScrollProgress(ref) {
        const [p, setP] = useState(0);
        useEffect(() => {
          let raf = 0;
          const update = () => {
            raf = 0;
            const el = ref.current;
            if (!el) return;
            const r = el.getBoundingClientRect();
            const vh = window.innerHeight;
            const total = r.height + vh;
            setP(Math.min(1, Math.max(0, (vh - r.top) / total)));
          };
          const onScroll = () => {
            if (!raf) raf = requestAnimationFrame(update);
          };
          update();
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", onScroll);
          return () => {
            window.removeEventListener("scroll", onScroll);
            window.removeEventListener("resize", onScroll);
            cancelAnimationFrame(raf);
          };
        }, []);
        return p;
      }

      // ---------- Brand (docs/brand.md) ----------
      // The ZL mark from its master geometry; never redraw it. Dark inks: #D8E2F0 / #F0793F.
      function ZotLitMark({

        ink = "#1E3A5F",
        accent = "#E8622C",
        className = "",
        title = "ZotLit",

        return (
          <svg
            viewBox="0 0 24 24"

            height={size}
            className={className}
            role="img"
            aria-label={title}

            <path
              d="M4 3.5 H17 V7 L8.75 16.5 H20.5 V20 H4 V16.5 L12.25 7 H4 Z"

            />
            <path
              d="M17 3.5 H20.5 V16.5 L18.75 14.75 L17 16.5 Z"
              fill={accent}
            />

        );
      }
      // "Zot" in ink, "Lit" in accent, Archivo SemiBold, tracking -1%.
      function Wordmark({

        accent = "var(--accent)",
        className = "",
        style,

        markInk = "#1E3A5F",

      // ---------- Facts ----------
      const SITE = "https://zotlit.aidenlx.site";
      const DOCS = `${SITE}/docs`;
      // Facts checked on 2026-10-29 against manifest.json, install-zotlit.mdx, README and

      // count as shipped (today: stable 2.1.4, 2.2 in beta through BRAT).

        zotero: "Zotero 9 or later",

      // ---------- Every feature ----------
      // job: a JOBS id. since: "2.0" (the basics) | "2.1" | "2.2" (2.2 includes main).

      // The whole desk. `current`: the object to lift and label (for example the job in view).
      // `onPick(id)`: called when the reader selects an object. `labels`: "hover" shows a name tag
      // on hover and for `current` (always on the tall layout), "always" shows every tag, "none"
      // shows none. `dimOthers`: fade every object except `current`. `layout`: force "wide" or
      // "tall"; otherwise `wide` picks.
      function K_Desk({
        wide = true,
        layout,
        current = null,
        onPick,
        paused = false,
        labels = "hover",
        dimOthers = false,
        pickLabel = (j) => j.name,
      }) {
        const L =
          layout === "tall"
            ? K_TALL
            : layout === "wide"
              ? K_WIDE
              : wide
                ? K_WIDE
                : K_TALL;
        const isWide = L === K_WIDE;
        const selected = current;
        const { motion } = useProtoState();
        const [hot, setHot] = useState(null);
        const ref = useRef(null);
        const band = K_useBand(ref);
        const anim = !motion ? "off" : band && !paused ? "run" : "pause";
        const box = (id) => {
          const o = K_OBJ[id];
          const p = L.at[id];
          const s = p.s || 1;
          return { o, p, s, w: o.w * s, h: o.h * s };
        };
        const pct = (v, total) => `${(v / total) * 100}%`;
        return (
          <div
            ref={ref}
            className="relative w-full"
            style={{ aspectRatio: `${L.W} / ${L.H}` }}
          >
            <svg
              viewBox={`0 0 ${L.W} ${L.H}`}
              className="k-svg absolute inset-0 h-full w-full"
              aria-hidden="true"
              focusable="false"
            >
              <K_DeskTop L={L} />
              {L.mug && <K_Mug x={L.mug[0]} y={L.mug[1]} />}
              {JOBS.map((j, i) => {
                const { o, p, s, w, h } = box(j.id);
                const on = hot === j.id || selected === j.id;
                const dim = dimOthers && selected && selected !== j.id;
                const Art = o.Art;
                return (
                  <g
                    key={j.id}
                    transform={`translate(${p.x} ${p.y}) rotate(${p.r} ${w / 2} ${h / 2}) scale(${s})`}
                  >
                    <g
                      className={motion ? "k-settle" : ""}
                      style={{ animationDelay: `${150 + i * 85}ms` }}
                    >
                      <g className={`k-shade ${on ? "is-on" : ""}`}>
                        {o.shade.map(([x, y, sw, sh, rx], k) => (
                          <rect
                            key={k}
                            x={x + 7}
                            y={y + 9}
                            width={sw}
                            height={sh}
                            rx={rx}
                            fill={
                              p.deep
                                ? "var(--k-shadow-deep)"
                                : "var(--k-shadow)"
                            }
                          />
                        ))}
                      </g>
                      <g
                        className={`k-lift ${on ? "is-on" : ""} ${dim ? "is-dim" : ""}`}
                      >
                        <Art anim={j.id === "read" ? anim : "off"} />
                      </g>
                    </g>
                  </g>
                );
              })}
            </svg>
            {JOBS.map((j) => {
              const { p, w, h } = box(j.id);
              return (
                <button
                  key={j.id}
                  type="button"
                  aria-label={pickLabel(j)}
                  aria-current={selected === j.id ? "true" : undefined}
                  className="k-hit absolute"
                  style={{
                    left: pct(p.x, L.W),
                    top: pct(p.y, L.H),
                    width: pct(w, L.W),
                    height: pct(h, L.H),
                    transform: `rotate(${p.r}deg)`,
                  }}
                  onPointerEnter={() => setHot(j.id)}
                  onPointerLeave={() => setHot((x) => (x === j.id ? null : x))}
                  onFocus={() => setHot(j.id)}
                  onBlur={() => setHot((x) => (x === j.id ? null : x))}
                  onClick={() => onPick && onPick(j.id)}
                />
              );
            })}
            {JOBS.map((j, i) => {
              const { p, w } = box(j.id);
              const show =
                labels === "always" ||
                (labels === "hover" &&
                  (!isWide || hot === j.id || selected === j.id));
              if (!show) return null;
              const left = isWide ? pct(p.x + w / 2, L.W) : pct(p.lx, L.W);
              const top = isWide ? pct(p.y, L.H) : pct(p.ly, L.H);
              return (
                <span
                  key={j.id}
                  aria-hidden="true"
                  className={`border-line bg-surface text-ink k-sheet pointer-events-none absolute z-10 inline-flex w-max items-center gap-1.5 rounded-full border ${
                    isWide
                      ? "px-3 py-1.5 text-[14px] font-semibold whitespace-nowrap"
                      : "max-w-[47%] px-2.5 py-1 text-[12.5px] leading-tight font-semibold"
                  } ${isWide && motion && labels === "hover" ? "k-rise" : ""}`}
                  style={{
                    left,
                    top,
                    transform: isWide
                      ? "translate(-50%, -55%)"
                      : "translate(-50%, 0)",
                  }}
                >
                  <span className="font-mono text-[10.5px] font-normal text-muted">
                    {K_NUM(i)}
                  </span>
                  {j.name}
                </span>
              );
            })}
          </div>
        );

      function K_Cite({ k, locator = null, style = "apa", className = "" }) {

      // A Markdown source paragraph with every citation formatted.
      function K_Rendered({ src, style = "apa", plain = false, renderCite }) {
        return parseCitations(src).map((s, i) => {
          if (s.text != null) return <Fragment key={i}>{s.text}</Fragment>;
          if (renderCite)
            return <Fragment key={i}>{renderCite(s.cite)}</Fragment>;
          if (plain)
            return (
              <Fragment key={i}>
                {inText(s.cite.key, {
                  style,
                  locator: s.cite.locator,
                  order: K_DRAFT_ORDER,
                })}
              </Fragment>
            );
          return (
            <K_Cite
              key={i}
              k={s.cite.key}
              locator={s.cite.locator}
              style={style}
            />
          );
        });
      }

      function K_Badges({ f }) {
        const l = sinceLabel(f);
        const base =

        return (
          <>
            {l && (
              <span

                {f.since === "2.2" && (
                  <span className="bg-accent size-1.5 rounded-full" />

      // Which demos each job section shows, in order. The first entry is the job's lead demo.
      // `shows`: the features that demo shows working (a filled dot in the parts list).

      const K_JOB_DEMOS = {
        connect: [
          { id: "direct", Demo: K_DemoConnect, shows: ["direct", "libraries"] },
        ],
        find: [
          {
            id: "library",

      // Every feature the job's demos show working, plus the small demos in the parts list.
      function K_shownOf(job, { extras = true } = {}) {
        const ids = K_JOB_DEMOS[job].flatMap((d) => d.shows);

      function K_PartsList({

      // The id of the element (from `ids`) that crosses a line `line` of the way down the
      // viewport, or null when none does.
      function K_useSpy(ids, line = 0.4) {
        const [cur, setCur] = useState(null);
        const key = ids.join("|");
        useEffect(() => {
          let raf = 0;
          const read = () => {
            raf = 0;
            const y = window.innerHeight * line;
            let hit = null;
            for (const id of ids) {
              const el = document.getElementById(id);
              if (!el) continue;
              const r = el.getBoundingClientRect();
              if (r.top <= y && r.bottom > y) {
                hit = id;
                break;
              }
            }
            setCur(hit);
          };
          const on = () => {
            if (!raf) raf = requestAnimationFrame(read);
          };
          read();
          window.addEventListener("scroll", on, { passive: true });
          window.addEventListener("resize", on);
          return () => {
            window.removeEventListener("scroll", on);
            window.removeEventListener("resize", on);
            cancelAnimationFrame(raf);
          };
        }, [key, line]);
        return cur;
      }

      // Scroll to an element by id and move keyboard focus to it. Use this for in-page links:
      // the variant switcher owns location.hash, so "#id" links would fight it.
      function K_scrollTo(id, { smooth = true, block = "start" } = {}) {
        const el = document.getElementById(id);
        if (!el) return;
        el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block });
        if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "-1");
        el.focus({ preventScroll: true });

                research desk

              for Obsidian.

            </p>

      }

      // ===== Round 4: the desk at your side, restyled =====
      // Round 3's variant B, which the user picked, in a quieter academic style that follows the
      // better-ui rules: shadow rings in place of depth borders, 150 ms state changes, one staged
      // hero entrance, movement gated by the reduced-motion preference. The desk is Figure 1 in
      // the hero. Past the hero it shrinks into the sticky contents column beside the job
      // sections; under 1024 px a bar of the eight objects takes that column's place. The two
      // variants share this page and differ only in tokens and the desk palette.

      const R4_STICKY = 32; // px from the viewport top where the contents column sticks
      const R4_START = 72; // the hero desk starts to shrink once its top passes this line
      const r4Sec = (id) => `r4-job-${id}`;
      const r4Clamp = (x) => Math.min(1, Math.max(0, x));
      const r4Ease = (t) => t * t * (3 - 2 * t);
      const r4Lerp = (a, b, t) => a + (b - a) * t;

      const R4_CSS = `
[data-v][data-kit] {
  --r4-shadow: 0px 0px 0px 1px oklch(0 0 0 / 0.06), 0px 1px 2px -1px oklch(0 0 0 / 0.06), 0px 2px 4px 0px oklch(0 0 0 / 0.04);
  --r4-shadow-hover: 0px 0px 0px 1px oklch(0 0 0 / 0.08), 0px 1px 2px -1px oklch(0 0 0 / 0.08), 0px 2px 4px 0px oklch(0 0 0 / 0.06);
  --r4-hl: color-mix(in oklab, var(--z-yellow) 48%, transparent);
}
@media (prefers-color-scheme: dark) {
  [data-v][data-kit] {
    --r4-shadow: 0 0 0 1px oklch(1 0 0 / 0.08);
    --r4-shadow-hover: 0 0 0 1px oklch(1 0 0 / 0.13);
    --r4-hl: color-mix(in oklab, var(--z-yellow) 30%, transparent);
  }
}

/* B · Lab: cool slate, one blue family, white paper. */
[data-v="B"][data-kit] {
  --k-desk: #e8ecf1; --k-paper: #ffffff; --k-edge: #9aa5b4; --k-text: #dfe5ec; --k-head: #2f3b4d;
  --k-ink-soft: rgb(47 59 77 / 0.28); --k-shadow: rgb(15 23 42 / 0.14); --k-shadow-deep: rgb(15 23 42 / 0.28);
  --k-steel: #dce2e9; --k-steel-deep: #c9d1db; --k-tray: #364152; --k-tray-deep: #2a3341; --k-cork: #e9eef4;
  --k-laptop: #d7dde5; --k-key: #c2cad4; --k-screen: #1c2534; --k-screen-side: #151d29; --k-notebook: #47607e;
  --k-book1: #3a5680; --k-book2: #6a7c96; --k-book3: #a9b6c7; --k-glass: #e8eef6; --k-coffee: #5c4637;
  --k-pen: #2e4a78; --k-rule: rgb(47 111 235 / 0.16); --k-sticky: #dce8f8; --k-tool-seam: rgb(0 0 0 / 0.22);
  --k-blot-corner: #1e2836; --k-stitch: rgb(255 255 255 / 0.14); --k-hl-y: rgb(255 212 0 / 0.42);
  --k-hl-p: rgb(162 138 229 / 0.32); --k-hl-color: rgb(255 212 0 / 0.45);
}
@media (prefers-color-scheme: dark) {
  [data-v="B"][data-kit] {
    --k-desk: #121826; --k-paper: #c6cdd8; --k-edge: #2e3846; --k-text: #a9b2c0; --k-head: #2a3442;
    --k-ink-soft: rgb(20 26 36 / 0.35); --k-shadow: rgb(0 0 0 / 0.42); --k-shadow-deep: rgb(0 0 0 / 0.50);
    --k-steel: #3e4858; --k-steel-deep: #323b4a; --k-tray: #263040; --k-tray-deep: #1d2532; --k-cork: #7d8a9c;
    --k-laptop: #4e5866; --k-key: #3f4855; --k-screen: #0b1019; --k-screen-side: #080c13; --k-notebook: #33465e;
    --k-book1: #2d4466; --k-book2: #4f5f76; --k-book3: #7d8a9c; --k-glass: #8e9aaa; --k-coffee: #3a2b21;
    --k-pen: #28406a; --k-rule: rgb(122 167 255 / 0.20); --k-sticky: #93a9c6; --k-tool-seam: rgb(0 0 0 / 0.30);
    --k-blot-corner: #172031; --k-stitch: rgb(255 255 255 / 0.09); --k-hl-y: rgb(255 212 0 / 0.38);
    --k-hl-p: rgb(162 138 229 / 0.36); --k-hl-color: rgb(255 212 0 / 0.30);
  }
}

[data-v][data-kit] .r4-display { font-family: var(--font-display); font-weight: var(--r4-dw, 400); letter-spacing: var(--r4-dt, 0); }
[data-v][data-kit] .r4-mark { background-image: linear-gradient(var(--r4-hl), var(--r4-hl)); background-repeat: no-repeat; background-size: 100% 0.28em; background-position: 0 88%; }

/* Surfaces: the kit's flat offset shadows become a shadow ring on a transparent border. */
[data-v][data-kit] .k-sheet { border-color: transparent; box-shadow: var(--r4-shadow); }
[data-v][data-kit] .r4-card { border: 1px solid transparent; box-shadow: var(--r4-shadow); }

/* The desk drawing: hairline edges, a ring on the object in focus, the rest fade. */
[data-v][data-kit] .r4-desk .k-svg * { stroke-width: 1px; }
[data-v][data-kit] .r4-desk .k-svg .r4-ring { stroke-width: 2px; }
[data-v][data-kit] .r4-obj, [data-v][data-kit] .r4-ring, [data-v][data-kit] .r4-tag {
  transition-property: opacity; transition-duration: 150ms; transition-timing-function: ease-out;
}
[data-v][data-kit] .r4-obj.is-dim { opacity: 0.35; }
[data-v][data-kit] .r4-ring, [data-v][data-kit] .r4-tag { opacity: 0; }
[data-v][data-kit] .r4-ring.is-on, [data-v][data-kit] .r4-tag.is-on { opacity: 1; }
[data-v][data-kit] .r4-mk-fade .r4-marker { opacity: calc(1 - min(1, var(--r4-p, 0) * 2)); }
[data-v][data-kit] .r4-hit { background: transparent; border: 0; padding: 0; cursor: pointer; border-radius: 12px; -webkit-tap-highlight-color: transparent; }

/* The scroll handler writes the phase (hero, moving, docked) on the page, so the desks swap
   in the same frame as the move. With no phase written, the page is in the hero.
   Motion on: the floating desk carries the move and the contents list follows the scroll.
   Motion off or reduced: the docked desk and the list cross-fade in over 150 ms. */
[data-v][data-kit] .r4-swap { opacity: 0; visibility: hidden; transition-property: opacity, visibility; transition-duration: 150ms; transition-timing-function: ease-out; }
[data-v][data-kit] [data-r4-phase="docked"] .r4-dock,
[data-v][data-kit] [data-r4-phase="moving"] .r4-toc,
[data-v][data-kit] [data-r4-phase="docked"] .r4-toc { opacity: 1; visibility: visible; }
[data-v][data-kit] [data-r4-morph] .r4-swap { transition: none; }
[data-v][data-kit] [data-r4-morph] .r4-toc { opacity: var(--r4-p, 0); }
[data-v][data-kit] .r4-layer { visibility: hidden; }
[data-v][data-kit] [data-r4-morph][data-r4-phase="moving"] .r4-layer { visibility: visible; }
[data-v][data-kit] [data-r4-morph][data-r4-phase="moving"] .r4-hero-desk,
[data-v][data-kit] [data-r4-morph][data-r4-phase="docked"] .r4-hero-desk { visibility: hidden; }
/* On its way, the floating desk takes on the docked look: the job in view ringed, the rest faded. */
[data-v][data-kit] .r4-layer .r4-obj.is-dim { opacity: calc(1 - 0.65 * var(--r4-p, 0)); }
[data-v][data-kit] .r4-layer .r4-ring.is-on { opacity: var(--r4-p, 0); }

/* Buttons and list rows. */
[data-v][data-kit] .r4-btn { transition-property: background-color, box-shadow; transition-duration: 150ms; transition-timing-function: ease-out; }
[data-v][data-kit] .r4-row { transition-property: color, background-color; transition-duration: 150ms; transition-timing-function: ease-out; }
@media (prefers-reduced-motion: no-preference) {
  [data-v][data-kit] .r4-btn { transition-property: scale, background-color, box-shadow; }
  [data-v][data-kit] .r4-btn:not(:disabled):not([aria-disabled="true"]):active { scale: 0.96; }
}
@media (hover: hover) {
  [data-v][data-kit] .r4-btn-2:hover { box-shadow: var(--r4-shadow-hover); }
}

/* The hero enters once: title, copy, actions, figure, 100 ms apart. */
[data-v][data-kit][data-motion="on"] .r4-in { animation: r4-fade 300ms ease-out both; }
@media (prefers-reduced-motion: no-preference) {
  [data-v][data-kit][data-motion="on"] .r4-in { animation-name: r4-rise; }
}
[data-v][data-kit] .r4-in.r4-d1 { animation-delay: 100ms; }
[data-v][data-kit] .r4-in.r4-d2 { animation-delay: 200ms; }
[data-v][data-kit] .r4-in.r4-d3 { animation-delay: 300ms; }
@keyframes r4-fade { from { opacity: 0; } }
@keyframes r4-rise { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } }

/* The narrow-screen bar of the eight objects. */
[data-v][data-kit] .r4-bar { opacity: 0; transition-property: opacity; transition-duration: 150ms; transition-timing-function: ease-out; }
[data-v][data-kit] .r4-bar.is-on { opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  [data-v][data-kit] .r4-bar { translate: 0 -12px; transition-property: opacity, translate; }
  [data-v][data-kit] .r4-bar.is-on { translate: 0 0; transition-duration: 300ms; }
}
`;

      // ---------- The desk ----------
      function R4_DeskTop({ L, uid }) {
        const b = L.blotter;
        const c = 64;
        const R = b.x + b.w;
        const B = b.y + b.h;
        return (
          <g>
            <rect width={L.W} height={L.H} rx="24" fill="var(--k-desk)" />
            <rect
              x={b.x}
              y={b.y + 14}
              width={b.w}
              height={b.h}
              rx="10"
              fill="var(--k-shadow)"
              filter={`url(#${uid}-soft)`}
            />
            <clipPath id={`${uid}-blot`}>
              <rect x={b.x} y={b.y} width={b.w} height={b.h} rx="10" />
            </clipPath>
            <rect
              x={b.x}
              y={b.y}
              width={b.w}
              height={b.h}
              rx="10"
              fill="var(--accent2)"
            />
            <g clipPath={`url(#${uid}-blot)`} fill="var(--k-blot-corner)">
              <polygon
                points={`${b.x},${b.y} ${b.x + c},${b.y} ${b.x},${b.y + c}`}
              />
              <polygon points={`${R},${b.y} ${R - c},${b.y} ${R},${b.y + c}`} />
              <polygon points={`${b.x},${B} ${b.x + c},${B} ${b.x},${B - c}`} />
              <polygon points={`${R},${B} ${R - c},${B} ${R},${B - c}`} />
            </g>
            <rect
              x={b.x + 16}
              y={b.y + 16}
              width={b.w - 32}
              height={b.h - 32}
              rx="4"
              fill="none"
              stroke="var(--k-stitch)"
              strokeDasharray="8 7"
            />
          </g>
        );
      }

      // The whole desk, one drawing. `current`: the job in view; `hot`: the job under the pointer
      // (pass hot and setHot to share it with a key). Either one rings its object and fades the
      // rest. `markers`: the numbered callouts. `interactive`: the invisible object buttons.
      // The buttons repeat the key or the contents list, so they stay out of the tab order.
      function R4_Desk({
        uid,
        current = null,
        hot: hotIn,
        setHot: setHotIn,
        onPick,
        interactive = true,
        markers = true,
      }) {
        const [hotOwn, setHotOwn] = useState(null);
        const hot = setHotIn ? hotIn : hotOwn;
        const setHot = setHotIn || setHotOwn;
        const L = K_WIDE;
        const focus = hot || current;
        const pct = (val, total) => `${(val / total) * 100}%`;
        const box = (id) => {
          const o = K_OBJ[id];
          const p = L.at[id];
          const s = p.s || 1;
          return { o, p, s, w: o.w * s, h: o.h * s };
        };
        return (
          <div
            className="r4-desk relative w-full"
            style={{ aspectRatio: `${L.W} / ${L.H}` }}
          >
            <svg
              viewBox={`0 0 ${L.W} ${L.H}`}
              className="k-svg absolute inset-0 h-full w-full"
              aria-hidden="true"
              focusable="false"
            >
              <defs>
                <filter
                  id={`${uid}-soft`}
                  x="-20%"
                  y="-20%"
                  width="140%"
                  height="140%"
                >
                  <feGaussianBlur stdDeviation="9" />
                </filter>
              </defs>
              <R4_DeskTop L={L} uid={uid} />
              <K_Mug x={L.mug[0]} y={L.mug[1]} />
              {JOBS.map((j) => {
                const { o, p, s, w, h } = box(j.id);
                const Art = o.Art;
                return (
                  <g
                    key={j.id}
                    transform={`translate(${p.x} ${p.y}) rotate(${p.r} ${w / 2} ${h / 2}) scale(${s})`}
                  >
                    <g filter={`url(#${uid}-soft)`}>
                      {o.shade.map(([x, y, sw, sh, rx], k) => (
                        <rect
                          key={k}
                          x={x + 3}
                          y={y + 12}
                          width={sw}
                          height={sh}
                          rx={rx}
                          fill={
                            p.deep ? "var(--k-shadow-deep)" : "var(--k-shadow)"
                          }
                        />
                      ))}
                    </g>
                    <g
                      className={`r4-obj ${focus && focus !== j.id ? "is-dim" : ""}`}
                    >
                      <Art anim="off" />
                    </g>
                    <rect
                      className={`r4-ring ${focus === j.id ? "is-on" : ""}`}
                      x="-14"
                      y="-14"
                      width={o.w + 28}
                      height={o.h + 28}
                      rx="16"
                      fill="none"
                      stroke="var(--accent)"
                    />
                  </g>
                );
              })}
            </svg>
            {markers && (
              <div
                aria-hidden="true"
                className="pointer-events-none absolute inset-0"
              >
                {JOBS.map((j, i) => {
                  const { p } = box(j.id);
                  const on = focus === j.id;
                  return (
                    <span
                      key={j.id}
                      className={`r4-marker absolute grid size-5 -translate-x-1/2 -translate-y-1/2 place-items-center rounded-full font-mono text-[11px] tabular-nums sm:size-7 sm:text-[13px] ${
                        on
                          ? "bg-accent text-surface"
                          : "r4-card bg-surface text-ink"
                      }`}
                      style={{
                        left: pct(p.x + 6, L.W),
                        top: pct(p.y + 4, L.H),
                      }}
                    >
                      {i + 1}
                    </span>
                  );
                })}
              </div>
            )}
            {interactive && (
              <div aria-hidden="true">
                {JOBS.map((j) => {
                  const { p, w, h } = box(j.id);
                  return (
                    <button
                      key={j.id}
                      type="button"
                      tabIndex={-1}
                      className="r4-hit absolute"
                      style={{
                        left: pct(p.x, L.W),
                        top: pct(p.y, L.H),
                        width: pct(w, L.W),
                        height: pct(h, L.H),
                        transform: `rotate(${p.r}deg)`,
                      }}
                      onPointerEnter={() => setHot(j.id)}
                      onPointerLeave={() => setHot(null)}
                      onClick={() => onPick && onPick(j.id)}
                    />
                  );
                })}
                {JOBS.map((j, i) => {
                  const { p } = box(j.id);
                  return (
                    <span
                      key={j.id}
                      className={`r4-tag bg-ink text-ground pointer-events-none absolute z-10 rounded-[6px] px-2 py-1 text-[13px] font-semibold whitespace-nowrap ${hot === j.id ? "is-on" : ""}`}
                      style={{
                        left: `calc(${pct(p.x + 6, L.W)} + 20px)`,
                        top: pct(p.y + 4, L.H),
                        transform: "translateY(-50%)",
                      }}
                    >
                      {j.name}
                    </span>
                  );
                })}
              </div>
            )}
          </div>
        );
      }

      // ---------- Small parts ----------
      function R4_Btn({ href, primary = false, children }) {
        return (
          <a
            href={href}
            className={`r4-btn inline-flex h-11 items-center gap-2 rounded-[10px] text-[15px] font-semibold ${
              primary
                ? "bg-ink text-ground hover:bg-ink/85 border border-transparent ps-[18px] pe-4"
                : "r4-card r4-btn-2 bg-surface text-ink px-[18px]"
            }`}
          >
            {children}
            {primary && (
              <K_Icon name="ArrowRight" size={16} strokeWidth={2.25} />
            )}
          </a>
        );
      }

      // The figure's key: the eight jobs as buttons, linked to the desk by the shared `hot`.
      function R4_Key({ hot, setHot, onPick }) {
        return (
          <ol
            aria-label="The eight jobs"
            className="grid gap-x-6 gap-y-0.5 sm:grid-cols-2"
          >
            {JOBS.map((j, i) => (
              <li key={j.id}>
                <button
                  type="button"
                  onClick={() => onPick(j.id)}
                  onPointerEnter={() => setHot(j.id)}
                  onPointerLeave={() => setHot(null)}
                  onFocus={() => setHot(j.id)}
                  onBlur={() => setHot(null)}
                  className={`r4-row grid w-full grid-cols-[2.5rem_1.5rem_minmax(0,1fr)] items-center gap-2 rounded-[8px] px-1.5 py-1 text-left text-[15px] ${
                    hot === j.id ? "bg-ink/[0.05] text-ink" : "text-ink"
                  }`}
                >
                  <K_ObjIcon id={j.id} className="h-7 w-10" />
                  <span
                    className={`font-mono text-[12px] tabular-nums ${hot === j.id ? "text-accent" : "text-muted"}`}
                  >
                    {i + 1}
                  </span>
                  <span>{j.name}</span>
                </button>
              </li>
            ))}
          </ol>
        );
      }

      // The contents list under the docked desk.
      function R4_Toc({ current, onPick }) {
        return (
          <nav aria-label="Contents">
            <p className="px-2 font-mono text-[11px] tracking-[0.08em] text-muted uppercase">
              Contents
            </p>
            <ol className="mt-2 grid gap-0.5">
              {JOBS.map((j, i) => {
                const on = current === j.id;
                return (
                  <li key={j.id}>
                    <button
                      type="button"
                      onClick={() => onPick(j.id)}
                      aria-current={on ? "location" : undefined}
                      className={`r4-row grid w-full grid-cols-[2rem_minmax(0,1fr)] items-baseline rounded-[8px] px-2 py-1.5 text-left text-[14.5px] leading-snug ${
                        on
                          ? "r4-card bg-surface text-ink font-semibold"
                          : "hover:bg-ink/[0.04] hover:text-ink text-muted"
                      }`}
                    >
                      <span
                        className={`font-mono text-[12px] font-normal tabular-nums ${on ? "text-accent" : ""}`}
                      >
                        {K_NUM(i)}
                      </span>
                      <span>{j.name}</span>
                    </button>
                  </li>
                );
              })}
            </ol>
            <a
              href={FACTS.install}
              className="r4-row text-ink hover:bg-ink/[0.04] mt-4 inline-flex items-center gap-1.5 rounded-[8px] px-2 py-1.5 text-[14.5px] font-semibold"
            >
              Install ZotLit
              <K_Icon name="ArrowRight" size={15} strokeWidth={2.25} />
            </a>
          </nav>
        );
      }

      // Under 1024 px: the eight objects in a bar at the top, once the hero figure is gone.
      function R4_Bar({ show, current, onPick }) {
        const job = JOBS.find((j) => j.id === current);
        return (
          <nav
            aria-label="Jobs"
            inert={!show}
            className={`r4-bar border-line bg-ground/90 fixed inset-x-0 top-0 z-40 border-b backdrop-blur-md ${show ? "is-on" : ""}`}
          >
            <ol className="mx-auto flex max-w-[640px] px-2 pt-1.5">
              {JOBS.map((j, i) => {
                const on = current === j.id;
                return (
                  <li key={j.id} className="min-w-0 flex-1">
                    <button
                      type="button"
                      aria-label={`${K_NUM(i)} ${j.name}`}
                      aria-current={on ? "location" : undefined}
                      onClick={() => onPick(j.id)}
                      className={`r4-row grid w-full justify-items-center gap-0.5 rounded-[8px] py-1 ${on ? "r4-card bg-surface" : ""}`}
                    >
                      <K_ObjIcon
                        id={j.id}
                        className={`h-6 w-8 ${on ? "" : "opacity-55"}`}
                      />
                      <span
                        className={`font-mono text-[10px] tabular-nums ${on ? "text-accent" : "text-muted"}`}
                      >
                        {K_NUM(i)}
                      </span>
                    </button>
                  </li>
                );
              })}
            </ol>
            <p className="text-ink truncate px-4 pt-1 pb-2 text-center text-[13px] font-semibold">
              {job ? job.name : "The eight jobs"}
            </p>
          </nav>
        );
      }

      // ---------- Sections ----------
      function R4_Hero({ v, slotRef, figRef, hot, setHot, onPick }) {
        return (
          <section aria-labelledby="r4-h1" className="px-4 sm:px-8">
            <div className="mx-auto max-w-[1240px]">
              <div className="grid gap-7 pt-8 pb-10 sm:pt-12 lg:grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)] lg:items-end lg:gap-16 lg:pt-14 lg:pb-14">
                <h1
                  id="r4-h1"
                  className="r4-in r4-display text-[2.6rem] leading-[1.02] text-balance sm:text-[3.6rem] lg:text-[4.4rem]"
                >
                  An integrated <span className="r4-mark">research desk</span>{" "}
                  for Obsidian.
                </h1>
                <div className="grid gap-6 lg:pb-2">
                  <p className="r4-in r4-d1 max-w-[46ch] text-[18px] leading-relaxed text-muted">
                    Find, read, annotate, cite and export the papers in your
                    Zotero library, right beside the notes you write.
                  </p>
                  <div className="r4-in r4-d2 flex flex-wrap gap-3">
                    <R4_Btn href={FACTS.install} primary>
                      Install ZotLit
                    </R4_Btn>
                    <R4_Btn href={FACTS.docs}>Read the docs</R4_Btn>
                  </div>
                  <p className="r4-in r4-d2 text-[13.5px] leading-snug text-muted">
                    {FACTS.obsidian} · {FACTS.zotero} · {FACTS.platforms}
                  </p>
                </div>
              </div>
              <figure ref={figRef} className="r4-in r4-d3 m-0">
                <div
                  ref={slotRef}
                  className="relative"
                  style={{ aspectRatio: `${K_WIDE.W} / ${K_WIDE.H}` }}
                >
                  <div className="r4-hero-desk">
                    <R4_Desk
                      uid={`r4h-${v}`}
                      hot={hot}
                      setHot={setHot}
                      onPick={onPick}
                    />
                  </div>
                </div>
                <figcaption className="mt-6 grid gap-5 lg:max-w-[calc(100%-364px)] lg:grid-cols-[minmax(0,1fr)_minmax(0,2fr)] lg:gap-12">
                  <p className="max-w-[36ch] text-[15px] leading-relaxed text-muted">
                    <span className="text-ink font-semibold">Figure 1.</span>{" "}
                    Your research desk, seen from above. Each object is one job
                    in a research project. Select one to read about it.
                  </p>
                  <R4_Key hot={hot} setHot={setHot} onPick={onPick} />
                </figcaption>
              </figure>
            </div>
          </section>
        );
      }

      function R4_Job({ job, i, columns, side }) {
        return (
          <section
            id={r4Sec(job.id)}
            aria-labelledby={`r4-h-${job.id}`}
            className="border-line scroll-mt-24 border-t pt-14 pb-20 lg:scroll-mt-8 lg:pt-16 lg:pb-24"
          >
            <header className="max-w-[44rem]">
              <div className="flex items-center gap-3">
                {!side && (
                  <K_ObjIcon id={job.id} className="h-9 w-12 shrink-0" />
                )}
                <p className="font-mono text-[12px] tracking-[0.04em] text-muted tabular-nums">
                  <span className="text-accent">{K_NUM(i)}</span> /{" "}
                  {K_NUM(JOBS.length - 1)}
                </p>
              </div>
              <h2
                id={`r4-h-${job.id}`}
                className="r4-display mt-3 text-[2rem] leading-[1.08] text-balance sm:text-[2.6rem]"
              >
                {job.name}
              </h2>
              <p className="mt-3 max-w-[52ch] text-[17.5px] leading-relaxed text-muted">
                {job.outcome}
              </p>
            </header>
            <div className="mt-10 grid gap-12">
              {K_JOB_DEMOS[job.id].map((d) => (
                <figure key={d.id} className="m-0 min-w-0">

                  <K_DemoCaption entry={d} />

              <K_PartsList job={job.id} columns={columns} label="In this job" />
            </div>
          </section>
        );
      }

      function R4_Setup() {
        const need = [
          { icon: "NotebookPen", text: FACTS.obsidian },
          { icon: "Library", text: `${FACTS.zotero}. ${FACTS.zoteroEdit}.` },
          { icon: "Monitor", text: FACTS.platforms },
        ];
        const label =
          "font-mono text-[11px] tracking-[0.08em] text-muted uppercase";
        return (
          <section
            aria-labelledby="r4-setup-h"
            className="px-4 pt-8 pb-16 sm:px-8"
          >
            <div className="border-line mx-auto max-w-[1240px] border-t pt-16 lg:pt-20">
              <div className="grid gap-12 lg:grid-cols-[minmax(0,1fr)_minmax(0,2fr)] lg:gap-16">
                <div>
                  <h2
                    id="r4-setup-h"
                    className="r4-display text-[2.25rem] leading-[1.08] sm:text-[2.75rem]"
                  >
                    Set up your desk
                  </h2>
                  <p className="mt-3 text-[17.5px] leading-relaxed text-muted">
                    Three steps, all inside Obsidian.
                  </p>
                  <div className="mt-8 flex flex-wrap gap-3">
                    <R4_Btn href={FACTS.install} primary>
                      Install ZotLit
                    </R4_Btn>
                    <R4_Btn href={FACTS.firstNote}>Start the tutorial</R4_Btn>
                  </div>
                </div>
                <div>
                  <ol className="r4-card bg-surface divide-line grid overflow-hidden rounded-[14px] max-md:divide-y md:grid-cols-3 md:divide-x">
                    {INSTALL_STEPS.map((s, i) => (
                      <li key={s.name} className="flex flex-col p-6">
                        <span className="text-accent font-mono text-[12px] tabular-nums">
                          Step {i + 1}
                        </span>
                        <h3 className="mt-2 text-[17px] leading-snug font-semibold">
                          {s.name}
                        </h3>
                        <p className="mt-1.5 text-[15px] leading-relaxed text-muted">
                          {s.line}
                        </p>
                        <a
                          href={s.href}
                          className="text-ink hover:text-accent mt-auto inline-flex items-center gap-1 pt-5 text-[14.5px] font-semibold"
                        >
                          {i === 0 ? "Open in Obsidian" : "Follow the tutorial"}
                          <K_Icon
                            name="ArrowUpRight"
                            size={15}
                            strokeWidth={2.25}
                          />
                        </a>
                      </li>
                    ))}
                  </ol>
                  <div className="mt-12 grid gap-10 sm:grid-cols-2">
                    <div>
                      <h3 className={label}>What you need</h3>
                      <ul className="mt-4 grid gap-3">
                        {need.map((n) => (
                          <li
                            key={n.text}
                            className="flex items-start gap-3 text-[15.5px] leading-snug"
                          >
                            <K_Icon
                              name={n.icon}
                              size={17}
                              strokeWidth={1.5}
                              className="mt-0.5 shrink-0 text-muted"
                            />
                            {n.text}
                          </li>
                        ))}
                      </ul>
                    </div>
                    <div>
                      <h3 className={label}>Optional add-ons for Zotero</h3>
                      <ul className="mt-4 grid gap-4">
                        {ADDONS.map((a) => (
                          <li key={a.name}>
                            <p className="text-[15.5px] font-semibold">
                              {a.name}
                            </p>
                            <p className="mt-0.5 text-[15px] leading-snug text-muted">
                              {a.line}
                            </p>
                            <a
                              href={a.href}
                              className="text-ink hover:text-accent mt-1 inline-flex items-center gap-1 text-[14px] font-semibold"
                            >
                              How to install
                              <K_Icon
                                name="ArrowUpRight"
                                size={14}
                                strokeWidth={2.25}
                              />
                            </a>
                          </li>
                        ))}
                      </ul>
                    </div>
                  </div>
                  <div className="border-line mt-12 grid gap-5 border-t pt-8 text-[15.5px] leading-snug sm:grid-cols-2">
                    <p className="flex items-start gap-3">
                      <K_Icon
                        name="ShieldCheck"
                        size={18}
                        strokeWidth={1.5}
                        className="mt-0.5 shrink-0 text-muted"
                      />
                      {FACTS.privacy}
                    </p>
                    <p className="flex items-start gap-3">
                      <K_Icon
                        name="Scale"
                        size={18}
                        strokeWidth={1.5}
                        className="mt-0.5 shrink-0 text-muted"
                      />
                      {FACTS.license}.
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      // ---------- The page ----------
      function R4_Page({ v }) {
        const { motion } = useProtoState();
        const reduced = K_useMedia("(prefers-reduced-motion: reduce)");
        const side = K_useMedia("(min-width: 1024px)");
        const roomy = K_useMedia("(min-width: 1280px)");
        const tablet = K_useMedia("(min-width: 768px)");
        const smooth = motion && !reduced;
        // Motion on: the hero desk itself shrinks into the contents column as you scroll.
        const morph = side && smooth;
        const pageRef = useRef(null);
        const heroSlot = useRef(null);
        const heroFig = useRef(null);
        const dockSlot = useRef(null);
        const grid = useRef(null);
        const layer = useRef(null);
        const [barOn, setBarOn] = useState(false);
        const [hot, setHot] = useState(null);
        const ids = useMemo(() => JOBS.map((j) => r4Sec(j.id)), []);
        const spy = K_useSpy(ids);
        const current = spy ? spy.slice("r4-job-".length) : null;
        const pick = useCallback(
          (id) => K_scrollTo(r4Sec(id), { smooth }),
          [smooth],
        );

        // p: 0 while the hero desk sits in the hero, 1 once the job column reaches the sticky
        // line. In between, the floating layer draws the desk on its way to the column.
        useEffect(() => {
          let raf = 0;
          const update = () => {
            raf = 0;
            const hs = heroSlot.current;
            const page = pageRef.current;
            if (!hs || !page) return;
            if (!side) {
              const fig = heroFig.current;
              setBarOn(!!fig && fig.getBoundingClientRect().bottom < 0);
              return;
            }
            setBarOn(false);
            const g = grid.current;
            if (!g) return;
            const hr = hs.getBoundingClientRect();
            const gr = g.getBoundingClientRect();
            const start = R4_START + hr.height + (gr.top - hr.bottom);
            const p = r4Clamp(
              (start - gr.top) / Math.max(1, start - R4_STICKY),
            );
            page.style.setProperty("--r4-p", p.toFixed(4));
            page.dataset.r4Phase =
              p <= 0 ? "hero" : p >= 1 ? "docked" : morph ? "moving" : "hero";
            const el = layer.current;
            const ds = dockSlot.current;
            if (morph && el && ds) {
              // The desk narrows to the column width in the first half of the way, so the page
              // that scrolls up under it (the left column) is never covered.
              const dr = ds.getBoundingClientRect();
              const e = r4Ease(p);
              const es = r4Ease(r4Clamp(p / 0.55));
              const s = r4Lerp(1, dr.width / hr.width, es);
              const right = r4Lerp(hr.right, dr.right, es);
              const top = r4Lerp(hr.top, dr.top, e);
              el.style.width = `${hr.width}px`;
              el.style.transform = `translate3d(${right - hr.width * s}px, ${top}px, 0) scale(${s})`;
            }
          };
          const on = () => {
            if (!raf) raf = requestAnimationFrame(update);
          };
          update();
          window.addEventListener("scroll", on, { passive: true });
          window.addEventListener("resize", on);
          return () => {
            window.removeEventListener("scroll", on);
            window.removeEventListener("resize", on);
            cancelAnimationFrame(raf);
          };
        }, [side, morph]);

        // A colour-scheme switch repaints every colour at once, with no transitions.
        useEffect(() => {
          const mql = window.matchMedia("(prefers-color-scheme: dark)");
          const onChange = () => {
            const style = document.createElement("style");
            style.append(
              document.createTextNode(
                "*,*::before,*::after{transition:none !important}",
              ),
            );
            document.head.append(style);
            void document.body.offsetHeight;
            requestAnimationFrame(() =>
              requestAnimationFrame(() => style.remove()),
            );
          };
          mql.addEventListener("change", onChange);
          return () => mql.removeEventListener("change", onChange);
        }, []);

        const columns = side ? (roomy ? 2 : 1) : tablet ? 2 : 1;
        return (
          <K_Root v={v}>
            <style>{R4_CSS}</style>
            <div
              ref={pageRef}
              data-r4-morph={morph ? "" : undefined}
              style={{ "--r4-p": 0 }}
            >
              <K_Header />
              {!side && <R4_Bar show={barOn} current={current} onPick={pick} />}
              <main>
                <R4_Hero
                  v={v}
                  slotRef={heroSlot}
                  figRef={heroFig}
                  hot={hot}
                  setHot={setHot}
                  onPick={pick}
                />
                <div className="px-4 sm:px-8">
                  <div
                    ref={grid}
                    className="mx-auto mt-16 max-w-[1240px] lg:grid lg:grid-cols-[minmax(0,1fr)_300px] lg:gap-x-16"
                  >
                    {side && (
                      <aside
                        aria-label="Contents"
                        className="lg:col-start-2 lg:row-start-1"
                      >
                        <div
                          className="sticky pb-10"
                          style={{ top: R4_STICKY }}
                        >
                          <div
                            ref={dockSlot}
                            style={{ aspectRatio: `${K_WIDE.W} / ${K_WIDE.H}` }}
                          >
                            <div className="r4-swap r4-dock">
                              <R4_Desk
                                uid={`r4d-${v}`}
                                current={current}
                                onPick={pick}
                                markers={false}
                              />
                            </div>
                          </div>
                          <div className="r4-swap r4-toc mt-6">
                            <R4_Toc current={current} onPick={pick} />
                          </div>
                        </div>
                      </aside>
                    )}
                    <div className="min-w-0 lg:col-start-1 lg:row-start-1">
                      {JOBS.map((j, i) => (
                        <R4_Job
                          key={j.id}
                          job={j}
                          i={i}
                          columns={columns}
                          side={side}
                        />
                      ))}
                    </div>
                  </div>
                </div>
                <R4_Setup />
              </main>
              <K_Footer />
              {morph && (
                <div
                  ref={layer}
                  aria-hidden="true"
                  className="r4-layer r4-mk-fade pointer-events-none fixed top-0 left-0 z-30 origin-top-left"
                >
                  <R4_Desk
                    uid={`r4l-${v}`}
                    current={current}
                    interactive={false}
                  />
                </div>
              )}
            </div>
          </K_Root>
        );
      }

      // --- Shared END ---

      // --- Variant A ---
      // Variant A · Journal. Round 3's "Desk at your side" in a warm print-journal style:
      // Newsreader headings, Source Sans 3 text, IBM Plex Mono labels, cloth and wood tones on
      // the desk. The page itself is the shared R4_Page; the tokens for "A" set the style.
      function VariantA() {
        return <R4_Page v="A" />;
      }
      // --- Variant A END ---

      // --- Variant B ---
      // Variant B · Lab. Round 3's "Desk at your side" in a cool, digital research-tool style:
      // Inter headings and text, JetBrains Mono labels, one slate-blue family on the desk. The
      // page itself is the shared R4_Page; the tokens for "B" set the style.
      function VariantB() {
        return <R4_Page v="B" />;
      }
      // --- Variant B END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Journal", component: VariantA },
        { key: "B", name: "Lab", component: VariantB },
      ];

      function App() {
        const { motion } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          window.scrollTo(0, 0);
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        const btn = {
          background: "none",
          border: "none",
          color: "inherit",
          cursor: "pointer",
          fontSize: "1.1rem",
          padding: "0 0.25rem",
        };
        return (
          <>
            <V.component key={V.key} />
            <div
              style={{
                position: "fixed",
                bottom: "1rem",
                left: "50%",
                transform: "translateX(-50%)",
                background: "#111827",
                color: "#f8fafc",
                borderRadius: "9999px",
                padding: "0.45rem 1rem",
                display: "flex",
                alignItems: "center",
                gap: "0.75rem",
                fontSize: "0.8125rem",
                zIndex: 9999,
                boxShadow: "0 6px 20px rgba(0,0,0,0.35)",
                fontFamily: "ui-sans-serif, system-ui, sans-serif",
                maxWidth: "calc(100vw - 2rem)",
                whiteSpace: "nowrap",
              }}
            >
              <button
                aria-label="Previous variant"
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={btn}
              >
                ←
              </button>
              <span style={{ display: "flex", gap: "0.35rem" }}>
                {VARIANTS.map((v, i) => (
                  <button
                    key={v.key}
                    aria-label={`Variant ${v.key}: ${v.name}`}
                    onClick={() => setIdx(i)}
                    style={{
                      width: "1.5rem",
                      height: "1.5rem",
                      borderRadius: "9999px",
                      border: "none",
                      cursor: "pointer",
                      background:
                        i === idx ? "#E8622C" : "rgba(255,255,255,0.12)",
                      color: "#fff",
                      fontSize: "0.7rem",
                      fontWeight: 600,
                    }}
                  >
                    {v.key}
                  </button>
                ))}
              </span>
              <span
                style={{
                  minWidth: 0,
                  maxWidth: "min(10rem, 24vw)",
                  overflow: "hidden",
                  textOverflow: "ellipsis",
                }}
              >
                {V.name}
              </span>
              <button
                aria-label="Next variant"
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={btn}
              >
                →
              </button>
              <button
                onClick={() => setProto((s) => ({ motion: !s.motion }))}
                style={{
                  ...btn,
                  fontSize: "0.75rem",
                  border: "1px solid rgba(255,255,255,0.25)",
                  borderRadius: "9999px",
                  padding: "0.15rem 0.6rem",
                }}
              >
                {motion ? "Pause motion" : "Play motion"}
              </button>
            </div>
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
