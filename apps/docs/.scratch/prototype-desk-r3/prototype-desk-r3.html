    <!--
      PROTOTYPE (round 3), throwaway. Not production code. Branch: proto/landing-page.
      Round 2 (commit 98a1207fa, prototype-desk/) had five variants. The user's verdict:
      keep the concept of D (a top-down drawing of a desk whose objects stand for the eight
      research jobs), but with no pop-out panel (it makes the page hard to explore) and no
      "Three things you will notice first" section (verbose). Keep A's feature layout (per
      job: a face-on working demo beside a parts list of every feature of that job), but do
      not force A's exploded scroll assembly on the reader.

      DESIGN QUESTION
        How does the desk lead the reader into the job sections? Every variant draws the
        same desk (the kit: K_Desk, K_ObjIcon), uses the same demos (K_JOB_DEMOS) and the
        same parts list (K_PartsList), so the variants differ only in STRUCTURE: where the
        desk sits, how it links to the sections, and how each section opens.

      TREATMENT
        Round 2 variant D's world, shared by all four: ground #E6EBF0 · surface #FFFFFF ·
        ink #1A2433 · muted #5F6B7A · line #C9D2DC · accent #E8622C · accent2 #24354D ·
        cite #2F6FEB; Young Serif (display) · Atkinson Hyperlegible Next (body) · Azeret
        Mono (data). Flat top-down drawing, one 1.5 px edge, flat offset shadows.

      VARIANTS (each root carries data-v="<KEY>" and data-kit)
        A  Desk as contents     The hero desk is a contents page: select an object to scroll
                                to its section. A slim bar of the eight objects stays at the
                                top while you read and marks where you are.
        B  Desk at your side    On wide screens the desk stays in a column beside the
                                sections; the object for the section in view lifts, and the
                                reader can select another to jump there.
        C  Object chapters      Each job section opens with its object lifted off the desk
                                and drawn large, like a chapter opener. Nothing is sticky.
        D  The page is the desk The desk surface runs down the page; each section is laid
                                out on it: the demo as a sheet, the parts list as a card,
                                the object beside them.
    -->

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, {
        useState,
        useEffect,
        useMemo,
        useRef,
        useCallback,
        useLayoutEffect,
        useSyncExternalStore,
        Fragment,
      } from "react";
      import { createRoot } from "react-dom/client";
      // Every lucide icon, as Icons.Search, Icons.Quote, ... (variants cannot add imports).
      import * as Icons from "lucide-react";
      // motion (framer-motion): Motion.motion.div, Motion.AnimatePresence, Motion.useScroll ...
      import * as Motion from "motion/react";

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // --- App ---
      // --- Shared ---
      // Shared by every variant: the mock store, animation hooks, the brand mark, and one
      // mock research library (a thesis on language models and situated knowledge). Variants
      // read all of it from module scope and take no props, so a trimmed winner renders bare.

      // ---------- Store ----------
      // motion: false freezes every loop (switcher toggle, and prefers-reduced-motion).
      // paper: the featured Zotero item, by citation key.
      const protoStore = (() => {
        let state = {
          motion: !window.matchMedia("(prefers-reduced-motion: reduce)")
            .matches,
          paper: "vaswani2017",
        };
        const subs = new Set();
        return {
          get: () => state,
          set: (patch) => {
            state = {
              ...state,
              ...(typeof patch === "function" ? patch(state) : patch),
            };
            subs.forEach((f) => f());
          },
          subscribe: (f) => {
            subs.add(f);
            return () => subs.delete(f);
          },
        };
      })();
      function useProtoState() {
        return useSyncExternalStore(protoStore.subscribe, protoStore.get);
      }
      const setProto = protoStore.set;

      // ---------- Animation hooks ----------
      // useLoop(stepMs, count): an index that cycles 0..count-1. Holds still when motion is off.
      function useLoop(stepMs, count, { active = true, start = 0 } = {}) {
        const { motion } = useProtoState();
        const [i, setI] = useState(start);
        useEffect(() => {
          if (!motion || !active) return;
          const id = setInterval(() => setI((n) => (n + 1) % count), stepMs);
          return () => clearInterval(id);
        }, [motion, active, stepMs, count]);
        return i;
      }

      // useTimeline([ms, ms, ...]): the index of the current step; step k lasts durations[k],
      // then the timeline loops. With motion off it rests on the last step (the finished state).
      function useTimeline(durations, { active = true, loop = true } = {}) {
        const { motion } = useProtoState();
        const [i, setI] = useState(0);
        const key = durations.join(",");
        useEffect(() => {
          if (!motion) {
            setI(durations.length - 1);
            return;
          }
          if (!active) return;
          let cancelled = false;
          let t;
          let k = 0;
          setI(0);
          const next = () => {
            t = setTimeout(() => {
              if (cancelled) return;
              if (k === durations.length - 1 && !loop) return;
              k = (k + 1) % durations.length;
              setI(k);
              next();
            }, durations[k]);
          };
          next();
          return () => {
            cancelled = true;
            clearTimeout(t);
          };
        }, [motion, active, key, loop]);
        return i;
      }

      // useTypewriter(text): the typed prefix of text. Full text when motion is off or done.
      function useTypewriter(
        text,
        { cps = 28, active = true, delay = 0 } = {},
      ) {
        const { motion } = useProtoState();
        const [n, setN] = useState(motion ? 0 : text.length);
        useEffect(() => {
          if (!motion) {
            setN(text.length);
            return;
          }
          if (!active) {
            setN(0);
            return;
          }
          setN(0);
          let i = 0;
          let iv;
          const t = setTimeout(() => {
            iv = setInterval(() => {
              i += 1;
              setN(i);
              if (i >= text.length) clearInterval(iv);
            }, 1000 / cps);
          }, delay);
          return () => {
            clearTimeout(t);
            clearInterval(iv);
          };
        }, [text, cps, active, delay, motion]);
        return text.slice(0, n);
      }

      // useInView(ref): true while the element is on screen (or once, with { once: true }).
      function useInView(ref, { threshold = 0.3, once = false } = {}) {
        const [inView, setInView] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => {
              if (e.isIntersecting) {
                setInView(true);
                if (once) io.disconnect();
              } else if (!once) setInView(false);
            },
            { threshold },
          );
          io.observe(el);
          return () => io.disconnect();
        }, [threshold, once]);
        return inView;
      }

      // useScrollProgress(ref): 0 when the element's top meets the viewport bottom,
      // 1 when its bottom meets the viewport top. For scroll-driven stages.
      function useScrollProgress(ref) {
        const [p, setP] = useState(0);
        useEffect(() => {
          let raf = 0;
          const update = () => {
            raf = 0;
            const el = ref.current;
            if (!el) return;
            const r = el.getBoundingClientRect();
            const vh = window.innerHeight;
            const total = r.height + vh;
            setP(Math.min(1, Math.max(0, (vh - r.top) / total)));
          };
          const onScroll = () => {
            if (!raf) raf = requestAnimationFrame(update);
          };
          update();
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", onScroll);
          return () => {
            window.removeEventListener("scroll", onScroll);
            window.removeEventListener("resize", onScroll);
            cancelAnimationFrame(raf);
          };
        }, []);
        return p;
      }

      // ---------- Brand (docs/brand.md) ----------
      // The ZL mark from its master geometry; never redraw it. Dark inks: #D8E2F0 / #F0793F.
      function ZotLitMark({

        ink = "#1E3A5F",
        accent = "#E8622C",
        className = "",
        title = "ZotLit",

            <path
              d="M17 3.5 H20.5 V16.5 L18.75 14.75 L17 16.5 Z"
              fill={accent}

      }
      // "Zot" in ink, "Lit" in accent, Archivo SemiBold, tracking -1%.
      function Wordmark({

        className = "",

        markInk = "#1E3A5F",

      // ---------- Facts ----------

      // ---------- Every feature ----------
      // job: a JOBS id. since: "2.0" (the basics) | "2.1" | "2.2" (2.2 includes main).

      function K_DeskTop({ L }) {

      // The whole desk. `current`: the object to lift and label (for example the job in view).
      // `onPick(id)`: called when the reader selects an object. `labels`: "hover" shows a name tag
      // on hover and for `current` (always on the tall layout), "always" shows every tag, "none"
      // shows none. `dimOthers`: fade every object except `current`. `layout`: force "wide" or
      // "tall"; otherwise `wide` picks.
      function K_Desk({
        wide = true,
        layout,
        current = null,
        onPick,
        paused = false,
        labels = "hover",
        dimOthers = false,
        pickLabel = (j) => j.name,
      }) {
        const L =
          layout === "tall"
            ? K_TALL
            : layout === "wide"
              ? K_WIDE
              : wide
                ? K_WIDE
                : K_TALL;
        const isWide = L === K_WIDE;
        const selected = current;
        const { motion } = useProtoState();
        const [hot, setHot] = useState(null);
        const ref = useRef(null);
        const band = K_useBand(ref);
        const anim = !motion ? "off" : band && !paused ? "run" : "pause";
        const box = (id) => {
          const o = K_OBJ[id];
          const p = L.at[id];
          const s = p.s || 1;
          return { o, p, s, w: o.w * s, h: o.h * s };
        };
        const pct = (v, total) => `${(v / total) * 100}%`;
        return (
          <div
            ref={ref}
            className="relative w-full"
            style={{ aspectRatio: `${L.W} / ${L.H}` }}
          >
            <svg
              viewBox={`0 0 ${L.W} ${L.H}`}
              className="k-svg absolute inset-0 h-full w-full"
              aria-hidden="true"
              focusable="false"
            >
              <K_DeskTop L={L} />
              {L.mug && <K_Mug x={L.mug[0]} y={L.mug[1]} />}
              {JOBS.map((j, i) => {
                const { o, p, s, w, h } = box(j.id);
                const on = hot === j.id || selected === j.id;
                const dim = dimOthers && selected && selected !== j.id;
                const Art = o.Art;
                return (
                  <g
                    key={j.id}
                    transform={`translate(${p.x} ${p.y}) rotate(${p.r} ${w / 2} ${h / 2}) scale(${s})`}
                  >
                    <g
                      className={motion ? "k-settle" : ""}
                      style={{ animationDelay: `${150 + i * 85}ms` }}
                    >
                      <g className={`k-shade ${on ? "is-on" : ""}`}>
                        {o.shade.map(([x, y, sw, sh, rx], k) => (
                          <rect
                            key={k}
                            x={x + 7}
                            y={y + 9}
                            width={sw}
                            height={sh}
                            rx={rx}
                            fill={
                              p.deep
                                ? "var(--k-shadow-deep)"
                                : "var(--k-shadow)"
                            }
                          />
                        ))}
                      </g>
                      <g
                        className={`k-lift ${on ? "is-on" : ""} ${dim ? "is-dim" : ""}`}
                      >
                        <Art anim={j.id === "read" ? anim : "off"} />
                      </g>
                    </g>
                  </g>
                );
              })}
            </svg>
            {JOBS.map((j) => {
              const { p, w, h } = box(j.id);
              return (
                <button
                  key={j.id}
                  type="button"
                  aria-label={pickLabel(j)}
                  aria-current={selected === j.id ? "true" : undefined}
                  className="k-hit absolute"
                  style={{
                    left: pct(p.x, L.W),
                    top: pct(p.y, L.H),
                    width: pct(w, L.W),
                    height: pct(h, L.H),
                    transform: `rotate(${p.r}deg)`,
                  }}
                  onPointerEnter={() => setHot(j.id)}
                  onPointerLeave={() => setHot((x) => (x === j.id ? null : x))}
                  onFocus={() => setHot(j.id)}
                  onBlur={() => setHot((x) => (x === j.id ? null : x))}
                  onClick={() => onPick && onPick(j.id)}
                />
              );
            })}
            {JOBS.map((j, i) => {
              const { p, w } = box(j.id);
              const show =
                labels === "always" ||
                (labels === "hover" &&
                  (!isWide || hot === j.id || selected === j.id));
              if (!show) return null;
              const left = isWide ? pct(p.x + w / 2, L.W) : pct(p.lx, L.W);
              const top = isWide ? pct(p.y, L.H) : pct(p.ly, L.H);
              return (
                <span
                  key={j.id}
                  aria-hidden="true"
                  className={`border-line bg-surface text-ink k-sheet pointer-events-none absolute z-10 inline-flex w-max items-center gap-1.5 rounded-full border ${
                    isWide
                      ? "px-3 py-1.5 text-[14px] font-semibold whitespace-nowrap"
                      : "max-w-[47%] px-2.5 py-1 text-[12.5px] leading-tight font-semibold"
                  } ${isWide && motion && labels === "hover" ? "k-rise" : ""}`}
                  style={{
                    left,
                    top,
                    transform: isWide
                      ? "translate(-50%, -55%)"
                      : "translate(-50%, 0)",
                  }}
                >
                  <span className="font-mono text-[10.5px] font-normal text-muted">
                    {K_NUM(i)}
                  </span>
                  {j.name}
                </span>
              );
            })}
          </div>
        );
      }

      function K_Cite({ k, locator = null, style = "apa", className = "" }) {
        return (

          >

      // A Markdown source paragraph with every citation formatted.
      function K_Rendered({ src, style = "apa", plain = false, renderCite }) {
        return parseCitations(src).map((s, i) => {
          if (s.text != null) return <Fragment key={i}>{s.text}</Fragment>;
          if (renderCite)
            return <Fragment key={i}>{renderCite(s.cite)}</Fragment>;
          if (plain)
            return (
              <Fragment key={i}>
                {inText(s.cite.key, {
                  style,
                  locator: s.cite.locator,
                  order: K_DRAFT_ORDER,
                })}
              </Fragment>
            );
          return (
            <K_Cite
              key={i}
              k={s.cite.key}
              locator={s.cite.locator}
              style={style}
            />
          );
        });
      }

      function K_Badges({ f }) {
        const l = sinceLabel(f);
        const base =

        return (
          <>

      // The id of the element (from `ids`) that crosses a line `line` of the way down the
      // viewport, or null when none does.
      function K_useSpy(ids, line = 0.4) {
        const [cur, setCur] = useState(null);
        const key = ids.join("|");
        useEffect(() => {
          let raf = 0;
          const read = () => {
            raf = 0;
            const y = window.innerHeight * line;
            let hit = null;
            for (const id of ids) {
              const el = document.getElementById(id);
              if (!el) continue;
              const r = el.getBoundingClientRect();
              if (r.top <= y && r.bottom > y) {
                hit = id;
                break;
              }
            }
            setCur(hit);
          };
          const on = () => {
            if (!raf) raf = requestAnimationFrame(read);
          };
          read();
          window.addEventListener("scroll", on, { passive: true });
          window.addEventListener("resize", on);
          return () => {
            window.removeEventListener("scroll", on);
            window.removeEventListener("resize", on);
            cancelAnimationFrame(raf);
          };
        }, [key, line]);
        return cur;
      }

        el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block });
        if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "-1");

                </K_LinkBtn>
