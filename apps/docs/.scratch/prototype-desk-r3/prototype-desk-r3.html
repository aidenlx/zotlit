              <p className="text-[13.5px] leading-snug text-muted">
                {FACTS.obsidian} · {FACTS.zotero} · {FACTS.platforms}
              </p>
            </div>
          </div>
        );
      }

      // The kit's desk, with numbered discs on the wide layout (the key beside it names them) and
      // numbered name tags on the tall one. `lit` lifts one object; `dim` fades the rest.
      // `focusable`: the objects are the keyboard route (phones, where no key is drawn).
      function A_Desk({ layout, lit, dim, onHot, onPick, focusable }) {
        const L = layout === "tall" ? K_TALL : K_WIDE;
        const isWide = L === K_WIDE;
        const { motion } = useProtoState();
        const ref = useRef(null);
        const band = K_useBand(ref);
        const anim = !motion ? "off" : band ? "run" : "pause";
        const box = (id) => {
          const o = K_OBJ[id];
          const p = L.at[id];
          const s = p.s || 1;
          return { o, p, s, w: o.w * s, h: o.h * s };
        };
        const pct = (v, total) => `${(v / total) * 100}%`;
        const pin = (id) => {
          const { p, s, w, h } = box(id);
          const [u, v] = A_PIN[id];
          const a = (p.r * Math.PI) / 180;
          const dx = u * s - w / 2;
          const dy = v * s - h / 2;
          return [
            p.x + w / 2 + dx * Math.cos(a) - dy * Math.sin(a),
            p.y + h / 2 + dx * Math.sin(a) + dy * Math.cos(a),
          ];
        };
        return (
          <div
            ref={ref}
            className="a-deskbox relative w-full"
            style={{ aspectRatio: `${L.W} / ${L.H}` }}
            aria-hidden={focusable ? undefined : "true"}
          >
            <svg
              viewBox={`0 0 ${L.W} ${L.H}`}
              className="k-svg absolute inset-0 h-full w-full"
              aria-hidden="true"
              focusable="false"
            >
              <K_DeskTop L={L} />
              {L.mug && <K_Mug x={L.mug[0]} y={L.mug[1]} />}
              {JOBS.map((j, i) => {
                const { o, p, s, w, h } = box(j.id);
                const on = lit === j.id;
                const faded = dim && lit && !on;
                const Art = o.Art;
                return (
                  <g
                    key={j.id}
                    transform={`translate(${p.x} ${p.y}) rotate(${p.r} ${w / 2} ${h / 2}) scale(${s})`}
                  >
                    <g
                      className={motion ? "k-settle" : ""}
                      style={{ animationDelay: `${150 + i * 85}ms` }}
                    >
                      <g className={`k-shade ${on ? "is-on" : ""}`}>
                        {o.shade.map(([x, y, sw, sh, rx], k) => (
                          <rect
                            key={k}
                            x={x + 7}
                            y={y + 9}
                            width={sw}
                            height={sh}
                            rx={rx}
                            fill={
                              p.deep
                                ? "var(--k-shadow-deep)"
                                : "var(--k-shadow)"
                            }
                          />
                        ))}
                      </g>
                      <g
                        className={`k-lift ${on ? "is-on" : ""} ${faded ? "is-dim" : ""}`}
                      >
                        <Art anim={j.id === "read" ? anim : "off"} />
                      </g>
                    </g>
                  </g>
                );
              })}
            </svg>
            {JOBS.map((j, i) => {
              const { p, w, h } = box(j.id);
              return (
                <button
                  key={j.id}
                  type="button"
                  tabIndex={focusable ? undefined : -1}
                  aria-label={`${K_NUM(i)} ${j.name}`}
                  className="k-hit absolute"
                  style={{
                    left: pct(p.x, L.W),
                    top: pct(p.y, L.H),
                    width: pct(w, L.W),
                    height: pct(h, L.H),
                    transform: `rotate(${p.r}deg)`,
                  }}
                  onPointerEnter={() => onHot(j.id, "desk")}
                  onPointerLeave={() => onHot(null, "desk")}
                  onFocus={() => onHot(j.id, "desk")}
                  onBlur={() => onHot(null, "desk")}
                  onClick={() => onPick(j.id)}
                />
              );
            })}
            {JOBS.map((j, i) => {
              const on = lit === j.id;
              if (isWide) {
                const [x, y] = pin(j.id);
                return (
                  <span
                    key={j.id}
                    aria-hidden="true"
                    className={`a-disc pointer-events-none absolute z-10 grid place-items-center rounded-full font-mono ${on ? "is-on" : ""}`}
                    style={{ left: pct(x, L.W), top: pct(y, L.H) }}
                  >
                    {K_NUM(i)}
                  </span>
                );
              }
              const { p } = box(j.id);
              return (
                <span
                  key={j.id}
                  aria-hidden="true"
                  className={`a-tag k-sheet border-line bg-surface text-ink pointer-events-none absolute z-10 inline-flex w-max max-w-[47%] items-center gap-1.5 rounded-full border px-2.5 py-1 text-[12.5px] leading-tight font-semibold ${on ? "is-on" : ""}`}
                  style={{
                    left: pct(p.lx, L.W),
                    top: pct(p.ly, L.H),
                    transform: "translate(-50%, 0)",
                  }}
                >
                  <span className="font-mono text-[10.5px] font-normal opacity-70">
                    {K_NUM(i)}
                  </span>
                  {j.name}
                </span>
              );
            })}
          </div>
        );
      }

      // The key beside the drawing: the eight jobs as a numbered contents list.
      function A_Key({ lit, onHot, onPick, twoCol }) {
        return (
          <nav aria-labelledby="a-key-h" className="min-w-0">
            <h2
              id="a-key-h"
              className="font-display text-[1.5rem] leading-tight"
            >
              On the desk
            </h2>
            <p className="mt-1.5 max-w-[34ch] text-[15px] leading-snug text-muted">
              Eight research jobs, in the order you do them. Select one to go to
              it.
            </p>
            <ol
              className={`mt-4 grid gap-1 ${twoCol ? "sm:grid-cols-2 sm:gap-x-6" : ""}`}
            >
              {JOBS.map((j, i) => (
                <li key={j.id}>
                  <button
                    type="button"
                    className={`a-key flex w-full items-center gap-3 rounded-[10px] px-2.5 py-2 text-left ${lit === j.id ? "is-on" : ""}`}
                    onPointerEnter={() => onHot(j.id, "key")}
                    onPointerLeave={() => onHot(null, "key")}
                    onFocus={() => onHot(j.id, "key")}
                    onBlur={() => onHot(null, "key")}
                    onClick={() => onPick(j.id)}
                  >
                    <span className="a-num grid size-[30px] shrink-0 place-items-center rounded-full font-mono text-[12px]">
                      {K_NUM(i)}
                    </span>
                    <span className="min-w-0 flex-1 text-[16px] leading-snug font-semibold">
                      {j.name}
                    </span>
                    <K_Icon
                      name="ArrowDown"
                      size={16}
                      className="a-arrow text-accent shrink-0"
                    />
                  </button>
                </li>
              ))}
            </ol>
          </nav>
        );
      }

      // The slim bar that stays at the top once the hero desk has left the screen: the eight
      // objects drawn small, the section in view marked, each one a jump link.
      function A_Bar({ show, cur, onPick, onTop }) {
        const [peek, setPeek] = useState(null);
        const label = peek || cur;
        const li = label ? JOBS.findIndex((j) => j.id === label) : -1;
        return (
          <div
            className={`a-bar border-line bg-ground/95 fixed inset-x-0 top-0 z-40 border-b px-4 backdrop-blur-sm sm:px-8 ${show ? "is-on" : ""}`}
            inert={!show}
          >
            <nav
              aria-label="Jobs on the desk"
              className="mx-auto flex max-w-[1240px] items-center gap-4"
              style={{ height: A_BAR_H }}
            >
              <button
                type="button"
                onClick={onTop}
                aria-label="Back to the desk"
                className="hover:bg-ink/5 -ml-2.5 hidden size-10 shrink-0 place-items-center rounded-lg lg:grid"
              >
                <ZotLitMark
                  size={22}
                  ink="var(--k-mark-ink)"
                  accent="var(--k-mark-accent)"
                  title=""
                />
              </button>
              <ol className="a-tray grid min-w-0 flex-1 grid-cols-8 gap-0.5 rounded-[12px] p-1 sm:flex sm:flex-none sm:gap-1">
                {JOBS.map((j, i) => {
                  const on = cur === j.id;
                  return (
                    <li key={j.id} className="min-w-0">
                      <button
                        type="button"
                        aria-label={`${K_NUM(i)} ${j.name}`}
                        aria-current={on ? "location" : undefined}
                        onClick={() => onPick(j.id)}
                        onPointerEnter={() => setPeek(j.id)}
                        onPointerLeave={() => setPeek(null)}
                        onFocus={() => setPeek(j.id)}
                        onBlur={() => setPeek(null)}
                        className={`a-chip flex h-[44px] w-full flex-col items-center justify-center gap-[3px] rounded-[9px] sm:w-[54px] ${on ? "is-on" : ""}`}
                      >
                        <K_ObjIcon
                          id={j.id}
                          className="a-chip-icon h-[23px] w-[34px]"
                        />
                        <span className="font-mono text-[10px] leading-none">
                          {K_NUM(i)}
                        </span>
                      </button>
                    </li>
                  );
                })}
              </ol>
              <p className="hidden min-w-0 flex-1 truncate text-[15px] md:block">
                {li >= 0 ? (
                  <>
                    <span className="text-accent mr-2 font-mono text-[12px]">
                      {K_NUM(li)}
                    </span>
                    <span className="font-semibold">{JOBS[li].name}</span>
                  </>
                ) : (
                  <span className="text-muted">Select a job to go to it</span>
                )}
              </p>
              <a
                href={FACTS.install}
                className="bg-ink text-ground hover:bg-ink/85 hidden h-9 shrink-0 items-center gap-1.5 rounded-[8px] px-3.5 text-[14px] font-semibold lg:inline-flex"
              >
                Install ZotLit
                <K_Icon name="ArrowRight" size={15} />
              </a>
            </nav>
          </div>
        );
      }

      // One job section: heading block (object, number, name, outcome), then the working demo(s)
      // beside the complete parts list. A wide job puts the demo full width and the list under it.
      function A_Job({ job, i }) {
        const demos = K_JOB_DEMOS[job.id];
        const wide = A_WIDE[job.id];
        const figs = demos.map((d) => (
          <figure key={d.id} className="min-w-0">
            <K_LiveDemo Demo={d.Demo} />
            <figcaption>
              <K_DemoCaption entry={d} />
            </figcaption>
          </figure>
        ));
        return (
          <section
            id={aId(job.id)}
            aria-labelledby={`a-h-${job.id}`}
            className="a-job border-line border-t px-4 sm:px-8"
          >
            <div className="mx-auto max-w-[1240px] pt-24 pb-20 lg:pt-28 lg:pb-28">
              <header className="grid grid-cols-[auto_minmax(0,1fr)] items-center gap-x-4 sm:items-start sm:gap-x-6">
                <span
                  className="grid size-14 shrink-0 place-items-center rounded-[14px] p-1.5 sm:row-span-3 sm:size-[88px] sm:p-2.5"
                  style={{ background: "var(--k-desk)" }}
                >
                  <K_ObjIcon id={job.id} className="size-full" />
                </span>
                <p className="font-mono text-[12px] tracking-[0.08em] text-muted">
                  <span className="text-accent">{K_NUM(i)}</span> of{" "}
                  {K_NUM(JOBS.length - 1)}
                </p>
                <h2
                  id={`a-h-${job.id}`}
                  className="font-display col-span-2 mt-4 text-[2rem] leading-[1.08] text-balance sm:col-span-1 sm:col-start-2 sm:mt-1.5 sm:text-[2.75rem]"
                >
                  {job.name}
                </h2>
                <p className="col-span-2 mt-3 max-w-[54ch] text-[17px] leading-relaxed text-muted sm:col-span-1 sm:col-start-2 sm:text-[18px]">
                  {job.outcome}
                </p>
              </header>
              {wide ? (
                <div className="mt-12">
                  <div className="grid gap-14">{figs}</div>
                  <div className="mt-14">
                    <K_PartsList job={job.id} columns={2} />
                  </div>
                </div>
              ) : (
                <div className="mt-12 grid gap-12 lg:grid-cols-12 lg:gap-10">
                  <div className="grid min-w-0 content-start gap-14 lg:col-span-7">
                    {figs}
                  </div>
                  <div className="min-w-0 lg:col-span-5">
                    <K_PartsList job={job.id} />
                  </div>
                </div>
              )}
            </div>
          </section>
        );
      }

      function VariantA() {
        const { motion } = useProtoState();
        const lg = K_useMedia("(min-width: 1024px)");
        const sm = K_useMedia("(min-width: 640px)");
        const [hot, setHot] = useState(null);
        const deskRef = useRef(null);
        const gone = A_useGone(deskRef, A_BAR_H);
        const spy = K_useSpy(JOBS.map((j) => aId(j.id)));
        const cur = spy ? spy.slice(2) : null;
        const go = (id) => K_scrollTo(aId(id), { smooth: motion });
        const onHot = (id, src) => setHot(id ? { id, src } : null);
        const toDesk = () => K_scrollTo("a-hero", { smooth: motion });
        return (
          <K_Root v="A">
            <style>{A_CSS}</style>
            <K_Header />
            <A_Bar show={gone} cur={cur} onPick={go} onTop={toDesk} />
            <main>
              <section
                id="a-hero"
                aria-labelledby="a-h1"
                className="px-4 sm:px-8"
              >
                <div className="mx-auto max-w-[1240px] pb-20 lg:pb-24">
                  <A_HeroCopy />
                  {!sm && (
                    <p className="mt-10 flex items-start gap-2 text-[15px] leading-snug text-muted">
                      <K_Icon
                        name="MousePointerClick"
                        size={16}
                        className="text-accent mt-0.5 shrink-0"
                      />
                      Eight research jobs, in the order you do them. Select one
                      to go to it.
                    </p>
                  )}
                  <div
                    className={`grid gap-8 ${sm ? "mt-10" : "mt-4"} ${lg ? "grid-cols-[minmax(0,1fr)_20rem] items-center gap-10" : ""}`}
                  >
                    <div ref={deskRef}>
                      <A_Desk
                        layout={sm ? "wide" : "tall"}
                        lit={hot ? hot.id : null}
                        dim={hot ? hot.src === "key" : false}
                        onHot={onHot}
                        onPick={go}
                        focusable={!sm}
                      />
                    </div>
                    {sm && (
                      <A_Key
                        lit={hot ? hot.id : null}
                        onHot={onHot}
                        onPick={go}
                        twoCol={!lg}
                      />
                    )}
                  </div>
                </div>
              </section>
              {JOBS.map((j, i) => (
                <A_Job key={j.id} job={j} i={i} />
              ))}
              <K_Setup />
            </main>
            <K_Footer />
          </K_Root>
        );
      }
      // --- Variant A END ---

      // --- Variant B ---
      // Variant B · Desk at your side.
      // Wide screens (>= 1024 px): one desk, in a sticky column on the right, from the hero to the
      // last job. The job sections run in the left column. The object for the section in view
      // lifts, the others dim, and the caption under the desk names it ("03 of 08"). Selecting
      // an object jumps to its section. Phones and tablets: the desk once under the hero, then the
      // sections, each opening with its object.

      // A compact desk for the side column: the eight objects in two columns, in JOBS order
      // (left to right, top to bottom), on the same desk top and blotter as the kit's desk.
      const B_LAYOUT = {
        key: "b-side",
        W: 800,
        H: 1360,
        blotter: { x: 24, y: 300, w: 752, h: 742 },
        at: {
          connect: { x: 44, y: 50, r: -3 },
          find: { x: 482, y: 36, r: 3 },
          read: { x: 62, y: 340, r: -4, s: 0.9, deep: true },
          notes: { x: 404, y: 382, r: 4, s: 0.96, deep: true },
          cite: { x: 104, y: 742, r: 4, s: 0.86, deep: true },
          connections: { x: 392, y: 720, r: -2, s: 0.84, deep: true },
          export: { x: 64, y: 1106, r: 3, s: 0.94 },
          customise: { x: 416, y: 1060, r: -3, s: 0.86 },
        },
      };
      const B_RATIO = B_LAYOUT.W / B_LAYOUT.H;
      const bSectionId = (id) => `b-job-${id}`;
      const bPct = (v, total) => `${(v / total) * 100}%`;

      const B_CSS = `
      [data-v="B"] .b-chip { transition: background-color .3s, color .3s, border-color .3s, opacity .3s; }
      [data-v="B"] .b-sec:focus { outline: none; }
      [data-v="B"] #b-hero h1 { max-width: 7.4em; }
      [data-v="B"] #b-hero .k-mark { white-space: nowrap; }
      `;

      function B_box(id) {
        const o = K_OBJ[id];
        const p = B_LAYOUT.at[id];
        const s = p.s || 1;
        return { o, p, s, w: o.w * s, h: o.h * s };
      }

      // The side desk. `current`: the job whose section is in view. `idle`: run the highlighter
      // loop on the open paper (only while the hero is in view and no demo plays).
      function B_Desk({ current, idle, onPick }) {
        const { motion } = useProtoState();
        const [hot, setHot] = useState(null);
        const L = B_LAYOUT;
        return (
          <div
            className="relative mx-auto"
            style={{
              aspectRatio: `${L.W} / ${L.H}`,
              width: `min(100%, calc((100svh - 220px) * ${B_RATIO.toFixed(4)}))`,
            }}
          >
            <svg
              viewBox={`0 0 ${L.W} ${L.H}`}
              className="k-svg absolute inset-0 h-full w-full"
              aria-hidden="true"
              focusable="false"
            >
              <K_DeskTop L={L} />
              {JOBS.map((j, i) => {
                const { o, p, s, w, h } = B_box(j.id);
                const on = hot === j.id || current === j.id;
                const dim = current && current !== j.id && hot !== j.id;
                const Art = o.Art;
                return (
                  <g
                    key={j.id}
                    transform={`translate(${p.x} ${p.y}) rotate(${p.r} ${w / 2} ${h / 2}) scale(${s})`}
                  >
                    <g
                      className={motion ? "k-settle" : ""}
                      style={{ animationDelay: `${150 + i * 85}ms` }}
                    >
                      <g className={`k-shade ${on ? "is-on" : ""}`}>
                        {o.shade.map(([x, y, sw, sh, rx], k) => (
                          <rect
                            key={k}
                            x={x + 7}
                            y={y + 9}
                            width={sw}
                            height={sh}
                            rx={rx}
                            fill={
                              p.deep
                                ? "var(--k-shadow-deep)"
                                : "var(--k-shadow)"
                            }
                          />
                        ))}
                      </g>
                      <g
                        className={`k-lift ${on ? "is-on" : ""} ${dim ? "is-dim" : ""}`}
                      >
                        <Art
                          anim={
                            j.id === "read" && motion && idle ? "run" : "off"
                          }
                        />
                      </g>
                    </g>
                  </g>
                );
              })}
            </svg>
            {JOBS.map((j, i) => {
              const { p, w, h } = B_box(j.id);
              return (
                <button
                  key={j.id}
                  type="button"
                  aria-label={`${K_NUM(i)} ${j.name}`}
                  aria-current={current === j.id ? "location" : undefined}
                  className="k-hit absolute"
                  style={{
                    left: bPct(p.x, L.W),
                    top: bPct(p.y, L.H),
                    width: bPct(w, L.W),
                    height: bPct(h, L.H),
                    transform: `rotate(${p.r}deg)`,
                  }}
                  onPointerEnter={() => setHot(j.id)}
                  onPointerLeave={() => setHot((x) => (x === j.id ? null : x))}
                  onFocus={() => setHot(j.id)}
                  onBlur={() => setHot((x) => (x === j.id ? null : x))}
                  onClick={() => onPick(j.id)}
                />
              );
            })}
            {JOBS.map((j, i) => {
              const { p, w } = B_box(j.id);
              const right = p.x > L.W / 2;
              const isCur = current === j.id;
              const isHot = hot === j.id && !isCur;
              const dim = current && !isCur && hot !== j.id;
              return (
                <span
                  key={j.id}
                  aria-hidden="true"
                  className={`b-chip k-sheet pointer-events-none absolute z-10 inline-flex w-max items-center gap-1.5 rounded-full border px-2 py-[3px] font-mono text-[11px] leading-none ${
                    isCur
                      ? "border-accent bg-accent text-ground"
                      : "border-line bg-surface text-ink"
                  } ${dim ? "opacity-60" : ""}`}
                  style={{
                    left: right ? undefined : bPct(p.x - 10, L.W),
                    right: right ? bPct(L.W - (p.x + w) - 10, L.W) : undefined,
                    top: bPct(p.y - 16, L.H),
                  }}
                >
                  {K_NUM(i)}
                  {isHot && (
                    <span className="font-body text-[13px] font-semibold">
                      {j.name}
                    </span>
                  )}
                </span>
              );
            })}
          </div>
        );
      }

      // The caption under the side desk: which job the section in view belongs to.
      function B_DeskCaption({ current }) {
        const i = JOBS.findIndex((j) => j.id === current);
        const job = JOBS[i];
        return (
          <div className="mx-auto mt-5 grid max-w-[24rem] justify-items-center gap-1 text-center">
            {job ? (
              <>
                <p className="font-mono text-[12px] tracking-[0.08em] text-muted uppercase">
                  <span className="text-accent">{K_NUM(i)}</span> of{" "}
                  {K_NUM(JOBS.length - 1)}
                </p>
                <p className="font-display text-[22px] leading-tight">
                  {job.name}
                </p>
              </>
            ) : (
              <>
                <p className="font-mono text-[12px] tracking-[0.08em] text-muted uppercase">
                  Eight research jobs
                </p>
                <p className="font-display text-[22px] leading-tight">
                  Select an object to begin
                </p>
              </>
            )}
          </div>
        );
      }

      function B_JobHead({ job, i }) {
        return (
          <header className="max-w-[44rem]">
            <div className="flex items-center gap-4">
              <K_ObjIcon id={job.id} className="size-16 shrink-0 lg:hidden" />
              <p className="font-mono text-[12px] tracking-[0.08em] text-muted uppercase">
                <span className="text-accent">{K_NUM(i)}</span> of{" "}
                {K_NUM(JOBS.length - 1)}
              </p>
            </div>
            <h2
              id={`b-h-${job.id}`}
              className="font-display mt-4 text-[2rem] leading-[1.1] text-balance sm:text-[2.6rem]"
            >
              {job.name}
            </h2>
            <p className="mt-4 max-w-[46ch] text-[18px] leading-relaxed text-muted">
              {job.outcome}
            </p>
          </header>
        );
      }

      function B_Job({ job, i, columns, side }) {
        const { motion } = useProtoState();
        return (
          <section
            id={bSectionId(job.id)}
            aria-labelledby={`b-h-${job.id}`}
            className="b-sec border-line scroll-mt-6 border-t py-16 lg:py-24"
          >
            <B_JobHead job={job} i={i} />
            <div className="mt-10 grid gap-12">
              {K_JOB_DEMOS[job.id].map((d) => (
                <figure key={d.id} className="min-w-0">
                  <K_LiveDemo Demo={d.Demo} />
                  <K_DemoCaption entry={d} />
                </figure>
              ))}
            </div>
            <div className="mt-14">
              <K_PartsList job={job.id} columns={columns} />
            </div>
            {!side && (
              <button
                type="button"
                onClick={() => K_scrollTo("b-desk", { smooth: motion })}
                className="k-link focus-visible:outline-accent mt-10 inline-flex items-center gap-1.5 rounded-sm text-[14.5px] font-semibold focus-visible:outline-2 focus-visible:outline-offset-4"
              >
                <K_Icon name="ArrowUp" size={15} />
                Back to the desk
              </button>
            )}
          </section>
        );
      }

      function VariantB() {
        const { motion } = useProtoState();
        const side = K_useMedia("(min-width: 1024px)");
        const tablet = K_useMedia("(min-width: 768px)");
        const roomy = K_useMedia("(min-width: 1280px)");
        const ids = ["b-hero", ...JOBS.map((j) => bSectionId(j.id))];
        const spy = K_useSpy(ids);
        const current = spy && spy.startsWith("b-job-") ? spy.slice(6) : null;
        const pick = (id) => K_scrollTo(bSectionId(id), { smooth: motion });
        // Two list columns when the section column has room for them.
        const columns = side ? (roomy ? 2 : 1) : tablet ? 2 : 1;
        return (
          <K_Root v="B">
            <style>{B_CSS}</style>
            <K_Header />
            <main>
              <div className="px-4 sm:px-8">
                <div className="mx-auto max-w-[1240px] lg:grid lg:grid-cols-[minmax(0,1fr)_clamp(300px,34%,420px)] lg:gap-x-16">
                  <div
                    id="b-hero"
                    className="flex items-center py-10 sm:py-14 lg:col-start-1 lg:row-start-1 lg:min-h-[calc(100svh-150px)] lg:py-16"
                  >
                    <K_HeroCopy />
                  </div>
                  <aside
                    id="b-desk"
                    aria-label="The research desk"
                    className="scroll-mt-6 focus:outline-none lg:col-start-2 lg:row-span-2 lg:row-start-1"
                  >
                    {side ? (
                      <div className="sticky top-6 pt-2">
                        <B_Desk
                          current={current}
                          idle={spy === "b-hero"}
                          onPick={pick}
                        />
                        <B_DeskCaption current={current} />
                      </div>
                    ) : (
                      <div className="mx-auto max-w-[520px] pb-6">
                        <K_Desk
                          layout="tall"
                          onPick={pick}
                          pickLabel={(j) =>
                            `${K_NUM(JOBS.indexOf(j))} ${j.name}`
                          }
                        />
                        <p className="mt-4 flex items-center gap-2 text-[14px] text-muted">
                          <K_Icon
                            name="MousePointerClick"
                            size={15}
                            className="text-accent shrink-0"
                          />
                          Select an object to go to its job.
                        </p>
                      </div>
                    )}
                  </aside>
                  <div className="min-w-0 lg:col-start-1 lg:row-start-2">
                    {JOBS.map((j, i) => (
                      <B_Job
                        key={j.id}
                        job={j}
                        i={i}
                        columns={columns}
                        side={side}
                      />
                    ))}
                  </div>
                </div>
              </div>
              <K_Setup />
            </main>
            <K_Footer />
          </K_Root>
        );
      }
      // --- Variant B END ---

      // --- Variant C ---
      // Variant C · Object chapters. Nothing is sticky. The hero desk is the map: select an object
      // to jump to its job. Each job section opens like a chapter: a strip of the desk with that
      // object lifted off it and drawn large, beside the job number, name and outcome. Then the
      // working demo beside the complete parts list (A's layout) on the plain page ground, and a
      // quiet way back to the desk that shows where the object sits.

      // Jobs whose demo needs the full width: the parts list goes in two columns under it.
      const C_WIDE = new Set(["customise"]);

      const C_CSS = `
      [data-v="C"] { --c-k: 0.6; }
      @media (min-width: 640px) { [data-v="C"] { --c-k: 0.78; } }
      @media (min-width: 1024px) { [data-v="C"] { --c-k: 1; } }
      [data-v="C"] .c-shade, [data-v="C"] .c-art { transition: transform 1s cubic-bezier(.2,.8,.2,1); }
      [data-v="C"] .c-shade { transform: translate(7px, 9px); }
      [data-v="C"] .c-obj.is-up .c-shade { transform: translate(18px, 24px); }
      [data-v="C"] .c-obj.is-up .c-art { transform: translate(-5px, -10px); }
      [data-v="C"] [data-c-target]:focus { outline: none; }
      [data-v="C"] .c-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
      `;

      // One object, lifted off the desk: drawn large at its desk angle, with its flat shadow
      // pushed further out. `up` false draws it resting on the desk (the start of the lift).
      function C_Lifted({ id, up }) {
        const o = K_OBJ[id];
        const r = K_WIDE.at[id].r;
        const P = 36;
        const [vx, vy, vw, vh] = o.vb;
        const vb = [vx - P, vy - P, vw + 2 * P, vh + 2 * P];
        // The same scale for every object, so they keep their sizes relative to each other;
        // only the tallest ones are capped.
        const w = Math.round(Math.min(vb[2] * 1.15, (400 * vb[2]) / vb[3]));
        const Art = o.Art;
        return (
          <svg
            viewBox={vb.join(" ")}
            className={`k-svg c-obj block h-auto max-w-full ${up ? "is-up" : ""}`}
            style={{ width: `calc(var(--c-k) * ${w}px)` }}
            aria-hidden="true"
            focusable="false"
          >
            <g transform={`rotate(${r} ${o.w / 2} ${o.h / 2})`}>
              <g className="c-shade">
                {o.shade.map(([x, y, sw, sh, rx], k) => (
                  <rect
                    key={k}
                    x={x}
                    y={y}
                    width={sw}
                    height={sh}
                    rx={rx}
                    fill="var(--k-shadow)"
                  />
                ))}
              </g>
              <g className="c-art">
                <Art anim="off" />
              </g>
            </g>
          </svg>
        );
      }

      // A small plan of the whole desk: every other object as a plain block where it sits, this
      // job's object drawn and lifted. Decorative; the button around it carries the name.
      function C_MiniDesk({ id }) {
        const L = K_WIDE;
        const b = L.blotter;
        return (
          <svg
            viewBox={`0 0 ${L.W} ${L.H}`}
            className="block h-auto w-full"
            aria-hidden="true"
            focusable="false"
          >
            <rect width={L.W} height={L.H} rx="44" fill="var(--k-desk)" />
            <rect
              x={b.x}
              y={b.y}
              width={b.w}
              height={b.h}
              rx="12"
              fill="var(--accent2)"
              opacity="0.16"
            />
            {JOBS.map((j) => {
              const o = K_OBJ[j.id];
              const p = L.at[j.id];
              const on = j.id === id;
              const Art = o.Art;
              return (
                <g
                  key={j.id}
                  transform={`translate(${p.x} ${p.y}) rotate(${p.r} ${o.w / 2} ${o.h / 2})`}
                >
                  {on ? (
                    <>
                      {o.shade.map(([x, y, sw, sh, rx], k) => (
                        <rect
                          key={k}
                          x={x + 16}
                          y={y + 20}
                          width={sw}
                          height={sh}
                          rx={rx}
                          fill="var(--k-shadow-deep)"
                        />
                      ))}
                      <g transform="translate(-8 -14)">
                        <Art anim="off" />
                      </g>
                    </>
                  ) : (
                    o.shade.map(([x, y, sw, sh, rx], k) => (
                      <rect
                        key={k}
                        x={x}
                        y={y}
                        width={sw}
                        height={sh}
                        rx={rx + 6}
                        fill="var(--k-edge)"
                        opacity="0.28"
                      />
                    ))
                  )}
                </g>
              );
            })}
          </svg>
        );
      }

      // The hero: the approved copy (H1 left, supporting line and actions right, as in round 2
      // D), then the whole desk as the map of the page.
      function C_Hero({ wide, from, onPick }) {
        const { motion } = useProtoState();
        return (
          <section aria-labelledby="c-h1" className="px-4 sm:px-8">
            <div className="mx-auto max-w-[1240px] pt-8 sm:pt-14">
              <div className="grid items-end gap-x-12 gap-y-6 lg:grid-cols-12">
                <h1
                  id="c-h1"
                  className="font-display text-[2.55rem] leading-[1.04] tracking-[-0.015em] text-balance sm:text-[3.5rem] lg:col-span-7 lg:text-[4.1rem]"
                >
                  An integrated{" "}
                  <span className={`k-mark ${motion ? "is-anim" : ""}`}>
                    research desk
                  </span>{" "}
                  for Obsidian.
                </h1>
                <div className="grid gap-5 lg:col-span-5 lg:pb-1.5">
                  <p className="max-w-[44ch] text-[18px] leading-relaxed text-muted">
                    Find, read, annotate, cite and export the papers in your
                    Zotero library, right beside the notes you write.
                  </p>
                  <div className="flex flex-wrap gap-3">
                    <K_LinkBtn href={FACTS.install}>Install ZotLit</K_LinkBtn>
                    <K_LinkBtn href={FACTS.docs} kind="secondary" icon={null}>
                      Read the docs
                    </K_LinkBtn>
                  </div>
                  <p className="text-[13.5px] leading-snug text-muted">
                    {FACTS.obsidian} · {FACTS.zotero} · {FACTS.platforms}
                  </p>
                </div>
              </div>
              <p className="mt-12 flex items-start gap-2 text-[15px] leading-snug text-muted sm:mt-16">
                <K_Icon
                  name="MousePointerClick"
                  size={17}
                  className="text-accent mt-0.5 shrink-0"
                />
                Each object on the desk is one research job. Select one to go to
                it.
              </p>
              <div id="c-desk" data-c-target="" className="mt-4 scroll-mt-6">
                <K_Desk
                  wide={wide}
                  current={from}
                  onPick={onPick}
                  pickLabel={(j) => `${K_NUM(JOBS.indexOf(j))} ${j.name}`}
                />
              </div>
            </div>
          </section>
        );
      }

      // The chapter opener: a strip of the desk with the object lifted off it. The lift plays
      // once, when the strip first comes into view; with motion off it is already lifted.
      function C_Opener({ job, index }) {
        const { motion } = useProtoState();
        const ref = useRef(null);
        const [seen, setSeen] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el || seen) return;
          const io = new IntersectionObserver(
            ([e]) => {
              if (e.isIntersecting) {
                setSeen(true);
                io.disconnect();
              }
            },
            { threshold: 0.4 },
          );
          io.observe(el);
          return () => io.disconnect();
        }, [seen]);
        return (
          <div
            ref={ref}
            className="grid items-center gap-x-10 gap-y-6 overflow-hidden rounded-[22px] px-6 pt-8 pb-10 sm:px-10 sm:py-12 lg:grid-cols-12 lg:px-14 lg:py-12"
            style={{ background: "var(--k-desk)" }}
          >
            <div className="lg:col-span-5">
              <p className="text-ink flex items-center gap-3 font-mono text-[13px] tracking-[0.06em]">
                <span
                  className="bg-accent h-[3px] w-7 rounded-full"
                  aria-hidden="true"
                />
                <span className="font-semibold">{K_NUM(index)}</span>
                <span className="text-ink/60">/ {K_NUM(JOBS.length - 1)}</span>
              </p>
              <h2
                id={`c-h-${job.id}`}
                className="font-display mt-4 text-[2.3rem] leading-[1.06] text-balance sm:text-[3rem] lg:text-[3.35rem]"
              >
                {job.name}
              </h2>
              <p className="text-ink/75 mt-5 max-w-[38ch] text-[18px] leading-relaxed lg:text-[19px]">
                {job.outcome}
              </p>
            </div>
            <div className="order-first flex justify-center lg:order-none lg:col-span-7">
              <C_Lifted id={job.id} up={!motion || seen} />
            </div>
          </div>
        );
      }

      function C_Figure({ entry }) {
        return (
          <figure className="min-w-0">
            <K_LiveDemo Demo={entry.Demo} />
            <figcaption>
              <K_DemoCaption entry={entry} />
            </figcaption>
          </figure>
        );
      }

      // One job: the chapter opener, then the demo(s) beside the parts list, then the way back.
      function C_Chapter({ job, index, last, onBack }) {
        const demos = K_JOB_DEMOS[job.id];
        const wide = C_WIDE.has(job.id);
        const figures = demos.map((d) => <C_Figure key={d.id} entry={d} />);
        return (
          <section
            id={`c-${job.id}`}
            data-c-target=""
            aria-labelledby={`c-h-${job.id}`}
            className={`scroll-mt-6 px-4 sm:px-8 ${last ? "" : "pb-24 lg:pb-32"}`}
          >
            <div className="mx-auto max-w-[1240px]">
              <C_Opener job={job} index={index} />
              {wide ? (
                <div className="mt-12 lg:mt-16">
                  <div className="grid gap-14">{figures}</div>
                  <div className="mt-14">
                    <K_PartsList job={job.id} columns={2} />
                  </div>
                </div>
              ) : (
                <div className="mt-12 grid gap-12 lg:mt-16 lg:grid-cols-12 lg:gap-10">
                  <div className="grid min-w-0 content-start gap-14 lg:col-span-7">
                    {figures}
                  </div>
                  <div className="min-w-0 lg:col-span-5">
                    <K_PartsList job={job.id} />
                  </div>
                </div>
              )}
              <div className="border-line mt-14 border-t pt-5">
                <button
                  type="button"
                  onClick={() => onBack(job.id)}
                  className="c-back group hover:text-ink inline-flex items-center gap-4 rounded-[8px] text-left text-[14.5px] text-muted"
                >
                  <span className="w-[120px] shrink-0 overflow-hidden rounded-[8px] sm:w-[140px]">
                    <C_MiniDesk id={job.id} />
                  </span>
                  <span className="inline-flex items-center gap-1.5 font-semibold">
                    Back to the desk
                    <span className="sr-only"> from {job.name}</span>
                    <K_Icon
                      name="ArrowUp"
                      size={15}
                      className="transition-transform group-hover:-translate-y-0.5"
                    />
                  </span>
                </button>
              </div>
            </div>
          </section>
        );
      }

      function VariantC() {
        const { motion } = useProtoState();
        const wide = K_useMedia("(min-width: 768px)");
        // The job the reader last came back from: its object stays lifted on the hero desk.
        const [from, setFrom] = useState(null);
        const go = (id) => K_scrollTo(`c-${id}`, { smooth: motion });
        // Back to the desk: the whole desk when it fits the screen, otherwise (the tall phone
        // desk) the object the reader came from. Focus returns to that object.
        const back = (id) => {
          setFrom(id);
          const i = JOBS.findIndex((j) => j.id === id);
          const desk = document.getElementById("c-desk");
          const btn = document.querySelector(
            `#c-desk button[aria-label="${K_NUM(i)} ${JOBS[i].name}"]`,
          );
          if (desk && btn && desk.offsetHeight > window.innerHeight * 0.8) {
            btn.scrollIntoView({
              behavior: motion ? "smooth" : "auto",
              block: "center",
            });
          } else {
            K_scrollTo("c-desk", { smooth: motion, block: "center" });
          }
          if (btn) btn.focus({ preventScroll: true });
        };
        return (
          <K_Root v="C">
            <style>{C_CSS}</style>
            <K_Header />
            <main>
              <C_Hero wide={wide} from={from} onPick={go} />
              <div className="pt-24 sm:pt-32">
                {JOBS.map((j, i) => (
                  <C_Chapter
                    key={j.id}
                    job={j}
                    index={i}
                    last={i === JOBS.length - 1}
                    onBack={back}
                  />
                ))}
              </div>
              <K_Setup />
            </main>
            <K_Footer />
          </K_Root>
        );
      }
      // --- Variant C END ---

      // --- Variant D ---
      // Variant D · The page is the desk.
      // The desk surface runs from the hero desk to the end of the setup sheet. Each job section is
      // a close-up of the same desk: the job's object lies at the top right, the demo is a print on
      // the desk (screen area plus a caption margin), and the parts list is a notepad page that lies
      // over the object. The three jobs whose objects lie on the blotter in the hero (read, notes,
      // cite) are laid out on the blotter here too. Every section ends with a small map of the desk
      // that marks where you are and takes you back to the hero desk.

      // Close-up scale of the drawn objects (desk units to px) on wide screens and on phones.
      const D_K_WIDE = 0.92;
      const D_K_PHONE = 0.42;
      // Section layouts: "pair" = demo 7 | notepad 5; "two" = two demos side by side, notepad under;
      // "wide" = demo full width, notepad under.
      const D_KIND = { cite: "two", connections: "two", customise: "wide" };
      // Jobs that lie on the blotter in the hero, and which blotter edge shows in their close-up.
      const D_BLOT = { read: "is-l", notes: "", cite: "is-r" };

      const D_CSS = `
      [data-v="D"] { --d-paper: var(--surface); --d-shade: var(--k-shadow); }
      @media (prefers-color-scheme: dark) {
        [data-v="D"] { --d-paper: color-mix(in oklab, var(--ink) 7%, var(--surface)); }
      }
      [data-v="D"] .d-desk { background: var(--k-desk); }
      [data-v="D"] .d-paper { background: var(--d-paper); border: 1.5px solid var(--k-edge); }
      [data-v="D"] .d-flat { box-shadow: 7px 9px 0 0 var(--d-shade); }
      [data-v="D"] .d-flat-sm { box-shadow: 4px 5px 0 0 var(--d-shade); }
      [data-v="D"] .d-on-blot { --d-shade: var(--k-shadow-deep); }
      [data-v="D"] .d-bind { background: var(--k-tray); border-bottom: 1.5px solid var(--k-edge); }
      [data-v="D"] .d-screen { background: var(--ground); }

      /* The blotter: the dark pad in the middle of the desk, with its corner pockets and stitching.
         A side that runs off the screen is cropped, as in a close-up. */
      [data-v="D"] .d-blot {
        position: absolute; z-index: 0; top: -1.75rem; bottom: -1.75rem;
        left: calc((100% - 100vw) / 2 - 80px); right: calc((100% - 100vw) / 2 - 80px);
        border-radius: 10px;
        background:
          linear-gradient(135deg, var(--k-blot-corner) 38px, transparent 38px) top left / 80px 80px no-repeat,
          linear-gradient(45deg, var(--k-blot-corner) 38px, transparent 38px) bottom left / 80px 80px no-repeat,
          linear-gradient(225deg, var(--k-blot-corner) 38px, transparent 38px) top right / 80px 80px no-repeat,
          linear-gradient(315deg, var(--k-blot-corner) 38px, transparent 38px) bottom right / 80px 80px no-repeat,
          var(--accent2);
        box-shadow: 8px 10px 0 0 var(--k-shadow);
      }
      [data-v="D"] .d-blot::after {
        content: ""; position: absolute; inset: 14px; border-radius: 4px;
        border: 1.5px dashed var(--k-stitch);
      }
      @media (min-width: 1024px) {
        [data-v="D"] .d-blot.is-l { left: -2.75rem; }
        [data-v="D"] .d-blot.is-r { right: -2.75rem; }
      }

      /* A close-up's heading block: number and object share the first row on phones; on wide
         screens the object takes the right column and its lower part lies under the paper below. */
      [data-v="D"] .d-head {
        display: grid; column-gap: 1.25rem;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "num obj" "h2 h2" "slip slip";
      }
      [data-v="D"] .d-head > .d-num { grid-area: num; align-self: end; }
      [data-v="D"] .d-head > .d-objcell { grid-area: obj; align-self: end; justify-self: end; }
      [data-v="D"] .d-head > h2 { grid-area: h2; }
      [data-v="D"] .d-head > .d-slipcell { grid-area: slip; }
      [data-v="D"] .d-obj { display: block; width: calc(var(--d-w) * ${D_K_PHONE}px); height: auto; transform: rotate(var(--d-r)); }
      @media (min-width: 1024px) {
        [data-v="D"] .d-head {
          column-gap: 2.5rem;
          grid-template-columns: minmax(0, 7fr) minmax(0, 5fr);
          grid-template-rows: auto auto 1fr;
          grid-template-areas: "num obj" "h2 obj" "slip obj";
        }
        [data-v="D"] .d-head > .d-objcell { justify-self: center; margin-bottom: var(--d-tuck); }
        [data-v="D"] .d-obj { width: calc(var(--d-w) * ${D_K_WIDE}px); }
      }

      /* Hero copy: H1 on the left, the rest on the right, as in round 2. */
      @media (min-width: 1024px) {
        [data-v="D"] .d-hero { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); column-gap: 4.5rem; row-gap: 1.25rem; }
        [data-v="D"] .d-hero > h1 { grid-column: 1; grid-row: 1 / span 3; align-self: start; }
        [data-v="D"] .d-hero > :not(h1) { grid-column: 2; }
        [data-v="D"] .d-hero > p:first-of-type { margin-top: 0.6rem; }
      }

      /* The setup section, printed on one sheet that lies on the desk. */
      [data-v="D"] .d-setup > section { padding: 2.5rem 1.25rem 2.75rem; }
      @media (min-width: 640px) { [data-v="D"] .d-setup > section { padding: 3.5rem 3.25rem 3.75rem; } }

      [data-v="D"] .d-back { transition: transform .2s cubic-bezier(.2,.8,.2,1), box-shadow .2s; }
      [data-v="D"][data-motion="on"] .d-back:hover { transform: translate(-1px, -2px); box-shadow: 6px 8px 0 0 var(--d-shade); }
      `;

      // One desk object drawn large, at the close-up scale, with its flat shadow.
      function D_Obj({ id }) {
        const o = K_OBJ[id];
        const Art = o.Art;
        return (
          <svg
            viewBox={o.vb.join(" ")}
            className="k-svg d-obj"
            style={{ "--d-w": o.vb[2], "--d-r": `${K_WIDE.at[id].r}deg` }}
            aria-hidden="true"
            focusable="false"
          >
            {o.shade.map(([x, y, w, h, rx], k) => (
              <rect
                key={k}
                x={x + 7}
                y={y + 9}
                width={w}
                height={h}
                rx={rx}
                fill="var(--k-shadow)"
              />
            ))}
            <Art anim="off" />
          </svg>
        );
      }

      // A small map of the whole desk with one object marked: "you are here".
      function D_MiniDesk({ current }) {
        const L = K_WIDE;
        const b = L.blotter;
        return (
          <svg
            viewBox={`0 0 ${L.W} ${L.H}`}
            className="k-svg block h-auto w-[78px] shrink-0"
            aria-hidden="true"
            focusable="false"
          >
            <rect width={L.W} height={L.H} rx="80" fill="var(--k-desk)" />
            <rect
              x={b.x}
              y={b.y}
              width={b.w}
              height={b.h}
              rx="26"
              fill="var(--accent2)"
            />
            {JOBS.map((j) => {
              const o = K_OBJ[j.id];
              const p = L.at[j.id];
              const s = p.s || 1;
              const w = o.w * s;
              const h = o.h * s;
              const on = j.id === current;
              return (
                <rect
                  key={j.id}
                  x={p.x}
                  y={p.y}
                  width={w}
                  height={h}
                  rx="22"
                  transform={`rotate(${p.r} ${p.x + w / 2} ${p.y + h / 2})`}
                  fill={on ? "var(--accent)" : "var(--k-paper)"}
                  stroke={on ? "var(--accent)" : "var(--k-edge)"}
                  strokeWidth="1"
                  opacity={on ? 1 : 0.9}
                />
              );
            })}
          </svg>
        );
      }

      // A demo as a print lying on the desk: the screen area, then the caption in the paper margin.
      function D_Print({ entry }) {
        return (
          <figure className="d-paper d-flat relative z-[2] m-0 min-w-0 rounded-[8px] p-2 sm:p-3">
            <div className="d-screen rounded-[4px] p-2.5 sm:p-6">
              <K_LiveDemo Demo={entry.Demo} />
            </div>
            <figcaption className="px-1.5 pb-1.5 sm:px-2 sm:pb-1">
              <K_DemoCaption entry={entry} />
            </figcaption>
          </figure>
        );
      }

      // The parts list as a notepad page: a bound top edge, then the ruled list.
      function D_Pad({ job, columns = 1 }) {
        return (
          <div className="d-paper d-flat relative z-[2] min-w-0 overflow-hidden rounded-[8px]">
            <div className="d-bind h-4" aria-hidden="true" />
            <div className="px-4 pt-5 pb-5 sm:px-7 sm:pt-6 sm:pb-6">
              <K_PartsList job={job} columns={columns} />
            </div>
          </div>
        );
      }

      function D_Back({ id, onBack }) {
        return (
          <button
            type="button"
            onClick={onBack}
            className="d-back d-paper d-flat-sm group text-ink inline-flex items-center gap-3 rounded-[8px] py-2 pr-4 pl-2 text-[14.5px] font-semibold"
          >
            <D_MiniDesk current={id} />
            Back to the desk
            <K_Icon
              name="ArrowUp"
              size={15}
              className="group-hover:text-accent text-muted"
            />
          </button>
        );
      }

      // One job, seen up close on the desk.
      function D_Close({ job, i, onBack }) {
        const id = job.id;
        const kind = D_KIND[id] || "pair";
        const demos = K_JOB_DEMOS[id];
        const H = K_OBJ[id].vb[3] * D_K_WIDE;
        const gap = 48; // the space between the heading block and the desk below it (mt-12)
        const tuck = -(H * 0.3 + gap);
        const blot = D_BLOT[id];
        const onBlot = blot != null;
        return (
          <section
            id={`d-${id}`}
            aria-labelledby={`d-h-${id}`}
            className="d-close px-4 pt-16 pb-14 sm:px-8 lg:pt-24 lg:pb-16"
          >
            <div className="mx-auto max-w-[1240px]">
              <header className="d-head" style={{ "--d-tuck": `${tuck}px` }}>
                <p
                  className="d-num font-display text-accent text-[2.75rem] leading-none sm:text-[3.4rem] lg:text-[4.25rem]"
                  aria-hidden="true"
                >
                  {K_NUM(i)}
                </p>
                <div className="d-objcell relative z-[1]">
                  <D_Obj id={id} />
                </div>
                <h2
                  id={`d-h-${id}`}
                  className="font-display text-ink mt-4 text-[2.1rem] leading-[1.06] text-balance sm:text-[2.75rem] lg:mt-5 lg:text-[3.3rem]"
                >
                  <span className="sr-only">{K_NUM(i)} </span>
                  {job.name}
                </h2>
                <div className="d-slipcell relative z-[1] mt-6">
                  <p className="d-paper d-flat-sm text-ink max-w-[36rem] rounded-[6px] px-4 py-3 text-[17px] leading-snug sm:px-5 sm:py-3.5 sm:text-[18.5px]">
                    {job.outcome}
                  </p>
                </div>
              </header>

              <div className={`relative mt-12 ${onBlot ? "d-on-blot" : ""}`}>
                {onBlot && (
                  <div className={`d-blot ${blot}`} aria-hidden="true" />
                )}
                {kind === "pair" && (
                  <div className="grid items-start gap-8 lg:grid-cols-12 lg:gap-10">
                    <div className="grid min-w-0 gap-8 lg:col-span-7">
                      {demos.map((d) => (
                        <D_Print key={d.id} entry={d} />
                      ))}
                    </div>
                    <div className="min-w-0 lg:col-span-5">
                      <D_Pad job={id} />
                    </div>
                  </div>
                )}
                {kind === "two" && (
                  <div className="grid gap-8 lg:gap-10">
                    <div className="grid items-start gap-8 lg:grid-cols-2 lg:gap-10">
                      {demos.map((d) => (
                        <D_Print key={d.id} entry={d} />
                      ))}
                    </div>
                    <D_Pad job={id} columns={2} />
                  </div>
                )}
                {kind === "wide" && (
                  <div className="grid gap-8 lg:gap-10">
                    {demos.map((d) => (
                      <D_Print key={d.id} entry={d} />
                    ))}
                    <D_Pad job={id} columns={2} />
                  </div>
                )}
              </div>

              <div className="mt-14 flex lg:justify-end">
                <D_Back id={id} onBack={onBack} />
              </div>
            </div>
          </section>
        );
      }

      function VariantD() {
        const { motion } = useProtoState();
        const wide = K_useMedia("(min-width: 768px)");
        // The close-up the reader last opened or came back from: the hero desk lifts and names it.
        const [last, setLast] = useState(null);
        const open = (id) => {
          setLast(id);
          K_scrollTo(`d-${id}`, { smooth: motion });
        };
        const back = (id) => {
          setLast(id);
          K_scrollTo("d-desk", { smooth: motion });
        };
        return (
          <K_Root v="D">
            <style>{D_CSS}</style>
            <K_Header />
            <main>
              <div className="px-4 pt-8 pb-10 sm:px-8 lg:pt-14 lg:pb-12">
                <div className="mx-auto max-w-[1240px]">
                  <K_HeroCopy className="d-hero" />
                  <p className="mt-10 flex items-start gap-2 text-[15px] leading-snug text-muted lg:mt-12">
                    <K_Icon
                      name="MousePointerClick"
                      size={16}
                      className="text-accent mt-0.5 shrink-0"
                    />
                    Each object on the desk is one part of your research. Select
                    one to see it up close.
                  </p>
                </div>
              </div>

              <div className="d-desk">
                <section
                  id="d-desk"
                  aria-labelledby="d-desk-h"
                  className="px-4 pt-6 sm:px-8 lg:pt-10"
                >
                  <h2 id="d-desk-h" className="sr-only">
                    The desk
                  </h2>
                  <div className="mx-auto max-w-[1240px]">
                    <K_Desk
                      wide={wide}
                      current={last}
                      onPick={open}
                      pickLabel={(j) =>
                        `${K_NUM(JOBS.indexOf(j))} ${j.name}: see it up close`
                      }
                    />
                  </div>
                </section>

                {JOBS.map((j, i) => (
                  <D_Close key={j.id} job={j} i={i} onBack={() => back(j.id)} />
                ))}

                <div className="px-4 pt-10 pb-20 sm:px-8 lg:pt-16 lg:pb-28">
                  <div className="d-setup d-paper d-flat mx-auto max-w-[1240px] rounded-[10px]">
                    <K_Setup />
                  </div>
                </div>
              </div>
            </main>
            <K_Footer />
          </K_Root>
        );
      }
      // --- Variant D END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Desk as contents", component: VariantA },
        { key: "B", name: "Desk at your side", component: VariantB },
        { key: "C", name: "Object chapters", component: VariantC },
        { key: "D", name: "The page is the desk", component: VariantD },
      ];

      function App() {
        const { motion } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          window.scrollTo(0, 0);
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        const btn = {
          background: "none",
          border: "none",
          color: "inherit",
          cursor: "pointer",
          fontSize: "1.1rem",
          padding: "0 0.25rem",
        };
        return (
          <>
            <V.component key={V.key} />
            <div
              style={{
                position: "fixed",
                bottom: "1rem",
                left: "50%",
                transform: "translateX(-50%)",
                background: "#111827",
                color: "#f8fafc",
                borderRadius: "9999px",
                padding: "0.45rem 1rem",
                display: "flex",
                alignItems: "center",
                gap: "0.75rem",
                fontSize: "0.8125rem",
                zIndex: 9999,
                boxShadow: "0 6px 20px rgba(0,0,0,0.35)",
                fontFamily: "ui-sans-serif, system-ui, sans-serif",
                maxWidth: "calc(100vw - 2rem)",
                whiteSpace: "nowrap",
              }}
            >
              <button
                aria-label="Previous variant"
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={btn}
              >
                ←
              </button>
              <span style={{ display: "flex", gap: "0.35rem" }}>
                {VARIANTS.map((v, i) => (
                  <button
                    key={v.key}
                    aria-label={`Variant ${v.key}: ${v.name}`}
                    onClick={() => setIdx(i)}
                    style={{
                      width: "1.5rem",
                      height: "1.5rem",
                      borderRadius: "9999px",
                      border: "none",
                      cursor: "pointer",
                      background:
                        i === idx ? "#E8622C" : "rgba(255,255,255,0.12)",
                      color: "#fff",
                      fontSize: "0.7rem",
                      fontWeight: 600,
                    }}
                  >
                    {v.key}
                  </button>
                ))}
              </span>
              <span
                style={{
                  minWidth: 0,
                  maxWidth: "min(10rem, 24vw)",
                  overflow: "hidden",
                  textOverflow: "ellipsis",
                }}
              >
                {V.name}
              </span>
              <button
                aria-label="Next variant"
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={btn}
              >
                →
              </button>
              <button
                onClick={() => setProto((s) => ({ motion: !s.motion }))}
                style={{
                  ...btn,
                  fontSize: "0.75rem",
                  border: "1px solid rgba(255,255,255,0.25)",
                  borderRadius: "9999px",
                  padding: "0.15rem 0.6rem",
                }}
              >
                {motion ? "Pause motion" : "Play motion"}
              </button>
            </div>
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
