    <title>ZotLit landing prototypes</title>
    <!--
      PROTOTYPE — throwaway. Not production code. Branch: proto/landing-page.

      DESIGN QUESTION
        ZotLit 2.1 and 2.2 changed what the product is: citations that render in Live
        Preview, citations in the graph view, the References and Cited By sidebars, the
        Library View, ZotQuery files and blocks, the PDF reader, profiles and the Template
        Workbench, the Query CLI, and agent skills. What landing page shows all of this
        fastest, through layout, illustration, animation and demos instead of prose?
        Each variant answers with a different structure AND a different visual world.

      TREATMENT
        Editorial. The user released the "Manuscript & Machine" system for this exploration.
        The one fixed identity is the brand (docs/brand.md): the ZL mark drawn from its master
        geometry, navy #1E3A5F and orange #E8622C (dark inks #D8E2F0 / #F0793F), and the
        "ZotLit" wordmark in Archivo SemiBold.

      TOKENS
        Every variant styles through the same utilities (bg-ground, bg-surface, text-ink,
        text-muted, border-line, text-accent, text-accent2, text-cite, font-display,
        font-body, font-mono, font-sans, bg-z-yellow ...). Each variant root carries
        data-v="<KEY>", and the token VALUES change per variant below.

        A  One paper's journey   ground #F2F4F7 · surface #FFFFFF · ink #0E1726 · muted #5A6578 · accent #E8622C · accent2 #1E3A5F
                                 Instrument Serif (display) · Geist (body) · Geist Mono (data)
                                 Scroll story with a sticky stage; real 2.2 screenshots, choreographed with zoom and callouts.
        B  Live bento            ground #FFFFFF · surface #EDF1F6 · ink #1E3A5F · line #1E3A5F · accent #E8622C
                                 Archivo at extreme widths (display, body) · Martian Mono (labels)
                                 Flat brand blocks: one grid of looping mini-demos, tile size = tier.
        C  Research map          ground #050911 · surface #0D1422 · ink #E7EDF6 · accent #F0793F · accent2 #79A8FF (dark only)
                                 Syne (display) · Hanken Grotesk (body) · DM Mono (data)
                                 The citation graph IS the navigation; every feature is a node that opens a demo.
        D  Source / Live Preview ground #F4F5F6 · surface #FFFFFF · ink #1A1D22 · accent #E8622C · accent2 #3565D0
                                 Literata (display, body) · Fragment Mono (source)
                                 One toggle flips the whole page between what researchers see and what the machine reads.
        E  The page is a paper   ground #E6E7EA · surface #FFFFFF · ink #121212 · accent2 #C8102E · cite #0B8A33
                                 STIX Two Text (display, body) · Source Sans 3 (captions) · JetBrains Mono (code)
                                 A typeset preprint whose own citations, figures and references are live ZotLit features.
    -->

      {

    <div id="root"></div>

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, {
        useState,
        useEffect,
        useMemo,
        useRef,
        useCallback,
        useLayoutEffect,
        useSyncExternalStore,
        Fragment,
      } from "react";
      import { createRoot } from "react-dom/client";
      // Every lucide icon, as Icons.Search, Icons.Quote, ... (variants cannot add imports).
      import * as Icons from "lucide-react";
      // motion (framer-motion): Motion.motion.div, Motion.AnimatePresence, Motion.useScroll ...
      import * as Motion from "motion/react";

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // --- App ---
      // --- Shared ---
      // Shared by every variant: the mock store, animation hooks, the brand mark, and one
      // mock research library (a thesis on language models and situated knowledge). Variants
      // read all of it from module scope and take no props, so a trimmed winner renders bare.

      // ---------- Store ----------
      // motion: false freezes every loop (switcher toggle, and prefers-reduced-motion).
      // paper: the featured Zotero item, by citation key.
      const protoStore = (() => {
        let state = {
          motion: !window.matchMedia("(prefers-reduced-motion: reduce)")
            .matches,
          paper: "vaswani2017",
        };
        const subs = new Set();
        return {
          get: () => state,
          set: (patch) => {
            state = {
              ...state,
              ...(typeof patch === "function" ? patch(state) : patch),
            };
            subs.forEach((f) => f());
          },
          subscribe: (f) => {
            subs.add(f);
            return () => subs.delete(f);
          },
        };
      })();
      function useProtoState() {
        return useSyncExternalStore(protoStore.subscribe, protoStore.get);
      }
      const setProto = protoStore.set;

      // ---------- Animation hooks ----------
      // useLoop(stepMs, count): an index that cycles 0..count-1. Holds still when motion is off.
      function useLoop(stepMs, count, { active = true, start = 0 } = {}) {
        const { motion } = useProtoState();
        const [i, setI] = useState(start);
        useEffect(() => {
          if (!motion || !active) return;
          const id = setInterval(() => setI((n) => (n + 1) % count), stepMs);
          return () => clearInterval(id);
        }, [motion, active, stepMs, count]);
        return i;
      }

      // useTimeline([ms, ms, ...]): the index of the current step; step k lasts durations[k],
      // then the timeline loops. With motion off it rests on the last step (the finished state).
      function useTimeline(durations, { active = true, loop = true } = {}) {
        const { motion } = useProtoState();
        const [i, setI] = useState(0);
        const key = durations.join(",");
        useEffect(() => {
          if (!motion) {
            setI(durations.length - 1);
            return;
          }
          if (!active) return;
          let cancelled = false;
          let t;
          let k = 0;
          setI(0);
          const next = () => {
            t = setTimeout(() => {
              if (cancelled) return;
              if (k === durations.length - 1 && !loop) return;
              k = (k + 1) % durations.length;
              setI(k);
              next();
            }, durations[k]);
          };
          next();
          return () => {
            cancelled = true;
            clearTimeout(t);
          };
        }, [motion, active, key, loop]);
        return i;
      }

      // useTypewriter(text): the typed prefix of text. Full text when motion is off or done.
      function useTypewriter(
        text,
        { cps = 28, active = true, delay = 0 } = {},
      ) {
        const { motion } = useProtoState();
        const [n, setN] = useState(motion ? 0 : text.length);
        useEffect(() => {
          if (!motion) {
            setN(text.length);
            return;
          }
          if (!active) {
            setN(0);
            return;
          }
          setN(0);
          let i = 0;
          let iv;
          const t = setTimeout(() => {
            iv = setInterval(() => {
              i += 1;
              setN(i);
              if (i >= text.length) clearInterval(iv);
            }, 1000 / cps);
          }, delay);
          return () => {
            clearTimeout(t);
            clearInterval(iv);
          };
        }, [text, cps, active, delay, motion]);
        return text.slice(0, n);
      }

      // useInView(ref): true while the element is on screen (or once, with { once: true }).
      function useInView(ref, { threshold = 0.3, once = false } = {}) {
        const [inView, setInView] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => {
              if (e.isIntersecting) {
                setInView(true);
                if (once) io.disconnect();
              } else if (!once) setInView(false);
            },
            { threshold },
          );
          io.observe(el);
          return () => io.disconnect();
        }, [threshold, once]);
        return inView;
      }

      // useScrollProgress(ref): 0 when the element's top meets the viewport bottom,
      // 1 when its bottom meets the viewport top. For scroll-driven stages.
      function useScrollProgress(ref) {
        const [p, setP] = useState(0);
        useEffect(() => {
          let raf = 0;
          const update = () => {
            raf = 0;
            const el = ref.current;
            if (!el) return;
            const r = el.getBoundingClientRect();
            const vh = window.innerHeight;
            const total = r.height + vh;
            setP(Math.min(1, Math.max(0, (vh - r.top) / total)));
          };
          const onScroll = () => {
            if (!raf) raf = requestAnimationFrame(update);
          };
          update();
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", onScroll);
          return () => {
            window.removeEventListener("scroll", onScroll);
            window.removeEventListener("resize", onScroll);
            cancelAnimationFrame(raf);
          };
        }, []);
        return p;
      }

      // ---------- Brand (docs/brand.md) ----------
      // The ZL mark from its master geometry; never redraw it. Dark inks: #D8E2F0 / #F0793F.
      function ZotLitMark({
        size = 24,
        ink = "#1E3A5F",
        accent = "#E8622C",
        className = "",
        title = "ZotLit",
      }) {
        return (
          <svg
            viewBox="0 0 24 24"
            width={size}
            height={size}
            className={className}
            role="img"
            aria-label={title}
          >
            <path
              d="M4 3.5 H17 V7 L8.75 16.5 H20.5 V20 H4 V16.5 L12.25 7 H4 Z"
              fill={ink}
            />
            <path
              d="M17 3.5 H20.5 V16.5 L18.75 14.75 L17 16.5 Z"
              fill={accent}
            />
          </svg>
        );
      }
      // "Zot" in ink, "Lit" in accent, Archivo SemiBold, tracking -1%.
      function Wordmark({
        ink = "currentColor",
        accent = "var(--accent)",
        className = "",
        style,
      }) {
        return (
          <span
            className={className}
            style={{
              fontFamily: "Archivo, sans-serif",
              fontWeight: 600,
              letterSpacing: "-0.01em",
              lineHeight: 1,
              ...style,
            }}
          >
            <span style={{ color: ink }}>Zot</span>
            <span style={{ color: accent }}>Lit</span>
          </span>
        );
      }
      // Mark + wordmark lockup: mark 0.875em square, gap 0.25em.
      function Lockup({
        ink,
        accent,
        markInk = "#1E3A5F",
        markAccent = "#E8622C",
        className = "",
        style,
      }) {
        return (
          <span
            className={className}
            style={{
              display: "inline-flex",
              alignItems: "center",
              gap: "0.25em",
              lineHeight: 1,
              ...style,
            }}
          >
            <ZotLitMark size="0.875em" ink={markInk} accent={markAccent} />
            <Wordmark ink={ink} accent={accent} />
          </span>
        );
      }

      // ---------- Facts ----------
      const SITE = "https://zotlit.aidenlx.site";
      const FACTS = {
        version: "2.2",
        stars: 1047, // GitHub stars on 2026-10-29
        obsidian: "Obsidian 1.14.2 or later",
        zotero: "Zotero 9 or 10 (PDF editing needs Zotero 10)",
        install: `${SITE}/docs/install-zotlit`,
        docs: `${SITE}/docs`,
        firstNote: `${SITE}/docs/tutorial/first-note`,
        skill: `${SITE}/docs/install-skill`,
        github: "https://github.com/aidenlx/zotlit",
        skillInstall: `npx skills@latest add ${SITE}/`,
        agents: ["Claude Code", "Codex", "pi"],
        skills: [
          "zotlit-citations",
          "zotlit-query",
          "zotlit-template",
          "zotlit-pandoc",
        ],
      };

      // ---------- Features (tiers come from the request) ----------
      // tier: "showpiece" (fancy) | "daily" (practical) | "power" (advanced)
      const FEATURES = [
        {
          id: "citations",

          let left = -26;
          if (px + left + CW > w - 10) left = w - 10 - CW - px;
          if (px + left < 10) left = 10 - px;
          pos = { left, [side === "b" ? "top" : "bottom"]: 24 };
        }
        const ring = compact ? 18 : 24;
        return (
          <div
            className="a-hot pointer-events-none absolute z-10"
            style={{ left: px, top: py, animationDelay: `${delay}s` }}
          >
            <span
              className={`a-pulse absolute top-0 left-0 rounded-full ${compact ? "bg-accent/45" : "border-accent border-2"}`}
              style={{ width: ring + 4, height: ring + 4 }}
            />
            {compact ? (
              <span
                className="border-surface bg-accent text-surface absolute top-0 left-0 grid place-items-center rounded-full border-2 font-mono text-[10px] font-semibold shadow-[0_1px_4px_rgba(14,23,38,0.35)]"
                style={{
                  width: ring,
                  height: ring,
                  transform: "translate(-50%, -50%)",
                }}
              >
                {n}
              </span>
            ) : (
              <span
                className="a-ring border-accent absolute top-0 left-0 rounded-full border-2"
                style={{
                  width: ring,
                  height: ring,
                  transform: "translate(-50%, -50%)",
                }}
              />
            )}
            {!compact && (
              <div
                className="a-float border-line bg-surface absolute w-max max-w-[240px] rounded-[10px] border px-3 py-2"
                style={pos}
              >
                <div className="text-accent font-mono text-[10px] tracking-[0.12em] uppercase">
                  {p.t}
                </div>
                <div className="text-ink mt-0.5 text-[13px] leading-[1.38]">
                  {p.d}
                </div>
              </div>
            )}
          </div>
        );
      }

      // The camera: stacked screenshot layers (one per shot) that cross-fade, each panned and
      // zoomed with a CSS transform; hotspots and the cursor are projected on top.
      function A_Camera({
        shots,
        shot,
        view,
        hot = [],
        hotKey = "",
        compact = false,
        pad = 0.9,
        eager = false,
        cursor = null,
        hotDelay = 0.85,
        className = "",
        rounded = "rounded-[18px]",
        children,
      }) {
        const boxRef = useRef(null);
        const [size, setSize] = useState({ w: 0, h: 0 });
        useLayoutEffect(() => {
          const el = boxRef.current;
          if (!el) return;
          const r = el.getBoundingClientRect();
          setSize({ w: r.width, h: r.height });
          const ro = new ResizeObserver(([e]) =>
            setSize({ w: e.contentRect.width, h: e.contentRect.height }),
          );
          ro.observe(el);
          return () => ro.disconnect();
        }, []);
        const views = useRef({});
        views.current[shot] = view;
        const { w, h } = size;
        const L = w > 0 ? aLayout(shot, view, w, h, pad) : null;
        const project = (x, y) => [
          L.tx + (x / 100) * L.Wl * L.z,
          L.ty + (y / 100) * L.Hl * L.z,
        ];
        return (
          <div
            ref={boxRef}
            className={`a-studio border-line relative overflow-hidden border ${rounded} ${className}`}
          >
            {w > 0 &&
              shots.map((k) => {
                const v = views.current[k] || { cx: 50, cy: 50, z: 1 };
                const M = aLayout(k, v, w, h, pad);
                const on = k === shot;
                const [x0, y0, x1, y1] = A_WIN[k];
                const r = 22 * M.s0;
                return (
                  <div
                    key={k}
                    aria-hidden={on ? undefined : "true"}
                    className="a-layer absolute top-0 left-0"
                    style={{
                      width: M.Wl,
                      height: M.Hl,
                      transformOrigin: "0 0",
                      transform: `translate(${M.tx}px, ${M.ty}px) scale(${M.z})`,
                      opacity: on ? 1 : 0,
                      zIndex: on ? 2 : 1,
                    }}
                  >
                    <div
                      className="a-plate absolute"
                      style={{
                        left: `${x0}%`,
                        top: `${y0}%`,
                        width: `${x1 - x0}%`,
                        height: `${y1 - y0}%`,
                        borderRadius: r,
                      }}
                    />
                    <img
                      src={SHOTS[k].src}
                      alt={SHOTS[k].alt}
                      loading={eager ? "eager" : "lazy"}
                      decoding="async"
                      draggable={false}
                      className="absolute inset-0 block h-full w-full select-none"
                      style={{
                        clipPath: `inset(${y0}% ${100 - x1}% ${100 - y1}% ${x0}% round ${r}px)`,
                      }}
                    />
                  </div>
                );
              })}
            {L &&
              hot.map((p, i) => {
                const [px, py] = project(p.x, p.y);
                if (px < 4 || py < 4 || px > w - 4 || py > h - 4) return null;
                return (
                  <A_Hot
                    key={`${hotKey}-${i}`}
                    p={p}
                    n={i + 1}
                    px={px}
                    py={py}
                    w={w}
                    h={h}
                    compact={compact}
                    delay={hotDelay + i * 0.25}
                  />
                );
              })}
            {L &&
              cursor &&
              (() => {
                const [px, py] = project(cursor.x, cursor.y);
                return (
                  <div
                    className="pointer-events-none absolute z-20"
                    style={{ left: px - 3, top: py - 2 }}
                  >
                    <div key={cursor.k} className="a-cursor">
                      <svg
                        width="22"
                        height="26"
                        viewBox="0 0 22 26"
                        aria-hidden="true"
                      >
                        <path
                          d="M3 2 L3 20 L7.6 15.8 L10.6 23 L13.6 21.7 L10.7 14.7 L17 14.7 Z"
                          fill="#0E1726"
                          stroke="#FFFFFF"
                          strokeWidth="1.6"
                          strokeLinejoin="round"
                        />
                      </svg>
                    </div>
                  </div>
                );
              })()}
            {children}
          </div>
        );
      }

      function A_useActiveStep(refs, count) {
        const [active, setActive] = useState(0);

          const io = new IntersectionObserver(
            (entries) => {

                if (e.isIntersecting) setActive(Number(e.target.dataset.step));
            },
            { rootMargin: "-44% 0px -55% 0px" },
          );
          refs.current.slice(0, count).forEach((el) => el && io.observe(el));
          return () => io.disconnect();
        }, [count]);
        return active;

      function A_MobileChapter({ ch, ci }) {
        const { motion } = useProtoState();

        const n = ch.beats.length;
        useEffect(() => {
          if (!motion || !inView || n < 2) return;
          const t = setTimeout(() => setB((x) => (x + 1) % n), 5200);
          return () => clearTimeout(t);
        }, [b, motion, inView, n]);
        const beat = ch.beats[b];
        const shots = [...new Set(ch.beats.map((x) => x.shot))];
        // A narrow camera frames the hotspots themselves, a little closer than the wide stage.
        const mview = {
          cx: beat.hot.reduce((a, p) => a + p.x, 0) / beat.hot.length,

          z: Math.max(2, beat.view.z * 1.35),

      // Lines of a multi-line literal with the source indentation removed (the host page may
      // indent the script block).
      function aLines(text) {
        const lines = text.split("\n");
        const rest = lines.slice(1).filter((l) => l.trim());
        const pad = rest.length
          ? Math.min(...rest.map((l) => l.match(/^ */)[0].length))
          : 0;
        return [lines[0], ...lines.slice(1).map((l) => l.slice(pad))];
      }

      // JSON tint for the terminal: keys and string values.
      function aTint(line) {
        const out = [];
        const re = /("(?:[^"\\]|\\.)*")(\s*:)?/g;
        let last = 0;
        let m;
        let k = 0;
        while ((m = re.exec(line))) {
          if (m.index > last)
            out.push(<span key={k++}>{line.slice(last, m.index)}</span>);
          out.push(
            <span key={k++} className={m[2] ? "a-k" : "a-s"}>
              {m[1]}
            </span>,
          );
          if (m[2]) out.push(<span key={k++}>{m[2]}</span>);
          last = m.index + m[0].length;
        }
        if (last < line.length)
          out.push(<span key={k++}>{line.slice(last)}</span>);
        return out;
      }

      const B_M = Motion.motion;

      // ---------- B: small helpers ----------
      function bClamp01(x) {
        return x < 0 ? 0 : x > 1 ? 1 : x;
      }
      function bSeg(ph, a, b) {
        return bClamp01((ph - a) / (b - a));
      }
      function bType(str, ph, a, b) {
        return str.slice(0, Math.round(bSeg(ph, a, b) * str.length));

      function bIn(ph, a, b) {
        return ph >= a && ph < b;

      // The shared multi-line strings carry the page's indentation; strip it.
      function bDedent(s) {
        const lines = s.split("\n");
        const rest = lines.slice(1).filter((l) => l.trim());
        const pad = rest.length
          ? Math.min(...rest.map((l) => l.match(/^ */)[0].length))
          : 0;
        return [
          lines[0],
          ...lines
            .slice(1)
            .map((l) => l.slice(Math.min(pad, l.match(/^ */)[0].length))),
        ].join("\n");
      }
      function bLast(name) {
        return name.split(" ").slice(-1)[0];

        const p = name.split(" ");
        const last = p.pop();
        return p.map((x) => x[0] + ".").join(" ") + " " + last;
      }
      function bInvert(name) {
        const p = name.split(" ");

      // ---------- B: the shared clock ----------
      function B_ClockProvider({ children }) {
        const { motion } = useProtoState();
        const [t, setT] = useState(0);

          if (!motion) return;
          const start = performance.now() - acc.current;
          const id = setInterval(() => {
            acc.current = performance.now() - start;
            setT(acc.current);
          }, 50);
          return () => clearInterval(id);
        }, [motion]);
        const value = useMemo(() => ({ t, live: motion }), [t, motion]);
        return (
          <B_ClockCtx.Provider value={value}>{children}</B_ClockCtx.Provider>
        );

        return React.useContext(B_ClockCtx);

      function B_usePhase(loop, final) {

      // Position a floating panel under (or over) an anchor, inside a box. Values are in the
      // box's own pixels, so a layout animation's scale does not throw them off.
      function B_useAnchor(boxRef, anchorRef, width) {
        const [pos, setPos] = useState(null);
        useLayoutEffect(() => {
          const box = boxRef.current;
          const a = anchorRef && anchorRef.current;
          if (!box || !a) {
            setPos((p) => (p ? null : p));
            return;
          }
          const br = box.getBoundingClientRect();
          const ar = a.getBoundingClientRect();
          const W = box.offsetWidth;
          const H = box.offsetHeight;
          const s = W ? br.width / W : 1;
          const aLeft = Math.round((ar.left - br.left) / s);
          const aTop = Math.round((ar.top - br.top) / s);
          const aBottom = Math.round((ar.bottom - br.top) / s);
          const w = Math.max(0, Math.min(width, W - 16));
          const left = Math.round(Math.max(8, Math.min(aLeft, W - w - 8)));
          const next = {
            left,
            top: aBottom + 6,
            w,
            aLeft,
            aTop,
            H,
            up: aBottom > H * 0.55,
          };
          setPos((p) =>
            p &&
            p.left === next.left &&
            p.top === next.top &&
            p.w === next.w &&
            p.H === next.H &&
            p.aLeft === next.aLeft &&
            p.aTop === next.aTop
              ? p
              : next,
          );
        });

      // ---------- B: citation styles (APA comes from the shared Bib) ----------

          y: cLerp(a.y, b.y, e),
          k: cLerp(a.k, b.k, e),
        };
      }
      const C_SIDECLS = {
        r: "flex-row",
        l: "flex-row-reverse",
        t: "flex-col-reverse",
        b: "flex-col",
      };
      const C_SIDETF = {
        r: "translate(-14px,-50%)",
        l: "translate(calc(-100% + 14px),-50%)",
        t: "translate(-50%,calc(-100% + 14px))",
        b: "translate(-50%,-14px)",
      };

      // ---------- Citation Popover ----------
      function C_Popover({ k, style, className = "", onEnter, onLeave, id }) {
        const p = PAPERS[k];
        const notes = citedBy(k);
        const [msg, setMsg] = useState("");
        const act = (m) => setMsg(m);
        const btn =
          "inline-flex items-center gap-1.5 border border-line px-2.5 py-1.5 text-[12px] text-ink hover:border-accent hover:text-accent transition-colors";
        return (
          <div
            id={id}
            data-c-pop=""
            role="dialog"
            aria-label={`Reference for ${p.inText} ${p.year}`}
            onMouseEnter={onEnter}
            onMouseLeave={onLeave}
            style={style}
            className={`border-line bg-surface w-[min(340px,calc(100vw-32px))] border p-4 text-left ${className}`}
          >
            <div className="flex items-center justify-between gap-3 font-mono text-[10.5px] tracking-[0.12em] text-muted uppercase">
              <span className="tracking-normal normal-case">@{k}</span>
              <span>{C_TYPE[p.type]}</span>
            </div>
            <p className="text-ink mt-2.5 text-[13.5px] leading-[1.5]">
              <Bib k={k} />
            </p>
            <p className="mt-2.5 font-mono text-[10.5px] text-muted">
              Cited in {notes.length} {notes.length === 1 ? "note" : "notes"}:{" "}
              {notes.map((n) => cNoteShort(n.title)).join(", ")}
            </p>
            <div className="mt-3 flex flex-wrap gap-1.5">
              {p.note ? (
                <button
                  type="button"
                  className={btn}
                  onClick={() => act(`Opens @${k}.md`)}
                >
                  <C_I n="FileText" size={13} /> Open literature note
                </button>
              ) : (
                <span className="inline-flex items-center px-1 py-1.5 font-mono text-[11px] text-muted">
                  No literature note yet
                </span>
              )}
              <button
                type="button"
                className={btn}
                onClick={() => act("Selects the item in Zotero")}
              >
                <C_I n="BookOpen" size={13} /> Open in Zotero
              </button>
              {p.pdf ? (
                <button
                  type="button"
                  className={btn}
                  onClick={() => act("Opens the PDF in Obsidian")}
                >
                  <C_I n="FileType" size={13} /> Open PDF
                </button>
              ) : null}
            </div>
            {msg ? (
              <p className="text-accent2 mt-2 font-mono text-[10.5px]">{msg}</p>
            ) : null}
          </div>
        );
      }

      // ---------- The chart (hero graph and feature map in one coordinate system) ----------
      function C_Chart({
        w,
        h,
        t,
        tall,
        part,
        hot,
        setHot,
        selected,
        onSelect,
      }) {
        const [nodeHot, setNodeHot] = useState(null);
        const hideT = useRef(0);
        const tt = part === "both" ? t : part === "map" ? 1 : 0;
        const e = part === "both" ? cEase(t) : tt;
        const cam =
          part === "hero"
            ? cHeroCam(w, h, tall)
            : part === "map"
              ? cMapCam(w, h, tall)
              : cMix(cHeroCam(w, h, tall), cMapCam(w, h, tall), e);
        const rot = tall && part === "hero";
        const reveal = part !== "map";
        const uid = `${part}${tall ? "t" : "w"}`;

        const P = {};
        for (const n of GRAPH.nodes) {
          const [u0, v0] = C_POS[n.id];
          const u = rot ? v0 : u0;
          const v = rot ? u0 : v0;
          P[n.id] = [cam.x + cam.s * u, cam.y + cam.s * v];
        }
        const Fp = {};
        for (const id of C_ORDER) {
          const R = C_RING[C_F[id].tier];
          const a = (C_META[id].a * Math.PI) / 180;
          Fp[id] = [
            cam.x + cam.s * R * Math.cos(a),
            cam.y + (cam.s * R * Math.sin(a)) / cam.k,
          ];
        }
        const labelA = 1 - cClamp((tt - 0.04) / 0.22);
        const ringA = (i) => cClamp((tt - 0.16 - i * 0.07) / 0.34);
        const featA = (i) => cClamp((tt - 0.4 - i * 0.08) / 0.22);
        const linkA = cClamp((tt - 0.68) / 0.22);
        const axisA = 1 - cClamp(tt / 0.15);
        const rN = cLerp(tall ? 5 : 6.5, 3.6, e);
        const rL = cLerp(tall ? 4.2 : 5.2, 3, e);
        const rC = cLerp(tall ? 3.4 : 4.2, 2.5, e);
        const focusF = selected || hot;
        const acts = focusF ? C_META[focusF].acts : [];
        const nodeOn = nodeHot && labelA > 0.5 ? nodeHot : null;

        useEffect(() => {
          if (!nodeHot) return;
          const away = (ev) => {
            if (
              !ev.target.closest ||
              ev.target.closest("[data-c-node],[data-c-pop]")
            )
              return;
            setNodeHot(null);
          };
          const esc = (ev) => ev.key === "Escape" && setNodeHot(null);
          document.addEventListener("pointerdown", away);
          document.addEventListener("keydown", esc);
          return () => {
            document.removeEventListener("pointerdown", away);
            document.removeEventListener("keydown", esc);
          };
        }, [nodeHot]);

        const hover = (id, on) => {
          clearTimeout(hideT.current);
          if (on) setNodeHot(id);
          else
            hideT.current = setTimeout(
              () => setNodeHot((cur) => (cur === id ? null : cur)),
              240,
            );
        };
        const popHold = () => clearTimeout(hideT.current);
        const popLeave = () => {
          hideT.current = setTimeout(() => setNodeHot(null), 240);
        };

        // Publication-year axis (wide hero only): 1940 to 2030.
        const ax0 = Math.max(w * 0.66, w / 2 + 300);
        const ax1 = w - 48;
        const axY = h - 40;
        const yearX = (y) => ax0 + ((y - 1940) / 90) * (ax1 - ax0);
        const stack = {};

        let pop = null;
        if (nodeOn && PAPERS[nodeOn] && tt < 0.12) {
          const [x, y] = P[nodeOn];
          const pw = Math.min(340, w - 32);
          let left;
          let top;
          if (tall) {
            left = cClamp(x - pw / 2, 16, w - 16 - pw);
            top = y < h - 270 ? y + 18 : y - 262;
          } else {
            left = x + 26 + pw < w - 16 ? x + 26 : x - 26 - pw;
            top = cClamp(y - 50, 76, h - 330);
          }
          pop = (
            <C_Popover
              id={`c-pop-${uid}`}
              k={nodeOn}
              className="c-a-in absolute z-30"
              style={{ left, top }}
              onEnter={popHold}
              onLeave={popLeave}
            />
          );
        }

        return (
          <>
            <svg
              className="absolute inset-0 block"
              width={w}
              height={h}
              aria-hidden="true"
            >
              <defs>
                <radialGradient id={`c-halo-${uid}`}>
                  <stop
                    offset="0"
                    style={{ stopColor: "var(--accent2)", stopOpacity: 0.3 }}
                  />
                  <stop
                    offset="1"
                    style={{ stopColor: "var(--accent2)", stopOpacity: 0 }}
                  />
                </radialGradient>
              </defs>

              {/* Reticle: two rings and a cross hair around the vault */}
              <g className={reveal ? "c-a-in" : ""} style={{ "--d": "60ms" }}>
                {[78, 168].map((R) => (
                  <ellipse
                    key={R}
                    cx={cam.x}
                    cy={cam.y}
                    rx={cam.s * R}
                    ry={(cam.s * R) / cam.k}
                    fill="none"
                    className="stroke-line"
                    strokeWidth={1}
                  />
                ))}
                <line
                  x1={cam.x - cam.s * 200}
                  y1={cam.y}
                  x2={cam.x + cam.s * 200}
                  y2={cam.y}
                  className="stroke-line"
                  strokeDasharray="2 6"
                />
                <line
                  x1={cam.x}
                  y1={cam.y - (cam.s * 200) / cam.k}
                  x2={cam.x}
                  y2={cam.y + (cam.s * 200) / cam.k}
                  className="stroke-line"
                  strokeDasharray="2 6"
                />
              </g>

              {/* Orbits */}
              {C_TIER_ORDER.map((tier, i) => {
                const a = ringA(i);
                if (a <= 0) return null;
                const rx = cam.s * C_RING[tier];
                const ry = rx / cam.k;
                const d = `M ${cam.x - rx} ${cam.y} A ${rx} ${ry} 0 1 1 ${cam.x + rx} ${cam.y} A ${rx} ${ry} 0 1 1 ${cam.x - rx} ${cam.y}`;
                return (
                  <g key={tier}>
                    <path
                      id={`c-orb-${uid}-${tier}`}
                      d={d}
                      fill="none"
                      className="stroke-muted"
                      strokeOpacity={0.42}
                      strokeWidth={1}
                      pathLength={1}
                      strokeDasharray="1"
                      strokeDashoffset={1 - a}
                    />
                    {!tall && a > 0.7 ? (
                      <text
                        className="fill-muted font-mono"
                        fontSize="10"
                        letterSpacing="1.6"
                        dy="-7"
                        opacity={cClamp((a - 0.7) / 0.3)}
                      >
                        <textPath
                          href={`#c-orb-${uid}-${tier}`}
                          startOffset={`${((C_RING_CAPTION[tier] - 180) / 360) * 100}%`}
                          textAnchor="middle"
                        >
                          {TIERS[tier].name.toUpperCase()}
                        </textPath>
                      </text>
                    ) : null}
                  </g>
                );
              })}

              {/* Citation and link edges */}
              {GRAPH.edges.map((ed, i) => {
                const [x1, y1] = P[ed.from];
                const [x2, y2] = P[ed.to];
                const cite = ed.kind === "citation";
                const lit = nodeOn && (ed.from === nodeOn || ed.to === nodeOn);
                const dim = nodeOn && !lit;
                return (
                  <line
                    key={i}
                    x1={x1}
                    y1={y1}
                    x2={x2}
                    y2={y2}
                    pathLength={cite ? 1 : undefined}
                    className={`${lit ? "stroke-accent" : cite ? "stroke-ink" : "stroke-accent2"} ${reveal ? (cite ? "c-a-draw" : "c-a-in") : ""}`}
                    style={{ "--d": `${C_REV.edge[i]}ms` }}
                    strokeOpacity={
                      lit ? 0.95 : dim ? 0.07 : cite ? cLerp(0.3, 0.22, e) : 0.5
                    }
                    strokeWidth={lit ? 1.5 : 1}
                    strokeDasharray={cite ? undefined : "3 4"}
                  />
                );
              })}

              {/* Feature links to the notes and papers they act on */}
              {linkA > 0
                ? C_ORDER.map((id) =>
                    C_META[id].acts.map((to) => {
                      const on = focusF === id;
                      const dimmed = focusF && !on;
                      return (
                        <line
                          key={id + to}
                          x1={Fp[id][0]}
                          y1={Fp[id][1]}
                          x2={P[to][0]}
                          y2={P[to][1]}
                          className={on ? "stroke-accent" : "stroke-accent2"}
                          strokeOpacity={
                            linkA * (on ? 0.9 : dimmed ? 0.05 : 0.2)
                          }
                          strokeWidth={on ? 1.25 : 1}
                          strokeDasharray={on ? undefined : "2 4"}
                        />
                      );
                    }),
                  )
                : null}

              {/* Graph nodes */}
              {GRAPH.nodes.map((n) => {
                const [x, y] = P[n.id];
                const d = C_REV.node[n.id];
                const on = nodeOn === n.id || acts.includes(n.id);
                if (n.kind === "note")
                  return (
                    <g
                      key={n.id}
                      className={reveal ? "c-a-pop" : ""}
                      style={{ "--d": `${d}ms` }}
                    >
                      <circle
                        cx={x}
                        cy={y}
                        r={rN + 5}
                        fill="none"
                        className="stroke-accent2"
                        strokeOpacity={on ? 0.9 : 0.35}
                      />
                      <circle cx={x} cy={y} r={rN} className="fill-accent2" />
                    </g>
                  );
                if (n.kind === "literature")
                  return (
                    <circle
                      key={n.id}
                      cx={x}
                      cy={y}
                      r={on ? rL + 1.6 : rL}
                      className={`fill-accent ${reveal ? "c-a-lit" : ""}`}
                      style={{
                        "--d": `${d}ms`,
                        "--d2": `${C_REV.lit[n.id]}ms`,
                      }}
                    />
                  );
                return (
                  <g key={n.id}>
                    <g
                      className={reveal ? "c-a-glow" : ""}
                      style={{ "--d": `${C_REV.lit[n.id] + 300}ms` }}
                    >
                      <circle
                        cx={x}
                        cy={y}
                        r={rC * 6.5}
                        fill={`url(#c-halo-${uid})`}
                      />
                    </g>
                    <circle
                      cx={x}
                      cy={y}
                      r={on ? rC + 1.4 : rC}
                      className={`fill-ground ${on ? "stroke-accent" : "stroke-muted"} ${reveal ? "c-a-pop" : ""}`}
                      strokeWidth={1.25}
                      style={{ "--d": `${d}ms` }}
                    />
                  </g>
                );
              })}

              {/* Drop line from a hovered paper to its year */}
              {!tall && nodeOn && PAPERS[nodeOn] && axisA > 0 ? (
                <line
                  x1={P[nodeOn][0]}
                  y1={P[nodeOn][1] + 8}
                  x2={yearX(PAPERS[nodeOn].year)}
                  y2={axY - 16}
                  className="stroke-accent"
                  strokeOpacity={0.45}
                  strokeDasharray="2 4"
                />
              ) : null}

              {/* Publication-year axis */}
              {!tall && part !== "map" && axisA > 0 ? (
                <g opacity={axisA}>
                  <g
                    className={reveal ? "c-a-in" : ""}
                    style={{ "--d": "2700ms" }}
                  >
                    <line
                      x1={ax0}
                      y1={axY}
                      x2={ax1}
                      y2={axY}
                      className="stroke-muted"
                      strokeOpacity={0.5}
                    />
                    {Array.from({ length: 19 }, (_, i) => 1940 + i * 5).map(
                      (y) => (
                        <line
                          key={y}
                          x1={yearX(y)}
                          y1={axY}
                          x2={yearX(y)}
                          y2={axY + (y % 20 === 0 ? 7 : 3)}
                          className="stroke-muted"
                          strokeOpacity={0.6}
                        />
                      ),
                    )}
                    {[1940, 1960, 1980, 2000, 2020].map((y) => (
                      <text
                        key={y}
                        x={yearX(y)}
                        y={axY + 19}
                        textAnchor="middle"
                        className="fill-muted font-mono"
                        fontSize="10"
                      >
                        {y}
                      </text>
                    ))}
                    <text
                      x={ax0}
                      y={axY - 34}
                      className="fill-muted font-mono"
                      fontSize="10"
                      letterSpacing="1.2"
                    >
                      PUBLICATION YEAR
                    </text>
                    {PAPER_KEYS.map((k) => {
                      const yr = PAPERS[k].year;
                      const sIdx = (stack[yr] = (stack[yr] || 0) + 1) - 1;
                      const on = nodeOn === k;
                      const cx = yearX(yr);
                      const cy = axY - 7 - sIdx * 8;
                      return PAPERS[k].note ? (
                        <circle
                          key={k}
                          cx={cx}
                          cy={cy}
                          r={on ? 3.6 : 2.4}
                          className="fill-accent"
                        />
                      ) : (
                        <circle
                          key={k}
                          cx={cx}
                          cy={cy}
                          r={on ? 3.6 : 2.4}
                          className={`fill-ground ${on ? "stroke-accent" : "stroke-muted"}`}
                          strokeWidth={1.1}
                        />
                      );
                    })}
                    {nodeOn && PAPERS[nodeOn] ? (
                      <text
                        x={yearX(PAPERS[nodeOn].year)}
                        y={axY - 30}
                        textAnchor="middle"
                        className="fill-accent font-mono"
                        fontSize="10.5"
                      >
                        {PAPERS[nodeOn].year}
                      </text>
                    ) : null}
                  </g>
                </g>
              ) : null}
            </svg>

            {/* Graph labels and hit targets */}
            {labelA > 0.02
              ? GRAPH.nodes.map((n) => {
                  const [x, y] = P[n.id];
                  let side = tall ? "r" : C_SIDE[n.id];
                  if (side === "r" && x > w - (tall ? 96 : 170)) side = "l";
                  if (side === "l" && x < (tall ? 96 : 170)) side = "r";
                  const label = tall
                    ? n.kind === "note"
                      ? cNoteShort(n.label)
                      : `${cSurname(n.id)} ${PAPERS[n.id].year}`
                    : n.label;
                  const on = nodeOn === n.id;
                  const live = labelA > 0.5;
                  const tone = on
                    ? "text-accent"
                    : n.kind === "note"
                      ? "text-ink"
                      : n.kind === "literature"
                        ? "text-ink/85"
                        : "text-muted";
                  const face =
                    n.kind === "note"
                      ? `font-body font-semibold ${tall ? "text-[12px]" : "text-[13.5px]"}`
                      : `font-mono ${tall ? "text-[10.5px]" : "text-[11.5px]"}`;
                  const kindText =
                    n.kind === "note"
                      ? "your note"
                      : n.kind === "literature"
                        ? "literature note"
                        : "Cited Work Node, no literature note yet";
                  const d = (C_REV.node[n.id] || 0) + 160;
                  return (
                    <div
                      key={n.id}
                      className="absolute"
                      style={{
                        left: x,
                        top: y,
                        opacity: labelA,
                        zIndex: on ? 8 : 4,
                        pointerEvents: live ? "auto" : "none",
                      }}
                    >
                      <button
                        type="button"
                        data-c-node=""
                        tabIndex={live ? 0 : -1}
                        aria-label={`${n.label}${n.sub ? `, ${n.sub}` : ""}, ${kindText}`}
                        aria-describedby={
                          on && PAPERS[n.id] ? `c-pop-${uid}` : undefined
                        }
                        className={`absolute flex items-center ${C_SIDECLS[side]} rounded-sm`}
                        style={{ transform: C_SIDETF[side] }}
                        onMouseEnter={() => hover(n.id, true)}
                        onMouseLeave={() => hover(n.id, false)}
                        onFocus={() => hover(n.id, true)}
                        onBlur={(ev) => {
                          if (
                            ev.relatedTarget &&
                            ev.relatedTarget.closest &&
                            ev.relatedTarget.closest("[data-c-pop]")
                          )
                            return;
                          hover(n.id, false);
                        }}
                        onClick={() => hover(n.id, true)}
                      >
                        <span className="block size-7 shrink-0" />
                        <span
                          className={`leading-none whitespace-nowrap ${face} ${tone} ${reveal ? "c-a-in" : ""}`}
                          style={{ "--d": `${d}ms` }}
                        >
                          {label}
                        </span>
                      </button>
                    </div>
                  );
                })
              : null}

            {/* In the map: name the notes and papers a focused feature acts on */}
            {labelA < 0.5 && focusF
              ? acts.map((id) => {
                  const [x, y] = P[id];
                  const n = GRAPH.nodes.find((g) => g.id === id);
                  const label =
                    n.kind === "note"
                      ? cNoteShort(n.label)
                      : `${cSurname(id)} ${PAPERS[id].year}`;
                  return (
                    <span
                      key={id}
                      className="bg-ground/80 text-accent pointer-events-none absolute z-[5] px-1 font-mono text-[10px] leading-[14px] whitespace-nowrap"
                      style={{ left: x + 7, top: y - 7 }}
                    >
                      {label}
                    </span>
                  );
                })
              : null}
            {labelA < 0.6 ? (
              <span
                className="pointer-events-none absolute z-[2] -translate-x-1/2 font-mono text-[9.5px] tracking-[0.18em] whitespace-nowrap text-muted uppercase"
                style={{
                  left: cam.x,
                  top: cam.y + cam.s * 100 + 8,
                  opacity: 1 - labelA,
                }}
              >
                Your vault
              </span>
            ) : null}

            {/* Feature nodes */}
            {C_ORDER.map((id) => {
              const f = C_F[id];
              const a = featA(C_TIER_ORDER.indexOf(f.tier));
              if (a <= 0.01) return null;
              const [x, y] = Fp[id];
              const ang = (C_META[id].a * Math.PI) / 180;
              const cs = Math.cos(ang);
              const side =
                cs > 0.34
                  ? "r"
                  : cs < -0.34
                    ? "l"
                    : Math.sin(ang) < 0
                      ? "t"
                      : "b";
              const on = focusF === id;
              const live = a > 0.6;
              return (
                <div
                  key={id}
                  className="absolute"
                  style={{
                    left: x,
                    top: y,
                    opacity: a,
                    zIndex: on ? 9 : 6,
                    pointerEvents: live ? "auto" : "none",
                  }}
                >
                  <button
                    type="button"
                    data-c-feature={id}
                    tabIndex={live ? 0 : -1}
                    aria-label={`${f.name}, ${cSince(f)}. Open the demo`}
                    className={`group absolute flex items-center ${C_SIDECLS[side]} rounded-sm`}
                    style={{ transform: C_SIDETF[side] }}
                    onMouseEnter={() => setHot(id)}
                    onMouseLeave={() => setHot(null)}
                    onFocus={() => setHot(id)}
                    onBlur={() => setHot(null)}
                    onClick={() => onSelect(id)}
                  >
                    <span className="grid size-7 shrink-0 place-items-center">
                      <span
                        className={`block size-[9px] rotate-45 border transition-colors ${on ? "border-accent bg-accent" : "border-ink bg-ground group-hover:border-accent"}`}
                      />
                    </span>
                    <span
                      className={`flex items-baseline gap-1.5 whitespace-nowrap ${side === "l" ? "flex-row-reverse" : ""}`}
                    >
                      <span
                        className={`${tall ? "font-mono text-[10.5px]" : "font-body text-[14px] font-medium"} ${on ? "text-accent" : "text-ink"} transition-colors`}
                      >
                        {tall ? C_META[id].short : f.name}
                      </span>
                      <span
                        className={`font-mono text-[10px] ${f.since === "2.2" ? "text-accent" : "text-muted"}`}
                      >
                        {f.since}
                      </span>
                    </span>
                  </button>
                </div>
              );
            })}

            {pop}
          </>
        );
      }

      // ---------- Chrome ----------
      function C_Header({ mobile = false }) {
        const link = "px-3 py-2 text-muted hover:text-ink transition-colors";
        const gh = (
          <a
            href={FACTS.github}
            className="border-line text-ink hover:border-accent flex items-center gap-1.5 border px-3 py-1.5 transition-colors"
          >
            <C_I n="Star" size={12} /> GitHub{" "}
            <span className="c-tnum text-accent">
              {FACTS.stars.toLocaleString("en-US")}
            </span>
          </a>
        );
        if (mobile)
          return (

      // Bibliography in three styles. APA comes from the shared Bib; Chicago and IEEE are built here.
      function cLF(full) {
        const parts = full.split(" ");
        const last = parts.pop();
        return [last, parts.join(" ")];
      }
      function cInitials(first) {
        return first
          .split(" ")
          .map((w) =>
            w.endsWith(".")
              ? w
              : w
                  .split("-")
                  .map((x) => x[0] + ".")
                  .join("-"),
          )
          .join(" ");
      }
      function cJoin(list) {
        if (list.length <= 1) return list.join("");
        if (list.length === 2) return `${list[0]} and ${list[1]}`;
        return `${list.slice(0, -1).join(", ")}, and ${list[list.length - 1]}`;
      }
      function cBibParts(k, style, n) {
        const p = PAPERS[k];
        const more = p.apaAuthors.includes("…");
        if (style === "chicago") {
          const names = p.creators.map((c, i) =>
            i === 0 ? `${cLF(c)[0]}, ${cLF(c)[1]}` : c,
          );
          const who = more ? `${names.join(", ")}, et al.` : cJoin(names);
          const head = `${who}. ${p.year}. `;
          if (p.type === "book")
            return [head, { i: p.title }, `. ${p.publisher}.`];
          if (p.type === "preprint")
            return [
              head,
              `“${p.title}.” `,
              { i: p.container },
              `. https://doi.org/${p.doi}.`,
            ];
          if (p.type === "conferencePaper")
            return [
              head,
              `“${p.title}.” In `,
              { i: p.container },
              `, ${p.pages}.`,
            ];
          return [
            head,
            `“${p.title}.” `,
            { i: p.container },
            ` ${p.volume} (${p.issue}): ${p.pages}.`,
          ];
        }
        const ini = p.creators.map(
          (c) => `${cInitials(cLF(c)[1])} ${cLF(c)[0]}`,
        );
        const who = more || ini.length > 6 ? `${ini[0]} et al.` : cJoin(ini);
        const head = `[${n}] ${who}, `;
        if (p.type === "book")
          return [head, { i: p.titleSentence }, `. ${p.publisher}, ${p.year}.`];
        if (p.type === "preprint")
          return [
            head,
            `“${p.titleSentence},” `,
            { i: p.container },
            `, ${p.year}, doi: ${p.doi}.`,
          ];
        if (p.type === "conferencePaper")
          return [
            head,
            `“${p.titleSentence},” in `,
            { i: p.container },
            `, ${p.year}, pp. ${p.pages}.`,
          ];
        return [
          head,
          `“${p.titleSentence},” `,
          { i: p.container },
          `, vol. ${p.volume}, no. ${p.issue}, pp. ${p.pages}, ${p.year}.`,
        ];
      }
      function C_BibEntry({ k, style, n }) {
        if (style === "apa") return <Bib k={k} />;
        return (
          <span>
            {cBibParts(k, style, n).map((x, i) =>

                <Fragment key={i}>{x}</Fragment>
              ) : (

      function cBibString(k, style, n) {
        if (style === "apa") return bibText(k);
        return cBibParts(k, style, n)
          .map((x) => (typeof x === "string" ? x : x.i))
          .join("");
      }

      function C_DemoGraph() {
        const [f, setF] = useState({ pandoc: true, wiki: true, labels: true });
        const [hotN, setHotN] = useState(null);
        const kindOf = (ed) =>
          ed.kind === "link" ? "link" : ed.from === "rg6" ? "wiki" : "pandoc";
        const edges = GRAPH.edges.filter((ed) => {
          const k = kindOf(ed);
          return k === "link" || (k === "pandoc" ? f.pandoc : f.wiki);
        });
        const visible = new Set(
          GRAPH.nodes
            .filter(
              (n) => n.kind !== "cited" || edges.some((ed) => ed.to === n.id),
            )
            .map((n) => n.id),
        );
        return (
          <div className="grid gap-3 lg:grid-cols-[1fr_210px]">
            <C_Window
              title="Graph view"
              right={`${visible.size} nodes · ${edges.length} edges`}
            >
              <div className="overflow-x-auto">
                <svg
                  viewBox="-200 -118 400 228"
                  className="block h-auto w-full min-w-[520px]"
                  role="img"
                  aria-label="Graph view with citation edges"
                >
                  {edges.map((ed) => {
                    const [x1, y1] = C_POS[ed.from];
                    const [x2, y2] = C_POS[ed.to];
                    const k = kindOf(ed);
                    const lit = hotN && (ed.from === hotN || ed.to === hotN);
                    return (
                      <line
                        key={ed.from + ed.to}
                        x1={x1}
                        y1={y1}
                        x2={x2}
                        y2={y2}
                        pathLength={k === "link" ? undefined : 1}
                        className={`${lit ? "stroke-accent" : k === "link" ? "stroke-accent2" : "stroke-ink"} ${k === "link" ? "" : "c-a-draw"}`}
                        strokeOpacity={lit ? 0.95 : k === "link" ? 0.5 : 0.3}
                        strokeWidth={lit ? 1.2 : 0.8}
                        strokeDasharray={k === "link" ? "3 3" : undefined}
                      />
                    );
                  })}
                  {GRAPH.nodes
                    .filter((n) => visible.has(n.id))
                    .map((n) => {
                      const [x, y] = C_POS[n.id];
                      const label =
                        n.kind === "note"
                          ? cNoteShort(n.label)
                          : f.labels
                            ? n.label
                            : `@${n.id}`;
                      return (
                        <g
                          key={n.id}
                          className="c-a-in cursor-default"
                          onMouseEnter={() => setHotN(n.id)}
                          onMouseLeave={() => setHotN(null)}
                        >
                          {n.kind === "note" ? (
                            <circle
                              cx={x}
                              cy={y}
                              r={4.6}
                              className="fill-accent2"
                            />
                          ) : n.kind === "literature" ? (
                            <circle
                              cx={x}
                              cy={y}
                              r={3.8}
                              className="fill-accent"
                            />
                          ) : (
                            <circle
                              cx={x}
                              cy={y}
                              r={3.2}
                              className="fill-ground stroke-muted"
                              strokeWidth={1}
                              strokeOpacity={0.8}
                            />
                          )}
                          <text
                            x={x}
                            y={y + 11}
                            textAnchor="middle"
                            fontSize={n.kind === "note" ? 7.2 : 6.4}
                            className={`${n.kind === "note" ? "fill-ink font-body" : n.kind === "literature" ? "fill-ink font-mono" : "fill-muted font-mono"}`}
                            opacity={n.kind === "cited" ? 0.75 : 0.9}
                          >
                            {label}
                          </text>
                        </g>
                      );
                    })}
                </svg>
              </div>
              <div className="border-line border-t px-3 py-2">
                <C_Legend className="text-[10.5px]" />
              </div>
            </C_Window>
            <C_Window title="Filters">
              <div className="divide-line divide-y px-3">
                <C_Switch
                  on={f.pandoc}
                  onChange={(v) => setF({ ...f, pandoc: v })}
                  label="Pandoc citations"
                  hint="[@vaswani2017]"
                />
                <C_Switch
                  on={f.wiki}

                  hint="[[@vaswani2017]]"
                />
                <C_Switch

              <p className="border-line border-t px-3 py-2 text-[12px] leading-snug text-muted">
                The reading group note cites with wikilinks. Turn them off and

            </C_Window>

      // ---------- Demo: profiles and the Template Workbench ----------
      const C_WB = (() => {
        const doc = PROFILE_DOC;
        const i = doc.indexOf("\n---\n\n");
        const front = doc.slice(0, i + 4);
        const rest = doc.slice(i + 6);
        const [body, annot] = rest.split("\n\n--- zotlit:annotation ---\n");
        const lines = front.split("\n");
        const fmStart = lines.findIndex((l) => l.startsWith("frontmatter:"));
        return {
          body,
          annot,
          props: lines.slice(fmStart, -1).join("\n"),
          profile: lines
            .filter((l) => /^(id|name|version|contract):/.test(l))
            .join("\n"),
          filename: lines.find((l) => l.startsWith("filename:")),
          insertAt: body.indexOf("\n\n> [!abstract]"),
        };
      })();
      const C_WB_ADD = "\nPublished in {{ zt.publicationTitle }}";
      const C_WB_VALUES = {
        ...Object.fromEntries(TEMPLATE_FIELDS.map((f) => [f.path, f.value])),
        "zt.abstract": PAPERS.vaswani2017.abstract,
      };
      function cRenderTpl(src) {
        const problems = [];
        const out = src.replace(/\{\{([^}]*)\}\}/g, (m, expr) => {
          const [path, ...filters] = expr.split("|").map((s) => s.trim());
          if (
            path === "zt.creators" &&
            filters.some((f) => f.startsWith("join"))
          )
            return PAPERS.vaswani2017.creators.join(", ");
          if (Object.prototype.hasOwnProperty.call(C_WB_VALUES, path))
            return C_WB_VALUES[path];
          problems.push(path || "empty expression");
          return `[${path}?]`;
        });
        return { out, problems };
      }
      function C_Md({ text }) {
        const lines = text.split("\n");
        const out = [];
        let i = 0;
        while (i < lines.length) {
          const l = lines[i];
          if (l.startsWith("# "))
            out.push(
              <p
                key={i}
                className="font-display text-ink text-[17px] leading-tight font-bold"
              >
                {l.slice(2)}
              </p>,
            );
          else if (/^> \[!(\w+)\]/.test(l)) {
            const kind = l.match(/^> \[!(\w+)\]/)[1];
            const body = [];
            i += 1;
            while (i < lines.length && lines[i].startsWith(">")) {
              body.push(lines[i].replace(/^>\s?/, ""));
              i += 1;
            }
            out.push(
              <div
                key={i}

      function C_Json({ text }) {
        const re = /("(?:[^"\\]|\\.)*")(\s*:)?|\b(true|false|null|\d+)\b/g;
        const out = [];
        let last = 0;
        let m;
        let i = 0;
        while ((m = re.exec(text))) {
          if (m.index > last)
            out.push(
              <span key={i++} className="text-muted">
                {text.slice(last, m.index)}
              </span>,
            );
          if (m[1]) {
            out.push(
              <span key={i++} className={m[2] ? "text-accent2" : "text-ink"}>
                {m[1]}
              </span>,
            );
            if (m[2])
              out.push(
                <span key={i++} className="text-muted">
                  {m[2]}
                </span>,
              );
          } else
            out.push(
              <span key={i++} className="text-accent">
                {m[3]}
              </span>,
            );
          last = re.lastIndex;
        }
        if (last < text.length)
          out.push(
            <span key={i++} className="text-muted">
              {text.slice(last)}
            </span>,
          );
        return out;
      }

          if (el) el.focus({ preventScroll: true });
        }, []);
        useEffect(() => {
          const onKey = (ev) => {
            if (ev.key === "Escape" && !ev.defaultPrevented) {
              ev.preventDefault();
              onClose();
            }
            if (ev.key === "Tab" && panel.current) {
              const els = [
                ...panel.current.querySelectorAll(
                  "a[href],button:not([disabled]),textarea,[tabindex='0']",
                ),
              ].filter((x) => x.offsetParent !== null);
              if (!els.length) return;
              const first = els[0];
              const last = els[els.length - 1];
              if (!panel.current.contains(document.activeElement)) {
                ev.preventDefault();
                first.focus();
              } else if (ev.shiftKey && document.activeElement === first) {
                ev.preventDefault();
                last.focus();
              } else if (!ev.shiftKey && document.activeElement === last) {
                ev.preventDefault();
                first.focus();
              }
            }
          };
          document.addEventListener("keydown", onKey);
          const prev = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          return () => {
            document.removeEventListener("keydown", onKey);
            document.body.style.overflow = prev;
          };
        }, [onClose]);

            const body = panel.current.querySelector("[data-c-body]");

          if (r.right > max) dx = max - r.right;

      // Text that decodes from its old value to its new one, left to right.
      const D_GLYPHS = "@[]#_=:/{}<>~";
      function D_Scramble({ text }) {
        const { motion } = useProtoState();
        const [shown, setShown] = useState(text);
        const prev = useRef(text);
        useEffect(() => {
          const from = prev.current;
          prev.current = text;
          if (!motion || from === text) {
            setShown(text);
            return;
          }
          const L = Math.max(from.length, text.length);
          const dur = 600;
          const t0 = performance.now();
          let raf = 0;
          const tick = (now) => {
            const p = Math.min(1, (now - t0) / dur);
            const len = Math.round(
              from.length + (text.length - from.length) * p,
            );
            let s = "";
            for (let i = 0; i < len; i++) {
              const at = (i / L) * 0.7;
              if (p >= at + 0.3) s += text[i] ?? "";
              else if (p >= at)
                s += D_GLYPHS[(i * 5 + Math.floor(now / 45)) % D_GLYPHS.length];
              else s += from[i] ?? D_GLYPHS[i % D_GLYPHS.length];
            }
            setShown(s);
            if (p < 1) raf = requestAnimationFrame(tick);
            else setShown(text);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
        }, [text, motion]);
        return <span>{shown}</span>;
      }

            <div className={"min-h-0 flex-1 " + bodyClass}>{children}</div>
          </div>
        );
      }

      // Tiny lexers for the Source faces. Group names pick the colour token.
      const D_LEX = {
        yaml: /(?<c>(?:^|(?<=\s))#.*$)|(?<s>"(?:[^"\\]|\\.)*"|'[^']*')|(?<k>[A-Za-z_$][\w.$-]*(?=:(?:\s|$)))|(?<m>^\s*-(?=\s)|^---$)|(?<n>\b(?:true|false|null)\b|(?<![\w.:/-])\d[\d.]*\b)|(?<p>[{}[\],:|])/g,
        json: /(?<c>^\s*\/\/.*$)|(?<k>"(?:[^"\\]|\\.)*"(?=\s*:))|(?<s>"(?:[^"\\]|\\.)*")|(?<n>-?\b\d+(?:\.\d+)?\b|\b(?:true|false|null)\b)|(?<p>[{}[\],:])/g,
        md: /(?<m>^#{1,6} |^---$|^> ?(?:\[![\w-]+\])?|^\s*- )|(?<c>%%.*?%%)|(?<cite>\[-?@[^\]]+\])|(?<w>\[\[[^\]]+\]\])|(?<lq>\{\{.*?\}\}|\{%.*?%\})|(?<t>(?<![\w&])#[A-Za-z][\w/.-]*)/g,
        sh: /(?<m>^\$ |^> )|(?<c>(?:^|(?<=\s))#.*$)|(?<s>'[^']*'|"[^"]*")|(?<k>zotlit:[\w-]+|--[\w-]+)|(?<n>(?<=\s)[\w.]+(?==))|(?<p>\\$)/g,
      };
      const D_TC = {
        c: "text-muted italic",
        s: "text-cite",
        k: "text-accent2",
        n: "text-z-orange",
        p: "text-muted",
        m: "text-accent",
        cite: "text-cite",
        w: "text-accent2",
        t: "text-accent2",
      };

      function dLiquid(s) {
        const parts = [];
        const re =
          /(\{\{-?|-?\}\}|\{%-?|-?%\})|(zt\.[\w.]+)|("[^"]*")|(\|)|([A-Za-z_]+)/g;
        let last = 0;
        let i = 0;
        let m;
        while ((m = re.exec(s))) {
          if (m.index > last) parts.push(s.slice(last, m.index));
          const cls = m[1]
            ? "text-accent"
            : m[2]
              ? "text-accent2"
              : m[3]
                ? "text-cite"
                : m[4]
                  ? "text-muted"
                  : "text-z-purple";
          parts.push(
            <span key={i++} className={cls}>
              {m[0]}
            </span>,
          );
          last = m.index + m[0].length;
        }
        if (last < s.length) parts.push(s.slice(last));
        return parts;
      }

      function dRender(line, lang) {
        const re = D_LEX[lang];
        if (!re) return line;
        const out = [];
        let last = 0;
        let i = 0;
        for (const m of line.matchAll(re)) {
          if (m.index > last) out.push(line.slice(last, m.index));
          const g = Object.keys(m.groups).find(
            (key) => m.groups[key] !== undefined,
          );
          if (g === "lq")
            out.push(<Fragment key={i++}>{dLiquid(m[0])}</Fragment>);
          else
            out.push(
              <span key={i++} className={D_TC[g]}>
                {m[0]}
              </span>,
            );
          last = m.index + m[0].length;
        }
        if (last < line.length) out.push(line.slice(last));
        if (lang === "md" && /^#{1,6} /.test(line))
          return <span className="text-ink font-semibold">{out}</span>;
        return out;
      }

      // A code view with line numbers. lang "profile" switches YAML frontmatter and Liquid body.
      function D_Code({
        text,
        lines: given,
        lang = "yaml",
        from = 1,
        hl = [],
        flash = [],
        flashKey = "",
        nums = true,
        wrap = false,
        className = "",
        size = "text-[12px] md:text-[13px]",
      }) {
        const lines = given || text.split("\n");
        const langs = [];
        let inFm = false;
        lines.forEach((ln, i) => {
          if (lang !== "profile") {
            langs.push(lang);
            return;
          }
          if (i === 0 && ln === "---") {
            inFm = true;
            langs.push("yaml");
          } else if (inFm && ln === "---") {
            inFm = false;
            langs.push("yaml");
          } else
            langs.push(
              inFm ? "yaml" : ln.startsWith("--- zotlit:") ? "zl" : "md",
            );
        });
        return (
          <div className={(wrap ? "" : "overflow-x-auto ") + className}>
            <div
              className={
                (wrap ? "w-full" : "w-max min-w-full") +
                " py-3 font-mono leading-[1.75] " +
                size
              }
            >
              {lines.map((ln, i) => (
                <div
                  key={i + (flash.includes(i) ? "-" + flashKey : "")}
                  className={
                    "flex pr-4 " +
                    (nums ? "" : "pl-4 ") +
                    (hl.includes(i) ? "bg-accent2/15 " : "") +
                    (flash.includes(i) ? "d-flash" : "")

                    <span className="w-9 shrink-0 pr-3 text-right text-muted/55 tabular-nums select-none md:w-11 md:pr-4">
                      {from + i}
                    </span>
                  ) : null}
                  <span
                    className={
                      wrap
                        ? "min-w-0 [overflow-wrap:anywhere] whitespace-pre-wrap"
                        : "whitespace-pre"
                    }
                  >
                    {langs[i] === "zl" ? (
                      <span className="text-accent">{ln}</span>
                    ) : (
                      dRender(ln, langs[i])
                    )}
                    {ln === "" ? " " : null}
                  </span>
                </div>
              ))}
            </div>
          </div>
        );
      }

      const D_CSS = `

      @keyframes d-scan-up { from { transform: translateY(100vh); } to { transform: translateY(0); } }
