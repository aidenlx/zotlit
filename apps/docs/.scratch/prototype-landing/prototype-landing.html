      function VariantD() {
        const { motion } = useProtoState();
        const [mode, setMode] = useState("live");
        const [flip, setFlip] = useState(null);
        const [hint, setHint] = useState(null);
        const [pulse, setPulse] = useState(true);
        const modeRef = useRef("live");
        const motionRef = useRef(motion);
        motionRef.current = motion;
        const resolveRef = useRef(null);
        const userRef = useRef(false);
        const autoRef = useRef(false);
        const keyLabel = /Mac|iPhone|iPad/.test(
          navigator.platform || navigator.userAgent || "",
        )
          ? "⌘ E"
          : "Ctrl E";

        // One flip: a View Transition wipes the new mode over the old one (down to Source, up
        // to Live Preview). Without motion, or without View Transitions, the mode just changes.
        const flipTo = useCallback((next, fromUser) => {
          if (fromUser) {
            userRef.current = true;
            setPulse(false);
            setHint(null);
          }
          if (next === modeRef.current) return;
          modeRef.current = next;
          if (
            !motionRef.current ||
            typeof document.startViewTransition !== "function"
          ) {
            setMode(next);
            return;
          }
          const id = Math.random();
          const dir = next === "source" ? "down" : "up";
          try {
            const vt = document.startViewTransition(
              () =>
                new Promise((resolve) => {
                  resolveRef.current = resolve;
                  setFlip({ dir, id });
                  setMode(next);
                  setTimeout(() => {
                    if (resolveRef.current === resolve) {
                      resolveRef.current = null;
                      resolve();
                    }
                  }, 400);
                }),
            );
            // A flip that starts during another one skips it; that is expected, not an error.
            [vt.ready, vt.finished, vt.updateCallbackDone].forEach(
              (p) => p && p.catch(() => {}),
            );
          } catch (e) {
            setMode(next);
          }
          setTimeout(() => setFlip((f) => (f && f.id === id ? null : f)), 980);
        }, []);

        useLayoutEffect(() => {
          if (resolveRef.current) {
            const r = resolveRef.current;
            resolveRef.current = null;
            r();
          }
        }, [mode, flip]);

        // Ctrl+E / Cmd+E, the shortcut Obsidian uses for the same switch.
        useEffect(() => {
          const onKey = (e) => {
            if (
              (e.ctrlKey || e.metaKey) &&
              !e.altKey &&
              !e.shiftKey &&
              e.key.toLowerCase() === "e"
            ) {
              e.preventDefault();
              flipTo(modeRef.current === "live" ? "source" : "live", true);
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [flipTo]);

        // First visit: one flip to Source and back, then the switch belongs to the reader.
        useEffect(() => {
          if (!motion) {
            setPulse(false);
            return;
          }
          if (autoRef.current) return;
          autoRef.current = true;
          const ts = [
            setTimeout(() => {
              if (userRef.current) return;
              flipTo("source");
              setHint("source");
            }, 1800),
            setTimeout(() => {
              if (userRef.current) return;
              flipTo("live");
              setHint("back");
            }, 1800 + 3200),
            setTimeout(
              () => {
                setHint(null);
                setPulse(false);
              },
              1800 + 3200 + 3200,
            ),
          ];
          return () => ts.forEach(clearTimeout);
        }, [motion, flipTo]);

        const ctx = useMemo(
          () => ({ mode, global: mode, flipTo, keyLabel, hint, pulse }),
          [mode, flipTo, keyLabel, hint, pulse],
        );

        return (
          <D_Ctx.Provider value={ctx}>
            <div
              data-v="D"
              data-mode={mode}
              data-flip={flip ? flip.dir : undefined}
              data-motion={motion ? "on" : "off"}
              className="bg-ground font-body text-ink min-h-screen pb-24"
            >
              <style>{D_CSS}</style>
              {flip ? (
                <div
                  key={flip.id}
                  aria-hidden="true"
                  className="d-scan"
                  data-dir={flip.dir}
                />
              ) : null}
              <D_TopBar />
              <D_MobileNav />
              <main>
                <D_Hero />
                {D_TIER_ORDER.map((t) => (
                  <Fragment key={t}>
                    <D_Tier t={t} />
                    {D_SECTIONS.filter((s) => s.tier === t).map((s) => {
                      const Demo = D_DEMOS[s.id];
                      return (
                        <D_Section key={s.id} s={s}>
                          <Demo />
                        </D_Section>
                      );
                    })}
                  </Fragment>
                ))}
                <D_Install />
              </main>
              <D_Footer />
            </div>
          </D_Ctx.Provider>
        );
      }
      // --- Variant D END ---

      // --- Variant E ---
      // Variant E: "The page is a paper". The landing page is typeset as a preprint about ZotLit,
      // and its apparatus (citations, figures, cross-references, reference list) are live ZotLit
      // features. Every top-level name carries the E_ / e prefix.

      const E_DATE = "29 October 2026";
      const E_STAMP = "ZotLit 2.2 · preprint · 29 Oct 2026";
      // Order of first citation in the body text: the IEEE numbers.
      const E_ORDER = [
        "star1989",
        "latour1987",
        "haraway1988",
        "bommasani2021",
        "vaswani2017",
        "bender2021",
        "suchman1987",
        "bowker1999",
        "shannon1948",
      ];
      const E_ORDER_ALL = [
        ...E_ORDER,
        ...PAPER_KEYS.filter((k) => !E_ORDER.includes(k)),
      ];
      const E_FEAT = Object.fromEntries(FEATURES.map((f) => [f.id, f]));
      const E_TYPE = {
        journalArticle: "Journal article",
        conferencePaper: "Conference paper",
        book: "Book",
        preprint: "Preprint",
      };
      const E_TYPE_ICON = {
        journalArticle: "FileText",
        conferencePaper: "Presentation",
        book: "BookOpen",
        preprint: "FileClock",
      };
      const E_LINKS = [
        { name: "Docs", href: FACTS.docs },
        { name: "Changelog", href: `${SITE}/changelog` },
        { name: "Community", href: `${SITE}/community` },
      ];
      const E_REQ = `Requires ${FACTS.obsidian} and ${FACTS.zotero}.`;
      const E_Ctx = React.createContext(null);
      function eCtx() {
        return React.useContext(E_Ctx);
      }
      // The page build indents the shared template literals; strip that before display.
      function eDedent(s) {
        const L = s.split("\n");
        const rest = L.slice(1).filter((l) => l.trim());
        const pad = rest.length
          ? Math.min(...rest.map((l) => l.match(/^ */)[0].length))
          : 0;
        return [
          L[0],
          ...L.slice(1).map((l) =>
            l.slice(Math.min(pad, l.match(/^ */)[0].length)),
          ),
        ].join("\n");
      }
      const E_PROFILE = eDedent(PROFILE_DOC);
      const E_ZQ = eDedent(ZOTQUERY_FILE);

      // ---------- Icons (a missing name renders nothing instead of breaking the page) ----------
      function E_I({ n, size = 14, className = "", ...rest }) {
        const C = Icons[n];
        if (!C) return null;
        return (
          <C size={size} className={className} aria-hidden="true" {...rest} />
        );
      }

      function eUseDark() {
        const q = "(prefers-color-scheme: dark)";
        const [d, setD] = useState(() => window.matchMedia(q).matches);
        useEffect(() => {
          const m = window.matchMedia(q);
          const f = () => setD(m.matches);
          m.addEventListener("change", f);
          return () => m.removeEventListener("change", f);
        }, []);
        return d;
      }

      // ---------- Citation formatting (APA via the shared Bib; Chicago and IEEE here) ----------
      function eSplit(full) {
        const parts = full.split(" ");
        let i = parts.length - 1;
        for (let j = 1; j < parts.length - 1; j++) {
          if (/^[a-z]/.test(parts[j])) {
            i = j;
            break;
          }
        }
        return { given: parts.slice(0, i), family: parts.slice(i).join(" ") };
      }
      function eInitials(given) {
        return given
          .map((g) =>
            g
              .split("-")
              .map((s) => s.replace(/\.$/, "")[0] + ".")
              .join("-"),
          )
          .join(" ");
      }
      function eTrunc(p) {
        return p.apaAuthors.includes("…");
      }
      function eDot(s) {
        return /[.?!]$/.test(s) ? s : s + ".";
      }
      function eJoin(names) {
        if (names.length === 1) return names[0];
        if (names.length === 2) return `${names[0]} and ${names[1]}`;
        return `${names.slice(0, -1).join(", ")}, and ${names[names.length - 1]}`;
      }
      function eChiAuthors(p) {
        const fmt = (n, i) => {
          const { given, family } = eSplit(n);
          return i === 0
            ? `${family}, ${given.join(" ")}`
            : `${given.join(" ")} ${family}`;
        };
        const names = p.creators.map(fmt);
        if (eTrunc(p)) return `${names.join(", ")}, et al.`;
        return names.length === 2
          ? `${names[0]}, and ${names[1]}`
          : eJoin(names);
      }
      function eIeeeAuthors(p) {
        const fmt = (n) => {
          const { given, family } = eSplit(n);
          return `${eInitials(given)} ${family}`;
        };
        if (eTrunc(p) || p.creators.length > 6)
          return `${fmt(p.creators[0])} et al.`;
        return eJoin(p.creators.map(fmt));
      }
      function eNum(k) {
        return E_ORDER_ALL.indexOf(k) + 1;
      }
      function eParen(k, style, loc = null) {
        if (style === "ieee") return `[${eNum(k)}${loc ? ", " + loc : ""}]`;
        return inText(k, { style, locator: loc, order: E_ORDER_ALL });
      }
      function eNarr(k, style, loc = null) {
        const p = PAPERS[k];
        const who = p.inText.replace(" & ", " and ");
        if (style === "ieee")
          return `${who} [${eNum(k)}${loc ? ", " + loc : ""}]`;
        if (style === "chicago")
          return `${who} (${p.year}${loc ? ", " + loc.replace(/^pp?\. /, "") : ""})`;
        return `${who} (${p.year}${loc ? ", " + loc : ""})`;
      }
      function ePart(k, style) {
        const p = PAPERS[k];
        return style === "chicago"
          ? `${p.inText.replace(" & ", " and ")} ${p.year}`
          : `${p.inText}, ${p.year}`;
      }
      function eFamily(k) {
        return eSplit(PAPERS[k].creators[0]).family;
      }
      function eSortAlpha(keys) {
        return [...keys].sort(
          (a, b) =>
            eFamily(a).localeCompare(eFamily(b)) ||
            PAPERS[a].year - PAPERS[b].year,
        );
      }
      function eSortStyle(keys, style) {
        return style === "ieee"
          ? [...keys].sort((a, b) => eNum(a) - eNum(b))
          : eSortAlpha(keys);
      }
      function eRefKeys(style) {
        return eSortStyle(E_ORDER, style);
      }
      function eSegs(k, style) {
        const p = PAPERS[k];
        const S = (t, i = false) => ({ t, i });
        if (style === "apa") {
          // The shared Bib, with the period dropped after a title that ends in "?".
          const head = S(`${p.apaAuthors} (${p.year}). `);
          const ts = p.titleSentence;
          const end = /[?!]$/.test(ts) ? "" : ".";
          if (p.type === "book")
            return [head, S(ts, true), S(`${end} ${p.publisher}.`)];
          if (p.type === "preprint")
            return [
              head,
              S(ts, true),
              S(`${end} ${p.container}. https://doi.org/${p.doi}`),
            ];
          if (p.type === "conferencePaper")
            return [
              head,
              S(`${ts}${end} In `),
              S(p.container, true),
              S(` (pp. ${p.pages}).`),
            ];
          return [
            head,
            S(`${ts}${end} `),
            S(`${p.container}, ${p.volume}`, true),
            S(`(${p.issue}), ${p.pages}.`),
          ];
        }
        if (style === "chicago") {
          const head = S(`${eDot(eChiAuthors(p))} ${p.year}. `);
          const qt = `“${eDot(p.title)}” `;
          if (p.type === "book")
            return [
              head,
              S(p.title, true),
              S(`${/[?!]$/.test(p.title) ? "" : "."} ${p.publisher}.`),
            ];
          if (p.type === "journalArticle")
            return [
              head,
              S(qt),
              S(p.container, true),
              S(` ${p.volume} (${p.issue}): ${p.pages}.`),
            ];
          if (p.type === "conferencePaper")
            return [
              head,
              S(qt + "In "),
              S(p.container, true),
              S(`, ${p.pages}.`),
            ];
          return [head, S(qt), S(`${p.container}. https://doi.org/${p.doi}.`)];
        }
        const a = eIeeeAuthors(p);
        const t = p.titleSentence;
        const q = /[?!]$/.test(t) ? `“${t}” ` : `“${t},” `;
        if (p.type === "book")
          return [
            S(`${a}, `),
            S(p.title, true),
            S(`. ${p.publisher}, ${p.year}.`),
          ];
        if (p.type === "journalArticle")
          return [
            S(`${a}, ${q}`),
            S(p.container, true),
            S(`, vol. ${p.volume}, no. ${p.issue}, pp. ${p.pages}, ${p.year}.`),
          ];
        if (p.type === "conferencePaper")
          return [
            S(`${a}, ${q}in `),
            S(p.container, true),
            S(`, ${p.year}, pp. ${p.pages}.`),
          ];
        return [
          S(`${a}, ${q}`),
          S(p.container, true),
          S(`, ${p.year}, doi: ${p.doi}.`),
        ];
      }
      function E_Entry({ k, style }) {
        return (
          <span>
            {eSegs(k, style).map((s, i) =>
              s.i ? <i key={i}>{s.t}</i> : <Fragment key={i}>{s.t}</Fragment>,
            )}
          </span>
        );
      }
      function eEntryText(k, style) {
        return eSegs(k, style)
          .map((s) => s.t)
          .join("");
      }
      function eBibText(keys, style) {
        return keys
          .map(
            (k) =>
              (style === "ieee" ? `[${eNum(k)}] ` : "") + eEntryText(k, style),
          )
          .join("\n");
      }
      function eCopy(text, done) {
        try {
          navigator.clipboard.writeText(text).then(
            () => done("Copied"),
            () => done("The browser blocked copying"),
          );
        } catch {
          done("The browser blocked copying");
        }
      }

      // ---------- Live citations ----------
      // A citation links to its reference entry (hyperref), and hover or focus opens the popover.
      function E_Cite({ k, loc = null, narrative = false, part = false }) {
        const c = eCtx();
        const ref = useRef(null);
        const touch = useRef(false);
        const text = part
          ? ePart(k, c.style)
          : narrative
            ? eNarr(k, c.style, loc)
            : eParen(k, c.style, loc);
        const open = !!c.pop && c.pop.k === k && c.pop.el === ref.current;
        return (
          <a
            key={c.tick}
            ref={ref}
            href={`#e-ref-${k}`}
            className={"e-cite" + (c.tick ? " e-reflow" : "")}
            aria-haspopup="dialog"
            aria-expanded={open}
            onMouseEnter={() => c.showPop(k, loc, ref.current)}
            onMouseLeave={c.hidePop}
            onFocus={() => c.showPop(k, loc, ref.current)}
            onBlur={c.blurPop}
            onPointerDown={(e) => {
              touch.current = e.pointerType === "touch";
            }}
            onClick={(e) => {
              e.preventDefault();
              if (touch.current || !E_ORDER.includes(k))
                c.showPop(k, loc, ref.current);
              else c.jump(`e-ref-${k}`);
            }}
          >
            {text}
          </a>
        );
      }
      function E_CiteGroup({ keys }) {
        const c = eCtx();
        const ks = eSortStyle([...new Set(keys)], c.style);
        if (c.style === "ieee")
          return (
            <span>
              {ks.map((k, i) => (
                <Fragment key={k}>
                  {i ? ", " : ""}
                  <E_Cite k={k} />
                </Fragment>
              ))}
            </span>
          );
        return (
          <span className="text-cite">
            (
            {ks.map((k, i) => (
              <Fragment key={k}>
                {i ? "; " : ""}
                <E_Cite k={k} part />
              </Fragment>
            ))}
            )
          </span>
        );
      }
      // A citation drawn inside a figure (an app screenshot): green, not interactive.
      function E_StaticCite({ k, loc = null }) {
        const c = eCtx();
        return <span className="text-cite">{eParen(k, c.style, loc)}</span>;
      }

      // The Citation Popover body: the bibliography entry, then the three actions.
      function E_PopBody({ k, style, live = false }) {
        const c = eCtx();
        const p = PAPERS[k];
        const notes = citedBy(k);
        const acts = [
          {
            icon: "FileText",
            label: p.note ? "Open literature note" : "Write literature note",
          },
          { icon: "ExternalLink", label: "Open in Zotero" },
          { icon: "Paperclip", label: "Open PDF", off: !p.pdf },
        ];
        return (
          <>
            <div className="px-4 pt-3 pb-3">
              <div className="flex items-baseline justify-between gap-3 text-[13.5px] text-muted">
                <span className="e-asc">{E_TYPE[p.type]}</span>
                <span className="font-mono text-[10.5px]">@{k}</span>
              </div>
              <div className="font-body text-ink e-entry mt-1.5 text-[14.5px] leading-[1.45]">
                {style === "ieee" ? (
                  <span className="e-lnum">[{eNum(k)}] </span>
                ) : null}
                <E_Entry k={k} style={style} />
              </div>
            </div>
            <div className="border-line grid grid-cols-3 border-t">
              {acts.map((a, i) => {
                const cls =
                  "flex flex-col items-center gap-1 px-1.5 py-2 text-[11.5px] leading-tight text-center " +
                  (i ? "border-l border-line " : "") +
                  (a.off ? "text-muted/50" : "text-ink");
                const inner = (
                  <>
                    <E_I n={a.icon} size={14} />
                    {a.label}
                  </>
                );
                return live ? (
                  <button
                    key={a.label}
                    type="button"
                    disabled={a.off}
                    className={
                      cls + (a.off ? "" : " hover:bg-ink/[0.05] cursor-pointer")
                    }
                  >
                    {inner}
                  </button>
                ) : (
                  <span key={a.label} className={cls}>
                    {inner}
                  </span>
                );
              })}
            </div>
            <div className="border-line flex items-center justify-between gap-3 border-t px-4 py-2 text-[12px] text-muted">
              <span>
                Cited in {notes.length} {notes.length === 1 ? "note" : "notes"}
              </span>
              {live && E_ORDER.includes(k) ? (
                <a
                  href={`#e-ref-${k}`}
                  className="e-xref"
                  onClick={(e) => {
                    e.preventDefault();
                    c.closePop();
                    c.jump(`e-ref-${k}`);
                  }}
                >
                  In References ↓
                </a>
              ) : null}
            </div>
          </>
        );
      }
      function E_Popover({ pop, popRef }) {
        const c = eCtx();
        const p = PAPERS[pop.k];
        return (
          <div
            ref={popRef}
            role="dialog"
            aria-label={`Citation: ${p.inText}, ${p.year}`}
            className="bg-surface text-ink border-line e-in absolute z-40 rounded-[6px] border font-sans shadow-[0_14px_40px_-12px_rgba(0,0,0,0.35)]"
            style={{
              top: pop.top,
              left: pop.left,
              width: pop.w,
              translate: pop.above ? "0 -100%" : undefined,
            }}
            onMouseEnter={c.keepPop}
            onMouseLeave={c.hidePop}
            onBlur={(e) => {
              if (
                e.currentTarget.contains(e.relatedTarget) ||
                e.relatedTarget === pop.el
              )
                return;
              c.hidePop();
            }}
          >
            <E_PopBody k={pop.k} style={c.style} live />
          </div>
        );
      }

      // ---------- Paper apparatus ----------
      function E_Link({ to, children }) {
        const c = eCtx();
        return (
          <a
            href={`#${to}`}
            className="e-xref"
            onClick={(e) => {
              e.preventDefault();
              c.jump(to);
            }}
          >
            {children}
          </a>
        );
      }
      function E_Fn({ n }) {
        return (
          <sup id={`e-fnref-${n}`} className="e-lnum ml-[0.08em] text-[0.68em]">
            <E_Link to={`e-fn-${n}`}>{n}</E_Link>
          </sup>
        );
      }
      function E_Row({ children, aside, className = "" }) {
        return (
          <div className={"e-row " + className}>
            <div className="e-main min-w-0">{children}</div>
            {aside ? <aside className="min-w-0">{aside}</aside> : null}
          </div>
        );
      }
      // A margin note: in the margin on wide screens, folded into the text below that.
      function E_Note({ label, children }) {
        return (
          <div className="mt-3 mb-5 pl-5 font-sans text-[13.5px] leading-[1.5] text-muted min-[1100px]:mt-1 min-[1100px]:mb-0 min-[1100px]:pl-0 min-[1100px]:text-[13px]">
            {label ? (
              <div className="e-asc text-ink/75 mb-1 text-[14px]">{label}</div>
            ) : null}
            {children}
          </div>
        );
      }
      function E_Since({ v }) {
        const isNew = v === FACTS.version;
        return (
          <span
            className={
              "e-asc inline-flex items-center gap-1.5 font-sans text-[14px] whitespace-nowrap " +
              (isNew ? "text-ink font-semibold" : "text-muted")
            }
          >
            <span
              className={
                "inline-block h-[7px] w-[7px] " +
                (isNew ? "bg-accent" : "border border-muted")
              }
            />
            {isNew ? `New in ${v}` : `Since ${v}`}
          </span>
        );
      }
      function E_H({ id, num, level = 2, since, children }) {
        const T = level === 2 ? "h2" : "h3";
        return (
          <E_Row
            className={level === 2 ? "mt-14" : "mt-9"}
            aside={
              since ? (
                <div className="hidden pt-[0.3em] min-[1100px]:block">
                  <E_Since v={since} />
                </div>
              ) : null
            }
          >
            <T
              id={id}
              className={
                (level === 2
                  ? "text-[21px] md:text-[23px]"
                  : "text-[17.5px] md:text-[19px]") +
                " text-ink leading-tight font-semibold"
              }
            >
              {num ? <span className="e-lnum mr-[0.5em]">{num} </span> : null}
              {children}
              {since ? (
                <span className="ml-3 inline-block align-[0.12em] min-[1100px]:hidden">
                  <E_Since v={since} />
                </span>
              ) : null}
            </T>
          </E_Row>
        );
      }
      function E_Cap({ label, children, className = "" }) {
        return (
          <div
            className={
              "text-ink/85 max-w-[46rem] font-sans text-[14px] leading-[1.45] " +
              className
            }
          >
            <span className="text-ink font-semibold">{label}.</span> {children}
          </div>
        );
      }
      function E_Fig({
        id,
        label,
        caption,
        top = false,
        children,
        className = "",
      }) {
        return (
          <figure id={id} className={"e-fig my-10 " + className}>
            {top ? (
              <E_Cap label={label} className="mb-3">
                {caption}
              </E_Cap>
            ) : null}
            {children}
            {top ? null : (
              <E_Cap label={label} className="mt-3">
                {caption}
              </E_Cap>
            )}
          </figure>
        );
      }
      function E_Window({
        title,
        icon = "FileText",
        right,
        children,
        className = "",
      }) {
        return (
          <div
            className={
              "border-line bg-surface text-ink overflow-hidden rounded-[7px] border font-sans " +
              className
            }
          >
            <div className="border-line bg-ground/50 flex h-9 items-center border-b text-[12.5px]">
              <div className="border-line bg-surface flex h-full min-w-0 items-center gap-1.5 border-r px-3">
                <E_I n={icon} size={13} className="shrink-0 text-muted" />
                <span className="truncate">{title}</span>
              </div>
              {right ? (
                <div className="ml-auto pr-3 pl-2 text-[12px] whitespace-nowrap text-muted">
                  {right}
                </div>
              ) : null}
            </div>
            {children}
          </div>
        );
      }
      function E_Sub({ children }) {
        return (
          <span className="border-ink/40 text-ink/70 bg-surface inline-flex h-[1.35em] w-[1.35em] items-center justify-center rounded-full border font-sans text-[10px] font-semibold">
            {children}
          </span>
        );
      }

      function E_StyleControl({ id }) {
        const c = eCtx();
        return (
          <div className="font-sans" role="radiogroup" aria-labelledby={id}>
            <div id={id} className="e-asc text-ink/75 mb-1 text-[14px]">
              Citation style
            </div>
            <div className="flex flex-wrap gap-x-4 gap-y-0.5 min-[1100px]:flex-col">
              {CSL_STYLES.map((s) => {
                const on = c.style === s.id;
                return (
                  <button
                    key={s.id}
                    type="button"
                    role="radio"
                    aria-checked={on}
                    onClick={() => c.setStyle(s.id)}
                    className={
                      "flex cursor-pointer items-center gap-2 py-1 text-left text-[13.5px] " +
                      (on ? "text-ink" : "hover:text-ink text-muted")
                    }
                  >
                    <span
                      className={
                        "inline-flex h-3.5 w-3.5 items-center justify-center rounded-full border " +
                        (on ? "border-ink" : "border-muted")
                      }
                    >
                      {on ? (
                        <span className="bg-ink h-1.5 w-1.5 rounded-full" />
                      ) : null}
                    </span>
                    {s.name}
                  </button>
                );
              })}
            </div>
          </div>
        );
      }

      // ---------- Figure 1: citation live preview (with the References Sidebar) ----------
      const E_SUGGEST = [
        "haraway1988",
        "vaswani2017",
        "bender2021",
        "bommasani2021",
        "suchman1987",
        "star1989",
      ];
      function E_Fig1() {
        const c = eCtx();
        const ref = useRef(null);
        const bodyRef = useRef(null);
        const anchorRef = useRef(null);
        const citeRef = useRef(null);
        const inView = useInView(ref, { threshold: 0.3 });
        const step = useTimeline([1100, 2100, 1900, 1300, 4600], {
          active: inView,
        });
        const t1 = useTypewriter("[@hara", {
          cps: 7,
          delay: 250,
          active: inView && step === 1,
        });
        const t2 = useTypewriter(", p. 581]", {
          cps: 11,
          delay: 450,
          active: inView && step === 2,
        });
        const [sugPos, setSugPos] = useState(null);
        const [popPos, setPopPos] = useState(null);
        const q = t1.includes("@") ? t1.split("@")[1] : null;
        const sug =
          q === null
            ? []
            : E_SUGGEST.filter(
                (k) =>
                  k.startsWith(q) ||
                  PAPERS[k].inText.toLowerCase().startsWith(q),
              ).slice(0, 4);
        const showSug = step === 1 && q !== null;

        useLayoutEffect(() => {
          const box = bodyRef.current;
          if (!box) return;
          const bb = box.getBoundingClientRect();
          if (showSug && anchorRef.current) {
            const r = anchorRef.current.getBoundingClientRect();
            const w = Math.min(270, bb.width - 16);
            setSugPos({
              top: r.bottom - bb.top + 6,
              left: Math.max(
                8,
                Math.min(r.left - bb.left - 24, bb.width - w - 8),
              ),
              w,
            });
          } else setSugPos(null);
          if (step === 4 && citeRef.current) {
            const r = citeRef.current.getBoundingClientRect();
            const w = Math.min(340, bb.width - 16);
            setPopPos({
              top: r.bottom - bb.top + 8,
              left: Math.max(
                8,
                Math.min(r.left - bb.left - 30, bb.width - w - 8),
              ),
              w,
              cx: r.left - bb.left + r.width * 0.55,
              cy: r.top - bb.top + r.height * 0.55,
            });
          } else setPopPos(null);
        }, [step, t1, showSug, c.style]);

        let slot;
        if (step === 0) slot = <span className="e-caret" />;
        else if (step === 1)
          slot = (
            <>
              <span className="e-src">{t1}</span>
              <span ref={anchorRef} className="e-caret" />
            </>
          );
        else if (step === 2)
          slot = (
            <>
              <span className="e-src">[@haraway1988{t2}</span>
              <span className="e-caret" />
            </>
          );
        else
          slot = (
            <span
              ref={citeRef}
              className={
                "text-cite" +
                (step === 3 ? " e-reflow" : "") +
                (step === 4 ? " underline underline-offset-2" : "")
              }
            >
              {eParen("haraway1988", c.style, "p. 581")}
            </span>
          );

        const p1 = parseCitations(DRAFT.source[0]);
        const p2 = parseCitations(DRAFT.source[1]);
        const cited = [
          "bommasani2021",
          "vaswani2017",
          "bender2021",
          ...(step >= 3 ? ["haraway1988"] : []),
        ];
        const sidebar = eSortStyle(cited, c.style);

        return (
          <div ref={ref}>
            <E_Window title={DRAFT.title} right="Live Preview">
              <div className="grid md:grid-cols-[minmax(0,1fr)_16rem]">
                <div
                  ref={bodyRef}
                  className="relative min-h-[19rem] px-5 pt-6 pb-8 text-[15px] leading-[1.7] md:px-8"
                >
                  <div className="mb-2.5 text-[19px] font-semibold">
                    {DRAFT.heading}
                  </div>
                  <p>
                    {p1.map((s, i) =>
                      s.text != null ? (
                        <Fragment key={i}>{s.text}</Fragment>
                      ) : s.cite.key === "haraway1988" ? (
                        <Fragment key={i}>{slot}</Fragment>
                      ) : (
                        <E_StaticCite
                          key={i}
                          k={s.cite.key}
                          loc={s.cite.locator}
                        />
                      ),
                    )}
                  </p>
                  <p className="text-ink/75 mt-3">
                    {p2.map((s, i) =>
                      s.text != null ? (
                        <Fragment key={i}>{s.text}</Fragment>
                      ) : (
                        <E_StaticCite
                          key={i}
                          k={s.cite.key}
                          loc={s.cite.locator}
                        />
                      ),
                    )}
                  </p>

                  {showSug && sugPos ? (
                    <div
                      className="bg-surface border-line absolute z-10 overflow-hidden rounded-[5px] border text-[13px] shadow-[0_10px_30px_-10px_rgba(0,0,0,0.35)]"
                      style={{
                        top: sugPos.top,
                        left: sugPos.left,
                        width: sugPos.w,
                      }}
                    >
                      {sug.length ? (
                        sug.map((k, i) => (
                          <div
                            key={k}
                            className={
                              "px-3 py-1.5 " + (i === 0 ? "bg-ink/[0.07]" : "")
                            }
                          >
                            <div className="flex items-center justify-between gap-2">
                              <span className="font-semibold">
                                {PAPERS[k].inText} {PAPERS[k].year}
                              </span>
                              {PAPERS[k].note ? (
                                <E_I
                                  n="FileText"
                                  size={12}
                                  className="text-muted"
                                />
                              ) : null}
                            </div>
                            <div className="truncate text-[12px] text-muted">
                              {PAPERS[k].title}
                            </div>
                          </div>
                        ))
                      ) : (
                        <div className="px-3 py-2 text-muted">No match</div>
                      )}
                    </div>
                  ) : null}

                  {step === 4 && popPos ? (
                    <>
                      <div
                        className="bg-surface border-line e-in absolute z-10 rounded-[6px] border shadow-[0_14px_40px_-12px_rgba(0,0,0,0.35)]"
                        style={{
                          top: popPos.top,
                          left: popPos.left,
                          width: popPos.w,
                        }}
                      >
                        <E_PopBody k="haraway1988" style={c.style} />
                      </div>
                      <div
                        className="text-ink pointer-events-none absolute z-20"
                        style={{ left: popPos.cx, top: popPos.cy }}
                      >
                        <E_I
                          n="MousePointer2"
                          size={18}
                          className="fill-surface"
                        />
                      </div>
                    </>
                  ) : null}
                </div>
                <div className="border-line bg-ground/35 hidden border-l px-4 py-4 md:block">
                  <div className="mb-2 flex items-center justify-between text-[12px] text-muted">
                    <span className="text-ink flex items-center gap-1.5 font-semibold">
                      <E_I n="BookMarked" size={13} /> References
                    </span>
                    <span className="e-lnum">{sidebar.length}</span>
                  </div>
                  <ol className="space-y-2 text-[12px] leading-[1.45]">
                    {sidebar.map((k) => (
                      <li
                        key={k}
                        className={
                          (k === "haraway1988" && step === 3 ? "e-in " : "") +
                          (c.style === "ieee"
                            ? "grid grid-cols-[1.9em_1fr]"
                            : "e-hang") +
                          " e-entry"
                        }
                      >
                        {c.style === "ieee" ? (
                          <span className="e-lnum text-muted">[{eNum(k)}]</span>
                        ) : null}
                        <span>
                          <E_Entry k={k} style={c.style} />
                        </span>
                      </li>
                    ))}
                  </ol>
                </div>
              </div>
            </E_Window>
          </div>
        );
      }

      // ---------- Figure 2: citations in the graph view ----------
      const E_GPOS = {
        ch2: [300, 205],
        ch3: [530, 205],
        rg6: [150, 340],
        memo: [430, 352],
        haraway1988: [425, 80],
        bommasani2021: [175, 96],
        bender2021: [298, 58],
        suchman1987: [110, 200],
        vaswani2017: [225, 276],
        star1989: [650, 112],
        bowker1999: [680, 250],
        latour1987: [585, 330],
        kuhn1962: [292, 405],
        devlin2019: [72, 270],
        brown2020: [75, 405],
        shannon1948: [505, 410],
      };
      function E_Fig2() {
        const { motion } = useProtoState();
        const ref = useRef(null);
        const inView = useInView(ref, { threshold: 0.3, once: true });
        const [run, setRun] = useState(0);
        const [armed, setArmed] = useState(!motion);
        const [hot, setHot] = useState(null);
        useEffect(() => {
          if (!motion) {
            setArmed(true);
            return;
          }
          if (!inView) return;
          setArmed(false);
          let r2 = 0;
          const r1 = requestAnimationFrame(() => {
            r2 = requestAnimationFrame(() => setArmed(true));
          });
          return () => {
            cancelAnimationFrame(r1);
            cancelAnimationFrame(r2);
          };
        }, [inView, run, motion]);

        const active = hot || "ch2";
        const edges = GRAPH.edges.map((e, i) => ({
          ...e,
          i,
          lit: e.from === active || e.to === active,
        }));
        const ch2Cites = NOTES[0].cites;
        const firstN = edges.filter((e) => e.from === "ch2").length;
        const ordered = [...edges].sort(
          (a, b) => (b.from === "ch2") - (a.from === "ch2"),
        );
        const delay = new Map(
          ordered.map((e, j) => [
            e.i,
            j < firstN ? j * 120 : 800 + (j - firstN) * 70,
          ]),
        );
        const near = new Set([
          active,
          ...edges.filter((e) => e.lit).flatMap((e) => [e.from, e.to]),
        ]);
        const nodeDelay = (id) =>
          id === "ch2"
            ? 0
            : ch2Cites.includes(id)
              ? 250 + ch2Cites.indexOf(id) * 120
              : 900 + Object.keys(E_GPOS).indexOf(id) * 40;

        const info = (() => {
          const note = NOTES.find((x) => x.id === active);
          if (note) {
            const missing = note.cites.filter((k) => !PAPERS[k].note).length;
            return `${note.title} cites ${note.cites.length} works. ${missing ? `${missing} ${missing === 1 ? "has" : "have"} no literature note yet.` : "All have literature notes."}`;
          }
          const p = PAPERS[active];
          const by = citedBy(active).length;
          return `${p.inText} ${p.year}, ${p.short}. ${p.note ? "Has a literature note" : "No literature note yet"}. Cited in ${by} ${by === 1 ? "note" : "notes"}.`;
        })();

        return (
          <div ref={ref} className="border-line relative border-y py-3">
            <div className="flex items-center justify-between gap-3 px-1 pb-2 font-sans text-[12.5px] text-muted">
              <span aria-live="polite" className="min-w-0">
                {info}
              </span>
              <button
                type="button"
                onClick={() => setRun((r) => r + 1)}
                className="hover:text-ink inline-flex shrink-0 cursor-pointer items-center gap-1.5"
              >
                <E_I n="RotateCcw" size={13} /> Replay
              </button>
            </div>
            <div className="overflow-x-auto">
              <svg
                viewBox="0 0 740 440"
                className="block h-auto w-full min-w-[600px]"
                role="img"
                aria-label="Graph of notes and the works they cite. Ch. 2 cites five works; two of them have no literature note and are dimmed."
              >
                {edges.map((e) => {
                  const [x1, y1] = E_GPOS[e.from];
                  const [x2, y2] = E_GPOS[e.to];
                  return (
                    <line
                      key={e.i}
                      x1={x1}
                      y1={y1}
                      x2={x2}
                      y2={y2}
                      pathLength="1"
                      strokeDasharray="1"
                      stroke={
                        e.kind === "citation" ? "var(--cite)" : "var(--muted)"
                      }
                      strokeWidth={e.lit ? 1.7 : 1.1}
                      style={{
                        strokeDashoffset: armed ? 0 : 1,
                        opacity: e.lit ? 0.95 : 0.3,
                        transition: `stroke-dashoffset .75s cubic-bezier(.4,0,.2,1) ${delay.get(e.i)}ms, opacity .25s ease`,
                      }}
                    />
                  );
                })}
                {GRAPH.nodes.map((n) => {
                  const [x, y] = E_GPOS[n.id];
                  const r = n.kind === "note" ? 8.5 : 6;
                  const dim = n.kind === "cited";
                  const on = near.has(n.id);
                  // Labels sit above the top row (its edges come from below), else below the node.
                  const lw =
                    n.label.length * (n.kind === "note" ? 6.9 : 6.1) + 8;
                  const ly = y < 130 ? y - r - 8 : y + r + 15;
                  return (
                    <g
                      key={n.id}
                      tabIndex={0}
                      role="button"
                      aria-label={
                        n.kind === "note"
                          ? n.label
                          : `${n.label}, ${n.sub}${dim ? ", no literature note" : ""}`
                      }
                      className="cursor-pointer outline-none"

      // ---------- Figure 3: the Library View ----------
      const E_TREE = (() => {

          out.push({
            id: lib.id,
            name: lib.name,
            depth: 0,
            group: g,
            path: g ? null : "",
            lib: lib.name,
            count: lib.count,

          lib.collections.forEach((c) => {
            out.push({
              id: `${lib.id}/${c.name}`,
              name: c.name,
              depth: 1,
              group: g,
              path: g ? null : c.name,
              lib: lib.name,
              count: lib.count,

            (c.children || []).forEach((ch) =>
              out.push({
                id: `${lib.id}/${c.name}/${ch.name}`,
                name: ch.name,
                depth: 2,
                path: `${c.name}/${ch.name}`,
                lib: lib.name,

          });

        return out;

      // ---------- Listing 2: the Query CLI ----------
      function eJson(out) {
        return out.split("\n").map((line, i) => {
          const parts = line.split(
            /("(?:[^"\\]|\\.)*"(?=\s*:)|"(?:[^"\\]|\\.)*"|\b\d+\b|\btrue\b|\bfalse\b)/g,
          );
          return (
            <div key={i}>
              {parts.map((p, j) => {
                if (!p) return null;
                const isKey = /^"/.test(p) && /^\s*:/.test(parts[j + 1] || "");
                if (isKey)
                  return (
                    <span key={j} className="text-muted">
                      {p}
                    </span>
                  );
                if (/^(\d+|true|false)$/.test(p))
                  return (
                    <span key={j} className="text-accent">
                      {p}
                    </span>
                  );
                return <Fragment key={j}>{p}</Fragment>;
              })}
            </div>
          );
        });
      }

        const typed = useTypewriter(s.cmd, {

          active: inView,

        const done = typed.length >= s.cmd.length;
        return (

      function VariantE() {
        const { motion } = useProtoState();
        const dark = eUseDark();
        const [style, setStyleRaw] = useState("apa");
        const [tick, setTick] = useState(0);
        const [pop, setPop] = useState(null);
        const rootRef = useRef(null);
        const popRef = useRef(null);
        const closeT = useRef(0);
        const motionRef = useRef(motion);
        motionRef.current = motion;

        const setStyle = useCallback(
          (s) => {
            if (s === style) return;
            setStyleRaw(s);
            setTick((t) => t + 1);
          },
          [style],
        );
        const showPop = useCallback((k, loc, el) => {
          clearTimeout(closeT.current);
          const root = rootRef.current;
          if (!root || !el) return;
          const r = el.getBoundingClientRect();
          const rr = root.getBoundingClientRect();
          const w = Math.min(372, rr.width - 32);
          const left = Math.max(
            16,
            Math.min(r.left - rr.left - 12, rr.width - w - 16),
          );
          const above = r.bottom + 270 > window.innerHeight && r.top > 300;
          const top = above ? r.top - rr.top - 8 : r.bottom - rr.top + 8;
          setPop({ k, loc, top, left, w, above, el });
        }, []);
        const hidePop = useCallback(() => {
          clearTimeout(closeT.current);
          closeT.current = setTimeout(() => setPop(null), 220);
        }, []);
        const keepPop = useCallback(() => clearTimeout(closeT.current), []);
        const closePop = useCallback(() => {
          clearTimeout(closeT.current);
          setPop(null);
        }, []);
        const blurPop = useCallback(
          (e) => {
            if (popRef.current && popRef.current.contains(e.relatedTarget))
              return;
            hidePop();
          },
          [hidePop],
        );
        const jump = useCallback((id) => {
          const el = document.getElementById(id);
          if (!el) return;
          el.scrollIntoView({
            behavior: motionRef.current ? "smooth" : "auto",
            block:
              id.startsWith("e-ref-") || id.startsWith("e-fn")
                ? "center"
                : "start",
          });
          el.classList.remove("e-flash");
          void el.offsetWidth;
          el.classList.add("e-flash");
          setTimeout(() => el.classList.remove("e-flash"), 2000);
        }, []);

        useEffect(() => {
          if (!pop) return;
          const down = (e) => {
            if (popRef.current && popRef.current.contains(e.target)) return;
            if (pop.el && pop.el.contains(e.target)) return;
            setPop(null);
          };
          const key = (e) => {
            if (e.key === "Escape") {
              setPop(null);
              if (pop.el) pop.el.focus();
            }
          };
          document.addEventListener("pointerdown", down);
          document.addEventListener("keydown", key);
          return () => {
            document.removeEventListener("pointerdown", down);
            document.removeEventListener("keydown", key);
          };
        }, [pop]);

          () => ({
            style,
            setStyle,
            tick,
            pop,
            showPop,
            hidePop,
            keepPop,
            closePop,
            blurPop,
            jump,
            motion,
          }),

            style,
            setStyle,
            tick,
            pop,
            showPop,
            hidePop,
            keepPop,
            closePop,
            blurPop,
            jump,
            motion,

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "One paper's journey", component: VariantA },
        { key: "B", name: "Live bento", component: VariantB },
        { key: "C", name: "Research map", component: VariantC },
        { key: "D", name: "Source / Live Preview", component: VariantD },
        { key: "E", name: "The page is a paper", component: VariantE },
      ];

      function App() {
        const { motion } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          window.scrollTo(0, 0);
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        const btn = {
          background: "none",
          border: "none",
          color: "inherit",
          cursor: "pointer",
          fontSize: "1.1rem",
          padding: "0 0.25rem",
        };
        return (
          <>
            <V.component key={V.key} />
            <div
              style={{
                position: "fixed",
                bottom: "1rem",
                left: "50%",
                transform: "translateX(-50%)",
                background: "#111827",
                color: "#f8fafc",
                borderRadius: "9999px",
                padding: "0.45rem 1rem",
                display: "flex",
                alignItems: "center",
                gap: "0.75rem",
                fontSize: "0.8125rem",
                zIndex: 9999,
                boxShadow: "0 6px 20px rgba(0,0,0,0.35)",
                fontFamily: "ui-sans-serif, system-ui, sans-serif",
                maxWidth: "calc(100vw - 2rem)",
                whiteSpace: "nowrap",
              }}
            >
              <button
                aria-label="Previous variant"
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={btn}
              >
                ←
              </button>
              <span style={{ display: "flex", gap: "0.35rem" }}>
                {VARIANTS.map((v, i) => (
                  <button
                    key={v.key}
                    aria-label={`Variant ${v.key}: ${v.name}`}
                    onClick={() => setIdx(i)}
                    style={{
                      width: "1.5rem",
                      height: "1.5rem",
                      borderRadius: "9999px",
                      border: "none",
                      cursor: "pointer",
                      background:
                        i === idx ? "#E8622C" : "rgba(255,255,255,0.12)",
                      color: "#fff",
                      fontSize: "0.7rem",
                      fontWeight: 600,
                    }}
                  >
                    {v.key}
                  </button>
                ))}
              </span>
              <span
                style={{
                  minWidth: "10rem",
                  overflow: "hidden",
                  textOverflow: "ellipsis",
                }}
              >
                {V.name}
              </span>
              <button
                aria-label="Next variant"
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={btn}
              >
                →
              </button>
              <button
                onClick={() => setProto((s) => ({ motion: !s.motion }))}
                style={{
                  ...btn,
                  fontSize: "0.75rem",
                  border: "1px solid rgba(255,255,255,0.25)",
                  borderRadius: "9999px",
                  padding: "0.15rem 0.6rem",
                }}
              >
                {motion ? "Pause motion" : "Play motion"}
              </button>
            </div>
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
