        const [touched, setTouched] = useState(false);
        const note = NOTES.find((x) => x.id === active);
        const refs = useMemo(
          () =>
            [...note.cites].sort((x, y) =>
              PAPERS[x].apaAuthors.localeCompare(PAPERS[y].apaAuthors),
            ),
          [note],
        );
        const tick = useLoop(1800, refs.length, {
          active: inView && drawn && !touched,
        });
        const focus =
          hover || pinned || (touched ? null : refs[tick % refs.length]);
        const pickNote = (id) => {
          setActive(id);
          setPinned(null);
          setTouched(true);
        };
        const pin = (k) => {
          setPinned(k);
          setTouched(true);
        };
        return (
          <div ref={ref}>
            <C_AppWindow title="Graph view" icon="Waypoints">
              <div className="grid lg:grid-cols-[minmax(0,1fr)_340px]">
                <div className="min-w-0">
                  <div className="border-line bg-surface c-scroll flex items-center gap-2 overflow-x-auto border-b px-3 py-2">
                    <span className="shrink-0 text-[12px] text-muted">
                      Open a note:
                    </span>
                    {NOTES.map((x) => (
                      <button
                        key={x.id}
                        onClick={() => pickNote(x.id)}
                        aria-pressed={active === x.id}
                        className={
                          "h-7 shrink-0 border px-2.5 text-[12px] font-semibold whitespace-nowrap " +
                          (active === x.id
                            ? "bg-ink text-ground border-ink"
                            : "border-line bg-ground hover:border-ink/40")
                        }
                      >
                        {x.title}
                      </button>
                    ))}
                  </div>
                  <div className="c-scroll overflow-x-auto">
                    <svg
                      viewBox="0 0 680 470"
                      className="block h-auto w-full min-w-[560px]"
                      aria-hidden="true"
                      style={{ fontFamily: "var(--font-body)" }}
                    >
                      {GRAPH.edges.map((e, i) => {
                        const [x1, y1] = C_POS[e.from];
                        const [x2, y2] = C_POS[e.to];
                        if (e.kind === "link")
                          return (
                            <line
                              key={i}
                              x1={x1}
                              y1={y1}
                              x2={x2}
                              y2={y2}
                              stroke="var(--muted)"
                              strokeOpacity="0.55"
                              strokeWidth="1.4"
                              strokeDasharray="4 5"
                            />
                          );
                        const mine = e.from === active;
                        const hot = mine && e.to === focus;
                        return (
                          <C_M.line
                            key={i}
                            x1={x1}
                            y1={y1}
                            x2={x2}
                            y2={y2}
                            stroke={mine ? "var(--accent)" : "var(--muted)"}
                            strokeOpacity={hot ? 1 : mine ? 0.7 : 0.3}
                            strokeWidth={hot ? 3.4 : mine ? 1.9 : 1.2}
                            initial={motion ? { pathLength: 0 } : false}
                            animate={{ pathLength: drawn ? 1 : 0 }}
                            transition={{
                              duration: 0.8,
                              delay: 0.1 + i * 0.035,
                            }}
                          />
                        );
                      })}
                      {GRAPH.nodes.map((nd) => {
                        const [x, y] = C_POS[nd.id];
                        const isNote = nd.kind === "note";
                        const rel =
                          nd.id === active || note.cites.includes(nd.id);
                        const isFocus = nd.id === focus;
                        const r = isNote
                          ? 9
                          : nd.kind === "literature"
                            ? 7.5
                            : 6.5;
                        return (
                          <g
                            key={nd.id}
                            opacity={rel ? 1 : 0.45}
                            style={{ cursor: "pointer" }}
                            onClick={() =>
                              isNote ? pickNote(nd.id) : pin(nd.id)
                            }
                            onMouseEnter={() => !isNote && setHover(nd.id)}
                            onMouseLeave={() => setHover(null)}
                          >
                            {(isFocus || nd.id === active) && (
                              <circle
                                cx={x}
                                cy={y}
                                r={r + 6}
                                fill="none"
                                stroke="var(--accent)"
                                strokeWidth="2.5"
                              />
                            )}
                            <circle
                              cx={x}
                              cy={y}
                              r={r}
                              fill={
                                isNote
                                  ? "var(--ink)"
                                  : nd.kind === "literature"
                                    ? "var(--accent)"
                                    : "var(--ground)"
                              }
                              stroke={
                                nd.kind === "cited" ? "var(--muted)" : "none"
                              }
                              strokeWidth="1.6"
                              strokeDasharray={
                                nd.kind === "cited" ? "2.5 2" : undefined
                              }
                            />
                            <text
                              x={x}
                              y={isNote ? y - 17 : y + r + 16}
                              textAnchor="middle"
                              fontSize={isNote ? 14 : 13}
                              fontWeight={isNote || isFocus ? 700 : 500}
                              fill={rel ? "var(--ink)" : "var(--muted)"}
                              stroke="var(--ground)"
                              strokeWidth="4"
                              paintOrder="stroke"
                            >
                              {nd.label}
                            </text>
                          </g>
                        );
                      })}
                    </svg>
                  </div>
                  <div className="border-line flex flex-wrap gap-x-5 gap-y-1 border-t px-3 py-2.5 text-[12px] text-muted">
                    <span className="inline-flex items-center gap-1.5">
                      <span className="bg-ink size-2.5 rounded-full" />
                      Your notes
                    </span>
                    <span className="inline-flex items-center gap-1.5">
                      <span className="bg-accent size-2.5 rounded-full" />
                      Literature notes
                    </span>
                    <span className="inline-flex items-center gap-1.5">
                      <span className="size-2.5 rounded-full border border-dashed border-muted" />
                      Cited, no note yet
                    </span>
                    <span className="inline-flex items-center gap-1.5">
                      <span className="w-4 border-t border-dashed border-muted" />
                      Link between notes
                    </span>
                  </div>
                </div>
                <div className="border-line flex min-w-0 flex-col border-t lg:border-t-0 lg:border-l">
                  <div className="border-line border-b px-4 pt-3 pb-2">
                    <div className="flex items-center gap-1.5 text-[12px] text-muted">
                      <C_Icon name="Quote" size={13} />
                      References Sidebar
                    </div>
                    <div className="mt-1 text-[15px] leading-snug font-semibold">
                      {note.title}
                    </div>
                    <div className="font-mono text-[11px] text-muted">
                      {refs.length} sources · APA 7th edition
                    </div>
                  </div>
                  <ul className="flex-1">
                    {refs.map((k) => (
                      <li key={k}>
                        <button
                          onClick={() => pin(k)}
                          onMouseEnter={() => setHover(k)}
                          onMouseLeave={() => setHover(null)}
                          onFocus={() => setHover(k)}

                          className={
                            "border-line w-full border-b px-4 py-2.5 text-left text-[12.5px] leading-snug " +

      function D_useMedia(q) {
        const [m, setM] = useState(() => window.matchMedia(q).matches);
        useEffect(() => {
          const mq = window.matchMedia(q);
          const on = () => setM(mq.matches);
          on();
          mq.addEventListener("change", on);
          return () => mq.removeEventListener("change", on);
        }, [q]);
        return m;
      }

      // True while the element crosses a thin band at the middle of the viewport. Demos that loop
      // run only then, so at most one loop plays at a time.
      function D_useBand(ref) {
        const [on, setOn] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => setOn(e.isIntersecting),
            {
              rootMargin: "-46% 0px -46% 0px",
              threshold: 0,
            },
          );
          io.observe(el);
          return () => io.disconnect();
        }, []);
        return on;
      }

      function D_Desk({ wide, selected, onOpen, paused }) {
        const L = wide ? D_WIDE : D_TALL;
        const { motion } = useProtoState();
        const [hot, setHot] = useState(null);
        const ref = useRef(null);
        const band = D_useBand(ref);
        const anim = !motion ? "off" : band && !paused ? "run" : "pause";
        const box = (id) => {
          const o = D_OBJ[id];
          const p = L.at[id];
          const s = p.s || 1;
          return { o, p, s, w: o.w * s, h: o.h * s };
        };
        const pct = (v, total) => `${(v / total) * 100}%`;
        return (
          <div
            ref={ref}
            className="relative w-full"
            style={{ aspectRatio: `${L.W} / ${L.H}` }}
          >
            <svg
              viewBox={`0 0 ${L.W} ${L.H}`}
              className="d-svg absolute inset-0 h-full w-full"
              aria-hidden="true"
              focusable="false"
            >
              <D_DeskTop L={L} />
              {L.mug && <D_Mug x={L.mug[0]} y={L.mug[1]} />}
              {JOBS.map((j, i) => {
                const { o, p, s, w, h } = box(j.id);
                const on = hot === j.id || selected === j.id;
                const dim = selected && selected !== j.id;
                const Art = o.Art;
                return (
                  <g
                    key={j.id}
                    transform={`translate(${p.x} ${p.y}) rotate(${p.r} ${w / 2} ${h / 2}) scale(${s})`}
                  >
                    <g
                      className={motion ? "d-settle" : ""}
                      style={{ animationDelay: `${150 + i * 85}ms` }}
                    >
                      <g className={`d-shade ${on ? "is-on" : ""}`}>
                        {o.shade.map(([x, y, sw, sh, rx], k) => (
                          <rect
                            key={k}
                            x={x + 7}
                            y={y + 9}
                            width={sw}
                            height={sh}
                            rx={rx}
                            fill={
                              p.deep
                                ? "var(--d-shadow-deep)"
                                : "var(--d-shadow)"
                            }
                          />
                        ))}
                      </g>
                      <g
                        className={`d-lift ${on ? "is-on" : ""} ${dim ? "is-dim" : ""}`}
                      >
                        <Art anim={j.id === "read" ? anim : "off"} />
                      </g>
                    </g>
                  </g>
                );
              })}
            </svg>
            {JOBS.map((j) => {
              const { p, w, h } = box(j.id);
              return (
                <button
                  key={j.id}
                  type="button"
                  aria-label={j.name}
                  aria-haspopup="dialog"
                  aria-expanded={selected === j.id}
                  className="d-hit absolute"
                  style={{
                    left: pct(p.x, L.W),
                    top: pct(p.y, L.H),
                    width: pct(w, L.W),
                    height: pct(h, L.H),
                    transform: `rotate(${p.r}deg)`,
                  }}
                  onPointerEnter={() => setHot(j.id)}
                  onPointerLeave={() => setHot((x) => (x === j.id ? null : x))}
                  onFocus={() => setHot(j.id)}
                  onBlur={() => setHot((x) => (x === j.id ? null : x))}
                  onClick={() => onOpen(j.id)}
                />
              );
            })}
            {JOBS.map((j, i) => {
              const { p, w } = box(j.id);
              const show = !wide || hot === j.id || selected === j.id;
              if (!show) return null;
              const left = wide ? pct(p.x + w / 2, L.W) : pct(p.lx, L.W);
              const top = wide ? pct(p.y, L.H) : pct(p.ly, L.H);
              return (
                <span
                  key={j.id}
                  aria-hidden="true"
                  className={`border-line bg-surface text-ink d-sheet pointer-events-none absolute z-10 inline-flex w-max items-center gap-1.5 rounded-full border ${
                    wide
                      ? "px-3 py-1.5 text-[14px] font-semibold whitespace-nowrap"
                      : "max-w-[47%] px-2.5 py-1 text-[12.5px] leading-tight font-semibold"

                  style={{
                    left,
                    top,
                    transform: wide
                      ? "translate(-50%, -55%)"
                      : "translate(-50%, 0)",
                  }}
                >
                  <span className="font-mono text-[10.5px] font-normal text-muted">
                    {D_NUM(i)}
                  </span>
                  {j.name}
                </span>
              );
            })}
          </div>
        );
      }

      // ---------- Shared bits for the demos ----------

                <span className="bg-line size-2.5 rounded-full" />
                <span className="bg-line size-2.5 rounded-full" />

      function D_Cite({ k, locator = null, style = "apa", className = "" }) {
        return (
          <span
            className={`text-cite decoration-cite/40 rounded-sm underline underline-offset-[3px] ${className}`}
          >
            {inText(k, { style, locator, order: D_DRAFT_ORDER })}
          </span>
        );
      }

      // A Markdown source paragraph with every citation formatted.
      function D_Rendered({ src, style = "apa", plain = false, renderCite }) {
        return parseCitations(src).map((s, i) => {
          if (s.text != null) return <Fragment key={i}>{s.text}</Fragment>;
          if (renderCite)
            return <Fragment key={i}>{renderCite(s.cite)}</Fragment>;
          if (plain)
            return (
              <Fragment key={i}>
                {inText(s.cite.key, {
                  style,
                  locator: s.cite.locator,
                  order: D_DRAFT_ORDER,
                })}
              </Fragment>
            );
          return (
            <D_Cite
              key={i}
              k={s.cite.key}
              locator={s.cite.locator}
              style={style}
            />
          );
        });
      }

      function D_Badges({ f }) {

      // ---------- Signature demo: Citations in Live Preview ----------
      const D_LP = [
        { src: "", ms: 1000 },
        { src: "[@", q: "", ms: 500 },
        { src: "[@ha", q: "ha", ms: 420 },
        { src: "[@hara", q: "hara", ms: 1500 },
        { src: "[@haraway1988", ms: 520 },
        { src: "[@haraway1988, p.", ms: 420 },
        { src: "[@haraway1988, p. 581]", ms: 800 },
        { src: "[@haraway1988, p. 581]", done: true, ms: 4400 },
      ];
      const D_LP_MS = D_LP.map((s) => s.ms);

      function D_LivePreview({ active }) {
        const { motion } = useProtoState();
        const step = useTimeline(D_LP_MS, { active });
        const st = D_LP[step];
        const [style, setStyle] = useState("apa");
        const boxRef = useRef(null);
        const anchorRef = useRef(null);
        const [pos, setPos] = useState(null);
        const segs = useMemo(() => parseCitations(DRAFT.source[0]), []);
        const cut = segs.findIndex(
          (s) => s.cite && s.cite.key === "haraway1988",
        );
        const showSug = st.q != null;
        const q = st.q || "";
        const matches = D_DRAFT_ORDER.filter(
          (k) =>
            !q ||
            k.startsWith(q) ||
            PAPERS[k].inText.toLowerCase().startsWith(q),
        ).slice(0, 3);
        useLayoutEffect(() => {
          if (!showSug) return;
          const b = boxRef.current;
          const a = anchorRef.current;
          if (!b || !a) return;
          const br = b.getBoundingClientRect();
          const ar = a.getBoundingClientRect();
          const w = Math.min(300, br.width - 24);
          setPos({
            left: Math.max(12, Math.min(ar.left - br.left, br.width - w - 12)),
            top: ar.bottom - br.top + 6,
            w,
          });
        }, [showSug, step]);
        return (
          <div>
            <D_Window
              clip={false}
              title={`${DRAFT.title}.md`}
              icon="FileText"
              right={<span className="text-[11.5px]">Live Preview</span>}
            >
              <div
                ref={boxRef}
                className="relative px-5 pt-4 pb-6 text-[14.5px] leading-[1.75] @lg:px-7 @lg:text-[16px]"
              >
                <p className="font-display text-[19px] leading-snug @lg:text-[22px]">
                  {DRAFT.heading}
                </p>
                <p className="mt-2">
                  {segs
                    .slice(0, cut)
                    .map((s, i) =>
                      s.text != null ? (
                        <Fragment key={i}>{s.text}</Fragment>
                      ) : (
                        <D_Cite
                          key={i}
                          k={s.cite.key}
                          locator={s.cite.locator}
                          style={style}
                        />
                      ),
                    )}
                  {st.done ? (
                    <>
                      <D_Cite
                        k="haraway1988"
                        locator="p. 581"
                        style={style}
                        className={motion ? "bg-cite/10" : ""}
                      />
                      .
                    </>
                  ) : (
                    <>
                      <span
                        ref={anchorRef}
                        className="font-mono text-[0.88em] text-muted"
                      >
                        {st.src}
                      </span>
                      <span
                        className={`d-caret ${motion && active ? "is-blink" : ""}`}
                      />
                    </>
                  )}
                </p>
                <p className="mt-3">
                  <D_Rendered src={DRAFT.source[1]} style={style} />
                </p>
                {showSug && pos && (
                  <div
                    className={`d-sheet border-line bg-surface absolute z-10 overflow-hidden rounded-[10px] border text-[13px] ${motion ? "d-rise" : ""}`}
                    style={{ left: pos.left, top: pos.top, width: pos.w }}
                  >
                    <p className="border-line border-b px-3 py-1.5 font-mono text-[10.5px] tracking-[0.08em] text-muted uppercase">
                      Citation Suggester
                    </p>
                    <ul className="p-1">
                      {matches.map((k, i) => (
                        <li
                          key={k}
                          className={`rounded-md px-2.5 py-1.5 ${i === 0 ? "bg-cite/12" : ""}`}
                        >
                          <span className="flex items-center gap-2">
                            <span className="min-w-0 flex-1 truncate font-semibold">
                              {PAPERS[k].short}
                            </span>
                            {k === "bommasani2021" && (
                              <span className="border-line shrink-0 rounded-full border px-1.5 text-[10.5px] text-muted">
                                In this note
                              </span>
                            )}
                          </span>
                          <span className="block truncate text-[12px] text-muted">
                            {PAPERS[k].inText} · {PAPERS[k].year}
                          </span>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>
            </D_Window>
            <div
              className="mt-4 flex flex-wrap items-center gap-2 text-[13px]"
              role="group"
              aria-label="Citation style"
            >
              <span className="mr-1 text-muted">Citation style</span>
              {CSL_STYLES.map((s) => (
                <button
                  key={s.id}
                  type="button"
                  aria-pressed={style === s.id}
                  onClick={() => setStyle(s.id)}
                  className={`rounded-full border px-3 py-1 transition-colors ${
                    style === s.id
                      ? "border-ink bg-ink text-ground"
                      : "border-line bg-surface text-ink hover:border-ink/40"
                  }`}
                >
                  {s.name}
                </button>
              ))}
            </div>
          </div>
        );
      }

      // ---------- Signature demo: Citation Popover ----------
      function D_PopoverDemo({ active }) {
        const { motion } = useProtoState();
        const boxRef = useRef(null);
        const citeRefs = useRef([]);
        const cites = useMemo(
          () =>
            DRAFT.source.flatMap((s) =>
              parseCitations(s)
                .filter((x) => x.cite)
                .map((x) => x.cite),
            ),
          [],
        );
        const [manual, setManual] = useState(null);
        const auto = useLoop(3200, cites.length, {
          active: active && manual == null,
          start: 2,
        });
        const cur = manual ?? auto;
        const [pos, setPos] = useState(null);
        const measure = useCallback(() => {
          const b = boxRef.current;
          const a = citeRefs.current[cur];
          if (!b || !a) return;
          const br = b.getBoundingClientRect();
          const ar = a.getBoundingClientRect();
          const w = Math.min(380, br.width - 24);
          setPos({
            left: Math.max(12, Math.min(ar.left - br.left, br.width - w - 12)),
            top: ar.bottom - br.top + 8,
            w,
            cx: ar.left - br.left + Math.min(ar.width / 2, 60),
            cy: ar.top - br.top + ar.height * 0.55,
          });
        }, [cur]);
        useLayoutEffect(measure, [measure]);
        useEffect(() => {
          window.addEventListener("resize", measure);
          return () => window.removeEventListener("resize", measure);
        }, [measure]);
        const c = cites[cur];
        const p = PAPERS[c.key];
        let n = 0;
        return (
          <D_Window
            title={`${DRAFT.title}.md`}
            icon="BookOpen"
            right={<span className="text-[11.5px]">Reading view</span>}
          >
            <div
              ref={boxRef}
              className="relative px-5 pt-4 pb-44 text-[14.5px] leading-[1.75] @lg:px-7 @lg:text-[16px]"
            >
              <p className="font-display text-[19px] leading-snug @lg:text-[22px]">
                {DRAFT.heading}
              </p>
              {DRAFT.source.map((src, j) => (
                <p key={j} className="mt-2">
                  {parseCitations(src).map((s, q) => {
                    if (s.text != null)
                      return <Fragment key={q}>{s.text}</Fragment>;
                    const idx = n++;
                    return (
                      <button
                        key={q}
                        type="button"
                        ref={(el) => {
                          citeRefs.current[idx] = el;
                        }}
                        aria-label={`${inText(s.cite.key, { locator: s.cite.locator })}: show the full reference`}

      function VariantD() {
        const { motion } = useProtoState();
        const wide = D_useMedia("(min-width: 768px)");
        const side = D_useMedia("(min-width: 1024px)");
        const [open, setOpen] = useState(null);
        const trigger = useRef(null);
        const openJob = useCallback((id) => {
          setOpen((cur) => {
            if (!cur) trigger.current = document.activeElement;
            return id;
          });
        }, []);
        const close = useCallback(() => {
          setOpen(null);
          const el = trigger.current;
          trigger.current = null;
          if (el && el.focus)
            setTimeout(() => el.focus({ preventScroll: true }), 0);
        }, []);
        const jump = useCallback(
          (id) => {
            trigger.current = null;
            setOpen(null);
            requestAnimationFrame(() => {
              const el = document.getElementById(id);
              if (el)
                el.scrollIntoView({
                  behavior: motion ? "smooth" : "auto",
                  block: "center",
                });
            });
          },
          [motion],
        );
        useEffect(() => {
          if (!open) return;
          const onKey = (e) => {
            if (e.key === "Escape") close();
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [open, close]);
        useEffect(() => {
          if (!open || side) return;
          const prev = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          return () => {
            document.body.style.overflow = prev;
          };
        }, [open, side]);
        return (
          <div
            data-v="D"
            className="bg-ground font-body text-ink min-h-screen overflow-x-clip pb-24"
          >

                  side={side}
                  onClose={close}
                  onNav={setOpen}
                  onJump={jump}
                />
              )}
            </Motion.AnimatePresence>
          </div>
        );

      // Phase of the current step. Plays once per step while active; rests on the finished
      // frame when motion is off or the window is out of view.
      function eUsePhase(step, durs, active) {
        const { motion } = useProtoState();
        const last = durs.length - 1;
        const [st, setSt] = useState({ step: -1, i: last });
        useEffect(() => {
          if (!motion || !active) {
            setSt({ step, i: last });
            return;
          }
          let k = 0;
          let t;
          let dead = false;
          setSt({ step, i: 0 });
          const next = () => {
            if (k >= last) return;
            t = setTimeout(() => {
              if (dead) return;
              k += 1;
              setSt({ step, i: k });
              next();
            }, durs[k]);
          };
          next();
          return () => {
            dead = true;
            clearTimeout(t);
          };
        }, [step, motion, active]);
        if (st.step === step) return st.i;
        return motion && active ? 0 : last;
      }

            strokeWidth={strokeWidth}
            style={style}
            className={className}
            aria-hidden="true"
          />

      }

      const eAnnotCount = (key) =>

      const eTypeIcon = (p) =>
        p.type === "book"
          ? "BookOpen"

      // The window is laid out at 1200 x 740 and scaled to the width of its container.
      function E_Scaled({ children, label }) {
        const ref = useRef(null);
        const [s, setS] = useState(1);
        useLayoutEffect(() => {
          const el = ref.current;
          if (!el) return;
          const update = () => setS(Math.min(1, el.clientWidth / E_W));
          update();
          const ro = new ResizeObserver(update);
          ro.observe(el);
          return () => ro.disconnect();
        }, []);
        return (
          <div
            ref={ref}
            role="group"
            aria-label={label}
            style={{ width: "100%", height: E_H * s, position: "relative" }}
          >
            <div
              style={{
                width: E_W,
                height: E_H,
                transform: `scale(${s})`,
                transformOrigin: "0 0",
                position: "absolute",
                left: 0,
                top: 0,
              }}
            >
              {children(s)}
            </div>
          </div>
        );
      }

      // The coach-mark ring: finds [data-coach=target] inside the window and rings it.
      function E_Coach({ rootRef, target, scale, tick }) {
        const [r, setR] = useState(null);
        useLayoutEffect(() => {
          const measure = () => {
            const root = rootRef.current;
            if (!root) return;
            const el = target && root.querySelector(`[data-coach="${target}"]`);
            if (!el) {
              setR(null);
              return;
            }
            const a = root.getBoundingClientRect();
            const b = el.getBoundingClientRect();
            const k = a.width / E_W || 1;
            setR({
              x: (b.left - a.left) / k,
              y: (b.top - a.top) / k,
              w: b.width / k,
              h: b.height / k,
            });
          };
          const raf = requestAnimationFrame(measure);
          const t1 = setTimeout(measure, 420);
          const t2 = setTimeout(measure, 900);
          return () => {
            cancelAnimationFrame(raf);
            clearTimeout(t1);
            clearTimeout(t2);
          };
        }, [target, scale, tick]);
        if (!r) return null;
        const pad = 5;
        return (
          <Motion.motion.div
            aria-hidden="true"
            initial={false}
            animate={{
              left: Math.max(2, r.x - pad),
              top: Math.max(2, r.y - pad),
              width: Math.min(E_W - 4, r.w + pad * 2),
              height: Math.min(E_H - 4, r.h + pad * 2),
            }}
            transition={{ type: "spring", stiffness: 210, damping: 28 }}
            style={{
              position: "absolute",
              pointerEvents: "none",
              border: "2px solid var(--accent)",
              borderRadius: 10,
              zIndex: 40,
              boxShadow:
                "0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent)",
            }}
          />
        );
      }

      // ---------- The window: one frame of the tour ----------
      function E_Window({ step, phase, live, pick, setPick, rootRef, scale }) {
        const job = E_STEPS[step].job;
        const a4 = ANNOTATIONS.find((a) => a.id === "a4");
        const typedComment = useTypewriter(a4.comment, {
          cps: 30,
          active: live && job === "read" && phase >= 4,
        });
        const typedCite = useTypewriter("[@situated", {
          cps: 14,
          active: live && job === "cite" && phase === 0,
        });

        // Left sidebar: the Library View tree.
        const coll =
          pick.coll ||
          (job === "connect" || (job === "find" && phase < 1)
            ? "Thesis"
            : "Thesis/Ch. 2 Situated models");
        const filters =
          pick.filters ||
          (job === "connect" || (job === "find" && phase < 2)
            ? []
            : ["Annotated"]);
        const toggleFilter = (f) =>
          setPick((p) => {
            const cur = p.filters || filters;
            return {
              ...p,
              filters: cur.includes(f)
                ? cur.filter((x) => x !== f)
                : [...cur, f],
            };
          });
        const leftOpen = true;

        // Main tabs and the active tab per step.
        let tabs = [E_TABS.lib];
        let tab = "lib";
        if (job === "read") {
          tabs = [E_TABS.lib, E_TABS.pdf];
          tab = "pdf";
        } else if (job === "notes") {
          tabs = [
            E_TABS.lib,
            E_TABS.pdf,
            ...(phase >= 1 ? [E_TABS.note] : []),
            ...(phase >= 2 ? [E_TABS.ch2] : []),
          ];
          tab = phase === 0 ? "pdf" : phase === 1 ? "note" : "ch2";
        } else if (job === "cite" || job === "export") {
          tabs = [E_TABS.lib, E_TABS.note, E_TABS.ch2];
          tab = "ch2";
        } else if (job === "connections") {
          tabs = [E_TABS.ch2, E_TABS.note, E_TABS.query, E_TABS.graph];
          tab =
            phase === 0
              ? "ch2"
              : phase === 1
                ? "note"
                : phase <= 3
                  ? "query"
                  : "graph";
        }
        if (pick.tab && tabs.some((t) => t.id === pick.tab)) tab = pick.tab;
        const onTab = (id) => setPick((p) => ({ ...p, tab: id }));

        // Right sidebar.
        const rightOpen = [
          "read",
          "notes",
          "cite",
          "connections",
          "export",
        ].includes(job);
        let rtab = "references";
        if (job === "read" || job === "notes") rtab = "annotations";
        if (job === "connections" && tab === "note") rtab = "citedby";

        // Citation keys in Ch. 2 as shown (the callout from step 4 cites Haraway too).
        const citeIn = job === "cite" && phase < 3 ? [] : ["haraway1988"];
        const ch2Keys = [...E_CH2_KEYS, ...citeIn];

        // The library list.
        const rowsAll = papersIn(coll);
        const rows = rowsAll.filter((k) =>
          filters.every((f) => eFilterFn[f](PAPERS[k])),
        );
        const selected =
          pick.paper !== undefined
            ? pick.paper
            : job === "find" && phase >= 3
              ? "haraway1988"
              : null;

        const hover = pick.hover;
        const hoverProps = (para) => (c) => ({
          onEnter: () =>
            setPick((p) => ({ ...p, hover: { key: c.key, para } })),
          onLeave: () => setPick((p) => ({ ...p, hover: null })),
          onClick: () =>
            setPick((p) => ({
              ...p,
              hover:
                p.hover && p.hover.key === c.key ? null : { key: c.key, para },
            })),
        });

        const segs0 = parseCitations(DRAFT.source[0]);
        const lastCite = segs0.length - 2; // the Haraway citation
        const head0 = segs0
          .slice(0, lastCite)
          .map((s) => (s.text !== undefined ? s.text : s.cite.raw))
          .join("");

        let body = null;
        if (tab === "lib") {
          if (job === "connect") {
            body = (
              <div
                style={{ position: "absolute", inset: 0, overflow: "hidden" }}
              >
                <E_Welcome phase={phase} />
                <div data-coach="list" style={{ padding: "0 14px" }}>
                  <Motion.AnimatePresence>
                    {phase >= 4 &&
                      papersIn("Thesis")
                        .slice(0, 6)
                        .map((k, i) => (
                          <E_PaperRow key={k} k={k} delay={i * 0.06} />
                        ))}
                  </Motion.AnimatePresence>
                </div>
              </div>
            );

            body = (
              <div className="flex" style={{ position: "absolute", inset: 0 }}>
                <div style={{ flex: 1, minWidth: 0, overflow: "hidden" }}>
                  <E_ListHead
                    coll={coll}
                    shown={rows.length}
                    total={rowsAll.length}
                    filters={filters}
                    onFilter={toggleFilter}
                  />
                  <div data-coach="list" style={{ padding: "0 8px" }}>
                    <Motion.AnimatePresence initial={false}>
                      {rows.map((k) => (
                        <E_PaperRow
                          key={k}
                          k={k}
                          on={k === selected}
                          onClick={() => setPick((p) => ({ ...p, paper: k }))}
                        />
                      ))}
                    </Motion.AnimatePresence>
                  </div>
                </div>
                {selected && (
                  <E_ReadingCard
                    key={selected}
                    k={selected}
                    onClose={() => setPick((p) => ({ ...p, paper: null }))}
                  />
                )}
              </div>
            );
          }
        } else if (tab === "pdf") {
          body = (

              tool={
                pick.tool || (job === "read" && phase >= 1 ? "Highlight" : null)

              onTool={(t) => setPick((p) => ({ ...p, tool: t }))}
              mark={job !== "read" || phase >= 2 ? 100 : 0}
              selecting={job === "read" && phase === 2}

          body = (
            <E_LitNote
              k="haraway1988"
              coach={job === "notes" ? "lit-note" : "note-view"}
            />
          );
        } else if (tab === "ch2") {
          const popKey =
            job === "cite" && phase >= 4 && !hover
              ? { key: "haraway1988", para: 0 }
              : hover;
          let slot = null;
          const before = job === "notes";
          if (before) {
            slot = null;

            slot = (
              <span data-coach="typing">
                {phase === 0 ? typedCite : "[@situated"}

                style={{ fontSize: 13, color: E_APP.muted }}

                />
              )}
              <div style={E_P}>
                <E_Rendered src={DRAFT.source[1]} hoverProps={hoverProps(1)} />
              </div>
              {popKey && popKey.para === 1 && (
                <div style={{ position: "relative", height: 0 }}>
                  <E_Popover k={popKey.key} style={{ top: 4, left: 40 }} />

          const on = () => setDark(m.matches);
          m.addEventListener("change", on);
          return () => m.removeEventListener("change", on);
        }, []);
        return dark;

              ink: "#D8E2F0",
              accent: "#F0793F",
              markInk: "#D8E2F0",
              markAccent: "#F0793F",

          : {
              ink: "#1E3A5F",
              accent: "#E8622C",
              markInk: "#1E3A5F",
              markAccent: "#E8622C",
            };

        const [step, setStep] = useState(0);
        const [playing, setPlaying] = useState(true);
        const [pickSt, setPickSt] = useState({ step: 0, v: {} });
        const pick = pickSt.step === step ? pickSt.v : {};
        const setPick = (fn) =>
          setPickSt((s) => ({
            step,
            v: typeof fn === "function" ? fn(s.step === step ? s.v : {}) : fn,
          }));

        const stageRef = useRef(null);
        const winRef = useRef(null);
        const inView = useInView(stageRef, { threshold: 0.3 });
        const live = motion && inView;
        const auto = playing && live;
        const phase = eUsePhase(step, E_STEPS[step].dur, live);

        useEffect(() => {
          if (!auto) return;
          const s = E_STEPS[step];
          const total = s.dur.reduce((a, b) => a + b, 0) + E_HOLD;
          const t = setTimeout(
            () => setStep((n) => (n + 1) % E_STEPS.length),
            total,
          );
          return () => clearTimeout(t);
        }, [auto, step]);

        const go = (i) => {
          setPlaying(false);
          setStep((i + E_STEPS.length) % E_STEPS.length);
        };
        const show = (i) => {
          go(i);
          if (stageRef.current)
            stageRef.current.scrollIntoView({
              behavior: motion ? "smooth" : "auto",
              block: "start",
            });

        const jobName = JOBS.find((j) => j.id === E_STEPS[step].job).name;

              @keyframes e-blink { 50% { opacity: 0; } }

              className="mx-auto max-w-[1360px] px-4 pt-6 sm:px-6 lg:pt-8"
            >
              <div className="grid items-end gap-6 lg:grid-cols-[1.25fr_1fr] lg:gap-12">
                <h1
                  id="e-hero"
                  className="font-display text-[40px] leading-[1.02] font-extrabold tracking-[-0.035em] sm:text-[54px] xl:text-[60px]"
                >
                  An integrated research desk for Obsidian.
                </h1>
                <div className="pb-1">
                  <p className="max-w-[46ch] text-[17px] leading-relaxed text-muted">
                    Find, read, annotate, cite and export the papers in your
                    Zotero library, in the same place you write.
                  </p>
                  <div className="mt-5 flex flex-wrap items-center gap-3">
                    <a
                      href={FACTS.install}
                      className="bg-ink text-ground inline-flex items-center gap-2 rounded-xl px-5 py-3 text-[15px] font-bold hover:opacity-90"
                    >
                      Install ZotLit <E_Icon name="ArrowRight" size={16} />
                    </a>
                    <a
                      href={FACTS.docs}
                      className="border-line text-ink hover:bg-surface inline-flex items-center gap-2 rounded-xl border px-5 py-3 text-[15px] font-bold"
                    >
                      Read the docs
                    </a>
                  </div>
                  <p className="mt-4 text-[13px] text-muted">
                    {FACTS.obsidian} · {FACTS.zotero} · {FACTS.platforms}
                  </p>
                </div>
              </div>

              <div
                ref={stageRef}
                className="mt-8 grid scroll-mt-6 items-start gap-5 lg:mt-10 lg:grid-cols-[minmax(0,1fr)_320px] lg:gap-6"
              >
                <div onPointerDown={() => setPlaying(false)}>
                  <E_Scaled
                    label={`ZotLit in Obsidian, tour step ${step + 1} of ${E_STEPS.length}: ${jobName}`}
                  >
                    {(s) => (
                      <E_Window
                        step={step}
                        phase={phase}
                        live={live}
                        pick={pick}
                        setPick={setPick}
                        rootRef={winRef}
                        scale={s}
                      />
                    )}
                  </E_Scaled>
                </div>
                <E_TourCard
                  step={step}
                  phase={phase}
                  auto={auto}
                  playing={playing}
                  motion={motion}
                  onPlay={() => setPlaying((p) => !p)}
                  onGo={go}
                />
              </div>
            </section>

            <E_Index onShow={show} />
            <E_Install />

            <footer className="mx-auto mt-28 max-w-[1360px] px-4 sm:px-6">
              <div className="border-line flex flex-wrap items-center gap-x-6 gap-y-3 border-t pt-8">
                <span className="text-[18px]">
                  <Lockup {...inks} />
                </span>
                <span className="text-[13.5px] text-muted">
                  ZotLit {FACTS.version} · {FACTS.license}
                </span>
                <span className="flex-1" />
                <nav
                  aria-label="Footer"
                  className="flex flex-wrap gap-5 text-[13.5px] font-semibold text-muted"
                >
                  <a href={FACTS.docs} className="hover:text-ink">
                    Docs
                  </a>
                  <a href={FACTS.changelog} className="hover:text-ink">
                    Changelog
                  </a>
                  <a href={FACTS.community} className="hover:text-ink">
                    Community
                  </a>
                  <a href={FACTS.github} className="hover:text-ink">
                    GitHub
                  </a>
                </nav>
              </div>
            </footer>
          </div>
        );
      }
      // --- Variant E END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Exploded view", component: VariantA },
        { key: "B", name: "Today's task", component: VariantB },
        { key: "C", name: "Before and after", component: VariantC },
        { key: "D", name: "The desk from above", component: VariantD },
        { key: "E", name: "Take the tour", component: VariantE },
      ];

      function App() {
        const { motion } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          window.scrollTo(0, 0);
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        const btn = {
          background: "none",
          border: "none",
          color: "inherit",
          cursor: "pointer",
          fontSize: "1.1rem",
          padding: "0 0.25rem",
        };
        return (
          <>
            <V.component key={V.key} />
            <div
              style={{
                position: "fixed",
                bottom: "1rem",
                left: "50%",
                transform: "translateX(-50%)",
                background: "#111827",
                color: "#f8fafc",
                borderRadius: "9999px",
                padding: "0.45rem 1rem",
                display: "flex",
                alignItems: "center",
                gap: "0.75rem",
                fontSize: "0.8125rem",
                zIndex: 9999,
                boxShadow: "0 6px 20px rgba(0,0,0,0.35)",
                fontFamily: "ui-sans-serif, system-ui, sans-serif",
                maxWidth: "calc(100vw - 2rem)",
                whiteSpace: "nowrap",
              }}
            >
              <button
                aria-label="Previous variant"
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={btn}
              >
                ←
              </button>
              <span style={{ display: "flex", gap: "0.35rem" }}>
                {VARIANTS.map((v, i) => (
                  <button
                    key={v.key}
                    aria-label={`Variant ${v.key}: ${v.name}`}
                    onClick={() => setIdx(i)}
                    style={{
                      width: "1.5rem",
                      height: "1.5rem",
                      borderRadius: "9999px",
                      border: "none",
                      cursor: "pointer",
                      background:
                        i === idx ? "#E8622C" : "rgba(255,255,255,0.12)",
                      color: "#fff",
                      fontSize: "0.7rem",
                      fontWeight: 600,
                    }}
                  >
                    {v.key}
                  </button>
                ))}
              </span>
              <span
                style={{
                  minWidth: "10rem",
                  overflow: "hidden",
                  textOverflow: "ellipsis",
                }}
              >
                {V.name}
              </span>
              <button
                aria-label="Next variant"
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={btn}
              >
                →
              </button>
              <button
                onClick={() => setProto((s) => ({ motion: !s.motion }))}
                style={{
                  ...btn,
                  fontSize: "0.75rem",
                  border: "1px solid rgba(255,255,255,0.25)",
                  borderRadius: "9999px",
                  padding: "0.15rem 0.6rem",
                }}
              >
                {motion ? "Pause motion" : "Play motion"}
              </button>
            </div>
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
