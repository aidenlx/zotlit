    <title>ZotLit research desk prototypes</title>
    <!--
      PROTOTYPE (round 2), throwaway. Not production code. Branch: proto/landing-page.
      Round 1 (commit b27d8b51b, five variants: journey, bento, map, source toggle, preprint)
      was set aside. Round 2 starts from a new thesis.

      DESIGN QUESTION
        ZotLit's main message is now "An integrated research desk for Obsidian": one place
        where an academic finds, reads, annotates, takes notes on, writes with, connects and
        exports their Zotero sources. What landing page tells that story to a non-technical
        academic, covers the WHOLE feature set (the basics since 2.0, plus 2.1, 2.2 and what
        is on main), shows it through layout, illustration, animation and demos, and stays
        clean: one focal point per screen, little prose, nothing that distracts from the
        features?

      STORY (shared by every variant, data in JOBS / FEATURES below)
        The features are grouped by the research job they serve, in the order a researcher
        meets them. Each variant tells the same story with a different structure.

      TREATMENT
        Editorial, but calm. The "Manuscript & Machine" docs system is released for this
        exploration. The fixed identity is the brand (docs/brand.md): the ZL mark from its
        master geometry, navy #1E3A5F and orange #E8622C (dark inks #D8E2F0 / #F0793F), and
        the "ZotLit" wordmark in Archivo SemiBold.

      VARIANTS (each root carries data-v="<KEY>"; the token VALUES change per variant)

                             Bricolage Grotesque (display) · IBM Plex Sans (body) · IBM Plex Mono (callouts)
                             An axonometric drawing of the desk: its layers (library, reader, note,
                             manuscript, map) float apart, then lock into one window as you scroll.
        B  Today's task      ground #F6F7F9 · surface #FFFFFF · ink #18221E · accent #E8622C · accent2 #2F6B4F
                             Newsreader (display) · Public Sans (body) · Red Hat Mono (data)
                             "What do you need to do today?" Plain-language task chips drive one
                             demo stage; a full index of the desk follows.
        C  Before and after  ground #FFFFFF · surface #F1F3F6 · ink #0F1B2D · accent #E8622C · accent2 #1E3A5F
                             Barlow Condensed (display) · Figtree (body) · Spline Sans Mono (data)
                             Six scattered windows fold into one desk; then each job is a row:
                             the old way (grey, many steps) beside the ZotLit way (one live demo).
        D  The desk from above ground #E6EBF0 · surface #FFFFFF · ink #1A2433 · accent #E8622C · accent2 #24354D
                             Young Serif (display) · Atkinson Hyperlegible Next (body) · Azeret Mono (data)
                             A flat, top-down illustration of a real desk. Each object (shelf,
                             open paper, notebook, manuscript, pinboard, card drawer, laptop) is a
                             feature; select one to open its demo.
        E  Take the tour     ground #EDEEF0 · surface #FFFFFF · ink #16181D · accent #E8622C · accent2 #1E1F22
                             Manrope (display, body) · JetBrains Mono (code)
                             The hero IS the app: an interactive Obsidian window with a guided
                             tour (step 1 of N) that drives it through the whole workflow.
    -->

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, {
        useState,
        useEffect,
        useMemo,
        useRef,
        useCallback,
        useLayoutEffect,
        useSyncExternalStore,
        Fragment,
      } from "react";
      import { createRoot } from "react-dom/client";
      // Every lucide icon, as Icons.Search, Icons.Quote, ... (variants cannot add imports).
      import * as Icons from "lucide-react";
      // motion (framer-motion): Motion.motion.div, Motion.AnimatePresence, Motion.useScroll ...
      import * as Motion from "motion/react";

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // --- App ---
      // --- Shared ---
      // Shared by every variant: the mock store, animation hooks, the brand mark, and one
      // mock research library (a thesis on language models and situated knowledge). Variants
      // read all of it from module scope and take no props, so a trimmed winner renders bare.

      // ---------- Store ----------
      // motion: false freezes every loop (switcher toggle, and prefers-reduced-motion).
      // paper: the featured Zotero item, by citation key.
      const protoStore = (() => {
        let state = {
          motion: !window.matchMedia("(prefers-reduced-motion: reduce)")
            .matches,
          paper: "vaswani2017",
        };
        const subs = new Set();
        return {
          get: () => state,
          set: (patch) => {
            state = {
              ...state,
              ...(typeof patch === "function" ? patch(state) : patch),
            };
            subs.forEach((f) => f());
          },
          subscribe: (f) => {
            subs.add(f);
            return () => subs.delete(f);
          },
        };
      })();
      function useProtoState() {
        return useSyncExternalStore(protoStore.subscribe, protoStore.get);
      }
      const setProto = protoStore.set;

      // ---------- Animation hooks ----------
      // useLoop(stepMs, count): an index that cycles 0..count-1. Holds still when motion is off.
      function useLoop(stepMs, count, { active = true, start = 0 } = {}) {
        const { motion } = useProtoState();
        const [i, setI] = useState(start);
        useEffect(() => {
          if (!motion || !active) return;
          const id = setInterval(() => setI((n) => (n + 1) % count), stepMs);
          return () => clearInterval(id);
        }, [motion, active, stepMs, count]);
        return i;
      }

      // useTimeline([ms, ms, ...]): the index of the current step; step k lasts durations[k],
      // then the timeline loops. With motion off it rests on the last step (the finished state).
      function useTimeline(durations, { active = true, loop = true } = {}) {
        const { motion } = useProtoState();
        const [i, setI] = useState(0);
        const key = durations.join(",");
        useEffect(() => {
          if (!motion) {
            setI(durations.length - 1);
            return;
          }
          if (!active) return;
          let cancelled = false;
          let t;
          let k = 0;
          setI(0);
          const next = () => {
            t = setTimeout(() => {
              if (cancelled) return;
              if (k === durations.length - 1 && !loop) return;
              k = (k + 1) % durations.length;
              setI(k);
              next();
            }, durations[k]);
          };
          next();
          return () => {
            cancelled = true;
            clearTimeout(t);
          };
        }, [motion, active, key, loop]);
        return i;
      }

      // useTypewriter(text): the typed prefix of text. Full text when motion is off or done.
      function useTypewriter(
        text,
        { cps = 28, active = true, delay = 0 } = {},
      ) {
        const { motion } = useProtoState();
        const [n, setN] = useState(motion ? 0 : text.length);
        useEffect(() => {
          if (!motion) {
            setN(text.length);
            return;
          }
          if (!active) {
            setN(0);
            return;
          }
          setN(0);
          let i = 0;
          let iv;
          const t = setTimeout(() => {
            iv = setInterval(() => {
              i += 1;
              setN(i);
              if (i >= text.length) clearInterval(iv);
            }, 1000 / cps);
          }, delay);
          return () => {
            clearTimeout(t);
            clearInterval(iv);
          };
        }, [text, cps, active, delay, motion]);
        return text.slice(0, n);
      }

      // useInView(ref): true while the element is on screen (or once, with { once: true }).
      function useInView(ref, { threshold = 0.3, once = false } = {}) {
        const [inView, setInView] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => {
              if (e.isIntersecting) {
                setInView(true);
                if (once) io.disconnect();
              } else if (!once) setInView(false);
            },
            { threshold },
          );
          io.observe(el);
          return () => io.disconnect();
        }, [threshold, once]);
        return inView;
      }

      // useScrollProgress(ref): 0 when the element's top meets the viewport bottom,
      // 1 when its bottom meets the viewport top. For scroll-driven stages.
      function useScrollProgress(ref) {
        const [p, setP] = useState(0);
        useEffect(() => {
          let raf = 0;
          const update = () => {
            raf = 0;
            const el = ref.current;
            if (!el) return;
            const r = el.getBoundingClientRect();
            const vh = window.innerHeight;
            const total = r.height + vh;
            setP(Math.min(1, Math.max(0, (vh - r.top) / total)));
          };
          const onScroll = () => {
            if (!raf) raf = requestAnimationFrame(update);
          };
          update();
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", onScroll);
          return () => {
            window.removeEventListener("scroll", onScroll);
            window.removeEventListener("resize", onScroll);
            cancelAnimationFrame(raf);
          };
        }, []);
        return p;
      }

      // ---------- Brand (docs/brand.md) ----------
      // The ZL mark from its master geometry; never redraw it. Dark inks: #D8E2F0 / #F0793F.
      function ZotLitMark({
        size = 24,
        ink = "#1E3A5F",
        accent = "#E8622C",
        className = "",
        title = "ZotLit",
      }) {
        return (
          <svg
            viewBox="0 0 24 24"
            width={size}
            height={size}
            className={className}
            role="img"
            aria-label={title}
          >
            <path
              d="M4 3.5 H17 V7 L8.75 16.5 H20.5 V20 H4 V16.5 L12.25 7 H4 Z"
              fill={ink}
            />
            <path
              d="M17 3.5 H20.5 V16.5 L18.75 14.75 L17 16.5 Z"
              fill={accent}
            />
          </svg>
        );
      }
      // "Zot" in ink, "Lit" in accent, Archivo SemiBold, tracking -1%.
      function Wordmark({
        ink = "currentColor",
        accent = "var(--accent)",
        className = "",
        style,
      }) {
        return (
          <span
            className={className}
            style={{
              fontFamily: "Archivo, sans-serif",
              fontWeight: 600,
              letterSpacing: "-0.01em",
              lineHeight: 1,
              ...style,
            }}
          >
            <span style={{ color: ink }}>Zot</span>
            <span style={{ color: accent }}>Lit</span>
          </span>
        );
      }
      // Mark + wordmark lockup: mark 0.875em square, gap 0.25em.
      function Lockup({
        ink,
        accent,
        markInk = "#1E3A5F",
        markAccent = "#E8622C",
        className = "",
        style,
      }) {
        return (
          <span
            className={className}
            style={{
              display: "inline-flex",
              alignItems: "center",
              gap: "0.25em",
              lineHeight: 1,
              ...style,
            }}
          >
            <ZotLitMark size="0.875em" ink={markInk} accent={markAccent} />
            <Wordmark ink={ink} accent={accent} />
          </span>
        );
      }

      // ---------- Facts ----------
      const SITE = "https://zotlit.aidenlx.site";
      const DOCS = `${SITE}/docs`;
      // Facts checked on 2026-10-29 against manifest.json, install-zotlit.mdx, README and
      // `gh api`. The page is drawn for 2.2's release day: 2.2 and the newer work on main
      // count as shipped (today: stable 2.1.4, 2.2 in beta through BRAT).
      const FACTS = {

      // The element's size, kept current with a ResizeObserver.
      function useASize(ref) {
        const [size, setSize] = useState({ w: 0, h: 0 });
        useLayoutEffect(() => {
          const el = ref.current;
          if (!el) return;
          const read = () => {
            const r = el.getBoundingClientRect();
            setSize((s) =>
              Math.abs(s.w - r.width) < 0.5 && Math.abs(s.h - r.height) < 0.5
                ? s
                : { w: r.width, h: r.height },
            );
          };
          read();
          const ro = new ResizeObserver(read);
          ro.observe(el);
          return () => ro.disconnect();
        }, []);
        return size;
      }

      // True while the viewport is at least `px` wide.
      function useAWide(px = 1024) {
        const q = `(min-width: ${px}px)`;
        const [wide, setWide] = useState(() => window.matchMedia(q).matches);
        useEffect(() => {
          const m = window.matchMedia(q);
          const on = () => setWide(m.matches);
          on();
          m.addEventListener("change", on);
          return () => m.removeEventListener("change", on);
        }, [q]);
        return wide;
      }

      // 0 when the section's top reaches the viewport top, 1 when its bottom reaches the
      // viewport bottom: the progress of a sticky stage inside a tall section.
      function useAStickyProgress(ref, enabled) {
        const [p, setP] = useState(0);
        useEffect(() => {
          if (!enabled) return;
          let raf = 0;
          const update = () => {
            raf = 0;
            const el = ref.current;
            if (!el) return;
            const r = el.getBoundingClientRect();
            const span = r.height - window.innerHeight;
            const next = span > 0 ? aClamp(-r.top / span) : 0;
            setP((old) => (Math.abs(old - next) < 0.0005 ? old : next));
          };
          const onScroll = () => {
            if (!raf) raf = requestAnimationFrame(update);
          };
          update();
          window.addEventListener("scroll", onScroll, { passive: true });
          window.addEventListener("resize", onScroll);
          return () => {
            window.removeEventListener("scroll", onScroll);
            window.removeEventListener("resize", onScroll);
            cancelAnimationFrame(raf);
          };
        }, [enabled]);
        return p;
      }

      // ---------- References in three styles ----------
      function aInitials(full) {
        const parts = full.split(" ");
        const last = parts.pop();
        return parts.map((x) => x[0] + ".").join(" ") + " " + last;
      }
      function aLastFirst(full) {
        const parts = full.split(" ");
        const last = parts.pop();
        return last + ", " + parts.join(" ");
      }
      function aAuthors(k, style) {
        const c = PAPERS[k].creators;
        if (style === "ieee") {
          if (c.length > 3) return aInitials(c[0]) + " et al.";
          const names = c.map(aInitials);
          return names.length > 1
            ? names.slice(0, -1).join(", ") +
                (names.length > 2 ? "," : "") +
                " and " +
                names[names.length - 1]
            : names[0];
        }
        if (c.length > 3) return aLastFirst(c[0]) + ", et al.";
        if (c.length === 1) return aLastFirst(c[0]);
        return (
          aLastFirst(c[0]) +
          (c.length > 2 ? ", " + c.slice(1, -1).join(", ") + "," : "") +
          " and " +
          c[c.length - 1]
        );
      }
      // One reference entry in APA, Chicago author-date or IEEE, with italics where they go.
      function A_Ref({ k, style = "apa", n }) {
        const p = PAPERS[k];
        if (style === "apa") return <Bib k={k} />;
        const who = aAuthors(k, style);
        if (style === "chicago") {
          const head = `${who}${who.endsWith(".") ? "" : "."} ${p.year}. `;
          if (p.type === "book")
            return (
              <span>
                {head}
                <i>{p.title}</i>. {p.publisher}.

            );
          if (p.type === "journalArticle")
            return (
              <span>
                {head}“{p.title}.” <i>{p.container}</i> {p.volume} ({p.issue}):{" "}
                {p.pages}.
              </span>
            );
          if (p.type === "preprint")
            return (
              <span>
                {head}“{p.title}.” {p.container}. https://doi.org/{p.doi}.
              </span>
            );
          return (
            <span>
              {head}“{p.title}.” In <i>{p.container}</i>, {p.pages}.
            </span>
          );
        }
        const lead = n ? `[${n}] ` : "";
        if (p.type === "book")
          return (
            <span>
              {lead}
              {who}, <i>{p.titleSentence}</i>. {p.publisher}, {p.year}.
            </span>
          );
        if (p.type === "journalArticle")
          return (
            <span>
              {lead}
              {who}, “{p.titleSentence},” <i>{p.container}</i>, vol. {p.volume},

        if (p.type === "preprint")
          return (
            <span>
              {lead}
              {who}, “{p.titleSentence},” {p.container}, {p.year}, doi: {p.doi}.
            </span>
          );
        return (
          <span>
            {lead}
            {who}, “{p.titleSentence},” in <i>{p.container}</i>, {p.year}, pp.{" "}
            {p.pages}.
          </span>
        );
      }
      // Reference-list order: alphabetical for APA and Chicago, order of first use for IEEE.
      function aRefOrder(keys, style) {
        if (style === "ieee") return keys;

      function A_GraphSvg({

        const nodeOf = (id) => GRAPH.nodes.find((n) => n.id === id);

          <svg viewBox="0 0 640 420" className={className} aria-hidden="true">

              const [x1, y1] = A_GRAPH_POS[ed.from];
              const [x2, y2] = A_GRAPH_POS[ed.to];
              const len = Math.hypot(x2 - x1, y2 - y1);
              const show = i < Math.round(drawn * GRAPH.edges.length);
              const on = lit(ed);
              return (
                <line

                  x1={x1}
                  y1={y1}

                  style={{

              );

              const n = nodeOf(id);
              const [x, y] = A_GRAPH_POS[id];
              const on = active === id;
              const near =
                active &&
                GRAPH.edges.some(
                  (ed) =>
                    (ed.from === active && ed.to === id) ||
                    (ed.to === active && ed.from === id),

              return (
                <g
                  key={id}
                  opacity={dim ? 0.55 : 1}
                  style={{
                    transition: "opacity 300ms",
                    cursor: onPick ? "pointer" : undefined,
                  }}
                  {...(onPick
                    ? {
                        role: "button",
                        tabIndex: 0,
                        "aria-label":
                          n.kind === "note" ? n.label : `${n.label}, ${n.sub}`,
                        onClick: () => onPick(id),
                        onKeyDown: (ev) => {

                    r={n.kind === "note" ? 7 : 6}

                    stroke={n.kind === "cited" ? "var(--muted)" : "none"}

                      {n.kind === "note" ? A_NOTE_SHORT[id] : n.label}
                    </text>

      const A_SCENE_CONTENT = {
        base: A_SceneBase,

      // ---------- Projection ----------
      // Mirrors the CSS transform `rotateX(rx) rotateZ(rz)` with no perspective, so the
      // callouts land exactly on the drawn layers. x, y: drawing units from the window centre.
      function aProject(x, y, z, rx, rz) {
        const a = (rx * Math.PI) / 180;
        const b = (rz * Math.PI) / 180;
        const x1 = x * Math.cos(b) - y * Math.sin(b);
        const y1 = x * Math.sin(b) + y * Math.cos(b);
        return [x1, y1 * Math.cos(a) - z * Math.sin(a)];
      }
      // e = 0: exploded. e = 1: assembled, face-on. Layers land from the bottom up.
      function aSceneState(e) {
        const turn = aEase(aSeg(e, 0.12, 1));
        const rx = A_RX * (1 - turn);
        const rz = A_RZ * (1 - turn);
        const layers = A_LAYERS.map((l, i) => {
          const t =
            i === 0 ? 1 : aEase(aSeg(e, (i - 1) * 0.08, (i - 1) * 0.08 + 0.55));
          return { ...l, z: i * A_GAP * (1 - t) };
        });
        return { rx, rz, layers, flat: e >= 0.999 };
      }
      function aBBox(st) {
        const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
        st.layers.forEach((l) => {
          [
            [l.x, l.y],
            [l.x + l.w, l.y],
            [l.x, l.y + l.h],
            [l.x + l.w, l.y + l.h],
          ].forEach(([x, y]) => {
            const [X, Y] = aProject(x - 480, y - 300, l.z, st.rx, st.rz);
            b.x0 = Math.min(b.x0, X);
            b.x1 = Math.max(b.x1, X);
            b.y0 = Math.min(b.y0, Y);
            b.y1 = Math.max(b.y1, Y);
          });
        });
        return b;
      }
      const A_BBOX0 = aBBox(aSceneState(0));
      const A_BBOX1 = { x0: -480, y0: -300, x1: 480, y1: 300 };
      function aFit(bb, r) {
        const s = Math.min(r.w / (bb.x1 - bb.x0), r.h / (bb.y1 - bb.y0));
        return {
          s,
          cx: r.x + r.w / 2 - (s * (bb.x0 + bb.x1)) / 2,
          cy: r.y + r.h / 2 - (s * (bb.y0 + bb.y1)) / 2,
        };
      }
      // Where each layer's callout leader starts, in the layer's own units.
      const aAnchor = (l) => (l.id === "base" ? [250, l.h] : [l.w, l.h]);

      const A_DRAWING_LABEL =
        "Exploded drawing of the research desk. From the base up: your Zotero library, the Library View, the PDF reader, a literature note, your manuscript, and the citation graph with its reference list.";

      // The drawing. regions(W, H) gives the box the exploded view fits (r0) and the box the
      // assembled window fits (r1); camE moves between them. labels: "side" | "balloon" | "none".
      function A_Drawing({
        e = 0,
        camE = e,
        regions,
        labels = "side",
        labelsOpacity = 1,
        className = "",
        style,
        children,
      }) {
        const ref = useRef(null);
        const { w: W, h: H } = useASize(ref);
        const st = aSceneState(e);
        const panes = useMemo(
          () =>
            Object.fromEntries(
              Object.entries(A_SCENE_CONTENT)
                .map(([id, C]) => [id, <C />])
                .concat([["floor", <A_SceneFloor />]]),
            ),
          [],
        );
        let cam = null;
        let r0 = null;
        if (W > 0 && H > 0) {
          const rs = regions(W, H);
          r0 = rs.r0;
          const t = aEase(aClamp(camE));
          const r = {
            x: aLerp(rs.r0.x, rs.r1.x, t),
            y: aLerp(rs.r0.y, rs.r1.y, t),
            w: aLerp(rs.r0.w, rs.r1.w, t),
            h: aLerp(rs.r0.h, rs.r1.h, t),
          };
          cam = aFit(e <= 0 ? A_BBOX0 : e >= 1 ? A_BBOX1 : aBBox(st), r);
        }
        const anchors = cam
          ? st.layers.map((l) => {
              const [u, v] = aAnchor(l);
              const [X, Y] = aProject(
                l.x + u - 480,
                l.y + v - 300,
                l.z,
                st.rx,
                st.rz,
              );
              return { l, x: cam.cx + cam.s * X, y: cam.cy + cam.s * Y };
            })
          : [];
        return (
          <div
            ref={ref}
            role="img"
            aria-label={A_DRAWING_LABEL}
            className={
              (className.includes("absolute") ? "" : "relative ") +
              "overflow-hidden " +
              className
            }
            style={style}
          >
            {cam && (
              <div
                aria-hidden="true"
                style={{
                  position: "absolute",
                  left: cam.cx - 480,
                  top: cam.cy - 300,
                  width: A_SCENE_W,
                  height: A_SCENE_H,
                  transform: `scale(${cam.s})`,
                  transformOrigin: "480px 300px",
                }}
              >
                <div
                  style={{
                    position: "absolute",
                    inset: 0,
                    transformStyle: st.flat ? "flat" : "preserve-3d",
                    transform: st.flat
                      ? "none"
                      : `rotateX(${st.rx}deg) rotateZ(${st.rz}deg)`,
                    transformOrigin: "480px 300px",
                  }}
                >
                  {st.layers.map((l, i) => (
                    <Fragment key={l.id}>
                      {i > 0 &&
                        l.z > 2 &&
                        [
                          [l.x, l.y + l.h],
                          [l.x + l.w, l.y + l.h],
                          [l.x + l.w, l.y],
                        ].map(([x, y], j) => (
                          <div
                            key={j}
                            style={{
                              position: "absolute",
                              left: 0,
                              top: 0,
                              width: 0,
                              height: l.z,
                              borderLeft: "1px dashed var(--muted)",
                              opacity: 0.7,
                              transformOrigin: "0 0",
                              transform: `translate3d(${x}px, ${y}px, 0) rotateX(90deg)`,
                            }}
                          />
                        ))}
                      <div
                        style={{
                          position: "absolute",
                          left: 0,
                          top: 0,
                          width: l.w,
                          height: l.h,
                          transform: st.flat
                            ? `translate(${l.x}px, ${l.y}px)`
                            : `translate3d(${l.x}px, ${l.y}px, ${l.z + i * 0.2}px)`,
                        }}
                      >
                        {panes[l.id]}
                        {i === 0 && (
                          <div
                            className="absolute inset-0"
                            style={{ opacity: 1 - aSeg(e, 0.55, 0.95) }}
                          >
                            {panes.floor}
                          </div>
                        )}
                      </div>
                    </Fragment>
                  ))}
                </div>
              </div>
            )}
            {cam && labels !== "none" && labelsOpacity > 0.01 && (
              <A_Callouts
                anchors={anchors}
                mode={labels}
                W={W}
                H={H}
                lx={r0.x + r0.w + 40}
                opacity={labelsOpacity}
              />
            )}
            {children}
          </div>
        );
      }

      // Leader lines and labels, aligned to the anchors; labels never overlap.
      function A_Callouts({ anchors, mode, W, H, lx, opacity }) {
        const sorted = [...anchors].sort((a, b) => a.y - b.y);
        const gap = mode === "side" ? 42 : 22;
        const placed = [];
        sorted.forEach((a, i) => {
          const want = mode === "side" ? a.y : a.y - 14;
          const y = i === 0 ? want : Math.max(want, placed[i - 1].ly + gap);
          placed.push({ ...a, ly: y });
        });
        const over = placed.length
          ? placed[placed.length - 1].ly - (H - 24)
          : 0;
        if (over > 0) placed.forEach((p) => (p.ly -= over));
        return (
          <div
            className="pointer-events-none absolute inset-0"
            style={{ opacity }}
            aria-hidden="true"
          >
            <svg className="absolute inset-0" width={W} height={H}>
              {placed.map((p) => {
                const bx = mode === "side" ? lx - 8 : p.x + 20;
                const path =
                  mode === "side"
                    ? `M ${p.x} ${p.y} L ${lx - 30} ${p.ly} L ${bx} ${p.ly}`
                    : `M ${p.x} ${p.y} L ${bx - 9 * 0.7} ${p.ly + 9 * 0.7}`;
                return (
                  <g key={p.l.id}>
                    <path
                      d={path}
                      fill="none"
                      stroke="var(--accent)"
                      strokeWidth={1}
                    />
                    <circle cx={p.x} cy={p.y} r={3.5} fill="var(--accent)" />
                    <circle
                      cx={p.x}
                      cy={p.y}
                      r={7}
                      fill="none"
                      stroke="var(--accent)"
                      strokeOpacity={0.45}
                    />
                    {mode === "balloon" && (
                      <>
                        <circle
                          cx={bx}
                          cy={p.ly}
                          r={10}
                          fill="var(--surface)"
                          stroke="var(--accent)"
                        />
                        <text
                          x={bx}
                          y={p.ly + 3.5}
                          textAnchor="middle"
                          fontSize={10}
                          fill="var(--accent)"
                          style={{ fontFamily: "var(--font-mono)" }}
                        >
                          {aJobNo(p.l.job)}
                        </text>
                      </>
                    )}
                  </g>
                );
              })}
            </svg>
            {mode === "side" &&
              placed.map((p) => (
                <div
                  key={p.l.id}
                  className="absolute w-[220px]"
                  style={{ left: lx, top: p.ly - 9 }}
                >
                  <div className="a-label text-ink whitespace-nowrap">
                    <span className="text-accent">{aJobNo(p.l.job)}</span>
                    <span className="ml-2">{p.l.name}</span>
                  </div>
                  <div className="mt-0.5 text-[13px] leading-[18px] text-muted">
                    {aJob(p.l.job).name}
                  </div>
                </div>
              ))}
          </div>
        );
      }

      // ---------- Header ----------
      function useADark() {
        const q = "(prefers-color-scheme: dark)";
        const [dark, setDark] = useState(() => window.matchMedia(q).matches);

          const m = window.matchMedia(q);
          const on = () => setDark(m.matches);
          m.addEventListener("change", on);
          return () => m.removeEventListener("change", on);
        }, []);
        return dark;

          <div
            aria-hidden="true"
            className="border-ink/70 bg-surface absolute grid grid-cols-[auto_auto] border font-mono text-[10px] leading-[14px] tracking-[0.1em] text-muted uppercase"
            style={style}

      const A_PAD_CSS = "max(32px, calc((100% - 1280px) / 2 + 32px))";
      function aStickyRegions(W, H) {
        const pad = Math.max(32, (W - 1280) / 2 + 32);
        const x0 = pad + 470;
        return {
          r0: {
            x: x0,
            y: 96,
            w: Math.max(220, W - pad - 236 - x0),
            h: H - 200,
          },
          r1: { x: pad, y: 48, w: W - 2 * pad, h: H - 48 - 260 },

        return { r0: r, r1: r };

        if (scrub) {
          const textT = aEase(aSeg(p, 0.03, 0.17));

          const camE = aSeg(p, 0.08, 0.56);

          const capT = aEase(aSeg(p, 0.8, 0.92));

                <A_AssembledCaption

                    <>

      // ---------- 05 Cite while you write: Live Preview citations and the Citation Popover ----------
      // Position of a floating box under an anchor element, kept inside its container.
      function useAFloat(boxRef, getAnchor, key, width, limitRef) {
        const [pos, setPos] = useState(null);
        useLayoutEffect(() => {
          const box = boxRef.current;
          const a = key ? getAnchor(key) : null;
          if (!box || !a) {
            setPos(null);
            return;
          }
          const b = box.getBoundingClientRect();
          const r = a.getBoundingClientRect();
          const lim = limitRef && limitRef.current;
          const right = lim
            ? Math.min(
                b.width - 8,
                lim.getBoundingClientRect().right - b.left + 12,
              )
            : b.width - 8;
          const w = Math.min(width, b.width - 16);
          setPos({
            left: Math.max(8, Math.min(r.left - b.left, right - w)),
            top: r.bottom - b.top + 8,
            w,
          });
        }, [key, width]);
        return pos;
      }

      function A_DemoCite() {
        const ref = useRef(null);
        const boxRef = useRef(null);

        const citeEls = useRef({});
        const inView = useInView(ref, { threshold: 0.35 });

        const [hover, setHover] = useState(null);
        const step = useTimeline([1300, 1700, 2000, 1200, 1300, 4800], {
          active: inView,
        });
        const typed = useTypewriter("[@situ", {
          cps: 7,
          active: inView && step >= 1,
        });
        const order = A_CH2_ORDER;
        const src0 = DRAFT.source[0];
        const cut = src0.indexOf("[@haraway1988");
        const before = src0.slice(0, cut);
        const after = src0.slice(src0.indexOf("]", cut) + 1);
        const pop = hover || (step === 5 ? "c-haraway1988" : null);
        const popKey = pop ? pop.split(":")[0].replace("c-", "") : null;
        const textRef = useRef(null);
        const popPos = useAFloat(
          boxRef,
          (id) => citeEls.current[id],
          pop,
          400,
          textRef,
        );
        const sugPos = useAFloat(
          boxRef,
          () => typingRef.current,
          step === 2 ? "sug" : null,
          340,
          textRef,
        );
        // The "what you type" column: each citation's Markdown, on the citation's line.
        const rawOf = useRef({});
        const { w: boxW } = useASize(boxRef);
        const [marks, setMarks] = useState([]);
        rawOf.current["c-haraway1988"] =
          step <= 2 ? typed || "[@" : "[@haraway1988, p. 581]";
        useLayoutEffect(() => {
          const box = boxRef.current;
          const text = textRef.current;
          if (!box || !text) return;
          const b = box.getBoundingClientRect();
          const t = text.getBoundingClientRect();
          if (b.right - t.right < 300) {
            setMarks((m) => (m.length ? [] : m));
            return;
          }
          const out = Object.entries(citeEls.current)
            .filter(([, el]) => el && el.isConnected)
            .map(([id, el]) => {
              const rs = el.getClientRects();
              const r = rs[rs.length - 1] || el.getBoundingClientRect();
              return {
                id,
                y: r.top - b.top + r.height / 2,
                raw: rawOf.current[id],
              };
            })
            .sort((p, q) => p.y - q.y);
          for (let k = 1; k < out.length; k++)
            out[k].y = Math.max(out[k].y, out[k - 1].y + 30);
          const x0 = t.right - b.left + 24;
          setMarks(out.map((m) => ({ ...m, x0, x1: x0 + 40 })));
        }, [step, style, boxW, typed]);

        const cite = (c, id, flash = false) => (
          <button

            ref={(el) => {
              citeEls.current[id] = el;

            }}
            type="button"
            aria-label={`Citation: ${PAPERS[c.key].inText} ${PAPERS[c.key].year}. Show the full reference.`}
            onMouseEnter={() => setHover(id)}
            onMouseLeave={() => setHover(null)}
            onFocus={() => setHover(id)}
            onBlur={() => setHover(null)}
            className={
              "text-cite decoration-cite/40 hover:decoration-cite cursor-pointer underline underline-offset-[3px] " +
              (flash ? "a-flash" : "")
            }

            {inText(c.key, { style, locator: c.locator, order })}

        );

        const typingEl = (el) => {
          typingRef.current = el;
          citeEls.current["c-haraway1988"] = el;

        let typing;
        if (step <= 2)
          typing = (
            <span ref={typingEl} className="relative">
              {typed}
              {inView && <span className="a-caret" />}

              <span className="bg-ground px-0.5 text-muted">
                [@haraway1988, p. 581]
              </span>
              {inView && <span className="a-caret" />}
            </span>
          );
        else
          typing = cite(
            { key: "haraway1988", locator: "p. 581" },
            "c-haraway1988",
            step === 4,
          );

        return (
          <A_Sheet
            label="Manuscript"
            note="Try it: hover a citation, change the style"
          >
            <div ref={ref}>
              <A_Pane
                title={`${DRAFT.title}.md`}
                icon="FileText"
                right={
                  <span className="hidden text-[11px] sm:inline">
                    Live Preview
                  </span>
                }
              >
                <div className="border-line flex flex-wrap items-center justify-between gap-3 border-b px-5 py-2.5 sm:px-10">
                  <A_StylePicker style={style} setStyle={setStyle} />
                  <span className="a-label text-muted">Type [@ to cite</span>
                </div>
                <div
                  ref={boxRef}
                  className="relative px-5 pt-8 pb-40 sm:px-10 lg:px-16"
                >
                  {marks.length > 0 && (
                    <div aria-hidden="true">
                      <div
                        className="border-line absolute top-9 border-l pl-4"
                        style={{ left: marks[0].x1 - 17, bottom: 40 }}
                      >
                        <div className="a-label text-muted">What you type</div>
                        <div className="mt-1 max-w-[16rem] text-[13px] leading-[1.45] text-muted">
                          The note keeps plain citation keys. You read formatted
                          citations.
                        </div>
                      </div>
                      {marks.map((m) => {
                        const on = pop === m.id;
                        return (
                          <Fragment key={m.id}>
                            <span
                              className="border-accent/70 absolute h-px border-t border-dashed"
                              style={{
                                left: m.x0,
                                width: m.x1 - m.x0 - 6,
                                top: m.y,
                              }}
                            />
                            <span
                              className="bg-accent absolute size-[5px] -translate-y-1/2 rounded-full"
                              style={{ left: m.x0 - 2, top: m.y + 0.5 }}
                            />
                            <span
                              className={
                                "absolute -translate-y-1/2 px-1 font-mono text-[12.5px] whitespace-nowrap transition-colors " +
                                (on ? "bg-accent/10 text-ink" : "text-muted")
                              }
                              style={{ left: m.x1, top: m.y }}
                            >
                              {m.raw}
                            </span>
                          </Fragment>

                      })}

                  <div ref={textRef} className="max-w-[40rem]">

      // ---------- 06 See how your sources connect: graph and References Sidebar ----------
      function A_DemoGraph() {
        const ref = useRef(null);
        const inView = useInView(ref, { threshold: 0.35 });
        const { motion } = useProtoState();
        const total = GRAPH.edges.length;
        const [n, setN] = useState(motion ? 0 : total);
        const [picked, setPicked] = useState(null);
        useEffect(() => {
          if (!motion) {
            setN(total);
            return;
          }
          if (!inView || n >= total) return;
          const id = setInterval(
            () => setN((x) => Math.min(total, x + 1)),
            110,
          );
          return () => clearInterval(id);
        }, [inView, motion, n >= total]);
        const refs = aRefOrder(NOTES[0].cites, "apa");
        const idx = useLoop(2000, refs.length, {
          active: inView && !picked && n >= total,
          start: refs.indexOf("haraway1988"),
        });
        const active = picked || (n >= total ? refs[idx] : null);
        const pick = (id) => setPicked((p) => (p === id ? null : id));
        return (
          <A_Sheet
            label="Citation graph"
            note="Try it: select a paper or a reference"
          >
            <div ref={ref} className="grid lg:grid-cols-[1fr_380px]">
              <A_Pane
                title="Graph view"
                icon="Waypoints"
                className="border-line lg:border-r"
              >
                <div className="px-2 pt-2 sm:px-6 sm:pt-4">
                  <A_GraphSvg
                    active={active}
                    drawn={n / total}
                    onPick={pick}
                    className="block h-auto w-full"
                  />
                </div>
                <div className="border-line flex flex-wrap gap-x-5 gap-y-1.5 border-t px-4 py-2.5 text-[12.5px] text-muted">
                  <span className="flex items-center gap-1.5">
                    <span className="bg-ink inline-block size-2.5 rounded-full" />
                    Your note
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="bg-accent inline-block size-2.5 rounded-full" />
                    Literature note
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="inline-block size-2.5 rounded-full border border-dashed border-muted" />
                    Cited, no note yet
                  </span>
                  <span className="flex items-center gap-1.5">

      function A_DemoAgent() {
        const ref = useRef(null);
        const boxRef = useRef(null);
        const inView = useInView(ref, { threshold: 0.5 });
        const { motion } = useProtoState();
        const all = AGENT_SESSION.length;
        const [shown, setShown] = useState(motion ? 1 : all);
        useEffect(() => {
          if (!motion) {
            setShown(all);
            return;
          }
          if (!inView || shown >= all) return;
          const t = setTimeout(() => setShown((x) => x + 1), 1200);
          return () => clearTimeout(t);
        }, [inView, motion, shown]);
        useEffect(() => {
          const b = boxRef.current;
          if (b) b.scrollTop = b.scrollHeight;
        }, [shown]);
        return (
          <A_Sheet label="AI assistant skills" note={FACTS.agents.join(" · ")}>
            <div ref={ref}>
              <div
                ref={boxRef}
                className="a-scroll flex h-[420px] min-w-0 flex-col gap-2.5 overflow-y-auto p-4"
              >
                {AGENT_SESSION.slice(0, shown).map((m, mi) => {
                  if (m.who === "user")
                    return (
                      <div
                        key={mi}
                        className="border-line bg-ground ml-10 self-end border px-3 py-2 text-[14px] leading-[1.45]"
                      >
                        {m.text}
                      </div>
                    );
                  if (m.who === "agent")
                    return (
                      <div
                        key={mi}
                        className="mr-6 flex min-w-0 gap-2 text-[14px] leading-[1.5]"
                      >
                        <A_Ico
                          n="Bot"
                          size={16}
                          className="text-accent2 mt-0.5 shrink-0"
                        />
                        <span className="min-w-0">{m.text}</span>
                      </div>
                    );
                  if (m.who === "edit")
                    return (
                      <div
                        key={mi}
                        className="border-line border font-mono text-[11.5px]"
                      >
                        <div className="border-line border-b px-2.5 py-1 text-muted">

                          <div

                            className="bg-z-green/15 px-2.5 whitespace-pre"
                          >
                            {d}
                          </div>
                        ))}
                      </div>
                    );
                  const check = m.cmd.includes("template-check");
                  return (
                    <div
                      key={mi}
                      className={
                        "border px-2.5 py-1.5 font-mono text-[11.5px] " +
                        (check
                          ? "border-accent2/60 bg-accent2/5"

                        }

                        {m.out}
                      </div>
                    </div>
                  );
                })}

          const f = () => setDark(m.matches);
          m.addEventListener("change", f);
          return () => m.removeEventListener("change", f);
        }, []);
        return dark;
      }

      function bBrand(dark) {
        return dark
          ? {
              ink: "#D8E2F0",
              accent: "#F0793F",
              markInk: "#D8E2F0",
              markAccent: "#F0793F",
            }
          : {
              ink: "#1E3A5F",
              accent: "#E8622C",
              markInk: "#1E3A5F",
              markAccent: "#E8622C",
            };
      }

      // True once ms have passed since mount; true at once when motion is off.
      function B_useAfter(ms) {
        const { motion } = useProtoState();
        const [on, setOn] = useState(!motion);
        useEffect(() => {
          if (!motion) {
            setOn(true);
            return;
          }
          setOn(false);
          const t = setTimeout(() => setOn(true), ms);
          return () => clearTimeout(t);
        }, [ms, motion]);
        return on;
      }

      // Fade-and-slide in on mount. Lands at once when motion is off.
      function B_In({
        as = "div",
        delay = 0,
        x = 0,
        y = 8,
        scale = 1,
        rotate = 0,
        dur = 0.5,
        className = "",
        style,
        children,
      }) {
        const { motion } = useProtoState();
        const C = as === "span" ? Motion.motion.span : Motion.motion.div;
        return (
          <C
            className={className}
            style={style}
            initial={motion ? { opacity: 0, x, y, scale, rotate } : false}
            animate={{ opacity: 1, x: 0, y: 0, scale: 1, rotate: 0 }}
            transition={{ duration: dur, delay, ease: [0.22, 0.8, 0.3, 1] }}
          >
            {children}
          </C>
        );
      }

      function B_Caret() {
        const { motion } = useProtoState();
        return (
          <span
            aria-hidden="true"
            className="b-caret bg-ink ml-px inline-block h-[1.05em] w-[1.5px] align-[-0.15em]"
            style={{ animationPlayState: motion ? "running" : "paused" }}
          />
        );
      }

      function bMark(text, q) {
        if (!q) return text;
        const i = text.toLowerCase().indexOf(q.toLowerCase());
        if (i < 0) return text;
        return (
          <>
            {text.slice(0, i)}
            <mark className="bg-accent2/20 text-ink rounded-[2px]">
              {text.slice(i, i + q.length)}
            </mark>
            {text.slice(i + q.length)}
          </>
        );
      }

      function bGreek(seed, n, cls = "bg-ink/15") {
        return Array.from({ length: n }, (_, i) => (
          <span
            key={seed + "-" + i}
            className={
              "mr-[5px] inline-block h-[5px] rounded-full align-middle " + cls
            }
            style={{
              width: Math.round(B_WORDS[(seed + i * 7) % B_WORDS.length] * 0.8),
            }}
          />
        ));
      }

      function B_Cite({ c, style = "apa" }) {
        return (
          <span className="text-cite decoration-cite/40 underline underline-offset-[3px]">

      // Markdown source with [@key] runs, rendered with a per-citation renderer.
      function B_Rich({ src, cite }) {
        return parseCitations(src).map((seg, i) =>
          seg.cite ? (
            <Fragment key={i}>

      function B_GraphFrame() {
        const { motion } = useProtoState();
        const ref = useRef(null);
        const [sz, setSz] = useState({ w: 0, h: 0 });
        useLayoutEffect(() => {
          const el = ref.current;
          if (!el) return;
          const ro = new ResizeObserver(([e]) =>
            setSz({ w: e.contentRect.width, h: e.contentRect.height }),
          );
          ro.observe(el);
          return () => ro.disconnect();
        }, []);
        const focus = B_useAfter(2300);
        const wide = sz.w >= 500;
        const px = wide ? 66 : 36;
        const py = 22;
        const legend = 34;
        const P = (id) => {
          const [nx, ny] = B_GPOS[id];
          return [
            px + nx * (sz.w - 2 * px),
            py + ny * (sz.h - 2 * py - legend),
          ];
        };
        const near = new Set([
          "haraway1988",
          ...citedBy("haraway1988").map((n) => n.id),
        ]);
        const citers = citedBy("haraway1988")
          .map((n) => B_GSHORT[n.id])
          .join(" and ");
        return (
          <div ref={ref} className="absolute inset-0">
            {sz.w > 0 ? (
              <svg
                width={sz.w}
                height={sz.h}
                className="block"
                role="img"
                aria-label="Graph view: notes linked to the papers they cite"
              >
                {GRAPH.edges.map((e, i) => {
                  const [x1, y1] = P(e.from);
                  const [x2, y2] = P(e.to);
                  const cite = e.kind === "citation";
                  const hot = focus && cite && e.to === "haraway1988";
                  const dim = focus && !hot;
                  const op = dim ? 0.16 : hot ? 0.95 : cite ? 0.5 : 0.45;
                  if (!cite)
                    return (
                      <Motion.motion.line
                        key={i}
                        x1={x1}
                        y1={y1}
                        x2={x2}
                        y2={y2}
                        stroke="var(--muted)"
                        strokeWidth={1.2}
                        strokeDasharray="3 4"
                        initial={motion ? { opacity: 0 } : false}
                        animate={{ opacity: op }}
                        transition={{ duration: 0.6, delay: focus ? 0 : 1.2 }}
                      />
                    );
                  return (
                    <Motion.motion.path
                      key={i}
                      d={"M" + x1 + " " + y1 + " L" + x2 + " " + y2}
                      fill="none"
                      stroke="var(--cite)"
                      strokeWidth={hot ? 2.2 : 1.2}
                      strokeLinecap="round"
                      initial={motion ? { pathLength: 0, opacity: 0 } : false}
                      animate={{ pathLength: 1, opacity: op }}
                      transition={{
                        pathLength: { duration: 0.6, delay: 0.2 + i * 0.06 },
                        opacity: {
                          duration: 0.4,
                          delay: focus ? 0 : 0.2 + i * 0.06,
                        },
                      }}
                    />
                  );
                })}
                {GRAPH.nodes.map((n, i) => {
                  const [x, y] = P(n.id);
                  const isF = n.id === "haraway1988";
                  const r =
                    n.kind === "note"
                      ? 6.5
                      : isF && focus
                        ? 8
                        : n.kind === "literature"
                          ? 5.5
                          : 5;
                  const label =
                    n.kind === "note"
                      ? wide
                        ? n.label
                        : B_GSHORT[n.id]
                      : n.label;
                  const showLabel = wide || n.kind === "note" || isF;
                  const dim = focus && !near.has(n.id);
                  return (
                    <Motion.motion.g
                      key={n.id}
                      initial={motion ? { opacity: 0 } : false}
                      animate={{ opacity: dim ? 0.55 : 1 }}
                      transition={{
                        duration: 0.4,
                        delay: focus ? 0 : 0.05 + i * 0.04,
                      }}
                    >
                      {isF && focus ? (
                        <circle
                          cx={x}
                          cy={y}
                          r={16}
                          fill="var(--cite)"
                          opacity={0.16}
                        />
                      ) : null}
                      <circle
                        cx={x}
                        cy={y}
                        r={r}
                        fill={
                          n.kind === "note"
                            ? "var(--ink)"
                            : n.kind === "literature"
                              ? "var(--cite)"
                              : "var(--surface)"
                        }
                        stroke={
                          n.kind === "cited" ? "var(--muted)" : "var(--surface)"
                        }
                        strokeWidth={n.kind === "cited" ? 1.2 : 1.5}
                        strokeDasharray={n.kind === "cited" ? "2 2" : undefined}
                      />
                      {showLabel ? (
                        <text
                          x={x}
                          y={y + r + 13}
                          textAnchor="middle"
                          fontSize={n.kind === "note" ? 11.5 : 10.5}
                          fontWeight={n.kind === "note" || isF ? 600 : 400}
                          fill={
                            n.kind === "cited" ? "var(--muted)" : "var(--ink)"
                          }
                          stroke="var(--surface)"
                          strokeWidth={3}
                          paintOrder="stroke"
                          style={{ fontFamily: "var(--font-body)" }}
                        >
                          {label}
                        </text>
                      ) : null}
                      {isF && focus ? (
                        <text
                          x={x}
                          y={y + r + 26}
                          textAnchor="middle"
                          fontSize={10.5}
                          fill="var(--cite)"
                          stroke="var(--surface)"
                          strokeWidth={3}
                          paintOrder="stroke"
                          style={{ fontFamily: "var(--font-body)" }}
                        >
                          {"Cited by " + citers}
                        </text>
                      ) : null}
                    </Motion.motion.g>
                  );
                })}
              </svg>
            ) : null}
            <div className="absolute right-3 bottom-2.5 left-3 flex flex-wrap gap-x-4 gap-y-1 text-[10.5px] text-muted">
              <span className="inline-flex items-center gap-1.5">
                <span className="bg-ink size-2.5 rounded-full" />
                Your notes
              </span>
              <span className="inline-flex items-center gap-1.5">
                <span className="bg-cite size-2.5 rounded-full" />

                <span className="size-2.5 rounded-full border border-dashed border-muted" />
                Cited, no note yet
              </span>
            </div>
          </div>
        );
      }

      function VariantB() {
        const { motion } = useProtoState();
        const dark = B_useDark();
        const [task, setTask] = useState(0);
        const [step, setStep] = useState(motion ? 0 : 2);
        const [picked, setPicked] = useState(false);
        const [run, setRun] = useState(0);
        const [epoch, setEpoch] = useState(0);
        const deskRef = useRef(null);
        const stageRef = useRef(null);
        const inView = useInView(stageRef, { threshold: 0.25 });
        const playing = motion && inView;
        const wasPlaying = useRef(false);

        // Replay the current step when the stage comes back into view.
        useEffect(() => {
          if (playing && !wasPlaying.current) setEpoch((e) => e + 1);
          wasPlaying.current = playing;
        }, [playing]);

        // With motion off, rest on the finished frame.
        useEffect(() => {
          if (!motion) setStep(2);
        }, [motion]);

        // The stage clock: three steps per task; then the next task, or the same one when picked.
        useEffect(() => {
          if (!playing) return;
          const t = setTimeout(() => {
            if (step < 2) setStep(step + 1);
            else {
              if (!picked) setTask((x) => (x + 1) % B_TASKS.length);
              setStep(0);
              setRun((r) => r + 1);
            }
          }, B_STEP_MS);
          return () => clearTimeout(t);
        }, [playing, step, picked, task, run, epoch]);

        const pick = (i) => {
          setTask(i);
          setPicked(true);
          setStep(motion ? 0 : 2);
          setRun((r) => r + 1);
        };
        const goStep = (k) => {
          setStep(k);
          setPicked(true);
        };
        const show = ({ task: t, step: s }) => {
          setTask(t);
          setStep(s);
          setPicked(true);
          setRun((r) => r + 1);
          const el = deskRef.current;
          if (el) {
            const top = el.getBoundingClientRect().top + window.scrollY;
            window.scrollTo({ top, behavior: motion ? "smooth" : "auto" });
          }
        };

        return (
          <div
            data-v="B"
            className="bg-ground text-ink font-body min-h-screen overflow-x-clip pb-24"
          >
            <style>{B_CSS}</style>
            <B_Header dark={dark} />
            <main>
              <B_Hero />
              <B_Desk
                task={task}
                step={step}
                picked={picked}
                playing={playing}
                motion={motion}
                sceneKey={task + "-" + run + "-" + epoch}
                barKey={
                  task + "-" + step + "-" + run + "-" + epoch + "-" + playing
                }
                onPick={pick}
                onStep={goStep}
                onPin={setPicked}
                deskRef={deskRef}
                stageRef={stageRef}
              />
              <B_Index onShow={show} />
              <B_Install />
            </main>
            <B_Footer dark={dark} />
          </div>
        );
      }

      const C_ORDER = [

      function cInText(key, style, locator) {
        if (style === "ieee") {
          const n = C_ORDER.indexOf(key) + 1;
          return locator ? `[${n}, ${locator}]` : `[${n}]`;
        }
        return inText(key, { style, locator });
      }
      function cStop(t) {
        return /[?!]$/.test(t) ? "" : ".";
      }
      function cName(full) {
        const parts = full.split(" ");
        const last = parts.pop();
        return { first: parts.join(" "), last };
      }
      function cAnd(list, serial) {
        if (list.length <= 1) return list.join("");
        if (list.length === 2)
          return `${list[0]}${serial ? "," : ""} and ${list[1]}`;
        return `${list.slice(0, -1).join(", ")}, and ${list[list.length - 1]}`;
      }
      function C_Ref({ k, style }) {
        const p = PAPERS[k];
        const cut = p.apaAuthors.includes("…");
        if (style === "chicago") {
          const names = p.creators.map((c, i) => {
            if (i) return c;
            const n = cName(c);
            return `${n.last}, ${n.first}`;
          });
          const who = cut ? `${names.join(", ")}, et al.` : cAnd(names, true);
          const head = `${who}${who.endsWith(".") ? "" : "."} ${p.year}. `;
          if (p.type === "book")
            return (
              <span>
                {head}
                <i>{p.title}</i>
                {cStop(p.title)} {p.publisher}.
              </span>
            );
          const q = `“${p.title}${cStop(p.title)}”`;
          if (p.type === "preprint")
            return (
              <span>
                {head}
                {q} <i>{p.container}</i>. https://doi.org/{p.doi}.
              </span>
            );
          if (p.type === "conferencePaper")
            return (
              <span>
                {head}
                {q} In <i>{p.container}</i>, {p.pages}.
              </span>
            );
          return (
            <span>
              {head}
              {q} <i>{p.container}</i> {p.volume} ({p.issue}): {p.pages}.
            </span>
          );
        }
        if (style === "ieee") {
          const ini = (c) => {
            const n = cName(c);
            const firsts = n.first
              .split(/[\s-]+/)
              .filter(Boolean)
              .map((w) => w[0] + ".")
              .join(" ");
            return `${firsts} ${n.last}`;
          };
          const names = p.creators.map(ini);
          const who =
            cut || names.length > 6 ? `${names[0]} et al.` : cAnd(names, false);
          const t = p.titleSentence;
          const q = `“${t}${/[?!]$/.test(t) ? "" : ","}”`;
          const num = C_ORDER.includes(k) ? `[${C_ORDER.indexOf(k) + 1}] ` : "";

          if (p.type === "conferencePaper")

              <span>
                {num}
                {who}, {q} in <i>{p.container}</i>, {p.year}, pp. {p.pages}.

              {who}, {q} <i>{p.container}</i>, vol. {p.volume}, no. {p.issue},

      function C_HeroStage() {
        const { motion } = useProtoState();
        const stageRef = useRef(null);

        const [ready, setReady] = useState(false);
        const [run, setRun] = useState(0);
        const [phase, setPhase] = useState(motion ? 1 : 3);
        useEffect(() => {
          let live = true;
          const fonts = document.fonts
            ? document.fonts.ready
            : Promise.resolve();
          fonts.then(() => live && setReady(true));
          return () => {
            live = false;
          };
        }, []);
        useEffect(() => {
          if (!motion) {
            setPhase(3);
            return;
          }
          setPhase(1);
          if (!seen || !ready) return;
          const ts = [
            setTimeout(() => setPhase(2), 1200),
            setTimeout(() => setPhase(3), 2300),
          ];
          return () => ts.forEach(clearTimeout);
        }, [motion, run, seen, ready]);
        const after = phase >= 2;
        const swap = (on, delay) => ({
          opacity: on ? 1 : 0,
          transform: on ? "none" : "translateY(" + (delay ? 18 : -18) + "px)",

      // ---------- Demo: Cite while you write (signature) ----------
      function C_DemoCite() {
        const ref = useRef(null);

        const inView = useInView(ref, { threshold: 0.35 });
        const [style, setStyle] = useState("apa");
        const [hover, setHover] = useState(null);
        const [touched, setTouched] = useState(false);
        const DUR = [1300, 420, 240, 240, 240, 240, 1000, 1100, 900, 5200];
        const LAST = DUR.length - 1;
        const tl = useTimeline(DUR, { active: inView && !touched });
        const step = touched ? LAST : tl;
        const TYPED = ["", "[@", "[@h", "[@ha", "[@har", "[@hara", "[@hara"];
        const suggest = step >= 1 && step <= 6;
        const q = suggest ? TYPED[step].slice(2) : "";
        const inNote = ["bommasani2021", "vaswani2017", "bender2021"];
        const cands = PAPER_KEYS.filter((k) => !q || k.includes(q))
          .sort(
            (x, y) =>
              (inNote.includes(y) ? 1 : 0) - (inNote.includes(x) ? 1 : 0),
          )
          .slice(0, 4);
        const popKey = hover || (step === LAST ? "haraway1988" : null);
        const anchorKey = suggest ? "__suggest" : popKey;
        const [pos, setPos] = useState(null);
        useLayoutEffect(() => {
          const measure = () => {
            const el = anchorKey && anchors.current[anchorKey];
            const box = boxRef.current;
            if (!el || !box) {
              setPos(null);
              return;
            }
            const r = el.getBoundingClientRect();
            const b = box.getBoundingClientRect();
            const w = Math.min(380, b.width - 16);
            const left = Math.max(
              8,
              Math.min(r.left - b.left, b.width - w - 8),
            );
            setPos({ left, top: r.bottom - b.top + 8, w });
          };
          measure();
          window.addEventListener("resize", measure);
          return () => window.removeEventListener("resize", measure);
        }, [anchorKey, step, style]);
        const cite = (key, locator, i) => (
          <button
            key={i}
            type="button"
            ref={(el) => (anchors.current[key] = el)}
            onMouseEnter={() => {
              setHover(key);
              setTouched(true);
            }}
            onMouseLeave={() => setHover(null)}
            onFocus={() => {
              setHover(key);
              setTouched(true);
            }}
            onBlur={() => setHover(null)}
            className={
              "text-cite whitespace-nowrap underline decoration-1 underline-offset-[3px] " +
              (popKey === key && !suggest ? "bg-accent/12" : "")
            }
          >
            {cInText(key, style, locator)}

        const segs0 = parseCitations(DRAFT.source[0]);

            >
              <div
                ref={boxRef}
                className="relative min-h-[380px] px-5 pt-7 pb-28 sm:min-h-[400px] sm:px-12 sm:py-10"
              >
                <h3 className="text-[22px] leading-tight font-bold sm:text-[26px]">
                  {DRAFT.heading}
                </h3>
                <p className="mt-4 max-w-[62ch] text-[16px] leading-[1.7] sm:text-[19px]">
                  {segs0.map((s, i) => {
                    if (s.text != null) {
                      if (i === segs0.length - 1 && step < 8) return null;
                      return <span key={i}>{s.text}</span>;
                    }
                    if (s.cite.key === "haraway1988" && step <= 6)
                      return (
                        <span
                          key={i}
                          ref={(el) => (anchors.current.__suggest = el)}
                          className="font-mono text-[0.85em] text-muted"
                        >
                          {TYPED[step]}
                          <C_Caret />
                        </span>
                      );
                    if (s.cite.key === "haraway1988" && step === 7)
                      return (
                        <span
                          key={i}
                          className="font-mono text-[0.85em] text-muted"
                        >
                          {s.cite.raw}
                          <C_Caret />
                        </span>
                      );
                    return cite(s.cite.key, s.cite.locator, i);
                  })}
                </p>
                <p className="mt-4 max-w-[62ch] text-[16px] leading-[1.7] sm:text-[19px]">
                  {segs1.map((s, i) =>
                    s.text != null ? (
                      <span key={i}>{s.text}</span>

      function C_DemoConnections() {
