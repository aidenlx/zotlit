      // ---------- The desk and the window it becomes ----------
      // Drawing units: the assembled Obsidian window is 960 x 600, and the desk is centred on it,
      // so one projection draws both. Two rows of objects: 01 to 04 at the back of the desk,
      // 05 to 08 at the front, so each callout reaches its label with a short leader.
      const F_RX = 53; // tilt (rotateX, degrees)
      const F_RZ = -38; // turn (rotateZ, degrees)
      const F_GAP_WIDE = 92; // how far apart the parts float, desktop
      const F_GAP_NARROW = 124; // phones have more height than width: a taller stack
      const F_OBJ_S = 0.72; // D's objects, at this scale on the desk
      const F_DESK = { x: -120, y: -27.5, w: 1200, h: 655, r: 0 };
      const F_DESK_T = 16; // desk thickness
      const F_WINDOW = { x: 0, y: 0, w: 960, h: 600, r: 0 };
      const F_BLOTTER = { x: 540, y: 12, w: 636, h: 326 }; // from the desk's top-left corner
      // Where each object lies: its box's top-left corner from the desk's top-left corner.
      const F_DESK_AT = {
        connect: { x: 40, y: 34, r: -3 },
        find: { x: 314, y: 30, r: 2 },
        read: { x: 562, y: 24, r: -4 },
        notes: { x: 872, y: 50, r: 3 },
        cite: { x: 32, y: 352, r: 4 },
        connections: { x: 272, y: 427, r: -1.5 },
        export: { x: 626, y: 463, r: 3 },
        customise: { x: 857, y: 400, r: -2 },
      };
      function fDeskRect(job) {
        const at = F_DESK_AT[job];
        const [, , vw, vh] = F_OBJ[job].vb;
        return {
          x: F_DESK.x + at.x,
          y: F_DESK.y + at.y,
          w: vw * F_OBJ_S,
          h: vh * F_OBJ_S,
          r: at.r,
        };
      }
      // One part per job, in JOBS order. level: how high the part floats when lifted apart
      // (0 = the window itself, -1 = under the desk). slot: its place in the assembled window.
      const F_PARTS = [
        {
          job: "connect",
          obj: "File box",
          layer: "Zotero library",
          level: 0,
          slot: { x: 0, y: 0, w: 960, h: 600 },
        },
        {
          job: "find",
          obj: "Books",
          layer: "Library View",
          level: 1,
          slot: { x: 44, y: 40, w: 180, h: 528 },
        },
        {
          job: "read",
          obj: "Open paper",
          layer: "PDF reader",
          level: 2,
          slot: { x: 232, y: 40, w: 250, h: 528 },
        },
        {
          job: "notes",
          obj: "Notebook",
          layer: "Literature note",
          level: 3,
          slot: { x: 490, y: 308, w: 250, h: 260 },
        },
        {
          job: "cite",
          obj: "Manuscript",
          layer: "Live Preview",
          level: 4,
          slot: { x: 490, y: 40, w: 250, h: 260 },
        },
        {
          job: "connections",
          obj: "Pinboard",
          layer: "Citation graph",
          level: 5,
          slot: { x: 748, y: 40, w: 204, h: 528 },
        },
        {
          job: "export",
          obj: "Out tray",
          layer: "Export dialog",
          level: 6,
          slot: { x: 252, y: 372, w: 214, h: 150 },
        },
        {
          job: "customise",
          obj: "Laptop",
          layer: "Machine room",
          level: -1,
          slot: { x: 40, y: 30, w: 880, h: 540 },
        },
      ].map((P, i) => ({ ...P, row: i < 4 ? 0 : 1, desk: fDeskRect(P.job) }));
      const fPart = (job) => F_PARTS.find((P) => P.job === job);

      function fRectLerp(a, b, t) {
        return {
          x: fLerp(a.x, b.x, t),
          y: fLerp(a.y, b.y, t),
          w: fLerp(a.w, b.w, t),
          h: fLerp(a.h, b.h, t),
          r: fLerp(a.r || 0, b.r || 0, t),
        };
      }

      // p = 0: the desk. About 0.45: each object has lifted and become its part, floating
      // apart. 1: the parts have locked into one face-on window.
      function fSceneState(p, gap) {
        const turn = fEase(fSeg(p, 0.55, 0.88));
        const deskK = fSeg(p, 0.06, 0.22);
        const parts = F_PARTS.map((P, i) => {
          const s0 = 0.04 + i * 0.03;
          const t = fEase(fSeg(p, s0, s0 + 0.16));
          const L = P.level;
          const l0 = L <= 0 ? 0.56 : 0.5 + (L - 1) * 0.035;
          const k = fEase(fSeg(p, l0, l0 + 0.2));
          let z;
          if (L === 0) z = 1;
          else if (L < 0) z = fLerp(fLerp(2, -gap, t), -1, k);
          else z = 2 + i * 0.3 + L * gap * t * (1 - k);
          const sw = fSeg(t, 0.3, 0.7);
          return {
            P,
            i,
            t,
            rect: fRectLerp(P.desk, P.slot, t),
            z,
            lifted: Math.abs(L * gap * t * (1 - k)) > 4,
            artO: 1 - sw,
            paneO: sw,
            shadeO: 1 - fSeg(t, 0, 0.25),
          };
        });
        return {
          rx: F_RX * (1 - turn),
          rz: F_RZ * (1 - turn),
          flat: turn >= 0.999,
          parts,
          desk: fRectLerp(F_DESK, F_WINDOW, deskK),
          deskO: 1 - deskK,
          floorO: fSeg(p, 0.12, 0.22) * (1 - fSeg(p, 0.62, 0.86)),
        };
      }

      // Screen position (drawing units from the window centre) of a point on a part.
      function fPoint(rect, u, v, z, st) {
        const a = ((rect.r || 0) * Math.PI) / 180;
        const dx = u - rect.w / 2;
        const dy = v - rect.h / 2;
        const x = rect.x + rect.w / 2 + dx * Math.cos(a) - dy * Math.sin(a);
        const y = rect.y + rect.h / 2 + dx * Math.sin(a) + dy * Math.cos(a);
        return fProject(x - 480, y - 300, z, st.rx, st.rz);
      }
      // Where a part's callout leader starts, in the part's own units: on the object while it
      // lies on the desk, at the screen-right corner of its layer once lifted.
      function fAnchorUV(q) {
        const r = q.rect;
        const L = q.P.level;
        const to = L === 0 ? [250, r.h] : L < 0 ? [0.2 * r.w, r.h] : [r.w, r.h];
        const from = [0.5 * r.w, (q.P.row === 0 ? 0.42 : 0.6) * r.h];
        return [fLerp(from[0], to[0], q.t), fLerp(from[1], to[1], q.t)];
      }
      function fBBox(st) {
        const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
        const add = (r, z) =>
          [
            [0, 0],
            [r.w, 0],
            [r.w, r.h],
            [0, r.h],
          ].forEach(([u, v]) => {
            const [X, Y] = fPoint(r, u, v, z, st);
            b.x0 = Math.min(b.x0, X);
            b.x1 = Math.max(b.x1, X);
            b.y0 = Math.min(b.y0, Y);
            b.y1 = Math.max(b.y1, Y);
          });
        if (st.deskO > 0.01) add(st.desk, 0);
        st.parts.forEach((q) => add(q.rect, q.z));
        return b;
      }
      function fFit(bb, r) {
        const s = Math.min(r.w / (bb.x1 - bb.x0), r.h / (bb.y1 - bb.y0));
        return {
          s,
          cx: r.x + r.w / 2 - (s * (bb.x0 + bb.x1)) / 2,
          cy: r.y + r.h / 2 - (s * (bb.y0 + bb.y1)) / 2,
        };
      }

      // The desk top: D's desk colour and blotter, with a thin edge to give it thickness.
      function F_DeskTop() {
        const b = F_BLOTTER;
        return (
          <svg
            viewBox={`0 0 ${F_DESK.w} ${F_DESK.h}`}
            preserveAspectRatio="none"
            className="absolute inset-0 h-full w-full"
            aria-hidden="true"
          >
            <rect
              x="1"
              y="1"
              width={F_DESK.w - 2}
              height={F_DESK.h - 2}
              fill="var(--f-desk)"
              stroke="var(--f-edge)"
              strokeWidth="2"
            />
            <rect
              x={b.x}
              y={b.y}
              width={b.w}
              height={b.h}
              rx="10"
              fill="var(--f-navy)"
            />
            <rect
              x={b.x + 16}
              y={b.y + 16}
              width={b.w - 32}
              height={b.h - 32}
              rx="4"
              fill="none"
              stroke="var(--f-stitch)"
              strokeWidth="2"
              strokeDasharray="10 8"
            />
          </svg>
        );
      }

      const F_DRAWING_LABEL =
        "Isometric drawing of a research desk with eight objects: a file box, books with a magnifier, an open paper with a highlighter, a notebook, a manuscript on a clipboard, a pinboard with string, an out tray, and a laptop with a toolbox. As you scroll, each object lifts off the desk, becomes its part of Obsidian, and the parts lock into one window.";

      // The drawing at progress p. region(W, H) is the box the drawing fits. labels: "side"
      // (leader callouts that link to each job), "balloon" (numbers only) or "none".
      function F_Drawing({
        p = 0,
        gap = F_GAP_WIDE,
        region,
        labels = "side",
        labelsOpacity = 1,
        labelMinX = 0,
        idle = false,
        className = "",
        style,
      }) {
        const ref = useRef(null);
        const { w: W, h: H } = useFSize(ref);
        const { motion } = useProtoState();
        const st = fSceneState(p, gap);
        const panes = useMemo(
          () =>
            Object.fromEntries(
              Object.entries(F_SCENE_CONTENT).map(([id, C]) => [id, <C />]),
            ),
          [],
        );
        const paperAnim = !motion ? "off" : idle ? "run" : "pause";
        const arts = useMemo(
          () =>
            Object.fromEntries(
              F_PARTS.map((P) => [
                P.job,
                <F_ObjArt
                  id={P.job}
                  anim={P.job === "read" ? paperAnim : "off"}
                />,
              ]),
            ),
          [paperAnim],
        );
        let cam = null;
        let bb = null;
        if (W > 0 && H > 0) {
          bb = fBBox(st);
          cam = fFit(bb, region(W, H));
        }
        const order = [...st.parts].sort((a, b) => a.P.level - b.P.level);
        // The desk edge (back edge for row 0, front edge for row 1) straight above or below a
        // screen x, in drawing units: where a desk callout's leader ends.
        const rad = (st.rz * Math.PI) / 180;
        const edgeY = (row, X) => {
          const yy = (row === 0 ? F_DESK.y : F_DESK.y + F_DESK.h) - 300;
          const xx = (X + yy * Math.sin(rad)) / Math.cos(rad);
          return fProject(xx, yy, row === 0 ? 0 : -F_DESK_T, st.rx, st.rz)[1];
        };
        // The order of the label column: top to bottom as the anchors sit once lifted apart.
        const sideOrder = useMemo(() => {
          const ex = fSceneState(0.45, gap);
          return ex.parts
            .map((q) => [q.P.job, fPoint(q.rect, ...fAnchorUV(q), q.z, ex)[1]])
            .sort((a, b) => a[1] - b[1])
            .map(([job]) => job);
        }, [gap]);
        const anchors = cam
          ? st.parts.map((q) => {
              const r = q.rect;
              const [X, Y] = fPoint(r, ...fAnchorUV(q), q.z, st);
              return {
                P: q.P,
                i: q.i,
                t: q.t,
                x: cam.cx + cam.s * X,
                y: cam.cy + cam.s * Y,
                ey: cam.cy + cam.s * edgeY(q.P.row, X),
                swap: q.paneO,
              };
            })
          : [];
        const dk = st.desk;
        const T = F_DESK_T;
        return (
          <div
            ref={ref}
            className={
              (className.includes("absolute") ? "" : "relative ") +
              "overflow-hidden " +
              className
            }
            style={style}
          >
            {cam && (
              <div
                role="img"
                aria-label={F_DRAWING_LABEL}
                style={{
                  position: "absolute",
                  left: cam.cx - 480,
                  top: cam.cy - 300,
                  width: 960,
                  height: 600,
                  transform: `scale(${cam.s})`,
                  transformOrigin: "480px 300px",
                }}
              >
                <div
                  aria-hidden="true"
                  style={{
                    position: "absolute",
                    inset: 0,
                    transformStyle: st.flat ? "flat" : "preserve-3d",
                    transform: st.flat
                      ? "none"
                      : `rotateX(${st.rx}deg) rotateZ(${st.rz}deg)`,
                    transformOrigin: "480px 300px",
                  }}
                >
                  {st.deskO > 0.01 && (
                    <>
                      <div
                        style={{
                          position: "absolute",
                          left: 0,
                          top: 0,
                          width: dk.w,
                          height: T,
                          opacity: st.deskO,
                          background:
                            "color-mix(in oklab, var(--f-desk) 70%, var(--ink))",
                          transformOrigin: "0 0",
                          transform: `translate3d(${dk.x}px, ${dk.y + dk.h}px, 0) rotateX(-90deg)`,
                        }}
                      />
                      <div
                        style={{
                          position: "absolute",
                          left: 0,
                          top: 0,
                          width: T,
                          height: dk.h,
                          opacity: st.deskO,
                          background:
                            "color-mix(in oklab, var(--f-desk) 82%, var(--ink))",
                          transformOrigin: "0 0",
                          transform: `translate3d(${dk.x}px, ${dk.y}px, 0) rotateY(90deg)`,
                        }}
                      />
                      <div
                        style={{
                          position: "absolute",
                          left: 0,
                          top: 0,
                          width: dk.w,
                          height: dk.h,
                          opacity: st.deskO,
                          transform: `translate3d(${dk.x}px, ${dk.y}px, 0)`,
                        }}
                      >
                        <F_DeskTop />
                      </div>
                    </>
                  )}
                  {order.map((q) => {
                    const P = q.P;
                    const r = q.rect;
                    const showLines = !st.flat && q.lifted && q.t > 0.6;
                    const zTop = q.z;
                    return (
                      <Fragment key={P.job}>
                        {showLines &&
                          [
                            [r.x, r.y + r.h],
                            [r.x + r.w, r.y + r.h],
                            [r.x + r.w, r.y],
                          ].map(([x, y], j) => (
                            <div
                              key={j}
                              style={{
                                position: "absolute",
                                left: 0,
                                top: 0,
                                width: 0,
                                height: Math.abs(zTop),
                                borderLeft: "1px dashed var(--muted)",
                                opacity: 0.7,
                                transformOrigin: "0 0",
                                transform: `translate3d(${x}px, ${y}px, ${zTop < 0 ? zTop : 0}px) rotateX(90deg)`,
                              }}
                            />
                          ))}
                        <div
                          style={{
                            position: "absolute",
                            left: 0,
                            top: 0,
                            width: r.w,
                            height: r.h,
                            "--f-shade-o": q.shadeO,
                            transform: st.flat
                              ? `translate(${r.x}px, ${r.y}px)`
                              : `translate3d(${r.x}px, ${r.y}px, ${q.z}px) rotate(${r.r}deg)`,
                          }}
                        >
                          {q.artO > 0.01 && (
                            <div
                              className="absolute inset-0"
                              style={{ opacity: q.artO }}
                            >
                              {arts[P.job]}
                            </div>
                          )}
                          {q.paneO > 0.01 && (
                            <div
                              style={{
                                position: "absolute",
                                left: 0,
                                top: 0,
                                width: P.slot.w,
                                height: P.slot.h,
                                opacity: q.paneO,
                                transformOrigin: "0 0",
                                transform: `scale(${r.w / P.slot.w}, ${r.h / P.slot.h})`,
                              }}
                            >
                              {panes[P.job]}
                              {P.level === 0 && (
                                <F_SceneFloor opacity={st.floorO} />
                              )}
                            </div>
                          )}
                        </div>
                      </Fragment>
                    );
                  })}
                </div>
              </div>
            )}
            {cam && labels === "side" && labelsOpacity > 0.01 && (
              <F_Callouts
                anchors={anchors}
                W={W}
                H={H}
                lx={Math.min(W - F_LABEL_W - 8, cam.cx + cam.s * bb.x1 + 40)}
                opacity={labelsOpacity}
                minX={labelMinX}
                order={sideOrder}
              />
            )}
            {cam && labels === "balloon" && labelsOpacity > 0.01 && (
              <F_Balloons
                anchors={anchors}
                W={W}
                H={H}
                opacity={labelsOpacity}
              />
            )}
          </div>
        );
      }

      // Leader callouts (desktop). On the desk, each label sits just beyond the desk edge in
      // line with its object: back-row labels above the back edge, front-row labels below the
      // front edge, so each leader is short and none cross. As a part lifts, its label slides
      // out and back in, in A's column right of the stack, renamed for its part of Obsidian.
      // Each label links to its job. The leader carries a halo so it reads above the drawing.
      const F_LABEL_W = 190;
      function F_Callouts({ anchors, W, H, lx, opacity, minX = 0, order }) {
        const live = opacity > 0.5;
        const byJob = Object.fromEntries(anchors.map((a) => [a.P.job, a]));
        const side = {};
        let last = -Infinity;
        order.forEach((job) => {
          side[job] = Math.max(byJob[job].y, last + 46);
          last = side[job];
        });
        const over = last - (H - 32);
        if (over > 0) Object.keys(side).forEach((k) => (side[k] -= over));
        const items = anchors.map((a) => {
          // Fade out on the desk, move while unseen, fade in beside the stack.
          const t = a.t < 0.5 ? 0 : 1;
          const o =
            a.t < 0.35 ? 1 - a.t / 0.35 : a.t > 0.65 ? (a.t - 0.65) / 0.35 : 0;
          const back = a.P.row === 0;
          const ly = side[a.P.job];
          const sy = back ? a.ey - 34 : a.ey + 34;
          const elbow = [fLerp(a.x, lx - 30, t), fLerp(sy, ly, t)];
          const end = [fLerp(a.x, lx - 8, t), fLerp(sy, ly, t)];
          let bx = fLerp(back ? a.x - 10 : a.x + 10, lx, t);
          if (back) bx = Math.max(bx, minX + F_LABEL_W * (1 - t));
          const by = fLerp(back ? sy + 8 : sy - 8, ly - 9, t);
          return { ...a, t, o, back, elbow, end, bx, by };
        });
        return (
          <div
            className="pointer-events-none absolute inset-0"
            style={{ opacity }}
          >
            <svg
              className="absolute inset-0"
              width={W}
              height={H}
              aria-hidden="true"
            >
              {items.map((q) => {
                const path = `M ${q.x} ${q.y} L ${q.elbow[0]} ${q.elbow[1]} L ${q.end[0]} ${q.end[1]}`;
                return (
                  <g key={q.P.job} opacity={q.o}>
                    <path
                      d={path}
                      fill="none"
                      stroke="var(--ground)"
                      strokeOpacity={0.85}
                      strokeWidth={4}
                      strokeLinejoin="round"
                    />
                    <path
                      d={path}
                      fill="none"
                      stroke="var(--accent)"
                      strokeWidth={1}
                    />
                    <circle
                      cx={q.x}
                      cy={q.y}
                      r={3.5}
                      fill="var(--accent)"
                      stroke="var(--ground)"
                      strokeWidth={1.5}
                    />
                  </g>
                );
              })}
            </svg>
            <nav aria-label="The desk, object by object">
              {items.map((q) => {
                const tx = q.back ? -100 * (1 - q.t) : 0;
                const right = q.back && q.t < 0.5;
                const on = live && q.o > 0.5;
                return (
                  <a
                    key={q.P.job}
                    href={`#f-h-${q.P.job}`}
                    tabIndex={on ? 0 : -1}
                    aria-hidden={on ? undefined : "true"}
                    className={
                      "f-callout absolute block " + (right ? "text-right" : "")
                    }
                    style={{
                      left: q.bx,
                      top: q.by,
                      width: F_LABEL_W,
                      opacity: q.o,
                      transform: `translate(${tx}%, ${tx}%)`,
                      pointerEvents: on ? "auto" : "none",
                    }}
                  >
                    <span
                      className={
                        "f-label text-ink grid whitespace-nowrap " +
                        (right ? "justify-items-end" : "")
                      }
                    >
                      {[q.P.obj, q.P.layer].map((name, k) => (
                        <span
                          key={k}
                          style={{
                            gridArea: "1 / 1",
                            opacity: k ? q.swap : 1 - q.swap,
                          }}
                        >
                          <span className="text-accent">{fPad(q.i + 1)}</span>
                          <span className="f-callout-name ml-2">{name}</span>
                        </span>
                      ))}
                    </span>
                    <span className="mt-0.5 block text-[13px] leading-[18px] text-muted">
                      {fJob(q.P.job).name}
                    </span>
                  </a>
                );
              })}
            </nav>
          </div>
        );
      }

      // Numbered balloons beside each part (phones and small frames), named in F_Legend.
      function F_Balloons({ anchors, W, H, opacity }) {
        const sorted = [...anchors].sort((a, b) => a.y - b.y);
        const placed = {};
        let last = -Infinity;
        sorted.forEach((a) => {
          placed[a.P.job] = Math.max(a.y - 16, last + 22);
          last = placed[a.P.job];
        });
        return (
          <svg
            className="pointer-events-none absolute inset-0"
            width={W}
            height={H}
            aria-hidden="true"
            style={{ opacity }}
          >
            {anchors.map((a) => {
              const ly = placed[a.P.job];
              const left = a.x + 34 > W; // no room on the right: put the balloon on the left
              const bx = left ? a.x - 22 : a.x + 22;
              const path = `M ${a.x} ${a.y} L ${left ? bx + 7 : bx - 7} ${ly + 7}`;
              return (
                <g key={a.P.job}>
                  <path
                    d={path}
                    fill="none"
                    stroke="var(--ground)"
                    strokeOpacity={0.85}
                    strokeWidth={4}
                  />
                  <path
                    d={path}
                    fill="none"
                    stroke="var(--accent)"
                    strokeWidth={1}
                  />
                  <circle
                    cx={a.x}
                    cy={a.y}
                    r={3}
                    fill="var(--accent)"
                    stroke="var(--ground)"
                    strokeWidth={1.5}
                  />
                  <circle
                    cx={bx}
                    cy={ly}
                    r={10}
                    fill="var(--surface)"
                    stroke="var(--accent)"
                  />
                  <text
                    x={bx}
                    y={ly + 3.5}
                    textAnchor="middle"
                    fontSize={10}
                    fill="var(--accent)"
                    style={{ fontFamily: "var(--font-mono)" }}
                  >
                    {fPad(a.i + 1)}
                  </text>
                </g>
              );
            })}
          </svg>
        );
      }

      // The key under the drawing on phones: the eight parts in job order. Each name turns
      // from the object into its part of Obsidian as that object lifts.
      function F_Legend({ swaps, className = "", style }) {
        return (
          <ol
            aria-label="The desk, object by object"
            className={"border-ink/70 grid border-t " + className}
            style={style}
          >
            {F_PARTS.map((P, i) => (
              <li key={P.job}>
                <a
                  href={`#f-h-${P.job}`}
                  className="border-line hover:text-accent grid min-h-[27px] grid-cols-[26px_122px_minmax(0,1fr)] items-center gap-x-2 border-b text-[13px]"
                >
                  <span className="f-num text-accent text-[12px]">
                    {fPad(i + 1)}
                  </span>
                  <span className="grid font-semibold">
                    <span style={{ gridArea: "1 / 1", opacity: 1 - swaps[i] }}>
                      {P.obj}
                    </span>
                    <span style={{ gridArea: "1 / 1", opacity: swaps[i] }}>
                      {P.layer}
                    </span>
                  </span>
                  <span className="truncate text-muted">
                    {fJob(P.job).name}
                  </span>
                </a>
              </li>
            ))}
          </ol>
        );
      }

      // ---------- Header ----------
      function useFDark() {
        const q = "(prefers-color-scheme: dark)";
        const [dark, setDark] = useState(() => window.matchMedia(q).matches);
        useEffect(() => {
          const m = window.matchMedia(q);
          const on = () => setDark(m.matches);
          m.addEventListener("change", on);
          return () => m.removeEventListener("change", on);
        }, []);
        return dark;
      }

      function F_Brand({ size = 22 }) {
        const dark = useFDark();
        return (
          <Lockup
            ink="var(--ink)"
            accent="var(--accent)"
            markInk={dark ? "#D8E2F0" : "#1E3A5F"}
            markAccent={dark ? "#F0793F" : "#E8622C"}
            style={{ fontSize: size }}
          />
        );
      }

      function F_Header() {
        const link = "px-2 py-1 text-ink hover:text-accent";
        return (
          <header className="border-line bg-ground border-b">
            <div className="mx-auto flex h-16 max-w-[1376px] items-center justify-between gap-3 px-4 sm:px-8">
              <a href={SITE} aria-label="ZotLit home" className="text-ink">
                <F_Brand />
              </a>
              <nav
                aria-label="Site"
                className="flex items-center gap-0.5 text-[14px] sm:gap-2"
              >
                <a className={link} href={FACTS.docs}>
                  Docs
                </a>
                <a
                  className={link + " hidden sm:inline"}
                  href={FACTS.changelog}
                >
                  Changelog
                </a>
                <a
                  className={link + " hidden sm:inline"}
                  href={FACTS.community}
                >
                  Community
                </a>
                <a
                  href={FACTS.github}
                  className="border-line text-ink hover:border-ink ml-1 inline-flex items-center gap-2 border px-2.5 py-1"
                >
                  GitHub
                  <span className="f-num inline-flex items-center gap-1 text-[12px] text-muted">
                    <F_Ico n="Star" size={12} />
                    {FACTS.stars.toLocaleString("en-US")}
                  </span>
                </a>
              </nav>
            </div>
          </header>
        );
      }

      // ---------- Hero and the assembly ----------
      function F_Actions() {
        return (
          <div className="flex flex-wrap gap-3">
            <a
              href={FACTS.install}
              className="bg-ink text-ground hover:bg-accent2 inline-flex h-11 items-center gap-2 px-5 text-[15px] font-semibold"
            >
              Install ZotLit
              <F_Ico n="ArrowRight" size={16} />
            </a>
            <a
              href={FACTS.docs}
              className="border-ink text-ink hover:bg-surface inline-flex h-11 items-center gap-2 border px-5 text-[15px] font-semibold"
            >
              Read the docs
            </a>
          </div>
        );
      }

      function F_Requirements({ className = "" }) {
        return (
          <ul
            aria-label="Requirements"
            className={
              "flex flex-wrap gap-x-4 gap-y-1 font-mono text-[12px] leading-[19px] text-muted " +
              className
            }
          >
            {[FACTS.obsidian, FACTS.zotero, FACTS.platforms].map((r) => (
              <li
                key={r}
                className="flex items-center gap-1.5 whitespace-nowrap"
              >
                <F_Ico n="Check" size={12} className="text-accent" />
                {r}
              </li>
            ))}
          </ul>
        );
      }

      function F_HeroText({ className = "", style }) {
        const { motion } = useProtoState();
        return (
          <div className={className} style={style}>
            <p className="f-label text-muted">
              ZotLit {FACTS.version} · Zotero in Obsidian
            </p>
            <h1 className="f-h1 text-ink mt-5">
              An integrated{" "}
              <span className={"f-mark" + (motion ? " is-anim" : "")}>
                research desk
              </span>{" "}
              for Obsidian.
            </h1>
            <p className="f-lead mt-6 max-w-[30rem] text-muted">
              Find, read, annotate and cite your Zotero papers, right beside the
              notes and chapters you write.
            </p>
            <div className="mt-8">
              <F_Actions />
            </div>
            <F_Requirements className="mt-6 max-w-[30rem]" />
          </div>
        );
      }

      // The three views of the drawing, in order.
      const F_VIEWS = ["On the desk", "Lifted apart", "One window"];
      const fViewOf = (p) => (p < 0.1 ? 0 : p < 0.7 ? 1 : 2);

      function F_TitleBlock({ view, style, className = "" }) {
        return (
          <div
            aria-hidden="true"
            className={
              "border-ink/70 bg-surface grid grid-cols-[auto_auto] border font-mono text-[10px] leading-[14px] tracking-[0.1em] text-muted uppercase " +
              className
            }
            style={style}
          >
            <span className="border-ink/70 border-r border-b px-2 py-1">
              Drawing
            </span>
            <span className="border-ink/70 text-ink border-b px-2 py-1">
              Research desk
            </span>
            <span className="border-ink/70 border-r px-2 py-1">
              View {view + 1} of 3
            </span>
            <span className="text-ink px-2 py-1">{F_VIEWS[view]}</span>
          </div>
        );
      }

      function F_WindowCaption({ className = "", style }) {
        return (
          <div className={className} style={style}>
            <div className="grid gap-4 lg:grid-cols-12 lg:items-end lg:gap-8">
              <div className="lg:col-span-6">
                <p className="f-label text-accent">View 3 · One window</p>
                <h2 className="f-h2 mt-3">
                  Everything on your desk, in one window.
                </h2>
              </div>
              <p className="f-lead text-muted lg:col-span-5 lg:col-start-8">
                Library, PDF, notes and chapter sit side by side. The paper you
                highlight is the one you cite, see in the graph and export.
              </p>
            </div>
          </div>
        );
      }

      function F_LiftCaption({ className = "", style }) {
        return (
          <div className={className} style={style}>
            <p className="f-label text-accent">View 2 · Lifted apart</p>
            <p className="f-h3 text-ink mt-3">
              Each object lifts off the desk and becomes its part of Obsidian.
            </p>
            <p className="mt-3 text-[15px] leading-[1.5] text-muted">
              The laptop and toolbox go under the desk: the machine room for
              power users.
            </p>
          </div>
        );
      }

      // Page padding that lines the sticky stage up with the 1376 px content column.
      const F_PAD_CSS = "max(32px, calc((100% - 1376px) / 2 + 32px))";
      const fPadPx = (W) => Math.max(32, (W - 1376) / 2 + 32);

      // Desktop: the desk sits right of the text, then the parts float apart in the middle of
      // the stage, then the window fills the stage above its caption.
      function fWideRegion(W, H, p) {
        const pad = fPadPx(W);
        const r0 = { x: pad + 500, y: 140, w: W - 2 * pad - 500, h: H - 320 };
        const rX = {
          x: pad + 330,
          y: 60,
          w: W - 2 * pad - 330 - 220,
          h: H - 60 - 116,
        };
        const r1 = { x: pad, y: 52, w: W - 2 * pad, h: H - 52 - 236 };
        const c1 = fEase(fSeg(p, 0.03, 0.3));
        const c2 = fEase(fSeg(p, 0.52, 0.86));
        return fRectLerp(fRectLerp(r0, rX, c1), r1, c2);
      }

      // Phones and tablets: the drawing on top, the key at the foot of the stage. At the end the
      // window and its caption sit as one block in the middle of the stage.
      const F_LEGEND_H = 8 * 27 + 2;
      const F_STAGE_FOOT = 104; // room for the variant switcher
      function fNarrowRegion(W, H, p) {
        const r0 = { x: 8, y: 40, w: W - 16, h: Math.min(300, W * 0.62) };
        const rX = {
          x: 8,
          y: 40,
          w: W - 16,
          h: H - 40 - F_STAGE_FOOT - F_LEGEND_H - 16,
        };
        const h1 = Math.min(300, (W - 32) * 0.66);
        const y1 = Math.max(
          56,
          Math.round((H - F_STAGE_FOOT - (h1 + 24 + 236)) / 2),
        );
        const r1 = { x: 16, y: y1, w: W - 32, h: h1 };
        const c1 = fEase(fSeg(p, 0.03, 0.3));
        const c2 = fEase(fSeg(p, 0.52, 0.86));
        return fRectLerp(fRectLerp(r0, rX, c1), r1, c2);
      }
      // The key sits under the desk at first, then moves to the foot of the stage as the stack grows.
      function fLegendTop(W, H, p) {
        const r0h = Math.min(300, W * 0.62);
        return fLerp(
          40 + r0h + 12,
          H - F_STAGE_FOOT - F_LEGEND_H,
          fEase(fSeg(p, 0.03, 0.3)),
        );
      }

      // The one orchestrated moment, desktop: a sticky stage; the hero text fades as you scroll.
      function F_MomentWide({ p, secRef }) {
        const textT = fEase(fSeg(p, 0.02, 0.14));
        const labelsO = 1 - fSeg(p, 0.5, 0.58);
        const liftT = fSeg(p, 0.3, 0.38) * (1 - fSeg(p, 0.5, 0.56));
        const capT = fEase(fSeg(p, 0.88, 0.95));
        const view = fViewOf(p);
        return (
          <section
            ref={secRef}
            aria-label="The desk, lifted into one window"
            style={{ height: "380vh" }}
          >
            <div className="f-paper border-line sticky top-0 h-screen overflow-hidden border-b">
              <div
                className="absolute inset-x-0 top-0 z-10"
                style={{
                  opacity: 1 - textT,
                  visibility: textT > 0.99 ? "hidden" : "visible",
                }}
              >
                <F_Header />
              </div>
              <F_Drawing
                p={p}
                gap={F_GAP_WIDE}
                region={(W, H) => fWideRegion(W, H, p)}
                labels="side"
                labelsOpacity={labelsO}
                labelMinX={fPadPx(window.innerWidth) + 476}
                idle={p < 0.02}
                className="absolute inset-0"
              />
              <F_HeroText
                className="absolute w-[460px]"
                style={{
                  left: F_PAD_CSS,
                  top: `calc(50% - ${48 * textT}px)`,
                  transform: "translateY(-50%)",
                  opacity: 1 - textT,
                  pointerEvents: textT > 0.5 ? "none" : "auto",
                  visibility: textT > 0.99 ? "hidden" : "visible",
                }}
              />
              <p
                className="f-label absolute bottom-8 flex items-center gap-2 text-muted"
                style={{ left: F_PAD_CSS, opacity: 1 - textT }}
                aria-hidden="true"
              >
                <F_Ico n="ArrowDown" size={13} />
                Scroll to lift the desk into one window
              </p>
              <F_LiftCaption
                className="absolute w-[270px]"
                style={{
                  left: F_PAD_CSS,
                  top: "50%",
                  transform: `translateY(calc(-50% + ${12 * (1 - liftT)}px))`,
                  opacity: liftT,
                  visibility: liftT < 0.01 ? "hidden" : "visible",
                }}
              />
              <F_TitleBlock
                view={view}
                className="absolute"
                style={{ right: F_PAD_CSS, bottom: 32, opacity: 1 - capT }}
              />
              <F_WindowCaption
                className="absolute"
                style={{
                  left: F_PAD_CSS,

      // ---------- 05 Cite while you write: Live Preview citations and the Citation Popover ----------
      // Position of a floating box under an anchor element, kept inside its container.
      function useFFloat(boxRef, getAnchor, key, width, limitRef) {
        const [pos, setPos] = useState(null);
        useLayoutEffect(() => {
          const box = boxRef.current;
          const a = key ? getAnchor(key) : null;
          if (!box || !a) {
            setPos(null);
            return;
          }
          const b = box.getBoundingClientRect();
          const r = a.getBoundingClientRect();
          const lim = limitRef && limitRef.current;
          const right = lim
            ? Math.min(
                b.width - 8,
                lim.getBoundingClientRect().right - b.left + 12,
              )
            : b.width - 8;
          const w = Math.min(width, b.width - 16);
          setPos({
            left: Math.max(8, Math.min(r.left - b.left, right - w)),
            top: r.bottom - b.top + 8,
            w,
          });
        }, [key, width]);
        return pos;
      }

        );
      }

      function F_DemoCite() {
        const ref = useRef(null);
        const boxRef = useRef(null);
        const typingRef = useRef(null);
        const citeEls = useRef({});
        const inView = useInView(ref, { threshold: 0.35 });
        const [style, setStyle] = useState("apa");
        const [hover, setHover] = useState(null);
        const step = useTimeline([1300, 1700, 2000, 1200, 1300, 4800], {
          active: inView,
        });
        const typed = useTypewriter("[@situ", {
          cps: 7,
          active: inView && step >= 1,
        });
        const order = F_CH2_ORDER;
        const src0 = DRAFT.source[0];
        const cut = src0.indexOf("[@haraway1988");
        const before = src0.slice(0, cut);
        const after = src0.slice(src0.indexOf("]", cut) + 1);
        const pop = hover || (step === 5 ? "c-haraway1988" : null);
        const popKey = pop ? pop.split(":")[0].replace("c-", "") : null;
        const textRef = useRef(null);
        const popPos = useFFloat(
          boxRef,
          (id) => citeEls.current[id],
          pop,
          400,
          textRef,
        );
        const sugPos = useFFloat(
          boxRef,
          () => typingRef.current,
          step === 2 ? "sug" : null,
          340,
          textRef,
        );
        // The "what you type" column: each citation's Markdown, on the citation's line.
        const rawOf = useRef({});
        const { w: boxW } = useFSize(boxRef);
        const [marks, setMarks] = useState([]);
        rawOf.current["c-haraway1988"] =
          step <= 2 ? typed || "[@" : "[@haraway1988, p. 581]";
        useLayoutEffect(() => {
          const box = boxRef.current;
          const text = textRef.current;
          if (!box || !text) return;
          const b = box.getBoundingClientRect();
          const t = text.getBoundingClientRect();
          if (b.right - t.right < 300) {
            setMarks((m) => (m.length ? [] : m));
            return;
          }
          const out = Object.entries(citeEls.current)
            .filter(([, el]) => el && el.isConnected)
            .map(([id, el]) => {
              const rs = el.getClientRects();
              const r = rs[rs.length - 1] || el.getBoundingClientRect();
              return {
                id,
                y: r.top - b.top + r.height / 2,
                raw: rawOf.current[id],
              };
            })
            .sort((p, q) => p.y - q.y);
          for (let k = 1; k < out.length; k++)
            out[k].y = Math.max(out[k].y, out[k - 1].y + 30);
          const x0 = t.right - b.left + 24;
          setMarks(out.map((m) => ({ ...m, x0, x1: x0 + 40 })));
        }, [step, style, boxW, typed]);

        const cite = (c, id, flash = false) => (
          <button
            key={id + (flash ? step : "")}
            ref={(el) => {
              citeEls.current[id] = el;

            type="button"
            aria-label={`Citation: ${PAPERS[c.key].inText} ${PAPERS[c.key].year}. Show the full reference.`}

            onMouseLeave={() => setHover(null)}
            onFocus={() => setHover(id)}
            onBlur={() => setHover(null)}
            className={
              "text-cite decoration-cite/40 hover:decoration-cite cursor-pointer underline underline-offset-[3px] " +
              (flash ? "f-flash" : "")
            }

            {inText(c.key, { style, locator: c.locator, order })}

        );

        const typingEl = (el) => {
          typingRef.current = el;
          citeEls.current["c-haraway1988"] = el;

        let typing;
        if (step <= 2)
          typing = (

              {typed}

            </span>

            { key: "haraway1988", locator: "p. 581" },

            step === 4,

        return (
          <F_Sheet
            label="Manuscript"
            note="Try it: hover a citation, change the style"
          >
            <div ref={ref}>
              <F_Pane
                title={`${DRAFT.title}.md`}
                icon="FileText"
                right={
                  <span className="hidden text-[11px] sm:inline">
                    Live Preview

                  <F_StylePicker style={style} setStyle={setStyle} />
                  <span className="f-label text-muted">Type [@ to cite</span>
                </div>
                <div
                  ref={boxRef}
                  className="relative px-5 pt-8 pb-40 sm:px-10 lg:px-16"

                  {marks.length > 0 && (
                    <div aria-hidden="true">
                      <div
                        className="border-line absolute top-9 border-l pl-4"

                      >
                        <div className="f-label text-muted">What you type</div>
                        <div className="mt-1 max-w-[16rem] text-[13px] leading-[1.45] text-muted">
                          The note keeps plain citation keys. You read formatted

                        </div>
                      </div>
                      {marks.map((m) => {
                        const on = pop === m.id;
                        return (
                          <Fragment key={m.id}>
                            <span
                              className="border-accent/70 absolute h-px border-t border-dashed"

                              className="bg-accent absolute size-[5px] -translate-y-1/2 rounded-full"

                            <span

                                (on ? "bg-accent/10 text-ink" : "text-muted")
                              }
                              style={{ left: m.x1, top: m.y }}

                              {m.raw}
                            </span>

                  <div ref={textRef} className="max-w-[40rem]">
                    <h4 className="font-display text-[30px] leading-[1.1]">

      // ---------- 06 See how your sources connect: graph and References Sidebar ----------
      function F_DemoGraph() {
        const ref = useRef(null);
        const inView = useInView(ref, { threshold: 0.35 });
        const { motion } = useProtoState();
        const total = GRAPH.edges.length;
        const [n, setN] = useState(motion ? 0 : total);
        const [picked, setPicked] = useState(null);
        useEffect(() => {
          if (!motion) {
            setN(total);
            return;
          }
          if (!inView || n >= total) return;
          const id = setInterval(
            () => setN((x) => Math.min(total, x + 1)),
            110,
          );
          return () => clearInterval(id);
        }, [inView, motion, n >= total]);
        const refs = fRefOrder(NOTES[0].cites, "apa");
        const idx = useLoop(2000, refs.length, {
          active: inView && !picked && n >= total,
          start: refs.indexOf("haraway1988"),
        });
        const active = picked || (n >= total ? refs[idx] : null);
        const pick = (id) => setPicked((p) => (p === id ? null : id));
        return (
          <F_Sheet
            label="Citation graph"
            note="Try it: select a paper or a reference"
          >
            <div ref={ref} className="grid lg:grid-cols-[1fr_380px]">

                className="border-line lg:border-r"
              >
                <div className="px-2 pt-2 sm:px-6 sm:pt-4">

                </div>
                <div className="border-line flex flex-wrap gap-x-5 gap-y-1.5 border-t px-4 py-2.5 text-[12.5px] text-muted">

        const ref = useRef(null);

          if (!motion) {
            setShown(all);

          const t = setTimeout(() => setShown((x) => x + 1), 1200);
          return () => clearTimeout(t);

          const b = boxRef.current;
          if (b) b.scrollTop = b.scrollHeight;
        }, [shown]);
        return (
          <F_Sheet label="AI assistant skills" note={FACTS.agents.join(" · ")}>

                ref={boxRef}
                className="f-scroll flex h-[420px] min-w-0 flex-col gap-2.5 overflow-y-auto p-4"

      // The element's size, kept current with a ResizeObserver.
      function useGSize(ref) {
        const [size, setSize] = useState({ w: 0, h: 0 });
        useLayoutEffect(() => {
          const el = ref.current;
          if (!el) return;
          const read = () => {
            const r = el.getBoundingClientRect();
            setSize((s) =>
              Math.abs(s.w - r.width) < 0.5 && Math.abs(s.h - r.height) < 0.5
                ? s
                : { w: r.width, h: r.height },
            );
          };
          read();
          const ro = new ResizeObserver(read);
          ro.observe(el);
          return () => ro.disconnect();
        }, []);
        return size;
      }

      function useGMedia(q) {
        const [m, setM] = useState(() => window.matchMedia(q).matches);
        useEffect(() => {
          const mq = window.matchMedia(q);
          const on = () => setM(mq.matches);
          on();
          mq.addEventListener("change", on);
          return () => mq.removeEventListener("change", on);
        }, [q]);
        return m;
      }

      function useGDark() {
        return useGMedia("(prefers-color-scheme: dark)");
      }

      // True while the element crosses a thin band at the middle of the viewport. Demos loop only
      // then, so at most one loop plays at a time.
      function useGBand(ref) {
        const [on, setOn] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => setOn(e.isIntersecting),
            {
              rootMargin: "-44% 0px -44% 0px",
              threshold: 0,
            },
          );
          io.observe(el);
          return () => io.disconnect();
        }, []);
        return on;
      }

      // ---------- References in three styles ----------
      function gInitials(full) {
        const parts = full.split(" ");
        const last = parts.pop();
        return parts.map((x) => x[0] + ".").join(" ") + " " + last;
      }
      function gLastFirst(full) {
        const parts = full.split(" ");
        const last = parts.pop();
        return last + ", " + parts.join(" ");
      }
      function gAuthors(k, style) {
        const c = PAPERS[k].creators;
        if (style === "ieee") {
          if (c.length > 3) return gInitials(c[0]) + " et al.";
          const names = c.map(gInitials);
          return names.length > 1
            ? names.slice(0, -1).join(", ") +
                (names.length > 2 ? "," : "") +
                " and " +
                names[names.length - 1]
            : names[0];
        }
        if (c.length > 3) return gLastFirst(c[0]) + ", et al.";
        if (c.length === 1) return gLastFirst(c[0]);
        return (
          gLastFirst(c[0]) +
          (c.length > 2 ? ", " + c.slice(1, -1).join(", ") + "," : "") +
          " and " +
          c[c.length - 1]
        );
      }
      // One reference entry in APA, Chicago author-date or IEEE, with italics where they go.
      function G_Ref({ k, style = "apa", n }) {
        const p = PAPERS[k];
        if (style === "apa") return <Bib k={k} />;
        const who = gAuthors(k, style);
        if (style === "chicago") {
          const head = `${who}${who.endsWith(".") ? "" : "."} ${p.year}. `;
          if (p.type === "book")
            return (
              <span>
                {head}
                <i>{p.title}</i>. {p.publisher}.
              </span>
            );
          if (p.type === "journalArticle")
            return (
              <span>
                {head}“{p.title}.” <i>{p.container}</i> {p.volume} ({p.issue}):{" "}
                {p.pages}.
              </span>
            );
          if (p.type === "preprint")
            return (
              <span>
                {head}“{p.title}.” {p.container}. https://doi.org/{p.doi}.
              </span>
            );
          return (
            <span>
              {head}“{p.title}.” In <i>{p.container}</i>, {p.pages}.
            </span>
          );
        }
        const lead = n ? `[${n}] ` : "";
        if (p.type === "book")
          return (
            <span>
              {lead}
              {who}, <i>{p.titleSentence}</i>. {p.publisher}, {p.year}.
            </span>
          );
        if (p.type === "journalArticle")
          return (
            <span>
              {lead}
              {who}, “{p.titleSentence},” <i>{p.container}</i>, vol. {p.volume},
              no. {p.issue}, pp. {p.pages}, {p.year}.

        if (p.type === "preprint")
          return (
            <span>
              {lead}
              {who}, “{p.titleSentence},” {p.container}, {p.year}, doi: {p.doi}.
            </span>
          );
        return (
          <span>
            {lead}
            {who}, “{p.titleSentence},” in <i>{p.container}</i>, {p.year}, pp.{" "}
            {p.pages}.
          </span>
        );
      }

      function gPlace(L, id) {
        const o = G_OBJ[id];
        const p = L.at[id];
        const s = p.s || 1;
        const [x0, y0, w, h] = o.box;
        return { o, p, s, box: o.box, cx: x0 + w / 2, cy: y0 + h / 2 };
      }
      // A point in an object's own units, placed on the desk (scaled and turned with the object).
      function gDeskPt(L, id, lx, ly) {
        const { p, s, cx, cy } = gPlace(L, id);
        const a = (p.r * Math.PI) / 180;
        const dx = (lx - cx) * s;
        const dy = (ly - cy) * s;
        return {
          x: p.x + cx * s + dx * Math.cos(a) - dy * Math.sin(a),
          y: p.y + cy * s + dx * Math.sin(a) + dy * Math.cos(a),
        };
      }
      const gObjTransform = (L, id) => {
        const { p, s, cx, cy } = gPlace(L, id);
        return `translate(${p.x} ${p.y}) rotate(${p.r} ${cx * s} ${cy * s}) scale(${s})`;
      };

      // Sheet 1: the plan. Buttons sit over the objects in JOBS order, so the keyboard meets them
      // 01 to 08. Wide: numbered tags, the job name on hover or focus. Tall: every name printed.
      function G_Plan({ L, hot, setHot, onGo }) {
        const { motion } = useProtoState();
        const ref = useRef(null);
        const seen = useInView(ref, { threshold: 0.2 });
        const anim = !motion ? "off" : seen ? "run" : "pause";
        const tall = L.key === "tall";
        const hotJob = hot ? gJob(hot) : null;
        const hotTag = hot ? gDeskPt(L, hot, ...G_OBJ[hot].tag) : null;
        const flip = hotTag && hotTag.x / L.W > 0.66;
        return (
          <div
            ref={ref}
            className="relative w-full"
            style={{ aspectRatio: `${L.W} / ${L.H}` }}
          >
            <svg
              viewBox={`0 0 ${L.W} ${L.H}`}
              className="g-svg absolute inset-0 h-full w-full"
              aria-hidden="true"
              focusable="false"
            >
              <G_DeskTop L={L} />
              {L.mug && <G_Mug x={L.mug[0]} y={L.mug[1]} />}
              {JOBS.map((j) => {
                const Art = G_OBJ[j.id].Art;
                return (
                  <g key={j.id} transform={gObjTransform(L, j.id)}>
                    <g className={`g-obj ${hot === j.id ? "is-hot" : ""}`}>
                      <Art anim={j.id === "read" ? anim : "off"} />
                    </g>
                  </g>
                );
              })}
            </svg>
            {JOBS.map((j, i) => {
              const { p, s, box } = gPlace(L, j.id);
              return (
                <button
                  key={j.id}
                  type="button"
                  className="g-hit absolute"
                  aria-label={`${gPad(i + 1)}, ${j.name}: ${G_OBJECT[j.id].toLowerCase()}. Go to detail sheet ${gPad(i + 1)}.`}
                  style={{
                    left: gPct(p.x + box[0] * s, L.W),
                    top: gPct(p.y + box[1] * s, L.H),
                    width: gPct(box[2] * s, L.W),
                    height: gPct(box[3] * s, L.H),
                    transform: `rotate(${p.r}deg)`,
                  }}
                  onPointerEnter={() => setHot(j.id)}
                  onPointerLeave={() => setHot((h) => (h === j.id ? null : h))}
                  onFocus={() => setHot(j.id)}
                  onBlur={() => setHot((h) => (h === j.id ? null : h))}
                  onClick={() => onGo(j.id)}
                />
              );
            })}
            {!tall &&
              JOBS.map((j, i) => {
                const t = gDeskPt(L, j.id, ...G_OBJ[j.id].tag);
                return (
                  <span
                    key={j.id}
                    aria-hidden="true"
                    className={`g-tag pointer-events-none absolute size-[26px] -translate-x-1/2 -translate-y-1/2 text-[11.5px] ${hot === j.id ? "is-on" : ""}`}
                    style={{ left: gPct(t.x, L.W), top: gPct(t.y, L.H) }}
                  >
                    {gPad(i + 1)}

      // ---------- Tags on a demo, and the parts list ----------
      // Each demo marks where a feature lives with data-g-part (and data-g-side, data-g-at). The
      // overlay measures those elements and draws a numbered tag with a leader line to each.
      const G_DIRS = {
        l: [-1, 0],
        r: [1, 0],
        t: [0, -1],
        b: [0, 1],
        tl: [-0.7, -0.7],
        tr: [0.7, -0.7],
        bl: [-0.7, 0.7],
        br: [0.7, 0.7],
      };
      function gAnchor(r, side, at) {
        if (side === "l") return [r.left, r.top + r.height * at];
        if (side === "r") return [r.right, r.top + r.height * at];
        if (side === "t") return [r.left + r.width * at, r.top];
        if (side === "b") return [r.left + r.width * at, r.bottom];
        if (side === "tl") return [r.left, r.top];
        if (side === "tr") return [r.right, r.top];
        if (side === "bl") return [r.left, r.bottom];
        return [r.right, r.bottom];
      }

      function G_Tags({ parts, part, setPart, children }) {
        const boxRef = useRef(null);
        const demoRef = useRef(null);
        const [marks, setMarks] = useState([]);
        const [size, setSize] = useState({ w: 0, h: 0 });
        useEffect(() => {
          const box = boxRef.current;
          const demo = demoRef.current;
          if (!box || !demo) return;
          let raf = 0;
          let last = "";
          const measure = () => {
            raf = 0;
            const b = box.getBoundingClientRect();
            const W = b.width;
            const H = b.height;
            // Side tags sit in the margin outside the demo frame, as on a drawing; the leader
            // runs in from the margin. mx is how far a tag may reach past the frame.
            const roomy = W >= 560;
            const mx = roomy ? 34 : 24;
            const len = roomy ? 30 : 20;
            const margin = roomy ? 22 : 14;
            const out = [];
            parts.forEach((p) => {
              if (!p.drawn) return;
              const els = demo.querySelectorAll(`[data-g-part="${p.id}"]`);
              for (const el of els) {
                const r = el.getBoundingClientRect();
                if (r.width < 1 || r.height < 1) continue;
                const side = el.getAttribute("data-g-side") || "r";
                const at = parseFloat(el.getAttribute("data-g-at") || "0.5");
                const [ax0, ay0] = gAnchor(r, side, at);
                const ax = ax0 - b.left;
                const ay = ay0 - b.top;
                const [dx, dy] = G_DIRS[side] || G_DIRS.r;
                let tx0 = ax + dx * len;
                if (side === "l") tx0 = Math.min(tx0, -margin);
                if (side === "r") tx0 = Math.max(tx0, W + margin);
                const tx = Math.min(W + mx - 12, Math.max(12 - mx, tx0));
                const ty = Math.min(H + 18, Math.max(-26, ay + dy * len));
                out.push({
                  id: p.id,
                  n: p.n,
                  ax,
                  ay,
                  tx,
                  ty,
                  rx: r.left - b.left,
                  ry: r.top - b.top,
                  rw: r.width,
                  rh: r.height,
                });
                break;
              }
            });
            // Keep tags from sitting on each other.
            for (let i = 0; i < out.length; i++)
              for (let j = 0; j < i; j++) {
                const a = out[i];
                const c = out[j];
                if (Math.abs(a.tx - c.tx) < 25 && Math.abs(a.ty - c.ty) < 25)
                  a.ty = c.ty + (a.ty >= c.ty ? 25 : -25);
              }
            const key =
              out
                .map((m) =>
                  [m.id, m.ax, m.ay, m.tx, m.ty, m.rw, m.rh]
                    .map((v) => (typeof v === "number" ? Math.round(v) : v))
                    .join(","),
                )
                .join("|") + `@${Math.round(W)}x${Math.round(H)}`;
            if (key !== last) {
              last = key;
              setMarks(out);
              setSize({ w: W, h: H });
            }
          };
          const queue = () => {
            if (!raf) raf = requestAnimationFrame(measure);
          };
          queue();
          const mo = new MutationObserver(queue);
          mo.observe(demo, {
            subtree: true,
            childList: true,
            attributes: true,
            characterData: true,
          });
          const ro = new ResizeObserver(queue);
          ro.observe(box);
          demo.addEventListener("transitionend", queue);
          demo.addEventListener("animationend", queue);
          demo.addEventListener("scroll", queue, true);
          window.addEventListener("resize", queue);
          if (document.fonts && document.fonts.ready)
            document.fonts.ready.then(queue);
          return () => {
            mo.disconnect();
            ro.disconnect();
            demo.removeEventListener("transitionend", queue);
            demo.removeEventListener("animationend", queue);
            demo.removeEventListener("scroll", queue, true);
            window.removeEventListener("resize", queue);
            cancelAnimationFrame(raf);
          };
        }, [parts]);
        const any = part != null;
        return (
          <div ref={boxRef} className="relative">
            <div ref={demoRef} className="@container relative">
              {children}
            </div>
            <svg
              className="pointer-events-none absolute top-0 left-0 z-10 overflow-visible"
              width={Math.max(1, size.w)}
              height={Math.max(1, size.h)}
              aria-hidden="true"
            >
              {marks.map((m) => {
                const on = part === m.id;
                const dx = m.tx - m.ax;
                const dy = m.ty - m.ay;
                const d = Math.hypot(dx, dy) || 1;
                const ex = m.tx - (dx / d) * 11;
                const ey = m.ty - (dy / d) * 11;
                return (
                  <g
                    key={m.id}
                    opacity={any && !on ? 0.3 : 1}
                    style={{ transition: "opacity 200ms" }}
                  >
                    {on && (
                      <rect
                        x={m.rx - 4}
                        y={m.ry - 4}
                        width={m.rw + 8}
                        height={m.rh + 8}
                        fill="none"
                        stroke="var(--accent)"
                        strokeWidth={1.25}
                        strokeDasharray="5 3"
                      />
                    )}
                    {d > 12 && (
                      <line
                        x1={m.ax}
                        y1={m.ay}
                        x2={ex}
                        y2={ey}
                        stroke="var(--accent)"
                        strokeWidth={on ? 1.5 : 1}
                      />
                    )}
                    <circle
                      cx={m.ax}
                      cy={m.ay}
                      r={on ? 3.5 : 2.5}
                      fill="var(--accent)"
                    />
                  </g>
                );
              })}
            </svg>
            {marks.map((m) => (
              <span
                key={m.id}
                aria-hidden="true"
                onMouseEnter={() => setPart(m.id)}
                onMouseLeave={() => setPart(null)}
                className={`g-tag absolute z-20 size-[22px] cursor-default text-[11px] ${part === m.id ? "is-on" : ""}`}
                style={{
                  left: m.tx - 11,
                  top: m.ty - 11,
                  opacity: any && part !== m.id ? 0.4 : 1,
                }}
              >
                {m.n}
              </span>
            ))}
          </div>
        );
      }

      function G_Parts({ parts, part, setPart, cols = 1 }) {

                <span className="g-tag size-[15px] text-[8px]">1</span>

                <span className="g-tag is-off size-[15px] text-[8px]">2</span>

      // ---------- Graph layout (the Connections sheet) ----------
      // Positions on a 640 x 420 board. Notes are dark, literature notes orange, papers cited
      // without a note faint.
      const G_GRAPH_POS = {
        ch2: [330, 210],
        ch3: [520, 262],
        rg6: [130, 272],
        memo: [262, 70],
        haraway1988: [432, 168],
        latour1987: [474, 76],
        star1989: [570, 166],
        bowker1999: [560, 362],
        suchman1987: [418, 334],
        bender2021: [300, 352],
        vaswani2017: [222, 236],
        bommasani2021: [372, 108],
        kuhn1962: [118, 142],
        devlin2019: [52, 336],
        brown2020: [168, 388],
        shannon1948: [150, 34],
      };
      const G_NOTE_SHORT = {
        ch2: "Ch. 2 Situated models",
        ch3: "Ch. 3 Infrastructures",
        rg6: "Reading group, week 6",
        memo: "Memo: paradigm",
      };

      // compact: on a phone the graph draws larger nodes and labels only your notes and the
      // selected paper's neighbours, so every label stays readable.
      function G_GraphSvg({
        active = null,
        drawn = 1,
        className = "",
        onPick,
        compact = false,
      }) {
        const k = compact ? 1.8 : 1;
        const nodeOf = (id) => GRAPH.nodes.find((n) => n.id === id);
        const lit = (edge) =>
          active && (edge.from === active || edge.to === active);
        return (
          <svg viewBox="0 0 640 420" className={className} aria-hidden="true">
            {GRAPH.edges.map((ed, i) => {
              const [x1, y1] = G_GRAPH_POS[ed.from];
              const [x2, y2] = G_GRAPH_POS[ed.to];
              const len = Math.hypot(x2 - x1, y2 - y1);
              const show = i < Math.round(drawn * GRAPH.edges.length);
              const on = lit(ed);
              return (
                <line
                  key={i}
                  x1={x1}
                  y1={y1}
                  x2={x2}
                  y2={y2}
                  stroke={ed.kind === "link" ? "var(--muted)" : "var(--cite)"}
                  strokeOpacity={on ? 0.95 : active ? 0.32 : 0.55}
                  strokeWidth={on ? 2 : 1.1}
                  strokeDasharray={ed.kind === "link" ? "4 4" : `${len} ${len}`}
                  strokeDashoffset={ed.kind === "link" ? 0 : show ? 0 : len}
                  style={{
                    transition:
                      "stroke-dashoffset 700ms ease, stroke-opacity 300ms, stroke-width 300ms",
                  }}
                />
              );
            })}
            {Object.keys(G_GRAPH_POS).map((id) => {
              const n = nodeOf(id);
              const [x, y] = G_GRAPH_POS[id];
              const on = active === id;
              const near =
                active &&
                GRAPH.edges.some(
                  (ed) =>
                    (ed.from === active && ed.to === id) ||
                    (ed.to === active && ed.from === id),
                );
              const dim = active && !on && !near;
              const fill =
                n.kind === "note"
                  ? "var(--ink)"
                  : n.kind === "literature"
                    ? "var(--accent)"
                    : "var(--surface)";
              return (
                <g
                  key={id}
                  opacity={dim ? 0.55 : 1}
                  style={{
                    transition: "opacity 300ms",
                    cursor: onPick ? "pointer" : undefined,
                  }}
                  {...(onPick
                    ? {
                        role: "button",
                        tabIndex: 0,
                        "aria-label":
                          n.kind === "note" ? n.label : `${n.label}, ${n.sub}`,
                        onClick: () => onPick(id),
                        onKeyDown: (ev) => {
                          if (ev.key === "Enter" || ev.key === " ") {
                            ev.preventDefault();
                            onPick(id);
                          }
                        },
                      }
                    : {})}
                >
                  {onPick && (
                    <circle cx={x} cy={y} r={16 * k} fill="transparent" />
                  )}
                  {on && (
                    <circle
                      cx={x}
                      cy={y}
                      r={13 * k}
                      fill="none"
                      stroke="var(--accent)"
                      strokeWidth={1.5}
                    />
                  )}
                  <circle
                    cx={x}
                    cy={y}
                    r={(n.kind === "note" ? 7 : 6) * k}
                    fill={fill}
                    stroke={n.kind === "cited" ? "var(--muted)" : "none"}
                    strokeDasharray={n.kind === "cited" ? "2 2" : undefined}
                    strokeWidth={1.2}
                  />
                  {(!compact || n.kind === "note" || on || near) && (
                    <text
                      x={x}
                      y={y + 20 * k}
                      textAnchor="middle"
                      fontSize={(n.kind === "note" ? 12 : 11) * k}
                      fontWeight={n.kind === "note" || on ? 600 : 400}
                      fill={n.kind === "cited" ? "var(--muted)" : "var(--ink)"}
                      style={{ fontFamily: "var(--font-body)" }}
                    >
                      {n.kind === "note" ? G_NOTE_SHORT[id] : n.label}
                    </text>
                  )}
                </g>
              );
            })}
          </svg>
        );
      }

                {LIBRARIES.map((l) => (

                    {l.name}

      // ---------- Detail 03 · Open paper · Read and annotate ----------

      // ---------- Detail 05 · Manuscript · Cite while you write ----------
      // Position of a floating box under an anchor element, kept inside its container.
      function useGFloat(boxRef, getAnchor, key, width, limitRef, extra) {
        const [pos, setPos] = useState(null);
        useLayoutEffect(() => {
          const box = boxRef.current;
          const a = key ? getAnchor(key) : null;
          if (!box || !a) {
            setPos(null);
            return;
          }
          const b = box.getBoundingClientRect();
          const r = a.getBoundingClientRect();
          const lim = limitRef && limitRef.current;
          const right = lim
            ? Math.min(
                b.width - 8,
                lim.getBoundingClientRect().right - b.left + 12,
              )
            : b.width - 8;
          const w = Math.min(width, b.width - 16);
          setPos({
            left: Math.max(8, Math.min(r.left - b.left, right - w)),
            top: r.bottom - b.top + 8,
            w,
          });
        }, [key, width, extra]);
        return pos;
      }

      function G_StylePicker({ style, setStyle, label = "Citation style" }) {

            <div

              role="group"
              aria-label={label}
            >
              {CSL_STYLES.map((s, i) => (
                <button
                  key={s.id}
                  type="button"
                  aria-pressed={style === s.id}
