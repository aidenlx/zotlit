              <polygon points={`${R},${B} ${R - c},${B} ${R},${B - c}`} />
            </g>
            <rect
              x={b.x + 16}
              y={b.y + 16}
              width={b.w - 32}
              height={b.h - 32}
              rx="4"
              fill="none"
              stroke="var(--d-stitch)"
              strokeWidth={D_SW}
              strokeDasharray="8 7"
            />
          </g>
        );
      }

      // A desk object drawn on its own, for the list and the panel header.
      function D_ObjIcon({ id, className = "" }) {
        const o = D_OBJ[id];
        const Art = o.Art;
        return (
          <svg
            viewBox={o.vb.join(" ")}
            className={`d-svg d-icon ${className}`}
            aria-hidden="true"
            focusable="false"
          >
            {o.shade.map(([x, y, w, h, rx], k) => (
              <rect
                key={k}
                x={x + 7}
                y={y + 9}
                width={w}
                height={h}
                rx={rx}
                fill="var(--d-shadow)"
              />
            ))}
            <Art anim="off" />
          </svg>
        );
      }

      function D_Desk({ wide, selected, onOpen, paused }) {
        const L = wide ? D_WIDE : D_TALL;
        const { motion } = useProtoState();
        const [hot, setHot] = useState(null);
        const ref = useRef(null);
        const band = D_useBand(ref);
        const anim = !motion ? "off" : band && !paused ? "run" : "pause";
        const box = (id) => {
          const o = D_OBJ[id];
          const p = L.at[id];
          const s = p.s || 1;
          return { o, p, s, w: o.w * s, h: o.h * s };
        };
        const pct = (v, total) => `${(v / total) * 100}%`;
        return (
          <div
            ref={ref}
            className="relative w-full"
            style={{ aspectRatio: `${L.W} / ${L.H}` }}
          >
            <svg
              viewBox={`0 0 ${L.W} ${L.H}`}
              className="d-svg absolute inset-0 h-full w-full"
              aria-hidden="true"
              focusable="false"
            >
              <D_DeskTop L={L} />
              {L.mug && <D_Mug x={L.mug[0]} y={L.mug[1]} />}
              {JOBS.map((j, i) => {
                const { o, p, s, w, h } = box(j.id);
                const on = hot === j.id || selected === j.id;
                const dim = selected && selected !== j.id;
                const Art = o.Art;
                return (
                  <g
                    key={j.id}
                    transform={`translate(${p.x} ${p.y}) rotate(${p.r} ${w / 2} ${h / 2}) scale(${s})`}
                  >
                    <g
                      className={motion ? "d-settle" : ""}
                      style={{ animationDelay: `${150 + i * 85}ms` }}
                    >
                      <g className={`d-shade ${on ? "is-on" : ""}`}>
                        {o.shade.map(([x, y, sw, sh, rx], k) => (
                          <rect
                            key={k}
                            x={x + 7}
                            y={y + 9}
                            width={sw}
                            height={sh}
                            rx={rx}
                            fill={
                              p.deep
                                ? "var(--d-shadow-deep)"
                                : "var(--d-shadow)"
                            }
                          />
                        ))}
                      </g>
                      <g
                        className={`d-lift ${on ? "is-on" : ""} ${dim ? "is-dim" : ""}`}
                      >
                        <Art anim={j.id === "read" ? anim : "off"} />
                      </g>
                    </g>
                  </g>
                );
              })}
            </svg>
            {JOBS.map((j) => {
              const { p, w, h } = box(j.id);
              return (
                <button
                  key={j.id}
                  type="button"
                  aria-label={j.name}
                  aria-haspopup="dialog"
                  aria-expanded={selected === j.id}
                  className="d-hit absolute"
                  style={{
                    left: pct(p.x, L.W),
                    top: pct(p.y, L.H),
                    width: pct(w, L.W),
                    height: pct(h, L.H),
                    transform: `rotate(${p.r}deg)`,
                  }}
                  onPointerEnter={() => setHot(j.id)}
                  onPointerLeave={() => setHot((x) => (x === j.id ? null : x))}
                  onFocus={() => setHot(j.id)}
                  onBlur={() => setHot((x) => (x === j.id ? null : x))}
                  onClick={() => onOpen(j.id)}
                />
              );
            })}
            {JOBS.map((j, i) => {
              const { p, w } = box(j.id);
              const show = !wide || hot === j.id || selected === j.id;
              if (!show) return null;
              const left = wide ? pct(p.x + w / 2, L.W) : pct(p.lx, L.W);
              const top = wide ? pct(p.y, L.H) : pct(p.ly, L.H);
              return (
                <span
                  key={j.id}
                  aria-hidden="true"
                  className={`border-line bg-surface text-ink d-sheet pointer-events-none absolute z-10 inline-flex w-max items-center gap-1.5 rounded-full border ${
                    wide
                      ? "px-3 py-1.5 text-[14px] font-semibold whitespace-nowrap"
                      : "max-w-[47%] px-2.5 py-1 text-[12.5px] leading-tight font-semibold"
                  } ${wide && motion ? "d-rise" : ""}`}
                  style={{
                    left,
                    top,
                    transform: wide
                      ? "translate(-50%, -55%)"
                      : "translate(-50%, 0)",
                  }}
                >
                  <span className="font-mono text-[10.5px] font-normal text-muted">
                    {D_NUM(i)}
                  </span>
                  {j.name}
                </span>
              );
            })}
          </div>
        );
      }

      // ---------- Shared bits for the demos ----------
      function D_Window({
        title,
        icon = "FileText",
        right,
        children,
        className = "",
        bodyClass = "",
        clip = true,
      }) {
        return (
          <div
            className={`d-sheet flex flex-col ${clip ? "overflow-hidden" : ""} border-line bg-surface rounded-[10px] border ${className}`}
          >
            <div className="border-line flex h-9 shrink-0 items-center gap-2 border-b px-3 text-[12.5px] text-muted">
              <span className="flex gap-1.5 pr-1" aria-hidden="true">
                <span className="bg-line size-2.5 rounded-full" />
                <span className="bg-line size-2.5 rounded-full" />
                <span className="bg-line size-2.5 rounded-full" />
              </span>
              <D_Icon name={icon} size={13} />
              <span className="min-w-0 truncate">{title}</span>
              {right && <span className="ml-auto shrink-0">{right}</span>}
            </div>
            <div className={`relative min-h-0 flex-1 ${bodyClass}`}>
              {children}
            </div>
          </div>
        );
      }

      function D_Cite({ k, locator = null, style = "apa", className = "" }) {
        return (
          <span
            className={`text-cite decoration-cite/40 rounded-sm underline underline-offset-[3px] ${className}`}
          >
            {inText(k, { style, locator, order: D_DRAFT_ORDER })}
          </span>
        );
      }

      // A Markdown source paragraph with every citation formatted.
      function D_Rendered({ src, style = "apa", plain = false, renderCite }) {
        return parseCitations(src).map((s, i) => {
          if (s.text != null) return <Fragment key={i}>{s.text}</Fragment>;
          if (renderCite)
            return <Fragment key={i}>{renderCite(s.cite)}</Fragment>;
          if (plain)
            return (
              <Fragment key={i}>
                {inText(s.cite.key, {
                  style,
                  locator: s.cite.locator,
                  order: D_DRAFT_ORDER,
                })}
              </Fragment>
            );
          return (
            <D_Cite
              key={i}
              k={s.cite.key}
              locator={s.cite.locator}
              style={style}
            />
          );
        });
      }

      function D_Badges({ f }) {
        const l = sinceLabel(f);
        const base =
          "inline-flex items-center gap-1.5 rounded-full border px-2 py-[3px] text-[11.5px] font-medium leading-none";
        return (
          <>
            {l && (
              <span
                className={`${base} ${f.since === "2.2" ? "border-accent/45 bg-accent/10 text-ink" : "border-line text-muted"}`}
              >
                {f.since === "2.2" && (
                  <span className="bg-accent size-1.5 rounded-full" />
                )}
                {l}
              </span>
            )}
            {f.tier === "advanced" && (
              <span className={`${base} border-line bg-ground text-muted`}>
                For power users
              </span>
            )}
            {f.experimental && (
              <span
                className={`${base} border-z-orange text-ink border-dashed`}
              >
                Experimental
              </span>
            )}
            {f.companion && (
              <span className={`${base} border-line text-muted`}>
                <D_Icon name="Puzzle" size={11} />
                Needs ZotLit Companion
              </span>
            )}
          </>
        );
      }

      function D_Act({ icon, label }) {
        return (
          <span className="border-line text-ink inline-flex items-center gap-1.5 rounded-md border px-2 py-1 text-[12px]">
            <D_Icon name={icon} size={13} className="text-muted" />
            {label}
          </span>
        );
      }

      function D_Kbd({ children }) {
        return (
          <kbd className="border-line bg-ground text-ink rounded border px-1.5 py-px font-mono text-[10.5px]">
            {children}
          </kbd>
        );
      }

      // ---------- Signature demo: Citations in Live Preview ----------
      const D_LP = [
        { src: "", ms: 1000 },
        { src: "[@", q: "", ms: 500 },
        { src: "[@ha", q: "ha", ms: 420 },
        { src: "[@hara", q: "hara", ms: 1500 },
        { src: "[@haraway1988", ms: 520 },
        { src: "[@haraway1988, p.", ms: 420 },
        { src: "[@haraway1988, p. 581]", ms: 800 },
        { src: "[@haraway1988, p. 581]", done: true, ms: 4400 },
      ];
      const D_LP_MS = D_LP.map((s) => s.ms);

      function D_LivePreview({ active }) {
        const { motion } = useProtoState();
        const step = useTimeline(D_LP_MS, { active });
        const st = D_LP[step];
        const [style, setStyle] = useState("apa");
        const boxRef = useRef(null);
        const anchorRef = useRef(null);
        const [pos, setPos] = useState(null);
        const segs = useMemo(() => parseCitations(DRAFT.source[0]), []);
        const cut = segs.findIndex(
          (s) => s.cite && s.cite.key === "haraway1988",
        );
        const showSug = st.q != null;
        const q = st.q || "";
        const matches = D_DRAFT_ORDER.filter(
          (k) =>
            !q ||
            k.startsWith(q) ||
            PAPERS[k].inText.toLowerCase().startsWith(q),
        ).slice(0, 3);
        useLayoutEffect(() => {
          if (!showSug) return;
          const b = boxRef.current;
          const a = anchorRef.current;
          if (!b || !a) return;
          const br = b.getBoundingClientRect();
          const ar = a.getBoundingClientRect();
          const w = Math.min(300, br.width - 24);
          setPos({
            left: Math.max(12, Math.min(ar.left - br.left, br.width - w - 12)),
            top: ar.bottom - br.top + 6,
            w,
          });
        }, [showSug, step]);
        return (
          <div>
            <D_Window
              clip={false}
              title={`${DRAFT.title}.md`}
              icon="FileText"
              right={<span className="text-[11.5px]">Live Preview</span>}
            >
              <div
                ref={boxRef}
                className="relative px-5 pt-4 pb-6 text-[14.5px] leading-[1.75] @lg:px-7 @lg:text-[16px]"
              >
                <p className="font-display text-[19px] leading-snug @lg:text-[22px]">
                  {DRAFT.heading}
                </p>
                <p className="mt-2">
                  {segs
                    .slice(0, cut)
                    .map((s, i) =>
                      s.text != null ? (
                        <Fragment key={i}>{s.text}</Fragment>
                      ) : (
                        <D_Cite
                          key={i}
                          k={s.cite.key}
                          locator={s.cite.locator}
                          style={style}
                        />
                      ),
                    )}
                  {st.done ? (
                    <>
                      <D_Cite
                        k="haraway1988"
                        locator="p. 581"
                        style={style}
                        className={motion ? "bg-cite/10" : ""}
                      />
                      .
                    </>
                  ) : (
                    <>
                      <span
                        ref={anchorRef}
                        className="font-mono text-[0.88em] text-muted"
                      >
                        {st.src}
                      </span>
                      <span
                        className={`d-caret ${motion && active ? "is-blink" : ""}`}
                      />
                    </>
                  )}
                </p>
                <p className="mt-3">
                  <D_Rendered src={DRAFT.source[1]} style={style} />
                </p>
                {showSug && pos && (
                  <div
                    className={`d-sheet border-line bg-surface absolute z-10 overflow-hidden rounded-[10px] border text-[13px] ${motion ? "d-rise" : ""}`}
                    style={{ left: pos.left, top: pos.top, width: pos.w }}
                  >
                    <p className="border-line border-b px-3 py-1.5 font-mono text-[10.5px] tracking-[0.08em] text-muted uppercase">
                      Citation Suggester
                    </p>
                    <ul className="p-1">
                      {matches.map((k, i) => (
                        <li
                          key={k}
                          className={`rounded-md px-2.5 py-1.5 ${i === 0 ? "bg-cite/12" : ""}`}
                        >
                          <span className="flex items-center gap-2">
                            <span className="min-w-0 flex-1 truncate font-semibold">
                              {PAPERS[k].short}
                            </span>
                            {k === "bommasani2021" && (
                              <span className="border-line shrink-0 rounded-full border px-1.5 text-[10.5px] text-muted">
                                In this note
                              </span>
                            )}
                          </span>
                          <span className="block truncate text-[12px] text-muted">
                            {PAPERS[k].inText} · {PAPERS[k].year}
                          </span>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}
              </div>
            </D_Window>
            <div
              className="mt-4 flex flex-wrap items-center gap-2 text-[13px]"
              role="group"
              aria-label="Citation style"
            >
              <span className="mr-1 text-muted">Citation style</span>
              {CSL_STYLES.map((s) => (
                <button
                  key={s.id}
                  type="button"
                  aria-pressed={style === s.id}
                  onClick={() => setStyle(s.id)}
                  className={`rounded-full border px-3 py-1 transition-colors ${
                    style === s.id
                      ? "border-ink bg-ink text-ground"
                      : "border-line bg-surface text-ink hover:border-ink/40"
                  }`}
                >
                  {s.name}
                </button>
              ))}
            </div>
          </div>
        );
      }

      // ---------- Signature demo: Citation Popover ----------
      function D_PopoverDemo({ active }) {
        const { motion } = useProtoState();
        const boxRef = useRef(null);
        const citeRefs = useRef([]);
        const cites = useMemo(
          () =>
            DRAFT.source.flatMap((s) =>
              parseCitations(s)
                .filter((x) => x.cite)
                .map((x) => x.cite),
            ),
          [],
        );
        const [manual, setManual] = useState(null);
        const auto = useLoop(3200, cites.length, {
          active: active && manual == null,
          start: 2,
        });
        const cur = manual ?? auto;
        const [pos, setPos] = useState(null);
        const measure = useCallback(() => {
          const b = boxRef.current;
          const a = citeRefs.current[cur];
          if (!b || !a) return;
          const br = b.getBoundingClientRect();
          const ar = a.getBoundingClientRect();
          const w = Math.min(380, br.width - 24);
          setPos({
            left: Math.max(12, Math.min(ar.left - br.left, br.width - w - 12)),
            top: ar.bottom - br.top + 8,
            w,
            cx: ar.left - br.left + Math.min(ar.width / 2, 60),
            cy: ar.top - br.top + ar.height * 0.55,
          });
        }, [cur]);
        useLayoutEffect(measure, [measure]);
        useEffect(() => {
          window.addEventListener("resize", measure);
          return () => window.removeEventListener("resize", measure);
        }, [measure]);
        const c = cites[cur];
        const p = PAPERS[c.key];
        let n = 0;
        return (
          <D_Window
            title={`${DRAFT.title}.md`}
            icon="BookOpen"
            right={<span className="text-[11.5px]">Reading view</span>}
          >
            <div
              ref={boxRef}
              className="relative px-5 pt-4 pb-44 text-[14.5px] leading-[1.75] @lg:px-7 @lg:text-[16px]"
            >
              <p className="font-display text-[19px] leading-snug @lg:text-[22px]">
                {DRAFT.heading}
              </p>
              {DRAFT.source.map((src, j) => (
                <p key={j} className="mt-2">
                  {parseCitations(src).map((s, q) => {
                    if (s.text != null)
                      return <Fragment key={q}>{s.text}</Fragment>;
                    const idx = n++;
                    return (
                      <button
                        key={q}
                        type="button"
                        ref={(el) => {
                          citeRefs.current[idx] = el;
                        }}
                        aria-label={`${inText(s.cite.key, { locator: s.cite.locator })}: show the full reference`}
                        onMouseEnter={() => setManual(idx)}
                        onFocus={() => setManual(idx)}
                        onClick={() => setManual(idx)}
                        className={`text-cite decoration-cite/40 rounded-sm underline underline-offset-[3px] transition-colors ${
                          idx === cur ? "bg-cite/12" : ""
                        }`}
                      >
                        {inText(s.cite.key, { locator: s.cite.locator })}
                      </button>
                    );
                  })}
                </p>
              ))}
              {pos && (
                <div
                  key={cur}
                  className={`d-sheet border-line bg-surface absolute z-10 rounded-[10px] border p-3.5 text-[13px] leading-snug ${motion ? "d-rise" : ""}`}
                  style={{ left: pos.left, top: pos.top, width: pos.w }}
                >
                  <Bib k={c.key} />
                  <div className="border-line mt-3 flex flex-wrap gap-1.5 border-t pt-2.5">
                    <D_Act
                      icon={p.note ? "NotebookText" : "FilePlus"}
                      label={p.note ? "Open note" : "Create note"}
                    />
                    {p.pdf && <D_Act icon="FileText" label="Open PDF" />}
                    <D_Act icon="ExternalLink" label="Show in Zotero" />
                  </div>
                </div>
              )}
              {motion && active && manual == null && pos && (
                <D_Icon
                  name="MousePointer2"
                  size={20}
                  strokeWidth={1.5}
                  fill="var(--surface)"
                  className="text-ink pointer-events-none absolute z-20 transition-all duration-700 ease-out"
                  style={{ left: pos.cx, top: pos.cy }}
                />
              )}
            </div>
          </D_Window>
        );
      }

      // ---------- Signature demo: Citations in the graph view ----------
      const D_GPOS = {
        ch2: [210, 150],
        ch3: [452, 232],
        rg6: [196, 318],
        memo: [470, 92],
        bommasani2021: [72, 92],
        bender2021: [236, 40],
        suchman1987: [70, 196],
        haraway1988: [332, 192],
        vaswani2017: [116, 252],
        star1989: [584, 292],
        bowker1999: [472, 362],
        latour1987: [578, 168],
        devlin2019: [92, 372],
        brown2020: [304, 386],
        kuhn1962: [338, 300],
        shannon1948: [604, 52],
      };
      const D_GNOTES = ["ch2", "ch3", "rg6", "memo"];

      function D_GraphDemo({ active }) {
        const { motion } = useProtoState();
        const [manual, setManual] = useState(null);
        const auto = useLoop(3600, D_GNOTES.length, {
          active: active && manual == null,
        });
        const f = D_GNOTES[manual ?? auto];
        const note = NOTES.find((x) => x.id === f);
        const cited = new Set(note.cites);
        const lit = GRAPH.nodes.filter((x) => x.kind === "literature").length;
        const faint = GRAPH.nodes.filter((x) => x.kind === "cited").length;
        return (
          <D_Window title="Graph view" icon="Waypoints">
            <svg
              viewBox="0 0 660 420"
              className="block w-full"
              role="img"
              aria-label={`Graph view: ${note.title} cites ${D_AND(note.cites.map((k) => `${PAPERS[k].inText} ${PAPERS[k].year}`))}.`}
            >
              {GRAPH.edges.map((e, i) => {
                const [x1, y1] = D_GPOS[e.from];
                const [x2, y2] = D_GPOS[e.to];
                const on = e.from === f && e.kind === "citation";
                if (on) return null;
                return (
                  <line
                    key={i}
                    x1={x1}
                    y1={y1}
                    x2={x2}
                    y2={y2}
                    stroke="var(--line)"
                    strokeWidth="1.25"
                    strokeDasharray={e.kind === "link" ? "4 4" : undefined}
                  />
                );
              })}
              <g key={f}>
                {GRAPH.edges
                  .filter((e) => e.from === f && e.kind === "citation")
                  .map((e, i) => {
                    const [x1, y1] = D_GPOS[e.from];
                    const [x2, y2] = D_GPOS[e.to];
                    return (
                      <line
                        key={i}
                        x1={x1}
                        y1={y1}
                        x2={x2}
                        y2={y2}
                        pathLength="1"
                        stroke="var(--cite)"
                        strokeWidth="2"
                        className={motion ? "d-draw" : ""}
                        style={
                          motion
                            ? { animationDelay: `${i * 110}ms` }
                            : undefined
                        }
                      />
                    );
                  })}
              </g>
              {GRAPH.nodes.map((nd) => {
                const [x, y] = D_GPOS[nd.id];
                const isF = nd.id === f;
                const rel = isF || cited.has(nd.id);
                const label = nd.kind === "note" ? nd.label : nd.label;
                return (
                  <g
                    key={nd.id}
                    opacity={rel ? 1 : 0.4}
                    style={{ transition: "opacity .4s" }}
                  >
                    {isF && (
                      <circle
                        cx={x}
                        cy={y}
                        r="15"
                        fill="none"
                        stroke="var(--cite)"
                        strokeWidth="2"
                      />
                    )}
                    {nd.kind === "note" && (
                      <circle cx={x} cy={y} r="8.5" fill="var(--ink)" />
                    )}
                    {nd.kind === "literature" && (
                      <circle cx={x} cy={y} r="7" fill="var(--accent)" />
                    )}
                    {nd.kind === "cited" && (
                      <circle
                        cx={x}
                        cy={y}
                        r="6.5"
                        fill="var(--surface)"
                        stroke="var(--muted)"
                        strokeWidth="1.25"
                        strokeDasharray="2.5 2"
                      />
                    )}
                    <text
                      x={x}
                      y={y + 22}
                      textAnchor="middle"
                      fontSize="12.5"
                      fill={rel ? "var(--ink)" : "var(--muted)"}
                      fontWeight={isF ? 700 : 400}
                      style={{ fontFamily: "var(--font-body)" }}
                    >
                      {label}
                    </text>
                  </g>
                );
              })}
            </svg>
            <div className="border-line border-t px-4 py-3">

                <p className="mt-4 max-w-[52ch] text-[18px] leading-relaxed text-muted">

              <div className="mt-14 grid gap-24 sm:gap-32">

                    flip={i % 2 === 1}

                  />

      }

      function D_Index({ onOpen, open }) {
        return (
          <section
            id="d-index"
            aria-labelledby="d-index-h"
            className="scroll-mt-6 px-4 pt-28 sm:px-8 sm:pt-40"
          >
            <div className="mx-auto max-w-[1240px]">
              <div className="max-w-[46rem]">
                <h2
                  id="d-index-h"
                  className="font-display text-[2.1rem] leading-[1.08] sm:text-[3rem]"
                >
                  Everything on the desk
                </h2>
                <p className="mt-4 max-w-[52ch] text-[18px] leading-relaxed text-muted">
                  The eight objects, in the order you use them in a project.
                  Open one to see each feature it holds.
                </p>
              </div>
              <ol className="border-line mt-12 grid border-t md:grid-cols-2 md:gap-x-12">
                {JOBS.map((j, i) => {
                  const feats = featuresOf(j.id);
                  return (
                    <li key={j.id} className="border-line border-b">
                      <button
                        type="button"
                        onClick={() => onOpen(j.id)}
                        aria-haspopup="dialog"
                        aria-expanded={open === j.id}
                        className="group grid w-full grid-cols-[64px_minmax(0,1fr)_auto] items-start gap-4 py-6 text-left sm:grid-cols-[84px_minmax(0,1fr)_auto] sm:gap-5"
                      >
                        <span
                          className="grid aspect-square w-full place-items-center rounded-[12px] p-2"
                          style={{ background: "var(--d-desk)" }}
                        >
                          <D_ObjIcon
                            id={j.id}
                            className="size-full transition-transform duration-300 group-hover:-translate-y-0.5"
                          />
                        </span>
                        <span className="min-w-0">
                          <span className="flex items-baseline gap-2.5">
                            <span className="font-mono text-[11px] text-muted">
                              {D_NUM(i)}
                            </span>
                            <span className="font-display decoration-accent text-[21px] leading-tight decoration-2 underline-offset-4 group-hover:underline">
                              {j.name}
                            </span>
                          </span>
                          <span className="text-ink mt-1.5 block text-[15.5px] leading-snug">
                            {j.outcome}
                          </span>
                          <span className="mt-2 block text-[13px] leading-snug text-muted">
                            {feats.length} features:{" "}
                            {feats.map((f) => f.name).join(" · ")}
                          </span>
                        </span>
                        <D_Icon
                          name="ChevronRight"
                          size={20}
                          className="mt-1 text-muted transition-transform group-hover:translate-x-0.5"
                        />
                      </button>
                    </li>
                  );
                })}
              </ol>
            </div>
          </section>
        );
      }

      function D_Setup() {
        const need = [
          { icon: "NotebookPen", text: FACTS.obsidian },
          { icon: "Library", text: `${FACTS.zotero}. ${FACTS.zoteroEdit}.` },
          { icon: "Monitor", text: FACTS.platforms },
        ];
        return (
          <section
            id="d-setup"
            aria-labelledby="d-setup-h"
            className="px-4 pt-28 pb-20 sm:px-8 sm:pt-40"
          >
            <div className="mx-auto max-w-[1240px]">
              <div className="max-w-[46rem]">
                <h2
                  id="d-setup-h"
                  className="font-display text-[2.1rem] leading-[1.08] sm:text-[3rem]"
                >
                  Set up your desk
                </h2>
                <p className="mt-4 text-[18px] leading-relaxed text-muted">
                  Three steps, all inside Obsidian.
                </p>
              </div>
              <ol className="mt-12 grid gap-5 md:grid-cols-3">
                {INSTALL_STEPS.map((s, i) => (
                  <li
                    key={s.name}
                    className="d-sheet border-line bg-surface flex flex-col rounded-[12px] border p-6"
                  >
                    <span className="font-display text-accent text-[44px] leading-none">
                      {i + 1}
                    </span>
                    <h3 className="mt-5 text-[19px] font-semibold">{s.name}</h3>
                    <p className="mt-1.5 text-[15.5px] leading-relaxed text-muted">
                      {s.line}
                    </p>
                    <a
                      href={s.href}
                      className="d-link mt-auto inline-flex items-center gap-1 pt-5 text-[14.5px] font-semibold"
                    >
                      {i === 0 ? "Open in Obsidian" : "Follow the tutorial"}
                      <D_Icon name="ArrowUpRight" size={14} />
                    </a>
                  </li>
                ))}
              </ol>
              <div className="mt-16 grid gap-12 md:grid-cols-2">
                <div>
                  <h3 className="font-mono text-[11.5px] tracking-[0.08em] text-muted uppercase">
                    What you need
                  </h3>
                  <ul className="mt-4 grid gap-3.5">
                    {need.map((n) => (
                      <li
                        key={n.text}
                        className="flex items-start gap-3 text-[16px] leading-snug"
                      >
                        <D_Icon
                          name={n.icon}
                          size={18}
                          className="mt-0.5 shrink-0 text-muted"
                        />
                        {n.text}
                      </li>
                    ))}
                  </ul>
                </div>
                <div>
                  <h3 className="font-mono text-[11.5px] tracking-[0.08em] text-muted uppercase">
                    Optional add-ons for Zotero
                  </h3>
                  <ul className="mt-4 grid gap-4">
                    {ADDONS.map((a) => (
                      <li key={a.name}>
                        <p className="flex flex-wrap items-center gap-2 text-[16px] font-semibold">
                          {a.name}
                          <span className="border-line rounded-full border px-2 py-[3px] text-[11.5px] leading-none font-medium text-muted">
                            Optional
                          </span>
                        </p>
                        <p className="mt-1 text-[15px] leading-snug text-muted">
                          {a.line}
                        </p>
                        <a
                          href={a.href}
                          className="d-link mt-1 inline-flex items-center gap-1 text-[14px] font-semibold"
                        >
                          How to install
                          <D_Icon name="ArrowUpRight" size={14} />
                        </a>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>
              <div className="border-line mt-14 grid gap-5 border-t pt-8 text-[16px] leading-snug md:grid-cols-2">
                <p className="flex items-start gap-3">
                  <D_Icon
                    name="ShieldCheck"
                    size={19}
                    className="mt-0.5 shrink-0 text-muted"
                  />
                  {FACTS.privacy}
                </p>
                <p className="flex items-start gap-3">
                  <D_Icon
                    name="Scale"
                    size={19}
                    className="mt-0.5 shrink-0 text-muted"
                  />
                  {FACTS.license}.
                </p>
              </div>
              <div className="mt-12 flex flex-wrap gap-3">
                <D_LinkBtn href={FACTS.install}>Install ZotLit</D_LinkBtn>
                <D_LinkBtn href={FACTS.firstNote} kind="secondary" icon={null}>
                  Start the tutorial
                </D_LinkBtn>
              </div>
            </div>
          </section>
        );
      }

      function D_Footer() {
        return (
          <footer className="border-line border-t px-4 sm:px-8">
            <div className="mx-auto flex max-w-[1240px] flex-wrap items-center gap-x-8 gap-y-4 py-10">
              <span className="text-[20px]">
                <Lockup
                  ink="var(--ink)"
                  accent="var(--accent)"
                  markInk="var(--d-mark-ink)"
                  markAccent="var(--d-mark-accent)"
                />
              </span>
              <span className="text-[13.5px] text-muted">
                Version {FACTS.version} · {FACTS.license}
              </span>
              <nav
                aria-label="Footer"
                className="flex flex-wrap gap-x-5 gap-y-2 text-[14.5px] md:ml-auto"
              >
                <a className="hover:underline" href={FACTS.docs}>
                  Docs
                </a>
                <a className="hover:underline" href={FACTS.changelog}>
                  Changelog
                </a>
                <a className="hover:underline" href={FACTS.community}>
                  Community
                </a>
                <a className="hover:underline" href={FACTS.github}>
                  GitHub
                </a>
              </nav>
            </div>
          </footer>
        );
      }

      function VariantD() {
        const { motion } = useProtoState();
        const wide = D_useMedia("(min-width: 768px)");
        const side = D_useMedia("(min-width: 1024px)");
        const [open, setOpen] = useState(null);
        const trigger = useRef(null);
        const openJob = useCallback((id) => {
          setOpen((cur) => {
            if (!cur) trigger.current = document.activeElement;
            return id;
          });
        }, []);
        const close = useCallback(() => {
          setOpen(null);
          const el = trigger.current;
          trigger.current = null;
          if (el && el.focus)
            setTimeout(() => el.focus({ preventScroll: true }), 0);
        }, []);
        const jump = useCallback(
          (id) => {
            trigger.current = null;
            setOpen(null);
            requestAnimationFrame(() => {
              const el = document.getElementById(id);
              if (el)
                el.scrollIntoView({
                  behavior: motion ? "smooth" : "auto",
                  block: "center",
                });
            });
          },
          [motion],
        );
        useEffect(() => {
          if (!open) return;
          const onKey = (e) => {
            if (e.key === "Escape") close();
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [open, close]);
        useEffect(() => {
          if (!open || side) return;
          const prev = document.body.style.overflow;
          document.body.style.overflow = "hidden";
          return () => {
            document.body.style.overflow = prev;
          };
        }, [open, side]);
        return (
          <div
            data-v="D"
            className="bg-ground font-body text-ink min-h-screen overflow-x-clip pb-24"
          >
            <style>{D_CSS}</style>
            <D_Header />
            <main>
              <D_Hero wide={wide} open={open} onOpen={openJob} />
              <D_Signature paused={!!open} />
              <D_Index onOpen={openJob} open={open} />
              <D_Setup />
            </main>
            <D_Footer />
            <Motion.AnimatePresence>
              {open && (
                <D_Panel
                  key="panel"
                  jobId={open}
                  side={side}
                  onClose={close}
                  onNav={setOpen}
                  onJump={jump}
                />
              )}
            </Motion.AnimatePresence>
          </div>
        );
      }
      // --- Variant D END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Exploded view", component: VariantA },
        { key: "F", name: "Desk to window", component: VariantF },
        { key: "G", name: "Drawing set", component: VariantG },
        { key: "H", name: "Desk explorer", component: VariantH },
        { key: "D", name: "The desk from above", component: VariantD },
      ];

      function App() {
        const { motion } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          window.scrollTo(0, 0);
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        const btn = {
          background: "none",
          border: "none",
          color: "inherit",
          cursor: "pointer",
          fontSize: "1.1rem",
          padding: "0 0.25rem",
        };
        return (
          <>
            <V.component key={V.key} />
            <div
              style={{
                position: "fixed",
                bottom: "1rem",
                left: "50%",
                transform: "translateX(-50%)",
                background: "#111827",
                color: "#f8fafc",
                borderRadius: "9999px",
                padding: "0.45rem 1rem",
                display: "flex",
                alignItems: "center",
                gap: "0.75rem",
                fontSize: "0.8125rem",
                zIndex: 9999,
                boxShadow: "0 6px 20px rgba(0,0,0,0.35)",
                fontFamily: "ui-sans-serif, system-ui, sans-serif",
                maxWidth: "calc(100vw - 2rem)",
                whiteSpace: "nowrap",
              }}
            >
              <button
                aria-label="Previous variant"
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={btn}
              >
                ←
              </button>
              <span style={{ display: "flex", gap: "0.35rem" }}>
                {VARIANTS.map((v, i) => (
                  <button
                    key={v.key}
                    aria-label={`Variant ${v.key}: ${v.name}`}
                    onClick={() => setIdx(i)}
                    style={{
                      width: "1.5rem",
                      height: "1.5rem",
                      borderRadius: "9999px",
                      border: "none",
                      cursor: "pointer",
                      background:
                        i === idx ? "#E8622C" : "rgba(255,255,255,0.12)",
                      color: "#fff",
                      fontSize: "0.7rem",
                      fontWeight: 600,
                    }}
                  >
                    {v.key}
                  </button>
                ))}
              </span>
              <span
                style={{
                  minWidth: "10rem",
                  overflow: "hidden",
                  textOverflow: "ellipsis",
                }}
              >
                {V.name}
              </span>
              <button
                aria-label="Next variant"
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={btn}
              >
                →
              </button>
              <button
                onClick={() => setProto((s) => ({ motion: !s.motion }))}
                style={{
                  ...btn,
                  fontSize: "0.75rem",
                  border: "1px solid rgba(255,255,255,0.25)",
                  borderRadius: "9999px",
                  padding: "0.15rem 0.6rem",
                }}
              >
                {motion ? "Pause motion" : "Play motion"}
              </button>
            </div>
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
