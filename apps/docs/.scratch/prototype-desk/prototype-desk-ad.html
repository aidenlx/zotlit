                  className={
                    "px-2.5 py-1 text-[12.5px] " +
                    (i ? "border-ink/70 border-l " : "") +
                    (style === s.id ? "bg-ink text-ground" : "hover:bg-ground")
                  }
                >
                  {s.id === "apa"
                    ? "APA"
                    : s.id === "chicago"
                      ? "Chicago"
                      : "IEEE"}
                </button>
              ))}
            </div>
          </div>
        );
      }

      // Which moment of the demo each part pins while the reader points at it.
      const G_CITE_PIN = {
        suggester: 2,
        popover: 5,
        livePreview: 4,
        styles: 4,
        wikilinkCites: 4,
      };

      function G_DemoCite({ active, part }) {
        const boxRef = useRef(null);
        const typingRef = useRef(null);
        const textRef = useRef(null);
        const citeEls = useRef({});
        const rawOf = useRef({});
        const [style, setStyle] = useState("apa");
        const [hover, setHover] = useState(null);
        const run = active && !part;
        const stepT = useTimeline([1300, 1700, 2000, 1200, 1300, 4800], {
          active: run,
        });
        const step =
          part && G_CITE_PIN[part] != null ? G_CITE_PIN[part] : stepT;
        const typedT = useTypewriter("[@situ", {
          cps: 7,
          active: run && stepT >= 1,
        });
        const typed = part === "suggester" ? "[@situ" : typedT;
        const order = G_CITE_ORDER;
        const src0 = DRAFT.source[0];
        const cut = src0.indexOf("[@haraway1988");
        const before = src0.slice(0, cut);
        const after = src0.slice(src0.indexOf("]", cut) + 1);
        const pop = hover || (step === 5 ? "c-haraway1988" : null);
        const popKey = pop ? pop.split(":")[0].replace("c-", "") : null;
        const popPos = useGFloat(
          boxRef,
          (id) => citeEls.current[id],
          pop,
          400,
          textRef,
          style,
        );
        const sugPos = useGFloat(
          boxRef,
          () => typingRef.current,
          step === 2 ? "sug" : null,
          340,
          textRef,
          typed.length,
        );
        // The "what you type" column: each citation's Markdown, on the citation's line.
        const { w: boxW } = useGSize(boxRef);
        const [marks, setMarks] = useState([]);
        rawOf.current["c-haraway1988"] =
          step <= 2 ? typed || "[@" : "[@haraway1988, p. 581]";
        useLayoutEffect(() => {
          const box = boxRef.current;
          const text = textRef.current;
          if (!box || !text) return;
          const b = box.getBoundingClientRect();
          const t = text.getBoundingClientRect();
          if (b.right - t.right < 270) {
            setMarks((m) => (m.length ? [] : m));
            return;
          }
          const out = Object.entries(citeEls.current)
            .filter(([, el]) => el && el.isConnected)
            .map(([id, el]) => {
              const rs = el.getClientRects();
              const r = rs[rs.length - 1] || el.getBoundingClientRect();
              return {
                id,
                y: r.top - b.top + r.height / 2,
                raw: rawOf.current[id],
              };
            })
            .sort((p, q) => p.y - q.y);
          for (let k = 1; k < out.length; k++)
            out[k].y = Math.max(out[k].y, out[k - 1].y + 30);
          const x0 = t.right - b.left + 24;
          setMarks(out.map((m) => ({ ...m, x0, x1: x0 + 40 })));
        }, [step, style, boxW, typed]);

        const cite = (c, id, flash = false, gpart = null, side = "t") => (
          <button
            key={id + (flash ? step : "")}
            ref={(el) => {
              citeEls.current[id] = el;
              rawOf.current[id] = c.raw || "[@haraway1988, p. 581]";
            }}
            type="button"
            aria-label={`Citation: ${PAPERS[c.key].inText} ${PAPERS[c.key].year}. Show the full reference.`}
            onMouseEnter={() => setHover(id)}
            onMouseLeave={() => setHover(null)}
            onFocus={() => setHover(id)}
            onBlur={() => setHover(null)}
            {...(gpart ? { "data-g-part": gpart, "data-g-side": side } : {})}
            className={
              "text-cite decoration-cite/40 hover:decoration-cite cursor-pointer underline underline-offset-[3px] " +
              (flash ? "g-flash" : "")
            }
          >
            {inText(c.key, { style, locator: c.locator, order })}
          </button>
        );

        const typingEl = (el) => {
          typingRef.current = el;
          citeEls.current["c-haraway1988"] = el;
        };
        let typing;
        if (step <= 2)
          typing = (
            <span ref={typingEl} className="relative">
              {typed}
              {active && <span className="g-caret" />}
            </span>
          );
        else if (step === 3)
          typing = (
            <span ref={typingEl}>
              <span className="bg-ground px-0.5 text-muted">
                [@haraway1988, p. 581]
              </span>
              {active && <span className="g-caret" />}
            </span>
          );
        else
          typing = cite(
            { key: "haraway1988", locator: "p. 581" },
            "c-haraway1988",
            step === 4,
          );

        return (
          <div className="border-ink/70 bg-surface border">
            <G_Pane
              title={`${DRAFT.title}.md`}
              icon="FileText"
              right={
                <span className="hidden text-[11px] @lg:inline">
                  Live Preview
                </span>
              }
            >
              <div className="border-line flex flex-wrap items-center justify-between gap-3 border-b px-5 py-2.5 @lg:px-10">
                <G_StylePicker style={style} setStyle={setStyle} />
                <span className="g-label text-muted">Type [@ to cite</span>
              </div>
              <div
                ref={boxRef}
                className="relative px-5 pt-10 pb-44 @lg:px-10 @4xl:px-16"
              >
                {marks.length > 0 && (
                  <div aria-hidden="true">
                    <div
                      className="border-line absolute top-11 border-l pl-4"
                      style={{ left: marks[0].x1 - 17, bottom: 40 }}
                    >
                      <div className="g-label text-muted">What you type</div>
                      <div className="mt-1 max-w-[15rem] text-[13px] leading-[1.45] text-muted">
                        The note keeps plain citation keys. You read formatted
                        citations.
                      </div>
                    </div>
                    {marks.map((m) => {
                      const on = pop === m.id;
                      return (
                        <Fragment key={m.id}>
                          <span
                            className="absolute h-px border-t border-dashed border-muted/60"
                            style={{
                              left: m.x0,
                              width: m.x1 - m.x0 - 6,
                              top: m.y,
                            }}
                          />
                          <span
                            className="absolute size-[5px] -translate-y-1/2 rounded-full bg-muted"
                            style={{ left: m.x0 - 2, top: m.y + 0.5 }}
                          />
                          <span
                            className={
                              "absolute -translate-y-1/2 px-1 font-mono text-[12.5px] whitespace-nowrap transition-colors " +
                              (on ? "bg-accent/10 text-ink" : "text-muted")
                            }
                            style={{ left: m.x1, top: m.y }}
                          >
                            {m.raw}
                          </span>
                        </Fragment>
                      );
                    })}
                  </div>
                )}
                <div ref={textRef} className="max-w-[34rem]">
                  <h4 className="font-display text-[30px] leading-[1.1] font-semibold tracking-tight">
                    {DRAFT.title}
                  </h4>
                  <h5 className="font-display mt-5 text-[20px] font-semibold tracking-tight">
                    {DRAFT.heading}
                  </h5>
                  <p
                    data-g-part="livePreview"
                    data-g-side="l"
                    data-g-at="0.2"
                    className="mt-3 text-[17px] leading-[1.75]"
                  >
                    <G_Prose
                      src={before}
                      style={style}
                      order={order}
                      cite={(c, i) =>
                        cite(c, "c-" + c.key + ":" + i, false, null)
                      }
                    />
                    {typing}
                    {step >= 3 ? after : ""}
                  </p>
                  <p className="mt-4 text-[17px] leading-[1.75]">
                    <G_Prose
                      src={DRAFT.source[1]}
                      style={style}
                      order={order}
                      cite={(c, i) => cite(c, "c-" + c.key + ":p2" + i)}

                  </p>
                  <p className="mt-4 text-[17px] leading-[1.75]">
                    A boundary object keeps one identity across the groups that
                    use it{" "}
                    {cite(
                      { key: "star1989", locator: null, raw: "[[star1989]]" },
                      "c-star1989:w",
                      false,
                      "wikilinkCites",
                      "b",
                    )}
                    .
                  </p>
                </div>
                {step === 2 && sugPos && (
                  <div
                    data-g-part="suggester"
                    data-g-side="r"
                    data-g-at="0.35"
                    className="g-shadow border-ink/70 bg-surface absolute z-20 border"
                    style={{
                      left: sugPos.left,
                      top: sugPos.top,
                      width: sugPos.w,

                    {["haraway1988", "suchman1987"].map((k, i) => (
                      <div

                          "border-line border-b px-3 py-2 " +
                          (i === 0 ? "bg-cite/10" : "")

                        <div className="truncate text-[14px] font-medium">
                          {PAPERS[k].title}

                        <div className="mt-0.5 text-[12px] text-muted">
                          {PAPERS[k].inText} · {PAPERS[k].year} · @{k}
                        </div>
                      </div>
                    ))}

                      Citation Suggester

                  </div>

                {popKey && popPos && (
                  <div

                    data-g-part="popover"
                    data-g-side="b"
                    data-g-at="0.3"
                    className="g-shadow border-ink/70 bg-surface absolute z-20 border"

                    <div className="p-3.5 text-[14px] leading-[1.55]">

                    <div className="border-line flex flex-wrap items-center gap-x-4 gap-y-1 border-t px-3.5 py-2 text-[12.5px] text-muted">
                      {PAPERS[popKey].note && (

                      {PAPERS[popKey].pdf && (

                        Show in Zotero
                      </span>
                    </div>
                  </div>
                )}
              </div>
            </G_Pane>
          </div>
        );
      }

      // ---------- Detail 06 · Pinboard · See how your sources connect ----------
      const G_STATUS_NEXT = {

        const { motion } = useProtoState();
        const total = GRAPH.edges.length;
        const [n, setN] = useState(motion ? 0 : total);
        const [picked, setPicked] = useState(null);
        useEffect(() => {
          if (!motion) {

            return;

          const id = setInterval(
            () => setN((x) => Math.min(total, x + 1)),
            110,
          );
          return () => clearInterval(id);
        }, [active, motion, n >= total]);
        const refs = gRefOrder(NOTES[0].cites, "apa");
        const idx = useLoop(2200, refs.length, {
          active: active && !picked && !part && n >= total,
          start: refs.indexOf("haraway1988"),

        const lit = picked || (n >= total ? refs[idx] : "haraway1988");
        const pick = (id) => setPicked((p) => (p === id ? null : id));
        const paperKey = PAPERS[lit] ? lit : "haraway1988";
        const citers = citedBy(paperKey);
        const [layout, setLayout] = useState("Table");
        const [status, setStatus] = useState(() =>
          Object.fromEntries(PAPER_KEYS.map((k) => [k, PAPERS[k].status])),
        );
        const cycle = (k) =>
          setStatus((s) => ({ ...s, [k]: G_STATUS_NEXT[s[k]] || "to-read" }));
        const keys = papersIn("Thesis/Ch. 2 Situated models").sort(

        const { w: graphW } = useGSize(graphRef);

                className="border-line @4xl:border-r"
                bodyClass="flex flex-col"

                  data-g-side="l"
                  data-g-at="0.45"
                  className="flex flex-1 items-center px-2 py-2 @lg:px-6 @lg:py-4"
                >
                  <G_GraphSvg

                    drawn={n / total}
                    onPick={pick}

                    className="block h-auto w-full"
                  />

                    <span className="bg-ink inline-block size-2.5 rounded-full" />
                    Your note
                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="bg-accent inline-block size-2.5 rounded-full" />

                  </span>
                  <span className="flex items-center gap-1.5">
                    <span className="inline-block size-2.5 rounded-full border border-dashed border-muted" />

                  <span className="flex items-center gap-1.5">
                    <span className="bg-cite inline-block h-px w-4" />
                    Citation
                  </span>
                </div>
              </G_Pane>
              <G_Pane

                icon="Quote"
                className="border-line border-t @4xl:border-t-0"

      function G_DemoExport({ active, part }) {

          return () => clearTimeout(t);

        const file =
          format === "HTML"

        const styleName = CSL_STYLES.find((s) => s.id === style).name;

          <div className="border-ink/70 bg-surface grid border @xl:grid-cols-[236px_minmax(0,1fr)]">

                    </div>
                  </div>
                  <div className="bg-ink text-ground relative h-9 overflow-hidden text-center text-[13px] leading-9 font-semibold">
                    <span
                      className="bg-accent absolute inset-y-0 left-0 transition-[width] duration-[1100ms] ease-out"

        const s = CLI_SESSIONS[sel];

        const done = cmd.length === s.cmd.length;
        return (
          <div className="p-4">
            <div className="g-label text-muted">Ask a question</div>
            <div
              className="mt-2 grid gap-1.5"
              role="radiogroup"

      function G_Agent({ active }) {
        const boxRef = useRef(null);
        const { motion } = useProtoState();
        const all = AGENT_SESSION.length;
        const [shown, setShown] = useState(motion ? 1 : all);
        useEffect(() => {
          if (!motion) {
            setShown(all);
            return;
          }
          if (!active || shown >= all) return;
          const t = setTimeout(() => setShown((x) => x + 1), 1200);
          return () => clearTimeout(t);
        }, [active, motion, shown]);
        useEffect(() => {
          const b = boxRef.current;
          if (b) b.scrollTop = b.scrollHeight;
        }, [shown]);
        return (
          <div>
            <div
              ref={boxRef}
              className="g-scroll flex h-[400px] min-w-0 flex-col gap-2.5 overflow-y-auto p-4"
            >
              {AGENT_SESSION.slice(0, shown).map((m, mi) => {
                if (m.who === "user")
                  return (
                    <div
                      key={mi}
                      className="border-line bg-ground ml-10 self-end border px-3 py-2 text-[14px] leading-[1.45]"
                    >
                      {m.text}

                  return (
                    <div

            el.scrollIntoView({
              behavior: motion ? "smooth" : "auto",
              block: "start",
            });
            const h = document.getElementById(`g-h-${id}`);
            if (h) h.focus({ preventScroll: true });
          },
          [motion],
        );
        // The current sheet: the last one whose top has passed 40% of the viewport height.
        useEffect(() => {
          const els = Array.from(
            document.querySelectorAll('[data-v="G"] [data-g-sheet]'),
          );
          let raf = 0;
          const read = () => {
            raf = 0;
            const line = window.innerHeight * 0.4;
            let id = els[0] && els[0].getAttribute("data-g-sheet");
            els.forEach((el) => {
              if (el.getBoundingClientRect().top <= line)
                id = el.getAttribute("data-g-sheet");
            });
            if (id) setCur(id);
          };
          const queue = () => {
            if (!raf) raf = requestAnimationFrame(read);
          };
          read();
          window.addEventListener("scroll", queue, { passive: true });
          window.addEventListener("resize", queue);
          return () => {
            window.removeEventListener("scroll", queue);
            window.removeEventListener("resize", queue);
            cancelAnimationFrame(raf);
          };
        }, []);
        return (
          <div
            data-v="G"
            data-motion={motion ? "on" : "off"}
            className="bg-ground font-body text-ink min-h-screen overflow-x-clip pb-24 antialiased"

      // --- Variant H ---
      // Variant H · Desk explorer.
      // D's flat illustrated desk is the hero. Pick up an object and it lifts off the desk, flies to
      // a drafting sheet in the same place, and comes apart into A's exploded drawing: one thin layer
      // per feature of that job, each with an orange leader to its name. After a beat the lead layer
      // turns face-on and becomes the working demo, with the other features listed beside it. Below
      // the desk: the three signature features as large demos, the plain list of everything on the
      // desk, and setup with small assembly drawings.

      // ---------- Small helpers ----------
      const hNum = (i) => String(i + 1).padStart(2, "0");
      const hAnd = (a) =>
        a.length < 2
          ? a.join("")
          : `${a.slice(0, -1).join(", ")} and ${a[a.length - 1]}`;
      const hClamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));
      const hSeg = (p, a, b) => hClamp((p - a) / (b - a));
      const hEase = (t) => t * t * (3 - 2 * t);
      const hLerp = (a, b, t) => a + (b - a) * t;
      const hSum = (o) => Object.values(o || {}).reduce((s, n) => s + n, 0);
      // Citation keys in order of first use in the Ch. 2 draft (IEEE numbering, sidebars).
      const H_DRAFT_ORDER = [
        "bommasani2021",
        "haraway1988",
        "vaswani2017",
        "bender2021",
      ];
      const H_DRAFT_REFS = [...H_DRAFT_ORDER].sort((a, b) =>
        PAPERS[a].apaAuthors.localeCompare(PAPERS[b].apaAuthors),
      );
      const H_TYPE_LABEL = {
        journalArticle: "Journal article",
        conferencePaper: "Conference paper",
        book: "Book",
        preprint: "Preprint",
      };
      // Two items in the STS Lab group library (mock data for the group search demo).
      const H_GROUP_PAPERS = [
        {
          key: "lave1991",
          title: "Situated Learning: Legitimate Peripheral Participation",
          inText: "Lave & Wenger",
          year: 1991,
        },
        {
          key: "jasanoff2004",
          title:
            "States of Knowledge: The Co-Production of Science and Social Order",
          inText: "Jasanoff",
          year: 2004,
        },
      ];

      function H_Ico({
        n,
        size = 16,
        className = "",
        strokeWidth = 1.75,
        ...rest
      }) {
        const C = Icons[n] || Icons.Circle;
        return (
          <C
            size={size}
            className={className}
            strokeWidth={strokeWidth}
            aria-hidden="true"
            {...rest}
          />
        );
      }

      function useHMedia(q) {
        const [m, setM] = useState(() => window.matchMedia(q).matches);
        useEffect(() => {
          const mq = window.matchMedia(q);
          const on = () => setM(mq.matches);
          on();
          mq.addEventListener("change", on);
          return () => mq.removeEventListener("change", on);
        }, [q]);
        return m;
      }

      // True while the element crosses a thin band at the middle of the viewport. Demos that loop
      // run only then, so at most one loop plays at a time.
      function useHBand(ref) {
        const [on, setOn] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => setOn(e.isIntersecting),
            {
              rootMargin: "-46% 0px -46% 0px",
              threshold: 0,
            },
          );
          io.observe(el);
          return () => io.disconnect();
        }, []);
        return on;
      }

      // The element's size, kept current with a ResizeObserver.
      function useHSize(ref) {
        const [size, setSize] = useState({ w: 0, h: 0 });
        useLayoutEffect(() => {
          const el = ref.current;
          if (!el) return;
          const read = () => {
            const r = el.getBoundingClientRect();
            setSize((s) =>
              Math.abs(s.w - r.width) < 0.5 && Math.abs(s.h - r.height) < 0.5
                ? s
                : { w: r.width, h: r.height },
            );
          };
          read();
          const ro = new ResizeObserver(read);
          ro.observe(el);
          return () => ro.disconnect();
        }, []);
        return size;

        if (!btn || !deskEl) return null;
        const r = btn.getBoundingClientRect();
        const d = deskEl.getBoundingClientRect();
        return {
          cx: r.left + r.width / 2,
          cy: r.top + r.height / 2,
          k: (d.width / L.W) * (p.s || 1),
          r: p.r,

      function H_Desk({
        L,
        onPick,
        btnRefs,
        settle = "all",
        hide = null,
        interactive = true,

        const { motion } = useProtoState();
        const [hot, setHot] = useState(null);
        const ref = useRef(null);
        const band = useHBand(ref);
        const wide = L.key === "wide";
        const anim = !motion || !interactive ? "off" : band ? "run" : "pause";
        const box = (id) => {
          const o = H_OBJ[id];
          const p = L.at[id];
          const s = p.s || 1;
          return { o, p, s, w: o.w * s, h: o.h * s };
        };
        const pct = (v, total) => `${(v / total) * 100}%`;
        return (
          <div
            ref={ref}
            className="relative w-full"
            style={{ aspectRatio: `${L.W} / ${L.H}` }}
            aria-hidden={interactive ? undefined : "true"}

                            y={y + 9}

      // ---------- Frames, badges and citation helpers for the demos ----------

      function H_Cite({ k, locator = null, style = "apa", className = "" }) {
        return (
          <span
            className={`text-cite decoration-cite/40 rounded-sm underline underline-offset-[3px] ${className}`}

      // A Markdown source paragraph with every citation formatted.
      function H_Rendered({ src, style = "apa", plain = false, renderCite }) {
        return parseCitations(src).map((s, i) => {
          if (s.text != null) return <Fragment key={i}>{s.text}</Fragment>;
          if (renderCite)
            return <Fragment key={i}>{renderCite(s.cite)}</Fragment>;
          if (plain)
            return (
              <Fragment key={i}>
                {inText(s.cite.key, {
                  style,
                  locator: s.cite.locator,
                  order: H_DRAFT_ORDER,
                })}
              </Fragment>

          return (
            <H_Cite
              key={i}
              k={s.cite.key}
              locator={s.cite.locator}
              style={style}
            />
          );
        });
      }

      // References in three styles (A's).
      function hInitials(full) {
        const parts = full.split(" ");
        const last = parts.pop();
        return parts.map((x) => x[0] + ".").join(" ") + " " + last;
      }
      function hLastFirst(full) {
        const parts = full.split(" ");
        const last = parts.pop();
        return last + ", " + parts.join(" ");
      }
      function hAuthors(k, style) {
        const c = PAPERS[k].creators;
        if (style === "ieee") {
          if (c.length > 3) return hInitials(c[0]) + " et al.";
          const names = c.map(hInitials);
          return names.length > 1
            ? names.slice(0, -1).join(", ") +
                (names.length > 2 ? "," : "") +
                " and " +
                names[names.length - 1]
            : names[0];
        }
        if (c.length > 3) return hLastFirst(c[0]) + ", et al.";
        if (c.length === 1) return hLastFirst(c[0]);
        return (
          hLastFirst(c[0]) +
          (c.length > 2 ? ", " + c.slice(1, -1).join(", ") + "," : "") +
          " and " +
          c[c.length - 1]
        );
      }
      // One reference entry in APA, Chicago author-date or IEEE, with italics where they go.
      function H_Ref({ k, style = "apa", n }) {
        const p = PAPERS[k];
        if (style === "apa") return <Bib k={k} />;
        const who = hAuthors(k, style);
        if (style === "chicago") {
          const head = `${who}${who.endsWith(".") ? "" : "."} ${p.year}. `;
          if (p.type === "book")
            return (
              <span>
                {head}
                <i>{p.title}</i>. {p.publisher}.
              </span>
            );
          if (p.type === "journalArticle")
            return (
              <span>
                {head}“{p.title}.” <i>{p.container}</i> {p.volume} ({p.issue}):{" "}
                {p.pages}.
              </span>
            );
          if (p.type === "preprint")
            return (
              <span>
                {head}“{p.title}.” {p.container}. https://doi.org/{p.doi}.
              </span>
            );
          return (
            <span>
              {head}“{p.title}.” In <i>{p.container}</i>, {p.pages}.
            </span>
          );
        }
        const lead = n ? `[${n}] ` : "";
        if (p.type === "book")
          return (
            <span>
              {lead}
              {who}, <i>{p.titleSentence}</i>. {p.publisher}, {p.year}.
            </span>
          );
        if (p.type === "journalArticle")
          return (
            <span>
              {lead}
              {who}, “{p.titleSentence},” <i>{p.container}</i>, vol. {p.volume},
              no. {p.issue}, pp. {p.pages}, {p.year}.
            </span>
          );
        if (p.type === "preprint")
          return (
            <span>
              {lead}
              {who}, “{p.titleSentence},” {p.container}, {p.year}, doi: {p.doi}.
            </span>
          );
        return (
          <span>
            {lead}
            {who}, “{p.titleSentence},” in <i>{p.container}</i>, {p.year}, pp.{" "}
            {p.pages}.
          </span>
        );
      }
      // Reference-list order: alphabetical for APA and Chicago, order of first use for IEEE.
      function hRefOrder(keys, style) {
        if (style === "ieee") return keys;
        return [...keys].sort((a, b) =>
          PAPERS[a].apaAuthors.localeCompare(PAPERS[b].apaAuthors),
        );
      }
      // Text with [@key] citations rendered as formatted citations.
      function H_Prose({ src, style = "apa", order = H_DRAFT_ORDER, cite }) {
        return parseCitations(src).map((seg, i) =>
          seg.cite ? (
            cite ? (
              <Fragment key={i}>{cite(seg.cite, i)}</Fragment>
            ) : (
              <span key={i} className="text-cite">
                {inText(seg.cite.key, {
                  style,
                  locator: seg.cite.locator,
                  order,
                })}
              </span>
            )
          ) : (
            <Fragment key={i}>{seg.text}</Fragment>
          ),
        );
      }

      // Position of a floating box under an anchor element, kept inside its container.
      function useHFloat(boxRef, getAnchor, key, width, limitRef) {
        const [pos, setPos] = useState(null);
        useLayoutEffect(() => {
          const box = boxRef.current;
          const a = key ? getAnchor(key) : null;
          if (!box || !a) {
            setPos(null);
            return;
          }
          const b = box.getBoundingClientRect();
          const r = a.getBoundingClientRect();
          const lim = limitRef && limitRef.current;
          const right = lim
            ? Math.min(
                b.width - 8,
                lim.getBoundingClientRect().right - b.left + 12,
              )
            : b.width - 8;
          const w = Math.min(width, b.width - 16);
          setPos({
            left: Math.max(8, Math.min(r.left - b.left, right - w)),
            top: r.bottom - b.top + 8,
            w,
          });
        }, [key, width]);
        return pos;
      }

      function H_StylePicker({ style, setStyle, label = "Citation style" }) {

      // ---------- Demo · Library View with the Reading Card (A's) ----------

      const H_LP = [

        { src: "[@hara", q: "hara", ms: 1500 },

      const H_LP_MS = H_LP.map((s) => s.ms);

      function H_LivePreview({ active }) {
        const { motion } = useProtoState();
        const step = useTimeline(H_LP_MS, { active });
        const st = H_LP[step];
        const [style, setStyle] = useState("apa");
        const boxRef = useRef(null);
        const anchorRef = useRef(null);
        const [pos, setPos] = useState(null);
        const segs = useMemo(() => parseCitations(DRAFT.source[0]), []);
        const cut = segs.findIndex(
          (s) => s.cite && s.cite.key === "haraway1988",
        );
        const showSug = st.q != null;
        const q = st.q || "";
        const matches = H_DRAFT_ORDER.filter(
          (k) =>
            !q ||
            k.startsWith(q) ||
            PAPERS[k].inText.toLowerCase().startsWith(q),
        ).slice(0, 3);
        useLayoutEffect(() => {
          if (!showSug) return;
          const b = boxRef.current;
          const a = anchorRef.current;
          if (!b || !a) return;
          const br = b.getBoundingClientRect();
          const ar = a.getBoundingClientRect();
          const w = Math.min(300, br.width - 24);
          setPos({
            left: Math.max(12, Math.min(ar.left - br.left, br.width - w - 12)),
            top: ar.bottom - br.top + 6,
            w,
          });
        }, [showSug, step]);
        return (
          <div>
            <H_Sheet label="Manuscript" note="Type [@ to cite">
              <H_Pane
                title={`${DRAFT.title}.md`}
                icon="FileText"
                right={<span className="text-[11px]">Live Preview</span>}
              >
                <div
                  ref={boxRef}
                  className="relative px-5 pt-4 pb-20 text-[14.5px] leading-[1.75] @lg:px-7 @lg:text-[16px]"
                >
                  <p className="font-display text-[19px] leading-snug @lg:text-[22px]">
                    {DRAFT.heading}
                  </p>
                  <p className="mt-2">
                    {segs
                      .slice(0, cut)
                      .map((s, i) =>
                        s.text != null ? (
                          <Fragment key={i}>{s.text}</Fragment>
                        ) : (
                          <H_Cite
                            key={i}
                            k={s.cite.key}
                            locator={s.cite.locator}
                            style={style}
                          />
                        ),
                      )}
                    {st.done ? (
                      <>
                        <H_Cite
                          k="haraway1988"
                          locator="p. 581"
                          style={style}
                          className={motion ? "bg-cite/10" : ""}
                        />
                        .
                      </>
                    ) : (
                      <>
                        <span
                          ref={anchorRef}
                          className="font-mono text-[0.88em] text-muted"
                        >
                          {st.src}
                        </span>
                        <H_Caret on={active} />
                      </>
                    )}
                  </p>
                  <p className="mt-3">
                    <H_Rendered src={DRAFT.source[1]} style={style} />
                  </p>
                  {showSug && pos && (
                    <div
                      className={`h-sheet border-line bg-surface absolute z-10 overflow-hidden rounded-[8px] border text-[13px] ${motion ? "h-rise" : ""}`}
                      style={{ left: pos.left, top: pos.top, width: pos.w }}

                      <p className="h-label border-line border-b px-3 py-1.5 text-muted">
                        Citation Suggester

                      <ul className="p-1">
                        {matches.map((k, i) => (
                          <li
                            key={k}
                            className={`rounded-md px-2.5 py-1.5 ${i === 0 ? "bg-cite/12" : ""}`}

                              {PAPERS[k].inText} · {PAPERS[k].year}
                            </span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              </H_Pane>
            </H_Sheet>
            <div
              className="mt-4 flex flex-wrap items-center gap-2 text-[13px]"

            >

        const order = H_DRAFT_ORDER;
        const src0 = DRAFT.source[0];
        const cut = src0.indexOf("[@haraway1988");
        const before = src0.slice(0, cut);
        const after = src0.slice(src0.indexOf("]", cut) + 1);
        const pop = hover || (step === 5 ? "c-haraway1988" : null);
        const popKey = pop ? pop.split(":")[0].replace("c-", "") : null;
        const popPos = useHFloat(
          boxRef,
          (id) => citeEls.current[id],
          pop,
          400,
          textRef,
        );
        const sugPos = useHFloat(
          boxRef,
          () => typingRef.current,
          step === 2 ? "sug" : null,
          340,
          textRef,
        );
        // The "what you type" column: each citation's Markdown, on the citation's line.
        const rawOf = useRef({});
        const { w: boxW } = useHSize(boxRef);
        const [marks, setMarks] = useState([]);
        rawOf.current["c-haraway1988"] =
          step <= 2 ? typed || "[@" : "[@haraway1988, p. 581]";
        useLayoutEffect(() => {
          const box = boxRef.current;
          const text = textRef.current;
          if (!box || !text) return;
          const b = box.getBoundingClientRect();
          const t = text.getBoundingClientRect();
          if (b.right - t.right < 240) {
            setMarks((m) => (m.length ? [] : m));
            return;
          }
          const out = Object.entries(citeEls.current)
            .filter(([, el]) => el && el.isConnected)
            .map(([id, el]) => {
              const rs = el.getClientRects();
              const r = rs[rs.length - 1] || el.getBoundingClientRect();
              return {
                id,
                y: r.top - b.top + r.height / 2,
                raw: rawOf.current[id],
              };
            })
            .sort((p, q) => p.y - q.y);
          for (let k = 1; k < out.length; k++)
            out[k].y = Math.max(out[k].y, out[k - 1].y + 30);
          const x0 = t.right - b.left + 20;
          setMarks(out.map((m) => ({ ...m, x0, x1: x0 + 34 })));
        }, [step, style, boxW, typed]);

        const cite = (c, id, flash = false) => (
          <button
            key={id + (flash ? step : "")}
            ref={(el) => {
              citeEls.current[id] = el;
              rawOf.current[id] = c.raw || "[@haraway1988, p. 581]";
            }}
            type="button"
            aria-label={`Citation: ${PAPERS[c.key].inText} ${PAPERS[c.key].year}. Show the full reference.`}
            onMouseEnter={() => setHover(id)}
            onMouseLeave={() => setHover(null)}
            onFocus={() => setHover(id)}
            onBlur={() => setHover(null)}
            className={
              "text-cite decoration-cite/40 hover:decoration-cite cursor-pointer underline underline-offset-[3px] " +
              (flash ? "h-flash" : "")
            }
          >
            {inText(c.key, { style, locator: c.locator, order })}
          </button>
        );
        const typingEl = (el) => {
          typingRef.current = el;
          citeEls.current["c-haraway1988"] = el;
        };
        let typing;
        if (step <= 2)
          typing = (
            <span ref={typingEl} className="relative">
              {typed}
              <H_Caret on={active} />
            </span>
          );
        else if (step === 3)
          typing = (
            <span ref={typingEl}>
              <span className="bg-ground px-0.5 text-muted">
                [@haraway1988, p. 581]
              </span>
              <H_Caret on={active} />
            </span>
          );
        else
          typing = cite(
            { key: "haraway1988", locator: "p. 581" },
            "c-haraway1988",
            step === 4,
          );

        return (
          <H_Sheet
            label="Manuscript"
            note="Try it: point at a citation, change the style"
          >
            <H_Pane
              title={`${DRAFT.title}.md`}
              icon="FileText"

                <span className="hidden text-[11px] sm:inline">

              <div className="border-line flex flex-wrap items-center justify-between gap-3 border-b px-5 py-2.5 sm:px-8">
                <H_StylePicker style={style} setStyle={setStyle} />

              </div>
              <div

              >
                {marks.length > 0 && (

                      className="border-line absolute top-8 border-l pl-4"
                      style={{ left: marks[0].x1 - 17, bottom: 40 }}

                      <div className="h-label text-muted">What you type</div>
                      <div className="mt-1 max-w-[12rem] text-[13px] leading-[1.45] text-muted">

                      </div>
                    </div>
                    {marks.map((m) => {
                      const on = pop === m.id;
                      return (
                        <Fragment key={m.id}>
                          <span
                            className="border-accent/70 absolute h-px border-t border-dashed"
                            style={{
                              left: m.x0,
                              width: m.x1 - m.x0 - 6,
                              top: m.y,
                            }}
                          />
                          <span
                            className="bg-accent absolute size-[5px] -translate-y-1/2 rounded-full"
                            style={{ left: m.x0 - 2, top: m.y + 0.5 }}
                          />
                          <span
                            className={
                              "absolute -translate-y-1/2 px-1 font-mono text-[12px] whitespace-nowrap transition-colors " +
                              (on ? "bg-accent/10 text-ink" : "text-muted")
                            }
                            style={{ left: m.x1, top: m.y }}
                          >
                            {m.raw}
                          </span>

                      );
                    })}

                )}
                <div
                  ref={textRef}
                  className="max-w-[40rem] @2xl:max-w-[calc(100%-250px)]"
                >
                  <h4 className="font-display text-[26px] leading-[1.1] tracking-tight @lg:text-[30px]">
                    {DRAFT.title}
                  </h4>
                  <h5 className="font-display mt-5 text-[19px] tracking-tight">
                    {DRAFT.heading}
                  </h5>
                  <p className="mt-3 text-[16px] leading-[1.75] @lg:text-[17px]">
                    <H_Prose
                      src={before}
                      style={style}
                      cite={(c, i) => cite(c, "c-" + c.key + ":" + i)}
                    />
                    {typing}
                    {step >= 3 ? after : ""}
                  </p>
                  <p className="mt-4 text-[16px] leading-[1.75] @lg:text-[17px]">
                    <H_Prose

                        </div>
                        <div className="mt-0.5 text-[12px] text-muted">
                          {PAPERS[k].inText} · {PAPERS[k].year} · @{k}

                {popKey && popPos && (

      function H_GraphSvg({ active = null, drawn = 1, onPick }) {
        const nodeOf = (id) => GRAPH.nodes.find((n) => n.id === id);
        const lit = (edge) =>
          active && (edge.from === active || edge.to === active);
        return (
          <svg
            viewBox="0 0 640 420"
            className="block h-auto w-full"
            aria-hidden={onPick ? undefined : "true"}
          >
            {GRAPH.edges.map((ed, i) => {
              const [x1, y1] = H_GRAPH_POS[ed.from];
              const [x2, y2] = H_GRAPH_POS[ed.to];
              const len = Math.hypot(x2 - x1, y2 - y1);
              const show = i < Math.round(drawn * GRAPH.edges.length);
              const on = lit(ed);
              return (
                <line
                  key={i}
                  x1={x1}
                  y1={y1}
                  x2={x2}
                  y2={y2}
                  stroke={ed.kind === "link" ? "var(--muted)" : "var(--cite)"}
                  strokeOpacity={on ? 0.95 : active ? 0.32 : 0.55}
                  strokeWidth={on ? 2 : 1.1}
                  strokeDasharray={ed.kind === "link" ? "4 4" : `${len} ${len}`}
                  strokeDashoffset={ed.kind === "link" ? 0 : show ? 0 : len}
                  style={{
                    transition:
                      "stroke-dashoffset 700ms ease, stroke-opacity 300ms, stroke-width 300ms",
                  }}
                />
              );
            })}
            {Object.keys(H_GRAPH_POS).map((id) => {
              const n = nodeOf(id);
              const [x, y] = H_GRAPH_POS[id];
              const on = active === id;
              const near =
                active &&
                GRAPH.edges.some(
                  (ed) =>
                    (ed.from === active && ed.to === id) ||
                    (ed.to === active && ed.from === id),
                );
              const dim = active && !on && !near;
              const fill =
                n.kind === "note"
                  ? "var(--ink)"
                  : n.kind === "literature"
                    ? "var(--accent)"
                    : "var(--surface)";
              return (
                <g
                  key={id}
                  opacity={dim ? 0.55 : 1}
                  style={{
                    transition: "opacity 300ms",
                    cursor: onPick ? "pointer" : undefined,
                  }}
                  {...(onPick
                    ? {
                        role: "button",
                        tabIndex: 0,
                        "aria-label":
                          n.kind === "note" ? n.label : `${n.label}, ${n.sub}`,
                        onClick: () => onPick(id),
                        onKeyDown: (ev) => {
                          if (ev.key === "Enter" || ev.key === " ") {
                            ev.preventDefault();
                            onPick(id);
                          }
                        },
                      }
                    : {})}
                >
                  {onPick && <circle cx={x} cy={y} r={16} fill="transparent" />}
                  {on && (
                    <circle
                      cx={x}
                      cy={y}
                      r={13}
                      fill="none"
                      stroke="var(--accent)"
                      strokeWidth={1.5}
                    />
                  )}
                  <circle
                    cx={x}
                    cy={y}
                    r={n.kind === "note" ? 7 : 6}
                    fill={fill}
                    stroke={n.kind === "cited" ? "var(--muted)" : "none"}
                    strokeDasharray={n.kind === "cited" ? "2 2" : undefined}
                    strokeWidth={1.2}
                  />
                  <text
                    x={x}
                    y={y + 20}
                    textAnchor="middle"
                    fontSize={n.kind === "note" ? 12 : 11}
                    fontWeight={n.kind === "note" || on ? 600 : 400}
                    fill={n.kind === "cited" ? "var(--muted)" : "var(--ink)"}
                    style={{ fontFamily: "var(--font-body)" }}
                  >
                    {n.kind === "note" ? H_NOTE_SHORT[id] : n.label}
                  </text>
                </g>
              );
            })}
          </svg>
        );
      }

                  ))}
                </ul>
              </H_Pane>
            </div>

      // ---------- The pick-up sequence ----------
      // Times in ms from the moment an object is picked up. The object lifts off the desk, tilts into
      // the isometric view, comes apart into one layer per feature, the leaders draw to the list,
      // and after a beat the top layer turns face-on as the working demo.
      const H_TL = {
        lift: 650,
        tilt0: 300,
        tilt1: 1150,
        spread0: 800,
        spread1: 1800,
        call0: 1300,
        face0: 3000,
        face1: 3750,
      };
      const H_RX = 53; // tilt (rotateX, degrees), as in A
      const H_RZ = -38; // turn (rotateZ, degrees), as in A

      // The 2D matrix of the plane at height z under `rotateX(rx) rotateZ(rz)` with no perspective,
      // so the SVG layers and the CSS face-on turn share one projection.
      function hIsoM(rx, rz, z) {
        const a = (rx * Math.PI) / 180;
        const b = (rz * Math.PI) / 180;
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const cb = Math.cos(b);
        const sb = Math.sin(b);
        return [cb, sb * ca, -sb, cb * ca, 0, -z * sa];
      }
      const hApply = (m, u, v) => [
        m[0] * u + m[2] * v + m[4],
        m[1] * u + m[3] * v + m[5],
      ];
      function hRot(deg, x, y) {
        const a = (deg * Math.PI) / 180;
        return [
          x * Math.cos(a) - y * Math.sin(a),
          x * Math.sin(a) + y * Math.cos(a),
        ];
      }

      // One object's stack: the layer footprint (the object's drawing box), the layers (lead first,
      // on top) and the gap between them.
      function hStack(id) {
        const o = H_OBJ[id];
        const [vx, vy, vw, vh] = o.vb;
        const lead = leadOf(id);
        const layers = [
          lead,
          ...featuresOf(id).filter((f) => f.id !== lead.id),
        ];
        const N = layers.length;
        const G = N >= 7 ? 50 : N >= 6 ? 56 : N >= 5 ? 66 : 80;
        return { o, vw, vh, cx0: vx + vw / 2, cy0: vy + vh / 2, layers, N, G };
      }
      function hStackBox(S, T, E) {
        const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
        for (let k = 0; k < S.N; k++) {
          const m = hIsoM(H_RX * T, H_RZ * T, (S.N - 1 - k) * S.G * E);
          [
            [-S.vw / 2, -S.vh / 2],
            [S.vw / 2, -S.vh / 2],
            [S.vw / 2, S.vh / 2],
            [-S.vw / 2, S.vh / 2],
          ].forEach(([u, v]) => {
            const [x, y] = hApply(m, u, v);
            b.x0 = Math.min(b.x0, x);
            b.x1 = Math.max(b.x1, x);
            b.y0 = Math.min(b.y0, y);
            b.y1 = Math.max(b.y1, y);
          });
        }
        return b;
      }

      // A clock in ms that starts when `key` changes and stops at `end`. With motion paused it
      // stands at `end`, the finished frame.
      function useHClock(key, end) {
        const { motion } = useProtoState();
        const [t, setT] = useState(motion ? 0 : end);
        const mRef = useRef(motion);
        mRef.current = motion;
        useLayoutEffect(() => {
          if (!mRef.current) {
            setT(end);
            return;
          }
          setT(0);
          let raf;
          const t0 = performance.now();
          const tick = () => {
            if (!mRef.current) {
              setT(end);
              return;
            }
            const el = Math.min(end, performance.now() - t0);
            setT(el);
            if (el < end) raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
        }, [key]);
        useEffect(() => {
          if (!motion) setT(end);
        }, [motion]);
        return t;
      }

      // The exploded drawing, in the drawing box (W × H px). Returns the leader anchors too.
      function hSceneGeom(S, t, W, H, from, narrow) {
        const L = hEase(hSeg(t, 0, H_TL.lift));
        const T = hEase(hSeg(t, H_TL.tilt0, H_TL.tilt1));
        const E = hEase(hSeg(t, H_TL.spread0, H_TL.spread1));
        const F = hEase(hSeg(t, H_TL.face0, H_TL.face1));
        const P = hEase(hSeg(t, H_TL.tilt0, H_TL.spread1));
        const padR = narrow ? 56 : 0;
        const bx = hStackBox(S, 1, 1);
        const s = Math.min(
          (W - 40 - padR) / (bx.x1 - bx.x0),
          (H - 36) / (bx.y1 - bx.y0),
          1.25,
        );
        const c1 = {
          x: 20 + (W - 40 - padR) / 2 - (s * (bx.x0 + bx.x1)) / 2,
          y: 18 + (H - 36) / 2 - (s * (bx.y0 + bx.y1)) / 2,
        };
        const c0 = { x: 20 + (W - 40 - padR) / 2, y: H / 2 };
        const cam = { x: hLerp(c0.x, c1.x, P), y: hLerp(c0.y, c1.y, P) };
        // Lift: from where the object lay on the desk (or from a little smaller, in place).
        const du = S.o.w / 2 - S.cx0;
        const dv = S.o.h / 2 - S.cy0;
        let S0 = s * 0.84;
        let R0 = 0;
        let T0 = cam;
        if (from) {
          S0 = from.k;
          R0 = from.r;
          const [qx, qy] = hRot(R0, du * S0, dv * S0);
          T0 = { x: from.x - qx, y: from.y - qy };
        }
        const g = {
          s: hLerp(S0, s, L),
          r: hLerp(R0, 0, L),
          x: hLerp(T0.x, cam.x, L),
          y: hLerp(T0.y, cam.y, L),
        };
        const rx = H_RX * T;
        const rz = H_RZ * T;
        const layers = S.layers.map((f, k) => {
          const z = (S.N - 1 - k) * S.G * E + (k === 0 ? 90 * F : 0);
          const m = hIsoM(rx, rz, z);
          // Leader anchor: the right-hand corner of a layer, or a point on the object itself.
          const [u, v] =
            k === 0
              ? [S.o.w * 0.86 - S.cx0, S.o.h * 0.8 - S.cy0]
              : [S.vw / 2, S.vh / 2];
          const [mx, my] = hApply(m, u, v);
          const [qx, qy] = hRot(g.r, mx * g.s, my * g.s);
          return { f, k, z, m, ax: g.x + qx, ay: g.y + qy };
        });
        return { L, T, E, F, g, layers, fade: from ? 1 : hSeg(t, 0, 300) };
      }

      function H_Layer({ S, layer, top, hot, lift }) {
        const { m, k, f } = layer;
        const w = S.vw;
        const h = S.vh;
        const Art = S.o.Art;
        const C = Icons[H_FEAT_ICON[f.id]] || Icons.Circle;
        const on = hot === k;
        return (
          <g transform={`matrix(${m.join(" ")})`}>
            {top ? (
              <g transform={`translate(${-S.cx0} ${-S.cy0})`}>
                {S.o.shade.map(([x, y, sw, sh, rx], q) => (
                  <rect
                    key={q}
                    x={x + 7 + 12 * lift}
                    y={y + 9 + 14 * lift}
                    width={sw}
                    height={sh}
                    rx={rx}
                    fill="var(--h-shadow)"
                  />
                ))}
                <Art anim="off" />
                {on && (
                  <rect
                    x={S.cx0 - w / 2}
                    y={S.cy0 - h / 2}
                    width={w}
                    height={h}
                    rx="10"
                    fill="none"
                    stroke="var(--accent)"
                    strokeWidth="1.5"
                    strokeDasharray="6 5"
                  />
                )}
              </g>
            ) : (
              <g>
                <rect
                  x={-w / 2 + 5}
                  y={-h / 2 + 5}
                  width={w}
                  height={h}
                  rx="8"
                  fill="var(--line)"
                />
                <rect
                  x={-w / 2}
                  y={-h / 2}
                  width={w}
                  height={h}
                  rx="8"
                  fill={on ? "var(--h-plate-lead)" : "var(--surface)"}
                  stroke={on ? "var(--accent)" : "var(--ink)"}
                  strokeOpacity={on ? 1 : 0.5}
                  strokeWidth="1"
                />
                <text
                  x={-62}
                  y={h / 2 - 22}
                  textAnchor="end"
                  fontSize="22"
                  fill="var(--accent)"
                  style={{ fontFamily: "var(--font-mono)" }}
                >
                  {hNum(k)}
                </text>
                <C
                  x={-22}
                  y={h / 2 - 54}
                  width={44}
                  height={44}
                  color={on ? "var(--accent)" : "var(--muted)"}
                  strokeWidth={1.5}
                />
              </g>
            )}
          </g>
        );
      }

      // The dashed drop lines between a layer and the one below it (A's).
      function H_Drops({ S, upper, lower }) {
        const pts = [
          [S.vw / 2, -S.vh / 2],
          [S.vw / 2, S.vh / 2],
          [-S.vw / 2, S.vh / 2],
        ];
        return pts.map(([u, v], q) => {
          const [x1, y1] = hApply(upper.m, u, v);
          const [x2, y2] = hApply(lower.m, u, v);
          return (
            <line
              key={q}
              x1={x1}
              y1={y1}
              x2={x2}
              y2={y2}
              stroke="var(--muted)"
              strokeOpacity="0.7"
              strokeDasharray="3 4"
              strokeWidth="1"
            />
          );
        });
      }

      function H_ExplodeSvg({ S, geo, W, H, hot }) {
        const { g, layers, E, L } = geo;
        const order = [...layers].reverse();
        return (
          <svg
            className="h-scene absolute inset-0 overflow-visible"
            width={W}
            height={H}
            aria-hidden="true"
            style={{ opacity: geo.fade }}
          >
            <g
              transform={`translate(${g.x} ${g.y}) scale(${g.s}) rotate(${g.r})`}
            >
              {order.map((ly, q) => {
                const below = q > 0 ? order[q - 1] : null;
                return (
                  <Fragment key={ly.f.id}>
                    {below && E > 0.05 && (
                      <H_Drops S={S} upper={ly} lower={below} />
                    )}
                    {(ly.k === 0 || E > 0.02) && (
                      <H_Layer
                        S={S}
                        layer={ly}
                        top={ly.k === 0}
                        hot={hot}
                        lift={L * (1 - E)}
                      />
                    )}
                  </Fragment>
                );
              })}
            </g>
          </svg>
        );
      }

      // Leader lines from each layer to its row in the list (wide), or to a numbered balloon (narrow).
      function H_Leaders({ geo, rows, off, narrow, t, W, H }) {
        const callAt = (k) =>
          hEase(hSeg(t, H_TL.call0 + k * 120, H_TL.call0 + k * 120 + 520));
        if (narrow) {
          const xs = geo.layers.map((l) => l.ax);
          const bx = Math.min(W - 16, Math.max(...xs) + 30);
          const placed = [];
          geo.layers.forEach((l, i) => {
            const y = i === 0 ? l.ay : Math.max(l.ay, placed[i - 1].by + 25);
            placed.push({ ...l, by: y });
          });
          const over = placed.length
            ? placed[placed.length - 1].by - (H - 14)
            : 0;
          if (over > 0) placed.forEach((p) => (p.by -= over));
          return (
            <svg
              className="pointer-events-none absolute inset-0 overflow-visible"
              width={W}
              height={H}
              aria-hidden="true"
            >
              {placed.map((p) => {
                const c = callAt(p.k);
                if (c <= 0) return null;
                return (
                  <g key={p.f.id} opacity={Math.min(1, c * 2)}>
                    <path
                      d={`M ${p.ax} ${p.ay} L ${bx - 10} ${p.by}`}
                      fill="none"
                      stroke="var(--accent)"
                      strokeWidth="1"
                      pathLength="1"
                      strokeDasharray="1"
                      strokeDashoffset={1 - c}
                    />
                    <circle cx={p.ax} cy={p.ay} r="3" fill="var(--accent)" />
                    <circle
                      cx={bx}
                      cy={p.by}
                      r="10"
                      fill="var(--surface)"
                      stroke="var(--accent)"
                    />
                    <text
                      x={bx}
                      y={p.by + 3.5}
                      textAnchor="middle"
                      fontSize="10"
                      fill="var(--accent)"
                      style={{ fontFamily: "var(--font-mono)" }}
                    >
                      {hNum(p.k)}
                    </text>
                  </g>
                );
              })}
            </svg>
          );
        }
        if (!rows.length) return null;
        return (
          <svg
            className="pointer-events-none absolute top-0 left-0 overflow-visible"
            width="1"
            height="1"
            aria-hidden="true"
          >
            {geo.layers.map((l) => {
              const r = rows[l.k];
              if (!r) return null;
              const c = callAt(l.k);
              if (c <= 0) return null;
              const ax = off.x + l.ax;
              const ay = off.y + l.ay;
              const elbow = r.x - 34;
              return (
                <g key={l.f.id}>
                  <path
                    d={`M ${ax} ${ay} L ${Math.max(ax + 12, elbow - 40)} ${ay} L ${elbow} ${r.y} L ${r.x - 8} ${r.y}`}
                    fill="none"
                    stroke="var(--accent)"
                    strokeWidth="1"
                    pathLength="1"
                    strokeDasharray="1"
                    strokeDashoffset={1 - c}
                  />
                  <circle cx={ax} cy={ay} r="3.5" fill="var(--accent)" />
                  <circle
                    cx={ax}
                    cy={ay}
                    r="7"
                    fill="none"
                    stroke="var(--accent)"
                    strokeOpacity="0.45"
                  />
                </g>
              );
            })}
          </svg>
        );
      }

      // One row of the callout list: number, feature name and version while the drawing explodes;
      // its line, badges and links once the demo is up.
      function H_PartRow({ f, k, open, reveal, setHot, rowRef, onJump, lead }) {
        const { motion } = useProtoState();
        const l = sinceLabel(f);
        const sig = H_SIG_IDS.includes(f.id) && !lead;
        return (
          <li
            ref={rowRef}
            className="border-line border-b py-2.5"
            style={{
              opacity: reveal,
              transform: `translateX(${(1 - reveal) * 10}px)`,
            }}
            onPointerEnter={() => setHot(k)}
            onPointerLeave={() => setHot(null)}
          >
            <div className="flex flex-wrap items-baseline gap-x-2.5 gap-y-1">
              <span className="h-num text-accent w-6 shrink-0 text-[12px]">
                {hNum(k)}
              </span>
              <h3 className="text-[15.5px] leading-snug font-semibold">
                {f.name}
              </h3>
              {l && <span className="h-label text-muted">{l}</span>}
              {lead && (
                <span className="bg-accent/12 text-ink inline-flex items-center gap-1 rounded-full px-2 py-[2px] text-[11px] font-medium">
                  <H_Ico n="Eye" size={11} />
                  Working demo
                </span>
              )}
            </div>
            <div
              className={`h-fold ${open ? "is-open" : ""}`}
              style={motion ? undefined : { transition: "none" }}
            >
              <div>
                <div className="pt-1.5 pl-[34px]">
                  {(f.tier === "advanced" || f.experimental || f.companion) && (
                    <div className="mb-1.5 flex flex-wrap gap-1.5">
                      {f.tier === "advanced" && (
                        <span className="border-line bg-ground rounded-full border px-2 py-[2px] text-[11px] text-muted">
                          For power users
                        </span>
                      )}
                      {f.experimental && (
                        <span className="border-z-orange text-ink rounded-full border border-dashed px-2 py-[2px] text-[11px]">
                          Experimental
                        </span>
                      )}
                      {f.companion && (
                        <span className="border-line inline-flex items-center gap-1 rounded-full border px-2 py-[2px] text-[11px] text-muted">
                          <H_Ico n="Puzzle" size={11} />
                          Needs ZotLit Companion
                        </span>
                      )}
                    </div>
                  )}
                  <p className="text-[14.5px] leading-[1.5] text-muted">
                    {f.line}
                  </p>
                  {H_PLAIN[f.id] && (
                    <p className="text-ink mt-1.5 flex items-start gap-1.5 text-[13.5px] leading-snug">
                      <H_Ico
                        n="Info"
                        size={14}
                        className="mt-[2px] shrink-0 text-muted"
                      />
                      {H_PLAIN[f.id]}
                    </p>
                  )}
                  <div className="mt-1.5 mb-1 flex flex-wrap gap-x-4 gap-y-1 text-[13.5px]">
                    <a
                      href={f.href}
                      target="_blank"
                      rel="noreferrer"
                      className="h-link inline-flex items-center gap-1 font-semibold"
                      tabIndex={open ? undefined : -1}
                    >
                      Read the guide
                      <H_Ico n="ArrowUpRight" size={13} />
                    </a>
                    {sig && (
                      <button
                        type="button"
                        onClick={() => onJump(`h-sig-${f.id}`)}
                        className="h-link inline-flex items-center gap-1 font-semibold"
                        tabIndex={open ? undefined : -1}
                      >
                        See it below
                        <H_Ico n="ArrowDown" size={13} />
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </li>
        );
      }

      // A second working demo under the lead one, with its own number from the parts list.
      function H_StageExtra({ x, k }) {
        const f = feature(x.id);
        const ref = useRef(null);
        const band = useHBand(ref);
        return (
          <figure className="m-0 min-w-0">
            <figcaption className="mb-2.5 flex flex-wrap items-baseline gap-x-2.5 gap-y-1">
              <span className="h-num text-accent text-[12px]">{hNum(k)}</span>
              <span className="text-[15.5px] font-semibold">{f.name}</span>
              <H_Badges f={f} small />
            </figcaption>
            <div ref={ref} className="@container">
              <x.Demo active={band} />
            </div>
          </figure>
        );
      }

      function H_NavBtn({ job, dir, onNav }) {
        if (!job) return <span className="hidden sm:block" />;
        const prev = dir === "prev";
        return (
          <button
            type="button"
            onClick={() => onNav(job.id)}
            className={`border-line bg-surface hover:border-ink/40 flex min-w-0 items-center gap-2 rounded-[10px] border px-3 py-2 text-left ${prev ? "" : "flex-row-reverse text-right"}`}
          >
            <H_Ico
              n={prev ? "ArrowLeft" : "ArrowRight"}
              size={16}
              className="shrink-0 text-muted"
            />
            <span className="min-w-0">
              <span className="block text-[11.5px] text-muted">
                {prev ? "Previous" : "Next"}
              </span>
              <span className="block truncate text-[14px] leading-snug font-semibold">
                {job.name}
              </span>
            </span>
          </button>
        );
      }

      // The stage: in the page flow where the desk was. Title strip, the drawing (which becomes the
      // working demo) and the callout list.
      function H_Stage({ jobId, from, wide, onBack, onNav, onJump }) {
        const { motion } = useProtoState();
        const job = JOBS.find((j) => j.id === jobId);
        const i = JOBS.indexOf(job);
        const S = useMemo(() => hStack(jobId), [jobId]);
        const t = useHClock(jobId, H_TL.face1);
        const done = t >= H_TL.face1;
        const facing = t >= H_TL.face0;
        const secRef = useRef(null);
        const headRef = useRef(null);
        const bodyRef = useRef(null);
        const drawRef = useRef(null);
        const demoRef = useRef(null);
        const rowRefs = useRef([]);
        const { w: W, h: H } = useHSize(drawRef);
        const { w: BW } = useHSize(bodyRef);
        const band = useHBand(demoRef);
        const [hot, setHot] = useState(null);
        const [fromLocal, setFromLocal] = useState(null);
        const [rows, setRows] = useState([]);
        const [off, setOff] = useState({ x: 0, y: 0 });
        const narrow = !wide;
        useLayoutEffect(() => {
          const sec = secRef.current;
          if (!sec) return;
          const r = sec.getBoundingClientRect();
          if (r.top < 0 || r.top > window.innerHeight * 0.5)
            window.scrollBy(0, r.top - 12);
          if (headRef.current) headRef.current.focus({ preventScroll: true });
          const draw = drawRef.current;
          if (!draw || !from || !motion) return;
          const d = draw.getBoundingClientRect();
          setFromLocal({
            x: from.cx - d.left,
            y: from.cy - d.top,
            k: from.k,
            r: from.r,
          });
        }, [jobId]);
        useLayoutEffect(() => {
          const body = bodyRef.current;
          const draw = drawRef.current;
          if (!body || !draw || narrow) return;
          const b = body.getBoundingClientRect();
          const d = draw.getBoundingClientRect();
          setOff({ x: d.left - b.left, y: d.top - b.top });
          setRows(
            S.layers.map((_, k) => {
              const el = rowRefs.current[k];
              if (!el) return null;
              const r = el.getBoundingClientRect();
              return { x: r.left - b.left, y: r.top - b.top + 21 };
            }),
          );
        }, [jobId, W, H, BW, narrow]);
        const geo =
          W > 0 && H > 0 ? hSceneGeom(S, t, W, H, fromLocal, narrow) : null;
        const F = geo ? geo.F : done ? 1 : 0;
        const Demo = H_STAGE_DEMO[jobId];
        const extras = H_STAGE_EXTRA[jobId] || [];
        const prev = JOBS[i - 1];
        const next = JOBS[i + 1];
        const reveal = (k) =>
          !motion || done
            ? 1
            : hEase(
                hSeg(t, H_TL.call0 + k * 120 + 200, H_TL.call0 + k * 120 + 620),
              );
        const turn = 1 - F;
        return (
          <section
            ref={secRef}
            id="h-stage"
            aria-labelledby="h-stage-title"
            className="scroll-mt-4"
          >
            <div className="h-sheet border-ink/35 bg-surface overflow-visible rounded-[14px] border">
              <div className="border-line flex flex-wrap items-center gap-x-6 gap-y-3 border-b px-4 py-3.5 sm:px-6">
                <span
                  className="hidden size-14 shrink-0 place-items-center rounded-[10px] p-1.5 sm:grid"
                  style={{ background: "var(--h-desk)" }}
                >
                  <H_ObjIcon id={jobId} className="size-full" />
                </span>
                <div className="min-w-0 flex-1 basis-[18rem]">
                  <p className="h-label text-muted">
                    <span className="text-accent">{hNum(i)}</span> of{" "}
                    {hNum(JOBS.length - 1)} · {H_OBJ[jobId].name}
                  </p>
                  <h2
                    id="h-stage-title"
                    ref={headRef}
                    tabIndex={-1}
                    className="font-display text-[26px] leading-tight text-balance outline-none sm:text-[30px]"
                  >
                    {job.name}
                  </h2>
                  <p className="mt-1 max-w-[60ch] text-[15.5px] leading-snug text-muted">
                    {job.outcome}

        x,

        z = 0,
        w,
        h,
        stroke = "var(--ink)",
        fill = "var(--surface)",
        dash,

        const pts = [
          [x, y],
          [x + w, y],
          [x + w, y + h],
          [x, y + h],

          .map(([a, b]) => hIsoPt(a, b, z).join(","))

          <polygon

            strokeDasharray={dash}

      function VariantH() {
        const { motion } = useProtoState();
        const wide = useHMedia("(min-width: 768px)");
        const stageWide = useHMedia("(min-width: 1024px)");
        const [open, setOpen] = useState(null);
        const [from, setFrom] = useState(null);
        const [settle, setSettle] = useState("all");
        const btnRefs = useRef({});
        const pick = useCallback((id, geom) => {
          setFrom(geom || null);
          setOpen(id);
        }, []);
        const nav = useCallback((id) => {
          setFrom(null);
          setOpen(id);
        }, []);
        const openRef = useRef(null);
        openRef.current = open;
        const back = useCallback(() => {
          const cur = openRef.current;
          if (!cur) return;
          setSettle(cur);
          setOpen(null);
          setTimeout(() => {
            const el = btnRefs.current[cur];
            if (el) el.focus();
          }, 0);
        }, []);
        const jump = useCallback(
          (id) => {
            const el = document.getElementById(id);
            if (el)
              el.scrollIntoView({
                behavior: motion ? "smooth" : "auto",
                block: "center",
              });
          },
          [motion],
        );
        useEffect(() => {
          if (!open) return;
          const onKey = (e) => {
            if (e.key === "Escape") back();
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [open, back]);
        return (
          <div

            className="bg-ground font-body text-ink min-h-screen overflow-x-clip pb-24"

              <H_Index onOpen={nav} open={open} />
              <H_Setup />
            </main>
            <H_Footer />

      function D_useMedia(q) {
        const [m, setM] = useState(() => window.matchMedia(q).matches);
        useEffect(() => {
          const mq = window.matchMedia(q);
          const on = () => setM(mq.matches);
          on();
          mq.addEventListener("change", on);
          return () => mq.removeEventListener("change", on);
        }, [q]);
        return m;

      // True while the element crosses a thin band at the middle of the viewport. Demos that loop
      // run only then, so at most one loop plays at a time.
      function D_useBand(ref) {
        const [on, setOn] = useState(false);
        useEffect(() => {
          const el = ref.current;
          if (!el) return;
          const io = new IntersectionObserver(
            ([e]) => setOn(e.isIntersecting),
            {
              rootMargin: "-46% 0px -46% 0px",
              threshold: 0,
            },
          );
          io.observe(el);
          return () => io.disconnect();
        }, []);
        return on;
