                    <Ic
                      name={a.key === current.key ? "Check" : "FileText"}
                      size={13}
                      className={cx(
                        "mt-0.5 shrink-0",
                        a.key === current.key ? "text-accent" : "text-faint",

                      <span className="text-ink block text-[12px] leading-snug text-pretty">
                        {a.name}
                      </span>
                      <span className="text-faint mt-0.5 block text-[11px] tabular-nums">
                        {a.count} annotations

      /**
       * Identical whether Zotero is open or shut: title, creators · year, attachment picker, and
       * the control row. Nothing about the condition is allowed in here.
       */
      function BMasthead() {
        const s = useProto();
        const present = hasItem(s);
        return (
          <header className="bg-ground relative z-10 shrink-0 px-3 pt-3 pb-2.5">
            {present ? (
              <div className="flex flex-col gap-2.5 @min-[860px]:flex-row @min-[860px]:items-start @min-[860px]:justify-between @min-[860px]:gap-6">
                <div className="min-w-0 @min-[860px]:max-w-[520px]">

      function BEmptyMatch() {
        const s = useProto();
        const { clearFilters } = s;
        return (
          <div className="bg-raised rounded-[6px] p-3">
            <h3 className="text-ink text-[13px] font-semibold text-balance">
              Nothing matches that

            <p className="text-muted mt-1 text-[13px] leading-relaxed text-pretty">

            <button
              type="button"
              onClick={clearFilters}
              className={cx(
                "bg-accent text-ground mt-2.5 inline-flex h-7 items-center gap-1.5 rounded-[4px] px-2.5 text-[12px] font-medium",
                "transition-[transform] duration-150 active:scale-[0.96]",

      function BList() {

        const list = visibleAnnots(s);

          <div className="min-h-0 flex-1 overflow-y-auto px-3 pt-1 pb-6">

      function VariantB() {
        const s = useProto();
        return (
          <ObsidianFrame>
            <div className="font-ui text-ink flex h-full min-h-0 flex-col">
              <BMasthead />
              {hasItem(s) && <BList />}

          </ObsidianFrame>

      }
      // --- Variant B END ---
      // --- Variant B END ---
      // --- Variant B END ---

      // --- Variant C ---
      // --- Variant C ---
      /**
       * VARIANT C — "A status line along the pane's bottom edge."
       *
       * Round 2 refinement of the winning B. Keeps B's masthead, its word-labelled controls and
       * its page-chip card. Two changes:
       *
       *   1. The colour control carries its state as the colours themselves — the selected dots in
       *      document order — instead of the words "Yellow, green".
       *   2. B's amber notice block is gone. Read-only is a mode, not a fault, so the condition
       *      moves to a 24px status line pinned along the pane's BOTTOM edge, outside the scroll
       *      and below it in the flex column. It never pushes the list; the scroll region simply
       *      gets that much shorter, so the researcher keeps their place. This is what
       *      WORKBENCH-DESIGN already prescribes: connection state lives below the panes.
       *      The full explanation is one press away — never a hover — expanding upward OVER the
       *      list's bottom edge rather than reflowing it.
       */

      const C_FOCUS =
        "outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-0";

      const C_VERBS = [
        { id: "colour", icon: "Palette", label: "Change colour" },
        { id: "comment", icon: "MessageSquarePlus", label: "Write a comment" },
        { id: "more", icon: "MoreHorizontal", label: "More actions" },
      ];

      const C_SAVING_KEY = "n6";

      /** The hairline that keeps a yellow dot off a light control and a grey dot off a dark one. */
      const C_DOT_RING =
        "0 0 0 1px color-mix(in oklab, var(--ink) 15%, transparent)";

      /** "Yellow, green" — a control's own label carries its filter state. Tags and search only. */
      function C_listLabel(values, fallback, name) {
        if (values.length === 0) return fallback;
        const first = name(values[0]);
        if (values.length === 1) return first;
        if (values.length === 2)
          return `${first}, ${name(values[1]).toLowerCase()}`;
        return `${first} +${values.length - 1}`;
      }

      /** The selected colours, in the order they appear in the document. */
      function C_selectedColors(s) {
        return ALL_COLORS.filter((c) => s.colors.includes(c));
      }

      /** The dots said in words, for the accessible name: "Filtered to yellow and green". */
      function C_colorSentence(colors) {
        const names = colors.map((c) => COLOR_NAME[c].toLowerCase());
        if (names.length === 0) return "Filter by colour";
        if (names.length === 1) return `Filtered to ${names[0]}`;
        return `Filtered to ${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
      }

      /** A sentence fragment naming what is currently filtering the list. */
      function C_filterPhrase(s) {
        const parts = [];
        if (s.colors.length)
          parts.push(
            s.colors.map((c) => COLOR_NAME[c].toLowerCase()).join(" or "),
          );
        if (s.tags.length) parts.push(s.tags.map((t) => `#${t}`).join(" or "));
        if (s.query.trim()) parts.push(`“${s.query.trim()}”`);
        if (parts.length === 0) return "the filters you have on";
        if (parts.length === 1) return parts[0];
        return `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}`;
      }

      /** The mark that fuses colour with type: a dot for a highlight, a bar for an underline. */
      function CColorMark({ type }) {
        if (type === "underline")
          return (
            <span
              aria-hidden="true"
              className="block h-[3px] w-[9px] shrink-0 rounded-[1px]"
              style={{ background: "var(--c)" }}
            />
          );
        if (type === "image")
          return (
            <span
              aria-hidden="true"
              className="block h-2 w-2 shrink-0 rounded-[2px]"
              style={{ background: "var(--c)" }}
            />
          );
        return (
          <span
            aria-hidden="true"
            className="block h-2 w-2 shrink-0 rounded-full"
            style={{ background: "var(--c)" }}
          />
        );
      }

      /** Colour + location as one mark. Opens the page in Zotero. */
      function CPageChip({ annot, live }) {
        return (
          <button
            type="button"
            disabled={!live}
            title={live ? `Open page ${annot.page} in Zotero` : undefined}
            className={cx(
              "flex h-6 shrink-0 items-center gap-1.5 rounded-[4px] ps-1.5 pe-2 text-[12px] font-medium tabular-nums",
              "text-ink transition-[box-shadow] duration-150",
              live
                ? "hover:shadow-[0_0_0_1px_var(--c)] cursor-pointer"
                : "cursor-default opacity-70",
              C_FOCUS,
            )}
            style={{
              background: "color-mix(in srgb, var(--c) 22%, transparent)",
            }}
          >
            <CColorMark type={annot.type} />
            <span>p.&nbsp;{annot.page}</span>
          </button>
        );
      }

      /**
       * A card verb. When Zotero is closed it stays exactly where it is, at a lower rest opacity,
       * and stops answering hover — quietly unavailable. No padlock, no alert glyph, no tooltip:
       * the status line along the bottom edge is on screen the whole time and explains it once.
       */
      function CVerb({ icon, label, on, active, disabled }) {
        return (
          <button
            type="button"
            onClick={on}
            disabled={disabled}
            aria-label={label}
            aria-pressed={active ? true : undefined}
            title={disabled ? undefined : label}
            className={cx(
              "grid h-6 w-6 place-items-center rounded-[4px] transition-[opacity,background-color,color] duration-150",
              disabled
                ? "text-faint cursor-default"
                : active
                  ? "bg-accent-soft text-accent"
                  : "text-muted hover:bg-sunken hover:text-ink",
              C_FOCUS,
            )}
          >
            <Ic name={icon} size={14} />
          </button>
        );
      }

      function CTagChip({ tag, on, active }) {
        return (
          <button
            type="button"
            onClick={on}
            aria-pressed={active}
            className={cx(
              "h-6 rounded-[4px] px-1.5 text-[11px] tracking-[0.04em] transition-[background-color,color] duration-150",
              active
                ? "bg-accent-soft text-accent"
                : "bg-sunken text-muted hover:text-ink",
              C_FOCUS,
            )}
          >
            #{tag}
          </button>
        );
      }

      function CCommentEditor({ annot }) {
        const { set } = useProto();
        const [draft, setDraft] = React.useState(annot.comment ?? "");
        return (
          <div className="bg-ground rounded-[4px] p-1.5">
            <textarea
              autoFocus
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              rows={3}
              className={cx(
                "text-ink w-full resize-none bg-transparent text-[13px] leading-relaxed",
                "placeholder:text-faint",
                C_FOCUS,
              )}
              placeholder="Write a comment on this highlight"
            />
            <div className="mt-1 flex items-center justify-end gap-1.5">
              <button
                type="button"
                onClick={() => set({ editingKey: null })}
                className={cx(
                  "text-muted hover:text-ink h-6 rounded-[4px] px-2 text-[12px] transition-[color] duration-150",
                  C_FOCUS,
                )}
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={() => set({ editingKey: null })}
                className={cx(
                  "bg-accent text-ground h-6 rounded-[4px] px-2 text-[12px] font-medium",
                  C_FOCUS,
                )}
              >
                Save comment
              </button>
            </div>
          </div>
        );
      }

      function CSwatchRow({ annot }) {
        const { set } = useProto();
        return (
          <div className="bg-ground flex flex-wrap items-center gap-1 rounded-[4px] p-1.5">
            <span className="text-muted me-1 text-[11px] tracking-[0.04em]">
              Colour
            </span>
            {ALL_COLORS.map((c) => (
              <button
                key={c}
                type="button"
                onClick={() => set({ sheet: null })}
                aria-label={COLOR_NAME[c]}
                aria-pressed={c === annot.color}
                title={COLOR_NAME[c]}
                className={cx(
                  "h-5 w-5 rounded-[4px] transition-[box-shadow] duration-150",
                  c === annot.color
                    ? "shadow-[0_0_0_2px_var(--accent)]"
                    : "hover:shadow-[0_0_0_1px_var(--line)]",
                  C_FOCUS,
                )}
                style={{ background: c }}
              />
            ))}
          </div>
        );
      }

      function CCard({ annot }) {
        const s = useProto();
        const { select, set, toggleTag } = s;
        const live = canEdit(s);
        const selected = s.selectedKey === annot.key;
        const editing = s.editingKey === annot.key;
        const swatches = s.sheet === `colour:${annot.key}`;
        const saving = s.scenario === "saving" && annot.key === C_SAVING_KEY;
        const isNote = annot.type === "note";

        return (
          <article
            aria-busy={saving || undefined}
            className={cx(
              "group bg-raised rounded-[6px] p-[10px] transition-[background-color,box-shadow] duration-150",
              selected &&
                "bg-accent-soft shadow-[inset_0_0_0_1px_var(--accent)]",
            )}
            style={{ "--c": annot.color }}
          >
            <div className="flex items-center gap-2">
              <CPageChip annot={annot} live={live} />
              {isNote && (
                <span className="text-muted text-[11px] tracking-[0.04em]">
                  Note to self
                </span>
              )}
              <span className="min-w-0 flex-1" />
              {saving ? (
                <span
                  className="text-muted flex items-center gap-1.5 text-[12px]"
                  aria-live="polite"
                >
                  <Ic name="Loader2" size={13} className="animate-spin" />
                  Saving…
                </span>
              ) : (
                <div
                  className={cx(
                    "flex items-center gap-0.5 transition-[opacity] duration-150",
                    live
                      ? !selected &&
                          "opacity-60 group-hover:opacity-100 group-focus-within:opacity-100"
                      : "opacity-40",
                  )}
                >
                  {C_VERBS.map((v) => (
                    <CVerb
                      key={v.id}
                      icon={v.icon}
                      label={
                        v.id === "comment" && annot.comment
                          ? "Edit your comment"
                          : v.label
                      }
                      disabled={!live}
                      active={
                        (v.id === "colour" && swatches) ||
                        (v.id === "comment" && editing)
                      }
                      on={() => {
                        if (v.id === "colour")
                          set({
                            sheet: swatches ? null : `colour:${annot.key}`,
                          });
                        else if (v.id === "comment")
                          set({ editingKey: editing ? null : annot.key });
                      }}
                    />
                  ))}
                </div>
              )}
            </div>

            {swatches && (
              <div className="mt-2">
                <CSwatchRow annot={annot} />
              </div>
            )}

            {annot.type === "image" && (
              <img
                src={annot.img}
                alt={`Figure captured from page ${annot.page}`}
                className="mt-2 block w-full rounded-[4px]"
                style={{
                  outline:
                    "1px solid color-mix(in srgb, var(--ink) 14%, transparent)",
                  outlineOffset: "-1px",
                }}
              />
            )}

            {annot.text && (
              <button
                type="button"
                onClick={() => select(annot.key)}
                aria-pressed={selected}
                className={cx("mt-2 block w-full text-start", C_FOCUS)}
              >
                <p
                  className={cx(
                    "font-quote text-ink text-[14px] leading-[1.5]",
                    !s.expanded && "line-clamp-3",
                  )}
                >
                  {annot.text}
                </p>
              </button>
            )}

            {isNote && !editing && (
              <button
                type="button"
                onClick={() => select(annot.key)}
                aria-pressed={selected}
                className={cx("mt-2 block w-full text-start", C_FOCUS)}
              >
                <p className="text-ink text-[13px] leading-relaxed text-pretty">
                  {annot.comment}
                </p>
              </button>
            )}

            {editing ? (
              <div className="mt-2">
                <CCommentEditor annot={annot} />
              </div>
            ) : (
              !isNote &&
              annot.comment && (
                <div className="border-line mt-2 border-s-2 ps-2.5">
                  <p className="text-ink text-[13px] leading-relaxed text-pretty">
                    {annot.comment}
                  </p>
                </div>
              )
            )}

            {annot.tags.length > 0 && (
              <div className="mt-2.5 flex flex-wrap gap-1">
                {annot.tags.map((t) => (
                  <CTagChip
                    key={t}
                    tag={t}
                    active={s.tags.includes(t)}
                    on={() => toggleTag(t)}
                  />
                ))}
              </div>
            )}
          </article>
        );
      }

      /**
       * The status line. Pinned along the pane's bottom edge, below the scroll in the flex column
       * — never absolutely positioned over it, so no pane height and no zoom level can clip it.
       * Present only while Zotero is closed and there is a list to read.
       *
       * At 340px the sentence and the action do not both fit on one line, so the row wraps to two:
       * it carries no fixed height and the text carries no fixed width, and nothing truncates.
       *
       * Pressing the glyph or the sentence expands the line upward into a two-line block. The
       * expansion is absolutely positioned above the row, so it covers the list's last few pixels
       * instead of reflowing it. Press again, or Escape, to collapse.
       */
      function CStatusLine() {
        const s = useProto();
        const c = condition(s);
        const shown = Boolean(c) && hasItem(s);
        const [open, setOpen] = React.useState(false);

        React.useEffect(() => {
          if (!shown) setOpen(false);
        }, [shown]);

        React.useEffect(() => {
          if (!open) return;
          const onKey = (e) => {
            if (e.key === "Escape") setOpen(false);
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [open]);

        if (!shown) return null;

        return (
          <div className="border-line bg-raised relative z-20 shrink-0 border-t">
            {open && (
              <div
                id="c-status-detail"
                className={cx(
                  "border-line bg-raised absolute inset-x-0 bottom-full border-t px-3 py-1.5",
                  "shadow-[0_-8px_20px_-14px_rgba(0,0,0,0.5)]",
                )}
              >
                <p className="text-muted text-[12px] leading-relaxed text-pretty">
                  Open Zotero to change colours, comments or tags.
                </p>
              </div>
            )}

            <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5 px-3 py-0.5">
              <button
                type="button"
                onClick={() => setOpen((v) => !v)}
                aria-expanded={open}
                aria-controls={open ? "c-status-detail" : undefined}
                className={cx(
                  "text-muted hover:text-ink flex min-h-6 min-w-0 items-center gap-1.5 rounded-[4px] text-start",
                  "transition-[color] duration-150",
                  C_FOCUS,
                )}
              >
                <Ic name="Unplug" size={13} className="shrink-0" />
                <span className="min-w-0 text-[12px] leading-[1.45]">
                  Reading only · Zotero isn’t open
                </span>
                <Ic
                  name={open ? "ChevronDown" : "ChevronUp"}
                  size={12}
                  className="shrink-0 opacity-70"
                />
              </button>

              <button
                type="button"
                className={cx(
                  "text-accent ms-auto flex h-6 shrink-0 items-center rounded-[4px] px-1 text-[12px] hover:underline",
                  C_FOCUS,
                )}
              >
                {c.action}
              </button>
            </div>
          </div>
        );
      }

      /**
       * `no-item`: nothing to read, so nothing to interrupt. The pane body states the real cause
       * in full with its one action — B's treatment, restyled neutral. The bottom status line
       * stands down here: it would say a quieter version of the sentence already on screen.
       */
      function CNoItem() {
        const s = useProto();
        const c = condition(s);
        if (!c) return null;
        return (
          <div className="min-h-0 flex-1 overflow-y-auto px-3 pt-3 pb-6">
            <div className="bg-raised rounded-[6px] p-3">
              <div className="flex items-center gap-1.5">
                <Ic
                  name="Unplug"
                  size={14}
                  strokeWidth={2}
                  className="text-muted shrink-0"
                />
                <h3 className="text-ink text-[13px] font-semibold text-balance">
                  {c.title}
                </h3>
              </div>
              <p className="text-muted mt-1 text-[13px] leading-relaxed text-pretty">
                {c.body}
              </p>
              <button
                type="button"
                className={cx(
                  "bg-accent text-ground mt-2.5 inline-flex h-7 items-center gap-1.5 rounded-[4px] px-2.5 text-[12px] font-medium",
                  "transition-[transform] duration-150 active:scale-[0.96]",
                  C_FOCUS,
                )}
              >
                <Ic name="ExternalLink" size={13} strokeWidth={2} />
                {c.action}
              </button>
            </div>
          </div>
        );
      }

      function CPanel({ children, align = "auto" }) {
        const { set } = useProto();
        return (
          <>
            <button
              type="button"
              aria-label="Close this menu"
              onClick={() => set({ sheet: null })}
              className="fixed inset-0 z-20 cursor-default"
            />
            <div
              className={cx(
                "bg-ground border-line absolute top-full z-30 mt-1 w-[230px] rounded-[8px] border p-1",
                align === "auto"
                  ? "start-0 @min-[860px]:start-auto @min-[860px]:end-0"
                  : "start-0",
                "shadow-[0_2px_4px_rgba(0,0,0,0.06),0_12px_28px_-10px_rgba(0,0,0,0.3)]",
              )}
            >
              {children}
            </div>
          </>
        );
      }

      function CControl({
        icon,
        label,
        active,
        on,
        chevron = true,
        ariaLabel,
        children,
      }) {
        return (
          <button
            type="button"
            onClick={on}
            aria-pressed={active}
            aria-label={ariaLabel}
            className={cx(
              "flex h-7 max-w-[160px] items-center gap-1.5 rounded-[6px] px-2 text-[12px]",
              "transition-[background-color,color] duration-150",
              active
                ? "bg-accent-soft text-accent"
                : "bg-raised text-ink hover:bg-sunken",
              C_FOCUS,
            )}
          >
            {icon && <Ic name={icon} size={13} className="shrink-0" />}
            {children ?? <span className="min-w-0 truncate">{label}</span>}
            {chevron && (
              <Ic
                name="ChevronDown"
                size={12}
                className="shrink-0 opacity-70"
              />
            )}
          </button>
        );
      }

      /** The selected colours themselves, on the control's own surface. Dots, not words. */
      function CColorDots({ colors }) {
        return (
          <span aria-hidden="true" className="flex min-w-0 items-center gap-1">
            {colors.map((c) => (
              <span
                key={c}
                className="block h-2 w-2 shrink-0 rounded-full"
                style={{ background: c, boxShadow: C_DOT_RING }}
              />
            ))}
          </span>
        );
      }

      function CControls() {
        const s = useProto();
        const { set, toggleColor, toggleTag, clearFilters } = s;
        const open =
          typeof s.sheet === "string" && !s.sheet.startsWith("colour:")
            ? s.sheet
            : null;
        const toggle = (name) => set({ sheet: open === name ? null : name });
        const picked = C_selectedColors(s);

        return (
          <div className="relative flex flex-wrap items-center gap-1.5">
            <CControl
              icon="Palette"
              label="Colour"
              ariaLabel={C_colorSentence(picked)}
              active={open === "filter" || picked.length > 0}
              on={() => toggle("filter")}
            >
              {picked.length > 0 ? <CColorDots colors={picked} /> : undefined}
            </CControl>
            <CControl
              icon="Tags"
              label={C_listLabel(
                s.tags,
                "Tags",
                (t) => t.charAt(0).toUpperCase() + t.slice(1),
              )}
              active={open === "tags" || s.tags.length > 0}
              on={() => toggle("tags")}
            />
            <CControl
              icon="Search"
              label={s.query.trim() ? `“${s.query.trim()}”` : "Search"}
              active={open === "search" || s.query.trim() !== ""}
              chevron={false}
              on={() => toggle("search")}
            />
            {filterActive(s) && (
              <button
                type="button"
                onClick={() => {
                  clearFilters();
                  set({ sheet: null });
                }}
                className={cx(
                  "text-accent ms-auto h-7 rounded-[6px] px-1.5 text-[12px] hover:underline",
                  C_FOCUS,
                )}
              >
                Show all
              </button>
            )}

            {open === "filter" && (
              <CPanel>
                {ALL_COLORS.map((c) => (
                  <button
                    key={c}
                    type="button"
                    onClick={() => toggleColor(c)}
                    aria-pressed={s.colors.includes(c)}
                    className={cx(
                      "flex h-7 w-full items-center gap-2 rounded-[5px] px-1.5 text-[12px]",
                      "transition-[background-color] duration-150 hover:bg-raised",
                      C_FOCUS,
                    )}
                  >
                    <span
                      aria-hidden="true"
                      className="h-2.5 w-2.5 shrink-0 rounded-full"
                      style={{ background: c, boxShadow: C_DOT_RING }}
                    />
                    <span className="text-ink flex-1 text-start">
                      {COLOR_NAME[c]}
                    </span>
                    {s.colors.includes(c) && (
                      <Ic name="Check" size={13} className="text-accent" />
                    )}
                  </button>
                ))}
              </CPanel>
            )}

            {open === "tags" && (
              <CPanel>
                <div className="max-h-[220px] overflow-y-auto">
                  {ALL_TAGS.map((t) => (
                    <button
                      key={t}
                      type="button"
                      onClick={() => toggleTag(t)}
                      aria-pressed={s.tags.includes(t)}
                      className={cx(
                        "flex h-7 w-full items-center gap-2 rounded-[5px] px-1.5 text-[12px]",
                        "transition-[background-color] duration-150 hover:bg-raised",
                        C_FOCUS,
                      )}
                    >
                      <span className="text-ink flex-1 text-start">#{t}</span>
                      <span className="text-faint tabular-nums">
                        {ANNOTS.filter((a) => a.tags.includes(t)).length}
                      </span>
                      {s.tags.includes(t) && (
                        <Ic name="Check" size={13} className="text-accent" />
                      )}
                    </button>
                  ))}
                </div>
              </CPanel>
            )}

            {open === "search" && (
              <CPanel>
                <div className="bg-raised flex h-8 items-center gap-1.5 rounded-[5px] px-2">
                  <Ic name="Search" size={13} className="text-muted shrink-0" />
                  <input
                    autoFocus
                    value={s.query}
                    onChange={(e) => set({ query: e.target.value })}
                    placeholder="Search your annotations"
                    className={cx(
                      "text-ink placeholder:text-faint min-w-0 flex-1 bg-transparent text-[13px] outline-none",
                    )}
                  />
                  {s.query !== "" && (
                    <button
                      type="button"
                      aria-label="Clear the search"
                      onClick={() => set({ query: "" })}
                      className={cx(
                        "text-muted hover:text-ink grid h-6 w-6 place-items-center rounded-[4px]",
                        C_FOCUS,
                      )}
                    >
                      <Ic name="X" size={13} />
                    </button>
                  )}
                </div>
              </CPanel>
            )}
          </div>
        );
      }

      function CAttachmentPicker() {
        const s = useProto();
        const { set } = s;
        if (ITEM.attachments.length < 2) return null;
        const currentKey = s.attKey ?? ITEM.attachments[0].key;
        const current =
          ITEM.attachments.find((a) => a.key === currentKey) ??
          ITEM.attachments[0];
        const open = s.sheet === "item";
        return (
          <div className="relative mt-1.5">
            <button
              type="button"
              onClick={() => set({ sheet: open ? null : "item" })}
              aria-pressed={open}
              className={cx(
                "text-muted hover:text-ink hover:bg-raised flex h-6 max-w-full items-center gap-1.5 rounded-[5px] ps-1 pe-1.5 text-[12px]",
                "transition-[background-color,color] duration-150",
                open && "bg-raised text-ink",
                C_FOCUS,
              )}
            >
              <Ic name="Paperclip" size={12} className="shrink-0" />
              <span className="min-w-0 truncate">{current.name}</span>
              <Ic
                name="ChevronDown"
                size={12}
                className="shrink-0 opacity-70"
              />
            </button>
            {open && (
              <CPanel align="start">
                <p className="text-muted px-1.5 pt-1 pb-1.5 text-[11px] tracking-[0.04em]">
                  Read annotations from
                </p>
                {ITEM.attachments.map((a) => (
                  <button
                    key={a.key}
                    type="button"
                    onClick={() => set({ attKey: a.key, sheet: null })}
                    aria-pressed={a.key === current.key}
                    className={cx(
                      "hover:bg-raised flex w-full items-start gap-2 rounded-[5px] p-1.5 text-start",
                      "transition-[background-color] duration-150",
                      C_FOCUS,
                    )}
                  >
                    <Ic
                      name={a.key === current.key ? "Check" : "FileText"}
                      size={13}
                      className={cx(
                        "mt-0.5 shrink-0",
                        a.key === current.key ? "text-accent" : "text-faint",
                      )}
                    />
                    <span className="min-w-0 flex-1">
                      <span className="text-ink block text-[12px] leading-snug text-pretty">
                        {a.name}
                      </span>
                      <span className="text-faint mt-0.5 block text-[11px] tabular-nums">
                        {a.count} annotations
                      </span>
                    </span>
                  </button>
                ))}
              </CPanel>
            )}
          </div>
        );
      }

      function CMasthead() {
        return (
          <header className="bg-ground relative z-10 min-h-0 overflow-hidden px-3 pt-3 pb-2.5">
            <div className="flex flex-col gap-2.5 @min-[860px]:flex-row @min-[860px]:items-start @min-[860px]:justify-between @min-[860px]:gap-6">
              <div className="min-w-0 @min-[860px]:max-w-[520px]">
                <h2 className="text-ink line-clamp-2 text-[13px] leading-snug font-semibold text-pretty">
                  {ITEM.title}
                </h2>
                <p className="text-muted mt-0.5 text-[12px]">
                  {ITEM.creators} ·{" "}
                  <span className="tabular-nums">{ITEM.year}</span>
                </p>
                <CAttachmentPicker />
              </div>
              <div className="@min-[860px]:shrink-0">
                <CControls />
              </div>
            </div>
          </header>
        );
      }

      function CEmptyMatch() {
        const s = useProto();
        const { clearFilters } = s;
        return (
          <div className="bg-raised rounded-[6px] p-3">
            <h3 className="text-ink text-[13px] font-semibold text-balance">
              Nothing matches that
            </h3>
            <p className="text-muted mt-1 text-[13px] leading-relaxed text-pretty">
              No annotation on this paper matches {C_filterPhrase(s)}. Show all{" "}
              {ANNOTS.length} again, or narrow it differently.
            </p>
            <button
              type="button"
              onClick={clearFilters}
              className={cx(
                "bg-accent text-ground mt-2.5 inline-flex h-7 items-center gap-1.5 rounded-[4px] px-2.5 text-[12px] font-medium",
                "transition-[transform] duration-150 active:scale-[0.96]",
                C_FOCUS,
              )}
            >
              <Ic name="ListRestart" size={13} strokeWidth={2} />
              Show all annotations
            </button>
          </div>
        );
      }

      function CList() {
        const s = useProto();
        const list = visibleAnnots(s);
        return (
          <div className="min-h-0 flex-1 overflow-y-auto px-3 pt-1">
            {list.length === 0 ? (
              <CEmptyMatch />
            ) : (
              <div className="grid grid-cols-1 pb-6 content-start items-start gap-2 @min-[500px]:grid-cols-2 @min-[860px]:grid-cols-3">
                {list.map((a) => (
                  <CCard key={a.key} annot={a} />
                ))}
              </div>
            )}
          </div>
        );
      }

      function VariantC() {
        const s = useProto();
        const present = hasItem(s);
        return (
          <ObsidianFrame>
            <div className="font-ui text-ink flex h-full min-h-0 flex-col">
              {present ? (
                <>
                  <CMasthead />
                  <CList />
                  <CStatusLine />
                </>
              ) : (
                <CNoItem />
              )}
            </div>
          </ObsidianFrame>
        );
      }
      // --- Variant C END ---
      // --- Variant C END ---
      // --- Variant C END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Reading only, in the byline", component: VariantA },
        {
          key: "B",
          name: "Nothing until you reach for it",
          component: VariantB,
        },
        { key: "C", name: "Status line on the pane edge", component: VariantC },
      ];

      const SCENARIOS = [
        ["reading", "Reading"],
        ["zotero-closed", "Zotero closed"],
        ["no-item", "No item"],
        ["saving", "Saving"],
        ["no-match", "No matches"],
      ];
      const WIDTHS = [340, 520, 900];

      const barBtn = (on) => ({
        background: on ? "#f8fafc" : "transparent",
        color: on ? "#0f172a" : "#cbd5e1",
        border: "1px solid " + (on ? "#f8fafc" : "#475569"),
        borderRadius: 999,
        padding: "2px 9px",
        font: "inherit",
        fontSize: 11,
        lineHeight: "16px",
        cursor: "pointer",
        whiteSpace: "nowrap",
      });

      function SwitchBar({ idx, setIdx }) {
        const s = useProto();
        const [theme, setTheme] = useState(
          () => document.documentElement.getAttribute("data-theme") ?? "light",
        );
        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
        }, [theme]);
        const V = VARIANTS[idx];
        const move = (d) =>
          setIdx((i) => (i + d + VARIANTS.length) % VARIANTS.length);

        return (
          <div
            style={{
              position: "fixed",
              bottom: 14,
              left: "50%",
              transform: "translateX(-50%)",
              background: "#1e293b",
              color: "#f8fafc",
              borderRadius: 14,
              padding: "9px 14px",
              display: "flex",
              flexDirection: "column",
              gap: 7,
              fontFamily: "Inter, system-ui, sans-serif",
              fontSize: 12,
              zIndex: 9999,
              boxShadow: "0 8px 28px rgba(0,0,0,0.35)",
              maxWidth: "94vw",
            }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 12,
              }}
            >
              <button
                onClick={() => move(-1)}
                style={{ ...barBtn(false), border: "none", fontSize: 15 }}
              >
                ←
              </button>
              <span
                style={{ fontWeight: 600, minWidth: 210, textAlign: "center" }}
              >
                {V.key} — {V.name}
              </span>
              <button
                onClick={() => move(1)}
                style={{ ...barBtn(false), border: "none", fontSize: 15 }}
              >
                →
              </button>
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                State
              </span>
              {SCENARIOS.map(([key, label]) => (
                <button
                  key={key}
                  onClick={() =>
                    set(
                      key === "no-match"
                        ? {
                            scenario: key,
                            colors: [ZC.red],
                            tags: ["writing"],
                            query: "",
                          }
                        : { scenario: key, colors: [], tags: [], query: "" },
                    )
                  }
                  style={barBtn(s.scenario === key)}
                >
                  {label}
                </button>
              ))}
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                Mode
              </span>
              {MODE_KEYS.map((k) => (
                <button
                  key={k}
                  onClick={() => set({ mode: k })}
                  style={barBtn(s.mode === k)}
                >
                  {MODES[k].label}
                </button>
              ))}
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                Width
              </span>
              {WIDTHS.map((w) => (
                <button
                  key={w}
                  onClick={() => set({ width: w })}
                  style={barBtn(s.width === w)}
                >
                  {w}px
                </button>
              ))}
              <span style={{ width: 10 }} />
              <button
                onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
                style={barBtn(false)}
              >
                {theme === "dark" ? "Dark" : "Light"}
              </button>
              <button
                onClick={() => set({ expanded: !s.expanded })}
                style={barBtn(s.expanded)}
              >
                Expand previews
              </button>
            </div>
          </div>
        );
      }

      function App() {
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        return (
          <>
            <V.component />
            <SwitchBar idx={idx} setIdx={setIdx} />
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
