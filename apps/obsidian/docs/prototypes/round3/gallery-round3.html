                    {condition(s) && (
                      <>
                        <span
                          aria-hidden="true"
                          className="text-faint shrink-0 text-[12px]"
                        >
                          ·
                        </span>
                        <BReadOnlyHint />
                      </>
                    )}
                    <BAttachmentPicker />
                  </div>
                </div>
                <div className="@min-[860px]:shrink-0">
                  <BControls />
                </div>
              </div>
            ) : (
              <BControls filters={false} />
            )}
          </header>
        );
      }

      /**
       * Nothing resolved. One sentence naming what THIS MODE is waiting for, and its action where
       * the mode has one. Zotero's state is not the reason a pane is empty, so it is not named.
       */
      function BEmptyPane() {
        const s = useProto();
        const { message, action } = emptyState(s);
        return (
          <div className="min-h-0 flex-1 overflow-y-auto px-3 pt-2 pb-6">
            <p className="text-muted max-w-[46ch] text-[13px] leading-relaxed text-pretty">
              {message}
            </p>
            {action && (
              <button
                type="button"
                className={cx(
                  "text-accent -ms-1.5 mt-1.5 inline-flex h-7 items-center rounded-[6px] px-1.5 text-[12px] font-medium",
                  "hover:bg-raised transition-[background-color] duration-150",
                  B_FOCUS,
                )}
              >
                {action}
              </button>
            )}
          </div>
        );
      }

      /** About the filter, and nothing else. */
      function BEmptyMatch() {
        const s = useProto();
        const { clearFilters } = s;
        return (
          <div>
            <p className="text-muted max-w-[46ch] text-[13px] leading-relaxed text-pretty">
              No annotation matches {B_filterPhrase(s)}.
            </p>
            <button
              type="button"
              onClick={clearFilters}
              className={cx(
                "text-accent -ms-1.5 mt-1.5 inline-flex h-7 items-center gap-1.5 rounded-[6px] px-1.5 text-[12px] font-medium",
                "hover:bg-raised transition-[background-color] duration-150",
                B_FOCUS,
              )}
            >
              <Ic name="ListRestart" size={13} strokeWidth={2} />
              Show all annotations
            </button>
          </div>
        );
      }

      function BList() {
        const s = useProto();
        const list = visibleAnnots(s);
        return (
          <div className="min-h-0 flex-1 overflow-y-auto px-3 pt-2 pb-6">
            {list.length === 0 ? (
              <BEmptyMatch />
            ) : (
              <div className="grid grid-cols-1 content-start items-start gap-2 @min-[500px]:grid-cols-2 @min-[860px]:grid-cols-3">
                {list.map((a) => (
                  <BCard key={a.key} annot={a} />
                ))}
              </div>
            )}
          </div>
        );
      }

      function VariantB() {
        const s = useProto();
        const present = hasItem(s);
        return (
          <ObsidianFrame>
            <div className="font-ui text-ink relative flex h-full min-h-0 flex-col">
              <BMasthead />
              {present ? <BList /> : <BEmptyPane />}
              {present && <BConditionDrawer />}
            </div>
          </ObsidianFrame>
        );
      }
      // --- Variant B END ---
      // --- Variant B END ---
      // --- Variant B END ---
      // --- Variant B END ---

      // --- Variant C ---
      // --- Variant C ---
      /**
       * VARIANT C (round 3) — "Native chrome holds the choice; content shows the outcome."
       *
       * Starts from round 2's B: the composed masthead, the word-labelled control row, and the
       * raised card whose page chip fuses the annotation's location with its highlight colour.
       *
       * Round 3:
       *   1. Read-only is one quiet word in the byline ("⌁ Reading only") and ONE drawer at the
       *      pane's bottom edge. The per-card callout is gone; a blocked card verb opens the same
       *      drawer. One explanation surface in the pane, never a tooltip, never a reflow.
       *   2. `no-item` says only what the current MODE is waiting for — never that Zotero is shut —
       *      and `no-match` talks about the filter and nothing else.
       *   3. The Follow Mode gets no control in the pane body. It is a rare choice, so it lives in a
       *      pane menu (the `MoreVertical` control at the end of the control row, a peer of Search),
       *      and its OUTCOME is carried in the masthead in form as well as words: the mode's glyph
       *      sits in the title's gutter, and the byline names the source — "Braun & Clarke · 2006 ·
       *      Following the active tab". A pin is the one mode a researcher must be able to release
       *      at once, so `pinned` also earns an "Unpin" button at the byline's trailing edge.
       *
       *      The bet: one click deeper than a visible switcher, paid for by an outcome that is
       *      always legible without opening anything.
       */

      const C_FOCUS =
        "outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-0";

      const C_VERBS = [
        { id: "colour", icon: "Palette", label: "Change colour" },
        { id: "comment", icon: "MessageSquarePlus", label: "Write a comment" },
        { id: "more", icon: "MoreHorizontal", label: "More actions" },
      ];

      /** The two verbs that are writes, and so the two that open the drawer when Zotero is shut. */
      const C_WRITE_VERBS = ["colour", "comment"];

      const C_SAVING_KEY = "n6";

      /** The sheet values the control row owns; anything else (a card's sheet) is not its business. */
      const C_CONTROL_SHEETS = ["filter", "tags", "search", "menu"];

      /** The single explanation surface. One id, because there is exactly one of it in the pane. */
      const C_DRAWER_SHEET = "why";
      const C_DRAWER_ID = "c-reading-only-drawer";

      /**
       * Whatever opened the drawer, so closing it can hand focus straight back. The drawer is a
       * pane-level surface opened from two places, so the memory lives beside it, not in a card.
       */
      let C_opener = null;

      /** "Tags", "Methods", "Methods, framing", "Methods +2" — the control's label carries its state. */
      function C_listLabel(values, fallback, name) {
        if (values.length === 0) return fallback;
        const first = name(values[0]);
        if (values.length === 1) return first;
        if (values.length === 2)
          return `${first}, ${name(values[1]).toLowerCase()}`;
        return `${first} +${values.length - 1}`;
      }

      /** The colour filter said in words, for the accessible name: "Filtered to yellow and green". */
      function C_colorPhrase(colors) {
        const names = colors.map((c) => COLOR_NAME[c].toLowerCase());
        if (names.length === 1) return `Filtered to ${names[0]}`;
        return `Filtered to ${names.slice(0, -1).join(", ")} and ${names[names.length - 1]}`;
      }

      /** A sentence fragment naming what is currently filtering the list. */
      function C_filterPhrase(s) {
        const parts = [];
        if (s.colors.length)
          parts.push(
            s.colors.map((c) => COLOR_NAME[c].toLowerCase()).join(" or "),
          );
        if (s.tags.length) parts.push(s.tags.map((t) => `#${t}`).join(" or "));
        if (s.query.trim()) parts.push(`“${s.query.trim()}”`);
        if (parts.length === 0) return "the filters you have on";
        if (parts.length === 1) return parts[0];
        return `${parts.slice(0, -1).join(", ")} and ${parts[parts.length - 1]}`;
      }

      /** The mark that fuses colour with type: a dot for a highlight, a bar for an underline. */
      function CColorMark({ type }) {
        if (type === "underline")
          return (
            <span
              aria-hidden="true"
              className="block h-[3px] w-[9px] shrink-0 rounded-[1px]"
              style={{ background: "var(--c)" }}
            />
          );
        if (type === "image")
          return (
            <span
              aria-hidden="true"
              className="block h-2 w-2 shrink-0 rounded-[2px]"
              style={{ background: "var(--c)" }}
            />
          );
        return (
          <span
            aria-hidden="true"
            className="block h-2 w-2 shrink-0 rounded-full"
            style={{ background: "var(--c)" }}
          />
        );
      }

      /** Colour + location as one mark. Opens the page in Zotero. */
      function CPageChip({ annot, live }) {
        return (
          <button
            type="button"
            disabled={!live}
            title={live ? `Open page ${annot.page} in Zotero` : undefined}
            className={cx(
              "flex h-6 shrink-0 items-center gap-1.5 rounded-[4px] ps-1.5 pe-2 text-[12px] font-medium tabular-nums",
              "text-ink transition-[box-shadow] duration-150",
              live && "hover:shadow-[0_0_0_1px_var(--c)] cursor-pointer",
              C_FOCUS,
            )}
            style={{
              background: "color-mix(in srgb, var(--c) 22%, transparent)",
            }}
          >
            <CColorMark type={annot.type} />
            <span>p.&nbsp;{annot.page}</span>
          </button>
        );
      }

      /**
       * `quiet` is the static resting cue that this verb is not currently a write: a lower rest
       * opacity, and none of the hover brightening a live verb has. No padlock, no strike, no
       * colour change — someone who never reaches for it never has to notice.
       */
      function CVerb({
        icon,
        label,
        on,
        active,
        quiet,
        expanded,
        controls,
        buttonRef,
      }) {
        return (
          <button
            ref={buttonRef}
            type="button"
            onClick={on}
            aria-label={label}
            aria-pressed={expanded === undefined && active ? true : undefined}
            aria-expanded={expanded}
            aria-controls={expanded === undefined ? undefined : controls}
            title={label}
            className={cx(
              "grid h-6 w-6 place-items-center rounded-[4px] transition-[opacity,background-color,color] duration-150",
              active
                ? "bg-accent-soft text-accent"
                : quiet
                  ? "text-muted opacity-60"
                  : "text-muted hover:bg-sunken hover:text-ink",
              C_FOCUS,
            )}
          >
            <Ic name={icon} size={14} />
          </button>
        );
      }

      function CTagChip({ tag, on, active }) {
        return (
          <button
            type="button"
            onClick={on}
            aria-pressed={active}
            className={cx(
              "h-6 rounded-[4px] px-1.5 text-[11px] tracking-[0.04em] transition-[background-color,color] duration-150",
              active
                ? "bg-accent-soft text-accent"
                : "bg-sunken text-muted hover:text-ink",
              C_FOCUS,
            )}
          >
            #{tag}
          </button>
        );
      }

      function CCommentEditor({ annot }) {
        const { set } = useProto();
        const [draft, setDraft] = React.useState(annot.comment ?? "");
        return (
          <div className="bg-ground rounded-[4px] p-1.5">
            <textarea
              autoFocus
              value={draft}
              onChange={(e) => setDraft(e.target.value)}
              rows={3}
              className={cx(
                "text-ink w-full resize-none bg-transparent text-[13px] leading-relaxed",
                "placeholder:text-faint",
                C_FOCUS,
              )}
              placeholder="Write a comment on this highlight"
            />
            <div className="mt-1 flex items-center justify-end gap-1.5">
              <button
                type="button"
                onClick={() => set({ editingKey: null })}
                className={cx(
                  "text-muted hover:text-ink h-6 rounded-[4px] px-2 text-[12px] transition-[color] duration-150",
                  C_FOCUS,
                )}
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={() => set({ editingKey: null })}
                className={cx(
                  "bg-accent text-ground h-6 rounded-[4px] px-2 text-[12px] font-medium",
                  C_FOCUS,
                )}
              >
                Save comment
              </button>
            </div>
          </div>
        );
      }

      function CSwatchRow({ annot }) {
        const { set } = useProto();
        return (
          <div className="bg-ground flex flex-wrap items-center gap-1 rounded-[4px] p-1.5">
            <span className="text-muted me-1 text-[11px] tracking-[0.04em]">
              Colour
            </span>
            {ALL_COLORS.map((c) => (
              <button
                key={c}
                type="button"
                onClick={() => set({ sheet: null })}
                aria-label={COLOR_NAME[c]}
                aria-pressed={c === annot.color}
                title={COLOR_NAME[c]}
                className={cx(
                  "h-5 w-5 rounded-[4px] transition-[box-shadow] duration-150",
                  c === annot.color
                    ? "shadow-[0_0_0_2px_var(--accent)]"
                    : "hover:shadow-[0_0_0_1px_var(--line)]",
                  C_FOCUS,
                )}
                style={{ background: c }}
              />
            ))}
          </div>
        );
      }

      function CCard({ annot }) {
        const s = useProto();
        const { select, set, toggleTag } = s;
        const live = canEdit(s);
        const selected = s.selectedKey === annot.key;
        const editing = s.editingKey === annot.key;
        const swatches = s.sheet === `colour:${annot.key}`;
        const drawerOpen = s.sheet === C_DRAWER_SHEET;
        const saving = s.scenario === "saving" && annot.key === C_SAVING_KEY;
        const isNote = annot.type === "note";

        return (
          <article
            aria-busy={saving || undefined}
            className={cx(
              "group bg-raised rounded-[6px] p-[10px] transition-[background-color,box-shadow] duration-150",
              selected &&
                "bg-accent-soft shadow-[inset_0_0_0_1px_var(--accent)]",
            )}
            style={{ "--c": annot.color }}
          >
            <div className="flex items-center gap-2">
              <CPageChip annot={annot} live={live} />
              {isNote && (
                <span className="text-muted text-[11px] tracking-[0.04em]">
                  Note to self
                </span>
              )}
              <span className="min-w-0 flex-1" />
              {saving ? (
                <span
                  className="text-muted flex items-center gap-1.5 text-[12px]"
                  aria-live="polite"
                >
                  <Ic name="Loader2" size={13} className="animate-spin" />
                  Saving…
                </span>
              ) : (
                <div
                  className={cx(
                    "flex items-center gap-0.5 transition-[opacity] duration-150",
                    !selected &&
                      "opacity-60 group-hover:opacity-100 group-focus-within:opacity-100",
                  )}
                >
                  {C_VERBS.map((v) => {
                    const isWrite = C_WRITE_VERBS.includes(v.id);
                    /** While Zotero is shut a write verb is a door to the one explanation surface. */
                    const explains = !live && isWrite;
                    return (
                      <CVerb
                        key={v.id}
                        icon={v.icon}
                        label={
                          v.id === "comment" && annot.comment
                            ? "Edit your comment"
                            : v.label
                        }
                        quiet={explains}
                        expanded={explains ? drawerOpen : undefined}
                        controls={C_DRAWER_ID}
                        active={
                          explains
                            ? false
                            : (v.id === "colour" && swatches) ||
                              (v.id === "comment" && editing)
                        }
                        on={(e) => {
                          if (explains) {
                            if (drawerOpen) {
                              set({ sheet: null });
                            } else {
                              C_opener = e.currentTarget;
                              set({ sheet: C_DRAWER_SHEET });
                            }
                          } else if (v.id === "colour") {
                            set({
                              sheet: swatches ? null : `colour:${annot.key}`,
                            });
                          } else if (v.id === "comment") {
                            set({ editingKey: editing ? null : annot.key });
                          }
                        }}
                      />
                    );
                  })}
                </div>
              )}
            </div>

            {swatches && (
              <div className="mt-2">
                <CSwatchRow annot={annot} />
              </div>
            )}

            {annot.type === "image" && (
              <img
                src={annot.img}
                alt={`Figure captured from page ${annot.page}`}
                className="mt-2 block w-full rounded-[4px]"
                style={{
                  outline:
                    "1px solid color-mix(in srgb, var(--ink) 14%, transparent)",
                  outlineOffset: "-1px",
                }}
              />
            )}

            {annot.text && (
              <button
                type="button"
                onClick={() => select(annot.key)}
                aria-pressed={selected}
                className={cx("mt-2 block w-full text-start", C_FOCUS)}
              >
                <p
                  className={cx(
                    "font-quote text-ink text-[14px] leading-[1.5]",
                    !s.expanded && "line-clamp-3",
                  )}
                >
                  {annot.text}
                </p>
              </button>
            )}

            {isNote && !editing && (
              <button
                type="button"
                onClick={() => select(annot.key)}
                aria-pressed={selected}
                className={cx("mt-2 block w-full text-start", C_FOCUS)}
              >
                <p className="text-ink text-[13px] leading-relaxed text-pretty">
                  {annot.comment}
                </p>
              </button>
            )}

            {editing ? (
              <div className="mt-2">
                <CCommentEditor annot={annot} />
              </div>
            ) : (
              !isNote &&
              annot.comment && (
                <div className="border-line mt-2 border-s-2 ps-2.5">
                  <p className="text-ink text-[13px] leading-relaxed text-pretty">
                    {annot.comment}
                  </p>
                </div>
              )
            )}

            {annot.tags.length > 0 && (
              <div className="mt-2.5 flex flex-wrap gap-1">
                {annot.tags.map((t) => (
                  <CTagChip
                    key={t}
                    tag={t}
                    active={s.tags.includes(t)}
                    on={() => toggleTag(t)}
                  />
                ))}
              </div>
            )}
          </article>
        );
      }

      function CPanel({
        children,
        align = "auto",
        width = 230,
        panelRef,
        onKeyDown,
        label,
      }) {
        const { set } = useProto();
        return (
          <>
            <button
              type="button"
              aria-label="Close this menu"
              onClick={() => set({ sheet: null })}
              className="fixed inset-0 z-20 cursor-default"
            />
            <div
              ref={panelRef}
              onKeyDown={onKeyDown}
              role={label ? "menu" : undefined}
              aria-label={label}
              className={cx(
                "bg-ground border-line absolute top-full z-30 mt-1 rounded-[8px] border p-1",
                align === "end"
                  ? "end-0"
                  : align === "start"
                    ? "start-0"
                    : "start-0 @min-[860px]:start-auto @min-[860px]:end-0",
                "shadow-[0_2px_4px_rgba(0,0,0,0.06),0_12px_28px_-10px_rgba(0,0,0,0.3)]",
              )}
              style={{ width }}
            >
              {children}
            </div>
          </>
        );
      }

      /** The selected colours themselves, in the order they appear in the document. */
      function CFilterDots({ colors }) {
        return (
          <span aria-hidden="true" className="flex shrink-0 items-center gap-1">
            {colors.map((c) => (
              <span
                key={c}
                className="block h-2 w-2 rounded-full"
                style={{
                  background: c,
                  boxShadow:
                    "0 0 0 1px color-mix(in oklab, var(--ink) 15%, transparent)",
                }}
              />
            ))}
          </span>
        );
      }

      function CControl({
        icon,
        label,
        dots,
        ariaLabel,
        active,
        on,
        chevron = true,
      }) {
        return (
          <button
            type="button"
            onClick={on}
            aria-pressed={active}
            aria-label={ariaLabel}
            className={cx(
              "flex h-7 max-w-[160px] items-center gap-1.5 rounded-[6px] px-2 text-[12px]",
              "transition-[background-color,color] duration-150",
              active
                ? "bg-accent-soft text-accent"
                : "bg-raised text-ink hover:bg-sunken",
              C_FOCUS,
            )}
          >
            {dots ? (
              <CFilterDots colors={dots} />
            ) : (
              <>
                {icon && <Ic name={icon} size={13} className="shrink-0" />}
                <span className="min-w-0 truncate">{label}</span>
              </>
            )}
            {chevron && (
              <Ic
                name="ChevronDown"
                size={12}
                className="shrink-0 opacity-70"
              />
            )}
          </button>
        );
      }

      /** A menu row: glyph, label, and a trailing check when the setting it carries is in force. */
      function CMenuItem({ icon, label, checked, on, itemRef }) {
        return (
          <button
            ref={itemRef}
            type="button"
            role="menuitem"
            onClick={on}
            aria-checked={checked === undefined ? undefined : checked}
            className={cx(
              "hover:bg-raised flex h-7 w-full items-center gap-2 rounded-[5px] px-1.5 text-[12px]",
              "transition-[background-color] duration-150",
              C_FOCUS,
            )}
          >
            {icon ? (
              <Ic name={icon} size={13} className="text-muted shrink-0" />
            ) : (
              <span aria-hidden="true" className="w-[13px] shrink-0" />
            )}
            <span className="text-ink min-w-0 flex-1 truncate text-start">
              {label}
            </span>
            {checked && (
              <Ic name="Check" size={13} className="text-accent shrink-0" />
            )}
          </button>
        );
      }

      /**
       * The pane's own menu. The frame draws a `MoreVertical` glyph in the tab header, but that is
       * the host's and inert, so the pane renders its own trigger as the last control in the row —
       * the same 28px box as Search, in the same recessed chrome.
       *
       * It holds the rare choices: which paper the pane follows, the two pin gestures, and the two
       * view settings the round-1 toolbar used to spend a whole row on.
       */
      function CPaneMenu({ open, onToggle }) {
        const s = useProto();
        const { set, setMode } = s;
        const triggerRef = React.useRef(null);
        const panelRef = React.useRef(null);

        const close = () => {
          set({ sheet: null });
          triggerRef.current?.focus();
        };

        React.useEffect(() => {
          if (!open) return;
          const items = panelRef.current?.querySelectorAll("[role='menuitem']");
          items?.[0]?.focus();
        }, [open]);

        const onKeyDown = (e) => {
          if (e.key === "Escape") {
            e.stopPropagation();
            close();
            return;
          }
          if (
            e.key !== "ArrowDown" &&
            e.key !== "ArrowUp" &&
            e.key !== "Home" &&
            e.key !== "End"
          )
            return;
          const items = Array.from(
            panelRef.current?.querySelectorAll("[role='menuitem']") ?? [],
          );
          if (items.length === 0) return;
          e.preventDefault();
          const at = items.indexOf(document.activeElement);
          const next =
            e.key === "Home"
              ? 0
              : e.key === "End"
                ? items.length - 1
                : e.key === "ArrowDown"
                  ? (at + 1 + items.length) % items.length
                  : (at - 1 + items.length) % items.length;
          items[next].focus();
        };

        const pick = (m) => {
          setMode(m);
          close();
        };

        return (
          <>
            <button
              ref={triggerRef}
              type="button"
              onClick={onToggle}
              aria-label="Open the pane menu"
              aria-haspopup="menu"
              aria-expanded={open}
              title="Pane menu"
              className={cx(
                "grid h-7 w-7 shrink-0 place-items-center rounded-[6px]",
                "transition-[background-color,color] duration-150",
                open
                  ? "bg-accent-soft text-accent"
                  : "bg-raised text-ink hover:bg-sunken",
                C_FOCUS,
              )}
            >
              <Ic name="MoreVertical" size={14} />
            </button>

            {open && (
              <CPanel
                align="end"
                width={228}
                panelRef={panelRef}
                onKeyDown={onKeyDown}
                label="Pane menu"
              >
                <p className="text-muted px-1.5 pt-1 pb-1.5 text-[11px] tracking-[0.04em]">
                  Show annotations from
                </p>
                {MODE_KEYS.map((k) => (
                  <CMenuItem
                    key={k}
                    icon={MODES[k].icon}
                    label={MODES[k].label}
                    checked={s.mode === k}
                    on={() => pick(k)}
                  />
                ))}

                <div className="bg-line my-1 h-px" />

                {hasItem(s) && (
                  <CMenuItem label="Pin this paper" on={() => pick("pinned")} />
                )}
                <CMenuItem label="Choose a paper…" on={() => pick("pinned")} />

                <div className="bg-line my-1 h-px" />

                <CMenuItem
                  label="Expand previews"
                  checked={s.expanded}
                  on={() => {
                    set({ expanded: !s.expanded });
                    close();
                  }}
                />
                <CMenuItem label="Refresh annotations" on={close} />
              </CPanel>
            )}
          </>
        );
      }

      function CControls({ minimal = false }) {
        const s = useProto();
        const { set, toggleColor, toggleTag, clearFilters } = s;
        const open = C_CONTROL_SHEETS.includes(s.sheet) ? s.sheet : null;
        const toggle = (name) => set({ sheet: open === name ? null : name });
        const picked = ALL_COLORS.filter((c) => s.colors.includes(c));

        return (
          <div className="relative flex flex-wrap items-center gap-1.5">
            {!minimal && (
              <>
                <CControl
                  icon="Palette"
                  label="Colour"
                  dots={picked.length > 0 ? picked : undefined}
                  ariaLabel={
                    picked.length > 0 ? C_colorPhrase(picked) : undefined
                  }
                  active={open === "filter" || s.colors.length > 0}
                  on={() => toggle("filter")}
                />
                <CControl
                  icon="Tags"
                  label={C_listLabel(
                    s.tags,
                    "Tags",
                    (t) => t.charAt(0).toUpperCase() + t.slice(1),
                  )}
                  active={open === "tags" || s.tags.length > 0}
                  on={() => toggle("tags")}
                />
                <CControl
                  icon="Search"
                  label={s.query.trim() ? `“${s.query.trim()}”` : "Search"}
                  active={open === "search" || s.query.trim() !== ""}
                  chevron={false}
                  on={() => toggle("search")}
                />
              </>
            )}

            <CPaneMenu open={open === "menu"} onToggle={() => toggle("menu")} />

            {!minimal && filterActive(s) && (
              <button
                type="button"
                onClick={() => {
                  clearFilters();
                  set({ sheet: null });
                }}
                className={cx(
                  "text-accent ms-auto h-7 rounded-[6px] px-1.5 text-[12px] hover:underline",
                  C_FOCUS,
                )}
              >
                Show all
              </button>
            )}

            {open === "filter" && (
              <CPanel>
                {ALL_COLORS.map((c) => (
                  <button
                    key={c}
                    type="button"
                    onClick={() => toggleColor(c)}
                    aria-pressed={s.colors.includes(c)}
                    className={cx(
                      "flex h-7 w-full items-center gap-2 rounded-[5px] px-1.5 text-[12px]",
                      "transition-[background-color] duration-150 hover:bg-raised",
                      C_FOCUS,
                    )}
                  >
                    <span
                      aria-hidden="true"
                      className="h-2.5 w-2.5 shrink-0 rounded-full"
                      style={{ background: c }}
                    />
                    <span className="text-ink flex-1 text-start">
                      {COLOR_NAME[c]}
                    </span>
                    {s.colors.includes(c) && (
                      <Ic name="Check" size={13} className="text-accent" />
                    )}
                  </button>
                ))}
              </CPanel>
            )}

            {open === "tags" && (
              <CPanel>
                <div className="max-h-[220px] overflow-y-auto">
                  {ALL_TAGS.map((t) => (
                    <button
                      key={t}
                      type="button"
                      onClick={() => toggleTag(t)}
                      aria-pressed={s.tags.includes(t)}
                      className={cx(
                        "flex h-7 w-full items-center gap-2 rounded-[5px] px-1.5 text-[12px]",
                        "transition-[background-color] duration-150 hover:bg-raised",
                        C_FOCUS,
                      )}
                    >
                      <span className="text-ink flex-1 text-start">#{t}</span>
                      <span className="text-faint tabular-nums">
                        {ANNOTS.filter((a) => a.tags.includes(t)).length}
                      </span>
                      {s.tags.includes(t) && (
                        <Ic name="Check" size={13} className="text-accent" />
                      )}
                    </button>
                  ))}
                </div>
              </CPanel>
            )}

            {open === "search" && (
              <CPanel>
                <div className="bg-raised flex h-8 items-center gap-1.5 rounded-[5px] px-2">
                  <Ic name="Search" size={13} className="text-muted shrink-0" />
                  <input
                    autoFocus
                    value={s.query}
                    onChange={(e) => set({ query: e.target.value })}
                    placeholder="Search your annotations"
                    className="text-ink placeholder:text-faint min-w-0 flex-1 bg-transparent text-[13px] outline-none"
                  />
                  {s.query !== "" && (
                    <button
                      type="button"
                      aria-label="Clear the search"
                      onClick={() => set({ query: "" })}
                      className={cx(
                        "text-muted hover:text-ink grid h-6 w-6 place-items-center rounded-[4px]",
                        C_FOCUS,
                      )}
                    >
                      <Ic name="X" size={13} />
                    </button>
                  )}
                </div>
              </CPanel>
            )}
          </div>
        );
      }

      function CAttachmentPicker() {
        const s = useProto();
        const { set } = s;
        if (ITEM.attachments.length < 2) return null;
        const currentKey = s.attKey ?? ITEM.attachments[0].key;
        const current =
          ITEM.attachments.find((a) => a.key === currentKey) ??
          ITEM.attachments[0];
        const open = s.sheet === "item";
        return (
          <div className="relative mt-1.5">
            <button
              type="button"
              onClick={() => set({ sheet: open ? null : "item" })}
              aria-pressed={open}
              className={cx(
                "text-muted hover:text-ink hover:bg-raised flex h-6 max-w-full items-center gap-1.5 rounded-[5px] ps-1 pe-1.5 text-[12px]",
                "transition-[background-color,color] duration-150",
                open && "bg-raised text-ink",
                C_FOCUS,
              )}
            >
              <Ic name="Paperclip" size={12} className="shrink-0" />
              <span className="min-w-0 truncate">{current.name}</span>
              <Ic
                name="ChevronDown"
                size={12}
                className="shrink-0 opacity-70"
              />
            </button>
            {open && (
              <CPanel align="start">
                <p className="text-muted px-1.5 pt-1 pb-1.5 text-[11px] tracking-[0.04em]">
                  Read annotations from
                </p>
                {ITEM.attachments.map((a) => (
                  <button
                    key={a.key}
                    type="button"
                    onClick={() => set({ attKey: a.key, sheet: null })}
                    aria-pressed={a.key === current.key}
                    className={cx(
                      "hover:bg-raised flex w-full items-start gap-2 rounded-[5px] p-1.5 text-start",
                      "transition-[background-color] duration-150",
                      C_FOCUS,
                    )}
                  >
                    <Ic
                      name={a.key === current.key ? "Check" : "FileText"}
                      size={13}
                      className={cx(
                        "mt-0.5 shrink-0",
                        a.key === current.key ? "text-accent" : "text-faint",
                      )}
                    />
                    <span className="min-w-0 flex-1">
                      <span className="text-ink block text-[12px] leading-snug text-pretty">
                        {a.name}
                      </span>
                      <span className="text-faint mt-0.5 block text-[11px] tabular-nums">
                        {a.count} annotations
                      </span>
                    </span>
                  </button>
                ))}
              </CPanel>
            )}
          </div>
        );
      }

      /**
       * The read-only word, at the byline's own size and colour, with a small unplug glyph. No
       * fill, no border, no amber: it is one more fact about what is on screen. Pressing it opens
       * the pane's one drawer; pressing it again closes it.
       */
      function CReadingOnly({ hint }) {
        const s = useProto();
        const { set } = s;
        const open = s.sheet === C_DRAWER_SHEET;
        return (
          <button
            type="button"
            aria-expanded={open}
            aria-controls={C_DRAWER_ID}
            onClick={(e) => {
              if (open) {
                set({ sheet: null });
              } else {
                C_opener = e.currentTarget;
                set({ sheet: C_DRAWER_SHEET });
              }
            }}
            className={cx(
              "text-muted hover:text-ink inline-flex h-6 items-center gap-1 rounded-[4px] px-1 text-[12px]",
              "-ms-1 transition-[color] duration-150",
              open && "text-ink",
              C_FOCUS,
            )}
          >
            <Ic name="Unplug" size={12} className="shrink-0" />
            {hint}
          </button>
        );
      }

      /**
       * The outcome of the mode choice, carried in content rather than in a control: the mode's
       * glyph in the title's gutter at the title's own optical weight, and the source named in the
       * byline. A pinned paper is recognisable at a glance, and releasable in one press.
       */
      function CMasthead() {
        const s = useProto();
        const { setMode } = s;
        const mode = MODES[s.mode];
        const c = condition(s);
        return (
          <header className="bg-ground relative z-10 shrink-0 px-3 pt-3 pb-2.5">
            <div className="flex flex-col gap-2.5 @min-[860px]:flex-row @min-[860px]:items-start @min-[860px]:justify-between @min-[860px]:gap-6">
              <div className="flex min-w-0 items-start gap-1.5 @min-[860px]:max-w-[520px]">
                <span className="text-muted mt-[3px] shrink-0">
                  <Ic
                    name={mode.icon}
                    size={14}
                    strokeWidth={2}
                    aria-hidden="true"
                  />
                </span>
                <div className="min-w-0 flex-1">
                  <h2 className="text-ink line-clamp-2 text-[13px] leading-snug font-semibold text-pretty">
                    {ITEM.title}
                  </h2>
                  <p className="text-muted mt-0.5 flex flex-wrap items-center gap-x-1 text-[12px]">
                    <span>{ITEM.creators}</span>
                    <span aria-hidden="true">·</span>
                    <span className="tabular-nums">{ITEM.year}</span>
                    <span className="inline-flex items-center gap-1">
                      <span aria-hidden="true">·</span>
                      <span>{mode.source}</span>
                    </span>
                    {c && (
                      <span className="inline-flex items-center gap-1">
                        <span aria-hidden="true">·</span>
                        <CReadingOnly hint={c.hint} />
                      </span>
                    )}
                    {s.mode === "pinned" && (
                      <button
                        type="button"
                        onClick={() => setMode("active-tab")}
                        className={cx(
                          "text-accent ms-auto h-6 rounded-[4px] px-1 text-[12px] hover:underline",
                          C_FOCUS,
                        )}
                      >
                        Unpin
                      </button>
                    )}
                  </p>
                  <CAttachmentPicker />
                </div>
              </div>
              <div className="@min-[860px]:shrink-0">
                <CControls />
              </div>
            </div>
          </header>
        );
      }

      /**
       * Nothing resolved. The mode is what decides which paper appears, so the mode names itself
       * here and the sentence says what it is waiting for. Zotero's state is not the reason and is
       * never mentioned.
       */
      function CEmptyPane() {
        const s = useProto();
        const { setMode } = s;
        const mode = MODES[s.mode];
        const e = emptyState(s);
        return (
          <div className="min-h-0 flex-1 overflow-y-auto px-3 pt-1 pb-6">
            <p className="text-muted flex items-center gap-1.5 text-[11px] tracking-[0.04em]">
              <Ic
                name={mode.icon}
                size={12}
                className="shrink-0"
                aria-hidden="true"
              />
              {mode.label}
            </p>
            <p className="text-ink mt-1.5 max-w-[46ch] text-[13px] leading-relaxed text-pretty">
              {e.message}
            </p>
            {e.action && (
              <button
                type="button"
                onClick={() => setMode("pinned")}
                className={cx(
                  "text-accent mt-1.5 -ms-1 inline-flex h-7 items-center gap-1.5 rounded-[6px] px-1 text-[12px] font-medium hover:underline",
                  C_FOCUS,
                )}
              >
                <Ic name="Pin" size={13} strokeWidth={2} />
                {e.action}
              </button>
            )}
          </div>
        );
      }

      /** About the filter, and nothing else. */
      function CEmptyMatch() {
        const s = useProto();
        const { clearFilters } = s;
        return (
          <div className="pt-1">
            <p className="text-ink max-w-[46ch] text-[13px] leading-relaxed text-pretty">
              No annotation matches {C_filterPhrase(s)}.
            </p>
            <button
              type="button"
              onClick={clearFilters}
              className={cx(
                "text-accent mt-1.5 -ms-1 inline-flex h-7 items-center gap-1.5 rounded-[6px] px-1 text-[12px] font-medium hover:underline",
                C_FOCUS,
              )}
            >
              <Ic name="ListRestart" size={13} strokeWidth={2} />
              Show all annotations
            </button>
          </div>
        );
      }

      function CList() {
        const s = useProto();
        const list = visibleAnnots(s);
        return (
          <div className="min-h-0 flex-1 overflow-y-auto px-3 pt-1 pb-6">
            {list.length === 0 ? (
              <CEmptyMatch />
            ) : (
              <div className="grid grid-cols-1 content-start items-start gap-2 @min-[500px]:grid-cols-2 @min-[860px]:grid-cols-3">
                {list.map((a) => (
                  <CCard key={a.key} annot={a} />
                ))}
              </div>
            )}
          </div>
        );
      }

      /**
       * The pane's one explanation surface. It rides up from the bottom edge over the list, so the
       * list neither reflows nor stops scrolling behind it. Two triggers — the byline word and a
       * blocked card verb — and one surface. Not a modal, never on hover.
       */
      function CDrawer() {
        const s = useProto();
        const { set } = s;
        const c = condition(s);
        const open = !!c && s.sheet === C_DRAWER_SHEET;
        const closeRef = React.useRef(null);

        React.useEffect(() => {
          if (open) closeRef.current?.focus();
        }, [open]);

        if (!c) return null;

        const close = () => {
          set({ sheet: null });
          C_opener?.focus();
        };

        return (
          <div
            id={C_DRAWER_ID}
            aria-hidden={open ? undefined : true}
            inert={open ? undefined : true}
            className={cx(
              "absolute inset-x-0 bottom-0 z-30 transition-[translate] duration-150",
              "motion-reduce:transition-none",
            )}
            style={{ translate: open ? "0 0" : "0 100%" }}
          >
            <div className="bg-raised border-line border-t px-3 pt-2.5 pb-3 shadow-[0_-6px_20px_-12px_rgba(0,0,0,0.45)]">
              <div className="flex items-start gap-2">
                <div className="min-w-0 flex-1">
                  <h3 className="text-ink text-[13px] font-semibold text-balance">
                    {c.title}
                  </h3>
                  <p className="text-muted mt-1 text-[13px] leading-relaxed text-pretty">
                    {c.body}
                  </p>
                </div>
                <button
                  ref={closeRef}
                  type="button"
                  onClick={close}
                  aria-label="Close this message"
                  className={cx(
                    "text-muted hover:text-ink hover:bg-sunken grid h-6 w-6 shrink-0 place-items-center rounded-[4px]",
                    "transition-[background-color,color] duration-150",
                    C_FOCUS,
                  )}
                >
                  <Ic name="X" size={14} />
                </button>
              </div>
              <button
                type="button"
                className={cx(
                  "bg-accent text-ground mt-2.5 inline-flex h-7 items-center gap-1.5 rounded-[6px] px-2.5 text-[12px] font-medium",
                  "transition-[transform] duration-150 active:scale-[0.96]",
                  C_FOCUS,
                )}
              >
                <Ic name="ExternalLink" size={13} strokeWidth={2} />
                {c.action}
              </button>
            </div>
          </div>
        );
      }

      function VariantC() {
        const s = useProto();
        const { set } = s;
        const present = hasItem(s);
        return (
          <ObsidianFrame>
            <div
              onKeyDown={(e) => {
                if (e.key === "Escape" && s.sheet === C_DRAWER_SHEET) {
                  e.stopPropagation();
                  set({ sheet: null });
                  C_opener?.focus();
                }
              }}
              className="font-ui text-ink relative flex h-full min-h-0 flex-col overflow-hidden"
            >
              {present ? (
                <>
                  <CMasthead />
                  <CList />
                  <CDrawer />
                </>
              ) : (
                <>
                  <header className="bg-ground relative z-10 shrink-0 px-3 pt-3 pb-2.5">
                    <CControls minimal />
                  </header>
                  <CEmptyPane />
                </>
              )}
            </div>
          </ObsidianFrame>
        );
      }
      // --- Variant C END ---
      // --- Variant C END ---
      // --- Variant C END ---
      // --- Variant C END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Title is the control", component: VariantA },
        { key: "B", name: "Source first in control row", component: VariantB },
        {
          key: "C",
          name: "Pane menu, outcome in masthead",
          component: VariantC,
        },
      ];

      const SCENARIOS = [
        ["reading", "Reading"],
        ["zotero-closed", "Zotero closed"],
        ["no-item", "No item"],
        ["saving", "Saving"],
        ["no-match", "No matches"],
      ];
      const WIDTHS = [340, 520, 900];

      const barBtn = (on) => ({
        background: on ? "#f8fafc" : "transparent",
        color: on ? "#0f172a" : "#cbd5e1",
        border: "1px solid " + (on ? "#f8fafc" : "#475569"),
        borderRadius: 999,
        padding: "2px 9px",
        font: "inherit",
        fontSize: 11,
        lineHeight: "16px",
        cursor: "pointer",
        whiteSpace: "nowrap",
      });

      function SwitchBar({ idx, setIdx }) {
        const s = useProto();
        const [theme, setTheme] = useState(
          () => document.documentElement.getAttribute("data-theme") ?? "light",
        );
        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
        }, [theme]);
        const V = VARIANTS[idx];
        const move = (d) =>
          setIdx((i) => (i + d + VARIANTS.length) % VARIANTS.length);

        return (
          <div
            style={{
              position: "fixed",
              bottom: 14,
              left: "50%",
              transform: "translateX(-50%)",
              background: "#1e293b",
              color: "#f8fafc",
              borderRadius: 14,
              padding: "9px 14px",
              display: "flex",
              flexDirection: "column",
              gap: 7,
              fontFamily: "Inter, system-ui, sans-serif",
              fontSize: 12,
              zIndex: 9999,
              boxShadow: "0 8px 28px rgba(0,0,0,0.35)",
              maxWidth: "94vw",
            }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 12,
              }}
            >
              <button
                onClick={() => move(-1)}
                style={{ ...barBtn(false), border: "none", fontSize: 15 }}
              >
                ←
              </button>
              <span
                style={{ fontWeight: 600, minWidth: 210, textAlign: "center" }}
              >
                {V.key} — {V.name}
              </span>
              <button
                onClick={() => move(1)}
                style={{ ...barBtn(false), border: "none", fontSize: 15 }}
              >
                →
              </button>
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                State
              </span>
              {SCENARIOS.map(([key, label]) => (
                <button
                  key={key}
                  onClick={() =>
                    set(
                      key === "no-match"
                        ? {
                            scenario: key,
                            colors: [ZC.red],
                            tags: ["writing"],
                            query: "",
                          }
                        : { scenario: key, colors: [], tags: [], query: "" },
                    )
                  }
                  style={barBtn(s.scenario === key)}
                >
                  {label}
                </button>
              ))}
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                Mode
              </span>
              {MODE_KEYS.map((k) => (
                <button
                  key={k}
                  onClick={() => set({ mode: k })}
                  style={barBtn(s.mode === k)}
                >
                  {MODES[k].label}
                </button>
              ))}
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                Width
              </span>
              {WIDTHS.map((w) => (
                <button
                  key={w}
                  onClick={() => set({ width: w })}
                  style={barBtn(s.width === w)}
                >
                  {w}px
                </button>
              ))}
              <span style={{ width: 10 }} />
              <button
                onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
                style={barBtn(false)}
              >
                {theme === "dark" ? "Dark" : "Light"}
              </button>
              <button
                onClick={() => set({ expanded: !s.expanded })}
                style={barBtn(s.expanded)}
              >
                Expand previews
              </button>
            </div>
          </div>
        );
      }

      function App() {
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        return (
          <>
            <V.component />
            <SwitchBar idx={idx} setIdx={setIdx} />
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
