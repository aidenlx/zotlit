       * Zotero's running state is not this state's business and is never named here.
       */
      function ANoItem() {
        const s = useProto();
        const { set } = s;
        const e = emptyState(s);
        const open = s.sheet === "mode";
        const triggerRef = React.useRef(null);
        const close = () => {
          set({ sheet: null });
          triggerRef.current?.focus();
        };
        return (
          <div>
            <div className="relative w-fit">
              <button
                ref={triggerRef}
                type="button"
                aria-haspopup="menu"
                aria-expanded={open}
                aria-controls={open ? A_MENU_ID : undefined}
                aria-label={`Choose what this pane follows. ${MODES[s.mode].label}.`}
                onClick={() => set({ sheet: open ? null : "mode" })}
                className={cx(
                  "text-muted hover:text-ink hover:bg-raised -ms-1 flex h-6 items-center gap-1.5 rounded-[5px] ps-1 pe-1.5 text-[12px]",
                  "transition-[background-color,color] duration-150",
                  open && "bg-raised text-ink",
                  A_FOCUS,
                )}
              >
                <Ic name={MODES[s.mode].icon} size={12} className="shrink-0" />
                <span className="whitespace-nowrap">{MODES[s.mode].label}</span>
                <Ic
                  name="ChevronDown"
                  size={12}
                  className="shrink-0 opacity-70"
                />
              </button>
              {open && <AModeMenu onClose={close} />}
            </div>
            <p className="text-ink mt-1.5 max-w-[46ch] text-[13px] leading-relaxed text-pretty">
              {e.message}
            </p>
            {e.action && (
              <button
                type="button"
                className={cx(
                  "text-accent -ms-1 mt-1 inline-flex h-6 items-center gap-1.5 rounded-[4px] px-1 text-[12px] font-medium hover:underline",
                  A_FOCUS,
                )}
              >
                <Ic name="LibraryBig" size={13} strokeWidth={2} />
                {e.action}
              </button>
            )}
          </div>
        );
      }

      /**
       * The pane's top, in two shapes. Where nothing else on screen names the paper it is the
       * masthead — the title as the mode control, the byline under it. Where something already does,
       * `identityShown(s)` is false and the whole block becomes one status bar carrying the mode, the
       * files status and the read-only hint, two lines shorter. Either way the control row follows,
       * and both are the same whether Zotero is open or shut apart from that one trailing word.
       */
      function AMasthead() {
        const s = useProto();
        const present = hasItem(s);
        return (
          <header className="bg-ground relative z-10 shrink-0 px-3 pt-3 pb-2.5">
            {present ? (
              <div className="flex flex-col gap-2.5 @min-[860px]:flex-row @min-[860px]:items-start @min-[860px]:justify-between @min-[860px]:gap-6">
                <div className="min-w-0 @min-[860px]:max-w-[520px]">
                  {identityShown(s) ? <ATitleControl /> : <AStatusBar />}
                </div>
                <div className="@min-[860px]:shrink-0">
                  <AControls />
                </div>
              </div>
            ) : (
              <ANoItem />
            )}
          </header>
        );
      }

      /** About the filter and nothing else: what missed, and the one way back. */
      function AEmptyMatch() {
        const s = useProto();
        const { clearFilters } = s;
        return (
          <div>
            <p className="text-ink max-w-[46ch] text-[13px] leading-relaxed text-pretty">
              No annotation matches {A_filterPhrase(s)}.
            </p>
            <button
              type="button"
              onClick={clearFilters}
              className={cx(
                "text-accent -ms-1 mt-1 inline-flex h-6 items-center gap-1.5 rounded-[4px] px-1 text-[12px] font-medium hover:underline",
                A_FOCUS,
              )}
            >
              <Ic name="ListRestart" size={13} strokeWidth={2} />
              Clear the filters
            </button>
          </div>
        );
      }

      function AList() {
        const s = useProto();
        const list = visibleAnnots(s);
        return (
          <div className="min-h-0 flex-1 overflow-y-auto px-3 pt-1 pb-6">
            {list.length === 0 ? (
              <AEmptyMatch />
            ) : (
              <div className="grid grid-cols-1 content-start items-start gap-2 @min-[500px]:grid-cols-2 @min-[860px]:grid-cols-3">
                {list.map((a) => (
                  <ACard key={a.key} annot={a} />
                ))}
              </div>
            )}
          </div>
        );
      }

      function VariantA() {
        const s = useProto();
        return (
          <ObsidianFrame>
            <div
              onKeyDown={(e) => {
                if (e.key === "Escape" && A_isDrawer(s.sheet)) {
                  e.stopPropagation();
                  A_closeDrawer();
                }
              }}
              className="font-ui text-ink relative flex h-full min-h-0 flex-col"
            >
              <AMasthead />
              {hasItem(s) && <AList />}
              <ADrawer />
              {s.sheet === "files" && <ASuggester />}
            </div>
          </ObsidianFrame>
        );
      }
      // --- Variant A END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Title is the control", component: VariantA },
      ];

      const SCENARIOS = [
        ["reading", "Reading"],
        ["zotero-closed", "Zotero closed"],
        ["no-item", "No item"],
        ["saving", "Saving"],
        ["no-match", "No matches"],
      ];
      const WIDTHS = [340, 520, 900];
      const ATTACHMENTS = [
        ["single", "One file"],
        ["several", "Several"],
        ["reader-locked", "Reader holds it"],
        ["obsidian-pdf", "PDF open here"],
      ];

      const barBtn = (on) => ({
        background: on ? "#f8fafc" : "transparent",
        color: on ? "#0f172a" : "#cbd5e1",
        border: "1px solid " + (on ? "#f8fafc" : "#475569"),
        borderRadius: 999,
        padding: "2px 9px",
        font: "inherit",
        fontSize: 11,
        lineHeight: "16px",
        cursor: "pointer",
        whiteSpace: "nowrap",
      });

      function SwitchBar({ idx, setIdx }) {
        const s = useProto();
        const [theme, setTheme] = useState(
          () => document.documentElement.getAttribute("data-theme") ?? "light",
        );
        useEffect(() => {
          document.documentElement.setAttribute("data-theme", theme);
        }, [theme]);
        const V = VARIANTS[idx];
        const move = (d) =>
          setIdx((i) => (i + d + VARIANTS.length) % VARIANTS.length);

        return (
          <div
            style={{
              position: "fixed",
              bottom: 14,
              left: "50%",
              transform: "translateX(-50%)",
              background: "#1e293b",
              color: "#f8fafc",
              borderRadius: 14,
              padding: "9px 14px",
              display: "flex",
              flexDirection: "column",
              gap: 7,
              fontFamily: "Inter, system-ui, sans-serif",
              fontSize: 12,
              zIndex: 9999,
              boxShadow: "0 8px 28px rgba(0,0,0,0.35)",
              maxWidth: "94vw",
            }}
          >
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 12,
              }}
            >
              <button
                onClick={() => move(-1)}
                style={{ ...barBtn(false), border: "none", fontSize: 15 }}
              >
                ←
              </button>
              <span
                style={{ fontWeight: 600, minWidth: 210, textAlign: "center" }}
              >
                {V.key} — {V.name}
              </span>
              <button
                onClick={() => move(1)}
                style={{ ...barBtn(false), border: "none", fontSize: 15 }}
              >
                →
              </button>
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                State
              </span>
              {SCENARIOS.map(([key, label]) => (
                <button
                  key={key}
                  onClick={() =>
                    set(
                      key === "no-match"
                        ? {
                            scenario: key,
                            colors: [ZC.red],
                            tags: ["writing"],
                            query: "",
                          }
                        : { scenario: key, colors: [], tags: [], query: "" },
                    )
                  }
                  style={barBtn(s.scenario === key)}
                >
                  {label}
                </button>
              ))}
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                Mode
              </span>
              {MODE_KEYS.map((k) => (
                <button
                  key={k}
                  onClick={() => set({ mode: k })}
                  style={barBtn(s.mode === k)}
                >
                  {MODES[k].label}
                </button>
              ))}
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                Files
              </span>
              {ATTACHMENTS.map(([k, label]) => (
                <button
                  key={k}
                  onClick={() => set({ attachment: k })}
                  style={barBtn(s.attachment === k)}
                >
                  {label}
                </button>
              ))}
            </div>

            <div
              style={{
                display: "flex",
                flexWrap: "wrap",
                alignItems: "center",
                gap: 5,
              }}
            >
              <span style={{ color: "#94a3b8", fontSize: 11, width: 52 }}>
                Width
              </span>
              {WIDTHS.map((w) => (
                <button
                  key={w}
                  onClick={() => set({ width: w })}
                  style={barBtn(s.width === w)}
                >
                  {w}px
                </button>
              ))}
              <span style={{ width: 10 }} />
              <button
                onClick={() => setTheme(theme === "dark" ? "light" : "dark")}
                style={barBtn(false)}
              >
                {theme === "dark" ? "Dark" : "Light"}
              </button>
              <button
                onClick={() => set({ expanded: !s.expanded })}
                style={barBtn(s.expanded)}
              >
                Expand previews
              </button>
            </div>
          </div>
        );
      }

      function App() {
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        return (
          <>
            <V.component />
            <SwitchBar idx={idx} setIdx={setIdx} />
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
