                          (g.rows[0].kids[0] && !C_hit(g.rows[0].row, t)
                            ? g.rows[0].kids[0]
                            : g.rows[0].row
                          ).path,
                        );
                      }
                    }
                    if (e.key === "Escape" && query) {
                      e.stopPropagation();
                      setQuery("");
                    }
                  }}
                  className="min-w-0 flex-1 bg-transparent text-sm text-ink outline-none placeholder:text-faint"
                />
              </label>
            </div>
            <div
              ref={scroller}
              onScroll={onScroll}
              onKeyDown={onKeyDown}
              className="relative min-h-0 flex-1 overflow-auto px-2 pb-6"
            >
              {groups.length === 0 && (
                <div className="py-6 text-center text-sm text-muted">
                  No fields match “{query}”.
                </div>
              )}
              {groups.map((g) => {
                const Icon = C_SECTION_ICONS[g.id] ?? L.Circle;
                return (
                  <section
                    key={g.id}
                    data-c-section={g.id}
                    aria-label={g.label}
                  >
                    <h3 className="sticky top-0 z-10 flex items-center gap-1.5 bg-panel px-1 pt-3 pb-1 text-xs font-semibold text-muted">
                      <Icon size={13} className="text-faint" /> {g.label}
                    </h3>
                    {g.rows.map(({ row, kids }) => {
                      const open = t ? kids.length > 0 : !!expanded[row.path];
                      return (
                        <div key={row.path}>
                          <C_Row
                            field={row}
                            expandable={kids.length > 0}
                            expanded={open}
                            onToggle={() =>
                              setExpanded((x) => ({
                                ...x,
                                [row.path]: !x[row.path],
                              }))
                            }
                          />
                          {open &&
                            kids.map((c) => (
                              <C_Row key={c.path} field={c} depth={1} />
                            ))}
                        </div>
                      );
                    })}
                  </section>
                );
              })}
            </div>
          </div>
        );
      }

      /** The sheet or docked panel: header with pin toggle and close, then the inspector. */
      function C_Panel({
        mode,
        pinned,
        narrow,
        onPin,
        onClose,
        jump,
        onSection,
        width,
        setWidth,
      }) {
        const searchRef = useRef(null);
        useEffect(() => {
          if (mode === "sheet")
            searchRef.current?.focus({ preventScroll: true });
        }, []);
        const onDrag = (e) => {
          e.preventDefault();
          const x0 = e.clientX,
            w0 = width;
          const move = (ev) =>
            setWidth(
              Math.max(
                C_DOCK_MIN,
                Math.min(C_DOCK_MAX, Math.round(w0 + ev.clientX - x0)),
              ),
            );
          const up = () => {
            removeEventListener("pointermove", move);
            removeEventListener("pointerup", up);
          };
          addEventListener("pointermove", move);
          addEventListener("pointerup", up);
        };
        const sheet = mode === "sheet";
        return (
          <aside
            id="c-sheet"
            aria-label="Item data"
            className={
              sheet
                ? "c-slide absolute inset-y-0 left-0 z-30 flex max-w-[88cqw] flex-col border-r border-line bg-panel shadow-[4px_0_24px_rgba(0,0,0,0.14)]"
                : "relative flex shrink-0 flex-col border-r border-line bg-panel"
            }
            style={{ width: sheet ? C_SHEET_W : width }}
          >
            <div className="flex shrink-0 items-center gap-1 px-3 pt-2 pb-2">
              <div className="min-w-0 flex-1">
                <div className="text-sm font-semibold">Item data</div>
                <div className="truncate text-xs text-muted">
                  {pinned && narrow
                    ? "Pinned · widen the view to dock it"
                    : "Click a field to insert it at the cursor"}
                </div>
              </div>
              <IconButton
                icon={pinned ? L.PinOff : L.Pin}
                label={pinned ? "Unpin" : "Pin to side"}
                active={pinned}
                onClick={onPin}
              />
              {sheet && (
                <IconButton
                  icon={L.X}
                  label="Close item data"
                  onClick={onClose}
                />
              )}
            </div>
            <C_Inspector
              jump={jump}
              onSection={onSection}
              searchRef={searchRef}
            />
            {!sheet && (
              <div
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize item data"
                tabIndex={0}
                aria-valuemin={C_DOCK_MIN}
                aria-valuemax={C_DOCK_MAX}
                aria-valuenow={width}
                onPointerDown={onDrag}
                onKeyDown={(e) => {
                  if (e.key === "ArrowRight") {
                    e.preventDefault();
                    setWidth(Math.min(C_DOCK_MAX, width + 16));
                  }
                  if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    setWidth(Math.max(C_DOCK_MIN, width - 16));
                  }
                }}
                className="absolute inset-y-0 -right-1 z-20 w-2 cursor-col-resize hover:bg-accent/40 focus-visible:bg-accent/60 focus-visible:outline-none"
              />
            )}
          </aside>
        );
      }

      function VariantC() {
        const narrow = useNarrow();
        const [open, setOpen] = useState(false);
        const [pinned, setPinned] = useState(false);
        const [dockW, setDockW] = useState(C_SHEET_W);
        const [jump, setJump] = useState({ id: "common", n: 0 });
        const [section, setSection] = useState("common");
        const [mainW, setMainW] = useState(800);
        const main = useRef(null);
        const entryRef = useRef(null);

        useLayoutEffect(() => {
          const el = main.current;
          if (!el) return;
          const ro = new ResizeObserver(() => setMainW(el.clientWidth));
          ro.observe(el);
          return () => ro.disconnect();
        }, []);

        const docked = open && pinned && !narrow;
        const asSheet = open && !docked;
        const close = () => {
          setOpen(false);
          entryRef.current?.focus();
        };
        const jumpTo = (id) => {
          setOpen(true);
          setSection(id);
          setJump((j) => ({ id, n: j.n + 1 }));
        };
        const sideBySide = mainW >= C_STACK_MIN;

        return (
          <Stage title="C — Edge rail">
            <style>{C_STYLE}</style>
            <ViewHeader />
            <div
              className="flex min-h-0 flex-1"
              onKeyDown={(e) => {
                if (e.key === "Escape" && asSheet) {
                  e.preventDefault();
                  close();
                }
              }}
            >
              <C_Rail
                open={open}
                pinned={pinned}
                docked={docked}
                activeSection={section}
                entryRef={entryRef}
                onOpen={() =>
                  docked ? jumpTo(section) : open ? close() : jumpTo(section)
                }
                onJump={jumpTo}
              />
              <div className="relative flex min-w-0 flex-1">
                {open && (
                  <C_Panel
                    mode={docked ? "dock" : "sheet"}
                    pinned={pinned}
                    narrow={narrow}
                    onPin={() => setPinned((p) => !p)}
                    onClose={close}
                    jump={jump}
                    onSection={setSection}
                    width={dockW}
                    setWidth={setDockW}
                  />
                )}
                <div
                  ref={main}
                  className="flex min-w-0 flex-1 flex-col"
                  onPointerDown={() => {
                    if (asSheet) setOpen(false);
                  }}
                >
                  <ItemRow />
                  <TabBar />
                  <div
                    className={`flex min-h-0 flex-1 ${sideBySide ? "flex-row" : "flex-col"}`}
                  >
                    <SourceEditor
                      className={`min-h-[160px] flex-1 ${sideBySide ? "basis-1/2" : ""}`}
                    />
                    <NotePreview
                      className={`flex-1 border-line ${sideBySide ? "basis-1/2 border-l" : "border-t"}`}
                    />
                  </div>
                </div>
              </div>
            </div>
          </Stage>
        );
      }
      // --- Variant C END ---

      // --- Variant D ---
      // --- Variant D: push when it fits, overlay when it does not ---
      // One sheet at the left edge. Width decides only push (beside the editor) vs overlay (over it).
      // The pin means only "keep it open after an insert or a click elsewhere".
      const D_SHEET_W = 320;
      const D_STACK_BELOW = 896; // room for editor + preview side by side
      const D_FILLED = ALL_FIELDS.filter((f) => f.value).length;

      function D_match(f, t) {
        return `${f.label} ${f.path} ${f.value}`.toLowerCase().includes(t);
      }

      /** Sections with rows that match `q`; a list row stays when a sub-field matches. */
      function D_filter(q) {
        const t = q.trim().toLowerCase();
        return SECTIONS.map((s) => ({
          ...s,
          rows: s.rows
            .map((r) => {
              if (!t) return r;
              const kids = (r.children ?? []).filter((c) => D_match(c, t));
              if (D_match(r, t) || kids.length)
                return {
                  ...r,
                  children: r.children,
                  matchKids: kids.length > 0,
                };
              return null;
            })
            .filter(Boolean),
        })).filter((s) => s.rows.length);
      }

      function D_Row({ field, depth = 0, open, onToggle, onInsert }) {
        const empty = !field.value;
        const kids = field.children?.length;
        return (
          <div
            className="group relative flex items-start gap-1 rounded-md hover:bg-panel"
            style={{ paddingLeft: depth * 16 }}
          >
            {kids ? (
              <button
                type="button"
                onClick={onToggle}
                aria-expanded={open}
                aria-label={`${open ? "Hide" : "Show"} sub-fields of ${field.label}`}
                className="mt-1.5 inline-flex size-5 shrink-0 items-center justify-center rounded text-faint hover:text-ink focus-visible:outline-2 focus-visible:outline-accent"
              >
                <L.ChevronRight
                  size={14}
                  className={`transition-transform ${open ? "rotate-90" : ""}`}
                />
              </button>
            ) : (
              <span className="w-5 shrink-0" />
            )}
            <button
              type="button"
              data-d-row
              onClick={() => onInsert(field.path)}
              title={
                empty
                  ? `${field.label}: no value for this item`
                  : `Insert ${field.label}`
              }
              className="min-w-0 flex-1 rounded-md py-1.5 pr-16 text-left focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent"
            >
              <div className="text-sm text-ink">{field.label}</div>
              <div
                className={`line-clamp-2 text-sm break-words ${empty ? "italic text-faint" : "text-value"}`}
              >
                {empty ? "Empty for this item" : field.value}
              </div>
              <div className="truncate font-mono text-[11px] text-faint">
                zt.{field.path}
              </div>
            </button>
            <span
              aria-hidden="true"
              className="pointer-events-none absolute top-2 right-2 rounded-md border border-line bg-ground px-2 py-0.5 text-xs text-muted opacity-0 group-focus-within:opacity-100 group-hover:border-accent group-hover:text-accent group-hover:opacity-100"
            >
              Insert
            </span>
          </div>
        );
      }

      function D_Inspector({ onInsert, searchRef }) {
        const [q, setQ] = useState("");
        const [openRows, setOpenRows] = useState({});
        const sections = D_filter(q);
        const searching = q.trim() !== "";
        const listRef = useRef(null);

        const rows = () => [
          ...(listRef.current?.querySelectorAll("[data-d-row]") ?? []),
        ];
        const onListKey = (e) => {
          if (
            e.key !== "ArrowDown" &&
            e.key !== "ArrowUp" &&
            e.key !== "Home" &&
            e.key !== "End"
          )
            return;
          const all = rows();
          const i = all.indexOf(document.activeElement);
          if (i < 0 && e.target !== searchRef.current) return;
          e.preventDefault();
          let n =
            e.key === "ArrowDown"
              ? i + 1
              : e.key === "ArrowUp"
                ? i - 1
                : e.key === "Home"
                  ? 0
                  : all.length - 1;
          if (n < 0) return searchRef.current?.focus();
          all[Math.min(n, all.length - 1)]?.focus();
        };

        return (
          <div className="flex min-h-0 flex-1 flex-col" onKeyDown={onListKey}>
            <div className="shrink-0 px-3 pb-2">
              <div className="relative">
                <L.Search
                  size={14}
                  className="pointer-events-none absolute top-1/2 left-2 -translate-y-1/2 text-faint"
                />
                <input
                  ref={searchRef}
                  type="search"
                  value={q}
                  placeholder="Search fields"
                  aria-label="Search fields"
                  onChange={(e) => setQ(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") {
                      e.preventDefault();
                      const first = sections[0]?.rows[0];
                      if (first)
                        onInsert(
                          first.matchKids
                            ? first.children.find((c) =>
                                D_match(c, q.trim().toLowerCase()),
                              ).path
                            : first.path,
                        );
                    }
                  }}
                  className="h-8 w-full rounded-md border border-line bg-panel pr-2 pl-7 text-sm outline-none placeholder:text-faint focus:border-accent"
                />
              </div>
            </div>
            <div
              ref={listRef}
              className="min-h-0 flex-1 overflow-y-auto px-2 pb-3"
            >
              {sections.length === 0 && (
                <div className="p-3 text-sm text-muted">
                  No fields match “{q}”.
                </div>
              )}
              {sections.map((s) => (
                <section key={s.id} aria-label={s.label} className="mb-2">
                  <h3 className="sticky top-0 z-[1] bg-ground px-2 pt-2 pb-1 text-xs font-medium text-faint">
                    {s.label}
                  </h3>
                  {s.rows.map((r) => {
                    const open =
                      !!r.children?.length &&
                      (openRows[r.path] ?? (searching && r.matchKids));
                    return (
                      <div key={r.path}>
                        <D_Row
                          field={r}
                          open={open}
                          onInsert={onInsert}
                          onToggle={() =>
                            setOpenRows((o) => ({ ...o, [r.path]: !open }))
                          }
                        />
                        {open &&
                          r.children.map((c) => (
                            <D_Row
                              key={c.path}
                              field={c}
                              depth={1}
                              onInsert={onInsert}
                            />
                          ))}
                      </div>
                    );
                  })}
                </section>
              ))}
            </div>
          </div>
        );
      }

      function VariantD() {
        const width = useViewWidth();
        const narrow = useNarrow();
        const [open, setOpen] = useState(false);
        const [pinned, setPinned] = useState(false);
        const [panelW, setPanelW] = useState(D_SHEET_W);
        const taRef = useRef(null);
        const searchRef = useRef(null);
        const toggleRef = useRef(null);

        const pushes = open && !narrow;
        const overlays = open && narrow;
        const dockW = Math.max(240, Math.min(panelW, width - 360));
        const mainW = width - (pushes ? dockW : 0);
        const previewBeside = mainW >= D_STACK_BELOW;

        useEffect(() => {
          if (open) searchRef.current?.focus();
        }, [open]);

        const close = (focusEditor) => {
          setOpen(false);
          requestAnimationFrame(() =>
            (focusEditor ? taRef.current : toggleRef.current)?.focus(),
          );
        };
        const onInsert = (path) => {
          insertField(path);
          if (!pinned) close(true);
        };
        const onEditorDown = () => {
          if (open && !pinned && pushes) setOpen(false);
        };

        const onResize = (e) => {
          e.preventDefault();
          const x0 = e.clientX,
            w0 = dockW;
          const move = (ev) =>
            setPanelW(Math.max(240, Math.min(480, w0 + ev.clientX - x0)));
          const up = () => {
            removeEventListener("pointermove", move);
            removeEventListener("pointerup", up);
          };
          addEventListener("pointermove", move);
          addEventListener("pointerup", up);
        };
        const onResizeKey = (e) => {
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            setPanelW(Math.max(240, dockW - 16));
          }
          if (e.key === "ArrowRight") {
            e.preventDefault();
            setPanelW(Math.min(480, dockW + 16));
          }
        };

        const action = (
          <button
            ref={toggleRef}
            type="button"
            onClick={() => (open ? close(false) : setOpen(true))}
            aria-expanded={open}
            aria-controls="d-sheet"
            title="Item data"
            className={`inline-flex h-7 items-center gap-1.5 rounded-md px-1.5 text-sm focus-visible:outline-2 focus-visible:outline-accent ${open ? "bg-accent-soft text-accent" : "text-muted hover:bg-panel hover:text-ink"}`}
          >
            <L.Database size={16} strokeWidth={1.75} />
            <span className={narrow ? "sr-only" : ""}>Item data</span>
          </button>
        );

        const sheet = open && (
          <aside
            id="d-sheet"
            aria-label="Item data"
            role={overlays && !pinned ? "dialog" : undefined}
            onKeyDown={(e) => {
              if (e.key === "Escape") {
                e.preventDefault();
                e.stopPropagation();
                close(false);
              }
            }}
            style={
              pushes ? { width: dockW } : { width: D_SHEET_W, maxWidth: "88%" }
            }
            className={`d-slide flex min-h-0 flex-col bg-ground ${pushes ? "relative shrink-0 border-r border-line" : "absolute inset-y-0 left-0 z-30 border-r border-line shadow-[8px_0_24px_-6px_rgba(0,0,0,0.25)]"}`}
          >
            <div className="flex h-11 shrink-0 items-center gap-2 pr-2 pl-3">
              <L.Database size={15} className="text-muted" />
              <h2 className="text-sm font-medium">Item data</h2>
              <span
                className="rounded-full bg-panel px-1.5 text-xs tabular-nums text-muted"
                title={`${D_FILLED} fields have a value for this item`}
              >
                {D_FILLED}
              </span>
              <div className="ml-auto flex items-center gap-0.5">
                <IconButton
                  icon={pinned ? L.PinOff : L.Pin}
                  label={
                    pinned
                      ? "Unpin"
                      : "Pin open: stays open after you insert or click elsewhere"
                  }
                  active={pinned}
                  onClick={() => setPinned((p) => !p)}
                />
                <IconButton
                  icon={L.X}
                  label="Close"
                  onClick={() => close(false)}
                />
              </div>
            </div>
            <D_Inspector onInsert={onInsert} searchRef={searchRef} />
            <div className="shrink-0 border-t border-line px-3 py-1.5 text-[11px] text-faint">
              {pushes
                ? "Beside the editor"
                : "Over the editor · widen the view to keep it beside"}
              {pinned && " · pinned open"}
            </div>
            {pushes && (
              <div
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize item data"
                tabIndex={0}
                aria-valuemin={240}
                aria-valuemax={480}
                aria-valuenow={dockW}
                onPointerDown={onResize}
                onKeyDown={onResizeKey}
                className="absolute inset-y-0 -right-1 z-10 w-2 cursor-col-resize hover:bg-accent/30 focus-visible:bg-accent/40 focus-visible:outline-none"
              />
            )}
          </aside>
        );

        return (
          <Stage title="D · Push when it fits, overlay when it does not">
            <style>{`@keyframes d-slide-in { from { transform: translateX(-24px); opacity: 0; } }
              @media (prefers-reduced-motion: no-preference) { .d-slide { animation: d-slide-in 150ms ease-out; } }`}</style>
            <ViewHeader actions={action} />
            <div className="relative flex min-h-0 flex-1">
              {sheet}
              <div
                className="flex min-w-0 flex-1 flex-col"
                onPointerDown={onEditorDown}
              >
                <ItemRow onTitleClick={() => setOpen(true)} />
                <TabBar />
                <div
                  className={`mt-2 flex min-h-0 flex-1 border-t border-line ${previewBeside ? "flex-row" : "flex-col"}`}
                >
                  <SourceEditor
                    taRef={taRef}
                    className="min-h-0 flex-1 basis-1/2"
                  />
                  <NotePreview
                    className={`min-h-0 flex-1 basis-1/2 bg-panel/40 ${previewBeside ? "border-l border-line" : "border-t border-line"}`}
                  />
                </div>
              </div>
              {overlays && !pinned && (
                <div
                  aria-hidden="true"
                  onPointerDown={() => setOpen(false)}
                  className="absolute inset-0 z-20 bg-ink/25"
                />
              )}
            </div>
          </Stage>
        );
      }
      // --- Variant D END ---

      // --- Variant E ---
      // Variant E (round 2) — "Sheet with a detail flyout".
      // A non-modal left sheet. Rows stay compact (label + one-line value); the selected row's detail
      // flies out to the right of the sheet (wide) or expands under the row (narrow).

      /** Text with every case-insensitive match of `q` emphasised (round-1 highlighting). */
      function E_Mark({ text, q }) {
        const t = q.trim();
        if (!t || !text) return text;
        const lower = text.toLowerCase(),
          needle = t.toLowerCase();
        const out = [];
        let i = 0,
          k = 0;
        while (true) {
          const j = lower.indexOf(needle, i);
          if (j < 0) break;
          if (j > i) out.push(text.slice(i, j));
          out.push(
            <mark
              key={k++}
              className="rounded-sm bg-accent-soft px-px font-semibold text-accent"
            >
              {text.slice(j, j + t.length)}
            </mark>,
          );
          i = j + t.length;
        }
        out.push(text.slice(i));
        return out;
      }

      const E_isEmpty = (f) => f.kind === "empty" || !f.value;

      function E_Value({ field, q, full }) {
        if (E_isEmpty(field))
          return <span className="italic text-faint">Empty for this item</span>;
        return (
          <span
            className={`text-value ${full ? "break-words whitespace-pre-wrap" : "truncate"}`}
          >
            <E_Mark text={field.value} q={q} />
          </span>
        );
      }

      /** The detail card: full value, path, what the note gets, Insert and Copy. */
      function E_Detail({ field, q, inline }) {
        const [copied, setCopied] = useState(false);
        useEffect(() => setCopied(false), [field.path]);
        const parent = field.parent ? findField(field.parent) : null;
        const copy = () => {
          navigator.clipboard?.writeText(snippetOf(field.path)).catch(() => {});
          setCopied(true);
          setTimeout(() => setCopied(false), 1200);
        };
        const showValue = !inline || (field.value ?? "").length > 30;
        return (
          <div className="flex flex-col gap-3 text-sm">
            {!inline && (
              <div>
                <div className="text-xs text-muted">
                  {field.section}
                  {parent ? ` · ${parent.label}` : ""}
                </div>
                <div className="text-base font-semibold text-ink">
                  {field.label}
                </div>
              </div>
            )}
            {showValue && (
              <div className="max-h-40 overflow-auto rounded-md border border-line bg-ground p-2 leading-6">
                <E_Value field={field} q={q} full />
              </div>
            )}
            <div>
              <div className="mb-0.5 text-xs text-muted">Template path</div>
              <code className="font-mono text-xs break-all text-muted">
                zt.{field.path}
              </code>
            </div>
            <div>
              <div className="mb-0.5 text-xs text-muted">In your note:</div>
              <div className="font-mono text-xs break-all text-accent">
                {snippetOf(field.path)}
              </div>
              <div className="mt-0.5 flex gap-1.5 break-words">
                <L.CornerDownRight
                  size={13}
                  className="mt-0.5 shrink-0 text-faint"
                />
                {E_isEmpty(field) ? (
                  <span className="italic text-faint">
                    Nothing — this item has no value here
                  </span>
                ) : (
                  <span className="text-value">
                    {field.value.length > 90
                      ? field.value.slice(0, 90) + "…"
                      : field.value}
                  </span>
                )}
              </div>
            </div>
            <div className="flex gap-2">
              <button
                type="button"
                onClick={() => insertField(field.path)}
                className="inline-flex items-center gap-1.5 rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-ground hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
              >
                <L.TextCursorInput size={14} /> Insert
              </button>
              <button
                type="button"
                onClick={copy}
                className="inline-flex items-center gap-1.5 rounded-md border border-line bg-raise px-3 py-1.5 text-sm text-ink hover:bg-panel focus-visible:outline-2 focus-visible:outline-accent"
              >
                {copied ? <L.Check size={14} /> : <L.Copy size={14} />}{" "}
                {copied ? "Copied" : "Copy"}
              </button>
            </div>
          </div>
        );
      }

      /** Visible rows in order: sections, top-level rows, and sub-fields of expanded (or matching) lists. */
      function E_visibleRows(q, expanded) {
        const t = q.trim().toLowerCase();
        const hit = (f) =>
          `${f.label} ${f.path} ${f.value}`.toLowerCase().includes(t);
        const out = [];
        for (const s of SECTIONS) {
          const rows = [];
          for (const r of s.rows) {
            const kids = (r.children ?? []).map((c) => ({
              ...c,
              section: s.label,
              parent: r.path,
            }));
            const kidHits = t
              ? kids.filter(hit)
              : expanded.has(r.path)
                ? kids
                : [];
            if (t && !hit(r) && kidHits.length === 0) continue;
            rows.push({ ...r, section: s.label });
            rows.push(...kidHits);
          }
          if (rows.length) out.push({ section: s, rows });
        }
        return out;
      }

      /** The "Item data" inspector: search, then sections of compact rows. Owns selection and the flyout. */
      function E_Inspector({ flyout, onClose, sheetRef }) {
        const [q, setQ] = useState("");
        const [expanded, setExpanded] = useState(() => new Set());
        const [sel, setSel] = useState(null);
        const [cardTop, setCardTop] = useState(0);
        const inputRef = useRef(null);
        const listRef = useRef(null);
        const cardRef = useRef(null);
        const rowRefs = useRef({});

        const groups = useMemo(() => E_visibleRows(q, expanded), [q, expanded]);
        const flat = groups.flatMap((g) => g.rows);
        const cur = flat.find((f) => f.path === sel) ?? null;

        useEffect(() => {
          inputRef.current?.focus();
        }, []);
        useEffect(() => {
          if (sel && !flat.some((f) => f.path === sel)) setSel(null);
        }, [q]);

        // Place the flyout beside the selected row, kept inside the sheet's height.
        const place = useCallback(() => {
          if (!flyout || !cur) return;
          const row = rowRefs.current[cur.path],
            host = sheetRef.current;
          if (!row || !host) return;
          const top =
            row.getBoundingClientRect().top - host.getBoundingClientRect().top;
          const h = cardRef.current?.offsetHeight ?? 260;
          setCardTop(Math.max(8, Math.min(top - 8, host.clientHeight - h - 8)));
        }, [flyout, cur?.path]);
        useLayoutEffect(place, [place]);

        const move = (d) => {
          if (!flat.length) return;
          const i = flat.findIndex((f) => f.path === sel);
          const next =
            flat[
              i < 0
                ? d > 0
                  ? 0
                  : flat.length - 1
                : Math.max(0, Math.min(flat.length - 1, i + d))
            ];
          setSel(next.path);
          rowRefs.current[next.path]?.scrollIntoView({ block: "nearest" });
        };
        const toggle = (path) =>
          setExpanded((s) => {
            const n = new Set(s);
            n.has(path) ? n.delete(path) : n.add(path);
            return n;
          });

        const onKeyDown = (e) => {
          if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            if (sel) setSel(null);
            else onClose();
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            move(1);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            move(-1);
          } else if (
            e.key === "Enter" &&
            cur &&
            e.target === inputRef.current
          ) {
            e.preventDefault();
            insertField(cur.path);
          } else if (
            (e.key === "ArrowRight" || e.key === "ArrowLeft") &&
            cur?.children &&
            e.target === inputRef.current &&
            !q
          ) {
            if ((e.key === "ArrowRight") !== expanded.has(cur.path)) {
              e.preventDefault();
              toggle(cur.path);
            }
          }
        };

        return (
          <div
            className="flex min-h-0 flex-1 flex-col"
            onKeyDown={onKeyDown}
            onMouseLeave={() => flyout && setSel(null)}
          >
            <div className="flex shrink-0 items-center gap-2 border-b border-line px-3 py-2">
              <L.Search size={14} className="shrink-0 text-muted" />
              <input
                ref={inputRef}
                value={q}
                onChange={(e) => setQ(e.target.value)}
                placeholder="Search fields"
                role="combobox"
                aria-expanded="true"
                aria-controls="e-list"
                aria-activedescendant={cur ? `e-opt-${cur.path}` : undefined}
                className="min-w-0 flex-1 bg-transparent text-sm text-ink outline-none placeholder:text-faint"
              />
              {q && (
                <IconButton
                  icon={L.X}
                  label="Clear search"
                  onClick={() => {
                    setQ("");
                    inputRef.current?.focus();
                  }}
                />
              )}
            </div>

            <div
              ref={listRef}
              onScroll={place}
              id="e-list"
              role="listbox"
              aria-label="Fields"
              className="min-h-0 flex-1 overflow-auto px-1.5 pb-3"
            >
              {groups.length === 0 && (
                <div className="px-3 py-6 text-center text-sm text-muted">
                  No fields match “{q}”.
                </div>
              )}
              {groups.map(({ section, rows }) => (
                <div key={section.id} role="group" aria-label={section.label}>
                  <div className="sticky top-0 z-[1] bg-panel px-2 pt-3 pb-1 text-xs font-medium text-muted">
                    {section.label}
                  </div>
                  {rows.map((f) => {
                    const active = cur?.path === f.path;
                    const isOpen = expanded.has(f.path) || (q && f.children);
                    return (
                      <div key={f.path}>
                        <div
                          ref={(el) => {
                            rowRefs.current[f.path] = el;
                          }}
                          id={`e-opt-${f.path}`}
                          role="option"
                          aria-selected={active}
                          onMouseEnter={() => flyout && setSel(f.path)}
                          onClick={() => {
                            setSel(flyout || !active ? f.path : null);
                            inputRef.current?.focus({ preventScroll: true });
                          }}
                          onDoubleClick={() => insertField(f.path)}
                          className={`group flex h-8 cursor-pointer items-center gap-2 rounded-md pr-1 text-sm ${f.parent ? "pl-6" : "pl-1"} ${active ? "bg-accent-soft" : "hover:bg-ground"}`}
                        >
                          {f.children ? (
                            <button
                              type="button"
                              aria-label={isOpen ? "Collapse" : "Expand"}
                              aria-expanded={!!isOpen}
                              onClick={(e) => {
                                e.stopPropagation();
                                toggle(f.path);
                              }}
                              className="inline-flex size-4 shrink-0 items-center justify-center rounded text-muted hover:text-ink"
                            >
                              <L.ChevronRight
                                size={13}
                                className={`transition-transform motion-reduce:transition-none ${isOpen ? "rotate-90" : ""}`}
                              />
                            </button>
                          ) : (
                            <span className="size-4 shrink-0" />
                          )}
                          <span
                            className={`w-[38%] shrink-0 truncate ${active ? "text-accent" : "text-ink"}`}
                          >
                            <E_Mark text={f.label} q={q} />
                          </span>
                          <span className="flex min-w-0 flex-1 text-[13px]">
                            <E_Value field={f} q={q} />
                          </span>
                          <button
                            type="button"
                            aria-label={`Insert ${f.label}`}
                            title="Insert at the caret"
                            onClick={(e) => {
                              e.stopPropagation();
                              insertField(f.path);
                            }}
                            className={`inline-flex size-6 shrink-0 items-center justify-center rounded text-muted hover:bg-accent hover:text-ground focus-visible:opacity-100 focus-visible:outline-2 focus-visible:outline-accent ${active ? "opacity-100" : "opacity-0 group-hover:opacity-100"}`}
                          >
                            <L.Plus size={14} />
                          </button>
                        </div>
                        {!flyout && active && (
                          <div className="mx-1 mb-1.5 rounded-b-md border border-t-0 border-line bg-ground px-3 py-3">
                            <E_Detail field={f} q={q} inline />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>

            <div className="shrink-0 border-t border-line px-3 py-1.5 text-xs text-muted">
              ↑↓ select · ↵ insert at the caret · esc {sel ? "clear" : "close"}
            </div>

            {flyout && cur && (
              <div
                ref={cardRef}
                role="region"
                aria-label={`${cur.label} details`}
                className="e-fly absolute left-full z-30 ml-2 w-72 rounded-lg border border-line bg-raise p-4 shadow-xl"
                style={{ top: cardTop }}
              >
                <E_Detail field={cur} q={q} />
              </div>
            )}
          </div>
        );
      }

      function VariantE() {
        const width = useViewWidth();
        const narrow = useNarrow();
        const [open, setOpen] = useState(false);
        const [pinned, setPinned] = useState(false);
        const [dockW, setDockW] = useState(320);
        const sheetRef = useRef(null);

        const docked = open && pinned && !narrow;
        const asSheet = open && !docked;
        const autoOpen = pinned && narrow;

        // Pinned + narrow → the pin becomes "auto-open": the sheet opens with the view.
        useEffect(() => {
          if (autoOpen) setOpen(true);
        }, [autoOpen]);

        // Escape closes the floating sheet from anywhere in the view (non-modal, so the editor keeps focus).
        useEffect(() => {
          if (!asSheet) return;
          const onKey = (e) => {
            if (e.key === "Escape" && !e.defaultPrevented) setOpen(false);
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [asSheet]);

        const onResize = (e) => {
          const x0 = e.clientX,
            w0 = dockW;
          const mv = (ev) =>
            setDockW(Math.max(240, Math.min(480, w0 + ev.clientX - x0)));
          const up = () => {
            removeEventListener("pointermove", mv);
            removeEventListener("pointerup", up);
          };
          addEventListener("pointermove", mv);
          addEventListener("pointerup", up);
        };

        const room = width - (docked ? dockW : 0);
        const sideBySide = room >= 896;

        const action = (
          <button
            key="item-data"
            type="button"
            onClick={() => setOpen((o) => !o)}
            aria-expanded={open}
            aria-controls="e-sheet"
            title="Item data"
            aria-label="Item data"
            className={`inline-flex h-7 items-center gap-1.5 rounded-md px-2 text-sm focus-visible:outline-2 focus-visible:outline-accent ${open ? "bg-accent-soft text-accent" : "text-muted hover:bg-panel hover:text-ink"}`}
          >
            <L.TableProperties size={16} strokeWidth={1.75} />
            {!narrow && <span>Item data</span>}
          </button>
        );

        const pinLabel = autoOpen
          ? "Turn off auto-open"
          : pinned
            ? "Unpin"
            : "Pin to side";

        return (
          <Stage title="E — Sheet with a detail flyout">
            <style>{`
              @keyframes e-slide { from { transform: translateX(-100%); } to { transform: none; } }
              @keyframes e-pop { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
              .e-sheet-in { animation: e-slide 150ms ease-out; }
              .e-fly { animation: e-pop 120ms ease-out; }
              @media (prefers-reduced-motion: reduce) { .e-sheet-in, .e-fly { animation: none; } }
            `}</style>
            <ViewHeader actions={action} />
            <div className="relative flex min-h-0 flex-1">
              {open && (
                <aside
                  id="e-sheet"
                  ref={sheetRef}
                  aria-label="Item data"
                  className={`flex min-h-0 flex-col border-r border-line bg-panel ${docked ? "relative z-20 shrink-0" : "e-sheet-in absolute inset-y-0 left-0 z-20 shadow-2xl"}`}
                  style={
                    docked ? { width: dockW } : { width: "min(320px, 88%)" }
                  }
                >
                  <div className="flex h-10 shrink-0 items-center gap-1 border-b border-line pl-3 pr-1.5">
                    <L.TableProperties
                      size={15}
                      className="shrink-0 text-muted"
                    />
                    <span className="min-w-0 flex-1 truncate text-sm font-medium">
                      Item data
                    </span>
                    <IconButton
                      icon={
                        autoOpen ? L.PanelLeftOpen : pinned ? L.PinOff : L.Pin
                      }
                      label={pinLabel}
                      active={pinned}
                      onClick={() => setPinned((p) => !p)}
                    />
                    <IconButton
                      icon={L.X}
                      label="Close"
                      onClick={() => setOpen(false)}
                    />
                  </div>
                  {autoOpen && (
                    <div className="flex shrink-0 gap-2 border-b border-line bg-accent-soft px-3 py-2 text-xs text-ink">
                      <L.Info
                        size={14}
                        className="mt-px shrink-0 text-accent"
                      />
                      <span>
                        Pinned. The view is too narrow to dock this panel, so it
                        opens as a sheet with the view. Widen the view to dock
                        it.
                      </span>
                    </div>
                  )}
                  <E_Inspector
                    flyout={!narrow}
                    onClose={() => setOpen(false)}
                    sheetRef={sheetRef}
                  />
                  {docked && (
                    <div
                      onPointerDown={onResize}
                      title="Drag to resize"
                      className="absolute inset-y-0 -right-1 z-10 w-2 cursor-col-resize hover:bg-accent/30"
                    />
                  )}
                </aside>
              )}

              <div className="flex min-w-0 flex-1 flex-col">
                <ItemRow />
                <TabBar />
                <div
                  className={`flex min-h-0 flex-1 ${sideBySide ? "flex-row" : "flex-col"}`}
                >
                  <SourceEditor
                    className={`min-h-[10rem] flex-1 border-line ${sideBySide ? "border-r" : "border-b"}`}
                  />
                  <NotePreview className="flex-1" />
                </div>
              </div>
            </div>
          </Stage>
        );
      }
      // --- Variant E END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Modal sheet", component: VariantA },
        { key: "B", name: "Editor drives the sheet", component: VariantB },
        { key: "C", name: "Edge rail", component: VariantC },
        {
          key: "D",
          name: "Push or overlay, pin = keep open",
          component: VariantD,
        },
        { key: "E", name: "Sheet + detail flyout", component: VariantE },
      ];

      // Scenario presets — buttons that jump the shared store to a telling state
      // (e.g. "empty inbox", "3 selected"). Leave empty when the design has no such
      // states; otherwise add { label, apply() } entries that mutate the store.
      const SCENARIOS = [
        {
          label: "Wide view (1100)",
          apply: () => setProto({ width: WIDTHS.wide }),
        },
        {
          label: "Narrow view (420)",
          apply: () => setProto({ width: WIDTHS.narrow }),
        },
        {
          label: "Reset template",
          apply: () =>
            setProto({
              source: INITIAL_SOURCE,
              caret: INITIAL_SOURCE.indexOf("\n## Annotations"),
            }),
        },
      ];

      function App() {
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });
        const [pos, setPos] = useState({ right: 16, bottom: 16 });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const onDragStart = (e) => {
          const start = { x: e.clientX, y: e.clientY, ...pos };
          const onMove = (ev) => {
            const dx = ev.clientX - start.x,
              dy = ev.clientY - start.y;
            setPos({
              right: Math.max(8, start.right - dx),
              bottom: Math.max(8, start.bottom - dy),
            });
          };
          const onUp = () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
        };

        const V = VARIANTS[idx];
        return (
          <>
            <V.component />
            <div
              style={{
                position: "fixed",
                right: pos.right,
                bottom: pos.bottom,
                background: "#1e293b",
                color: "#f8fafc",
                borderRadius: "0.75rem",
                padding: "0.75rem",
                display: "flex",
                flexDirection: "column",
                gap: "0.5rem",
                fontSize: "0.875rem",
                zIndex: 9999,
                boxShadow: "0 4px 12px rgba(0,0,0,0.3)",
                minWidth: "9rem",
              }}
            >
              <div
                onPointerDown={onDragStart}
                style={{
                  cursor: "grab",
                  fontSize: "0.75rem",
                  opacity: 0.6,
                  userSelect: "none",
                  textAlign: "center",
                }}
              >
                ⠿ drag
              </div>
              {VARIANTS.map((v, i) => (
                <button
                  key={v.key}
                  onClick={() => setIdx(i)}
                  style={{
                    background: i === idx ? "#334155" : "none",
                    border: "none",
                    color: "inherit",
                    cursor: "pointer",
                    textAlign: "left",
                    padding: "0.375rem 0.5rem",
                    borderRadius: "0.375rem",
                  }}
                >
                  {v.key} — {v.name}
                </button>
              ))}
              {SCENARIOS.length > 0 && (
                <div
                  style={{
                    borderTop: "1px solid #334155",
                    marginTop: "0.25rem",
                    paddingTop: "0.5rem",
                    display: "flex",
                    flexDirection: "column",
                    gap: "0.25rem",
                  }}
                >
                  {SCENARIOS.map((s, i) => (
                    <button
                      key={i}
                      onClick={s.apply}
                      style={{
                        background: "none",
                        border: "1px solid #334155",
                        color: "inherit",
                        cursor: "pointer",
                        textAlign: "left",
                        padding: "0.25rem 0.5rem",
                        borderRadius: "0.375rem",
                        fontSize: "0.75rem",
                      }}
                    >
                      {s.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
