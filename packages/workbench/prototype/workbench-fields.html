<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbench fields</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Typefaces: add the font CDN <link> for the pairing chosen in the design plan. -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      /* The design plan's tokens, exposed to Tailwind as utilities: bg-ground, text-ink,
       text-accent, font-display, ... `inline` keeps the var() reference at the use site,
       so the media-query override below still reaches every utility. */
      @theme inline {
        --color-ground: var(--ground);
        --color-panel: var(--panel);
        --color-raise: var(--raise);
        --color-ink: var(--ink);
        --color-muted: var(--muted);
        --color-faint: var(--faint);
        --color-line: var(--line);
        --color-accent: var(--accent);
        --color-accent-soft: var(--accent-soft);
        --color-value: var(--value);
        --color-desk: var(--desk);
        --font-display: var(--font-display);
        --font-body: var(--font-body);
        --font-mono: var(--font-mono);
      }
    </style>
    <style>
      /* VERDICT round 1 (overall design): the item's data lives in ONE left sheet at every width.
         The reader can pin it to dock as a side panel beside the editor; where the view is too
         narrow to dock, the pinned panel shows as the sheet again. Same edge, same content, same
         entry at every width. (User: today's column-vs-popover switch across widths is
         counterintuitive, and the entry icon carries no meaning.)
         ROUND 2 QUESTION: how does the left sheet behave — modal or not, how it opens, how pin works? */
      /* DESIGN PLAN (utilitarian; the project's own system wins: Obsidian's default theme)
         ground #ffffff view; panel #f6f6f7 secondary panes / popover ground; ink #222222 text;
         muted #6b6b70; faint #a3a3a8; line #e3e3e6 hairlines; accent #7f5af0 Obsidian's interactive
         accent; value #1f7a4d sample values from the item (the video's green values).
         Type: system UI (Obsidian's interface font) for chrome; JetBrains Mono for source + field paths.
         Layout concept: a desk with one Workbench view frame whose width the reader drags (or jumps
         to Wide 1100 / Medium 760 / Narrow 420). Each variant owns the whole view layout inside it.
         DESIGN QUESTION (round 1): one way that works at every width for a reader to (1) inspect what
         data the sample item has and (2) put a field into the note. */
      :root {
        --ground: #ffffff;
        --panel: #f6f6f7;
        --raise: #ffffff;
        --ink: #222222;
        --muted: #6b6b70;
        --faint: #a3a3a8;
        --line: #e3e3e6;
        --accent: #7f5af0;
        --accent-soft: #efeafe;
        --value: #1f7a4d;
        --desk: #dcdce0;
        --font-display:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-body:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1e1e1e;
          --panel: #262626;
          --raise: #2c2c2c;
          --ink: #dadada;
          --muted: #9a9a9f;
          --faint: #6c6c72;
          --line: #363636;
          --accent: #a58bff;
          --accent-soft: #33294f;
          --value: #6cc49a;
          --desk: #111113;
        }
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
          "lucide-react": "https://esm.sh/lucide-react@1?external=react",
          "beautiful-mermaid": "https://esm.sh/beautiful-mermaid@1"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, { useState, useEffect, useMemo } from "react";
      import { createRoot } from "react-dom/client";
      import * as L from "lucide-react"; // every lucide icon as L.Braces, L.Search, ... (Obsidian uses lucide too)
      const { useSyncExternalStore, useRef, useCallback, useLayoutEffect } =
        React;

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // --- Kit ---
      // Shared by every variant: the sample item's data, one module-level store, and the
      // parts of the Workbench view that are NOT under test (header, item row, tabs, source
      // editor, note preview). Variants own the layout and the whole fields experience.

      // The target literature item, grouped the way the Workbench's Fields sections group it.
      // row: { path, label, value, kind?: "text"|"list"|"link"|"empty"|"long", children?: rows }
      const ITEM_LABEL = "Why Most Published Research Findings Are False";
      const SECTIONS = [
        {
          id: "common",
          label: "Common fields",
          rows: [
            { path: "title", label: "Title", value: ITEM_LABEL },
            {
              path: "authors",
              label: "Authors",
              value: "John P. A. Ioannidis",
              kind: "list",
              children: [
                {
                  path: "authors[0].firstName",
                  label: "First name",
                  value: "John P. A.",
                },
                {
                  path: "authors[0].lastName",
                  label: "Last name",
                  value: "Ioannidis",
                },
              ],
            },
            { path: "date", label: "Date", value: "2005" },
            {
              path: "abstract",
              label: "Abstract",
              value:
                "There is increasing concern that most current published research findings are false. The probability that a research claim is true may depend on study power and bias, the number of other studies on the same question, and the ratio of true to no relationships among the relationships probed in each scientific field.",
              kind: "long",
            },
            {
              path: "publicationTitle",
              label: "Published in",
              value: "PLoS Medicine",
            },
            {
              path: "citationKey",
              label: "Citation key",
              value: "ioannidisWhyMost2005",
            },
            { path: "tags", label: "Tags", value: "", kind: "empty" },
            {
              path: "collections",
              label: "Collections",
              value: "Shared key",
              kind: "list",
              children: [
                {
                  path: "collections[0].name",
                  label: "Name",
                  value: "Shared key",
                },
              ],
            },
            {
              path: "backlink",
              label: "Link back to Zotero",
              value: "zotero://select/library/items/IANNP5A2",
              kind: "link",
            },
            {
              path: "attachments",
              label: "Attached files",
              value: "ioannidis-2005.pdf",
              kind: "list",
              children: [
                {
                  path: "attachments[0].filename",
                  label: "File name",
                  value: "ioannidis-2005.pdf",
                },
                {
                  path: "attachments[0].fileLink",
                  label: "File link",
                  value: "[[ioannidis-2005.pdf]]",
                  kind: "link",
                },
              ],
            },
            {
              path: "annotations",
              label: "Annotations",
              value: "3 annotations",
              kind: "list",
              children: [
                {
                  path: "annotations[0].text",
                  label: "Highlighted text",
                  value:
                    "most research findings are false for most research designs",
                },
                {
                  path: "annotations[0].comment",
                  label: "Your comment",
                  value: "Core claim",
                },
                {
                  path: "annotations[0].pageLabel",
                  label: "Page",
                  value: "696",
                },
              ],
            },
          ],
        },
        {
          id: "reference",
          label: "Reference",
          rows: [
            {
              path: "shortTitle",
              label: "Short title",
              value: "",
              kind: "empty",
            },
            {
              path: "authorsShort",
              label: "Short author list",
              value: "Ioannidis",
            },
            {
              path: "creators",
              label: "All creators",
              value: "John P. A. Ioannidis",
              kind: "list",
            },
            {
              path: "primaryCreatorType",
              label: "Primary creator role",
              value: "author",
            },
            { path: "volume", label: "Volume", value: "2" },
            { path: "issue", label: "Issue", value: "8" },
            { path: "pages", label: "Pages", value: "e124" },
            { path: "publisher", label: "Publisher", value: "", kind: "empty" },
            { path: "language", label: "Language", value: "en" },
            { path: "itemType", label: "Item type", value: "journalArticle" },
          ],
        },
        {
          id: "identifiers",
          label: "Identifiers",
          rows: [
            {
              path: "DOI",
              label: "DOI",
              value: "10.1371/journal.pmed.0020124",
            },
            { path: "ISSN", label: "ISSN", value: "1549-1676" },
            {
              path: "url",
              label: "URL",
              value: "https://dx.plos.org/10.1371/journal.pmed.0020124",
              kind: "link",
            },
            { path: "extra", label: "Extra", value: "", kind: "empty" },
          ],
        },
        {
          id: "content",
          label: "Content and files",
          rows: [
            {
              path: "notes",
              label: "Zotero notes",
              value: "1 note",
              kind: "list",
            },
          ],
        },
        {
          id: "organization",
          label: "Organization",
          rows: [
            {
              path: "relatedItems",
              label: "Related items",
              value: "",
              kind: "empty",
            },
          ],
        },
        {
          id: "links",
          label: "Links",
          rows: [
            {
              path: "zoteroWebLink",
              label: "Zotero web link",
              value: "",
              kind: "empty",
            },
            {
              path: "libraryLink",
              label: "Zotero library link",
              value: "obsidian://zotlit/show-in-library?item-key=IANNP5A2",
              kind: "link",
            },
            {
              path: "noteLink",
              label: "Note link",
              value: "[[ioannidisWhyMost2005]]",
              kind: "link",
            },
            {
              path: "notePath",
              label: "Note path",
              value: "literature/ioannidisWhyMost2005.md",
            },
          ],
        },
        {
          id: "record",
          label: "Zotero record",
          rows: [
            { path: "key", label: "Zotero key", value: "IANNP5A2" },
            {
              path: "dateAdded",
              label: "Date added",
              value: "2024-03-02 10:14",
            },
            {
              path: "dateModified",
              label: "Date modified",
              value: "2026-10-30 18:02",
            },
          ],
        },
      ];
      const ALL_FIELDS = SECTIONS.flatMap((s) =>
        s.rows.flatMap((r) => [
          { ...r, section: s.label },
          ...(r.children ?? []).map((c) => ({
            ...c,
            section: s.label,
            parent: r.path,
          })),
        ]),
      );
      const findField = (path) => ALL_FIELDS.find((f) => f.path === path);
      /** Rows matching a search over label, path and sample value. Empty query → all top-level rows. */
      const searchFields = (q) => {
        const t = q.trim().toLowerCase();
        if (!t) return ALL_FIELDS.filter((f) => !f.parent);
        return ALL_FIELDS.filter((f) =>
          `${f.label} ${f.path} ${f.value}`.toLowerCase().includes(t),
        );
      };
      /** The text a field puts into the template. */
      const snippetOf = (path) => `{{ zt.${path} }}`;

      // One module-level store. Flipping variants keeps width, source and caret.
      const WIDTHS = { wide: 1100, medium: 760, narrow: 420 };
      /** Below this the view cannot hold a 240 px field column beside a 360 px editor. */
      const SIDE_BY_SIDE_MIN = 600;
      const INITIAL_SOURCE = `# {{ zt.title }}

[Zotero]({{ zt.backlink }}) {{ zt.attachments | map: "fileLink" | join: " " }}

> {{ zt.abstract }}

## Annotations
`;
      let state = {
        width: WIDTHS.wide,
        source: INITIAL_SOURCE,
        caret: INITIAL_SOURCE.indexOf("\n## Annotations"),
        lastInserted: null,
        insertCount: 0,
      };
      const listeners = new Set();
      const setProto = (patch) => {
        state = {
          ...state,
          ...(typeof patch === "function" ? patch(state) : patch),
        };
        listeners.forEach((l) => l());
      };
      const useProto = () =>
        useSyncExternalStore(
          (l) => (listeners.add(l), () => listeners.delete(l)),
          () => state,
        );
      /** Insert a field at the caret (or replace [from,to) when given), and move the caret after it. */
      const insertField = (path, range) =>
        setProto((s) => {
          const text = snippetOf(path);
          const from = range ? range[0] : s.caret,
            to = range ? range[1] : s.caret;
          return {
            source: s.source.slice(0, from) + text + s.source.slice(to),
            caret: from + text.length,
            lastInserted: path,
            insertCount: s.insertCount + 1,
          };
        });
      const useViewWidth = () => useProto().width;
      const useNarrow = () => useProto().width < SIDE_BY_SIDE_MIN;

      function IconButton({
        icon: Icon,
        label,
        onClick,
        active,
        className = "",
      }) {
        return (
          <button
            type="button"
            aria-label={label}
            title={label}
            aria-pressed={active ?? undefined}
            onClick={onClick}
            className={`inline-flex size-7 items-center justify-center rounded-md text-muted hover:bg-panel hover:text-ink focus-visible:outline-2 focus-visible:outline-accent ${active ? "bg-accent-soft text-accent hover:bg-accent-soft hover:text-accent" : ""} ${className}`}
          >
            <Icon size={16} strokeWidth={1.75} />
          </button>
        );
      }

      /** Obsidian's view header: navigation, breadcrumb, then the view's actions (`actions`, any nodes). */
      function ViewHeader({ actions }) {
        return (
          <div className="flex h-10 shrink-0 items-center gap-1 border-b border-line px-2 text-sm">
            <IconButton icon={L.ArrowLeft} label="Back" />
            <IconButton icon={L.ArrowRight} label="Forward" />
            <div className="min-w-0 flex-1 truncate px-1 text-center text-muted">
              templates / <span className="text-ink">Default · Profile</span>
            </div>
            <div className="flex items-center gap-0.5">
              <IconButton icon={L.Undo2} label="Undo" />
              {actions}
              <IconButton icon={L.Ellipsis} label="More options" />
            </div>
          </div>
        );
      }

      /** The one item row for the whole view: which item the example uses. `children` adds controls at its end. */
      function ItemRow({ children, onTitleClick }) {
        return (
          <div className="flex min-h-9 shrink-0 items-center gap-2 border-b border-line px-3 text-sm">
            <L.BookOpenText size={15} className="shrink-0 text-muted" />
            <button
              type="button"
              onClick={onTitleClick}
              className={`min-w-0 flex-1 truncate text-left ${onTitleClick ? "hover:text-accent" : ""}`}
            >
              <span className="text-muted">Example: </span>
              {ITEM_LABEL}
            </button>
            {children}
            <button
              type="button"
              className="inline-flex shrink-0 items-center gap-1 rounded-md px-2 py-1 text-muted hover:bg-panel hover:text-ink"
            >
              <L.Search size={14} /> Choose item
            </button>
          </div>
        );
      }

      function TabBar() {
        const tabs = [
          "Note",
          "Properties",
          "Annotation",
          "Name and folder",
          "Match",
          "Profile",
        ];
        return (
          <div className="flex shrink-0 gap-1 overflow-x-auto px-3 pt-2 text-sm">
            {tabs.map((t, i) => (
              <span
                key={t}
                className={`shrink-0 rounded-md px-2 py-1 ${i === 0 ? "bg-accent-soft text-accent" : "text-muted"}`}
              >
                {t}
              </span>
            ))}
          </div>
        );
      }

      const escapeHtml = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const highlight = (src) =>
        escapeHtml(src).replace(
          /\{\{[^}]*\}\}/g,
          (m) => `<span style="color:var(--accent)">${m}</span>`,
        ) + "\n";

      /**
       * The template source: a textarea over a highlighted mirror. Keeps the store's caret in sync.
       * Props: `onKeyDown(e, ta)`, `onInput(ta)` hooks for completion-style variants, `taRef` to reach the textarea,
       * `children` drawn over the editor (absolutely positioned popups go here).
       */
      function SourceEditor({
        onKeyDown,
        onInput,
        taRef,
        children,
        className = "",
      }) {
        const { source, caret } = useProto();
        const local = useRef(null);
        const ref = taRef ?? local;
        const mirror = useRef(null);
        useLayoutEffect(() => {
          const ta = ref.current;
          if (ta && document.activeElement !== ta)
            ta.setSelectionRange(caret, caret);
        }, [caret, source]);
        const sync = (ta) => setProto({ caret: ta.selectionStart });
        const style =
          "col-start-1 row-start-1 m-0 w-full whitespace-pre-wrap break-words p-3 font-mono text-[13px] leading-6";
        return (
          <div
            className={`relative min-h-0 overflow-auto ${className}`}
            onScroll={(e) =>
              mirror.current &&
              (mirror.current.scrollTop = e.currentTarget.scrollTop)
            }
          >
            <div className="grid min-h-full">
              <pre
                ref={mirror}
                aria-hidden="true"
                className={`${style} pointer-events-none text-ink`}
                dangerouslySetInnerHTML={{ __html: highlight(source) }}
              />
              <textarea
                ref={ref}
                spellCheck={false}
                value={source}
                aria-label="Template source"
                className={`${style} resize-none overflow-hidden bg-transparent text-transparent caret-ink outline-none`}
                onChange={(e) => {
                  setProto({
                    source: e.target.value,
                    caret: e.target.selectionStart,
                  });
                  onInput?.(e.target);
                }}
                onSelect={(e) => sync(e.target)}
                onClick={(e) => sync(e.target)}
                onKeyDown={(e) => onKeyDown?.(e, e.currentTarget)}
              />
            </div>
            {children}
          </div>
        );
      }

      /** Pixel position of character `index` inside textarea `ta`, relative to the textarea's box. */
      function caretCoords(ta, index) {
        const div = document.createElement("div");
        const cs = getComputedStyle(ta);
        for (const p of [
          "fontFamily",
          "fontSize",
          "lineHeight",
          "padding",
          "border",
          "width",
          "whiteSpace",
          "overflowWrap",
          "wordBreak",
          "letterSpacing",
        ])
          div.style[p] = cs[p];
        div.style.position = "absolute";
        div.style.visibility = "hidden";
        div.style.whiteSpace = "pre-wrap";
        div.textContent = ta.value.slice(0, index);
        const span = document.createElement("span");
        span.textContent = "​";
        div.appendChild(span);
        document.body.appendChild(div);
        const r = {
          left: span.offsetLeft,
          top: span.offsetTop - ta.scrollTop,
          height: parseFloat(cs.lineHeight),
        };
        div.remove();
        return r;
      }

      /** Value for a `{{ zt.path | … }}` expression in the preview (filters ignored). */
      const evalExpr = (expr) => {
        const path = expr
          .replace(/^\s*zt\./, "")
          .split("|")[0]
          .trim();
        const f = findField(path);
        return f ? f.value || "" : `⟨${path}⟩`;
      };

      /** The note the template makes for the sample item. */
      function NotePreview({ className = "" }) {
        const { source } = useProto();
        const out = source.replace(/\{\{([^}]*)\}\}/g, (_, e) => evalExpr(e));
        return (
          <div
            className={`min-h-0 overflow-auto p-5 text-sm leading-6 ${className}`}
          >
            <div className="mb-3 text-xs text-muted">
              Note preview · File name: ioannidisWhyMost2005
            </div>
            {out.split("\n").map((line, i) => {
              if (line.startsWith("## "))
                return (
                  <h3
                    key={i}
                    className="mt-4 mb-1 text-lg font-semibold text-balance"
                  >
                    {line.slice(3)}
                  </h3>
                );
              if (line.startsWith("# "))
                return (
                  <h2 key={i} className="mb-2 text-2xl font-bold text-balance">
                    {line.slice(2)}
                  </h2>
                );
              if (line.startsWith("> "))
                return (
                  <blockquote
                    key={i}
                    className="border-l-2 border-line pl-3 text-muted"
                  >
                    {line.slice(2)}
                  </blockquote>
                );
              if (!line.trim()) return <div key={i} className="h-2" />;
              return (
                <p key={i} className="break-words">
                  {line.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1 ↗")}
                </p>
              );
            })}
          </div>
        );
      }

      /** A short "Inserted …" notice after each insert. Place it once inside the view frame. */
      function InsertToast() {
        const { lastInserted, insertCount } = useProto();
        const [shown, setShown] = useState(false);
        useEffect(() => {
          if (!insertCount) return;
          setShown(true);
          const t = setTimeout(() => setShown(false), 1400);
          return () => clearTimeout(t);
        }, [insertCount]);
        if (!shown || !lastInserted) return null;
        return (
          <div
            role="status"
            className="pointer-events-none absolute top-12 left-1/2 z-50 -translate-x-1/2 rounded-md bg-ink px-3 py-1.5 text-xs text-ground shadow-lg"
          >
            Inserted {findField(lastInserted)?.label ?? lastInserted}
          </div>
        );
      }

      /**
       * The desk: a width bar on top, then one Workbench view frame at the store's width with a drag
       * edge on its right. The frame is `position: relative`, `@container`, and clips overflow, so a
       * variant's popovers and drawers stay inside the view like they would in Obsidian.
       */
      function Stage({ children, title }) {
        const { width } = useProto();
        const onDrag = (e) => {
          const x0 = e.clientX,
            w0 = width;
          const move = (ev) =>
            setProto({
              width: Math.max(
                320,
                Math.min(1400, Math.round(w0 + (ev.clientX - x0))),
              ),
            });
          const up = () => {
            removeEventListener("pointermove", move);
            removeEventListener("pointerup", up);
          };
          addEventListener("pointermove", move);
          addEventListener("pointerup", up);
        };
        return (
          <div className="flex min-h-full flex-col gap-3 bg-desk p-4 font-body text-ink">
            <div className="flex flex-wrap items-center gap-2 text-xs text-muted">
              <span className="font-medium text-ink">{title}</span>
              <span className="mx-1">·</span>
              <span>View width</span>
              {Object.entries(WIDTHS).map(([k, w]) => (
                <button
                  key={k}
                  type="button"
                  onClick={() => setProto({ width: w })}
                  className={`rounded-md px-2 py-0.5 capitalize ${width === w ? "bg-ground text-ink shadow-sm" : "hover:bg-ground/60"}`}
                >
                  {k} {w}
                </button>
              ))}
              <span className="tabular-nums">
                now {width}px {width < SIDE_BY_SIDE_MIN ? "(narrow)" : ""}
              </span>
            </div>
            <div className="flex h-[calc(100vh-4.5rem)] min-h-[520px]">
              <div
                className="@container relative flex flex-col overflow-hidden rounded-lg border border-line bg-ground shadow-sm"
                style={{ width }}
              >
                {children}
                <InsertToast />
              </div>
              <div
                onPointerDown={onDrag}
                title="Drag to resize the view"
                className="flex w-3 cursor-col-resize items-center justify-center"
              >
                <div className="h-10 w-1 rounded-full bg-faint/60" />
              </div>
            </div>
          </div>
        );
      }
      // --- Kit END ---

      // --- App ---
      // --- Variant A ---
      // Variant A — "Modal sheet". Item data is one left sheet at every width.
      // Unpinned: a modal sheet over a dimmed scrim. Scrim click or Escape closes it; an insert closes
      // it and puts focus back in the editor at the new caret (Shift+click / Shift+Enter keeps it open).
      // Pinned (wide view): a docked, non-modal side panel that stays open while you type.
      // Pinned (narrow view): no auto-open; the header action opens it as the modal sheet again.
      const A_PREVIEW_BESIDE_MIN = 896; // 56rem of room for editor + preview
      const A_SHEET_W = 320;

      function A_matches(f, t) {
        return `${f.label} ${f.path} ${f.value}`.toLowerCase().includes(t);
      }

      /** Sections filtered by the query; a parent stays when a child matches (and opens). */
      function A_filter(q) {
        const t = q.trim().toLowerCase();
        if (!t)
          return SECTIONS.map((s) => ({
            ...s,
            rows: s.rows.map((r) => ({
              row: r,
              kids: r.children ?? [],
              forceOpen: false,
            })),
          }));
        return SECTIONS.map((s) => ({
          ...s,
          rows: s.rows.flatMap((r) => {
            const kids = (r.children ?? []).filter((c) => A_matches(c, t));
            if (A_matches(r, t))
              return [
                { row: r, kids: r.children ?? [], forceOpen: kids.length > 0 },
              ];
            if (kids.length) return [{ row: r, kids, forceOpen: true }];
            return [];
          }),
        })).filter((s) => s.rows.length);
      }

      function A_Value({ field, clampable }) {
        if (!field.value)
          return <span className="text-faint italic">Empty</span>;
        const cls = field.kind === "link" ? "break-all" : "break-words";
        return (
          <span
            className={`text-value ${cls} ${clampable ? "line-clamp-2" : ""}`}
          >
            {field.value}
          </span>
        );
      }

      function A_FieldRow({
        field,
        depth = 0,
        expandable,
        open,
        onToggle,
        onInsert,
      }) {
        const [more, setMore] = useState(false);
        const long = (field.value ?? "").length > 90;
        return (
          <div className="group relative rounded-md hover:bg-panel focus-within:bg-panel">
            <div className="flex items-start">
              <div
                className="flex w-5 shrink-0 justify-center pt-2"
                style={{ marginLeft: depth * 14 }}
              >
                {expandable && (
                  <button
                    type="button"
                    onClick={onToggle}
                    aria-expanded={open}
                    aria-label={`${open ? "Collapse" : "Expand"} ${field.label}`}
                    className="rounded text-faint hover:text-ink focus-visible:outline-2 focus-visible:outline-accent"
                  >
                    <L.ChevronRight
                      size={14}
                      className={`transition-transform ${open ? "rotate-90" : ""}`}
                    />
                  </button>
                )}
              </div>
              <button
                type="button"
                data-a-row
                onClick={(e) => onInsert(field.path, e.shiftKey)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") {
                    e.preventDefault();
                    onInsert(field.path, e.shiftKey);
                  }
                }}
                title={`Insert ${snippetOf(field.path)} at the cursor`}
                className="flex min-w-0 flex-1 flex-col gap-0.5 rounded-md py-1.5 pr-16 text-left text-sm outline-none focus-visible:outline-2 focus-visible:outline-accent"
              >
                <span className="text-muted">{field.label}</span>
                <span className="block">
                  <A_Value field={field} clampable={long && !more} />
                </span>
                <span className="block truncate font-mono text-[11px] text-faint">
                  zt.{field.path}
                </span>
              </button>
            </div>
            {long && (
              <button
                type="button"
                onClick={() => setMore((m) => !m)}
                className="mb-1 ml-5 rounded px-1 text-xs text-muted hover:text-accent focus-visible:outline-2 focus-visible:outline-accent"
              >
                {more ? "Show less" : "Show more"}
              </button>
            )}
            <button
              type="button"
              tabIndex={-1}
              aria-hidden="true"
              onClick={(e) => onInsert(field.path, e.shiftKey)}
              className="absolute top-1 right-1 hidden items-center gap-1 rounded-md border border-line bg-raise px-2 py-0.5 text-xs text-ink shadow-sm hover:text-accent group-hover:inline-flex group-focus-within:inline-flex"
            >
              <L.CornerDownLeft size={12} /> Insert
            </button>
          </div>
        );
      }

      function A_ListRow({ entry, onInsert }) {
        const [userOpen, setUserOpen] = useState(false);
        const { row, kids, forceOpen } = entry;
        const expandable = kids.length > 0;
        const open = expandable && (userOpen || forceOpen);
        return (
          <>
            <A_FieldRow
              field={row}
              expandable={expandable}
              open={open}
              onToggle={() => setUserOpen((o) => !o)}
              onInsert={onInsert}
            />
            {open &&
              kids.map((c) => (
                <A_FieldRow
                  key={c.path}
                  field={c}
                  depth={1}
                  onInsert={onInsert}
                />
              ))}
          </>
        );
      }

      /** The Item data inspector: search, then collapsible sections of rows. */
      function A_Inspector({ searchRef, onInsert, hint }) {
        const [q, setQ] = useState("");
        const [closed, setClosed] = useState({});
        const sections = A_filter(q);
        const searching = q.trim() !== "";
        const listRef = useRef(null);

        const onListKey = (e) => {
          const rows = [
            ...(listRef.current?.querySelectorAll("[data-a-row]") ?? []),
          ];
          const i = rows.indexOf(document.activeElement);
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            const n =
              i < 0
                ? 0
                : Math.max(
                    0,
                    Math.min(
                      rows.length - 1,
                      i + (e.key === "ArrowDown" ? 1 : -1),
                    ),
                  );
            rows[n]?.focus();
          } else if (e.key === "Home") {
            e.preventDefault();
            rows[0]?.focus();
          } else if (e.key === "End") {
            e.preventDefault();
            rows.at(-1)?.focus();
          }
        };

        return (
          <div className="flex min-h-0 flex-1 flex-col">
            <div className="shrink-0 border-b border-line px-2 pb-2">
              <label className="flex items-center gap-2 rounded-md border border-line bg-ground px-2 py-1 text-sm focus-within:border-accent">
                <L.Search size={14} className="shrink-0 text-faint" />
                <input
                  ref={searchRef}
                  value={q}
                  onChange={(e) => setQ(e.target.value)}
                  placeholder="Search fields"
                  aria-label="Search fields"
                  className="min-w-0 flex-1 bg-transparent outline-none placeholder:text-faint"
                  onKeyDown={(e) => {
                    if (e.key === "Escape" && q) {
                      e.preventDefault();
                      e.stopPropagation();
                      setQ("");
                    }
                    if (e.key === "ArrowDown") {
                      e.preventDefault();
                      listRef.current?.querySelector("[data-a-row]")?.focus();
                    }
                  }}
                />
                {q && (
                  <button
                    type="button"
                    aria-label="Clear search"
                    onClick={() => setQ("")}
                    className="text-faint hover:text-ink"
                  >
                    <L.X size={14} />
                  </button>
                )}
              </label>
              <p className="mt-1.5 px-1 text-xs text-muted">{hint}</p>
            </div>
            <div
              ref={listRef}
              onKeyDown={onListKey}
              className="min-h-0 flex-1 overflow-auto px-1 pb-4"
            >
              {sections.length === 0 && (
                <p className="p-4 text-sm text-muted">No fields match “{q}”.</p>
              )}
              {sections.map((s) => {
                const isOpen = searching || !closed[s.id];
                return (
                  <section
                    key={s.id}
                    className="border-b border-line last:border-b-0"
                  >
                    <button
                      type="button"
                      aria-expanded={isOpen}
                      onClick={() =>
                        setClosed((c) => ({ ...c, [s.id]: !c[s.id] }))
                      }
                      className="flex w-full items-center gap-1 rounded-md px-1 py-2 text-left text-xs font-semibold text-ink hover:bg-panel focus-visible:outline-2 focus-visible:outline-accent"
                    >
                      <L.ChevronRight
                        size={14}
                        className={`text-faint transition-transform ${isOpen ? "rotate-90" : ""}`}
                      />
                      {s.label}
                      <span className="ml-auto font-normal text-faint tabular-nums">
                        {s.rows.length}
                      </span>
                    </button>
                    {isOpen && (
                      <div className="pb-2">
                        {s.rows.map((e) => (
                          <A_ListRow
                            key={e.row.path}
                            entry={e}
                            onInsert={onInsert}
                          />
                        ))}
                      </div>
                    )}
                  </section>
                );
              })}
            </div>
          </div>
        );
      }

      /** The sheet's own header: title, pin toggle, and (modal only) close. */
      function A_SheetHeader({ docked, pinned, narrow, onPin, onClose }) {
        const pinLabel = narrow
          ? "Widen the view to pin"
          : pinned
            ? "Unpin"
            : "Pin to side";
        const PinIcon = pinned && !narrow ? L.PinOff : L.Pin;
        return (
          <div className="shrink-0 px-2 pt-2 pb-2">
            <div className="flex items-center gap-1">
              <L.TableProperties
                size={15}
                strokeWidth={1.75}
                className="ml-1 text-muted"
              />
              <h2
                id="a-sheet-title"
                className="flex-1 px-1 text-sm font-semibold"
              >
                Item data
              </h2>
              <button
                type="button"
                onClick={onPin}
                disabled={narrow}
                aria-pressed={pinned}
                aria-label={pinLabel}
                title={pinLabel}
                className={`inline-flex size-7 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-40 ${pinned && !narrow ? "bg-accent-soft text-accent" : "text-muted enabled:hover:bg-panel enabled:hover:text-ink"}`}
              >
                <PinIcon size={16} strokeWidth={1.75} />
              </button>
              {!docked && (
                <IconButton icon={L.X} label="Close" onClick={onClose} />
              )}
            </div>
            {narrow && pinned && (
              <p className="mt-0.5 px-1 text-xs text-faint">
                Pinned · shows as a sheet in narrow views
              </p>
            )}
          </div>
        );
      }

      function VariantA() {
        const { width, caret } = useProto();
        const narrow = useNarrow();
        const [open, setOpen] = useState(false); // the modal sheet
        const [pinned, setPinned] = useState(false);
        const [panelW, setPanelW] = useState(A_SHEET_W);
        const docked = pinned && !narrow;
        const modal = open && !docked;

        const taRef = useRef(null);
        const searchRef = useRef(null);
        const sheetRef = useRef(null);
        const triggerRef = useRef(null);
        const returnTo = useRef(null); // "editor" | element | null
        const wasNarrow = useRef(narrow);

        // A pinned panel does not auto-open as a sheet when the view turns narrow.
        useEffect(() => {
          if (narrow && !wasNarrow.current) setOpen(false);
          wasNarrow.current = narrow;
        }, [narrow]);

        // After the sheet closes (or after an insert), move focus where it belongs.
        useEffect(() => {
          const target = returnTo.current;
          if (!target) return;
          returnTo.current = null;
          if (target === "editor") {
            const ta = taRef.current;
            ta?.focus();
            ta?.setSelectionRange(caret, caret);
          } else target.focus?.();
        });

        const openSheet = () => {
          if (docked) {
            searchRef.current?.focus();
            return;
          }
          setOpen(true);
          setTimeout(() => searchRef.current?.focus(), 0);
        };
        const closeSheet = (to) => {
          returnTo.current = to ?? triggerRef.current;
          setOpen(false);
        };

        const onInsert = (path, keepOpen) => {
          insertField(path);
          if (keepOpen) return;
          if (modal) closeSheet("editor");
          else returnTo.current = "editor";
        };

        const onPin = () => {
          if (narrow) return;
          if (pinned) {
            setPinned(false);
            setOpen(true);
          } else {
            setPinned(true);
            setOpen(false);
          }
          setTimeout(() => searchRef.current?.focus(), 0);
        };

        // Modal keyboard: Escape closes, Tab stays inside the sheet.
        const onSheetKey = (e) => {
          if (!modal) return;
          if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            closeSheet();
            return;
          }
          if (e.key === "Tab") {
            const els = [
              ...sheetRef.current.querySelectorAll(
                "button:not([disabled]):not([tabindex='-1']), input",
              ),
            ];
            const first = els[0],
              last = els.at(-1);
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        };

        const onResize = (e) => {
          e.preventDefault();
          const x0 = e.clientX,
            w0 = panelW;
          const move = (ev) =>
            setPanelW(
              Math.max(240, Math.min(480, Math.round(w0 + ev.clientX - x0))),
            );
          const up = () => {
            removeEventListener("pointermove", move);
            removeEventListener("pointerup", up);
          };
          addEventListener("pointermove", move);
          addEventListener("pointerup", up);
        };
        const onResizeKey = (e) => {
          if (e.key === "ArrowLeft") setPanelW((w) => Math.max(240, w - 16));
          if (e.key === "ArrowRight") setPanelW((w) => Math.min(480, w + 16));
        };

        const room = width - (docked ? panelW : 0);
        const previewBeside = room >= A_PREVIEW_BESIDE_MIN;

        const hint = docked
          ? "Select a field to insert it at the cursor."
          : "Select a field to insert it at the cursor. Shift-click to insert several.";

        const action = (
          <button
            key="item-data"
            ref={triggerRef}
            type="button"
            onClick={openSheet}
            aria-haspopup="dialog"
            aria-expanded={modal || docked}
            title="Item data"
            aria-label="Item data"
            className={`inline-flex h-7 items-center gap-1.5 rounded-md px-1.5 text-sm focus-visible:outline-2 focus-visible:outline-accent ${modal || docked ? "bg-accent-soft text-accent" : "text-muted hover:bg-panel hover:text-ink"}`}
          >
            <L.TableProperties size={16} strokeWidth={1.75} />
            {!narrow && <span className="pr-0.5">Item data</span>}
          </button>
        );

        const sheetBody = (
          <>
            <A_SheetHeader
              docked={docked}
              pinned={pinned}
              narrow={narrow}
              onPin={onPin}
              onClose={() => closeSheet()}
            />
            <A_Inspector
              searchRef={searchRef}
              onInsert={onInsert}
              hint={hint}
            />
          </>
        );

        return (
          <Stage title="A · Modal sheet">
            <style>{`
                    @keyframes a-slide { from { transform: translateX(-100%); } }
                    @keyframes a-fade { from { opacity: 0; } }
                    .a-slide { animation: a-slide 150ms ease-out; }
                    .a-fade { animation: a-fade 150ms ease-out; }
                    @media (prefers-reduced-motion: reduce) { .a-slide, .a-fade { animation: none; } }
                  `}</style>
            <ViewHeader actions={action} />
            <div className="relative flex min-h-0 flex-1">
              {docked && (
                <aside
                  aria-label="Item data"
                  className="relative flex shrink-0 flex-col border-r border-line bg-ground"
                  style={{ width: panelW }}
                >
                  {sheetBody}
                  <div
                    role="separator"
                    aria-orientation="vertical"
                    aria-label="Resize item data"
                    aria-valuemin={240}
                    aria-valuemax={480}
                    aria-valuenow={panelW}
                    tabIndex={0}
                    onPointerDown={onResize}
                    onKeyDown={onResizeKey}
                    className="absolute top-0 -right-1 bottom-0 w-2 cursor-col-resize hover:bg-accent/30 focus-visible:bg-accent/40 focus-visible:outline-none"
                  />
                </aside>
              )}
              <div className="flex min-w-0 flex-1 flex-col">
                <ItemRow onTitleClick={openSheet} />
                <TabBar />
                <div
                  className={`flex min-h-0 flex-1 ${previewBeside ? "flex-row" : "flex-col"}`}
                >
                  <SourceEditor taRef={taRef} className="min-h-32 flex-1" />
                  <NotePreview
                    className={
                      previewBeside
                        ? "w-[44%] shrink-0 border-l border-line"
                        : "h-[45%] shrink-0 border-t border-line"
                    }
                  />
                </div>
              </div>
              {modal && (
                <>
                  <div
                    className="a-fade absolute inset-0 z-30 bg-ink/25"
                    onClick={() => closeSheet()}
                    aria-hidden="true"
                  />
                  <div
                    ref={sheetRef}
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="a-sheet-title"
                    onKeyDown={onSheetKey}
                    className="a-slide absolute top-0 bottom-0 left-0 z-40 flex flex-col border-r border-line bg-ground shadow-xl"
                    style={{ width: A_SHEET_W, maxWidth: "88%" }}
                  >
                    {sheetBody}
                  </div>
                </>
              )}
            </div>
          </Stage>
        );
      }
      // --- Variant A END ---

      // --- Variant B ---
      // Variant B (round 2) — "The editor drives the sheet". One left sheet for item data. It is
      // non-modal (no scrim). Typing `{{` in the template (or Ctrl/Cmd+Space) opens it, or uses it when
      // it is already docked; the text typed after `{{` is the sheet's search, live, while the editor
      // keeps focus. Arrows move the highlight, Enter inserts, Escape ends. Pin docks it at the left.

      const B_SHEET_W = 320;
      const B_EDITOR_MIN = 360;
      const B_PREVIEW_BESIDE_MIN = 896;

      /** Rows the inspector shows: sections with expandable list fields, or ranked matches for a query. */
      function B_buildRows(query, expanded) {
        const t = query.trim().toLowerCase();
        if (!t) {
          const out = [];
          for (const s of SECTIONS) {
            out.push({ header: s.label, key: `h:${s.id}` });
            for (const r of s.rows) {
              out.push({
                field: { ...r, section: s.label },
                key: r.path,
                depth: 0,
                hasKids: !!r.children?.length,
              });
              if (expanded.has(r.path))
                for (const c of r.children ?? [])
                  out.push({
                    field: { ...c, section: s.label, parent: r.path },
                    key: c.path,
                    depth: 1,
                  });
            }
          }
          return out;
        }
        const rank = (f) => {
          const l = f.label.toLowerCase();
          if (l.startsWith(t)) return 0;
          if (l.includes(t)) return 1;
          if (f.path.toLowerCase().includes(t)) return 2;
          return 3;
        };
        return searchFields(query)
          .map((f, i) => ({ f, i, r: rank(f) }))
          .sort((a, b) => a.r - b.r || a.i - b.i)
          .map(({ f }) => ({ field: f, key: f.path, depth: 0, flat: true }));
      }

      function B_Kbd({ children }) {
        return (
          <kbd className="rounded border border-line bg-ground px-1 font-body text-[10px] leading-4 text-muted">
            {children}
          </kbd>
        );
      }

      function B_Row({ item, active, open, onToggle, onInsert, onHover }) {
        const f = item.field;
        const ref = useRef(null);
        useLayoutEffect(() => {
          if (active) ref.current?.scrollIntoView({ block: "nearest" });
        }, [active]);
        const parentLabel =
          item.flat && f.parent ? findField(f.parent)?.label : null;
        return (
          <div
            ref={ref}
            role="option"
            aria-selected={active}
            onMouseDown={(e) => e.preventDefault()}
            onClick={onInsert}
            onMouseMove={onHover}
            className={`group relative flex cursor-pointer gap-1 rounded-md py-1.5 pr-2 ${active ? "bg-accent-soft" : "hover:bg-raise"}`}
            style={{ paddingLeft: 4 + item.depth * 16 }}
          >
            <span className="flex h-5 w-4 shrink-0 items-center justify-center self-start">
              {item.hasKids && (
                <button
                  type="button"
                  aria-label={
                    open ? `Collapse ${f.label}` : `Expand ${f.label}`
                  }
                  aria-expanded={open}
                  onMouseDown={(e) => e.preventDefault()}
                  onClick={(e) => {
                    e.stopPropagation();
                    onToggle();
                  }}
                  className="flex rounded text-faint hover:text-ink focus-visible:outline-2 focus-visible:outline-accent"
                >
                  {open ? (
                    <L.ChevronDown size={14} />
                  ) : (
                    <L.ChevronRight size={14} />
                  )}
                </button>
              )}
            </span>
            <div className="min-w-0 flex-1">
              <div className="flex items-baseline gap-2">
                <span
                  className={`min-w-0 truncate text-[13px] font-medium ${active ? "text-accent" : "text-ink"}`}
                >
                  {parentLabel && (
                    <span className="font-normal text-muted">
                      {parentLabel} ›{" "}
                    </span>
                  )}
                  {f.label}
                </span>
                {item.flat && (
                  <span className="ml-auto shrink-0 text-[11px] text-faint">
                    {f.section}
                  </span>
                )}
              </div>
              <div
                className={`line-clamp-2 text-[13px] leading-5 break-words ${f.value ? "text-value" : "italic text-faint"}`}
              >
                {f.value || "Empty for this item"}
              </div>
              <div className="truncate font-mono text-[11px] text-faint">
                zt.{f.path}
              </div>
            </div>
            <button
              type="button"
              onMouseDown={(e) => e.preventDefault()}
              onClick={(e) => {
                e.stopPropagation();
                onInsert();
              }}
              className={`absolute right-1.5 bottom-1.5 items-center gap-1 rounded-md bg-accent px-1.5 py-0.5 text-[11px] text-ground focus-visible:flex focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent ${active ? "flex" : "hidden group-hover:flex"}`}
            >
              <L.CornerDownLeft size={11} /> Insert
            </button>
          </div>
        );
      }

      /** The "Item data" inspector: search, then sections of fields with sample values. */
      function B_Inspector({
        query,
        onQuery,
        session,
        rows,
        picks,
        activeIdx,
        setActive,
        expanded,
        toggle,
        onInsert,
        searchRef,
        onSearchKey,
        onSearchFocus,
      }) {
        return (
          <div className="flex min-h-0 flex-1 flex-col">
            <div className="shrink-0 px-2 pt-2 pb-1">
              <label
                className={`flex h-8 items-center gap-2 rounded-md border px-2 text-[13px] ${session ? "border-accent bg-accent-soft/50" : "border-line bg-ground focus-within:border-accent"}`}
              >
                {session ? (
                  <L.TextCursorInput
                    size={14}
                    className="shrink-0 text-accent"
                  />
                ) : (
                  <L.Search size={14} className="shrink-0 text-muted" />
                )}
                <input
                  ref={searchRef}
                  value={query}
                  onChange={(e) => onQuery(e.target.value)}
                  onKeyDown={onSearchKey}
                  onFocus={onSearchFocus}
                  placeholder={
                    session ? "Type after {{ in the template" : "Search fields"
                  }
                  aria-label="Search fields"
                  className="min-w-0 flex-1 bg-transparent text-ink outline-none placeholder:text-faint"
                />
              </label>
              {session && (
                <div className="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 px-0.5 text-[11px] text-muted">
                  <span>Searching from the template</span>
                  <span className="flex items-center gap-1">
                    <B_Kbd>↑↓</B_Kbd> move <B_Kbd>Enter</B_Kbd> insert{" "}
                    <B_Kbd>Esc</B_Kbd> end
                  </span>
                </div>
              )}
            </div>
            <div
              role="listbox"
              aria-label="Item data fields"
              className="min-h-0 flex-1 overflow-auto px-1.5 pb-3"
            >
              {picks.length === 0 && (
                <div className="px-2 py-4 text-xs text-muted">
                  No field matches "{query.trim()}".
                </div>
              )}
              {rows.map((item) => {
                if (item.header)
                  return (
                    <div
                      key={item.key}
                      className="sticky top-0 z-10 bg-panel px-2 pt-3 pb-1 text-[11px] font-semibold tracking-wide text-muted uppercase"
                    >
                      {item.header}
                    </div>
                  );
                const i = picks.indexOf(item);
                return (
                  <B_Row
                    key={item.key}
                    item={item}
                    active={i === activeIdx}
                    open={expanded.has(item.field.path)}
                    onToggle={() => toggle(item.field.path)}
                    onInsert={() => onInsert(item.field)}
                    onHover={() => i !== activeIdx && setActive(i)}
                  />
                );
              })}
            </div>
          </div>
        );
      }

      function VariantB() {
        const { source, caret, width } = useProto();
        const narrow = useNarrow();
        const taRef = useRef(null);
        const searchRef = useRef(null);

        const [open, setOpen] = useState(false);
        const [pinned, setPinned] = useState(false);
        const [via, setVia] = useState(null); // "header" | "editor"
        const [session, setSession] = useState(null); // { from, lead } while the editor drives the sheet
        const [ownQuery, setOwnQuery] = useState("");
        const [active, setActive] = useState(0);
        const [expanded, setExpanded] = useState(() => new Set());
        const [panelW, setPanelW] = useState(B_SHEET_W);

        const frameW = width - 2;
        const docked = pinned && !narrow && open;
        const asSheet = open && !docked;
        const dockW = Math.max(
          240,
          Math.min(panelW, 480, frameW - B_EDITOR_MIN),
        );
        const mainW = frameW - (docked ? dockW : 0);
        const previewBeside = mainW >= B_PREVIEW_BESIDE_MIN;

        const sessionRaw = session
          ? source.slice(session.from + session.lead, caret)
          : "";
        const query = session ? sessionRaw.trimStart() : ownQuery;
        const rows = useMemo(
          () => B_buildRows(query, expanded),
          [query, expanded],
        );
        const picks = rows.filter((r) => r.field);
        const activeIdx = Math.min(active, Math.max(0, picks.length - 1));
        const activeField = picks[activeIdx]?.field;

        useEffect(() => setActive(0), [query.trim()]);

        // A pinned panel steps aside in a narrow view and docks again when the view widens.
        const prevNarrow = useRef(narrow);
        useEffect(() => {
          if (prevNarrow.current !== narrow && pinned) setOpen(!narrow);
          prevNarrow.current = narrow;
        }, [narrow, pinned]);

        const endSession = (closeSheet) => {
          setSession(null);
          if (closeSheet && via === "editor" && !docked) setOpen(false);
        };

        // The session ends when the caret leaves the typed range or the text stops being a field name.
        useEffect(() => {
          if (!session) return;
          const broke =
            caret < session.from + session.lead ||
            /[\n}]/.test(sessionRaw) ||
            (session.lead &&
              source.slice(session.from, session.from + 2) !== "{{");
          if (broke) endSession(true);
        }, [session, caret, source, sessionRaw]);

        const startSession = (from, lead) => {
          setSession({ from, lead });
          setActive(0);
          if (!open) {
            setOpen(true);
            setVia("editor");
          }
        };

        const focusEditorAt = (c) =>
          requestAnimationFrame(() => {
            const ta = taRef.current;
            if (!ta) return;
            ta.focus();
            ta.setSelectionRange(c, c);
            setProto({ caret: c });
          });

        const insert = (field) => {
          if (!field) return;
          const from = session ? session.from : caret;
          insertField(field.path, session ? [session.from, caret] : undefined);
          const closeAfter = via === "editor" && !docked;
          setSession(null);
          if (closeAfter) setOpen(false);
          focusEditorAt(from + snippetOf(field.path).length);
        };

        const move = (d) =>
          setActive((activeIdx + d + picks.length) % Math.max(1, picks.length));

        const onEditorKey = (e, ta) => {
          if (session) {
            if (e.key === "ArrowDown") {
              e.preventDefault();
              move(1);
              return;
            }
            if (e.key === "ArrowUp") {
              e.preventDefault();
              move(-1);
              return;
            }
            if ((e.key === "Enter" || e.key === "Tab") && activeField) {
              e.preventDefault();
              insert(activeField);
              return;
            }
            if (e.key === "Escape") {
              e.preventDefault();
              endSession(true);
              return;
            }
          }
          if (e.key === " " && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            if (!session) startSession(ta.selectionStart, 0);
          }
        };

        const onEditorInput = (ta) => {
          const c = ta.selectionStart;
          if (
            !session &&
            ta.value.slice(c - 2, c) === "{{" &&
            ta.value[c - 3] !== "{"
          )
            startSession(c - 2, 2);
        };

        const onSearchKey = (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            move(1);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            move(-1);
          } else if (e.key === "Enter" && activeField) {
            e.preventDefault();
            insert(activeField);
          }
        };
        // Clicking into the search takes the query over from the template.
        const onSearchFocus = () => {
          if (!session) return;
          setOwnQuery(sessionRaw.trim());
          setSession(null);
          setVia("header");
        };

        const onHeaderAction = () => {
          if (open) {
            setOpen(false);
            setSession(null);
            return;
          }
          setOpen(true);
          setVia("header");
          requestAnimationFrame(() => searchRef.current?.focus());
        };
        const close = () => {
          setOpen(false);
          setSession(null);
        };
        const onPanelKey = (e) => {
          if (e.key !== "Escape") return;
          e.preventDefault();
          if (docked) focusEditorAt(caret);
          else {
            close();
            focusEditorAt(caret);
          }
        };

        const toggle = (path) =>
          setExpanded((s) => {
            const n = new Set(s);
            n.has(path) ? n.delete(path) : n.add(path);
            return n;
          });

        const onResize = (e) => {
          e.preventDefault();
          const x0 = e.clientX,
            w0 = dockW;
          const mv = (ev) =>
            setPanelW(Math.max(240, Math.min(480, w0 + ev.clientX - x0)));
          const up = () => {
            removeEventListener("pointermove", mv);
            removeEventListener("pointerup", up);
          };
          addEventListener("pointermove", mv);
          addEventListener("pointerup", up);
        };

        const panel = (
          <div
            onKeyDown={onPanelKey}
            role="complementary"
            aria-label="Item data"
            className={`flex min-h-0 flex-col bg-panel ${docked ? "relative shrink-0 border-r border-line" : "b-sheet absolute inset-y-0 left-0 z-30 border-r border-line shadow-2xl"}`}
            style={
              docked ? { width: dockW } : { width: B_SHEET_W, maxWidth: "88%" }
            }
          >
            <div className="flex h-10 shrink-0 items-center gap-1 border-b border-line pr-1 pl-3">
              <L.TableProperties size={15} className="shrink-0 text-muted" />
              <div className="min-w-0 flex-1">
                <div className="truncate text-[13px] font-semibold">
                  Item data
                </div>
                {pinned && narrow && (
                  <div className="truncate text-[11px] leading-3 text-muted">
                    Pinned · docks again in a wider view
                  </div>
                )}
              </div>
              <IconButton
                icon={pinned ? L.PinOff : L.Pin}
                label={pinned ? "Unpin" : "Pin to side"}
                active={pinned}
                onClick={() => {
                  setPinned(!pinned);
                  setVia("header");
                }}
              />
              <IconButton
                icon={L.X}
                label="Close"
                onClick={() => {
                  close();
                  focusEditorAt(caret);
                }}
              />
            </div>
            <B_Inspector
              query={query}
              onQuery={setOwnQuery}
              session={session}
              rows={rows}
              picks={picks}
              activeIdx={activeIdx}
              setActive={setActive}
              expanded={expanded}
              toggle={toggle}
              onInsert={insert}
              searchRef={searchRef}
              onSearchKey={onSearchKey}
              onSearchFocus={onSearchFocus}
            />
            {docked && (
              <div
                onPointerDown={onResize}
                title="Drag to resize"
                role="separator"
                aria-orientation="vertical"
                className="absolute inset-y-0 -right-1 z-10 w-2 cursor-col-resize hover:bg-accent/30"
              />
            )}
          </div>
        );

        return (
          <Stage title="B · The editor drives the sheet">
            <style>{`@keyframes b-slide{from{transform:translateX(-100%)}to{transform:none}}
              .b-sheet{animation:b-slide 150ms ease-out}
              @media (prefers-reduced-motion: reduce){.b-sheet{animation:none}}`}</style>
            <ViewHeader
              actions={
                <button
                  type="button"
                  onClick={onHeaderAction}
                  aria-pressed={open}
                  aria-label="Item data"
                  title="Item data"
                  className={`inline-flex h-7 items-center gap-1.5 rounded-md px-1.5 text-[13px] focus-visible:outline-2 focus-visible:outline-accent ${open ? "bg-accent-soft text-accent" : "text-muted hover:bg-panel hover:text-ink"}`}
                >
                  <L.TableProperties size={16} strokeWidth={1.75} />
                  {!narrow && <span>Item data</span>}
                </button>
              }
            />
            <div className="relative flex min-h-0 flex-1">
              {docked && panel}
              <div className="flex min-h-0 min-w-0 flex-1 flex-col">
                <ItemRow />
                <TabBar />
                <div
                  className={`mt-2 flex min-h-0 flex-1 border-t border-line ${previewBeside ? "flex-row" : "flex-col"}`}
                >
                  <div className="flex min-h-0 min-w-0 flex-1 flex-col">
                    <div className="flex h-8 shrink-0 items-center gap-2 px-3 text-[11px] text-faint">
                      <span className="truncate">
                        Type{" "}
                        <span className="font-mono text-muted">{"{{"}</span> or
                        press <B_Kbd>Ctrl</B_Kbd> <B_Kbd>Space</B_Kbd> to insert
                        a field
                      </span>
                    </div>
                    <SourceEditor
                      className="flex-1"
                      taRef={taRef}
                      onKeyDown={onEditorKey}
                      onInput={onEditorInput}
                    />
                  </div>
                  <NotePreview
                    className={`flex-1 bg-panel/40 ${previewBeside ? "border-l border-line" : "border-t border-line"}`}
                  />
                </div>
              </div>
              {asSheet && panel}
            </div>
          </Stage>
        );
      }
      // --- Variant B END ---

      // --- Variant C ---
      // Variant C — "Edge rail". A 32 px rail runs down the view's left edge under the header at every
      // width: the "Item data" icon, the vertical label, and one jump icon per section. A click slides
      // the Item data sheet out next to the rail and scrolls it to that section. The sheet is
      // non-modal; a click in the editor closes it unless it is pinned. Pinned + wide: it docks between
      // the rail and the editor and the rail stays as jump links. Pinned + narrow: it acts as a sheet,
      // and a dot on the rail shows that it is pinned. There is no header action: the rail is the entry.

      const C_RAIL = 32;
      const C_SHEET_W = 320;
      const C_DOCK_MIN = 240;
      const C_DOCK_MAX = 480;
      const C_STACK_MIN = 896; // editor + preview side by side from this width

      const C_SECTION_ICONS = {
        common: L.LayoutList,
        reference: L.BookMarked,
        identifiers: L.Fingerprint,
        content: L.Paperclip,
        organization: L.FolderTree,
        links: L.Link,
        record: L.Database,
      };

      const C_STYLE = `
      @keyframes c-slide-in { from { transform: translateX(-100%); } to { transform: translateX(0); } }
      .c-slide { animation: c-slide-in 150ms ease-out; }
      @media (prefers-reduced-motion: reduce) { .c-slide { animation: none; } }
      `;

      const C_hit = (f, t) =>
        `${f.label} ${f.path} ${f.value}`.toLowerCase().includes(t);

      /** The rail: entry icon, vertical label, section jump icons. */
      function C_Rail({
        open,
        pinned,
        docked,
        activeSection,
        onOpen,
        onJump,
        entryRef,
      }) {
        return (
          <nav
            aria-label="Item data"
            className="flex shrink-0 flex-col items-center gap-1 border-r border-line bg-panel py-2"
            style={{ width: C_RAIL }}
          >
            <button
              ref={entryRef}
              type="button"
              onClick={onOpen}
              aria-expanded={open}
              aria-controls="c-sheet"
              title={
                docked
                  ? "Item data (pinned)"
                  : open
                    ? "Close item data"
                    : "Open item data"
              }
              className={`group flex flex-col items-center gap-2 rounded-md px-1 py-1.5 focus-visible:outline-2 focus-visible:outline-accent ${open ? "bg-accent-soft text-accent" : "text-muted hover:bg-ground hover:text-ink"}`}
            >
              <span className="relative">
                <L.TableProperties size={16} strokeWidth={1.75} />
                {pinned && (
                  <span
                    aria-label="Pinned"
                    className="absolute -top-1 -right-1 size-2 rounded-full bg-accent ring-2 ring-panel"
                  />
                )}
              </span>
              <span className="text-xs font-medium tracking-wide [writing-mode:vertical-rl] rotate-180 select-none">
                Item data
              </span>
            </button>
            <div className="my-1 h-px w-4 bg-line" />
            {SECTIONS.map((s) => {
              const Icon = C_SECTION_ICONS[s.id] ?? L.Circle;
              const on = open && activeSection === s.id;
              return (
                <button
                  key={s.id}
                  type="button"
                  onClick={() => onJump(s.id)}
                  aria-label={s.label}
                  title={s.label}
                  className={`inline-flex size-6 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-accent ${on ? "text-accent" : "text-faint hover:bg-ground hover:text-ink"}`}
                >
                  <Icon size={14} strokeWidth={1.75} />
                </button>
              );
            })}
          </nav>
        );
      }

      /** One field row: the main button inserts; a list row has a chevron for its sub-fields. */
      function C_Row({ field, depth = 0, expandable, expanded, onToggle }) {
        const empty = field.kind === "empty" || !field.value;
        return (
          <div
            className="group relative flex items-start"
            style={{ paddingLeft: depth * 14 }}
          >
            <span className="flex w-5 shrink-0 justify-center pt-2">
              {expandable && (
                <button
                  type="button"
                  onClick={onToggle}
                  aria-expanded={expanded}
                  aria-label={`${expanded ? "Hide" : "Show"} ${field.label} sub-fields`}
                  className="rounded-sm text-faint hover:text-ink focus-visible:outline-2 focus-visible:outline-accent"
                >
                  {expanded ? (
                    <L.ChevronDown size={14} />
                  ) : (
                    <L.ChevronRight size={14} />
                  )}
                </button>
              )}
            </span>
            <button
              type="button"
              data-c-row=""
              onClick={() => insertField(field.path)}
              title={`Insert ${field.label} at the cursor`}
              className="flex min-w-0 flex-1 flex-col gap-0.5 rounded-md px-2 py-1.5 text-left hover:bg-ground focus-visible:bg-ground focus-visible:outline-2 focus-visible:outline-accent"
            >
              <span className="flex items-center gap-2">
                <span className="min-w-0 flex-1 truncate text-xs text-muted">
                  {field.label}
                </span>
                <span className="inline-flex shrink-0 items-center gap-0.5 rounded-sm bg-accent-soft px-1.5 text-xs text-accent opacity-0 group-hover:opacity-100 group-focus-within:opacity-100">
                  <L.Plus size={12} /> Insert
                </span>
              </span>
              <span
                className={`line-clamp-2 text-[13px] leading-5 break-words ${empty ? "text-faint italic" : "text-value"}`}
              >
                {empty ? "Empty for this item" : field.value}
              </span>
              <span className="truncate font-mono text-[11px] text-faint">
                zt.{field.path}
              </span>
            </button>
          </div>
        );
      }

      /** The Item data inspector: search, then sections of rows. Scrolls to `jump.id` when it changes. */
      function C_Inspector({ jump, onSection, searchRef }) {
        const [query, setQuery] = useState("");
        const [expanded, setExpanded] = useState({});
        const scroller = useRef(null);
        const t = query.trim().toLowerCase();

        useLayoutEffect(() => {
          const box = scroller.current;
          const el = box?.querySelector(`[data-c-section="${jump.id}"]`);
          if (box && el) box.scrollTop = el.offsetTop;
        }, [jump]);

        const onScroll = () => {
          const box = scroller.current;
          if (box.scrollTop + box.clientHeight >= box.scrollHeight - 2) return; // keep the jumped-to section at the end
          const heads = [...box.querySelectorAll("[data-c-section]")];
          let cur = heads[0]?.dataset.cSection;
          for (const h of heads)
            if (h.offsetTop <= box.scrollTop + 8) cur = h.dataset.cSection;
          onSection(cur);
        };

        const onKeyDown = (e) => {
          if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
          const rows = [...scroller.current.querySelectorAll("[data-c-row]")];
          const i = rows.indexOf(document.activeElement);
          if (i < 0) return;
          e.preventDefault();
          const next = rows[i + (e.key === "ArrowDown" ? 1 : -1)];
          if (next) next.focus();
          else if (e.key === "ArrowUp") searchRef.current?.focus();
        };

        const groups = SECTIONS.map((s) => ({
          ...s,
          rows: s.rows
            .map((r) => {
              const kids = (r.children ?? []).filter((c) => !t || C_hit(c, t));
              const self = !t || C_hit(r, t);
              return self || kids.length
                ? { row: r, kids: t ? kids : (r.children ?? []) }
                : null;
            })
            .filter(Boolean),
        })).filter((g) => g.rows.length);

        return (
          <div className="flex min-h-0 flex-1 flex-col">
            <div className="shrink-0 px-3 pb-2">
              <label className="flex items-center gap-1.5 rounded-md border border-line bg-ground px-2 py-1 focus-within:border-accent">
                <L.Search size={14} className="shrink-0 text-faint" />
                <input
                  ref={searchRef}
                  type="search"
                  value={query}
                  placeholder="Search fields"
                  aria-label="Search fields"
                  onChange={(e) => setQuery(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "ArrowDown") {
                      e.preventDefault();
                      scroller.current.querySelector("[data-c-row]")?.focus();
                    }
                    if (e.key === "Enter") {
                      const g = groups[0];
                      if (g) {
                        e.preventDefault();
                        insertField(
