<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbench fields</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Typefaces: add the font CDN <link> for the pairing chosen in the design plan. -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      /* The design plan's tokens, exposed to Tailwind as utilities: bg-ground, text-ink,
       text-accent, font-display, ... `inline` keeps the var() reference at the use site,
       so the media-query override below still reaches every utility. */
      @theme inline {
        --color-ground: var(--ground);
        --color-panel: var(--panel);
        --color-raise: var(--raise);
        --color-ink: var(--ink);
        --color-muted: var(--muted);
        --color-faint: var(--faint);
        --color-line: var(--line);
        --color-accent: var(--accent);
        --color-accent-soft: var(--accent-soft);
        --color-value: var(--value);
        --color-desk: var(--desk);
        --font-display: var(--font-display);
        --font-body: var(--font-body);
        --font-mono: var(--font-mono);
      }
    </style>
    <style>
      /* VERDICT round 1 (overall design): the item's data lives in ONE left sheet at every width.
         The reader can pin it to dock as a side panel beside the editor; where the view is too
         narrow to dock, the pinned panel shows as the sheet again. Same edge, same content, same
         entry at every width. (User: today's column-vs-popover switch across widths is
         counterintuitive, and the entry icon carries no meaning.)
         ROUND 2 QUESTION: how does the left sheet behave — modal or not, how it opens, how pin works? */
      /* VERDICT round 2 (sheet behaviour): merge A's behaviour with E's rows. Unpinned, the sheet is
         modal over a scrim; an insert closes it and returns focus to the editor at the caret
         (Shift+click / Shift+Enter keeps it open). Pinned in a wide view, it docks as a non-modal,
         resizable panel. Pinned in a narrow view, the pin is disabled ("Widen the view to pin") and
         the sheet opens as the modal sheet. Rows are compact (label + one-line value); hover or ↑/↓
         shows the full detail: a flyout to the right when wide, inline under the row when narrow.
         VERDICT round 3 (section navigation): sticky section headers that carry the section icon
         and count. No separate section nav and no jump menu. (User: "D, no need menu to jump to
         diff group".) The merged sheet is the `// --- Merged ---` region (M_*).
         ROUND 4 QUESTION: which icon and label name the entry action and the sheet? */
      /* VERDICT round 4 (entry): lucide `braces` with the name "Fields", for the view-header action
         (icon + tooltip in Obsidian) and the sheet title. (User: "use B".)
         FINAL: this file is trimmed to that winner; it is the visual reference for #1952.
         AMENDMENT (after round 4): field details open only on an explicit request — the row's
         Details button (lucide `info`, shown on row hover/focus/highlight) or Ctrl/Cmd+I for the
         highlighted row — never on hover. Wide: a flyout beside the sheet with a close button.
         Narrow: a fixed-height details bar at the sheet's foot with a close button. Hover changes
         no layout. (User: hover in the narrow view caused a large, unexpected layout shift;
         "preview should be explicitly triggered".)
         AMENDMENT 2: a click on a row shows (or hides) its details; the row's Insert button
         (lucide `text-cursor-input`, shown on row hover/focus/highlight) or Enter inserts the field;
         Shift-click on Insert keeps the modal sheet open. Ctrl/Cmd+I still toggles details for the
         highlighted row. (User: "click to show details, button to insert".)
         AMENDMENT 3: each sticky section header is a button that collapses or expands its group
         (chevron + icon + label + count), as in the earlier Fields panel; the sheet header has
         "Collapse all sections" / "Expand all sections"; a search shows every matching group open.
         The Note preview's header row is sticky at the top of the preview.
         AMENDMENT 4: (1) Insert and Copy (row button, details flyout, details bar) close the details
         popover, also in the pinned panel; Copy shows a "Copied …" notice. (2) The keyboard matches
         the mouse: Enter shows/hides the highlighted row's details, Mod+Enter inserts it; no
         Shift+Mod+Enter and no Ctrl/Cmd+I. (3) A view-header action (lucide `eye` / `eye-off`) shows
         or hides the Note preview; hidden, the editor takes the room. (4) A click outside the details
         (and outside their row) hides them. (5) Field rows indent one level inside their group: a
         row's chevron sits under the group's icon; values stay on one line. */
      /* DESIGN PLAN (utilitarian; the project's own system wins: Obsidian's default theme)
         ground #ffffff view; panel #f6f6f7 secondary panes / popover ground; ink #222222 text;
         muted #6b6b70; faint #a3a3a8; line #e3e3e6 hairlines; accent #7f5af0 Obsidian's interactive
         accent; value #1f7a4d sample values from the item (the video's green values).
         Type: system UI (Obsidian's interface font) for chrome; JetBrains Mono for source + field paths.
         Layout concept: a desk with one Workbench view frame whose width the reader drags (or jumps
         to Wide 1100 / Medium 760 / Narrow 420). Each variant owns the whole view layout inside it.
         DESIGN QUESTION (round 1): one way that works at every width for a reader to (1) inspect what
         data the sample item has and (2) put a field into the note. */
      :root {
        --ground: #ffffff;
        --panel: #f6f6f7;
        --raise: #ffffff;
        --ink: #222222;
        --muted: #6b6b70;
        --faint: #a3a3a8;
        --line: #e3e3e6;
        --accent: #7f5af0;
        --accent-soft: #efeafe;
        --value: #1f7a4d;
        --desk: #dcdce0;
        --font-display:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-body:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #1e1e1e;
          --panel: #262626;
          --raise: #2c2c2c;
          --ink: #dadada;
          --muted: #9a9a9f;
          --faint: #6c6c72;
          --line: #363636;
          --accent: #a58bff;
          --accent-soft: #33294f;
          --value: #6cc49a;
          --desk: #111113;
        }
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
          "lucide-react": "https://esm.sh/lucide-react@1?external=react",
          "beautiful-mermaid": "https://esm.sh/beautiful-mermaid@1"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, { useState, useEffect, useMemo } from "react";
      import { createRoot } from "react-dom/client";
      import * as L from "lucide-react"; // every lucide icon as L.Braces, L.Search, ... (Obsidian uses lucide too)
      const { useSyncExternalStore, useRef, useCallback, useLayoutEffect } =
        React;

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // --- Kit ---
      // Shared by every variant: the sample item's data, one module-level store, and the
      // parts of the Workbench view that are NOT under test (header, item row, tabs, source
      // editor, note preview). Variants own the layout and the whole fields experience.

      // The target literature item, grouped the way the Workbench's Fields sections group it.
      // row: { path, label, value, kind?: "text"|"list"|"link"|"empty"|"long", children?: rows }
      const ITEM_LABEL = "Why Most Published Research Findings Are False";
      const SECTIONS = [
        {
          id: "common",
          label: "Common fields",
          rows: [
            { path: "title", label: "Title", value: ITEM_LABEL },
            {
              path: "authors",
              label: "Authors",
              value: "John P. A. Ioannidis",
              kind: "list",
              children: [
                {
                  path: "authors[0].firstName",
                  label: "First name",
                  value: "John P. A.",
                },
                {
                  path: "authors[0].lastName",
                  label: "Last name",
                  value: "Ioannidis",
                },
              ],
            },
            { path: "date", label: "Date", value: "2005" },
            {
              path: "abstract",
              label: "Abstract",
              value:
                "There is increasing concern that most current published research findings are false. The probability that a research claim is true may depend on study power and bias, the number of other studies on the same question, and the ratio of true to no relationships among the relationships probed in each scientific field.",
              kind: "long",
            },
            {
              path: "publicationTitle",
              label: "Published in",
              value: "PLoS Medicine",
            },
            {
              path: "citationKey",
              label: "Citation key",
              value: "ioannidisWhyMost2005",
            },
            { path: "tags", label: "Tags", value: "", kind: "empty" },
            {
              path: "collections",
              label: "Collections",
              value: "Shared key",
              kind: "list",
              children: [
                {
                  path: "collections[0].name",
                  label: "Name",
                  value: "Shared key",
                },
              ],
            },
            {
              path: "backlink",
              label: "Link back to Zotero",
              value: "zotero://select/library/items/IANNP5A2",
              kind: "link",
            },
            {
              path: "attachments",
              label: "Attached files",
              value: "ioannidis-2005.pdf",
              kind: "list",
              children: [
                {
                  path: "attachments[0].filename",
                  label: "File name",
                  value: "ioannidis-2005.pdf",
                },
                {
                  path: "attachments[0].fileLink",
                  label: "File link",
                  value: "[[ioannidis-2005.pdf]]",
                  kind: "link",
                },
              ],
            },
            {
              path: "annotations",
              label: "Annotations",
              value: "3 annotations",
              kind: "list",
              children: [
                {
                  path: "annotations[0].text",
                  label: "Highlighted text",
                  value:
                    "most research findings are false for most research designs",
                },
                {
                  path: "annotations[0].comment",
                  label: "Your comment",
                  value: "Core claim",
                },
                {
                  path: "annotations[0].pageLabel",
                  label: "Page",
                  value: "696",
                },
              ],
            },
          ],
        },
        {
          id: "reference",
          label: "Reference",
          rows: [
            {
              path: "shortTitle",
              label: "Short title",
              value: "",
              kind: "empty",
            },
            {
              path: "authorsShort",
              label: "Short author list",
              value: "Ioannidis",
            },
            {
              path: "creators",
              label: "All creators",
              value: "John P. A. Ioannidis",
              kind: "list",
            },
            {
              path: "primaryCreatorType",
              label: "Primary creator role",
              value: "author",
            },
            { path: "volume", label: "Volume", value: "2" },
            { path: "issue", label: "Issue", value: "8" },
            { path: "pages", label: "Pages", value: "e124" },
            { path: "publisher", label: "Publisher", value: "", kind: "empty" },
            { path: "language", label: "Language", value: "en" },
            { path: "itemType", label: "Item type", value: "journalArticle" },
          ],
        },
        {
          id: "identifiers",
          label: "Identifiers",
          rows: [
            {
              path: "DOI",
              label: "DOI",
              value: "10.1371/journal.pmed.0020124",
            },
            { path: "ISSN", label: "ISSN", value: "1549-1676" },
            {
              path: "url",
              label: "URL",
              value: "https://dx.plos.org/10.1371/journal.pmed.0020124",
              kind: "link",
            },
            { path: "extra", label: "Extra", value: "", kind: "empty" },
          ],
        },
        {
          id: "content",
          label: "Content and files",
          rows: [
            {
              path: "notes",
              label: "Zotero notes",
              value: "1 note",
              kind: "list",
            },
          ],
        },
        {
          id: "organization",
          label: "Organization",
          rows: [
            {
              path: "relatedItems",
              label: "Related items",
              value: "",
              kind: "empty",
            },
          ],
        },
        {
          id: "links",
          label: "Links",
          rows: [
            {
              path: "zoteroWebLink",
              label: "Zotero web link",
              value: "",
              kind: "empty",
            },
            {
              path: "libraryLink",
              label: "Zotero library link",
              value: "obsidian://zotlit/show-in-library?item-key=IANNP5A2",
              kind: "link",
            },
            {
              path: "noteLink",
              label: "Note link",
              value: "[[ioannidisWhyMost2005]]",
              kind: "link",
            },
            {
              path: "notePath",
              label: "Note path",
              value: "literature/ioannidisWhyMost2005.md",
            },
          ],
        },
        {
          id: "record",
          label: "Zotero record",
          rows: [
            { path: "key", label: "Zotero key", value: "IANNP5A2" },
            {
              path: "dateAdded",
              label: "Date added",
              value: "2024-03-02 10:14",
            },
            {
              path: "dateModified",
              label: "Date modified",
              value: "2026-10-30 18:02",
            },
          ],
        },
      ];
      const ALL_FIELDS = SECTIONS.flatMap((s) =>
        s.rows.flatMap((r) => [
          { ...r, section: s.label },
          ...(r.children ?? []).map((c) => ({
            ...c,
            section: s.label,
            parent: r.path,
          })),
        ]),
      );
      const findField = (path) => ALL_FIELDS.find((f) => f.path === path);
      /** Rows matching a search over label, path and sample value. Empty query → all top-level rows. */
      const searchFields = (q) => {
        const t = q.trim().toLowerCase();
        if (!t) return ALL_FIELDS.filter((f) => !f.parent);
        return ALL_FIELDS.filter((f) =>
          `${f.label} ${f.path} ${f.value}`.toLowerCase().includes(t),
        );
      };
      /** The text a field puts into the template. */
      const snippetOf = (path) => `{{ zt.${path} }}`;

      // One module-level store. Flipping variants keeps width, source and caret.
      const WIDTHS = { wide: 1100, medium: 760, narrow: 420 };
      /** Below this the view cannot hold a 240 px field column beside a 360 px editor. */
      const SIDE_BY_SIDE_MIN = 600;
      const INITIAL_SOURCE = `# {{ zt.title }}

[Zotero]({{ zt.backlink }}) {{ zt.attachments | map: "fileLink" | join: " " }}

> {{ zt.abstract }}

## Annotations
`;
      let state = {
        width: WIDTHS.wide,
        source: INITIAL_SOURCE,
        caret: INITIAL_SOURCE.indexOf("\n## Annotations"),
        lastInserted: null,
        insertCount: 0,
      };
      const listeners = new Set();
      const setProto = (patch) => {
        state = {
          ...state,
          ...(typeof patch === "function" ? patch(state) : patch),
        };
        listeners.forEach((l) => l());
      };
      const useProto = () =>
        useSyncExternalStore(
          (l) => (listeners.add(l), () => listeners.delete(l)),
          () => state,
        );
      /** Insert a field at the caret (or replace [from,to) when given), and move the caret after it. */
      const insertField = (path, range) =>
        setProto((s) => {
          const text = snippetOf(path);
          const from = range ? range[0] : s.caret,
            to = range ? range[1] : s.caret;
          return {
            source: s.source.slice(0, from) + text + s.source.slice(to),
            caret: from + text.length,
            lastInserted: path,
            toast: null,
            insertCount: s.insertCount + 1,
          };
        });
      const useViewWidth = () => useProto().width;
      const useNarrow = () => useProto().width < SIDE_BY_SIDE_MIN;

      function IconButton({
        icon: Icon,
        label,
        onClick,
        active,
        className = "",
      }) {
        return (
          <button
            type="button"
            aria-label={label}
            title={label}
            aria-pressed={active ?? undefined}
            onClick={onClick}
            className={`inline-flex size-7 items-center justify-center rounded-md text-muted hover:bg-panel hover:text-ink focus-visible:outline-2 focus-visible:outline-accent ${active ? "bg-accent-soft text-accent hover:bg-accent-soft hover:text-accent" : ""} ${className}`}
          >
            <Icon size={16} strokeWidth={1.75} />
          </button>
        );
      }

      /** Obsidian's view header: navigation, breadcrumb, then the view's actions (`actions`, any nodes). */
      function ViewHeader({ actions }) {
        return (
          <div className="flex h-10 shrink-0 items-center gap-1 border-b border-line px-2 text-sm">
            <IconButton icon={L.ArrowLeft} label="Back" />
            <IconButton icon={L.ArrowRight} label="Forward" />
            <div className="min-w-0 flex-1 truncate px-1 text-center text-muted">
              templates / <span className="text-ink">Default · Profile</span>
            </div>
            <div className="flex items-center gap-0.5">
              <IconButton icon={L.Undo2} label="Undo" />
              {actions}
              <IconButton icon={L.Ellipsis} label="More options" />
            </div>
          </div>
        );
      }

      /** The one item row for the whole view: which item the example uses. `children` adds controls at its end. */
      function ItemRow({ children, onTitleClick }) {
        return (
          <div className="flex min-h-9 shrink-0 items-center gap-2 border-b border-line px-3 text-sm">
            <L.BookOpenText size={15} className="shrink-0 text-muted" />
            <button
              type="button"
              onClick={onTitleClick}
              className={`min-w-0 flex-1 truncate text-left ${onTitleClick ? "hover:text-accent" : ""}`}
            >
              <span className="text-muted">Example: </span>
              {ITEM_LABEL}
            </button>
            {children}
            <button
              type="button"
              className="inline-flex shrink-0 items-center gap-1 rounded-md px-2 py-1 text-muted hover:bg-panel hover:text-ink"
            >
              <L.Search size={14} /> Choose item
            </button>
          </div>
        );
      }

      function TabBar() {
        const tabs = [
          "Note",
          "Properties",
          "Annotation",
          "Name and folder",
          "Match",
          "Profile",
        ];
        return (
          <div className="flex shrink-0 gap-1 overflow-x-auto px-3 pt-2 text-sm">
            {tabs.map((t, i) => (
              <span
                key={t}
                className={`shrink-0 rounded-md px-2 py-1 ${i === 0 ? "bg-accent-soft text-accent" : "text-muted"}`}
              >
                {t}
              </span>
            ))}
          </div>
        );
      }

      const escapeHtml = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const highlight = (src) =>
        escapeHtml(src).replace(
          /\{\{[^}]*\}\}/g,
          (m) => `<span style="color:var(--accent)">${m}</span>`,
        ) + "\n";

      /**
       * The template source: a textarea over a highlighted mirror. Keeps the store's caret in sync.
       * Props: `onKeyDown(e, ta)`, `onInput(ta)` hooks for completion-style variants, `taRef` to reach the textarea,
       * `children` drawn over the editor (absolutely positioned popups go here).
       */
      function SourceEditor({
        onKeyDown,
        onInput,
        taRef,
        children,
        className = "",
      }) {
        const { source, caret } = useProto();
        const local = useRef(null);
        const ref = taRef ?? local;
        const mirror = useRef(null);
        useLayoutEffect(() => {
          const ta = ref.current;
          if (ta && document.activeElement !== ta)
            ta.setSelectionRange(caret, caret);
        }, [caret, source]);
        const sync = (ta) => setProto({ caret: ta.selectionStart });
        const style =
          "col-start-1 row-start-1 m-0 w-full whitespace-pre-wrap break-words p-3 font-mono text-[13px] leading-6";
        return (
          <div
            className={`relative min-h-0 overflow-auto ${className}`}
            onScroll={(e) =>
              mirror.current &&
              (mirror.current.scrollTop = e.currentTarget.scrollTop)
            }
          >
            <div className="grid min-h-full">
              <pre
                ref={mirror}
                aria-hidden="true"
                className={`${style} pointer-events-none text-ink`}
                dangerouslySetInnerHTML={{ __html: highlight(source) }}
              />
              <textarea
                ref={ref}
                spellCheck={false}
                value={source}
                aria-label="Template source"
                className={`${style} resize-none overflow-hidden bg-transparent text-transparent caret-ink outline-none`}
                onChange={(e) => {
                  setProto({
                    source: e.target.value,
                    caret: e.target.selectionStart,
                  });
                  onInput?.(e.target);
                }}
                onSelect={(e) => sync(e.target)}
                onClick={(e) => sync(e.target)}
                onKeyDown={(e) => onKeyDown?.(e, e.currentTarget)}
              />
            </div>
            {children}
          </div>
        );
      }

      /** Pixel position of character `index` inside textarea `ta`, relative to the textarea's box. */
      function caretCoords(ta, index) {
        const div = document.createElement("div");
        const cs = getComputedStyle(ta);
        for (const p of [
          "fontFamily",
          "fontSize",
          "lineHeight",
          "padding",
          "border",
          "width",
          "whiteSpace",
          "overflowWrap",
          "wordBreak",
          "letterSpacing",
        ])
          div.style[p] = cs[p];
        div.style.position = "absolute";
        div.style.visibility = "hidden";
        div.style.whiteSpace = "pre-wrap";
        div.textContent = ta.value.slice(0, index);
        const span = document.createElement("span");
        span.textContent = "​";
        div.appendChild(span);
        document.body.appendChild(div);
        const r = {
          left: span.offsetLeft,
          top: span.offsetTop - ta.scrollTop,
          height: parseFloat(cs.lineHeight),
        };
        div.remove();
        return r;
      }

      /** Value for a `{{ zt.path | … }}` expression in the preview (filters ignored). */
      const evalExpr = (expr) => {
        const path = expr
          .replace(/^\s*zt\./, "")
          .split("|")[0]
          .trim();
        const f = findField(path);
        return f ? f.value || "" : `⟨${path}⟩`;
      };

      /** The note the template makes for the sample item. */
      function NotePreview({ className = "" }) {
        const { source } = useProto();
        const out = source.replace(/\{\{([^}]*)\}\}/g, (_, e) => evalExpr(e));
        return (
          <div
            className={`min-h-0 overflow-auto p-5 text-sm leading-6 ${className}`}
          >
            <div className="sticky -top-5 z-10 -mx-5 -mt-5 mb-3 border-b border-line bg-ground/95 px-5 py-2 text-xs text-muted backdrop-blur-sm">
              Note preview · File name: ioannidisWhyMost2005
            </div>
            {out.split("\n").map((line, i) => {
              if (line.startsWith("## "))
                return (
                  <h3
                    key={i}
                    className="mt-4 mb-1 text-lg font-semibold text-balance"
                  >
                    {line.slice(3)}
                  </h3>
                );
              if (line.startsWith("# "))
                return (
                  <h2 key={i} className="mb-2 text-2xl font-bold text-balance">
                    {line.slice(2)}
                  </h2>
                );
              if (line.startsWith("> "))
                return (
                  <blockquote
                    key={i}
                    className="border-l-2 border-line pl-3 text-muted"
                  >
                    {line.slice(2)}
                  </blockquote>
                );
              if (!line.trim()) return <div key={i} className="h-2" />;
              return (
                <p key={i} className="break-words">
                  {line.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1 ↗")}
                </p>
              );
            })}
          </div>
        );
      }

      /** A short "Inserted …" notice after each insert. Place it once inside the view frame. */
      function InsertToast() {
        const { lastInserted, insertCount, toast } = useProto();
        const [shown, setShown] = useState(false);
        useEffect(() => {
          if (!insertCount) return;
          setShown(true);
          const t = setTimeout(() => setShown(false), 1400);
          return () => clearTimeout(t);
        }, [insertCount]);
        if (!shown || !(lastInserted || toast)) return null;
        return (
          <div
            role="status"
            className="pointer-events-none absolute top-12 left-1/2 z-50 -translate-x-1/2 rounded-md bg-ink px-3 py-1.5 text-xs text-ground shadow-lg"
          >
            {lastInserted
              ? `Inserted ${findField(lastInserted)?.label ?? lastInserted}`
              : toast}
          </div>
        );
      }

      /**
       * The desk: a width bar on top, then one Workbench view frame at the store's width with a drag
       * edge on its right. The frame is `position: relative`, `@container`, and clips overflow, so a
       * variant's popovers and drawers stay inside the view like they would in Obsidian.
       */
      function Stage({ children, title }) {
        const { width } = useProto();
        const onDrag = (e) => {
          const x0 = e.clientX,
            w0 = width;
          const move = (ev) =>
            setProto({
              width: Math.max(
                320,
                Math.min(1400, Math.round(w0 + (ev.clientX - x0))),
              ),
            });
          const up = () => {
            removeEventListener("pointermove", move);
            removeEventListener("pointerup", up);
          };
          addEventListener("pointermove", move);
          addEventListener("pointerup", up);
        };
        return (
          <div className="flex min-h-full flex-col gap-3 bg-desk p-4 font-body text-ink">
            <div className="flex flex-wrap items-center gap-2 text-xs text-muted">
              <span className="font-medium text-ink">{title}</span>
              <span className="mx-1">·</span>
              <span>View width</span>
              {Object.entries(WIDTHS).map(([k, w]) => (
                <button
                  key={k}
                  type="button"
                  onClick={() => setProto({ width: w })}
                  className={`rounded-md px-2 py-0.5 capitalize ${width === w ? "bg-ground text-ink shadow-sm" : "hover:bg-ground/60"}`}
                >
                  {k} {w}
                </button>
              ))}
              <span className="tabular-nums">
                now {width}px {width < SIDE_BY_SIDE_MIN ? "(narrow)" : ""}
              </span>
            </div>
            <div className="flex h-[calc(100vh-4.5rem)] min-h-[520px]">
              <div
                className="@container relative flex flex-col overflow-hidden rounded-lg border border-line bg-ground shadow-sm"
                style={{ width }}
              >
                {children}
                <InsertToast />
              </div>
              <div
                onPointerDown={onDrag}
                title="Drag to resize the view"
                className="flex w-3 cursor-col-resize items-center justify-center"
              >
                <div className="h-10 w-1 rounded-full bg-faint/60" />
              </div>
            </div>
          </div>
        );
      }
      // --- Kit END ---

      // --- Merged ---
      // Layout reflow uses Tailwind container queries on the view frame (@container) and on the
      // editor column (@container/main); JS reads the width only for behaviour (pin, modal vs dock, hover delay).
      // Round 3 — one merged design (E's sheet + detail flyout, A's modal behaviour, C's section icons)
      // with five placements of the section icons. All shared code is M_*; each Variant<KEY> picks a `nav`.
      //   rail    — 32 px rail at the view's left edge, always visible; a click opens the sheet at that section.
      //   column  — 36 px icon column inside the sheet's left edge, scroll-spy highlight.
      //   tabs    — icon-only tabs under the search ("All" first); a click filters to that section.
      //   headers — no separate nav; sticky section headers carry the icon and count (no jump menu).
      //   chips   — wrapping icon+label+count chips under the search; a click scrolls, scroll-spy highlight.

      const M_SECTION_ICONS = {
        common: L.LayoutList,
        reference: L.BookMarked,
        identifiers: L.Fingerprint,
        content: L.Paperclip,
        organization: L.FolderTree,
        links: L.Link,
        record: L.Database,
      };
      const M_icon = (id) => M_SECTION_ICONS[id] ?? L.Circle;
      const M_TITLES = {
        rail: "A · Rail",
        column: "B · Icon column",
        tabs: "C · Section tabs",
        headers: "D · Sticky headers",
        chips: "E · Section chips",
      };
      const M_SHEET_W = 320;
      /** The entry action and sheet title (round 4 question). Each round-4 variant passes its own. */
      const M_ENTRY_DEFAULT = { icon: L.TableProperties, label: "Item data" };
      const M_RAIL_W = 32;

      const M_STYLE = `
      @keyframes m-slide { from { transform: translateX(-100%); } }
      @keyframes m-fade { from { opacity: 0; } }
      @keyframes m-pop { from { opacity: 0; transform: translateX(-6px); } }
      .m-slide { animation: m-slide 150ms ease-out; }
      .m-fade { animation: m-fade 150ms ease-out; }
      .m-pop { animation: m-pop 120ms ease-out; }
      @media (prefers-reduced-motion: reduce) { .m-slide, .m-fade, .m-pop { animation: none; } }
      `;

      const M_hit = (f, t) =>
        `${f.label} ${f.path} ${f.value}`.toLowerCase().includes(t);
      const M_isEmpty = (f) => f.kind === "empty" || !f.value;

      /** Text with every case-insensitive match of `q` emphasised. */
      function M_Mark({ text, q }) {
        const t = q.trim();
        if (!t || !text) return text;
        const lower = text.toLowerCase(),
          needle = t.toLowerCase();
        const out = [];
        let i = 0,
          k = 0;
        while (true) {
          const j = lower.indexOf(needle, i);
          if (j < 0) break;
          if (j > i) out.push(text.slice(i, j));
          out.push(
            <mark
              key={k++}
              className="rounded-sm bg-accent-soft px-px font-semibold text-accent"
            >
              {text.slice(j, j + t.length)}
            </mark>,
          );
          i = j + t.length;
        }
        out.push(text.slice(i));
        return out;
      }

      function M_Value({ field, q, full }) {
        if (M_isEmpty(field))
          return <span className="italic text-faint">Empty for this item</span>;
        return (
          <span
            className={`text-value ${full ? "break-words whitespace-pre-wrap" : "truncate"}`}
          >
            <M_Mark text={field.value} q={q} />
          </span>
        );
      }

      /** Sections (optionally one only) with their visible rows: top-level rows plus open or matching sub-fields. */
      function M_groups(q, expanded, only) {
        const t = q.trim().toLowerCase();
        const out = [];
        for (const s of SECTIONS) {
          if (only && only !== s.id) continue;
          const rows = [];
          for (const r of s.rows) {
            const kids = (r.children ?? []).map((c) => ({
              ...c,
              section: s.label,
              parent: r.path,
            }));
            const kidHits = t
              ? kids.filter((c) => M_hit(c, t))
              : expanded.has(r.path)
                ? kids
                : [];
            if (t && !M_hit(r, t) && !kidHits.length) continue;
            rows.push({ ...r, section: s.label });
            rows.push(...kidHits);
          }
          if (rows.length) out.push({ section: s, rows });
        }
        return out;
      }

      /** Field count per section for the current search (top-level rows plus matching sub-fields). */
      function M_counts(q) {
        const c = {};
        for (const g of M_groups(q, new Set(), null))
          c[g.section.id] = g.rows.length;
        return c;
      }

      /** The detail card: full value, path, what the note gets, Insert and Copy. */
      /**
       * Narrow views: the details the reader asked for, in a fixed-height bar at the sheet's foot.
       * Hidden where the flyout shows (≥ 600 px).
       */
      function M_DetailBar({ field, q, onClose, onDone }) {
        const [copied, setCopied] = useState(false);
        useEffect(() => setCopied(false), [field?.path]);
        const copy = () => {
          navigator.clipboard?.writeText(snippetOf(field.path)).catch(() => {});
          onDone?.("Copied " + field.label);
        };
        return (
          <div
            role="region"
            aria-label="Field details"
            aria-live="polite"
            className="h-[6.5rem] shrink-0 overflow-hidden border-t border-line bg-ground px-3 py-2 text-sm @min-[600px]:hidden"
          >
            {
              <div className="flex h-full flex-col gap-1">
                <div className="flex items-baseline gap-2">
                  <span className="truncate font-semibold text-ink">
                    {field.label}
                  </span>
                  <span className="min-w-0 flex-1 truncate text-xs text-faint">
                    {field.section}
                  </span>
                  <IconButton
                    icon={L.X}
                    label="Close details"
                    onClick={onClose}
                    className="-mr-1 size-6"
                  />
                </div>
                <div
                  className="line-clamp-2 min-h-0 leading-5"
                  title={field.value || undefined}
                >
                  {M_isEmpty(field) ? (
                    <span className="italic text-faint">
                      This item has no value here
                    </span>
                  ) : (
                    <M_Value field={field} q={q} full />
                  )}
                </div>
                <div className="mt-auto flex items-center gap-1">
                  <code className="min-w-0 flex-1 truncate font-mono text-xs text-muted">
                    {snippetOf(field.path)}
                  </code>
                  <button
                    type="button"
                    onClick={copy}
                    aria-label="Copy template text"
                    className="inline-flex items-center gap-1 rounded-md px-1.5 py-0.5 text-xs text-muted hover:bg-panel hover:text-ink focus-visible:outline-2 focus-visible:outline-accent"
                  >
                    {copied ? <L.Check size={12} /> : <L.Copy size={12} />}{" "}
                    {copied ? "Copied" : "Copy"}
                  </button>
                </div>
              </div>
            }
          </div>
        );
      }

      function M_Detail({ field, q, inline, onInsert, onDone }) {
        const [copied, setCopied] = useState(false);
        useEffect(() => setCopied(false), [field.path]);
        const parent = field.parent ? findField(field.parent) : null;
        const copy = () => {
          navigator.clipboard?.writeText(snippetOf(field.path)).catch(() => {});
          if (onDone) return onDone("Copied " + field.label);
          setCopied(true);
          setTimeout(() => setCopied(false), 1200);
        };
        const showValue = !inline || (field.value ?? "").length > 30;
        return (
          <div className="flex flex-col gap-3 text-sm">
            {!inline && (
              <div>
                <div className="text-xs text-muted">
                  {field.section}
                  {parent ? ` · ${parent.label}` : ""}
                </div>
                <div className="text-base font-semibold text-ink">
                  {field.label}
                </div>
              </div>
            )}
            {showValue && (
              <div className="max-h-40 overflow-auto rounded-md border border-line bg-ground p-2 leading-6">
                <M_Value field={field} q={q} full />
              </div>
            )}
            <div>
              <div className="mb-0.5 text-xs text-muted">Template path</div>
              <code className="font-mono text-xs break-all text-muted">
                zt.{field.path}
              </code>
            </div>
            <div>
              <div className="mb-0.5 text-xs text-muted">In your note:</div>
              <div className="font-mono text-xs break-all text-accent">
                {snippetOf(field.path)}
              </div>
              <div className="mt-0.5 flex gap-1.5 break-words">
                <L.CornerDownRight
                  size={13}
                  className="mt-0.5 shrink-0 text-faint"
                />
                {M_isEmpty(field) ? (
                  <span className="italic text-faint">
                    Nothing — this item has no value here
                  </span>
                ) : (
                  <span className="text-value">
                    {field.value.length > 90
                      ? field.value.slice(0, 90) + "…"
                      : field.value}
                  </span>
                )}
              </div>
            </div>
            <div className="flex gap-2">
              <button
                type="button"
                onClick={(e) => onInsert(field.path, e.shiftKey)}
                title="Insert at the cursor (Mod+Enter) · Shift-click keeps the sheet open"
                className="inline-flex items-center gap-1.5 rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-ground hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
              >
                <L.TextCursorInput size={14} /> Insert
              </button>
              <button
                type="button"
                onClick={copy}
                className="inline-flex items-center gap-1.5 rounded-md border border-line bg-raise px-3 py-1.5 text-sm text-ink hover:bg-panel focus-visible:outline-2 focus-visible:outline-accent"
              >
                {copied ? <L.Check size={14} /> : <L.Copy size={14} />}{" "}
                {copied ? "Copied" : "Copy"}
              </button>
            </div>
          </div>
        );
      }

      /** "rail": section icons on the view's left edge, visible with the sheet open or closed. */
      function M_Rail({ active, lit, onJump }) {
        return (
          <nav
            aria-label="Item data sections"
            className="flex shrink-0 flex-col items-center gap-1 border-r border-line bg-panel py-2"
            style={{ width: M_RAIL_W }}
          >
            {SECTIONS.map((s) => {
              const Icon = M_icon(s.id);
              const on = lit && active === s.id;
              return (
                <button
                  key={s.id}
                  type="button"
                  onClick={() => onJump(s.id)}
                  aria-label={`Item data: ${s.label}`}
                  title={s.label}
                  className={`inline-flex size-6 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-accent ${on ? "bg-accent-soft text-accent" : "text-faint hover:bg-ground hover:text-ink"}`}
                >
                  <Icon size={14} strokeWidth={1.75} />
                </button>
              );
            })}
          </nav>
        );
      }

      /** "column": a 36 px icon column inside the sheet's left edge. */
      function M_Column({ active, counts, onJump }) {
        return (
          <nav
            aria-label="Sections"
            className="flex w-9 shrink-0 flex-col items-center gap-1 border-r border-line py-2"
          >
            {SECTIONS.map((s) => {
              const Icon = M_icon(s.id);
              const n = counts[s.id] ?? 0;
              return (
                <button
                  key={s.id}
                  type="button"
                  disabled={!n}
                  onClick={() => onJump(s.id)}
                  aria-label={s.label}
                  title={`${s.label} (${n})`}
                  className={`inline-flex size-7 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-accent disabled:opacity-30 ${active === s.id ? "bg-accent-soft text-accent" : "text-muted enabled:hover:bg-ground enabled:hover:text-ink"}`}
                >
                  <Icon size={15} strokeWidth={1.75} />
                </button>
              );
            })}
          </nav>
        );
      }

      /** "tabs": icon-only filter tabs, "All" first, active one underlined. */
      function M_Tabs({ filter, counts, onFilter }) {
        const all = Object.values(counts).reduce((a, b) => a + b, 0);
        const tabs = [
          { id: null, label: "All fields", Icon: L.LayoutGrid, n: all },
          ...SECTIONS.map((s) => ({
            id: s.id,
            label: s.label,
            Icon: M_icon(s.id),
            n: counts[s.id] ?? 0,
          })),
        ];
        return (
          <div
            role="tablist"
            aria-label="Filter by section"
            className="flex shrink-0 justify-between border-b border-line px-2"
          >
            {tabs.map(({ id, label, Icon, n }) => {
              const on = filter === id;
              return (
                <button
                  key={id ?? "all"}
                  type="button"
                  role="tab"
                  aria-selected={on}
                  aria-label={label}
                  title={`${label} (${n})`}
                  disabled={!n && !on}
                  onClick={() => onFilter(id)}
                  className={`relative inline-flex h-8 flex-1 items-center justify-center focus-visible:outline-2 focus-visible:outline-accent disabled:opacity-30 ${on ? "text-accent" : "text-muted enabled:hover:text-ink"}`}
                >
                  <Icon size={15} strokeWidth={1.75} />
                  {on && (
                    <span className="absolute inset-x-1.5 -bottom-px h-0.5 rounded-full bg-accent" />
                  )}
                </button>
              );
            })}
          </div>
        );
      }

      /** "chips": wrapping icon+label+count chips. */
      function M_Chips({ active, counts, onJump }) {
        return (
          <div className="flex shrink-0 flex-wrap gap-1 border-b border-line px-2 pb-2">
            {SECTIONS.map((s) => {
              const Icon = M_icon(s.id);
              const n = counts[s.id] ?? 0;
              const on = active === s.id;
              return (
                <button
                  key={s.id}
                  type="button"
                  disabled={!n}
                  onClick={() => onJump(s.id)}
                  className={`inline-flex items-center gap-1 rounded-full border px-2 py-0.5 text-xs focus-visible:outline-2 focus-visible:outline-accent disabled:opacity-35 ${on ? "border-accent bg-accent-soft text-accent" : "border-line text-muted enabled:hover:text-ink"}`}
                >
                  <Icon size={12} strokeWidth={1.75} /> {s.label}{" "}
                  <span className="tabular-nums opacity-70">{n}</span>
                </button>
              );
            })}
          </div>
        );
      }

      /** "headers": a sticky section header with its icon and count; a click collapses or expands the group. */
      function M_StickyHeader({ section, n, open, onToggle }) {
        const Icon = M_icon(section.id);
        return (
          <div className="sticky top-0 z-10 bg-panel px-1 pt-2 pb-0.5">
            <button
              type="button"
              onClick={onToggle}
              aria-expanded={open}
              title={
                open ? `Collapse ${section.label}` : `Expand ${section.label}`
              }
              className="flex w-full items-center gap-1.5 rounded-md px-1.5 py-1 text-left text-xs font-semibold text-muted hover:bg-ground hover:text-ink focus-visible:outline-2 focus-visible:outline-accent"
            >
              <L.ChevronRight
                size={12}
                className={`shrink-0 text-faint transition-transform motion-reduce:transition-none ${open ? "rotate-90" : ""}`}
              />
              <Icon size={13} strokeWidth={1.75} className="text-accent" />
              {section.label}
              <span className="font-normal text-faint tabular-nums">{n}</span>
            </button>
          </div>
        );
      }

      /**
       * The Item data sheet / docked panel. `mode` is "modal" (over a scrim) or "dock". Hover or ↑/↓
       * selects a row and shows its detail (flyout to the right when wide, inline when narrow); a row
       * click or Enter inserts (Shift keeps a modal sheet open).
       */
      function M_Sheet({
        entry,
        nav,
        mode,
        narrow,
        pinned,
        width,
        onPin,
        onClose,
        onInsert,
        onResize,
        jump,
        onSection,
        searchRef,
      }) {
        const modal = mode === "modal";
        const flyout = !narrow;
        const [q, setQ] = useState("");
        const [expanded, setExpanded] = useState(() => new Set());
        // Collapsed section groups. A search shows every matching group open.
        const [closed, setClosed] = useState(() => new Set());
        const isOpen = (id) => !!q.trim() || !closed.has(id);
        const toggleSection = (id) =>
          setClosed((c) => {
            const n = new Set(c);
            n.has(id) ? n.delete(id) : n.add(id);
            return n;
          });
        const allClosed = closed.size >= SECTIONS.length;
        const toggleAll = () =>
          setClosed(allClosed ? new Set() : new Set(SECTIONS.map((x) => x.id)));
        const [sel, setSel] = useState(null);
        const [filter, setFilter] = useState(null); // tabs only
        const [active, setActive] = useState(jump?.id ?? SECTIONS[0].id);
        const [menuFor, setMenuFor] = useState(null); // headers only
        const [cardTop, setCardTop] = useState(0);
        const rootRef = useRef(null);
        const listRef = useRef(null);
        const cardRef = useRef(null);
        const barRef = useRef(null);
        const rowRefs = useRef({});
        const hoverT = useRef(0);

        const groups = useMemo(
          () => M_groups(q, expanded, nav === "tabs" ? filter : null),
          [q, expanded, filter, nav],
        );
        const counts = useMemo(() => M_counts(q), [q]);
        const flat = groups.flatMap((g) =>
          isOpen(g.section.id) ? g.rows : [],
        );
        const cur = flat.find((f) => f.path === sel) ?? null;
        // Details open only on an explicit request (the row's Details button or Mod+I), never on hover.
        const [detail, setDetail] = useState(null);
        const shown = detail
          ? (flat.find((f) => f.path === detail) ?? findField(detail))
          : null;
        const toggleDetail = (path) =>
          setDetail((d) => (d === path ? null : path));
        // Insert and Copy close the details popover; a modal sheet also closes on insert (see onInsert).
        const act = (path, keepOpen) => {
          setDetail(null);
          onInsert(path, keepOpen);
        };
        const done = (msg) => {
          setDetail(null);
          setProto((st) => ({
            lastInserted: null,
            toast: msg,
            insertCount: st.insertCount + 1,
          }));
        };
        // A click outside the details (and outside the row that opened them) hides them.
        useEffect(() => {
          if (!detail) return;
          const away = (e) => {
            const inside = [
              cardRef.current,
              barRef.current,
              rowRefs.current[detail],
            ].some((el) => el && el.contains(e.target));
            if (!inside) setDetail(null);
          };
          document.addEventListener("pointerdown", away, true);
          return () => document.removeEventListener("pointerdown", away, true);
        }, [detail]);

        useEffect(() => {
          searchRef.current?.focus({ preventScroll: true });
        }, []);
        useEffect(() => {
          setSel(null);
          setDetail(null);
        }, [q, filter]);

        const spy = (id) => {
          setActive(id);
          onSection?.(id);
        };
        const scrollTo = (id) => {
          const box = listRef.current;
          const el = box?.querySelector(`[data-m-section="${id}"]`);
          if (box && el) box.scrollTop = el.offsetTop;
          spy(id);
          setMenuFor(null);
          setSel(null);
        };
        useLayoutEffect(() => {
          if (!jump) return;
          scrollTo(jump.id);
          const r = requestAnimationFrame(() => scrollTo(jump.id)); // again once the browser Tailwind build has styled new rows
          return () => cancelAnimationFrame(r);
        }, [jump?.n]);

        const onScroll = () => {
          const box = listRef.current;
          // The flyout follows its row while the list scrolls.
          if (shown) place();
          let id = groups[0]?.section.id;
          for (const h of box.querySelectorAll("[data-m-section]"))
            if (h.offsetTop <= box.scrollTop + 8) id = h.dataset.mSection;
          if (id && id !== active) spy(id);
        };

        // The flyout sits beside the selected row, kept inside the sheet's height.
        const place = useCallback(() => {
          if (!flyout || !shown) return;
          const row = rowRefs.current[shown.path],
            host = rootRef.current;
          if (!row || !host) return;
          const top =
            row.getBoundingClientRect().top - host.getBoundingClientRect().top;
          const h = cardRef.current?.offsetHeight ?? 260;
          setCardTop(Math.max(8, Math.min(top - 8, host.clientHeight - h - 8)));
        }, [flyout, shown?.path]);
        useLayoutEffect(place, [place]);

        const select = (path, scroll) => {
          setSel(path);
          if (scroll)
            rowRefs.current[path]?.scrollIntoView({ block: "nearest" });
        };
        const move = (d) => {
          if (!flat.length) return;
          const i = flat.findIndex((f) => f.path === sel);
          // With nothing selected, start at the section in view (after a jump, that is the jumped-to one).
          const start = Math.max(
            0,
            flat.findIndex(
              (f) => groups.find((g) => g.section.id === active)?.rows[0] === f,
            ),
          );
          const next =
            flat[
              i < 0
                ? d > 0
                  ? start
                  : flat.length - 1
                : Math.max(0, Math.min(flat.length - 1, i + d))
            ];
          select(next.path, true);
        };
        const toggle = (path) =>
          setExpanded((s) => {
            const n = new Set(s);
            n.has(path) ? n.delete(path) : n.add(path);
            return n;
          });

        const onKeyDown = (e) => {
          if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            if (menuFor) setMenuFor(null);
            else if (detail) setDetail(null);
            else if (q) setQ("");
            else if (modal) onClose();
            else setSel(null);
            return;
          }
          const inSearch = e.target === searchRef.current;
          if (inSearch && e.key === "ArrowDown") {
            e.preventDefault();
            move(1);
          } else if (inSearch && e.key === "ArrowUp") {
            e.preventDefault();
            move(-1);
          } else if (
            inSearch &&
            e.key === "Enter" &&
            cur &&
            (e.metaKey || e.ctrlKey)
          ) {
            e.preventDefault();
            act(cur.path);
          } else if (inSearch && e.key === "Enter" && cur) {
            e.preventDefault();
            toggleDetail(cur.path);
          } else if (
            inSearch &&
            (e.key === "ArrowRight" || e.key === "ArrowLeft") &&
            cur?.children &&
            !q
          ) {
            if ((e.key === "ArrowRight") !== expanded.has(cur.path)) {
              e.preventDefault();
              toggle(cur.path);
            }
          } else if (e.key === "Tab" && modal) {
            const els = [
              ...rootRef.current.querySelectorAll(
                "button:not([disabled]), input, [tabindex='0']",
              ),
            ];
            const first = els[0],
              last = els.at(-1);
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
        };

        const pinLabel = narrow
          ? "Widen the view to pin"
          : pinned
            ? "Unpin"
            : "Pin to side";
        const hint = "Click or Enter: details · Mod+Enter: insert";

        const list = (
          <div
            ref={listRef}
            onScroll={onScroll}
            id="m-list"
            role="listbox"
            aria-label="Fields"
            className="relative min-h-0 flex-1 overflow-auto px-1.5 pb-3"
          >
            {groups.length === 0 && (
              <div className="px-3 py-6 text-center text-sm text-muted">
                No fields match “{q}”.
              </div>
            )}
            {groups.map(({ section, rows }) => (
              <div
                key={section.id}
                data-m-section={section.id}
                role="group"
                aria-label={section.label}
                className="relative"
              >
                {nav === "headers" ? (
                  <M_StickyHeader
                    section={section}
                    n={rows.length}
                    open={isOpen(section.id)}
                    onToggle={() => toggleSection(section.id)}
                  />
                ) : (
                  <div className="sticky top-0 z-10 bg-panel px-2 pt-3 pb-1 text-xs font-medium text-muted">
                    {section.label}
                  </div>
                )}
                {isOpen(section.id) &&
                  rows.map((f) => {
                    const on = cur?.path === f.path;
                    const isOpen = expanded.has(f.path) || (q && f.children);
                    return (
                      <div key={f.path}>
                        <div
                          ref={(el) => {
                            rowRefs.current[f.path] = el;
                          }}
                          id={`m-opt-${f.path}`}
                          role="option"
                          aria-selected={on}
                          onClick={() => {
                            setSel(f.path);
                            toggleDetail(f.path);
                          }}
                          aria-expanded={detail === f.path}
                          title="Show details"
                          className={`group flex h-8 scroll-mt-9 scroll-mb-2 cursor-pointer items-center gap-2 rounded-md pr-1 text-sm pl-7 ${on || detail === f.path ? "bg-accent-soft" : "hover:bg-ground"}`}
                        >
                          {f.children ? (
                            <button
                              type="button"
                              aria-label={`${isOpen ? "Hide" : "Show"} ${f.label} sub-fields`}
                              aria-expanded={!!isOpen}
                              onClick={(e) => {
                                e.stopPropagation();
                                toggle(f.path);
                              }}
                              className="inline-flex size-4 shrink-0 items-center justify-center rounded text-muted hover:text-ink focus-visible:outline-2 focus-visible:outline-accent"
                            >
                              <L.ChevronRight
                                size={13}
                                className={`transition-transform motion-reduce:transition-none ${isOpen ? "rotate-90" : ""}`}
                              />
                            </button>
                          ) : (
                            <span className="size-4 shrink-0" />
                          )}
                          <span
                            className={`w-[40%] shrink-0 truncate ${f.parent ? "pl-4" : ""} ${on ? "text-accent" : "text-ink"}`}
                          >
                            <M_Mark text={f.label} q={q} />
                          </span>
                          <span className="flex min-w-0 flex-1 overflow-hidden whitespace-nowrap text-[13px] [&>*]:truncate">
                            <M_Value field={f} q={q} />
                          </span>
                          <button
                            type="button"
                            aria-label={`Insert ${f.label}`}
                            title={`Insert ${snippetOf(f.path)} at the cursor (Mod+Enter) · Shift-click keeps this open`}
                            onClick={(e) => {
                              e.stopPropagation();
                              act(f.path, e.shiftKey);
                            }}
                            className={`inline-flex size-6 shrink-0 items-center justify-center rounded-md text-accent hover:bg-accent hover:text-ground focus-visible:opacity-100 focus-visible:outline-2 focus-visible:outline-accent ${on || detail === f.path ? "opacity-100" : "opacity-0 group-hover:opacity-100"}`}
                          >
                            <L.TextCursorInput size={14} strokeWidth={1.75} />
                          </button>
                        </div>
                      </div>
                    );
                  })}
              </div>
            ))}
            {/* Room for the last section to scroll to the top, so a jump always lands on its header. */}
            {groups.length > 1 && (
              <div aria-hidden="true" style={{ height: "calc(100% - 6rem)" }} />
            )}
          </div>
        );

        return (
          <aside
            ref={rootRef}
            id="m-sheet"
            aria-label={entry.label}
            onKeyDown={onKeyDown}
            {...(modal ? { role: "dialog", "aria-modal": "true" } : {})}
            className={`flex min-h-0 flex-col border-r border-line bg-panel ${modal ? "m-slide absolute inset-y-0 left-0 z-40 shadow-xl" : "relative z-20 shrink-0"}`}
            style={{ width, maxWidth: modal ? "88%" : undefined }}
          >
            <div className="shrink-0 px-2 pt-2 pb-2">
              <div className="flex items-center gap-1">
                <entry.icon
                  size={15}
                  strokeWidth={1.75}
                  className="ml-1 text-muted"
                />
                <h2 className="flex-1 px-1 text-sm font-semibold">
                  {entry.label}
                </h2>
                <IconButton
                  icon={allClosed ? L.ChevronsUpDown : L.ChevronsDownUp}
                  label={
                    allClosed ? "Expand all sections" : "Collapse all sections"
                  }
                  onClick={toggleAll}
                />
                <button
                  type="button"
                  onClick={onPin}
                  disabled={narrow}
                  aria-pressed={pinned}
                  aria-label={pinLabel}
                  title={pinLabel}
                  className={`inline-flex size-7 items-center justify-center rounded-md focus-visible:outline-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-40 ${pinned && !narrow ? "bg-accent-soft text-accent" : "text-muted enabled:hover:bg-ground enabled:hover:text-ink"}`}
                >
                  {pinned && !narrow ? (
                    <L.PinOff size={16} strokeWidth={1.75} />
                  ) : (
                    <L.Pin size={16} strokeWidth={1.75} />
                  )}
                </button>
                {modal && (
                  <IconButton icon={L.X} label="Close" onClick={onClose} />
                )}
              </div>
              {narrow && pinned && (
                <p className="mt-0.5 px-1 text-xs text-faint">
                  Pinned · shows as a sheet in narrow views
                </p>
              )}
            </div>
            <div className="shrink-0 px-2 pb-2">
              <label className="flex items-center gap-2 rounded-md border border-line bg-ground px-2 py-1 text-sm focus-within:border-accent">
                <L.Search size={14} className="shrink-0 text-faint" />
                <input
                  ref={searchRef}
                  value={q}
                  onChange={(e) => setQ(e.target.value)}
                  placeholder="Search fields"
                  aria-label="Search fields"
                  role="combobox"
                  aria-expanded="true"
                  aria-controls="m-list"
                  aria-activedescendant={cur ? `m-opt-${cur.path}` : undefined}
                  className="min-w-0 flex-1 bg-transparent outline-none placeholder:text-faint"
                />
                {q && (
                  <button
                    type="button"
                    aria-label="Clear search"
                    onClick={() => {
                      setQ("");
                      searchRef.current?.focus();
                    }}
                    className="text-faint hover:text-ink"
                  >
                    <L.X size={14} />
                  </button>
                )}
              </label>
            </div>
            {nav === "tabs" && (
              <M_Tabs
                filter={filter}
                counts={counts}
                onFilter={(id) => {
                  setFilter(id);
                  searchRef.current?.focus();
                }}
              />
            )}
            {nav === "chips" && (
              <M_Chips active={active} counts={counts} onJump={scrollTo} />
            )}
            {nav === "column" ? (
              <div className="flex min-h-0 flex-1 border-t border-line">
                <M_Column active={active} counts={counts} onJump={scrollTo} />
                {list}
              </div>
            ) : (
              list
            )}
            {shown && (
              <div ref={barRef} className="contents">
                <M_DetailBar
                  field={shown}
                  q={q}
                  onClose={() => setDetail(null)}
                  onDone={done}
                />
              </div>
            )}
            <div className="shrink-0 border-t border-line px-3 py-1.5 text-xs text-muted">
              {hint}
            </div>

            {shown && (
              <div
                ref={cardRef}
                role="region"
                aria-label={`${shown.label} details`}
                className="m-pop hidden @min-[600px]:block absolute left-full z-50 ml-2 w-72 rounded-lg border border-line bg-raise p-4 shadow-xl"
                style={{ top: cardTop }}
              >
                <IconButton
                  icon={L.X}
                  label="Close details"
                  onClick={() => setDetail(null)}
                  className="absolute top-2 right-2"
                />
                <M_Detail field={shown} q={q} onInsert={act} onDone={done} />
              </div>
            )}

            {!modal && (
              <div
                role="separator"
                aria-orientation="vertical"
                aria-label="Resize item data"
                tabIndex={0}
                aria-valuemin={240}
                aria-valuemax={480}
                aria-valuenow={width}
                onPointerDown={onResize.drag}
                onKeyDown={onResize.key}
                className="absolute inset-y-0 -right-1 z-30 w-2 cursor-col-resize hover:bg-accent/30 focus-visible:bg-accent/40 focus-visible:outline-none"
              />
            )}
          </aside>
        );
      }

      /** The whole Workbench view with the merged Item data sheet and one placement of the section icons. */
      function M_View({ nav, entry = M_ENTRY_DEFAULT, title }) {
        const narrow = useNarrow();
        const [open, setOpen] = useState(false);
        const [pinned, setPinned] = useState(false);
        const [dockW, setDockW] = useState(nav === "column" ? 356 : M_SHEET_W);
        const [jump, setJump] = useState(null);
        const [section, setSection] = useState(SECTIONS[0].id);
        const docked = pinned && !narrow;
        const modal = open && !docked;
        const taRef = useRef(null);
        const searchRef = useRef(null);
        const triggerRef = useRef(null);
        const wasNarrow = useRef(narrow);

        // A pinned panel does not auto-open as a sheet when the view turns narrow.
        useEffect(() => {
          if (narrow && !wasNarrow.current) setOpen(false);
          wasNarrow.current = narrow;
        }, [narrow]);

        const toEditor = () =>
          requestAnimationFrame(() => {
            const ta = taRef.current;
            if (!ta) return;
            ta.focus();
            ta.setSelectionRange(state.caret, state.caret);
          });
        const openSheet = () => {
          if (docked) {
            searchRef.current?.focus();
            return;
          }
          setOpen(true);
        };
        const close = () => {
          setOpen(false);
          setJump(null);
          requestAnimationFrame(() => triggerRef.current?.focus());
        };
        const jumpTo = (id) => {
          setSection(id);
          setJump((j) => ({ id, n: (j?.n ?? 0) + 1 }));
          openSheet();
        };
        const [previewShown, setPreviewShown] = useState(true);
        const onInsert = (path, keepOpen) => {
          insertField(path);
          if (keepOpen) return;
          if (modal) {
            setOpen(false);
            setJump(null);
          }
          toEditor();
        };
        const onPin = () => {
          if (narrow) return;
          if (pinned) {
            setPinned(false);
            setOpen(true);
          } else {
            setPinned(true);
            setOpen(false);
          }
          setTimeout(() => searchRef.current?.focus(), 0);
        };
        const onResize = {
          drag: (e) => {
            e.preventDefault();
            const x0 = e.clientX,
              w0 = dockW;
            const mv = (ev) =>
              setDockW(
                Math.max(240, Math.min(480, Math.round(w0 + ev.clientX - x0))),
              );
            const up = () => {
              removeEventListener("pointermove", mv);
              removeEventListener("pointerup", up);
            };
            addEventListener("pointermove", mv);
            addEventListener("pointerup", up);
          },
          key: (e) => {
            if (e.key === "ArrowLeft") setDockW((w) => Math.max(240, w - 16));
            if (e.key === "ArrowRight") setDockW((w) => Math.min(480, w + 16));
          },
        };

        const rail = nav === "rail";
        const sheetW = nav === "column" ? 356 : M_SHEET_W;

        const action = (
          <button
            key="item-data"
            ref={triggerRef}
            type="button"
            onClick={openSheet}
            aria-haspopup="dialog"
            aria-expanded={modal || docked}
            title={entry.label}
            aria-label={entry.label}
            className={`inline-flex h-7 items-center gap-1.5 rounded-md px-1.5 text-sm focus-visible:outline-2 focus-visible:outline-accent ${modal || docked ? "bg-accent-soft text-accent" : "text-muted hover:bg-panel hover:text-ink"}`}
          >
            <entry.icon size={16} strokeWidth={1.75} />
            <span className="hidden pr-0.5 @min-[600px]:inline">
              {entry.label}
            </span>
          </button>
        );

        const previewAction = (
          <IconButton
            key="preview"
            icon={previewShown ? L.Eye : L.EyeOff}
            active={previewShown}
            label={previewShown ? "Hide note preview" : "Show note preview"}
            onClick={() => setPreviewShown((v) => !v)}
          />
        );

        const sheetProps = {
          entry,
          nav,
          narrow,
          pinned,
          onPin,
          onClose: close,
          onInsert,
          onResize,
          jump,
          onSection: setSection,
          searchRef,
        };

        return (
          <Stage title={title ?? M_TITLES[nav]}>
            <style>{M_STYLE}</style>
            <ViewHeader
              actions={
                <>
                  {previewAction}
                  {action}
                </>
              }
            />
            <div className="flex min-h-0 flex-1">
              {rail && (
                <M_Rail
                  active={section}
                  lit={modal || docked}
                  onJump={jumpTo}
                />
              )}
              <div className="relative flex min-w-0 flex-1">
                {docked && (
                  <M_Sheet
                    key="dock"
                    mode="dock"
                    width={dockW}
                    {...sheetProps}
                  />
                )}
                <div className="@container/main flex min-w-0 flex-1 flex-col">
                  <ItemRow onTitleClick={openSheet} />
                  <div className="flex min-h-0 flex-1 flex-col @min-[56rem]/main:flex-row">
                    {/* The tabs belong to the editor; the Preview takes the full height beside it. */}
                    <div className="flex min-h-0 min-w-0 flex-1 flex-col">
                      <TabBar />
                      <SourceEditor taRef={taRef} className="min-h-32 flex-1" />
                    </div>
                    {previewShown && (
                      <NotePreview className="h-[45%] shrink-0 border-t border-line @min-[56rem]/main:h-auto @min-[56rem]/main:w-[44%] @min-[56rem]/main:border-t-0 @min-[56rem]/main:border-l" />
                    )}
                  </div>
                </div>
                {modal && (
                  <>
                    <div
                      className="m-fade absolute inset-0 z-30 bg-ink/25"
                      onClick={close}
                      aria-hidden="true"
                    />
                    <M_Sheet
                      key="modal"
                      mode="modal"
                      width={sheetW}
                      {...sheetProps}
                    />
                  </>
                )}
              </div>
            </div>
          </Stage>
        );
      }
      // --- Merged END ---

      // --- App ---
      // --- Variant B ---
      function VariantB() {
        return (
          <M_View
            nav="headers"
            entry={{ icon: L.Braces, label: "Fields" }}
            title={'B \u00b7 Braces icon, "Fields"'}
          />
        );
      }
      // --- Variant B END ---

      // --- App END ---

      createRoot(document.getElementById("root")).render(<VariantB />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
