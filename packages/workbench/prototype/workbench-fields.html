        const onHandleKey = (e) => {
          if (e.key === "ArrowUp") {
            e.preventDefault();
            setOpen(true);
            setPct((p) => Math.min(0.8, p + 0.05));
          }
          if (e.key === "ArrowDown") {
            e.preventDefault();
            if (!open) return;
            setPct((p) => Math.max(0.25, p - 0.05));
          }
          if (e.key === "Escape" && open) {
            e.preventDefault();
            setOpen(false);
          }
        };

        const height = open
          ? Math.max(D_PEEK, Math.round(areaH * pct))
          : D_PEEK;
        const toggle = () => setOpen((o) => !o);
        let idx = -1;

        const headerToggle = (
          <button
            type="button"
            onClick={toggle}
            aria-pressed={open}
            aria-controls="d-drawer"
            title="Item data"
            className={`inline-flex h-7 items-center gap-1.5 rounded-md px-1.5 text-sm focus-visible:outline-2 focus-visible:outline-accent ${open ? "bg-accent-soft text-accent" : "text-muted hover:bg-panel hover:text-ink"}`}
          >
            {open ? (
              <L.PanelBottomClose size={16} strokeWidth={1.75} />
            ) : (
              <L.PanelBottomOpen size={16} strokeWidth={1.75} />
            )}
            <span className="@max-[32rem]:sr-only">Item data</span>
          </button>
        );

        return (
          <Stage title="D · Field drawer">
            <ViewHeader actions={headerToggle} />
            <ItemRow onTitleClick={() => setOpen(true)} />
            <TabBar />
            <div
              ref={areaRef}
              className="relative mt-2 flex min-h-0 flex-1 flex-col border-t border-line @min-[56rem]:flex-row"
            >
              {/* Both panes pad their bottom by the drawer's peek height, so the caret line stays above the bar. */}
              <SourceEditor className="min-h-0 flex-1 pb-11 @min-[56rem]:basis-1/2" />
              <NotePreview className="min-h-0 flex-1 pb-14 border-t border-line bg-panel/40 @min-[56rem]:basis-1/2 @min-[56rem]:border-t-0 @min-[56rem]:border-l" />

              <section
                id="d-drawer"
                aria-label="Item data"
                onKeyDown={(e) => {
                  if (e.key === "Escape" && open) {
                    e.preventDefault();
                    setOpen(false);
                    searchRef.current?.blur();
                  }
                }}
                style={{ height, transition: "height 160ms ease" }}
                className={`absolute inset-x-0 bottom-0 z-20 flex flex-col border-t border-line bg-ground ${open ? "shadow-[0_-8px_24px_-6px_rgba(0,0,0,0.18)]" : ""}`}
              >
                {/* Grab handle */}
                <div
                  role="separator"
                  aria-orientation="horizontal"
                  aria-label="Resize item data"
                  tabIndex={0}
                  aria-valuemin={25}
                  aria-valuemax={80}
                  aria-valuenow={open ? Math.round(pct * 100) : 0}
                  onPointerDown={onDrag}
                  onKeyDown={onHandleKey}
                  className="absolute inset-x-0 -top-1.5 z-10 flex h-3 cursor-row-resize justify-center focus-visible:outline-2 focus-visible:outline-accent"
                >
                  <div className="mt-1.5 h-1 w-10 rounded-full bg-faint/70" />
                </div>
                {/* Bar */}
                <div className="flex h-11 shrink-0 items-center gap-2 px-3">
                  <button
                    type="button"
                    onClick={toggle}
                    aria-expanded={open}
                    aria-controls="d-drawer-body"
                    className="inline-flex shrink-0 items-center gap-1.5 rounded-md px-1.5 py-1 text-sm hover:bg-panel focus-visible:outline-2 focus-visible:outline-accent"
                  >
                    <L.Database size={15} className="text-muted" />
                    <span className="font-medium">Item data</span>
                    <span
                      className="rounded-full bg-panel px-1.5 text-xs tabular-nums text-muted"
                      title={`${D_FILLED} fields have a value for this item`}
                    >
                      {D_FILLED}
                    </span>
                    <L.ChevronUp
                      size={14}
                      className={`text-faint transition-transform ${open ? "rotate-180" : ""}`}
                    />
                  </button>
                  <div className="relative ml-auto min-w-0 flex-1 @min-[40rem]:max-w-80">
                    <L.Search
                      size={14}
                      className="pointer-events-none absolute top-1/2 left-2 -translate-y-1/2 text-faint"
                    />
                    <input
                      ref={searchRef}
                      type="search"
                      value={query}
                      placeholder="Search fields"
                      role="combobox"
                      aria-expanded={open}
                      aria-controls="d-list"
                      aria-activedescendant={
                        open && flat.length ? `d-opt-${sel}` : undefined
                      }
                      onChange={(e) => {
                        setQuery(e.target.value);
                        if (e.target.value) setOpen(true);
                      }}
                      onKeyDown={onKeys}
                      className="h-7 w-full rounded-md border border-line bg-panel pr-2 pl-7 text-sm outline-none placeholder:text-faint focus:border-accent"
                    />
                  </div>
                </div>
                {open && (
                  <div
                    id="d-drawer-body"
                    className="flex min-h-0 flex-1 flex-col"
                  >
                    <div
                      className="flex shrink-0 gap-1 overflow-x-auto px-3 pb-2"
                      role="toolbar"
                      aria-label="Sections"
                    >
                      {[{ id: null, label: "All" }, ...SECTIONS].map((s) => (
                        <button
                          key={s.id ?? "all"}
                          type="button"
                          onClick={() => setSection(s.id)}
                          aria-pressed={section === s.id}
                          className={`shrink-0 rounded-full border px-2.5 py-0.5 text-xs focus-visible:outline-2 focus-visible:outline-accent ${section === s.id ? "border-accent bg-accent-soft text-accent" : "border-line text-muted hover:text-ink"}`}
                        >
                          {s.label}
                        </button>
                      ))}
                    </div>
                    <div
                      id="d-list"
                      ref={listRef}
                      role="listbox"
                      aria-label="Fields"
                      tabIndex={0}
                      onKeyDown={onKeys}
                      aria-activedescendant={
                        flat.length ? `d-opt-${sel}` : undefined
                      }
                      className="min-h-0 flex-1 overflow-y-auto border-t border-line px-2 pt-1 pb-3 focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-accent"
                    >
                      {groups.length === 0 && (
                        <div className="p-4 text-sm text-muted">
                          No fields match “{query}”.
                        </div>
                      )}
                      {groups.map((g) => (
                        <div key={g.id} role="group" aria-label={g.label}>
                          <div className="sticky top-0 z-[1] bg-ground px-2 pt-2 pb-1 text-xs font-medium text-faint">
                            {g.label}
                          </div>
                          <div
                            className={`grid gap-x-4 ${twoCol ? "grid-cols-2" : "grid-cols-1"}`}
                          >
                            {g.rows.map((f) => {
                              idx += 1;
                              const i = idx;
                              return (
                                <D_FieldRow
                                  key={f.path}
                                  id={`d-opt-${i}`}
                                  field={f}
                                  active={i === sel}
                                  onHover={() => setSel(i)}
                                  onInsert={() => insertAt(i)}
                                />
                              );
                            })}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </section>
            </div>
          </Stage>
        );
      }
      // --- Variant D END ---

      // --- Variant E ---
      // Variant E — "Item data" browser: one modal like Obsidian's command palette, at every width.
      const E_IS_MAC =
        typeof navigator !== "undefined" &&
        /Mac|iPhone|iPad/.test(navigator.platform);
      const E_MOD = E_IS_MAC ? "⌘" : "Ctrl";

      /** Text with every case-insensitive match of `q` emphasised. */
      function E_Mark({ text, q }) {
        const t = q.trim();
        if (!t || !text) return text;
        const lower = text.toLowerCase(),
          needle = t.toLowerCase();
        const out = [];
        let i = 0,
          k = 0;
        while (true) {
          const j = lower.indexOf(needle, i);
          if (j < 0) break;
          if (j > i) out.push(text.slice(i, j));
          out.push(
            <mark
              key={k++}
              className="rounded-sm bg-accent-soft px-px font-semibold text-accent"
            >
              {text.slice(j, j + t.length)}
            </mark>,
          );
          i = j + t.length;
        }
        out.push(text.slice(i));
        return out;
      }

      function E_Value({ field, q, full }) {
        if (field.kind === "empty" || !field.value)
          return <span className="italic text-faint">Empty for this item</span>;
        return (
          <span
            className={`text-value ${full ? "break-words whitespace-pre-wrap" : "truncate"}`}
          >
            <E_Mark text={field.value} q={q} />
          </span>
        );
      }

      /** Label, full value, path, what the note would get, and the two actions. */
      function E_Detail({ field, q, onInsert, onCopy, copied, compact }) {
        if (!field)
          return (
            <div className="p-4 text-sm text-muted">No field selected.</div>
          );
        const empty = field.kind === "empty" || !field.value;
        const parent = field.parent ? findField(field.parent) : null;
        return (
          <div
            className={`flex flex-col gap-3 text-sm ${compact ? "" : "p-4"}`}
          >
            {!compact && (
              <div>
                <div className="text-xs text-muted">
                  {field.section}
                  {parent ? ` · ${parent.label}` : ""}
                </div>
                <div className="text-base font-semibold text-ink">
                  {field.label}
                </div>
              </div>
            )}
            {(!compact || (field.value ?? "").length > 32) && (
              <div className="max-h-40 overflow-auto rounded-md border border-line bg-ground p-2 leading-6">
                <E_Value field={field} q={q} full />
              </div>
            )}
            <div>
              <div className="mb-0.5 text-xs text-muted">Template path</div>
              <code className="font-mono text-xs break-all text-muted">
                zt.{field.path}
              </code>
            </div>
            <div>
              <div className="mb-0.5 text-xs text-muted">In your note:</div>
              <div className="font-mono text-xs break-all text-accent">
                {snippetOf(field.path)}
              </div>
              <div className="mt-0.5 flex gap-1.5 break-words">
                <L.CornerDownRight
                  size={13}
                  className="mt-0.5 shrink-0 text-faint"
                />
                {empty ? (
                  <span className="font-body italic text-faint">
                    (nothing — this item has no value)
                  </span>
                ) : (
                  <span className="font-body text-value">
                    {field.value.length > 90
                      ? field.value.slice(0, 90) + "…"
                      : field.value}
                  </span>
                )}
              </div>
            </div>
            <div className="flex gap-2">
              <button
                type="button"
                onClick={onInsert}
                className="inline-flex items-center gap-1.5 rounded-md bg-accent px-3 py-1.5 text-sm font-medium text-ground hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
              >
                <L.TextCursorInput size={14} /> Insert
              </button>
              <button
                type="button"
                onClick={onCopy}
                className="inline-flex items-center gap-1.5 rounded-md border border-line bg-raise px-3 py-1.5 text-sm text-ink hover:bg-panel focus-visible:outline-2 focus-visible:outline-accent"
              >
                {copied ? <L.Check size={14} /> : <L.Copy size={14} />}{" "}
                {copied ? "Copied" : "Copy"}
              </button>
            </div>
          </div>
        );
      }

      function E_Row({ field, q, active, onPick, onInsert, rowRef, children }) {
        return (
          <li
            ref={rowRef}
            role="option"
            aria-selected={active}
            id={`e-opt-${field.path}`}
          >
            <div
              onClick={onPick}
              onDoubleClick={onInsert}
              className={`flex cursor-pointer items-baseline gap-3 rounded-md px-3 py-1.5 text-sm ${active ? "bg-accent-soft" : "hover:bg-panel"}`}
            >
              <span
                className={`w-32 shrink-0 truncate ${field.parent ? "pl-3" : ""} ${active ? "text-accent" : "text-ink"}`}
              >
                {field.parent && <span className="text-faint">└ </span>}
                <E_Mark text={field.label} q={q} />
              </span>
              <span className="flex min-w-0 flex-1">
                <E_Value field={field} q={q} />
              </span>
            </div>
            {children}
          </li>
        );
      }

      function E_FieldBrowser({ onClose, onInsertPath }) {
        const width = useViewWidth();
        const dialogW = Math.min(720, width - 24);
        const wide = dialogW >= 600;
        const [q, setQ] = useState("");
        const [section, setSection] = useState("all");
        const [hi, setHi] = useState(0);
        const [copied, setCopied] = useState(null);
        const inputRef = useRef(null);
        const rowRefs = useRef({});

        const matches = useMemo(() => {
          const t = q.trim().toLowerCase();
          return t
            ? ALL_FIELDS.filter((f) =>
                `${f.label} ${f.path} ${f.value}`.toLowerCase().includes(t),
              )
            : ALL_FIELDS;
        }, [q]);
        const counts = useMemo(() => {
          const c = {};
          for (const f of matches) c[f.section] = (c[f.section] ?? 0) + 1;
          return c;
        }, [matches]);
        const rows =
          section === "all"
            ? matches
            : matches.filter((f) => f.section === section);
        const cur = rows[Math.min(hi, rows.length - 1)] ?? null;

        useEffect(() => {
          inputRef.current?.focus();
        }, []);
        useEffect(() => {
          setHi(0);
        }, [q, section]);
        useEffect(() => {
          if (cur)
            rowRefs.current[cur.path]?.scrollIntoView({ block: "nearest" });
        }, [cur?.path, wide]);

        const copy = (f) => {
          navigator.clipboard?.writeText(snippetOf(f.path)).catch(() => {});
          setCopied(f.path);
          setTimeout(() => setCopied(null), 1200);
        };
        const tabs = [
          { id: "all", label: "All fields", n: matches.length },
          ...SECTIONS.map((s) => ({
            id: s.label,
            label: s.label,
            n: counts[s.label] ?? 0,
          })),
        ];

        const onKeyDown = (e) => {
          if (e.key === "Escape") {
            e.preventDefault();
            e.stopPropagation();
            onClose();
          } else if (e.key === "ArrowDown") {
            e.preventDefault();
            setHi((i) => Math.min(rows.length - 1, i + 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setHi((i) => Math.max(0, i - 1));
          } else if (
            e.key === "Enter" &&
            cur &&
            e.target === inputRef.current
          ) {
            e.preventDefault();
            onInsertPath(cur.path, !e.shiftKey);
          }
        };

        const detail = (f, compact) => (
          <E_Detail
            field={f}
            q={q}
            compact={compact}
            copied={copied === f?.path}
            onInsert={() => onInsertPath(f.path, true)}
            onCopy={() => copy(f)}
          />
        );

        return (
          <div className="absolute inset-0 z-40" onKeyDown={onKeyDown}>
            <div className="absolute inset-0 bg-ink/30" onClick={onClose} />
            <div
              role="dialog"
              aria-modal="true"
              aria-label="Item data"
              className="absolute left-1/2 top-[12%] flex max-h-[80%] -translate-x-1/2 flex-col overflow-hidden rounded-lg border border-line bg-raise shadow-2xl"
              style={{ width: dialogW }}
            >
              {/* Search */}
              <div className="flex items-center gap-2 border-b border-line px-3 py-2.5">
                <L.Search size={16} className="shrink-0 text-muted" />
                <input
                  ref={inputRef}
                  value={q}
                  onChange={(e) => setQ(e.target.value)}
                  placeholder="Search fields and values…"
                  role="combobox"
                  aria-expanded="true"
                  aria-controls="e-list"
                  aria-activedescendant={cur ? `e-opt-${cur.path}` : undefined}
                  className="min-w-0 flex-1 bg-transparent text-base text-ink outline-none placeholder:text-faint"
                />
                <IconButton icon={L.X} label="Close" onClick={onClose} />
              </div>

              {/* Sections: chips when narrow */}
              {!wide && (
                <div className="flex shrink-0 gap-1.5 overflow-x-auto border-b border-line px-3 py-2">
                  {tabs.map((t) => (
                    <button
                      key={t.id}
                      type="button"
                      onClick={() => setSection(t.id)}
                      disabled={t.n === 0 && t.id !== section}
                      className={`shrink-0 rounded-full border px-2.5 py-0.5 text-xs focus-visible:outline-2 focus-visible:outline-accent disabled:opacity-40 ${section === t.id ? "border-accent bg-accent-soft text-accent" : "border-line text-muted hover:text-ink"}`}
                    >
                      {t.label}{" "}
                      <span className="tabular-nums opacity-70">{t.n}</span>
                    </button>
                  ))}
                </div>
              )}

              <div className="flex min-h-0 flex-1">
                {wide && (
                  <nav
                    aria-label="Sections"
                    className="w-40 shrink-0 overflow-auto border-r border-line bg-panel p-1.5"
                  >
                    {tabs.map((t) => (
                      <button
                        key={t.id}
                        type="button"
                        onClick={() => setSection(t.id)}
                        className={`flex w-full items-center justify-between rounded-md px-2 py-1 text-left text-sm focus-visible:outline-2 focus-visible:outline-accent ${section === t.id ? "bg-accent-soft text-accent" : t.n ? "text-ink hover:bg-ground" : "text-faint"}`}
                      >
                        <span className="truncate">{t.label}</span>
                        <span className="ml-2 text-xs tabular-nums text-muted">
                          {t.n}
                        </span>
                      </button>
                    ))}
                  </nav>
                )}

                <ul
                  id="e-list"
                  role="listbox"
                  aria-label="Fields"
                  className="min-h-[12rem] min-w-0 flex-1 overflow-auto p-1.5"
                >
                  {rows.length === 0 && (
                    <li className="px-3 py-6 text-center text-sm text-muted">
                      No fields match “{q}”
                      {section !== "all" ? ` in ${section}` : ""}.
                      {section !== "all" && (
                        <button
                          type="button"
                          className="ml-1 text-accent underline"
                          onClick={() => setSection("all")}
                        >
                          Search all fields
                        </button>
                      )}
                    </li>
                  )}
                  {rows.map((f, i) => {
                    const active = cur?.path === f.path;
                    return (
                      <E_Row
                        key={f.path}
                        field={f}
                        q={q}
                        active={active}
                        rowRef={(el) => {
                          rowRefs.current[f.path] = el;
                        }}
                        onPick={() => {
                          setHi(i);
                          inputRef.current?.focus();
                        }}
                        onInsert={() => onInsertPath(f.path, true)}
                      >
                        {!wide && active && (
                          <div className="mx-1 mb-1.5 rounded-b-md border border-t-0 border-line bg-panel px-3 py-3">
                            {detail(f, true)}
                          </div>
                        )}
                      </E_Row>
                    );
                  })}
                </ul>

                {wide && (
                  <aside
                    aria-label="Field details"
                    className="w-60 shrink-0 overflow-auto border-l border-line bg-panel"
                  >
                    {detail(cur, false)}
                  </aside>
                )}
              </div>

              {/* Key hints, like Obsidian's palette */}
              <div className="flex shrink-0 flex-wrap gap-x-4 gap-y-1 border-t border-line px-3 py-1.5 text-xs text-muted">
                <span>
                  <kbd className="font-mono">↑↓</kbd> to navigate
                </span>
                <span>
                  <kbd className="font-mono">↵</kbd> to insert
                </span>
                <span>
                  <kbd className="font-mono">⇧↵</kbd> insert and stay
                </span>
                <span>
                  <kbd className="font-mono">esc</kbd> to close
                </span>
              </div>
            </div>
          </div>
        );
      }

      function VariantE() {
        const [open, setOpen] = useState(false);
        const taRef = useRef(null);

        const close = useCallback(() => {
          setOpen(false);
          requestAnimationFrame(() => {
            const ta = taRef.current;
            if (!ta) return;
            ta.focus();
            const c = state.caret;
            ta.setSelectionRange(c, c);
          });
        }, []);

        useEffect(() => {
          const onKey = (e) => {
            if (
              (e.metaKey || e.ctrlKey) &&
              e.shiftKey &&
              e.key.toLowerCase() === "i"
            ) {
              e.preventDefault();
              setOpen((o) => !o);
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, []);

        const onInsertPath = (path, andClose) => {
          insertField(path);
          if (andClose) close();
        };

        const action = (
          <button
            key="item-data"
            type="button"
            onClick={() => setOpen(true)}
            aria-haspopup="dialog"
            aria-expanded={open}
            title={`Item data (${E_MOD}+Shift+I)`}
            className={`inline-flex h-7 items-center gap-1.5 rounded-md px-2 text-sm focus-visible:outline-2 focus-visible:outline-accent ${open ? "bg-accent-soft text-accent" : "text-muted hover:bg-panel hover:text-ink"}`}
          >
            <L.Braces size={16} strokeWidth={1.75} />{" "}
            <span className="@max-[360px]:hidden">Item data</span>
          </button>
        );

        return (
          <Stage title="E — Item data browser (palette)">
            <ViewHeader actions={action} />
            <ItemRow onTitleClick={() => setOpen(true)} />
            <TabBar />
            <div className="flex min-h-0 flex-1 flex-col @min-[56rem]:flex-row">
              <SourceEditor
                taRef={taRef}
                className="min-h-[10rem] flex-1 border-b border-line @min-[56rem]:border-b-0 @min-[56rem]:border-r"
              />
              <NotePreview className="flex-1" />
            </div>
            {open && (
              <E_FieldBrowser onClose={close} onInsertPath={onInsertPath} />
            )}
          </Stage>
        );
      }
      // --- Variant E END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Item data beside Preview", component: VariantA },
        { key: "B", name: "Fields at the caret", component: VariantB },
        { key: "C", name: "Item row opens record", component: VariantC },
        { key: "D", name: "Bottom drawer", component: VariantD },
        { key: "E", name: "Field browser dialog", component: VariantE },
      ];

      // Scenario presets — buttons that jump the shared store to a telling state
      // (e.g. "empty inbox", "3 selected"). Leave empty when the design has no such
      // states; otherwise add { label, apply() } entries that mutate the store.
      const SCENARIOS = [
        {
          label: "Wide view (1100)",
          apply: () => setProto({ width: WIDTHS.wide }),
        },
        {
          label: "Narrow view (420)",
          apply: () => setProto({ width: WIDTHS.narrow }),
        },
        {
          label: "Reset template",
          apply: () =>
            setProto({
              source: INITIAL_SOURCE,
              caret: INITIAL_SOURCE.indexOf("\n## Annotations"),
            }),
        },
      ];

      function App() {
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });
        const [pos, setPos] = useState({ right: 16, bottom: 16 });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const onDragStart = (e) => {
          const start = { x: e.clientX, y: e.clientY, ...pos };
          const onMove = (ev) => {
            const dx = ev.clientX - start.x,
              dy = ev.clientY - start.y;
            setPos({
              right: Math.max(8, start.right - dx),
              bottom: Math.max(8, start.bottom - dy),
            });
          };
          const onUp = () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
        };

        const V = VARIANTS[idx];
        return (
          <>
            <V.component />
            <div
              style={{
                position: "fixed",
                right: pos.right,
                bottom: pos.bottom,
                background: "#1e293b",
                color: "#f8fafc",
                borderRadius: "0.75rem",
                padding: "0.75rem",
                display: "flex",
                flexDirection: "column",
                gap: "0.5rem",
                fontSize: "0.875rem",
                zIndex: 9999,
                boxShadow: "0 4px 12px rgba(0,0,0,0.3)",
                minWidth: "9rem",
              }}
            >
              <div
                onPointerDown={onDragStart}
                style={{
                  cursor: "grab",
                  fontSize: "0.75rem",
                  opacity: 0.6,
                  userSelect: "none",
                  textAlign: "center",
                }}
              >
                ⠿ drag
              </div>
              {VARIANTS.map((v, i) => (
                <button
                  key={v.key}
                  onClick={() => setIdx(i)}
                  style={{
                    background: i === idx ? "#334155" : "none",
                    border: "none",
                    color: "inherit",
                    cursor: "pointer",
                    textAlign: "left",
                    padding: "0.375rem 0.5rem",
                    borderRadius: "0.375rem",
                  }}
                >
                  {v.key} — {v.name}
                </button>
              ))}
              {SCENARIOS.length > 0 && (
                <div
                  style={{
                    borderTop: "1px solid #334155",
                    marginTop: "0.25rem",
                    paddingTop: "0.5rem",
                    display: "flex",
                    flexDirection: "column",
                    gap: "0.25rem",
                  }}
                >
                  {SCENARIOS.map((s, i) => (
                    <button
                      key={i}
                      onClick={s.apply}
                      style={{
                        background: "none",
                        border: "1px solid #334155",
                        color: "inherit",
                        cursor: "pointer",
                        textAlign: "left",
                        padding: "0.25rem 0.5rem",
                        borderRadius: "0.375rem",
                        fontSize: "0.75rem",
                      }}
                    >
                      {s.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
