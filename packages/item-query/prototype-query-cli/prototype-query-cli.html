export class PartialDate {

    return this.day != null ? 3 : this.month != null ? 2 : 1;

    const p = (n) => String(n).padStart(2, "0");
    return this.day != null
      ? `${this.year}-${p(this.month)}-${p(this.day)}`

const GLOBAL_FNS = new Set([
  "if",
  "number",
  "min",
  "max",
  "now",
  "today",
  "date",
  "duration",
  "list",
]);
const LAMBDA_SCOPE = new Set(["value", "index", "acc"]);
const LIST_FIELDS = new Set([
  "tags",
  "collections",
  "creators",
  "attachments",
  "annotations",
]);
/** Static check: every bare name resolves to a field of the dataset (or lambda scope). Returns Query Warnings. */
export function validateExpression(ast, dataset, src) {
  const faults = [],
    warnings = [];
  const walk = (n, inLambda) => {
    if (!n || typeof n !== "object") return;
    if (n.t === "id") {
      if (
        !(
          dataset.fields.includes(n.name) ||
          (inLambda && LAMBDA_SCOPE.has(n.name)) ||
          n.name === "custom"
        )
      )
        faults.push({
          code: "unknown-field",
          from: n.from,
          to: n.to,
          found: n.name,
          candidates: dataset.fields,
        });
      return;
    }
    if (n.t === "fn") {
      if (!GLOBAL_FNS.has(n.name))
        faults.push({
          code: "unknown-function",
          from: n.from,
          to: n.from + n.name.length,
          found: n.name,
          candidates: [...GLOBAL_FNS],
        });
      n.args.forEach((a) => walk(a, inLambda));
      return;
    }
    if (n.t === "call") {
      walk(n.on, inLambda);
      const lam = ["filter", "map", "reduce", "any"].includes(n.name);
      n.args.forEach((a) => walk(a, inLambda || lam));
      return;
    }
    if (n.t === "bin" && (n.op === "==" || n.op === "!=")) {
      const listSide = [n.l, n.r].find(
        (x) =>
          x.t === "id" &&
          LIST_FIELDS.has(x.name) &&
          dataset.fields.includes(x.name),
      );
      const other = listSide === n.l ? n.r : n.l;
      if (listSide && other.t === "lit" && typeof other.v === "string")
        warnings.push({
          code: "never-equal",
          severity: "warning",
          message: `'${listSide.name}' is a list and never equals the text ${JSON.stringify(other.v)}; this comparison is ${n.op === "==" ? "never" : "always"} true.`,
          hint: `Use ${listSide.name}.contains(${JSON.stringify(other.v)}) to test membership.`,
          location: { argument: "filter", span: { from: n.from, to: n.to } },
          excerpt: {
            before: src.slice(Math.max(0, n.from - 24), n.from),
            at: src.slice(n.from, n.to),
            after: src.slice(n.to, n.to + 24),
          },
          report: [
            `'${listSide.name}' is a list and never equals a text.`,
            `  ${src.slice(n.from, n.to)}`,
            `Use ${listSide.name}.contains(${JSON.stringify(other.v)}).`,
          ],
        });
    }
    for (const k of ["l", "r", "e", "on", "idx"])
      if (n[k]) walk(n[k], inLambda);
    if (n.xs) n.xs.forEach((x) => walk(x, inLambda));
  };

  if (faults.length) {
    const f = faults[0];
    const e = new Error(f.code);
    e.fault = { ...f, src, at: f.from };
    throw e;
  }
  return warnings;
}

  if (d.suggestions.length)
    d.report.push(`Suggestions: ${d.suggestions.join(", ")}`);
  d.report.push(d.hint);
  return d;
}
const err = (code, message, hint, extra = {}) => {
  const e = new Error(message);
  e.fault = { code, message, hint, ...extra };
  return e;
};

// ---------- the engine ----------
export function createEngine(data, options = {}) {
  const records = buildRecords(data);
  const clock = { now: options.now ?? Date.parse("2025-10-10T09:00:00Z") };
  const libraryScope =
    options.libraryScope ?? data.LIBRARIES.map((l) => l.selector);
  const CONTRACT = 3;

  function resolveLibraries(text) {
    if (text == null) return [...libraryScope];
    if (text === "all") return data.LIBRARIES.map((l) => l.selector);
    const sels = text.trim().startsWith("[")
      ? JSON.parse(text)
      : splitList(text);
    for (const s of sels)
      if (!data.LIBRARIES.some((l) => l.selector === s))
        throw err(
          "library-not-found",
          `No Library '${s}' in the connected Zotero source.`,
          "Use personal, or group:<groupID> of a group Library the source holds; library=all reads every Library.",
          { parameter: "library" },
        );
    return data.LIBRARIES.map((l) => l.selector).filter((s) =>
      sels.includes(s),
    );
  }
  const libraryWire = (sel) => {
    const l = data.LIBRARIES.find((x) => x.selector === sel);
    return l.type === "personal"
      ? { type: "personal" }
      : { type: "group", groupID: l.groupID, name: l.name };
  };

  /** Normalized request → result. Shared by both CLI shapes. */
  function execute(req) {
    const ds = DATASETS[req.from];
    if (!ds)
      throw err(
        "invalid-argument",
        `Unknown dataset '${req.from}'.`,
        "Use from=items, from=attachments, or from=annotations.",
        { parameter: "from" },
      );
    const libraries = resolveLibraries(req.library);
    let rows = [...records[ds.root].values()].filter((r) =>
      libraries.includes(r.library),
    );
    // restrictions of the OLD shape (so the prototype shows what the current contract can and cannot say):
    // contract 2 exposes `attachments` on an Item as a boolean, not a list.
    const restricted = req.restrict ?? null;
    if (restricted?.booleanAttachments)
      rows = rows.map(
        (r) =>
          new Proxy(r, {
            get: (t, k) =>
              k === "attachments" ? t.attachments.length > 0 : t[k],
          }),
      );
    let ast = null;
    const warnings = [];
    if (req.filter != null) {
      if (req.filter.trim() === "")
        throw err(
          "invalid-argument",
          "filter is empty.",
          "Omit filter to match every row, or give an expression.",
          { parameter: "filter" },
        );
      ast = parseExpression(req.filter);
      const dsView = restricted
        ? {
            ...ds,
            fields: ds.fields.filter(
              (f) => !restricted.hiddenFields.includes(f),
            ),
          }
        : ds;
      warnings.push(...validateExpression(ast, dsView, req.filter));
    }
    if (ast) rows = rows.filter((r) => truthy(evaluate(ast, r, clock)));
    // search (ranked) — a stand-in for the MiniSearch engine of item-lookup
    let scores = null;
    if (req.search) {
      const terms = req.search.toLowerCase().split(/\s+/).filter(Boolean);
      scores = new Map();
      rows = rows.filter((r) => {
        const t = ds.searchText(r).toLowerCase();
        const hits = terms.filter((x) => t.includes(x)).length;
        if (hits === 0) return false;
        scores.set(r, hits + (t.includes(req.search.toLowerCase()) ? 1 : 0));
        return true;
      });
    }
    // sort
    const sortSpec = req.sort ?? (scores ? [] : parseSort(ds.defaultSort));
    for (const s of sortSpec) {
      if (!ds.sortable.includes(s.field))
        throw err(
          "unsortable-field",
          `'${s.field}' is not a Sortable Field of ${ds.name}.`,
          `Sort by one of: ${ds.sortable.join(", ")}.`,
          { parameter: "sort" },
        );
      if (!["asc", "desc"].includes(s.direction))
        throw err(
          "invalid-argument",
          `direction '${s.direction}' is not asc or desc.`,
          "Write sort=-field for descending, sort=field for ascending.",
          { parameter: "sort" },
        );
    }
    const sortSegs = sortSpec.map((s) => ({ ...s, segs: parsePath(s.field) }));
    const sortKeyOf = (r, segs) => {
      let v = readPath(r, segs);
      if (isDate(v)) v = v.startMs();
      return v;
    };
    rows.sort((a, b) => {
      if (scores) {
        const d = scores.get(b) - scores.get(a);
        if (d) return d;
      }
      for (const s of sortSegs) {
        const va = sortKeyOf(a, s.segs),
          vb = sortKeyOf(b, s.segs);
        if (va == null && vb == null) continue;
        if (va == null) return 1;
        if (vb == null) return -1;
        const c =
          typeof va === "string"
            ? collator.compare(va, vb)
            : va < vb
              ? -1
              : va > vb
                ? 1
                : 0;
        if (c) return s.direction === "desc" ? -c : c;
      }
      return a.indexedKey < b.indexedKey
        ? -1
        : a.indexedKey > b.indexedKey
          ? 1
          : 0;
    });
    // fields
    const fields = req.fields ?? ds.defaultFields;
    const fieldSegs = fields.map((f) => {
      const segs = parsePath(f);
      const root = segs[0].name;
      if (
        !ds.fields.includes(root) ||
        (restricted && restricted.hiddenFields.includes(root))
      )
        throw Object.assign(new Error("unknown-field"), {
          fault: {
            code: "unknown-field",
            src: f,
            at: 0,
            to: root.length,
            found: root,
            candidates: ds.fields,
            argument: "fields",
          },
        });
      return { path: f, segs };
    });
    const project = (r) => {
      const values = {};
      for (const f of fieldSegs) values[f.path] = toWire(readPath(r, f.segs));
      const row = { indexedKey: r.indexedKey, values };
      if (ds.name === "annotations") {
        row.attachmentIndexedKey = r.attachment.indexedKey;
        row.itemIndexedKey = r.item.indexedKey;
      }
      if (ds.name === "attachments") row.itemIndexedKey = r.item.indexedKey;
      return row;
    };
    // limit
    const limit =
      req.limit === "all" || (req.limit == null && req.limitDefault === null)
        ? null
        : req.limit == null
          ? 100
          : req.limit;
    const normalized = {
      from: ds.name,
      library: libraries,
      ...(req.search ? { search: req.search } : {}),
      filter: req.filter ?? null,
      fields,
      sort: sortSpec,
      limit,
      ...(req.group ? { group: req.group } : {}),
    };
    // group
    if (req.group) {
      const gsegs = parsePath(req.group);
      if (!ds.fields.includes(gsegs[0].name))
        throw Object.assign(new Error("unknown-field"), {
          fault: {
            code: "unknown-field",
            src: req.group,
            at: 0,
            found: gsegs[0].name,
            candidates: ds.fields,
            argument: "group",
          },
        });
      const groups = new Map();
      for (const r of rows) {
        const v = toWire(readPath(r, gsegs));
        const k = JSON.stringify(v);
        if (!groups.has(k)) groups.set(k, { value: v, count: 0, rows: [] });
        const g = groups.get(k);
        g.count++;
        if (limit == null || g.rows.length < limit) g.rows.push(project(r));
      }
      const list = [...groups.values()].sort((a, b) => {
        if (a.value == null) return 1;
        if (b.value == null) return -1;
        return typeof a.value === "string"
          ? collator.compare(a.value, b.value)
          : a.value < b.value
            ? -1
            : a.value > b.value
              ? 1
              : 0;
      });
      return {
        normalized,
        libraries,
        warnings,
        returnedCount: list.reduce((n, g) => n + g.rows.length, 0),
        totalCount: rows.length,
        truncated: list.some((g) => g.rows.length < g.count),
        groups: list,
        fields,
      };
    }
    const truncated = limit != null && rows.length > limit;
    const out = (limit == null ? rows : rows.slice(0, limit)).map(project);
    return {
      normalized,
      libraries,
      warnings,
      returnedCount: out.length,
      truncated,
      rows: out,
      fields,
    };
  }

  // --- the NEW shape: zotlit:query ---
  const NEW_PARAMS = [
    "from",
    "filter",
    "search",
    "fields",
    "sort",
    "limit",
    "library",
    "group",
    "format",
    "output",
    "id",
  ];
  function decodeNew(args) {
    for (const k of Object.keys(args))
      if (!NEW_PARAMS.includes(k))
        throw err(
          "invalid-argument",
          `Unknown parameter '${k}'.`,
          `Parameters: ${NEW_PARAMS.join(", ")}.`,
          { parameter: k },
        );
    const limit =
      args.limit == null
        ? undefined
        : args.limit === "all"
          ? "all"
          : /^\d+$/.test(args.limit) && +args.limit > 0
            ? +args.limit
            : (() => {
                throw err(
                  "invalid-argument",
                  `limit '${args.limit}' is not a positive integer or all.`,
                  "Use limit=<n> or limit=all.",
                  { parameter: "limit" },
                );
              })();
    let fields = null;
    try {
      fields = parseFields(args.fields);
    } catch (e) {
      if (e.fault) throw e;
      throw err(
        "invalid-argument",
        `fields '${args.fields}' is not a comma list or JSON array.`,
        "Write fields=title,date.year or a JSON array.",
        { parameter: "fields" },
      );
    }
    let sort = null;
    try {
      sort = parseSort(args.sort);
    } catch (e) {
      throw err(
        "invalid-argument",
        `sort '${args.sort}' is not a comma list or JSON array.`,
        "Write sort=-dateModified,title.",
        { parameter: "sort" },
      );
    }
    return {
      from: args.from ?? "items",
      filter: args.filter,
      search: args.search,
      fields,
      sort,
      limit,
      library: args.library,
      group: args.group,
      format: args.format ?? "json",
      output: args.output,
      id: args.id,
    };
  }

  // --- the OLD shape: zotlit:item-query / zotlit:annotation-query (contract 2) ---
  const OLD_PARAMS = {
    "zotlit:item-query": [
      "filter",
      "fields",
      "sort",
      "limit",
      "library",
      "libraries",
      "output",
      "id",
    ],
    "zotlit:annotation-query": [
      "filter",
      "item",
      "attachment",
      "fields",
      "sort",
      "limit",
      "library",
      "libraries",
      "output",
      "id",
    ],
  };
  function decodeOld(command, args) {
    const allowed = OLD_PARAMS[command];
    for (const k of Object.keys(args))
      if (!allowed.includes(k))
        throw err(
          "invalid-argument",
          `Unknown parameter '${k}' for ${command}.`,
          `Parameters: ${allowed.join(", ")}.`,
          { parameter: k },
        );
    const jsonArr = (name) => {
      if (args[name] == null) return null;
      let v;
      try {
        v = JSON.parse(args[name]);
      } catch {
        throw err(
          "invalid-argument",
          `${name} is not a JSON array.`,
          `Write ${name} as a JSON array, such as ${name}='["title","date.year"]'.`,
          { parameter: name },
        );
      }
      if (!Array.isArray(v))
        throw err(
          "invalid-argument",
          `${name} is not a JSON array.`,
          `Write ${name} as a JSON array.`,
          { parameter: name },
        );
      return v;
    };
    const fields = jsonArr("fields");
    const sortRaw = jsonArr("sort");
    const sort = sortRaw
      ? sortRaw.map((s) => ({ field: s.field, direction: s.direction }))
      : null;
    const limit =
      args.limit == null
        ? undefined
        : args.limit === "all"
          ? "all"
          : /^\d+$/.test(args.limit) && +args.limit > 0
            ? +args.limit
            : (() => {
                throw err(
                  "invalid-argument",
                  `limit '${args.limit}' is not a positive integer or all.`,
                  "Use limit=<n> or limit=all.",
                  { parameter: "limit" },
                );
              })();
    let library = args.libraries ?? args.library ?? null; // libraries wins
    const from = command === "zotlit:item-query" ? "items" : "annotations";
    let filter = args.filter;
    if (from === "annotations") {
      const keyFilter = (name, path) => {
        if (args[name] == null) return null;
        const keys = args[name].trim().startsWith("[")
          ? JSON.parse(args[name])
          : [args[name]];
        if (library != null)
          throw err(
            "invalid-argument",
            `${name} selects its own Library; do not add library or libraries.`,
            `Remove library/libraries, or select by filter instead of ${name}.`,
            { parameter: name },
          );
        return keys.length === 1
          ? `${path} == ${JSON.stringify(keys[0])}`
          : `[${keys.map((k) => JSON.stringify(k)).join(", ")}].contains(${path})`;
      };
      const parts = [
        keyFilter("item", "item.indexedKey"),
        keyFilter("attachment", "attachment.indexedKey"),
        filter,
      ].filter(Boolean);
      if (parts.length) filter = parts.map((p) => `(${p})`).join(" && ");
      if (args.item != null || args.attachment != null) library = "all";
    }
    // what contract 2 cannot say: Items have no attachments LIST and no annotations; `attachments` is a boolean
    const restrict =
      from === "items"
        ? { hiddenFields: ["annotations"], booleanAttachments: true }
        : { hiddenFields: [] };
    return {
      from,
      filter,
      fields,
      sort,
      limit,
      library,
      format: "json",
      output: args.output,
      id: args.id,
      restrict,
    };
  }

  function run(line) {
    let parsed;
    try {
      parsed = parseCommandLine(line);
    } catch (e) {
      return {
        ok: false,
        command: null,
        text: `Error: ${e.fault?.found ?? e.message}`,
        envelope: null,
      };
    }
    const { command, args } = parsed;
    const wrap = (cmd, tail) => ({
      contractVersion: CONTRACT,
      command: cmd,
      ...tail,
    });
    const fail = (cmd, e) => {
      if (!e.fault) throw e;
      const d = renderDiagnostic(
        e.fault.argument ?? e.fault.parameter ?? "filter",
        e.fault,
      );
      if (e.fault.parameter) d.details = { parameter: e.fault.parameter };
      const env = wrap(cmd, { ok: false, diagnostic: d });
      return {
        ok: false,
        command: cmd,
        envelope: env,
        text: JSON.stringify(env, null, 2),
      };
    };
    try {
      if (
        command === "zotlit:query" ||
        command === "zotlit:item-query" ||
        command === "zotlit:annotation-query"
      ) {
        const req =
          command === "zotlit:query"
            ? decodeNew(args)
            : decodeOld(command, args);
        const result = execute(req);
        const identity = {
          vault: "demo-vault",
          source: {
            kind: "zotero-database",
            path: "/Users/me/Zotero/zotero.sqlite",
          },
        };
        const body = {
          ok: true,
          identity,
          libraries: result.libraries.map(libraryWire),
          request: result.normalized,
          returnedCount: result.returnedCount,
          truncated: result.truncated,
          warnings: result.warnings,
        };
        if (result.groups) {
          body.totalCount = result.totalCount;
          body.groups = result.groups;
        } else body.rows = result.rows;
        if (req.output) {
          delete body.rows;
          delete body.groups;
          body.file = {
            path: req.output,
            bytes: JSON.stringify(
              wrap(command, { ...body, rows: result.rows ?? result.groups }),
            ).length,
            format: "json",
          };
        }
        const env = wrap(command, body);
        return {
          ok: true,
          command,
          envelope: env,
          request: req,
          result,
          text: formatResult(req.format, env, result, DATASETS[req.from]),
        };
      }
      if (
        command === "zotlit:query-schema" ||
        command === "zotlit:item-query-schema" ||
        command === "zotlit:annotation-query-schema"
      ) {
        const from =
          command === "zotlit:query-schema"
            ? (args.from ?? null)
            : command === "zotlit:item-query-schema"
              ? "items"
              : "annotations";
        const describe = (ds) => ({
          dataset: ds.name,
          fields: ds.fields.map((f) => ({
            path: f,
            relation: ds.relations[f] ?? null,
            sort: ds.sortable.includes(f),
          })),
          defaultFields: ds.defaultFields,
          defaultSort: ds.defaultSort,
        });
        const env = wrap(command, {
          ok: true,
          datasets: (from ? [DATASETS[from]] : Object.values(DATASETS)).map(
            describe,
          ),
          customFields: [{ path: 'custom["review.status"]', bareName: false }],
          defaults: {
            limit: 100,
            library: { source: "library-scope", value: libraryScope },
          },
        });
        return {
          ok: true,
          command,
          envelope: env,
          text: JSON.stringify(env, null, 2),
        };
      }
      if (command === "zotlit:annotation-image") {
        const a = records.annotations.get(args.key ?? "");
        if (!a)
          throw err(
            "annotation-not-found",
            `No Annotation with the key '${args.key ?? ""}'.`,
            "Pass the indexedKey of an Annotation Row.",
            { parameter: "key" },
          );
        if (!a.hasExcerptImage)
          throw err(
            "not-an-image-annotation",
            `Annotation '${a.indexedKey}' is a ${a.type}; it has no Excerpt Image.`,
            "Call this command for an image or ink Annotation (hasExcerptImage true).",
            { parameter: "key" },
          );
        if (!a.attachment.exists)
          throw err(
            "file-unavailable",
            "The source PDF is not on this device and Zotero has no cached image.",
            "Make the file available, then run the command again.",
            { parameter: "key" },
          );
        const env = wrap(command, {
          ok: true,
          key: a.indexedKey,
          path: `/tmp/zotlit-excerpts/${a.indexedKey}.png`,
          format: "png",
          provenance: a.type === "image" ? "zotero" : "rendered",
        });
        return {
          ok: true,
          command,
          envelope: env,
          text: JSON.stringify(env, null, 2),
        };
      }
      if (
        command === "zotlit:query-cancel" ||
        command === "zotlit:item-query-cancel"
      ) {
        const env = wrap(command, {
          ok: true,
          id: args.id ?? null,
          cancelRequested: false,
        });
        return {
          ok: true,
          command,
          envelope: env,
          text: JSON.stringify(env, null, 2),
        };
      }
      return {
        ok: false,
        command,
        envelope: null,
        text: `Error: unknown command '${command ?? ""}'. Try zotlit:query, zotlit:query-schema, zotlit:item-query, zotlit:annotation-query.`,
      };
    } catch (e) {
      return fail(command, e);
    }
  }

  return {
    run,
    records,
    datasets: DATASETS,
    libraries: data.LIBRARIES,
    clock,
    execute,
  };
}

// ---------- output formats ----------
const cell = (v) =>
  v == null
    ? ""
    : typeof v === "string"
      ? v
      : isList(v)
        ? v
            .map((x) =>
              x == null
                ? ""
                : typeof x === "object"
                  ? (x.fullName ?? x.indexedKey ?? JSON.stringify(x))
                  : String(x),
            )
            .join("; ")
        : typeof v === "object"
          ? (v.fullName ?? JSON.stringify(v))
          : String(v);
const dispWidth = (s) =>
  [...s].reduce(
    (n, ch) =>
      n +
      (/[\u1100-\u115f\u2e80-\ua4cf\uac00-\ud7a3\uf900-\ufaff\ufe30-\ufe4f\uff00-\uff60\uffe0-\uffe6]/.test(
        ch,
      )
        ? 2
        : 1),
    0,
  );
export function formatResult(format, env, result, ds) {
  if (format === "json" || !result.rows) return JSON.stringify(env, null, 2);
  const cols = ["indexedKey", ...result.fields];
  const rows = result.rows.map((r) => [
    r.indexedKey,
    ...result.fields.map((f) => cell(r.values[f])),
  ]);
  if (format === "csv") {
    const q = (s) => (/[",\n]/.test(s) ? `"${s.replaceAll(/"/g, '""')}"` : s);
    return [cols.map(q).join(","), ...rows.map((r) => r.map(q).join(","))].join(
      "\n",
    );
  }
  if (format === "md")
    return [
      `| ${cols.join(" | ")} |`,
      `| ${cols.map(() => "---").join(" | ")} |`,
      ...rows.map(
        (r) => `| ${r.map((c) => c.replaceAll(/\|/g, "\\|")).join(" | ")} |`,
      ),
    ].join("\n");
  if (format === "table") {
    const widths = cols.map((c, i) =>
      Math.min(40, Math.max(dispWidth(c), ...rows.map((r) => dispWidth(r[i])))),
    );
    const fit = (s, w) => {
      let t = s;
      while (dispWidth(t) > w) t = `${[...t].slice(0, -2).join("")  }…`;
      return t + " ".repeat(Math.max(0, w - dispWidth(t)));
    };
    const lines = [
      cols.map((c, i) => fit(c, widths[i])).join("  "),
      widths.map((w) => "─".repeat(w)).join("  "),
      ...rows.map((r) => r.map((c, i) => fit(c, widths[i])).join("  ")),
    ];
    lines.push(
      `${result.returnedCount} row(s)${result.truncated ? ", truncated" : ""}`,
    );
    return lines.join("\n");
  }
  return JSON.stringify(env, null, 2);
}

/** The same request as a saved query file (the Bases-shaped form). */
export function toQueryFile(req) {
  const lines = [`from: ${req.from}`];
  if (req.library)
    lines.push(
      `library: ${Array.isArray(req.library) ? `[${req.library.join(", ")}]` : req.library}`,
    );
  if (req.search) lines.push(`search: ${JSON.stringify(req.search)}`);
  if (req.filter) {
    const parts = splitTopLevelAnd(req.filter);
    if (parts.length > 1) {
      lines.push("filters:", "  and:");
      for (const p of parts) lines.push(`    - ${yamlStr(p)}`);
    } else lines.push(`filters: ${yamlStr(req.filter)}`);
  }
  if (req.fields) {
    lines.push("fields:");
    for (const f of req.fields) lines.push(`  - ${yamlStr(f)}`);
  }
  if (req.sort) {
    lines.push("sort:");
    for (const s of req.sort)
      lines.push(`  - ${s.direction === "desc" ? "-" : ""}${s.field}`);
  }
  if (req.limit != null) lines.push(`limit: ${req.limit}`);
  if (req.group) lines.push(`group: ${req.group}`);
  return lines.join("\n");
}
const yamlStr = (s) =>
  /[:#'"[\]{}&*!|>%@`]/.test(s) || /^\s|\s$/.test(s) ? JSON.stringify(s) : s;
function splitTopLevelAnd(src) {
  try {
    const ast = parseExpression(src);
    const out = [];
    const walk = (n) => {
      if (n.t === "and") {
        walk(n.l);
        walk(n.r);
      } else out.push(src.slice(n.from, n.to));
    };
    walk(ast);

      // --- Diagram ---
      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }
      let mermaidMod = null;
      function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el) return { svg: null, error: `no diagram ${src}` };
          if (!mod) return { svg: null, error: null };
          try {
            return {
              svg: mod.renderMermaidSVG(dedent(el.textContent), {
                bg: "var(--panel)",
                fg: "var(--ink)",
                transparent: true,
              }),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-bad text-xs whitespace-pre-wrap">{error}</pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }

        if (Array.isArray(v)) return v.map((x) => fmtValue(x)).join("; ");

          return v.fullName ?? v.indexedKey ?? JSON.stringify(v);

      }
      function RowsTable({ env }) {
        const rows =
          env.rows ??
          env.groups?.flatMap((g) =>

              {d ? (

                <pre className="whitespace-pre-wrap text-bad">{run.text}</pre>
              )}
            </div>
          );
        }
        if (!env.request)
          return (

        const r = env.request,

      function App() {
        const [cmd, setCmd] = useState(EXAMPLES[1].items[0][1]);
        const [history, setHistory] = useState([]);

        const [stepIdx, setStepIdx] = useState({});
        const [evalRows, setEvalRows] = useState(null);
        const [oldEquiv, setOldEquiv] = useState(null);
        const ref = useRef(null);
        const run = history[0] ?? null,
          prev = history[1] ?? null;

        const execute = (line, meta = {}) => {
          const r = engine.run(line);
          setHistory((h) =>
            [{ ...r, line, at: Date.now() }, ...h].slice(0, 20),
          );
          setCmd(line);
          if (meta.old !== undefined) setOldEquiv(meta.old);
          if (meta.clearOld) setOldEquiv(null);
          if (r.ok && r.command === "zotlit:query" && tab === "old")
            setTab("table");
        };
        useEffect(() => {
          execute(cmd, { clearOld: true });
        }, []);
        const onKey = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === "Enter") execute(cmd);
        };

        const sc = SCENARIOS.find((s) => s.id === scenario);
        const si = stepIdx[scenario] ?? 0;
        const runStep = (i) => {
          const st = sc.steps[i];
          execute(st.cmd, { clearOld: true });
          setStepIdx((m) => ({ ...m, [scenario]: i + 1 }));
          setTab(
            st.cmd.includes("query-schema") || !st.cmd.includes("format=")
              ? "json"
              : "table",
          );
        };

        const runEval = () => {
          const rows = CASES.map((c) => {
            const go = (cmds) =>
              cmds == null
                ? null
                : cmds.map((x) => {
                    const r = engine.run(x);
                    return {
                      ok: r.ok,
                      count: r.envelope?.returnedCount ?? null,
                      groups: r.envelope?.groups?.length ?? null,
                      warn: r.envelope?.warnings?.length ?? 0,
                      code: r.envelope?.diagnostic?.code ?? null,
                    };
                  });
            return { ...c, newRuns: go(c.new), oldRuns: go(c.old) };
          });
          setEvalRows(rows);
        };
        const evalSummary = useMemo(() => {
          if (!evalRows) return null;
          const n1 = evalRows.filter((r) => r.new.length === 1).length;
          const o1 = evalRows.filter(
            (r) => r.old && r.old.length === 1 && !r.client && !r.partial,
          ).length;
          const oNo = evalRows.filter((r) => !r.old).length;
          const oClient = evalRows.filter(
            (r) => r.old && (r.client || r.partial),
          ).length;
          return { n1, o1, oNo, oClient, total: evalRows.length };
        }, [evalRows]);

        const yaml = run?.ok && run.request ? toQueryFile(run.request) : null;

        return (

                个附件、16 条批注）和一个只在浏览器里运行的小查询引擎。
                你可以直接敲命令，也可以按右侧的走查一步步点。要回答的问题是：
                <b>
                  用 from= 选「查什么」、用 Obsidian Bases
                  一样的表达式顺着关系走（文献 → 附件 →
                  批注，或反过来），能不能像 SQL
                  一样回答跨表问题，同时参数仍然像 Bases 一样简单？

              </p>
            </header>

            <div className="grid md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] gap-6 px-6 md:px-10 py-6">
              {/* LEFT: composer, state, result */}

                    ))}
                    <span className="text-muted text-[12px] ml-1">输出：</span>
                    {["table", "json", "md", "csv"].map((f) => (
                      <Chip
                        key={f}
                        onClick={() =>
                          setCmd((c) =>
                            /\bformat=\w+/.test(c)
                              ? c.replace(/\bformat=\w+/, `format=${f}`)
                              : `${c} format=${f}`,
                          )
                        }
                      >
                        {f}
                      </Chip>
                    ))}
                  </div>
                </div>

                <div className="bg-panel border border-line rounded-sm p-4">
                  <div className="flex items-center justify-between">
                    <Label>请求（套用默认值之后）与结果</Label>
                    {prev && (
                      <span className="text-[11px] text-muted">
                        橙底 = 和上一次相比变了的部分
                      </span>
                    )}
                  </div>
                  <div className="mt-2">
                    <StatePanel run={run} prev={prev} />
                  </div>
                </div>

                <div className="bg-panel border border-line rounded-sm">
                  <div
                    className="flex border-b border-line text-sm"
                    role="tablist"
                  >
                    {[
                      ["table", "表格", Table2],
                      ["json", "JSON 信封", Braces],
                      ["file", "查询文件", FileText],
                      ["old", "现行写法", History],
                    ].map(([k, label, Icon]) => (
                      <button
                        key={k}
                        role="tab"
                        aria-selected={tab === k}
                        onClick={() => setTab(k)}
                        className="tab inline-flex items-center gap-1.5 px-3 py-2 border-b-2 border-transparent -mb-px"
                      >
                        <Icon size={14} />
                        {label}
                      </button>
                    ))}
                  </div>
                  <div className="p-4 min-h-[200px]">
                    {tab === "table" &&
                      ((run?.ok && run.envelope?.rows !== undefined) ||
                      run?.envelope?.groups ? (
                        <RowsTable env={run.envelope} />
                      ) : (
                        <pre className="whitespace-pre-wrap">{run?.text}</pre>
                      ))}
                    {tab === "json" && (
                      <pre className="whitespace-pre-wrap overflow-x-auto max-h-[520px] overflow-y-auto">
                        {run?.text}
                      </pre>
                    )}
                    {tab === "file" &&
                      (yaml ? (
                        <div>
                          <p className="text-sm text-muted mb-2">
                            同一个请求存成文件的样子（和 Obsidian .base
                            同一形状；<code>from</code> 是 SQL 的 FROM）。
                            <code className="font-mono">
                              zotlit:query file=thesis.zotquery
                            </code>{" "}
                            读取它。
                          </p>
                          <pre className="whitespace-pre-wrap">{yaml}</pre>
                        </div>
                      ) : (
                        <div className="text-muted text-sm">
                          运行一条成功的 zotlit:query 后，这里显示它的文件形态。
                        </div>
                      ))}
                    {tab === "old" && (
                      <div className="space-y-2 text-sm">
                        {run?.command?.startsWith("zotlit:query") ? (
                          <>
                            <p className="text-muted">
                              找一个「同一问题」的现行写法：下方评测表里每一行都给了两种写法；走查里标了浅棕色的步骤就是现行写法。
                            </p>
                            {oldEquiv ? (
                              <pre className="whitespace-pre-wrap text-old">
                                {oldEquiv}
                              </pre>
                            ) : null}
                          </>
                        ) : (
                          <p className="text-muted">
                            当前运行的就是现行写法（{run?.command}）。
                          </p>
                        )}
                        <p className="text-muted">
                          现行合同的限制在这个引擎里也照样生效：Item 上{" "}
                          <code>attachments</code> 只是布尔值、没有{" "}
                          <code>annotations</code>、没有附件数据集、
                          <code>fields</code>/<code>sort</code> 必须是 JSON
                          数组。
                        </p>
                      </div>
                    )}
                  </div>
                </div>
              </section>

              {/* RIGHT: walkthroughs, examples */}
              <section className="space-y-5 min-w-0">
                <div className="bg-panel border border-line rounded-sm">
                  <div className="px-4 pt-3">
                    <Label>走查（按顺序点）</Label>
                  </div>
                  <div className="flex flex-wrap gap-1 px-4 pt-2 pb-3 border-b border-line">
                    {SCENARIOS.map((s) => (
                      <Chip
                        key={s.id}
                        active={scenario === s.id}
                        onClick={() => {
                          setScenario(s.id);
                        }}
                      >
                        {s.title}
                      </Chip>
                    ))}
                  </div>
                  <div className="p-4">
                    <p className="text-[14px] leading-relaxed">{sc.intro}</p>
                    <ol className="mt-3 space-y-2">
                      {sc.steps.map((st, i) => (
                        <li
                          key={i}
                          className={`border rounded-sm p-2.5 ${i === si ? "border-accent" : "border-line"} ${i < si ? "opacity-80" : ""}`}
                        >
                          <div className="flex items-start gap-2">
                            <button
                              onClick={() => runStep(i)}
                              className={`shrink-0 inline-flex items-center gap-1 text-[12px] px-2 py-1 rounded-sm border ${i === si ? "bg-accent text-white border-accent" : "border-line"} ${st.old ? "text-old" : ""}`}
                            >
                              <ChevronRight size={12} />第 {i + 1} 步
                            </button>
                            <div className="min-w-0">
                              <div
                                className={`text-[13.5px] font-medium ${st.old ? "text-old" : ""}`}
                              >
                                {st.label}
                                {st.old && (
                                  <span className="ml-1.5 text-[11px] font-normal">
                                    现行写法
                                  </span>
                                )}
                              </div>
                              <pre className="mt-1 whitespace-pre-wrap text-[12px] text-muted">
                                {st.cmd}
                              </pre>
                              {i < si && (
                                <div className="mt-1 text-[12.5px]">
                                  <span className="text-accent">看这里：</span>
                                  {st.watch}
                                </div>
                              )}
                            </div>
                          </div>
                        </li>
                      ))}
                    </ol>
                    <button
                      onClick={() =>
                        setStepIdx((m) => ({ ...m, [scenario]: 0 }))
                      }
                      className="mt-3 inline-flex items-center gap-1 text-[12px] text-muted"
                    >
                      <RotateCcw size={12} /> 重来
                    </button>
                  </div>
                </div>

                <div className="bg-panel border border-line rounded-sm p-4">
                  <Label>随便点（自由玩）</Label>
                  <div className="mt-2 space-y-2">
                    {EXAMPLES.map((g) => (
                      <div
                        key={g.group}
                        className="flex flex-wrap items-center gap-1.5"
                      >
                        <span
                          className={`text-[12px] w-28 shrink-0 ${g.group.startsWith("现行") ? "text-old" : "text-muted"}`}
                        >
                          {g.group}
                        </span>
                        {g.items.map(([label, line]) => (
                          <Chip
                            key={label}
                            tone={
                              g.group.startsWith("现行") ? "old" : undefined
                            }
                            onClick={() => {
                              execute(line, { clearOld: true });
                              setTab(
                                line.includes("format=") ? "table" : "json",
                              );
                            }}
                          >
                            {label}
                          </Chip>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="bg-panel border border-line rounded-sm p-4">
                  <Label>这份假资料库长什么样</Label>
                  <p className="text-[13px] mt-1 text-muted">
                    三种记录，两条关系，每条关系都能双向走。Lovelace
                    那篇的扫描件文件丢失；周明那篇只有一个网址附件；Knuth 和
                    Cooper 两本书没有附件；Rougier
                    那篇在两个图书馆各有一份（同一个 Zotero key）。
                  </p>
                  <div className="mt-2">
                    <Diagram src="er" />
                  </div>
                </div>
              </section>
            </div>

            {/* EVAL */}
            <section className="px-6 md:px-10 pb-12">
              <div className="bg-panel border border-line rounded-sm p-4">
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <div>
                    <Label>
                      评测：{CASES.length} 个研究问题，两种写法在同一数据上跑
                    </Label>
                    <p className="text-[13px] text-muted mt-1">
                      前 15 题是已发布的 zotlit-query 技能评测题；后 13
                      题是评测没覆盖的跨表问题。点一行把「提案写法」装进上面的命令框。
                    </p>
                  </div>
                  <button
                    onClick={runEval}
                    className="inline-flex items-center gap-1.5 bg-accent text-white px-3 py-1.5 rounded-sm text-sm font-medium"
                  >
                    <ListChecks size={14} /> 全部运行
                  </button>
                </div>
                {evalSummary && (
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
                    {[
                      ["提案：一次调用解决", evalSummary.n1, "ok"],
                      ["现行：一次调用、无需额外处理", evalSummary.o1, "ink"],
                      [
                        "现行：要调用方自己合并/计数/猜",
                        evalSummary.oClient,
                        "warn",
                      ],
                      ["现行：问不了", evalSummary.oNo, "bad"],
                    ].map(([t, n, tone]) => (
                      <div
                        key={t}
                        className="border border-line rounded-sm p-3"
                      >
                        <div className="text-[12px] text-muted">{t}</div>
                        <div
                          className={`font-display text-3xl font-semibold text-${tone}`}
                        >
                          {n}
                          <span className="text-base text-muted font-body">
                            {" "}
                            / {evalSummary.total}
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                <div className="overflow-x-auto mt-4">
                  <table className="tbl w-full">
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>研究问题</th>
                        <th>提案写法</th>
                        <th className="text-old">现行写法（contract 2）</th>
                        <th>现行还要调用方做什么</th>
                      </tr>
                    </thead>
                    <tbody>
                      {(evalRows ?? CASES).map((c, i) => (
                        <tr
                          key={c.id}
                          className="cursor-pointer hover:bg-ground"
                          onClick={() => {
                            execute(c.new[0], {
                              old: c.old ? c.old.join("\n") : "（现行问不了）",
                            });
                            setTab(
                              c.new[0].includes("format=") ||
                                c.new[0].includes("group=")
                                ? "table"
                                : "json",
                            );
                            window.scrollTo({ top: 0, behavior: "smooth" });
                          }}
                        >
                          <td className="text-muted">
                            {i + 1}
                            <div className="text-[10px]">
                              {c.group === "persona" ? "评测题" : "补充"}
                            </div>
                          </td>
                          <td className="min-w-[16rem]">{c.question}</td>
                          <td className="min-w-[18rem]">
                            <pre className="whitespace-pre-wrap text-[11.5px]">
                              {c.new.join("\n")}
                            </pre>
                            {c.newRuns && (
                              <div className="mt-1 text-[12px]">
                                {c.newRuns.map((r, j) => (
                                  <span
                                    key={j}
                                    className={`mr-2 ${r.ok ? "text-ok" : "text-bad"}`}
                                  >
                                    {r.ok
                                      ? `✓ ${r.groups != null ? r.groups + " 组 / " : ""}${r.count} 行${r.warn ? " ⚠" : ""}`
                                      : `✗ ${r.code}`}
                                  </span>
                                ))}
                                <span className="text-muted">
                                  {c.new.length} 次调用
                                </span>
                              </div>
                            )}
                          </td>
                          <td className="min-w-[18rem]">
                            {c.old ? (
                              <pre className="whitespace-pre-wrap text-[11.5px] text-old">
                                {c.old.join("\n")}
                              </pre>
                            ) : (
                              <span className="text-bad">问不了</span>
                            )}
                            {c.oldRuns && (
                              <div className="mt-1 text-[12px]">
                                {c.oldRuns.map((r, j) => (
                                  <span
                                    key={j}
                                    className={`mr-2 ${r.ok ? "text-ok" : "text-bad"}`}
                                  >
                                    {r.ok
                                      ? `✓ ${r.count} 行${r.warn ? " ⚠" : ""}`
                                      : `✗ ${r.code}`}
                                  </span>
                                ))}
                                <span className="text-muted">
                                  {c.old.length} 次调用
                                </span>
                              </div>
                            )}
                          </td>
                          <td className="min-w-[12rem] text-[12.5px]">
                            {c.client ?? <span className="text-muted">—</span>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
              <p className="text-[12px] text-muted mt-4 max-w-[80ch]">
                引擎说明：这是为了「摸形状」写的内存小引擎，不是真实现。排序用
                Intl.Collator，日期按 UTC，search 是简化的词匹配（真实现复用
                item-lookup 的 MiniSearch）。关系列表在真实现里要走 ZoteroReads
                的分块加载，这里一次全在内存。
              </p>
            </section>
          </main>
        );
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const blobUrl = (id) =>
        URL.createObjectURL(
          new Blob([document.getElementById(id).textContent], {
            type: "text/javascript",
          }),
        );
      const urls = {
        __ENGINE__: blobUrl("mod-engine"),
        __DATA__: blobUrl("mod-data"),
        __CASES__: blobUrl("mod-cases"),
        __SCENARIOS__: blobUrl("mod-scenarios"),
      };
      let src = document.getElementById("app").textContent;
      for (const [k, v] of Object.entries(urls))
        src = src.replaceAll(`"${k}"`, JSON.stringify(v));
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
