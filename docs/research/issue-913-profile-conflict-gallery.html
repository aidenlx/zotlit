                        {String(i + 1).padStart(2, "0")}
                      </span>
                      <span className="min-w-0 flex-1">{s}</span>
                    </li>
                  ))}
                </ol>
              </div>
            ) : null}

            {extras}

            <div>
              <RailHeading>{state.templateFolder}/</RailHeading>
              {templateFiles.length === 0 ? (
                <div className="text-muted text-[11px]">empty</div>
              ) : (
                <div className="flex flex-col gap-[2px]">
                  {templateFiles.map((f) => (
                    <div
                      key={f.path}
                      className="text-muted font-mono text-[11px] leading-snug break-all"
                    >
                      {f.path.split("/").pop()}
                      {f.kind === "profile" ? "" : "  (not a profile)"}
                      {f.edited ? "  (edited)" : ""}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div>
              <RailHeading>Profiles (derived)</RailHeading>
              <table className="w-full text-[11px]">
                <tbody>
                  {list.map((p) => (
                    <tr key={p.path ?? p.id} className="align-top">
                      <td className="py-[2px] pr-2">{p.name}</td>
                      <td className="text-muted py-[2px] pr-2 font-mono break-all">
                        {p.id}
                      </td>
                      <td className="text-muted py-[2px] text-right font-mono tabular-nums whitespace-nowrap">
                        {p.excluded ? (
                          <span style={{ color: "var(--danger)" }}>
                            {p.noteCount} stale
                          </span>
                        ) : (
                          `${p.noteCount} notes`
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {list.some((p) => p.excluded) ? (
                <div className="mt-2 text-[11px] leading-snug">
                  <Pill tone="danger">duplicate-profile-id</Pill>{" "}
                  <span className="text-muted">
                    {stale.length} sample notes wait at the unknown-profile
                    backstop
                  </span>
                </div>
              ) : null}

              {state.incoming ? (
                <div className="text-muted mt-3 text-[11px] leading-snug">
                  incoming:{" "}
                  <span className="font-mono">{state.incoming.filename}</span> (
                  {state.incoming.manifest.id} v
                  {state.incoming.manifest.version}) via {state.incoming.source}
                  {" · "}
                  {state.incoming.text.split("\n").length} lines, not written
                </div>
              ) : state.incomingSeed ? (
                <div className="text-muted mt-3 text-[11px] leading-snug">
                  incoming: nothing staged yet
                </div>
              ) : null}

              {state.trash.length ? (
                <div className="text-muted mt-3 text-[11px] leading-snug">
                  trash:{" "}
                  {state.trash.map((f) => f.path.split("/").pop()).join(", ")}
                </div>
              ) : null}

              {state.activeFile ? (
                <div className="text-muted mt-3 font-mono text-[11px] leading-snug break-all">
                  {state.activeFile}
                </div>
              ) : null}
            </div>

            <div className="min-h-0">
              <RailHeading>Log</RailHeading>
              <div className="flex flex-col gap-[3px]">
                {state.log.length === 0 ? (
                  <div className="text-muted text-[11px]">nothing yet</div>
                ) : (
                  state.log.slice(0, 12).map((e, i) => (
                    <div
                      key={i}
                      className="flex gap-2 text-[11px] leading-snug"
                    >
                      <span className="text-muted font-mono tabular-nums">
                        {e.t}
                      </span>
                      <span className="min-w-0 flex-1">{e.text}</span>
                    </div>
                  ))
                )}
              </div>
            </div>
          </aside>
        );
      }
      // --- Shared END ---

      // --- App ---
      // --- Variant B1 ---
      // B1 — Report only. Same B shell (Share sheet, Import sheet paste+consent), but ZotLit never
      // resolves a collision, only reports it. SYNC: one generic banner and notice ("Some profile
      // files conflict"); the details and the action sit in the profiles list — one row per
      // conflicting file with Open and Delete — and the file explorer's right-click → Delete is the
      // same act from the other side. No second-edition sheet, no "Resolve…" row. EDITION: the seam
      // flips to a one-line "Replace <name>?" confirm, the way Obsidian confirms an overwrite — no
      // diff preview, no keep-both, no "restore previous"; going back is Obsidian's own File recovery.

      function B1_Btn({
        label,
        tone = "muted",
        cta = false,
        onClick,
        disabled,
      }) {
        return (
          <button
            onClick={onClick}
            disabled={disabled}
            className="cursor-pointer rounded border px-2 py-[4px] text-[12px] whitespace-nowrap"
            style={{
              opacity: disabled ? 0.45 : 1,
              cursor: disabled ? "not-allowed" : "pointer",
              borderColor: "var(--line)",
              background: cta ? "var(--accent)" : "var(--ground)",
              color: cta
                ? "#ffffff"
                : tone === "danger"
                  ? "var(--danger)"
                  : "var(--ink)",
            }}
          >
            {label}
          </button>
        );
      }

      function B1_Field({ label, value, onChange, mono = true, area = false }) {
        const cls = `border-line bg-ground-2 text-ink w-full rounded border px-2 py-[4px] text-[12px] outline-none ${
          mono ? "font-mono" : ""
        }`;
        return (
          <label className="flex items-start gap-3 py-[5px] text-[13px]">
            <span className="w-[150px] shrink-0 pt-[5px]">{label}</span>
            {area ? (
              <textarea
                value={value}
                rows={2}
                onChange={(e) => onChange(e.target.value)}
                className={cls}
              />
            ) : (
              <input
                value={value}
                onChange={(e) => onChange(e.target.value)}
                className={cls}
              />
            )}
          </label>
        );
      }

      function B1_bump(v) {
        const parts = String(v ?? "1.0").split(".");
        const i = parts.length > 1 ? 1 : 0;
        parts[i] = String(Number(parts[i] ?? 0) + 1);
        return parts.join(".");
      }

      function B1_partials(body) {
        return [...(body ?? "").matchAll(/\{%\s*render\s+"([^"]+)"/g)].map(
          (m) => m[1],
        );
      }

      function VariantB1() {
        const { state } = useProtoState();
        const list = profiles(state);
        const shared = list.filter((p) => !p.isDefault);
        const dflt = list.find((p) => p.isDefault);
        const excluded = list.filter((p) => p.excluded);

        const [settingsOpen, setSettingsOpen] = useState(true);
        const [menuOpen, setMenuOpen] = useState(false);
        const [paletteOpen, setPaletteOpen] = useState(false);
        // sheet: {kind:"share", id} | {kind:"import"} | {kind:"second", id, mode}
        const [sheet, setSheet] = useState(null);
        const [phase, setPhase] = useState("paste");
        const [paste, setPaste] = useState("");
        const [share, setShare] = useState({
          version: "",
          author: "",
          description: "",
          includeFolders: false,
        });
        const [folderDraft, setFolderDraft] = useState("");
        const [styleDraft, setStyleDraft] = useState("");
        const [exportView, setExportView] = useState(false);
        // { x, y, path } — the file explorer's right-click menu, the only place SYNC is resolved.
        const [menu, setMenu] = useState(null);

        // Every scenario is a different vault; the sheets start closed on the switch.
        useEffect(() => {
          setSheet(null);
          setPhase("paste");
          setPaste("");
          setMenuOpen(false);
          setPaletteOpen(false);
          setExportView(false);
          setMenu(null);
          setSettingsOpen(true);
        }, [state.scenario]);

        // SYNC: the file simply appeared, so no seam was crossed. ZotLit says so itself and stops —
        // it never opens a resolving sheet.
        const notified = useRef(null);
        useEffect(() => {
          if (notified.current === state.scenario) return;
          notified.current = state.scenario;
          if (state.scenario !== "sync") return;
          if (!profiles(state).some((p) => p.excluded)) return;
          actions.notify(
            "Some profile files conflict. See Settings → Literature note profiles.",
          );
        }, [state.scenario]);

        // The file explorer's right-click: one item, Delete, the researcher's own way to resolve
        // the collision. Not scoped to `secondSheet` since it opens from any file in the tree.
        const menuItems = (path) => {
          const file = state.files.find((f) => f.path === path);
          return [
            {
              label: "Delete",
              icon: Trash2,
              destructive: true,
              onClick: () => {
                const count = file?.manifest
                  ? (state.tally[file.manifest.id]?.notes ?? 0)
                  : 0;
                actions.trashFile(path);
                actions.notify(
                  `Moved to the Obsidian trash. ${count} notes resolve again on their next update.`,
                );
              },
            },
          ];
        };

        const openShare = (p) => {
          setMenuOpen(false);
          setShare({
            version: B1_bump(p.manifest?.version ?? "1.0"),
            author: p.manifest?.author ?? state.persona.name,
            description: p.manifest?.description ?? "",
            includeFolders: false,
          });
          setSheet({ kind: "share", id: p.id });
        };

        const openImport = () => {
          setMenuOpen(false);
          setPaletteOpen(false);
          setSettingsOpen(true);
          setPaste("");
          setPhase("paste");
          setSheet({ kind: "import" });
        };

        // The one flip: staged text either becomes a consent step or a second edition.
        const advance = (inc) => {
          if (!inc) return;
          const held = profiles(state).find(
            (p) => !p.isDefault && p.id === inc.manifest.id,
          );
          if (held) {
            setSheet({ kind: "second", id: held.id, mode: "edition" });
            return;
          }
          setFolderDraft("");
          setStyleDraft(inc.manifest.citationStyle ?? "");
          setPhase("consent");
        };

        const showExport = () => {
          setSheet(null);
          setSettingsOpen(false);
          setExportView(true);
        };

        // --- Surface 1: the Share sheet ------------------------------------
        const shareSheet = () => {
          const p = profileById(state, sheet.id);
          if (!p) return null;
          const names = B1_partials(p.body);
          if (!p.manifest) {
            return (
              <Dialog
                width={560}
                title={`Share ${p.name}`}
                body={
                  <div className="flex flex-col gap-2">
                    <p>
                      Default has no template document yet, so there is no file
                      to share. Customize the template document first.
                    </p>
                    <p className="text-muted">
                      The copy leaves as a normal profile file with a freshly
                      minted profile ID — recipients get a profile beside their
                      own Default, never a new Default. None of your notes
                      change.
                    </p>
                  </div>
                }
                actions={[
                  { label: "Cancel", onClick: () => setSheet(null) },
                  { label: "Save file…", disabled: true, cta: true },
                ]}
              />
            );
          }
          const run = (target) => {
            const res = actions.exportProfile(p.id, {
              includeFolders: share.includeFolders,
              target,
              version: share.version,
            });
            setSheet(null);
            if (!res) return;
            if (target === "file") {
              setSettingsOpen(false);
              setExportView(true);
              return;
            }
            actions.notify(
              `Copied ${p.name} v${share.version} as text — ${
                res.text.split("\n").length
              } lines, the ${names.join(", ")} partial inside, your folders ${
                share.includeFolders ? "included" : "left out"
              }.`,
              { label: "Show", onClick: showExport },
            );
          };
          return (
            <Dialog
              width={600}
              title={`Share ${p.name}`}
              body={
                <div className="flex max-h-[46vh] flex-col gap-1 overflow-y-auto pr-1">
                  <B1_Field
                    label="Name"
                    value={p.name}
                    onChange={() => {}}
                    mono={false}
                  />
                  <B1_Field
                    label="Version"
                    value={share.version}
                    onChange={(v) => setShare({ ...share, version: v })}
                  />
                  <div className="text-muted pl-[162px] text-[12px] leading-relaxed">
                    The version tells recipients this is a newer edition. Yours
                    is v{p.manifest.version}.
                  </div>
                  <B1_Field
                    label="Author"
                    value={share.author}
                    onChange={(v) => setShare({ ...share, author: v })}
                    mono={false}
                  />
                  <B1_Field
                    label="Description"
                    value={share.description}
                    onChange={(v) => setShare({ ...share, description: v })}
                    mono={false}
                    area
                  />
                  <div className="text-muted mt-2 text-[13px]">
                    Partials bundled: {names.length ? names.join(", ") : "none"}
                  </div>
                  <div className="text-muted text-[12px] leading-relaxed">
                    A partial lives beside the document, so a hand copy-paste
                    loses it. It travels inside this copy.
                  </div>
                </div>
              }
              checkboxes={[
                {
                  label: `Include my folders (${p.folder}, ${p.importFolder})`,
                  note: "Off: recipients keep their own folders.",
                  checked: share.includeFolders,
                  onChange: (v) => setShare({ ...share, includeFolders: v }),
                },
              ]}
              actions={[
                { label: "Cancel", onClick: () => setSheet(null) },
                { label: "Copy as text", onClick: () => run("clipboard") },
                { label: "Save file…", cta: true, onClick: () => run("file") },
              ]}
            />
          );
        };

        // --- Surfaces 3 and 4: the Import sheet, both phases -----------------
        const importSheet = () => {
          const inc = state.incoming;
          if (phase === "paste") {
            const nothing = !state.incomingSeed;
            return (
              <Dialog
                width={600}
                title="Add profile from text or file"
                body={
                  <div className="flex flex-col gap-3">
                    {nothing ? (
                      <p className="text-muted">
                        Nothing arrived from outside this vault in this
                        scenario, so there is no text to stage. The sheet is the
                        only import door in this variant; switch to TAKE or
                        EDITION to walk it.
                      </p>
                    ) : (
                      <p className="text-muted">
                        Paste the text of a profile, or choose the file you were
                        sent. Nothing is written until you have read the next
                        step.
                      </p>
                    )}
                    <textarea
                      value={paste}
                      onChange={(e) => setPaste(e.target.value)}
                      rows={7}
                      placeholder="---&#10;id: …&#10;name: …&#10;---"
                      className="border-line bg-ground-2 text-ink/85 w-full rounded border px-2 py-2 font-mono text-[11px] leading-[1.6] outline-none"
                    />
                    {inc ? (
                      <div className="text-muted text-[12px]">
                        {inc.filename} · {inc.text.split("\n").length} lines ·
                        nothing written yet
                      </div>
                    ) : null}
                  </div>
                }
                actions={[
                  { label: "Cancel", onClick: () => setSheet(null) },
                  {
                    label: "Paste",
                    disabled: nothing,
                    onClick: () => {
                      const got = actions.stageIncoming("paste");
                      if (got) setPaste(got.text);
                    },
                  },
                  {
                    label: "Choose file…",
                    disabled: nothing,
                    onClick: () => {
                      const got = actions.stageIncoming("file");
                      if (!got) return;
                      setPaste(got.text);
                      advance(got);
                    },
                  },
                  {
                    label: "Continue",
                    cta: true,
                    disabled: !inc,
                    onClick: () => advance(inc),
                  },
                ]}
              />
            );
          }

          if (!inc) return null;
          const lines = renderNote({ body: inc.body }, state.previewItem);
          const installed = state.installedStyles.includes(styleDraft);
          // What the TEXT carries, not what the sender's own file holds: a copy made with
          // "Include my folders" off has no folder key at all.
          const sentFolder = inc.text.includes("\nfolder: ")
            ? inc.manifest.folder
            : "left out — your folders stay";
          const fields = (inc.manifest.frontmatter ?? []).map((f) => f.key);
          const names = B1_partials(inc.body);
          return (
            <Dialog
              width={640}
              title="Add profile"
              body={
                <div className="flex max-h-[52vh] flex-col gap-3 overflow-y-auto pr-1">
                  <ManifestHeader manifest={inc.manifest} />
                  <NotePreview
                    title={`${state.previewItem.title} — one of your own items, rendered with this profile`}
                    lines={lines}
                  />
                  <div>
                    <div className="text-muted mb-1 text-[11px] tracking-[0.06em] uppercase">
                      Your settings
                    </div>
                    <YourSettingsRow
                      label="Literature note folder"
                      senderValue={sentFolder}
                      yourValue={folderDraft}
                      onChangeYourValue={setFolderDraft}
                    />
                    <div className="text-muted py-1 text-[12px]">
                      Empty means same as Default ({dflt.folder}).
                    </div>
                    <YourSettingsRow
                      label="Citation style"
                      senderValue={inc.manifest.citationStyle ?? "left out"}
                      yourValue={styleDraft}
                      onChangeYourValue={setStyleDraft}
                    />
                    {styleDraft && !installed ? (
                      <div className="flex items-center gap-2 py-1 text-[12px]">
                        <span style={{ color: "var(--danger)" }}>
                          {styleDraft} is not installed — notes render with the
                          built-in style until you add it.
                        </span>
                        <B1_Btn
                          label="Install…"
                          onClick={() => actions.installStyle(styleDraft)}
                        />
                      </div>
                    ) : null}
                  </div>
                  <EntersYourVault
                    files={[
                      {
                        path: `${state.templateFolder}/${inc.filename}`,
                        verdict: "new",
                      },
                    ]}
                    fields={fields}
                  />
                  <div className="text-muted text-[12px]">
                    {names.length
                      ? `${names.length} partial (${names.join(", ")}) travels inside the file.`
                      : "No partials travel with this file."}
                  </div>
                  <div className="text-[13px] font-semibold">
                    None of your notes change.
                  </div>
                </div>
              }
              actions={[
                { label: "Cancel", onClick: () => setSheet(null) },
                {
                  label: "Add profile",
                  cta: true,
                  onClick: () => {
                    const name = inc.manifest.name;
                    actions.writeIncoming({
                      folder: folderDraft,
                      style: styleDraft,
                    });
                    setSheet(null);
                    setPhase("paste");
                    setSettingsOpen(true);
                    actions.notify(
                      `${name} was added. None of your notes change.`,
                    );
                  },
                },
              ]}
            />
          );
        };

        // --- Surface 5: the replace confirm, from the seam only. SYNC never reaches this — the
        // in-place collision has no seam, so it stays with the banner and the file explorer. ---
        const secondSheet = () => {
          const held = profileById(state, sheet.id);
          if (!held) return null;
          const incoming = state.incoming;
          if (!incoming) return null;
          return (
            <Dialog
              width={480}
              title={`Replace ${held.name}?`}
              body={
                <p>
                  You already have this profile (v{held.manifest.version} ·{" "}
                  {held.noteCount} notes · {held.importedCount} imported notes).
                  The arriving file is v{incoming.manifest.version} of the same
                  profile. Your file is overwritten and {held.noteCount} notes
                  re-render on their next update.
                </p>
              }
              actions={[
                { label: "Cancel", onClick: () => setSheet(null) },
                {
                  label: "Replace",
                  destructive: true,
                  onClick: () => {
                    actions.replaceProfile(sheet.id);
                    setSheet(null);
                    setPhase("paste");
                    actions.notify(
                      `${held.name} is now v${incoming.manifest.version}. ${held.noteCount} notes re-render on their next update. To go back, use File recovery (Settings → File recovery).`,
                    );
                  },
                },
              ]}
            />
          );
        };

        const sheetNode =
          sheet?.kind === "share"
            ? shareSheet()
            : sheet?.kind === "import"
              ? importSheet()
              : sheet?.kind === "second"
                ? secondSheet()
                : null;

        // --- Surface 6: going back is Obsidian's own trash (SYNC) or File recovery (EDITION) —
        // ZotLit keeps no record, so there is no in-app undo row to render here. ---
        const rowActions = (p) => (
          <>
            {p.excluded ? (
              <B1_Btn
                label="Delete"
                tone="danger"
                onClick={() => {
                  actions.trashFile(p.path);
                  actions.notify("Moved to the Obsidian trash.");
                }}
              />
            ) : (
              <B1_Btn label="Share…" onClick={() => openShare(p)} />
            )}
          </>
        );

        const settings = (
          <SettingsModal
            open={settingsOpen}
            onClose={() => setSettingsOpen(false)}
          >
            <ProfilesPage
              banner={
                excluded.length ? (
                  <Banner
                    tone="danger"
                    text="Some profile files conflict and are out of the registry. Keep one file for each profile in the list below."
                  />
                ) : null
              }
              header={
                <div className="relative">
                  {menuOpen ? (
                    <div className="border-line bg-ground absolute top-5 right-0 z-20 w-[250px] overflow-hidden rounded-md border py-1 shadow-2xl">
                      <button
                        onClick={() => {
                          setMenuOpen(false);
                          actions.pushLog(
                            "New profile… — a blank profile document",
                          );
                        }}
                        className="text-ink flex w-full cursor-pointer items-center gap-2 px-3 py-[6px] text-left text-[13px]"
                      >
                        <Plus size={14} className="text-muted" /> New profile…
                      </button>
                      <button
                        onClick={openImport}
                        className="text-ink flex w-full cursor-pointer items-center gap-2 px-3 py-[6px] text-left text-[13px]"
                      >
                        <Download size={14} className="text-muted" /> From text
                        or file…
                      </button>
                    </div>
                  ) : null}
                </div>
              }
              onAdd={() => setMenuOpen((v) => !v)}
              onOpen={(path) => {
                setSettingsOpen(false);
                setExportView(false);
                actions.openFile(path);
              }}
              onDuplicate={(id) =>
                actions.pushLog(
                  `Duplicate "${profileById(state, id)?.name}" — a copy with a fresh ID`,
                )
              }
              onDelete={(id) => {
                const p = profileById(state, id);
                if (!p?.path) return;
                actions.trashFile(p.path);
                actions.notify(
                  p.noteCount === 0
                    ? `${p.name} was deleted. It held 0 notes, so none of your notes change.`
                    : `${p.name} was deleted. ${p.noteCount} notes re-render on their next update.`,
                );
              }}
              extraRowActions={rowActions}
              footer={
                <div className="border-line mt-4 flex items-center gap-3 border-t pt-3">
                  <div className="min-w-0 flex-1 text-[13px]">
                    Share the Default profile
                    <div className="text-muted mt-[2px] text-[12px]">
                      It leaves as a normal profile file with a fresh profile
                      ID.
                    </div>
                  </div>
                  <B1_Btn label="Share…" onClick={() => openShare(dflt)} />
                </div>
              }
            />
          </SettingsModal>
        );

        const palette = (
          <CommandPalette
            open={paletteOpen}
            onClose={() => setPaletteOpen(false)}
            items={[
              { label: "ZotLit: Import profile…", onSelect: openImport },
              {
                label: "ZotLit: Share profile…",
                onSelect: () => {
                  setPaletteOpen(false);
                  setSettingsOpen(true);
                  openShare(shared[0] ?? dflt);
                },
              },
              {
                label: "ZotLit: Open literature note profiles",
                onSelect: () => {
                  setPaletteOpen(false);
                  setExportView(false);
                  setSettingsOpen(true);
                },
              },
            ]}
          />
        );

        const overlay =
          settingsOpen || sheetNode || paletteOpen ? (
            <div className="relative flex h-full w-full items-center justify-center">
              {settingsOpen ? settings : null}
              {sheetNode ? (
                <div
                  className="absolute inset-0 flex items-center justify-center"
                  style={{ background: "rgba(0,0,0,0.28)" }}
                >
                  {sheetNode}
                </div>
              ) : null}
              {paletteOpen ? (
                <div className="absolute inset-0 flex items-start justify-center pt-16">
                  {palette}
                </div>
              ) : null}
            </div>
          ) : null;

        // --- Surface 2: the shareable copy as plain text --------------------
        const exp = state.lastExport;
        const body =
          exportView && exp ? (
            <div>
              <Banner
                tone="accent"
                text={`This is the copy that leaves your vault — ${exp.text.split("\n").length} lines, the authors partial inside. None of your notes change.`}
                action={{
                  label: "Back to settings",
                  onClick: () => {
                    setExportView(false);
                    setSettingsOpen(true);
                  },
                }}
              />
              <FileText path={exp.path} source={exp.text} />
            </div>
          ) : null;

        const STEPS = {
          send: [
            "Settings → ZotLit is open. The Reading group row carries Share… beside Open.",
            "The Share sheet prefills a bumped version (1.0 → 1.1) and says the version is what tells recipients this is a newer edition.",
            "Leave “Include my folders” off — Reading/lit and Reading/imports stay yours.",
            "Save file… closes the modal and opens the copy as plain text: the manifest is shaded, the authors partial is inside it.",
            "Copy as text posts a notice naming what was copied, with Show for the same view.",
            "The Default has Share… too, under the list: it would leave with a fresh profile ID.",
          ],
          take: [
            "Add profile → From text or file… (the command palette has ZotLit: Import profile… as well).",
            "Click Paste: the box fills from the blog post. Nothing is written.",
            "Continue flips the SAME sheet to consent — no wizard, no second modal.",
            "The preview renders one of Ben's OWN items, not Anna's.",
            "chicago-note is not installed: install it, or notes render with the built-in style.",
            "Folder empty = same as Default (literatures). Add profile writes one file; none of Ben's notes change.",
          ],
          sync: [
            "The notice already arrived: “Some profile files conflict. See Settings → Literature note profiles.” No action on it.",
            "The page carries one generic banner; the details sit in the list: one row per conflicting file, with Open and Delete.",
            "Delete on the laptop's row moves that file to the Obsidian trash; the banner and the rows clear themselves.",
            "The file explorer's right-click → Delete is the same act from the other side. No sheet, no dialog.",
          ],
          edition: [
            "Add profile → From text or file… → Choose file… stages Anna's v1.1.",
            "The ID is already in the vault, so the sheet flips to a one-line confirm: “Replace Reading group?”.",
            "The paragraph states the versions and counts — no diff, no keep-both. Replace or Cancel.",
            "Replace overwrites the file; the notice states 40 notes re-render and names File recovery as the way back.",
          ],
        };

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              title={exportView && exp ? exp.path : undefined}
              overlay={overlay}
              onFileMenu={(path, e) =>
                setMenu({ x: e.clientX, y: e.clientY, path })
              }
              statusItems={
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setPaletteOpen(true)}
                    className="text-muted cursor-pointer"
                  >
                    <Kbd>⌘P</Kbd> commands
                  </button>
                  <button
                    onClick={() => {
                      setExportView(false);
                      setSettingsOpen(true);
                    }}
                    className="text-muted flex cursor-pointer items-center gap-1"
                  >
                    <Settings size={12} /> profiles
                  </button>
                </div>
              }
            >
              {body}
              {menu ? (
                <ContextMenu
                  x={menu.x}
                  y={menu.y}
                  items={menuItems(menu.path)}
                  onClose={() => setMenu(null)}
                />
              ) : null}
            </ObsidianFrame>

            <Rail
              thesis="ZotLit names the collision and the count; the researcher resolves it with Obsidian's own file tools."
              answers={[
                {
                  q: "What do I send?",
                  a: "Share… on the row: one sheet with version, author, description, the bundled partial named, and your folders left out unless you tick them.",
                },
                {
                  q: "What do I do with this file?",
                  a: "Add profile → From text or file…, or the ZotLit: Import profile… command, or the #904 switch-profile picker's New profile… row. All open the same sheet.",
                },
                {
                  q: "Which of my notes change if I accept?",
                  a: "A new profile: none. A second edition: the confirm names the count before you choose.",
                },
                {
                  q: "Can I take it back?",
                  a: "Obsidian's trash (SYNC) or File recovery (EDITION). ZotLit keeps no record.",
                },
                {
                  q: "Is this the one I already have?",
                  a: "The same ID means the same profile; ZotLit says so and stops.",
                },
              ]}
              steps={STEPS[state.scenario] ?? []}
              extras={
                <div>
                  <RailHeading>Doors into the sheet</RailHeading>
                  <div className="text-muted flex flex-col gap-1 text-[11px] leading-snug">
                    <div>Settings → Add profile ▾ → From text or file…</div>
                    <div>Command palette → ZotLit: Import profile…</div>
                    <div>#904 switch-profile picker → New profile… row</div>
                    <div>
                      SYNC only: the list row → Delete (or the file explorer)
                    </div>
                  </div>
                </div>
              }
            />
          </div>
        );
      }
      // --- Variant B1 END ---

      // --- App END ---

      // A console handle on the store, so the browser can be asked what the vault derives.
      window.proto = {
        getSnapshot,
        actions,
        profiles,
        profileById,
        stampLabel,
        shareableText,
        renderNote,
        diffLines,
        staleNotes,
        fileText,
      };

      createRoot(document.getElementById("root")).render(<VariantB1 />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
