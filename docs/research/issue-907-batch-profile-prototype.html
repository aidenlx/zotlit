VERDICT (2026-08-29, ticket #907): Variant B — "Decide on the confirm screen" — won, merged with
Variant A's informed suggest picker as the control ("B, but use A suggest to pick instead of modal
inline select"). The Companion's Profile is an override-able default: it preselects the chip on
the confirm screen, and the picker can replace it ("companion input for profile can be overriden
in confirm dialog. the input will affect default profile selection").
Model recorded: a run never asks before the batch modal; the confirm screen's Create group carries
a chip "New notes go to: <Profile>" preselected from the Companion, else last used, else Default;
clicking the chip opens the informed picker (folder · style · template · resulting folder) over the

the summary names the Profile per group; with one Profile the modal is unchanged from today.

<!doctype html>
<!--
  Prototype — Profile selection in the batch update and import run (ticket #907, map #835)

  DESIGN QUESTION
  When a run touches many items at once — some with existing notes (their stamps win), some
  without — where does the Profile for the NEW notes come from, does the user ever see a
  picker, and what do the run summary and its notice say about the Profile that was used?

  FIRST PRINCIPLES (academic user)
  A batch run is "bring my vault up to date with Zotero" — a maintenance chore, not an
  authoring act. Attention is on the count, not on items.
    1. Per-item questions are unacceptable at N=200; N=3 is not a different feature.
    2. The only decision in a run is for the CREATE group. It is one decision per run, and it
       must be visible BEFORE the run writes (the confirm screen already exists for this).
    3. Existing notes are never re-stamped by a run (consent rule from #904). A headless
       Profile that conflicts with a stamp is a conflict to SHOW, not a silent failure.
    4. The summary must name the Profile the new notes got — the one fact the user cannot
       infer from a count. "Done. 3 created under Articles, 5 updated." Notice carries the
       same words.
    5. Import run: Imported Notes follow the parent's Literature Note. Only orphans (parent
       has no Literature Note) need a Profile — the same "new notes" decision, on the same
       confirm screen.
    6. Zero extra Profiles: no Profile UI at all, the modal is byte-identical to today, the
       summary says "Done. 3 created, 5 updated."

  VARIANTS (3; structurally different answers to "who picks the Profile for the create group")
    A  Ask up front, one Profile for the run — when the Create group is non-empty and >1
       Profile exists, the informed picker (#904's rows: folder · style · template · resulting
       folder, last-used preselected) opens BEFORE the batch modal; the confirm screen then
       shows "Create (3) → Articles" as the group header; summary "Done. 3 created under
       Articles, 5 updated, 0 failed."
    B  Decide on the confirm screen, per-item fallback — no picker modal. The confirm screen's
       Create group header carries an inline Profile dropdown ("New notes go to: [Articles ▾]"),
       preselected from the run's Profile (headless) else last-used else Default; each Create
       row shows its resulting path live; Update rows show their stamp as a muted pill and
       never change; a headless Profile conflicting with a stamp shows the row under "Kept as
       is (n)" instead of failing. Summary groups by Profile: "Done. 3 created under Articles,
       5 updated (4 Articles, 1 Default), 0 failed."
    C  Last-used, no question — the run never asks; Create rows show the resulting path under
       the last-used Profile; a one-line footnote on the confirm screen "New notes use Articles
       (last used) · Change…" opens the informed picker only on click. Summary "Done. 3 created
       under Articles (last used), 5 updated, 0 failed." Notice identical. Zero extra Profiles:
       footnote absent.
  All three: existing stamps win; the run never re-stamps; zero extra Profiles → no Profile UI.
-->
<html lang="en">

    <script type="importmap">
      {

          "react-dom/client": "https://esm.sh/react-dom@19/client",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",

  <body>
    <div id="root"></div>

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, {
        useState,
        useEffect,
        useMemo,
        useRef,
        useSyncExternalStore,
      } from "react";
      import { createRoot } from "react-dom/client";
      import {
        Search,
        ChevronDown,
        ChevronRight,
        FolderOpen,
        FileText,
        Files,
        Bookmark,
        PanelLeft,
        Settings,
        HelpCircle,
        X,
        Plus,
      } from "lucide-react"; // any lucide icon; <Search size={16} className="text-muted" />

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // --- Shared ---
      // The prototype store: one module-level object, a listener set, and useSyncExternalStore.
      // Variants never receive props — they read `useProtoState()` and call `actions`.

      const ARTICLES = "9e5b907e-4e61-4c0a-98c7-a7d60dedc8e0";
      const THESIS = "c1f0a2d4-7b3e-4e51-9a6d-2f8e0b7c5a11";

      const ALL_PROFILES = [
        {
          id: null,
          label: "Default",
          folder: "literatures",
          style: "Built-in default",
          document: "Built-in template",
          rule: null,
          importFolder: "zotero_notes",
        },
        {
          id: ARTICLES,
          label: "Articles",
          folder: "literatures/articles",
          style: "apa",
          document: "templates/articles.md",
          rule: { itemType: "journalArticle" },
          importFolder: "zotero_notes/articles",
        },
        {
          id: THESIS,
          label: "Thesis",
          folder: "projects/thesis/reading",
          style: "chicago-author-date",
          document: null, // bindings-only Profile: no template document
          rule: { collection: "PhD reading" },
          importFolder: "projects/thesis/notes",
        },
      ];

      // Canonical pool of items a run can touch. Index order matters: the first four are the
      // ones stamped Articles in the "noted" scenarios, index 4 is stamped Default, the rest
      // stay unnoted (or become import orphans).
      const ITEM_DEFS = [
        {
          key: "smith2021deep",
          title: "Deep learning for citation graphs",
          authors: "Smith, J.",
          year: 2021,
          type: "journalArticle",
          library: "My Library",
        },
        {
          key: "lee2019corpus",
          title: "Corpus methods in comparative literature",
          authors: "Lee, H.",
          year: 2019,
          type: "journalArticle",
          library: "My Library",
        },
        {
          key: "patel2022ethics",
          title: "Research ethics in the digital humanities",
          authors: "Patel, R.",
          year: 2022,
          type: "journalArticle",
          library: "My Library",
        },
        {
          key: "nguyen2020algorithmic",
          title: "Algorithmic bias in peer review",
          authors: "Nguyen, T.",
          year: 2020,
          type: "journalArticle",
          library: "My Library",
        },
        {
          key: "garcia2018network",
          title: "Network analysis of citation practices",
          authors: "Garcia, M.",
          year: 2018,
          type: "book",
          library: "Lab group",
        },
        {
          key: "oconnor2023archive",
          title: "Archival silences and the digital record",
          authors: "O'Connor, S.",
          year: 2023,
          type: "journalArticle",
          library: "My Library",
        },
        {
          key: "weber2017structure",
          title: "Structure and agency in scientific collaboration",
          authors: "Weber, A.",
          year: 2017,
          type: "journalArticle",
          library: "Lab group",
        },
        {
          key: "ivanov2021thesis",
          title: "Thesis writing as a genre",
          authors: "Ivanov, D.",
          year: 2021,
          type: "book",
          library: "My Library",
        },
      ];

      function stamp() {
        const d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
      }

      export function profileById(s, id) {
        return s.profiles.find((p) => p.id === (id ?? null)) ?? s.profiles[0];
      }

      export function notePath(s, itemKey, profileId) {
        return `${profileById(s, profileId).folder}/${itemKey}.md`;
      }

      export function importPath(s, noteKey, profileId) {
        return `${profileById(s, profileId).importFolder ?? "zotero_notes"}/${noteKey}.md`;
      }

      export function PROFILE_DISPLAY(profile) {
        return [
          profile.folder,
          profile.style,
          profile.document ?? "Bindings only",
        ].join(" · ");
      }

      export function summaryText(s) {
        const r = s.run.result;
        if (!r) return "";
        let out = `Done. ${r.created} created`;
        if (s.profiles.length > 1) {
          out += ` under ${profileById(s, s.run.createProfileId).label}`;
        }
        out += `, ${r.updated} updated, ${r.failed} failed.`;
        if (r.kept > 0) out += ` ${r.kept} kept as is.`;
        return out;
      }

      function seed(scenario) {
        const profiles =
          scenario === "zero-extra" ? ALL_PROFILES.slice(0, 1) : ALL_PROFILES;
        const profileList = profiles.map((p) => ({ ...p }));
        const tmp = { profiles: profileList };

        const noted =
          scenario === "mixed" ||
          scenario === "headless" ||
          scenario === "import";

        const items = ITEM_DEFS.map((d, idx) => {
          let note;
          if (noted) {
            if (idx < 4)
              note = { path: notePath(tmp, d.key, ARTICLES), profileId: ARTICLES };
            else if (idx === 4)
              note = { path: notePath(tmp, d.key, null), profileId: null };
          } else if (scenario === "zero-extra" && idx < 5) {
            note = { path: notePath(tmp, d.key, null), profileId: null };
          }
          return { ...d, note };
        }).slice(0, scenario === "all-new" ? 6 : 8);

        const zoteroNotes =
          scenario === "import"
            ? [0, 1, 2, 3, 5, 6].map((idx) => ({
                key: `${ITEM_DEFS[idx].key}-import`,
                title: `Reading note — ${ITEM_DEFS[idx].title}`,
                parentKey: ITEM_DEFS[idx].key,
                note: undefined,
              }))
            : [];

        const kind = scenario === "import" ? "import" : "update";
        const headlessProfileId = scenario === "headless" ? THESIS : undefined;
        const lastUsedProfileId = scenario === "zero-extra" ? null : ARTICLES;

        const createSource =
          headlessProfileId !== undefined
            ? "headless"
            : profileList.length === 1
              ? "bound"
              : null;
        const createProfileId =
          headlessProfileId !== undefined ? headlessProfileId : null;

        return {
          scenario,
          profiles: profileList,
          items,
          zoteroNotes,
          run: {
            kind,
            headlessProfileId,
            phase: "idle",
            createProfileId,
            createSource,
            pickerShown: false,
            progress: 0,
            result: null,
          },
          lastUsedProfileId,
          notices: [],
          log: [],
        };
      }

      let state = seed("mixed");
      const listeners = new Set();

      function subscribe(fn) {
        listeners.add(fn);
        return () => listeners.delete(fn);
      }

      function getSnapshot() {
        return state;
      }

      function setState(next) {
        state = next;
        for (const fn of listeners) fn();
      }

      function logged(next, text) {
        return {
          ...next,
          log: [{ t: stamp(), text }, ...next.log].slice(0, 40),
        };
      }

      export function useProtoState() {
        const snapshot = useSyncExternalStore(subscribe, getSnapshot);
        return { state: snapshot, actions };
      }

      function computeResult(s) {
        const byProfile = {};
        const bump = (label) => {
          byProfile[label] = (byProfile[label] ?? 0) + 1;
        };
        let created = 0,
          updated = 0,
          kept = 0,
          failed = 0;
        const createdLines = [];
        const createLabel = profileById(s, s.run.createProfileId).label;

        if (s.run.kind === "import") {
          const zoteroNotes = s.zoteroNotes.map((n) => {
            const parent = s.items.find((it) => it.key === n.parentKey);
            const profileId = parent?.note ? parent.note.profileId : s.run.createProfileId;
            const label = profileById(s, profileId).label;
            const note = {
              path: importPath(s, n.key, profileId),
              profileId: profileId ?? null,
            };
            created++;
            bump(label);
            createdLines.push(`Created ${note.path} under ${label}`);
            return { ...n, note };
          });
          return {
            items: s.items,
            zoteroNotes,
            result: { created, updated, kept, failed, byProfile },
            createdLines,
          };
        }

        const items = s.items.map((it) => {
          if (it.note) {
            const headless = s.run.headlessProfileId;
            if (headless !== undefined && it.note.profileId !== headless) {
              kept++;
              return it; // stamp wins, never re-stamped
            }
            updated++;
            bump(profileById(s, it.note.profileId).label);
            return it;
          }
          const note = {
            path: notePath(s, it.key, s.run.createProfileId),
            profileId: s.run.createProfileId ?? null,
          };
          created++;
          bump(createLabel);
          createdLines.push(`Created ${note.path} under ${createLabel}`);
          return { ...it, note };
        });
        return {
          items,
          zoteroNotes: s.zoteroNotes,
          result: { created, updated, kept, failed, byProfile },
          createdLines,
        };
      }

      let noticeSeq = 0;

      export const actions = {
        setScenario(scenario) {
          setState(logged(seed(scenario), `Scenario: ${scenario}`));
        },
        startRun() {
          const n =
            state.run.kind === "import"
              ? state.zoteroNotes.length
              : state.items.length;
          setState(
            logged(
              { ...state, run: { ...state.run, phase: "confirm" } },
              `Run started (${state.run.kind}), ${n} items`,
            ),
          );
        },
        showPicker() {
          setState(
            logged(
              {
                ...state,
                run: { ...state.run, phase: "picker", pickerShown: true },
              },
              "Picker shown",
            ),
          );
        },
        hidePicker() {
          setState({ ...state, run: { ...state.run, phase: "confirm" } });
        },
        chooseCreateProfile(id, source) {
          const label = profileById(state, id).label;
          setState(
            logged(
              {
                ...state,
                run: {
                  ...state.run,
                  createProfileId: id ?? null,
                  createSource: source,
                },
                lastUsedProfileId:
                  source === "asked" ? (id ?? null) : state.lastUsedProfileId,
              },
              `Create profile: ${label} (${source})`,
            ),
          );
        },
        confirm() {
          const total = Math.max(
            state.run.kind === "import"
              ? state.zoteroNotes.length
              : state.items.length,
            1,
          );
          setState({
            ...state,
            run: { ...state.run, phase: "progress", progress: 0 },
          });
          const timer = setInterval(() => {
            const cur = state;
            const next = cur.run.progress + 1;
            if (next >= total) {
              clearInterval(timer);
              const { items, zoteroNotes, result, createdLines } =
                computeResult(cur);
              const withResult = {
                ...cur,
                items,
                zoteroNotes,
                run: { ...cur.run, phase: "summary", progress: total, result },
              };
              const text = summaryText(withResult);
              const entries = [...createdLines, `Run summary: ${text}`].map(
                (t) => ({ t: stamp(), text: t }),
              );
              setState({
                ...withResult,
                log: [...entries.reverse(), ...withResult.log].slice(0, 40),
              });
              actions.notify(text);
            } else {
              setState({ ...cur, run: { ...cur.run, progress: next } });
            }
          }, 40);
        },
        close() {
          setState({ ...state, run: { ...state.run, phase: "idle" } });
        },
        setLastUsed(id) {
          setState(
            logged(
              { ...state, lastUsedProfileId: id ?? null },
              `Last used: ${profileById(state, id).label}`,
            ),
          );
        },
        notify(text) {
          const id = ++noticeSeq;
          setState({ ...state, notices: [...state.notices, { id, text }] });
          setTimeout(() => {
            setState({
              ...state,
              notices: state.notices.filter((n) => n.id !== id),
            });
          }, 3000);
        },
      };

      // --- Primitives: Obsidian's default theme, rebuilt from the plan's tokens only. ---

      export function Kbd({ children }) {
        return (
          <kbd className="font-mono text-[11px] leading-none border-line bg-ground-2 text-muted rounded border px-1 py-[3px]">
            {children}
          </kbd>
        );
      }

      export function Pill({ tone = "muted", children, className = "" }) {
        const tint =
          tone === "accent"
            ? {
                color: "var(--accent)",
                background:
                  "color-mix(in srgb, var(--accent) 14%, transparent)",
              }
            : tone === "danger"
              ? {
                  color: "var(--danger)",
                  background:
                    "color-mix(in srgb, var(--danger) 14%, transparent)",
                }
              : { color: "var(--muted)", background: "var(--ground-2)" };
        return (
          <span
            className={`inline-block rounded-full px-2 py-[2px] text-[11px] leading-none whitespace-nowrap ${className}`}
            style={tint}
          >
            {children}
          </span>
        );
      }

      function TreeFolder({ name, files, activePath }) {
        return (
          <div className="mb-[2px]">
            <div className="text-ink/85 flex items-center gap-1 rounded px-1 py-[3px] text-[13px]">
              <ChevronDown size={12} className="text-muted shrink-0" />
              <span className="truncate">{name}</span>
            </div>
            {files.map((f) => (
              <div
                key={f.path}
                className="flex items-center gap-1 rounded py-[3px] pr-1 pl-[22px] text-[13px]"
                style={
                  f.path === activePath
                    ? {
                        background:
                          "color-mix(in srgb, var(--accent) 12%, transparent)",
                      }
                    : undefined
                }
              >
                <span className="truncate">{f.name}</span>
              </div>
            ))}
          </div>
        );
      }

      export function ObsidianFrame({
        title,
        children,
        overlay = null,
        statusItems = null,
        footer = null,
      }) {
        const { state } = useProtoState();

        const tree = useMemo(() => {
          const folders = new Map([
            ["attachments", []],
            ["literatures", []],
            [
              "templates",
              [{ name: "articles.md", path: "templates/articles.md" }],
            ],
            ["zotero_notes", []],
          ]);
          const addNote = (key, note) => {
            if (!note) return;
            const cut = note.path.lastIndexOf("/");
            const dir = note.path.slice(0, cut);
            const name = note.path.slice(cut + 1);
            if (!folders.has(dir)) folders.set(dir, []);
            folders.get(dir).push({ name, path: note.path, key });
          };
          for (const it of state.items) addNote(it.key, it.note);
          for (const n of state.zoteroNotes ?? []) addNote(n.key, n.note);
          return [...folders.entries()];
        }, [state.items, state.zoteroNotes]);

        return (
          <div className="bg-ground text-ink font-body relative flex h-full min-w-0 flex-col overflow-hidden text-sm">
            <div className="flex min-h-0 flex-1">
              {/* ribbon */}

      export function CommandPalette({ open, items = [], onClose }) {
        const [query, setQuery] = useState("");
        const [sel, setSel] = useState(0);
        const hits = items.filter((i) =>
          i.label.toLowerCase().includes(query.toLowerCase()),
        );
        useEffect(() => {
          setSel(0);
        }, [query]);
        if (!open) return null;
        const onKeyDown = (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setSel((i) => Math.min(i + 1, hits.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setSel((i) => Math.max(i - 1, 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            hits[sel]?.onSelect?.();
          } else if (e.key === "Escape") {
            e.preventDefault();
            onClose?.();
          }
        };
        return (
          <Prompt
            placeholder="Select a command..."
            value={query}
            onChange={setQuery}
            onKeyDown={onKeyDown}
            instructions={[
              { command: "↑↓", purpose: "navigate" },
              { command: "↵", purpose: "run command" },
              { command: "esc", purpose: "dismiss" },

            {hits.map((it, i) => (

                key={it.label}
                title={it.label}
                selected={i === sel}
                onClick={it.onSelect}
              />
            ))}
          </Prompt>
        );
      }

      function classifyGroupsB(state) {
        const createId = state.run.createProfileId;
        if (state.run.kind === "import") {
          const overwriteRows = [];
          const importRows = [];
          state.zoteroNotes.forEach((n, idx) => {
            const parent = state.items.find((it) => it.key === n.parentKey);
            if (parent && parent.note) {
              overwriteRows.push({
                idx,
                key: n.key,
                title: n.title,
                label: profileById(state, parent.note.profileId).label,
                path: importPath(state, n.key, parent.note.profileId),
              });
            } else {
              importRows.push({
                idx,
                key: n.key,
                title: n.title,
                path: importPath(state, n.key, createId),
              });
            }
          });
          return { kind: "import", overwriteRows, importRows };
        }

        const headless = state.run.headlessProfileId;
        const updateRows = [];
        const keptRows = [];
        const createRows = [];
        state.items.forEach((it, idx) => {
          if (it.note) {
            const label = profileById(state, it.note.profileId).label;
            if (headless !== undefined && it.note.profileId !== headless) {
              keptRows.push({ idx, key: it.key, title: it.title, label });
            } else {
              updateRows.push({
                idx,
                key: it.key,
                title: it.title,
                label,
                path: it.note.path,
              });
            }
          } else {
            createRows.push({
              idx,
              key: it.key,
              title: it.title,
              path: notePath(state, it.key, createId),
            });
          }
        });
        return { kind: "update", updateRows, keptRows, createRows };
      }

      function buildSummaryB(state, groups) {
        const r = state.run.result;
        if (!r) return "";
        if (state.profiles.length === 1) {
          let out = `Done. ${r.created} created, ${r.updated} updated, ${r.failed} failed.`;
          if (r.kept > 0) out += ` ${r.kept} kept as is.`;
          return out;
        }
        if (state.run.kind === "import") {
          const byLabel = {};
          groups.overwriteRows.forEach((row) => {
            byLabel[row.label] = (byLabel[row.label] ?? 0) + 1;
          });
          if (groups.importRows.length) {
            const createLabel = profileById(state, state.run.createProfileId).label;
            byLabel[createLabel] =
              (byLabel[createLabel] ?? 0) + groups.importRows.length;
          }
          const parts = Object.entries(byLabel)
            .map(([label, n]) => `${n} under ${label}`)
            .join(", ");
          let createdPart = `${r.created} created`;
          if (parts) createdPart += ` (${parts})`;
          return `Done. ${createdPart}, ${r.failed} failed.`;
        }
        const createLabel = profileById(state, state.run.createProfileId).label;
        const updatedByLabel = {};
        groups.updateRows.forEach((row) => {
          updatedByLabel[row.label] = (updatedByLabel[row.label] ?? 0) + 1;
        });
        const updatedParts = Object.entries(updatedByLabel)
          .map(([label, n]) => `${n} ${label}`)
          .join(", ");
        let updatedPart = `${r.updated} updated`;
        if (updatedParts) updatedPart += ` (${updatedParts})`;
        let out = `Done. ${r.created} created under ${createLabel}, ${updatedPart}, ${r.failed} failed.`;
        if (r.kept > 0) out += ` ${r.kept} kept as is.`;
        return out;
      }

      function CreatePicker({ state }) {
        const isImport = state.run.kind === "import";
        const [sel, setSel] = useState(() => {
          const i = state.profiles.findIndex(

        });

        function choose(p) {
          actions.chooseCreateProfile(p.id, "asked");
          actions.hidePicker();
        }

        function onKeyDown(e) {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setSel((i) => Math.min(i + 1, state.profiles.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setSel((i) => Math.max(i - 1, 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            choose(state.profiles[sel]);
          } else if (e.key === "Escape") {
            e.preventDefault();
            actions.hidePicker();
          }
        }

        return (
          <Prompt
            placeholder="New notes in this run: choose a Profile"
            onKeyDown={onKeyDown}
            instructions={[
              { command: "↑↓", purpose: "move" },
              { command: "↵", purpose: "choose" },
              { command: "esc", purpose: "back to confirm" },
            ]}
          >
            {state.profiles.map((p, i) => (
              <SuggestRow
                key={p.label}
                selected={i === sel}
                onClick={() => choose(p)}
                title={p.label}
                note={PROFILE_DISPLAY(p)}
                aside={`${isImport ? (p.importFolder ?? "zotero_notes") : p.folder}/…`}
                badge={
                  state.run.headlessProfileId !== undefined &&
                  p.id === (state.run.headlessProfileId ?? null)
                    ? "Companion"
                    : p.id === (state.lastUsedProfileId ?? null)
                      ? "last used"
                      : null
                }
              />
            ))}
          </Prompt>
        );
      }

      function VariantB() {
        const { state } = useProtoState();
        const groupsRef = useRef(null);
        const prevPhaseRef = useRef(state.run.phase);

        if (state.run.phase === "confirm" || groupsRef.current === null) {
          groupsRef.current = classifyGroupsB(state);
        }
        const groups = groupsRef.current;

        useEffect(() => {
          if (
            state.run.phase === "summary" &&
            prevPhaseRef.current !== "summary"
          ) {
            const bText = buildSummaryB(state, groups);
            const defaultText = summaryText(state);
            if (bText && bText !== defaultText) actions.notify(bText);
          }
          prevPhaseRef.current = state.run.phase;
        }, [state.run.phase]);

        function handleStart() {
          actions.startRun();
          const headless = state.run.headlessProfileId;
          if (headless !== undefined) {
            actions.chooseCreateProfile(headless, "headless");
          } else if (state.lastUsedProfileId != null) {
            actions.chooseCreateProfile(state.lastUsedProfileId, "last-used");
          } else {
            actions.chooseCreateProfile(null, "bound");
          }
        }

        function rowStatus(row, finalStatus) {
          if (state.run.phase === "progress") {
            return row.idx < state.run.progress ? finalStatus : "pending";
          }
          if (state.run.phase === "summary") return finalStatus;
          return null;
        }

        const total =
          state.run.kind === "import" ? state.zoteroNotes.length : state.items.length;

        let confirmModal = null;
        if (state.run.phase === "confirm" || state.run.phase === "picker") {
          confirmModal = (
            <BatchModal
              title={
                state.run.kind === "import" ? "Import notes" : "Update literature notes"
              }
              intro={
                state.run.kind === "import"
                  ? `Import or update ${total} notes?`
                  : `Update or create ${total} literature notes?`
              }
              footer={
                <>
                  <button
                    onClick={actions.close}
                    className="border-line cursor-pointer rounded-md border px-3 py-[6px] text-[13px]"
                    style={{ background: "var(--ground)", color: "var(--ink)" }}
                  >
                    Cancel
                  </button>
                  <button
                    onClick={actions.confirm}
                    className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                    style={{ background: "var(--accent)", color: "#ffffff" }}
                  >
                    {state.run.kind === "import" ? "Import notes" : "Update notes"}
                  </button>
                </>
              }
            >
              {groups.kind === "update" ? (
                <>
                  {groups.updateRows.length > 0 ? (
                    <BatchGroup header={`Update (${groups.updateRows.length})`}>
                      {groups.updateRows.map((row) => (
                        <BatchRow
                          key={row.key}
                          label={row.title}
                          aside={row.path}
                          pill={<Pill tone="muted">{row.label}</Pill>}
                        />
                      ))}
                    </BatchGroup>
                  ) : null}
                  {groups.keptRows.length > 0 ? (
                    <BatchGroup header={`Kept as is (${groups.keptRows.length})`}>
                      {groups.keptRows.map((row) => (
                        <BatchRow
                          key={row.key}
                          label={row.title}
                          aside={`stamped ${row.label}; the run leaves it`}
                        />
                      ))}
                    </BatchGroup>
                  ) : null}
                  {groups.createRows.length > 0 ? (
                    <BatchGroup
                      header={`Create (${groups.createRows.length})`}
                      aside={<CreateChip state={state} label="New notes go to:" />}
                    >
                      {groups.createRows.map((row) => (
                        <BatchRow key={row.key} label={row.title} aside={row.path} />
                      ))}
                    </BatchGroup>
                  ) : null}
                </>
              ) : (
                <>
                  {groups.overwriteRows.length > 0 ? (
                    <BatchGroup header={`Overwrite (${groups.overwriteRows.length})`}>
                      {groups.overwriteRows.map((row) => (
                        <BatchRow
                          key={row.key}
                          label={row.title}
                          aside={row.path}
                          pill={<Pill tone="muted">{row.label}</Pill>}
                        />
                      ))}
                    </BatchGroup>
                  ) : null}
                  {groups.importRows.length > 0 ? (
                    <BatchGroup
                      header={`Import (${groups.importRows.length})`}
                      aside={
                        <CreateChip
                          state={state}
                          label="Notes without a literature note go to:"
                        />
                      }
                    >
                      {groups.importRows.map((row) => (
                        <BatchRow key={row.key} label={row.title} aside={row.path} />
                      ))}
                    </BatchGroup>
                  ) : null}
                </>
              )}
            </BatchModal>
          );
        }

        let overlay = null;
        if (state.run.phase === "confirm") {
          overlay = confirmModal;
        } else if (state.run.phase === "picker") {
          overlay = (
            <div className="relative">
              {confirmModal}
              <div
                className="absolute inset-0 flex items-start justify-center pt-6"
                style={{ background: "rgba(0,0,0,0.35)" }}
              >
                <CreatePicker state={state} />
              </div>
            </div>
          );
        } else if (state.run.phase === "progress") {
          overlay = (
            <BatchModal
              title={
                state.run.kind === "import" ? "Import notes" : "Update literature notes"
              }
            >
              <div className="mb-4">
                <ProgressBar value={state.run.progress} total={total} />
              </div>
              {groups.kind === "update" ? (
                <>
                  {groups.updateRows.map((row) => (
                    <BatchRow
                      key={row.key}
                      label={row.title}
                      pill={<Pill tone="muted">{row.label}</Pill>}
                      status={rowStatus(row, "done")}
                    />
                  ))}
                  {groups.keptRows.map((row) => (
                    <BatchRow
                      key={row.key}
                      label={row.title}
                      status={rowStatus(row, "kept")}
                    />
                  ))}
                  {groups.createRows.map((row) => (
                    <BatchRow
                      key={row.key}
                      label={row.title}
                      status={rowStatus(row, "done")}
                    />
                  ))}
                </>
              ) : (
                <>
                  {groups.overwriteRows.map((row) => (
                    <BatchRow
                      key={row.key}
                      label={row.title}
                      pill={<Pill tone="muted">{row.label}</Pill>}
                      status={rowStatus(row, "done")}
                    />
                  ))}
                  {groups.importRows.map((row) => (
                    <BatchRow
                      key={row.key}
                      label={row.title}
                      status={rowStatus(row, "done")}
                    />
                  ))}
                </>
              )}
            </BatchModal>
          );
        } else if (state.run.phase === "summary") {
          overlay = (
            <BatchModal
              title={
                state.run.kind === "import" ? "Import notes" : "Update literature notes"
              }
              footer={
                <button
                  onClick={actions.close}
                  className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                  style={{ background: "var(--accent)", color: "#ffffff" }}
                >
                  Close
                </button>
              }
            >
              <p className="text-ink text-[13px] leading-relaxed">
                {buildSummaryB(state, groups)}
              </p>
            </BatchModal>
          );
        }

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame overlay={overlay}>
              <LauncherCardB kind={state.run.kind} onStart={handleStart} />
            </ObsidianFrame>
            <Rail
              thesis="The confirm screen is already the one place the user reads before a run writes. Put the one decision there, preselected from the Companion or the last run, and open the informed picker only on demand."
              steps={[
                "Start",
                "Confirm (chip + live paths)",
                "Chip → picker",
                "Run",
                "Summary by Profile",
              ]}
              consent="Update rows show their stamp and are read-only; the select touches only the Create group."
            />
          </div>
        );
      }
      // --- Variant B END ---

      // --- App END ---

      createRoot(document.getElementById("root")).render(<VariantB />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
