      // --- Variant C END ---

      // --- Variant D ---
      function VariantD() {
        const { state, actions } = useProtoState();

        // The gist a blog post would actually link to, and the obsidian:// door that follows it.
        const GIST_URL = "https://gist.github.com/anna/reading-group.md";
        const SHARE_LINK = `obsidian://zotlit?profile=${GIST_URL}`;

        // Anna's own copy of the document she is about to share (SEND). Mirrors the plan's v1.0
        // manifest/body shape; the base file keeps its own copies module-private, so this variant
        // holds the text it renders for its own ShareSheet/FileText surfaces.
        const SEND_MANIFEST = {
          id: "anna.reading-group",
          name: "Reading group",
          version: "1.0.0",
          author: "Anna",
          description:
            "Chicago-style notes for the weekly reading group, with a shared author-list partial.",
          contract: 1,
          filename: "{{ zt.citekey }}.md",
          profileDefaults: {
            folder: "Reading/lit",
            citationStyle: "chicago-note",
          },
          language: "liquid",
          partials: [{ name: "authors", language: "liquid" }],
          frontmatter: [
            { key: "citekey", expr: "zt.citekey" },
            { key: "year", expr: "zt.date | date: '%Y'" },
            { key: "tags", value: ["reading-group"] },
            { key: "read-by", expr: "zt.dateAdded | date: '%Y-%m-%d'" },
          ],
        };
        const SEND_BODY = `# {{ zt.title }}

      {% render "authors" %}

      - **Year:** {{ zt.date | date: '%Y' }}
      - **Style:** Chicago (note)
      - **Folder:** Reading/lit

      {% managed %}
      ## This week
      - **Discussion date:**
      - **Led by:**
      {% endmanaged %}

      {% annotation %}
      > {{ annotation.text }}
      {% endannotation %}
      `;

        const ALT_ITEM = {
          title: "Silencing the Past",
          creators: [{ name: "Michel-Rolph Trouillot" }],
          date: "1995",
        };

        // A rendered note as a flat list of lines, for the live preview against the recipient's own
        // item — same shape SEND_BODY renders to, without needing a real Liquid engine.
        function renderLines(item, folder, style) {
          const authors = (item.creators ?? []).map((c) => c.name).join(", ");
          return [
            `# ${item.title}`,
            "",
            authors,
            "",
            `- Year: ${item.date}`,
            `- Style: ${style}`,
            `- Folder: ${folder}`,
            "",
            "This week",
            "- Discussion date:",
            "- Led by:",
          ];
        }

        // Which face the receipt tab shows: a brand-new file (take), the exact one already installed
        // (already — SYNC's second machine), or a newer version of one already installed (update —
        // EDITION's second-edition surface). Derived from the store, not tracked separately.
        function deriveReceiptMode(s) {
          const incoming = s.incoming;
          if (!incoming) return null;
          const existing =
            s.profiles.find((p) => p.packId === incoming.manifest.id) ?? null;
          if (!existing) return "take";
          if (incoming.manifest.version !== existing.packVersion)
            return "update";
          return "already";
        }

        const [settingsOpen, setSettingsOpen] = useState(false);
        const [settingsPage, setSettingsPage] = useState("profiles");
        const [sharePanelFor, setSharePanelFor] = useState(null);
        const [shareResult, setShareResult] = useState(null); // { target }
        const [linkCopied, setLinkCopied] = useState(false);
        const [receiptOpen, setReceiptOpen] = useState(false);
        const [useAltItem, setUseAltItem] = useState(false);
        const [approveOverwrite, setApproveOverwrite] = useState(false);
        const [confirmRevertId, setConfirmRevertId] = useState(null);
        const [chosenFolder, setChosenFolder] = useState("");
        const [chosenStyle, setChosenStyle] = useState("");

        // A scenario switch is a different researcher's vault; none of this variant's local UI state
        // should survive that.
        useEffect(() => {
          setSettingsOpen(false);
          setSettingsPage("profiles");
          setSharePanelFor(null);
          setShareResult(null);
          setLinkCopied(false);
          setReceiptOpen(false);
          setUseAltItem(false);
          setApproveOverwrite(false);
          setConfirmRevertId(null);
        }, [state.scenario]);

        useEffect(() => {
          if (state.incoming) {
            setChosenFolder(state.incoming.manifest.profileDefaults.folder);
            setChosenStyle(
              state.incoming.manifest.profileDefaults.citationStyle,
            );
          }
        }, [state.incoming?.manifest?.id, state.incoming?.manifest?.version]);

        const readingProfile =
          state.profiles.find((p) => p.label === "Reading group") ?? null;
        const mode = deriveReceiptMode(state);
        const incoming = state.incoming;
        const sharedProfiles = state.profiles.filter((p) => p.packId);

        function copyLink() {
          setLinkCopied(true);
          actions.exportProfile(readingProfile?.id ?? null, { target: "link" });
          setTimeout(() => setLinkCopied(false), 2000);
        }

        function onShareTarget(profileId, target) {
          setSharePanelFor(null);
          setShareResult({ profileId, target });
          actions.exportProfile(profileId, { target });
        }

        function checkForUpdates(p) {
          if (p.updateAvailable) {
            setReceiptOpen(true);
          } else {
            actions.notify(`"${p.label}" is up to date`);
          }
        }

        function confirmRevert(p) {
          if (p.noteCount === 0) actions.removeJustAddedProfile(p.id);
          else actions.revertProfile(p.id);
          setConfirmRevertId(null);
        }

        // --- The export entry + the exported file as plain text + the share link (SEND surface). ---
        function shareResultBlock() {
          if (!shareResult) return null;
          if (shareResult.target === "link") {
            return (
              <div className="border-line bg-ground mt-4 rounded-md border p-4">
                <div className="text-muted mb-2 text-[11px] tracking-[0.06em] uppercase">
                  Share link
                </div>
                <div className="flex items-center gap-2">
                  <span className="border-line bg-ground-2 min-w-0 flex-1 truncate rounded border px-2 py-[6px] font-mono text-[12px]">
                    {SHARE_LINK}
                  </span>
                  <button
                    onClick={copyLink}
                    className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[5px] text-[12px]"
                  >
                    {linkCopied ? "Copied" : "Copy"}
                  </button>
                </div>
                <p className="text-muted mt-2 text-[12px] leading-relaxed">
                  This link resolves to the same one file as "Save file…" and
                  "Copy as text." Nothing else in your vault is transmitted.
                </p>
              </div>
            );
          }
          return (
            <div className="mt-4">
              <div className="text-muted mb-2 text-[11px] tracking-[0.06em] uppercase">
                {shareResult.target === "file" ? "Saved file" : "Copied text"}
              </div>
              <FileText
                path="Reading group.md"
                source={manifestFileText(SEND_MANIFEST, SEND_BODY)}
              />
            </div>
          );
        }

        // --- The import entry: a mock blog strip above the workspace, one clickable share link. ---
        function blogStrip() {
          return (
            <div className="border-line bg-ground mb-5 overflow-hidden rounded-md border">
              <div className="border-line bg-ground-2 text-muted flex items-center gap-2 border-b px-3 py-[6px] font-mono text-[11px]">
                <span>anna-writes-about-lit-notes.example/reading-group</span>
              </div>
              <div className="px-4 py-3">
                <p className="text-ink/85 text-[13px] leading-relaxed">
                  "…here is the template our reading group uses. Click the link
                  below and Obsidian will open it for you — nothing installs
                  until you say so."
                </p>
                <button
                  onClick={() => setReceiptOpen(true)}
                  className="text-accent mt-2 cursor-pointer font-mono text-[12px] underline"
                >
                  {SHARE_LINK}
                </button>
              </div>
            </div>
          );
        }

        // --- The receipt tab: consent, second edition, and the "already have it" surfaces. ---
        function receiptTab() {
          if (!incoming || !mode) return null;
          const manifest = incoming.manifest;
          const partialNames = manifest.partials.map((p) => p.name);
          const styleInstalled = state.installedStyles.includes(chosenStyle);

          let files;
          if (mode === "update") {
            files = [
              {
                path: readingProfile.document,
                verdict: "would overwrite your edit",
              },
              ...partialNames.map((name) => ({
                path: `templates/_partials/${name}.md`,
                verdict: "unchanged",
              })),
            ];
          } else {
            const isNew = mode === "take";
            files = [
              {
                path: `templates/${manifest.name.toLowerCase().replace(/\s+/g, "-")}.md`,
                verdict: isNew ? "new" : "unchanged",
              },
              ...partialNames.map((name) => ({
                path: `templates/_partials/${name}.md`,
                verdict: isNew ? "new" : "unchanged",
              })),
            ];
          }
          const fields = manifest.frontmatter.map((f) => f.key);
          const previewItem = useAltItem ? ALT_ITEM : state.previewItem;

          return (
            <div className="max-w-[720px]">
              <div className="mb-3 flex items-center gap-2">
                <Pill tone="accent">Shared profile</Pill>
                <span className="text-muted text-[12px]">
                  a full tab, not a dialog — it stays until you close it
                </span>
              </div>

              <ManifestHeader manifest={manifest} />
              <div className="text-muted mt-2 text-[12px]">
                Source: <span className="font-mono">{GIST_URL}</span>
              </div>

              <div className="mt-5">
                <div className="mb-2 flex items-center justify-between">
                  <div className="text-muted text-[11px] tracking-[0.06em] uppercase">
                    Live preview
                  </div>
                  {mode !== "update" ? (
                    <button
                      onClick={() => setUseAltItem((v) => !v)}
                      className="text-muted cursor-pointer text-[12px] underline"
                    >
                      Try another item
                    </button>
                  ) : null}
                </div>
                {mode === "update" ? (
                  <NotePreview
                    title={state.previewItem.title}
                    lines={state.previewAfter}
                    diffAgainst={state.previewBefore}
                  />
                ) : (
                  <NotePreview
                    title={previewItem.title}
                    lines={renderLines(previewItem, chosenFolder, chosenStyle)}
                  />
                )}
              </div>

              <div className="mt-5 grid grid-cols-2 gap-6">
                <div>
                  <div className="text-muted mb-2 text-[11px] tracking-[0.06em] uppercase">
                    What enters your vault
                  </div>
                  <EntersYourVault files={files} fields={fields} />
                </div>
                <div>
                  <div className="text-muted mb-2 text-[11px] tracking-[0.06em] uppercase">
                    What you decide
                  </div>
                  {mode === "update" ? (
                    <p className="text-muted text-[13px] leading-relaxed">
                      Folder and citation style are already set from your first
                      install; only the document and frontmatter fields change.
                    </p>
                  ) : (
                    <>
                      <YourSettingsRow
                        label="Literature folder"
                        senderValue={manifest.profileDefaults.folder}
                        yourValue={chosenFolder}
                        onChangeYourValue={setChosenFolder}
                      />
                      <YourSettingsRow
                        label="Citation style"
                        senderValue={manifest.profileDefaults.citationStyle}
                        yourValue={chosenStyle}
                        onChangeYourValue={setChosenStyle}
                      />
                      {!styleInstalled ? (
                        <div className="mt-2 flex items-center gap-2">
                          <Pill tone="danger">not installed</Pill>
                          <button
                            onClick={() => actions.installStyle(chosenStyle)}
                            className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[3px] text-[12px]"
                          >
                            Install {chosenStyle}
                          </button>
                        </div>
                      ) : null}
                    </>
                  )}
                </div>
              </div>

              {mode === "update" ? (
                <label className="mt-4 flex cursor-pointer items-start gap-2 text-[13px]">
                  <input
                    type="checkbox"
                    className="mt-[3px]"
                    checked={approveOverwrite}
                    onChange={(e) => setApproveOverwrite(e.target.checked)}
                  />
                  <span>
                    I approve overwriting my edit to{" "}
                    <span className="font-mono text-[12px]">
                      {readingProfile.document}
                    </span>
                    .
                  </span>
                </label>
              ) : null}

              <p
                className={`mt-4 text-[14px] font-semibold ${
                  mode === "update" ? "text-danger" : "text-ink"
                }`}
              >
                {mode === "update"
                  ? `${readingProfile.noteCount} notes re-render on their next update.`
                  : "None of your existing notes change."}
              </p>

              <div className="mt-5 flex gap-2">
                {mode === "take" ? (
                  <>
                    <button
                      onClick={() => {
                        actions.importAsNewProfile({
                          folder: chosenFolder,
                          style: chosenStyle,
                        });
                        setReceiptOpen(false);
                      }}
                      className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                      style={{ background: "var(--accent)", color: "#ffffff" }}
                    >
                      Add to my vault
                    </button>

        // --- The "Shared profiles" settings page: identity, second edition and revert all live here.
        function sharedProfilesPage() {

        function settingsContent() {

                    {k === "profiles" ? "Profiles" : "Shared profiles"}
                  </button>

              </div>
              {settingsPage === "profiles" ? (

                  onDelete={() => {}}
                  rowExtras={(p) =>
                    p.id ? (
                      <span className="relative">
                        <button
                          onClick={(e) => {

                        >

        return (

            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >

              title={
                receiptOpen

              statusItems={

              overlay={
                settingsOpen ? (

                    {settingsContent()}
                  </SettingsModal>

            >
              {receiptOpen ? (
                receiptTab()
              ) : incoming ? (
                blogStrip()
              ) : (
                <p className="text-muted text-[13px]">
                  Open Settings (bottom status bar) → ZotLit to share "Reading
                  group."
                </p>
              )}
            </ObsidianFrame>
            <Rail
              thesis="Sharing happens outside the vault, so the door is a link — and a link from a stranger earns a full receipt page, not a modal."
              answers={[
                {
                  q: "What do I send?",
                  a: "Share… on the Profile row: save a file, copy the text, or copy a share link — all three are the same one file.",
                },
                {
                  q: "What do I do with this file?",
                  a: "Click the link — Obsidian opens a full receipt tab with your own item previewed before you say Add.",
                },
                {
                  q: "Is this the one I have?",
                  a: "Shared profiles lists the source URL and version already on file; the same link opens as Already in this vault.",
                },
                {
                  q: "Can I take the revision without losing my edit?",
                  a: "Check for updates reopens the same tab in update mode: before/after, an approval checkbox, Update or Keep mine.",
                },
              ]}
              steps={[
                "SEND: open Settings → ZotLit → Profiles, click Share… on Reading group, try each target.",
                "TAKE: switch scenario, click the link in the strip above the frame to open the receipt tab.",
                "In the receipt, try another item, then Add to my vault.",
                "SYNC: switch scenario, click the link again — note Already in this vault.",
                "EDITION: switch scenario, open Shared profiles, click Check for updates, review the before/after, approve, Update.",
                "On Shared profiles, click Revert on Reading group.",
              ]}

      }
      // --- Variant D END ---

      // --- Variant E ---
      // --- Variant E ---
      function VariantE() {
        const { state } = useProtoState();
        const scenario = state.scenario;
        const incoming = state.incoming;

        // Anna's own values for the five travelling settings, from the design plan's worked
        // example. The manifest schema only carries folder + citationStyle as profileDefaults; the
        // other three (import folder, the two annotation booleans) are bindings-only and have no
        // home in MANIFEST_V1 — this ledger is what gives them one.
        const ANNA_VALUES = {
          literatureFolder: "Reading/lit",
          citationStyle: "chicago-note",
          importFolder: "zotero_notes",
          coloredHighlights: "off",
          annotationsAsTemplate: "off",
        };
        const ROWS = [
          { key: "literatureFolder", label: "Literature folder" },
          { key: "citationStyle", label: "Citation style" },
          { key: "importFolder", label: "Imported-note folder" },
          { key: "coloredHighlights", label: "Colored highlights" },
          { key: "annotationsAsTemplate", label: "Annotations as template" },
        ];

        const existingReading =
          state.profiles.find((p) => p.packId === "anna.reading-group") ?? null;
        const fallback = profileById(state, null);
        const YOUR_VALUES = {
          literatureFolder:
            existingReading?.folder ?? fallback?.folder ?? "literatures",
          citationStyle:
            existingReading?.style ?? fallback?.style ?? "Built-in default",
          importFolder: existingReading
            ? ANNA_VALUES.importFolder
            : "Imported notes",
          coloredHighlights: existingReading
            ? ANNA_VALUES.coloredHighlights
            : "vault default (on)",
          annotationsAsTemplate: existingReading
            ? ANNA_VALUES.annotationsAsTemplate
            : "vault default (on)",
        };

        // --- Local UI state: none of this is mock data, it is which sheet/dialog is open. ---
        const [settingsOpen, setSettingsOpen] = useState(false);
        const [page, setPage] = useState("profiles"); // "profiles" | a profile id
        const [addMenuOpen, setAddMenuOpen] = useState(false);
        const [removeConfirm, setRemoveConfirm] = useState(false);

        const [shareFor, setShareFor] = useState(null); // profile id whose export checklist is open
        const [checks, setChecks] = useState({
          literatureFolder: true,
          citationStyle: true,
          importFolder: true,
          coloredHighlights: true,
          annotationsAsTemplate: true,
        });
        const [exportResult, setExportResult] = useState(null); // { path, text, extras }

        const [ledgerOpen, setLedgerOpen] = useState(false);
        const [choices, setChoices] = useState({});
        const [editionApproved, setEditionApproved] = useState(false);

        function openShare(profileId) {
          setChecks({
            literatureFolder: true,
            citationStyle: true,
            importFolder: true,
            coloredHighlights: true,
            annotationsAsTemplate: true,
          });
          setShareFor(profileId);
        }

        function runExport(target) {
          const p = profileById(state, shareFor);
          const ticked = ROWS.filter((r) => checks[r.key]);
          const untouched = ROWS.filter((r) => !checks[r.key]);
          const manifest = {
            ...MANIFEST_V1,
            profileDefaults: {
              folder: checks.literatureFolder
                ? p.folder
                : "(not shared — vault-local)",
              citationStyle: checks.citationStyle
                ? p.style
                : "(not shared — vault-local)",
            },
          };
          actions.exportProfile(p.id, {
            bindings: ticked.map((r) => r.label),
            target,
          });
          setExportResult({
            path: p.document,
            text: manifestFileText(manifest, BODY_V1),
            alsoTravels: ticked
              .filter(
                (r) =>
                  r.key !== "literatureFolder" && r.key !== "citationStyle",
              )
              .map((r) => r.label),
            notShared: untouched.map((r) => r.label),
          });
          setShareFor(null);
        }

        function openLedger() {
          const init = {};
          for (const r of ROWS) {
            // EDITION carries memory: Chen's bindings already match Anna's, so his prior choice on
            // every row reads as "theirs". TAKE and SYNC start undecided — the full ceremony.
            init[r.key] = scenario === "edition" ? "theirs" : null;
          }
          setChoices(init);
          setEditionApproved(false);
          setLedgerOpen(true);
          setAddMenuOpen(false);
        }

        function valueFor(key) {
          const c = choices[key];
          if (c === "theirs") return ANNA_VALUES[key];
          return YOUR_VALUES[key];
        }

        function previewLines() {
          const item = state.previewItem;
          if (!item) return [];
          return [
            `# ${item.title}`,
            "",
            item.creators.map((c) => c.name).join(", "),
            "",
            `- Year: ${item.date}`,
            `- Style: ${valueFor("citationStyle") === "chicago-note" ? "Chicago (note)" : valueFor("citationStyle")}`,
            `- Folder: ${valueFor("literatureFolder")}`,
            `- Colored highlights: ${valueFor("coloredHighlights")}`,
            `- Annotations as template: ${valueFor("annotationsAsTemplate")}`,
          ];
        }

        const decided = ROWS.filter((r) => choices[r.key]).length;
        const theirsCount = ROWS.filter(
          (r) => choices[r.key] === "theirs",
        ).length;
        const mineCount = ROWS.filter((r) => choices[r.key] === "mine").length;
        const allDecided = decided === ROWS.length;

        function applyLedger() {
          if (!allDecided) return;
          if (scenario === "take") {
            actions.importAsNewProfile({
              folder: valueFor("literatureFolder"),
              style: valueFor("citationStyle"),
            });
          } else if (scenario === "sync") {
            actions.updateExistingProfile(existingReading.id, {
              overwriteEdited: false,
            });
          } else if (scenario === "edition") {
            if (!editionApproved) return;
            actions.updateExistingProfile(existingReading.id, {
              overwriteEdited: true,
            });
          }
          setLedgerOpen(false);
        }

        function keepAsIs() {
          if (existingReading) actions.keepMine(existingReading.id);
          setLedgerOpen(false);
        }

        const documentPath = existingReading
          ? existingReading.document
          : `templates/${incoming?.manifest.name.toLowerCase().replace(/\s+/g, "-")}.md`;
        const documentVerdict = !existingReading
          ? "new"
          : existingReading.documentEdited
            ? "would overwrite your edit"
            : "unchanged";

        // --- Ledger: the ceremony this variant is built to let show. Same body for TAKE, SYNC and
        // EDITION — what differs is which columns light up (same as here / differs; the previous
        // choice; the blocked-until-approved document row). ---
        function Ledger() {
          return (
            <div className="border-line bg-ground flex max-h-[86%] w-[680px] flex-col overflow-hidden rounded-lg border shadow-2xl">
              <div className="border-line flex shrink-0 items-center justify-between border-b px-5 py-3">
                <div className="text-[16px] font-semibold">
                  {scenario === "edition"
                    ? "A new edition arrived"
                    : "Add profile from a file"}
                </div>
                <button
                  onClick={() => setLedgerOpen(false)}
                  className="text-muted cursor-pointer"
                  aria-label="Close"
                >
                  <X size={16} />
                </button>
              </div>
              <div className="min-h-0 flex-1 overflow-y-auto px-5 py-4">
                <ManifestHeader manifest={incoming.manifest} />

                <div className="mt-4">
                  {scenario === "edition" ? (
                    <NotePreview
                      title="Coser, The Functions of Social Conflict — before → after"
                      lines={state.previewAfter}
                      diffAgainst={state.previewBefore}
                    />
                  ) : (
                    <NotePreview
                      title={`Preview against ${state.previewItem?.title ?? "your item"}`}
                      lines={previewLines()}
                    />
                  )}
                </div>

                <div className="mt-4">
                  <EntersYourVault
                    files={[{ path: documentPath, verdict: documentVerdict }]}
                    fields={incoming.manifest.frontmatter.map((f) => f.key)}
                  />
                </div>

                {documentVerdict === "would overwrite your edit" ? (
                  <div className="mt-3">
                    <Banner
                      tone="danger"
                      text={
                        <span>
                          This document is your own edited "Key quotes" heading.
                          Applying overwrites it. 40 notes re-render on their
                          next update. Approve to continue.
                        </span>
                      }
                    />
                    <label className="flex cursor-pointer items-center gap-2 text-[13px]">
                      <input
                        type="checkbox"
                        checked={editionApproved}
                        onChange={(e) => setEditionApproved(e.target.checked)}
                      />
                      <span>I understand this overwrites my edit</span>
                    </label>
                  </div>
                ) : null}

                <div className="mt-5 flex items-center gap-2">
                  <Pill tone="accent">5 choices</Pill>
                  <span className="text-muted text-[12px]">
                    {decided} of 5 decided · {theirsCount} use theirs ·{" "}
                    {mineCount} keep mine
                  </span>
                </div>

                <div className="mt-2 flex flex-col">
                  {ROWS.map((r) => {
                    const same = ANNA_VALUES[r.key] === YOUR_VALUES[r.key];
                    return (
                      <div key={r.key} className="py-1">
                        <YourSettingsRow
                          label={r.label}
                          senderValue={ANNA_VALUES[r.key]}
                          yourValue={YOUR_VALUES[r.key]}
                          choice={choices[r.key]}
                          onChoose={(c) =>
                            setChoices((prev) => ({ ...prev, [r.key]: c }))
                          }
                        />
                        <div className="text-muted flex items-center gap-2 pl-0 text-[11px]">
                          <span>you: {YOUR_VALUES[r.key]}</span>
                          {scenario === "sync" ? (
                            <Pill tone={same ? "accent" : "danger"}>
                              {same ? "same as here" : "differs"}
                            </Pill>
                          ) : null}
                          {scenario === "edition" ? (
                            <span>
                              You chose Anna's value last time. Keep it again?
                            </span>
                          ) : null}
                          {r.key === "citationStyle" &&
                          choices.citationStyle === "theirs" &&
                          !state.installedStyles.includes("chicago-note") ? (
                            <Pill tone="danger">
                              not installed in your vault
                            </Pill>
                          ) : null}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {scenario === "take" ? (
                  <p className="text-muted mt-4 text-[13px]">
                    None of your existing notes change.
                  </p>
                ) : null}
              </div>
              <div className="border-line bg-ground-2 flex shrink-0 justify-end gap-2 border-t px-5 py-3">
                {existingReading ? (
                  <button
                    onClick={keepAsIs}
                    className="border-line bg-ground text-ink cursor-pointer rounded-md border px-3 py-[6px] text-[13px]"
                  >
                    Keep everything as is
                  </button>
                ) : null}
                <button
                  onClick={applyLedger}
                  disabled={
                    !allDecided ||
                    (documentVerdict === "would overwrite your edit" &&
                      !editionApproved)
                  }
                  className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                  style={{
                    background: "var(--accent)",
                    color: "#ffffff",
                    opacity:
                      !allDecided ||
                      (documentVerdict === "would overwrite your edit" &&
                        !editionApproved)
                        ? 0.45
                        : 1,
                  }}
                >
                  {scenario === "take" ? "Add profile" : "Apply"}
                </button>
              </div>
            </div>
          );
        }

        function ExportChecklist() {
          const p = profileById(state, shareFor);
          const ticked = ROWS.filter((r) => checks[r.key]).length;
          return (
            <Dialog
              width={520}
              title={`Share "${p.label}"`}
              body={
                <div className="flex flex-col gap-3">
                  <div>
                    <div className="text-muted mb-1 text-[11px] tracking-[0.06em] uppercase">
                      Always included
                    </div>
                    <div className="flex flex-col gap-[3px] text-[13px]">
                      <div className="font-mono text-[12px]">{p.document}</div>
                      <div className="flex flex-wrap gap-1">
                        {MANIFEST_V1.frontmatter.map((f) => (
                          <Pill key={f.key} tone="muted">
                            {f.key}
                          </Pill>
                        ))}
                      </div>
                      <div className="font-mono text-[12px]">
                        filename: {MANIFEST_V1.filename}
                      </div>
                    </div>
                  </div>
                  <div className="text-[13px] font-semibold">
                    {ticked} of {ROWS.length} settings will travel
                  </div>
                </div>
              }
              checkboxes={ROWS.map((r) => ({
                label: `${r.label}: ${r.key === "literatureFolder" ? p.folder : r.key === "citationStyle" ? p.style : ANNA_VALUES[r.key]}`,
                checked: checks[r.key],
                onChange: (v) => setChecks((prev) => ({ ...prev, [r.key]: v })),
              }))}
              actions={[
                { label: "Cancel", onClick: () => setShareFor(null) },
                {
                  label: "Copy as text",
                  onClick: () => runExport("clipboard"),
                },
                {
                  label: "Save file…",
                  onClick: () => runExport("file"),
                  cta: true,
                },
              ]}
            />
          );
        }

        function ExportResult() {
          return (
            <div className="border-line bg-ground flex max-h-[86%] w-[600px] flex-col overflow-hidden rounded-lg border shadow-2xl">
              <div className="border-line flex shrink-0 items-center justify-between border-b px-5 py-3">
                <div className="text-[16px] font-semibold">
                  The exported file
                </div>
                <button
                  onClick={() => setExportResult(null)}
                  className="text-muted cursor-pointer"
                  aria-label="Close"
                >
                  <X size={16} />
                </button>
              </div>
              <div className="min-h-0 flex-1 overflow-y-auto px-5 py-4">
                <FileText path={exportResult.path} source={exportResult.text} />
                <div className="text-muted mt-3 text-[12px] leading-relaxed">
                  {exportResult.alsoTravels.length ? (
                    <div>
                      Also travels as a suggested vault setting:{" "}
                      {exportResult.alsoTravels.join(", ")}.
                    </div>
                  ) : null}
                  {exportResult.notShared.length ? (
                    <div>
                      Not shared, stays yours:{" "}
                      {exportResult.notShared.join(", ")}.
                    </div>
                  ) : null}
                </div>
              </div>
              <div className="border-line bg-ground-2 flex shrink-0 justify-end border-t px-5 py-3">
                <button
                  onClick={() => setExportResult(null)}
                  className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                  style={{ background: "var(--accent)", color: "#ffffff" }}
                >
                  Done
                </button>
              </div>
            </div>
          );
        }

        function ProfilesView() {
          return (
            <ProfilesPage
              onOpen={(id) => setPage(id)}
              onDelete={(id) => actions.removeJustAddedProfile(id)}
              rowExtras={(p) => (
                <>
                  {packLabel(p) ? (
                    <Pill tone="muted">{packLabel(p)}</Pill>
                  ) : null}
                  {p.document && p.document !== "Built-in template" ? (
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        openShare(p.id);
                      }}
                      className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[3px] text-[12px]"
                    >
                      Share…
                    </button>
                  ) : null}
                </>
              )}
              footer={
                <div className="relative mt-3">
                  <button
                    onClick={() => setAddMenuOpen((v) => !v)}
                    className="border-line bg-ground text-ink flex cursor-pointer items-center gap-1 rounded-md border px-3 py-[6px] text-[13px]"
                  >
                    <Plus size={14} /> Add profile <ChevronDown size={12} />
                  </button>
                  {addMenuOpen ? (
                    <div className="border-line bg-ground absolute top-full left-0 z-10 mt-1 w-[220px] overflow-hidden rounded-md border shadow-2xl">
                      <button
                        onClick={() => setAddMenuOpen(false)}
                        className="text-ink flex w-full cursor-pointer items-center px-3 py-2 text-left text-[13px]"
                      >
                        Blank
                      </button>
                      <button
                        onClick={() =>
                          incoming ? openLedger() : setAddMenuOpen(false)
                        }
                        className="text-ink flex w-full cursor-pointer items-center px-3 py-2 text-left text-[13px]"
                      >
                        From a file…{" "}
                        {incoming ? (
                          <span className="text-muted font-mono text-[11px]">
                            {incoming.filename}
                          </span>
                        ) : null}
                      </button>
                      <button
                        onClick={() => setAddMenuOpen(false)}
                        className="text-ink flex w-full cursor-pointer items-center px-3 py-2 text-left text-[13px]"
                      >
                        From pasted text…
                      </button>
                    </div>
                  ) : null}
                </div>
              }
            />
          );
        }

        function ProfileView() {
          const p = profileById(state, page);
          const record = state.installRecords[page];
          return (
            <ProfilePage
              profileId={page}
              onBack={() => setPage("profiles")}
              footer={
                <div className="flex flex-col gap-3">
                  {record ? (
                    <>
                      <div className="text-muted text-[12px] leading-relaxed">
                        Taken in from {record.packId} v{record.version} on{" "}
                        {record.installedAt}.
                      </div>
                      <div className="flex gap-2">
                        <button
                          onClick={() => actions.revertProfile(p.id)}
                          className="border-line bg-ground text-ink flex cursor-pointer items-center gap-1 rounded-md border px-3 py-[6px] text-[13px]"
                        >
                          <RotateCcw size={13} /> Revert to v{record.version}
                        </button>
                        {p.noteCount === 0 ? (
                          removeConfirm ? (
                            <>
                              <span className="text-[13px]">
                                Remove this profile? 0 notes use it.
                              </span>
                              <button
                                onClick={() => {
                                  actions.removeJustAddedProfile(p.id);
                                  setRemoveConfirm(false);
                                  setPage("profiles");
                                }}
                                className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                                style={{
                                  background: "var(--danger)",
                                  color: "#ffffff",
                                }}
                              >
                                Confirm
                              </button>
                              <button
                                onClick={() => setRemoveConfirm(false)}
                                className="border-line bg-ground text-ink cursor-pointer rounded-md border px-3 py-[6px] text-[13px]"
                              >
                                Cancel
                              </button>
                            </>
                          ) : (
                            <button
                              onClick={() => setRemoveConfirm(true)}
                              className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                              style={{
                                background: "var(--danger)",
                                color: "#ffffff",
                              }}
                            >
                              <Trash2 size={13} className="mr-1 inline" />{" "}
                              Remove
                            </button>
                          )
                        ) : null}
                      </div>
                    </>
                  ) : (
                    <button
                      onClick={() => actions.removeJustAddedProfile(p.id)}
                      className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                      style={{ background: "var(--danger)", color: "#ffffff" }}
                    >
                      Delete profile
                    </button>
                  )}
                </div>
              }
            />
          );
        }

        const overlay = ledgerOpen ? (
          Ledger()
        ) : exportResult ? (
          ExportResult()
        ) : shareFor ? (
          ExportChecklist()
        ) : settingsOpen ? (
          <SettingsModal open onClose={() => setSettingsOpen(false)}>
            {page === "profiles" ? ProfilesView() : ProfileView()}
          </SettingsModal>
        ) : null;

        const answers = [
          {
            q: "What do I send?",
            a: "Tick what travels — the document, 4 frontmatter fields and the filename always go; five settings are a checklist.",
          },
          {
            q: "What do I do with this file?",
            a: "Answer a 5-row ledger, Use theirs or Keep mine, before Add profile even turns on.",
          },
          {
            q: "Is this the one I already have?",
            a: "Pack id + version identify the file; the ledger marks each setting same as here or differs.",
          },
          {
            q: "Can I take the revision without losing my edit?",
            a: "The ledger returns with last time's choices pre-set; the document row blocks until you approve the overwrite.",
          },
        ];

        const steps =
          scenario === "send"
            ? [
                "Open Settings → Profiles.",
                'Click Share… on "Reading group".',
                "Tick or untick a setting and watch the count change.",
                "Save file… or Copy as text, then read the result as plain text.",
              ]
            : scenario === "take"
              ? [
                  "Open Settings → Profiles.",
                  "Click + Add profile → From a file….",
                  "Answer all 5 rows — watch the preview re-render live.",
                  "Add profile turns on once every row is decided.",
                ]
              : scenario === "sync"
                ? [
                    "Open Settings → Profiles → + Add profile → From a file… (same file, second machine).",
                    "Check the literature folder row: same as here, or differs?",
                    "Decide all 5 rows, then Sync or Keep everything as is.",
                  ]
                : [
                    "Open Settings → Profiles → + Add profile → From a file… (v1.1 arrives).",
                    "See the document row: would overwrite your edit.",
                    "Approve the overwrite, then Apply — or Keep everything as is.",
                  ];

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame overlay={overlay}>
              <div className="border-line bg-ground-2 mb-2 flex items-center gap-2 rounded-md border px-3 py-2">
                <Settings size={14} className="text-muted" />
                <span className="text-[13px]">Settings → Profiles</span>
                <div className="flex-1" />
                <button
                  onClick={() => {
                    setSettingsOpen(true);
                    setPage("profiles");
                  }}
                  className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[3px] text-[12px]"
                >
                  Open
                </button>
              </div>
            </ObsidianFrame>
            <Rail
              thesis="Both sides decide, setting by setting. The sender curates; the recipient adopts or keeps. Count the choices this asks of a first-year student — that count is the verdict."
              answers={answers}
              steps={steps}
            />
          </div>
        );
      }
      // --- Variant E END ---
      // --- Variant E END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Baseline (no door)", component: VariantA },
        { key: "B", name: "Install a style", component: VariantB },
        { key: "C", name: "The file is the profile", component: VariantC },
        { key: "D", name: "Share link + receipt page", component: VariantD },
        { key: "E", name: "Adopt or keep mine", component: VariantE },
      ];

      const SCENARIO_PRESETS = [
        { id: "send", label: "Send: Anna shares Reading group (40)" },
        { id: "take", label: "Take: Ben, no style, no folder" },
        { id: "sync", label: "Sync: laptop + desktop" },
        { id: "edition", label: "Edition: Chen edited v1.0, v1.1 arrives" },
      ];

      function App() {
        const { state } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        return (
          <div className="bg-ground text-ink font-body flex h-screen flex-col">
            <div
              style={{
                flex: "none",
                background: "#1e293b",
                color: "#f8fafc",
                padding: "0.4rem 1rem",
                display: "flex",
                alignItems: "center",
                gap: "1rem",
                fontSize: "0.875rem",
                zIndex: 9999,
              }}
            >
              <button
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={{
                  background: "none",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  fontSize: "1.25rem",
                }}
              >
                ←
              </button>
              <span style={{ whiteSpace: "nowrap" }}>
                {V.key} — {V.name}
              </span>
              <button
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={{
                  background: "none",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  fontSize: "1.25rem",
                }}
              >
                →
              </button>
              <span
                style={{
                  width: "1px",
                  alignSelf: "stretch",
                  background: "rgba(248,250,252,0.25)",
                }}
              />
              {SCENARIO_PRESETS.map((p) => (
                <button
                  key={p.id}
                  onClick={() => actions.setScenario(p.id)}
                  style={{
                    background:
                      state.scenario === p.id ? "#f8fafc" : "transparent",
                    color: state.scenario === p.id ? "#1e293b" : "inherit",
                    border: "1px solid rgba(248,250,252,0.25)",
                    borderRadius: "9999px",
                    padding: "0.15rem 0.6rem",
                    cursor: "pointer",
                    fontSize: "0.75rem",
                    whiteSpace: "nowrap",
                  }}
                >
                  {p.label}
                </button>
              ))}
            </div>
            <div className="min-h-0 flex-1">
              <V.component />
            </div>
          </div>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
