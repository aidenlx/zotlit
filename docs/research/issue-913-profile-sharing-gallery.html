<!--
  Prototype v2 — Profile export and import from the academic user side (ticket #913, map #835)

  This gallery is RE-FOUNDED on ADR 0031, "A Literature Note Profile is its document"
  (docs/adr/0031-a-literature-note-profile-is-its-document.md), and on its implementation in
  #917. The v1 gallery (five variants, commit f6ccb3c3b) modelled a Profile as a settings
  record pointing at a document, installed by a Pack service with install records and revert.
  None of that exists any more.

  THE DESIGN PLAN FOR THIS FILE
  tmp/proto-913/issue-913-profile-sharing-plan.md — read it first. It defines the four
  scenarios, the four variants, the shared store contract and the shared primitives contract
  that this file implements. tmp/proto-913/plan-v1.md is the superseded plan, kept for context.

  WHAT THE FORMAT NOW IS
  Every templates/zotlit-profile.<slug>.md in the vault IS a Profile, the moment it is there
  — by paste, sync, git or drag. Nothing registers or installs. The manifest carries the
  Profile ID (`id`, a 12-character Nano ID, minted and never authored), `name`, `version`,
  `author`, `description`, `contract`, `filename`, the five bindings as flat sparse keys
  (`folder`, `citationStyle`, `importFolder`, `importColoredHighlights`,
  `importAnnotationsAsTemplate`), `language`, `partials` and `frontmatter`. There is no
  `profileDefaults`. A file arriving with an ID the vault already holds is a SECOND EDITION of
  that Profile, never a new one; two files carrying one ID are BOTH excluded from the registry
  (`duplicate-profile-id`) and their notes hit the unknown-Profile backstop. The Default
  Profile is the settings record, and becomes a file only when ejected as
  zotlit-profile.default.md with the reserved `id: default` and no bindings.

  WHAT THE TICKET STILL HAS TO RULE
    1. the export entry, and what the shareable copy looks like as plain text;
    2. the import seam for text from OUTSIDE the vault — preview, then write — with folder and
       style editable before anything is written;
    3. the second-edition consequences when the arriving ID is already held, reached both at
       the seam and IN PLACE (a file that simply appeared beside the one held);
    4. going back, with no install records to revert to.

  FOUR SCENARIOS (the switcher drives every variant through all four)
    1. SEND     Anna (postdoc) owns "Reading group" (id k7Qm2xLp9VwE, v1.0, 40 notes +
                6 Imported Notes, folder Reading/lit, style chicago-note, renders the shared
                `authors` partial). "What do I send?"
    2. TAKE     Ben (first year) has only the Default; chicago-note is not installed and
                Reading/lit does not exist. He has the text from a blog post. "What do I do
                with this?" Zero notes are at risk.
    3. SYNC     Dr. Reyes (supervisor) holds k7Qm2xLp9VwE with a locally changed folder; the
                laptop's copy of the same file arrived beside it as
                zotlit-profile.reading-group.k7Qm2xLp9VwE.md. Both are excluded and 40 notes
                went stale with no dialog at all. "Is this the one I already have?"
    4. EDITION  Chen (PhD candidate) has v1.0 and added "## Key quotes" inside the managed
                block; Anna publishes v1.1 (new `read-by` frontmatter entry, changed body).
                "Can I take the revision without losing my edit, and which notes change?"

  FOUR VARIANTS — structurally different answers to "where is the seam, and what is a second
  edition"
    A  Drop it in       — no seam; the file explorer and the diagnostics are the whole UI.
    B  Import sheet     — settings-first; one sheet per act, the Zotero CSL model.
    C  Open it first    — the workspace tab is the consent surface; ADR 0017 taken literally.
    D  Always additive  — never replace; a second edition is a new Profile and notes move.
-->

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // --- Shared ---
      // The prototype store, re-founded on ADR 0031: `files` is the vault and the only source

      // whose id is unique, plus the Default settings record. No install records, no revert.
      // One module-level object, a listener set, and useSyncExternalStore. Variants never
      // receive props — they read `useProtoState()` and call `actions`.

      const TEMPLATE_FOLDER = "templates";

      // 12-char Nano IDs, minted once and written into the manifest. The note stamp points here.
      const READING = "k7Qm2xLp9VwE";

      // A vault-global partial that lives beside the documents, not inside them. Copy-pasting a

      function stamp() {
        const d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
      }

      function slugOf(name) {
        return name.trim().toLowerCase().replace(/\s+/g, "-");
      }

      function mintId() {
        const alphabet =
          "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let out = "";
        for (let i = 0; i < 12; i++)
          out += alphabet[Math.floor(Math.random() * alphabet.length)];
        return out;
      }

      function profileFile(manifest, body, extra) {
        const slug = slugOf(manifest.name);
        return {
          path: `${TEMPLATE_FOLDER}/zotlit-profile.${slug}.md`,
          kind: "profile",
          manifest,
          body,
          edited: false,
          excluded: null,
          ...extra,
        };

      // --- Manifest text -------------------------------------------------------
      // The one place a manifest + body pair becomes the text a researcher reads on disk or
      // pastes into a chat window. `includeFolders` decides whether the sender's own location
      // keys travel; `bundlePartials` bundles every partial the body renders into the manifest.
      function manifestText(manifest, body, options) {
        const { includeFolders = true, bundlePartials = false } = options ?? {};
        const rendered = [...(body ?? "").matchAll(/\{%\s*render\s+"([^"]+)"/g)]
          .map((m) => m[1])
          .filter((name, i, all) => all.indexOf(name) === i);
        const known = [...VAULT_PARTIALS, ...(manifest.partials ?? [])];
        const partials = bundlePartials
          ? rendered
              .map((name) => known.find((p) => p.name === name))
              .filter(Boolean)
          : (manifest.partials ?? []);

        const lines = [
          `id: ${manifest.id}`,
          `name: ${manifest.name}`,
          `version: "${manifest.version}"`,
        ];
        if (manifest.author) lines.push(`author: ${manifest.author}`);
        if (manifest.description)
          lines.push(`description: ${manifest.description}`);
        lines.push(`contract: ${manifest.contract}`);
        lines.push(`filename: "${manifest.filename}"`);
        if (manifest.citationStyle !== undefined)
          lines.push(`citationStyle: ${manifest.citationStyle}`);
        if (includeFolders) {
          if (manifest.folder !== undefined)
            lines.push(`folder: ${manifest.folder}`);
          if (manifest.importFolder !== undefined)
            lines.push(`importFolder: ${manifest.importFolder}`);
        }
        if (manifest.importColoredHighlights !== undefined)
          lines.push(
            `importColoredHighlights: ${manifest.importColoredHighlights}`,
          );
        if (manifest.importAnnotationsAsTemplate !== undefined)
          lines.push(
            `importAnnotationsAsTemplate: ${manifest.importAnnotationsAsTemplate}`,
          );
        lines.push(`language: ${manifest.language}`);
        if (partials.length) {
          lines.push("partials:");
          for (const p of partials)
            lines.push(
              `  - name: ${p.name}`,
              `    language: ${p.language}`,
              `    source: >-`,
              `      ${p.source}`,
            );
        }
        if (manifest.frontmatter?.length) {
          lines.push("frontmatter:");
          for (const f of manifest.frontmatter)
            lines.push(
              `  - key: ${f.key}`,
              f.expr !== undefined
                ? `    expr: "${f.expr}"`
                : `    value: ${JSON.stringify(f.value)}`,
            );
        }
        return `---\n${lines.join("\n")}\n---\n\n${body ?? ""}`;
      }

      // The exported copy: partials bundled in, the sender's folders left out unless asked for.
      export function shareableText(profile, options) {
        const { includeFolders = false } = options ?? {};
        if (!profile?.manifest) return "";
        return manifestText(profile.manifest, profile.body, {
          includeFolders,
          bundlePartials: true,
        });
      }

      // The text of a file as it sits in the vault.
      export function fileText(file) {
        if (!file) return "";
        if (file.kind === "profile" || file.manifest)
          return manifestText(file.manifest, file.body);
        return file.body ?? "";

      // Notes get their path from the folder the Profile binds, falling back to the Default's.
      function seedNotes(preset) {
        const bound = new Map([[DEFAULT_ID, preset.defaults.folder]]);
        for (const f of preset.files)
          if (f.kind === "profile" && f.manifest)
            bound.set(
              f.manifest.id,
              f.manifest.folder ?? preset.defaults.folder,
            );
        return SAMPLE_NOTES.filter((n) => bound.has(n.profileId)).map((n) => ({
          ...n,
          path: `${bound.get(n.profileId)}/${n.key}.md`,
        }));
      }

      function seed(scenario) {
        const build = SCENARIOS[scenario] ?? SCENARIOS.send;
        const preset = build();
        return {
          scenario,
          persona: preset.persona,
          templateFolder: TEMPLATE_FOLDER,
          defaults: preset.defaults,
          installedStyles: preset.installedStyles,
          files: preset.files,
          notes: seedNotes(preset),
          tally: preset.tally,
          incoming: null,
          incomingSeed: preset.incomingSeed,
          previewItem: preset.previewItem,
          activeFile: preset.activeFile,
          lastExport: null,
          trash: [],
          notices: [],
          log: [],
        };
      }

      let state = seed("send");
      const listeners = new Set();

      function subscribe(fn) {
        listeners.add(fn);
        return () => listeners.delete(fn);
      }

      function getSnapshot() {
        return state;
      }

      function setState(next) {
        state = next;
        for (const fn of listeners) fn();
      }

      function logged(next, text) {
        return {
          ...next,
          log: [{ t: stamp(), text }, ...next.log].slice(0, 40),
        };
      }

      export function useProtoState() {
        const snapshot = useSyncExternalStore(subscribe, getSnapshot);
        return { state: snapshot, actions };
      }

      // --- Derived -------------------------------------------------------------

      function isProfilePath(state, path) {
        const dir = path.slice(0, path.lastIndexOf("/"));
        const name = path.slice(path.lastIndexOf("/") + 1);
        return (
          dir === state.templateFolder && name.startsWith("zotlit-profile.")
        );
      }

      // Every templates/zotlit-profile.*.md IS a Profile, plus the Default settings record.
      // A file whose ID another file also carries is excluded — and so is the other one.
      export function profiles(state) {
        const docs = state.files.filter(
          (f) => f.kind === "profile" && f.manifest,
        );
        const seen = new Map();
        for (const f of docs)
          seen.set(f.manifest.id, (seen.get(f.manifest.id) ?? 0) + 1);

        const ejected = docs.find((f) => f.manifest.id === DEFAULT_ID) ?? null;
        const tallyOf = (id) => state.tally[id] ?? { notes: 0, imported: 0 };

        const list = [
          {
            id: DEFAULT_ID,
            name: "Default",
            isDefault: true,
            folder: state.defaults.folder,
            importFolder: state.defaults.importFolder,
            style: state.defaults.style,
            document: ejected ? ejected.path : "Built-in template",
            path: ejected ? ejected.path : null,
            manifest: ejected ? ejected.manifest : null,
            body: ejected ? ejected.body : null,
            edited: ejected ? ejected.edited : false,
            excluded: null,
            noteCount: tallyOf(DEFAULT_ID).notes,
            importedCount: tallyOf(DEFAULT_ID).imported,
          },
        ];

        for (const f of docs) {
          if (f.manifest.id === DEFAULT_ID) continue;
          const t = tallyOf(f.manifest.id);
          list.push({
            id: f.manifest.id,
            name: f.manifest.name,
            isDefault: false,
            folder: f.manifest.folder ?? state.defaults.folder,
            importFolder:
              f.manifest.importFolder ?? state.defaults.importFolder,
            style: f.manifest.citationStyle ?? state.defaults.style,
            document: f.path,
            path: f.path,
            manifest: f.manifest,
            body: f.body,
            edited: !!f.edited,
            excluded:
              f.excluded ??
              (seen.get(f.manifest.id) > 1 ? "duplicate-profile-id" : null),
            noteCount: t.notes,
            importedCount: t.imported,
          });
        }
        return list;
      }

      export function profileById(state, id) {
        return profiles(state).find((p) => p.id === (id ?? DEFAULT_ID)) ?? null;
      }

      // The label a note's stamp resolves to: name plus the ID that made the match.
      export function stampLabel(profile) {
        if (!profile) return "Unknown profile";
        return `${profile.name} (${profile.id})`;
      }

      // `{folder} · {style} · {document}` — the settings row's description line.
      export function profileDisplay(profile) {
        return [profile.folder, profile.style, profile.document].join(" · ");
      }

      export function notesOf(state, profileId) {
        return state.notes.filter(
          (n) => n.profileId === (profileId ?? DEFAULT_ID),
        );
      }

      export function activeFileRecord(state) {
        return state.files.find((f) => f.path === state.activeFile) ?? null;
      }

      export function activeNote(state) {
        return state.notes.find((n) => n.path === state.activeFile) ?? null;
      }

      // A note whose Profile is excluded or missing waits at the unknown-Profile backstop.
      export function staleNotes(state) {
        const live = new Set(
          profiles(state)
            .filter((p) => !p.excluded)
            .map((p) => p.id),
        );
        return state.notes.filter((n) => !live.has(n.profileId));
      }

      // Renders one Profile against one of the RECIPIENT's own items. Liquid, roughly.
      export function renderNote(profile, item) {
        if (!profile || !item) return [];
        const authors = (item.creators ?? []).map((c) => c.name).join(", ");
        const text = (profile.body ?? "")
          .replace(/\{%\s*render\s+"authors"\s*%\}/g, authors)
          .replace(/\{\{\s*zt\.title\s*\}\}/g, item.title)
          .replace(/\{\{\s*zt\.citekey\s*\}\}/g, item.key)
          .replace(/\{\{\s*zt\.date[^}]*\}\}/g, item.date)
          .replace(/\{%[^%]*%\}/g, "")
          .replace(/\*\*/g, "");
        const out = [];
        for (const raw of text.split("\n")) {
          const line = raw.trimEnd();
          if (line.includes("{{")) continue;
          if (line === "" && out[out.length - 1] === "") continue;
          out.push(line);
        }
        while (out.length && out[out.length - 1] === "") out.pop();
        return out;
      }

      // Line-level diff of two rendered notes: removed lines first, then the new text.
      export function diffLines(a, b) {
        const before = a ?? [];
        const after = b ?? [];
        const rows = [];
        for (const l of before)
          if (!after.includes(l)) rows.push({ text: l, mark: "removed" });
        for (const l of after)
          rows.push({ text: l, mark: before.includes(l) ? null : "added" });
        return rows;
      }

      // --- Actions -------------------------------------------------------------

      let noticeSeq = 0;

      function pushNotice(s, text, action) {
        const id = ++noticeSeq;
        setTimeout(() => actions.dismissNotice(id), action ? 10000 : 6000);
        return { ...s, notices: [...s.notices, { id, text, action }] };
      }

      function replaceFile(files, path, patch) {
        return files.map((f) => (f.path === path ? { ...f, ...patch } : f));
      }

      export const actions = {
        setScenario(scenario) {
          setState(logged(seed(scenario), `Scenario: ${scenario}`));
        },

        // SEND: the shareable copy. Folders are left out unless asked for; partials always
        // travel, because a hand copy-paste loses them silently.
        exportProfile(id, options) {
          const {
            includeFolders = false,
            target = "clipboard",
            version = null,
          } = options ?? {};
          const p = profileById(state, id);
          if (!p?.manifest) return null;
          const manifest = version ? { ...p.manifest, version } : p.manifest;
          const text = shareableText({ ...p, manifest }, { includeFolders });
          const path = `${p.name} (share).md`;
          const verb =
            target === "file"
              ? "Saved"
              : target === "tab"
                ? "Opened"
                : "Copied";
          setState(
            logged(
              { ...state, lastExport: { profileId: p.id, path, text, target } },
              `${verb} a shareable copy of "${p.name}" v${manifest.version} — partials bundled, folders ${
                includeFolders ? "included" : "left out"
              }`,
            ),
          );
          return { path, text };
        },

        // TAKE / EDITION: stages the text that arrived from outside the vault. Nothing is
        // written; `incoming` is only what the researcher is looking at.
        stageIncoming(source) {
          const seedIn = state.incomingSeed;
          if (!seedIn) return null;
          const incoming = {
            source: source ?? seedIn.source,
            filename: seedIn.filename,
            manifest: seedIn.manifest,
            body: seedIn.body,
            text: manifestText(seedIn.manifest, seedIn.body, {
              includeFolders: seedIn.includeFolders,
              bundlePartials: true,
            }),
          };
          setState(
            logged(
              { ...state, incoming },
              `Staged ${incoming.filename} from ${incoming.source} — nothing written yet`,
            ),
          );
          return incoming;
        },

        // Writes the staged text into templates/. `asNewId` mints a fresh ID, so the arriving
        // edition becomes a separate Profile instead of a second edition of the one held.
        writeIncoming(options) {
          const { folder, style, asNewId = false } = options ?? {};
          const incoming = state.incoming;
          if (!incoming) return null;
          const id = asNewId ? mintId() : incoming.manifest.id;
          const manifest = { ...incoming.manifest, id };
          if (folder !== undefined && folder !== null && folder !== "")
            manifest.folder = folder;
          else delete manifest.folder;
          if (style !== undefined && style !== null && style !== "")
            manifest.citationStyle = style;
          const slug = slugOf(manifest.name);
          let path = `${state.templateFolder}/zotlit-profile.${slug}.md`;
          if (state.files.some((f) => f.path === path))
            path = `${state.templateFolder}/zotlit-profile.${slug}.${id}.md`;
          const file = {
            path,
            kind: "profile",
            manifest,
            body: incoming.body,
            edited: false,
            excluded: null,
          };
          setState(
            logged(
              {
                ...state,
                files: [...state.files, file],
                incoming: null,
                activeFile: path,
              },
              `Wrote ${path}${asNewId ? " with a fresh ID" : ""} — none of your notes changed`,
            ),
          );
          return file;
        },

        // The second edition: the held file takes the incoming bytes. The previous edition can
        // stay as a sibling OUT of the registry (the prefix is dropped, so it is not a Profile).
        replaceProfile(id, options) {
          const { keepPrevious = false } = options ?? {};
          const p = profileById(state, id);
          const incoming = state.incoming;
          if (!p?.path || !incoming) return;
          let files = state.files;
          if (keepPrevious) {
            const kept = state.files.find((f) => f.path === p.path);
            files = [
              ...files,
              {
                ...kept,
                path: `${state.templateFolder}/${p.name} (before ${incoming.manifest.version}).md`,
                kind: "other",
                excluded: null,
              },
            ];
          }
          files = replaceFile(files, p.path, {
            manifest: { ...incoming.manifest, id: p.id },
            body: incoming.body,
            edited: false,
          });
          setState(
            logged(
              { ...state, files, incoming: null, activeFile: p.path },
              `Replaced "${p.name}" with v${incoming.manifest.version}; ${p.noteCount} notes re-render on their next update${
                keepPrevious
                  ? "; the previous edition was kept out of the registry"
                  : ""
              }`,
            ),
          );
        },

        // SYNC: two files, one ID. Keep one, take the other, or make the second its own Profile.
        resolveCollision(id, choice) {
          const clashing = state.files.filter(
            (f) => f.kind === "profile" && f.manifest?.id === id,
          );
          if (clashing.length < 2) return;
          const mine = clashing[0];
          const theirs = clashing[1];
          if (choice === "both") {
            const fresh = mintId();
            setState(
              logged(
                {
                  ...state,
                  files: replaceFile(state.files, theirs.path, {
                    manifest: {
                      ...theirs.manifest,
                      id: fresh,
                      name: `${theirs.manifest.name} (2)`,
                    },
                  }),
                  tally: { ...state.tally, [fresh]: { notes: 0, imported: 0 } },
                },
                `Kept both: ${theirs.path} was given a fresh ID and holds 0 notes`,
              ),
            );
            return;
          }
          const drop = choice === "mine" ? theirs : mine;
          setState(
            logged(
              {
                ...state,
                files: state.files.filter((f) => f.path !== drop.path),
                trash: [...state.trash, drop],
                activeFile:
                  state.activeFile === drop.path
                    ? choice === "mine"
                      ? mine.path
                      : theirs.path
                    : state.activeFile,
              },
              `Trashed ${drop.path}; the ${state.tally[id]?.notes ?? 0} notes on this profile resolve again`,
            ),
          );
        },

        // #911's delete-as-move: the notes change Profile, nothing is re-stamped by surprise.
        moveNotes(fromId, toId, options) {
          const { imported = true } = options ?? {};
          const from = profileById(state, fromId);
          const to = profileById(state, toId);
          if (!from || !to) return;
          const notes = state.notes.map((n) =>
            n.profileId === fromId
              ? {
                  ...n,
                  profileId: toId,
                  path: `${to.folder}/${n.key}.md`,
                }
              : n,
          );
          const moved = state.tally[fromId] ?? { notes: 0, imported: 0 };
          const target = state.tally[toId] ?? { notes: 0, imported: 0 };
          setState(
            logged(
              {
                ...state,
                notes,
                tally: {
                  ...state.tally,
                  [fromId]: {
                    notes: 0,
                    imported: imported ? 0 : moved.imported,
                  },
                  [toId]: {
                    notes: target.notes + moved.notes,
                    imported: target.imported + (imported ? moved.imported : 0),
                  },
                },
              },
              `Moved ${moved.notes} notes${
                imported ? ` and ${moved.imported} imported notes` : ""
              } from "${from.name}" to "${to.name}"; they re-render on their next update`,
            ),
          );
        },

        // The in-place route: a file lands in templates/ by drag, sync or git. No seam crossed.
        dropFileIntoTemplates(path) {
          const file = state.files.find((f) => f.path === path);
          if (!file) return;
          const name = path.slice(path.lastIndexOf("/") + 1);
          const target = name.startsWith("zotlit-profile.")
            ? `${state.templateFolder}/${name}`
            : `${state.templateFolder}/zotlit-profile.${slugOf(
                file.manifest?.name ?? name.replace(/\.md$/, ""),
              )}.md`;
          actions.renameFile(path, target);
        },

        // Renaming is the whole registry: the prefix and the folder decide what is a Profile.
        renameFile(from, to) {
          const file = state.files.find((f) => f.path === from);
          if (!file) return;
          const kind =
            file.manifest && isProfilePath(state, to) ? "profile" : "other";
          setState(
            logged(
              {
                ...state,
                files: replaceFile(state.files, from, { path: to, kind }),
                activeFile: state.activeFile === from ? to : state.activeFile,
              },
              `Renamed ${from} → ${to}${
                kind === "profile"
                  ? "; it is a profile now"
                  : "; it left the registry"
              }`,
            ),
          );
        },

        trashFile(path) {
          const file = state.files.find((f) => f.path === path);
          if (!file) return;
          setState(
            logged(
              {
                ...state,
                files: state.files.filter((f) => f.path !== path),
                trash: [...state.trash, file],
                activeFile: state.activeFile === path ? null : state.activeFile,
              },
              `Moved ${path} to the Obsidian trash`,
            ),
          );
        },

        restoreFromTrash(path) {
          const file = state.trash.find((f) => f.path === path);
          if (!file) return;
          setState(
            logged(
              {
                ...state,
                files: [...state.files, file],
                trash: state.trash.filter((f) => f.path !== path),
                activeFile: path,
              },
              `Restored ${path} from the trash`,
            ),
          );
        },

        installStyle(name) {
          if (state.installedStyles.includes(name)) return;
          setState(
            logged(
              { ...state, installedStyles: [...state.installedStyles, name] },
              `Installed the "${name}" citation style`,
            ),
          );
        },

        openFile(path) {
          setState(logged({ ...state, activeFile: path }, `Opened ${path}`));
        },

        notify(text, action) {
          setState(pushNotice(state, text, action));
        },

        dismissNotice(id) {
          setState({
            ...state,
            notices: state.notices.filter((n) => n.id !== id),
          });
        },

        pushLog(text) {
          setState(logged(state, text));
        },
      };
      // --- Primitives: Obsidian's default theme, rebuilt from the plan's tokens only. ---

      export function Kbd({ children }) {
        return (
          <kbd className="font-mono text-[11px] leading-none border-line bg-ground-2 text-muted rounded border px-1 py-[3px]">
            {children}
          </kbd>
        );
      }

      export function Pill({ tone = "muted", children, className = "" }) {
        const tint =
          tone === "accent"
            ? {
                color: "var(--accent)",
                background:
                  "color-mix(in srgb, var(--accent) 14%, transparent)",
              }
            : tone === "danger"
              ? {
                  color: "var(--danger)",
                  background:
                    "color-mix(in srgb, var(--danger) 14%, transparent)",
                }
              : { color: "var(--muted)", background: "var(--ground-2)" };
        return (
          <span
            className={`inline-block rounded-full px-2 py-[2px] text-[11px] leading-none whitespace-nowrap ${className}`}
            style={tint}
          >
            {children}
          </span>
        );
      }

      function TreeFolder({ name, files, activePath, onOpen, onMenu }) {
        return (
          <div className="mb-[2px]">
            <div className="text-ink/85 flex items-center gap-1 rounded px-1 py-[3px] text-[13px]">
              <ChevronDown size={12} className="text-muted shrink-0" />
              <span className="truncate">{name}</span>
            </div>
            {files.map((f) => (
              <div
                key={f.path}
                onClick={() => onOpen?.(f.path)}
                onContextMenu={(e) => {
                  if (!onMenu) return;
                  e.preventDefault();
                  onMenu(f.path, e);
                }}
                className="flex cursor-pointer items-center gap-1 rounded py-[3px] pr-1 pl-[22px] text-[13px]"
                style={
                  f.path === activePath
                    ? {
                        background:
                          "color-mix(in srgb, var(--accent) 12%, transparent)",
                      }
                    : undefined
                }
              >
                <span className="truncate">{f.name}</span>
              </div>
            ))}
          </div>
        );
      }

      /**
       * The mock Obsidian window. Reads the store directly and takes no data props:
       *   title       — tab label; defaults to the active file's basename
       *   children    — rendered above the editor body (the note-top banner slot)
       *   overlay     — a modal centred over the whole window (Dialog, Prompt, sheet)
       *   statusItems — extra status-bar content, right of `footer`
       *   footer      — status-bar content, left of `statusItems`
       *   stampRender — (note, info) => node, replacing the zotlit-profile property row
       *   sidePane    — a pane between the file tree and the editor (SearchPane, a diff)
       *   onFileMenu  — (path, event) => void, the file explorer's right-click
       */
      export function ObsidianFrame({
        title,
        children,
        overlay = null,
        statusItems = null,
        footer = null,
        stampRender = null,
        sidePane = null,
        onFileMenu = null,
      }) {
        const { state } = useProtoState();
        const active = activeNote(state);
        const activeFile = activeFileRecord(state);
        const activeProfile = active
          ? profileById(state, active.profileId)
          : null;
        const activeInfo = active
          ? activeProfile && !activeProfile.excluded
            ? {
                label: activeProfile.name,
                secondary: stampLabel(activeProfile),
                status: "active",
              }
            : {
                label: activeProfile
                  ? `${activeProfile.name} — excluded`
                  : "Unknown profile",
                secondary: active.profileId,
                status: activeProfile ? "excluded" : "unknown",
              }
          : null;

        // The vault as the file explorer shows it: every note, plus every file record.
        const tree = useMemo(() => {
          const folders = new Map();
          const put = (path) => {
            const cut = path.lastIndexOf("/");
            const dir = cut === -1 ? "/" : path.slice(0, cut);
            if (!folders.has(dir)) folders.set(dir, []);
            folders.get(dir).push({ name: path.slice(cut + 1), path });
          };
          for (const note of state.notes) put(note.path);
          for (const file of state.files) put(file.path);
          if (!folders.has(state.templateFolder))
            folders.set(state.templateFolder, []);
          for (const list of folders.values())
            list.sort((a, b) => a.name.localeCompare(b.name));
          return [...folders.entries()].sort((a, b) =>
            a[0].localeCompare(b[0]),
          );
        }, [state.notes, state.files, state.templateFolder]);

        const pane = sidePane;

        const tabTitle =
          title ??
          (state.activeFile
            ? state.activeFile.split("/").pop()
            : "No file open");

        return (
          <div className="bg-ground text-ink font-body relative flex h-full min-w-0 flex-col overflow-hidden text-sm">
            <div className="flex min-h-0 flex-1">
              {/* ribbon */}
              <div className="border-line bg-ground-2 flex w-[44px] shrink-0 flex-col items-center gap-4 border-r py-3">
                <FolderOpen size={17} className="text-ink/70" />
                <Search size={17} className="text-muted" />
                <Bookmark size={17} className="text-muted" />
                <Files size={17} className="text-muted" />
                <div className="flex-1" />
                <HelpCircle size={16} className="text-muted" />
                <Settings size={16} className="text-muted" />
              </div>

              {/* file tree */}
              <div className="border-line bg-ground-2 text-ink/90 w-[200px] shrink-0 overflow-y-auto border-r px-2 py-2">
                {tree.map(([folder, files]) => (
                  <TreeFolder
                    key={folder}
                    name={folder}
                    files={files}
                    activePath={state.activeFile}
                    onOpen={(path) => actions.openFile(path)}
                    onMenu={onFileMenu}
                  />
                ))}
              </div>

              {/* search pane */}
              {pane}

              {/* main pane */}
              <div className="flex min-w-0 flex-1 flex-col">
                <div className="border-line flex shrink-0 items-center gap-2 border-b px-3 py-[6px]">
                  <div className="border-line bg-ground flex items-center gap-2 rounded-md border px-3 py-1 text-[13px]">
                    <FileIcon size={13} className="text-muted" />
                    <span className="max-w-[280px] truncate">{tabTitle}</span>
                    <X size={12} className="text-muted" />
                  </div>
                  <Plus size={14} className="text-muted" />
                  <div className="flex-1" />
                  <PanelLeft size={14} className="text-muted" />
                </div>

                <div className="min-h-0 flex-1 overflow-y-auto px-10 py-6">
                  {children ? <div className="mb-6">{children}</div> : null}
                  {active ? (
                    <>
                      <div className="text-muted mb-4 font-mono text-[11px]">
                        {active.path}
                      </div>
                      <table className="mb-6 w-full max-w-[560px] table-fixed text-[13px]">
                        <tbody>
                          <tr>
                            <td className="text-muted w-[130px] py-1 align-top">
                              zotero-key
                            </td>
                            <td className="py-1 font-mono text-[12px] break-all">
                              {active.key}
                            </td>
                          </tr>
                          <tr>
                            <td className="text-muted py-1 align-top">
                              zotlit-profile
                            </td>
                            <td className="py-1 text-[13px] break-all">
                              {stampRender ? (
                                stampRender(active, activeInfo)
                              ) : (
                                <DefaultStamp info={activeInfo} />
                              )}
                            </td>
                          </tr>
                        </tbody>
                      </table>
                      <h1 className="mb-3 text-2xl font-semibold">
                        {active.title}
                      </h1>
                      <div className="text-muted mb-2 font-mono text-[11px]">

      export function CommandPalette({ open, items = [], onClose }) {
        const [query, setQuery] = useState("");
        const [sel, setSel] = useState(0);
        const hits = items.filter((i) =>
          i.label.toLowerCase().includes(query.toLowerCase()),
        );
        useEffect(() => {
          setSel(0);
        }, [query]);
        if (!open) return null;
        const onKeyDown = (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setSel((i) => Math.min(i + 1, hits.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setSel((i) => Math.max(i - 1, 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            hits[sel]?.onSelect?.();
          } else if (e.key === "Escape") {
            e.preventDefault();
            onClose?.();
          }
        };
        return (
          <Prompt
            placeholder="Select a command..."
            value={query}
            onChange={setQuery}
            onKeyDown={onKeyDown}
            instructions={[
              { command: "↑↓", purpose: "navigate" },
              { command: "↵", purpose: "run command" },
              { command: "esc", purpose: "dismiss" },
            ]}
          >
            {hits.map((it, i) => (
              <SuggestRow
                key={it.label}
                title={it.label}
                selected={i === sel}
                onClick={it.onSelect}
              />
            ))}
          </Prompt>
        );
      }

      // --- New for this prototype: the six surfaces question 2 and the ledger need. ---

      // The exported file, opened as plain text — line numbers, YAML manifest fenced off from
      // the body by its own "---" lines, so a reader can answer question 2 by looking.
      export function FileText({ path, source, language = "markdown" }) {
        const lines = source.split("\n");
        const firstFence = lines.indexOf("---");
        const secondFence =
          firstFence === -1 ? -1 : lines.indexOf("---", firstFence + 1);
        return (
          <div className="border-line bg-ground overflow-hidden rounded-md border">
            <div className="border-line bg-ground-2 text-muted flex items-center gap-2 border-b px-3 py-[6px] font-mono text-[11px]">
              <span className="truncate">{path}</span>
              <Pill tone="muted">{language}</Pill>
            </div>
            <div className="max-h-[440px] overflow-y-auto">
              <table className="w-full border-collapse font-mono text-[12px] leading-[1.7]">
                <tbody>
                  {lines.map((l, i) => {
                    const inManifest =
                      secondFence > -1 && i > firstFence && i < secondFence;
                    return (
                      <tr
                        key={i}
                        style={
                          inManifest
                            ? { background: "var(--ground-2)" }
                            : undefined
                        }
                      >
                        <td className="border-line text-muted w-[36px] shrink-0 border-r px-2 text-right align-top tabular-nums select-none">
                          {i + 1}
                        </td>
                        <td className="text-ink/85 px-3 align-top whitespace-pre-wrap">
                          {l === "" ? " " : l}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      // A rendered literature note. With `diffAgainst` (the earlier version's own lines), added
      // lines get an accent rule and removed lines get a struck-through danger rule — the
      // before/after a second edition asks the recipient to weigh.
      export function NotePreview({ title, lines, diffAgainst = null }) {
        const rows = useMemo(
          () =>
            diffAgainst
              ? diffLines(diffAgainst, lines)
              : lines.map((l) => ({ text: l, mark: null })),
          [lines, diffAgainst],
        );
        return (
          <div className="border-line bg-ground overflow-hidden rounded-md border">
            <div className="border-line bg-ground-2 text-ink flex items-center justify-between border-b px-3 py-[6px] text-[12px] font-semibold">
              <span className="truncate">{title}</span>
              {diffAgainst ? <Pill tone="accent">before → after</Pill> : null}
            </div>
            <div className="px-3 py-2 text-[13px] leading-relaxed">
              {rows.map((r, i) => (
                <div
                  key={i}
                  className={`border-l-2 pl-2 ${
                    r.mark === "removed" ? "line-through opacity-60" : ""
                  }`}
                  style={{
                    borderColor:
                      r.mark === "added"
                        ? "var(--accent)"
                        : r.mark === "removed"
                          ? "var(--danger)"
                          : "transparent",
                  }}
                >
                  {r.text || " "}
                </div>
              ))}
            </div>
          </div>
        );
      }

      // The manifest header, in the researcher's words — the pack id demoted to mono secondary.
      export function ManifestHeader({ manifest }) {

              <span className="text-[16px] font-semibold">{manifest.name}</span>
              <Pill tone="accent">v{manifest.version}</Pill>

            <div className="text-muted mt-1 text-[13px] leading-relaxed">
              {manifest.description}
            </div>
            {manifest.author ? (
              <div className="text-muted mt-2 text-[12px]">
                by {manifest.author}
              </div>
            ) : null}
            <div className="text-muted mt-2 font-mono text-[11px] break-all">
              {manifest.id}
            </div>
          </div>
        );
      }

      // "What is written": files with a per-row verdict pill, and the Managed Frontmatter
      // field names that come along with the document.
      export function EntersYourVault({ files = [], fields = [] }) {
        const tone = (v) =>
          v === "new"
            ? "accent"

              ? "danger"

              <div className="text-muted mb-1 text-[11px] tracking-[0.06em] uppercase">
                Files

                {files.map((f) => (
                  <div
                    key={f.path}

      // One travelling setting. Passed `onChoose`, it renders E's Use theirs / Keep mine radio
      // pair; without it, B's editable field (`onChangeYourValue`) for the sender's suggestion.
      export function YourSettingsRow({
        label,
        senderValue,
        yourValue,
        onChoose,
        choice,
        onChangeYourValue,
      }) {
        return (
          <div className="border-line flex items-center gap-3 border-b py-2 text-[13px]">
            <div className="w-[150px] shrink-0">{label}</div>
            <div className="text-muted min-w-0 flex-1 truncate font-mono text-[12px]">
              sender: {senderValue}
            </div>
            {onChoose ? (
              <div className="flex shrink-0 items-center gap-1">
                <button
                  onClick={() => onChoose("theirs")}
                  className="cursor-pointer rounded px-2 py-[3px] text-[12px]"
                  style={
                    choice === "theirs"
                      ? { background: "var(--accent)", color: "#ffffff" }
                      : { border: "1px solid var(--line)", color: "var(--ink)" }
                  }

                  Use theirs
                </button>
                <button
                  onClick={() => onChoose("mine")}
                  className="cursor-pointer rounded px-2 py-[3px] text-[12px]"

      // Obsidian's right-click menu: a list positioned at the pointer. An item is
      // { label, icon?, onClick, destructive? }; the literal "separator" draws a rule.
      export function ContextMenu({ x = 0, y = 0, items = [], onClose }) {
        useEffect(() => {
          const close = () => onClose?.();
          window.addEventListener("click", close);
          return () => window.removeEventListener("click", close);
        }, [onClose]);
        return (
          <div
            className="border-line bg-ground fixed z-50 w-[240px] overflow-hidden rounded-md border py-1 shadow-2xl"
            style={{ left: x, top: y }}
            onClick={(e) => e.stopPropagation()}
          >
            {items.map((it, i) =>
              it === "separator" ? (
                <div key={`sep-${i}`} className="border-line my-1 border-t" />
              ) : (
                <button
                  key={it.label}
                  onClick={() => {
                    onClose?.();
                    it.onClick?.();
                  }}
                  className="flex w-full cursor-pointer items-center gap-2 px-3 py-[5px] text-left text-[13px]"
                  style={{
                    color: it.destructive ? "var(--danger)" : "var(--ink)",
                  }}
                >
                  {it.icon ? (
                    <it.icon size={14} className="text-muted shrink-0" />
                  ) : (
                    <span className="w-[14px] shrink-0" />
                  )}
                  <span className="truncate">{it.label}</span>
                </button>
              ),
            )}
          </div>
        );
      }

      // The sender's export menu: a file, plain text, or a link — the same three doors #904's
      // baseline had for a Profile leaving the vault.
      export function ShareSheet({ profile, onTarget }) {
        const targets = [
          { key: "file", label: "Save file…", icon: Download },

          <div className="border-line bg-ground w-[280px] overflow-hidden rounded-md border shadow-2xl">
            <div className="border-line text-muted border-b px-3 py-2 text-[11px] tracking-[0.06em] uppercase">
              Share {profile.name}
            </div>
            <div className="flex flex-col p-1">
              {targets.map((t) => (
                <button
                  key={t.key}
                  onClick={() => onTarget?.(t.key)}
                  className="text-ink flex cursor-pointer items-center gap-2 rounded px-2 py-[6px] text-[13px]"
                >
                  <t.icon size={14} className="text-muted" />
                  {t.label}
                </button>
              ))}
            </div>
          </div>

      // --- Rail --------------------------------------------------------------

      function RailHeading({ children }) {
        return (
          <div className="font-display text-muted mb-2 text-[11px] font-semibold tracking-[0.08em] uppercase">
            {children}
          </div>
        );
      }

      /**
       * The explainer rail. Reads the store directly and takes no data props:
       *   thesis  — one paragraph: what this variant bets
       *   answers — [{ q, a }], the four researchers' questions with this variant's answer
       *   steps   — [node], the numbered steps to try for the CURRENT scenario
       *   extras  — a slot between the steps and the store readout
       * Below those it always renders the store readout — the files in templates/, the derived
       * Profiles with counts and exclusions, the staged incoming text, the trash — and the log.
       */
      export function Rail({
        thesis,
        answers = [],
        steps = [],
        extras = null,
      }) {
        const { state } = useProtoState();
        const list = profiles(state);
        const templateFiles = state.files.filter((f) =>
          f.path.startsWith(`${state.templateFolder}/`),
        );
        const stale = staleNotes(state);
        return (
          <aside className="border-line bg-ground-2 text-ink font-body flex h-full min-h-0 flex-col gap-5 overflow-y-auto border-l px-4 py-4 text-[13px]">
            <div>
              <RailHeading>Thesis</RailHeading>
              <p className="leading-relaxed">{thesis}</p>
            </div>

            {answers.length ? (
              <div>
                <RailHeading>Four researchers</RailHeading>
                <div className="flex flex-col gap-2">
                  {answers.map((a) => (
                    <div key={a.q} className="leading-relaxed">
                      <div className="text-muted">“{a.q}”</div>
                      <div>{a.a}</div>
                    </div>
                  ))}
                </div>
              </div>
            ) : null}

            {steps.length ? (
              <div>
                <RailHeading>Steps</RailHeading>
                <ol className="flex flex-col gap-[6px]">
                  {steps.map((s, i) => (
                    <li key={i} className="flex gap-2 leading-relaxed">
                      <span className="text-muted font-mono text-[11px] tabular-nums">
                        {String(i + 1).padStart(2, "0")}
                      </span>
                      <span className="min-w-0 flex-1">{s}</span>
                    </li>
                  ))}
                </ol>
              </div>
            ) : null}

            {extras}

            <div>
              <RailHeading>{state.templateFolder}/</RailHeading>
              {templateFiles.length === 0 ? (
                <div className="text-muted text-[11px]">empty</div>
              ) : (
                <div className="flex flex-col gap-[2px]">
                  {templateFiles.map((f) => (
                    <div
                      key={f.path}
                      className="text-muted font-mono text-[11px] leading-snug break-all"
                    >
                      {f.path.split("/").pop()}
                      {f.kind === "profile" ? "" : "  (not a profile)"}
                      {f.edited ? "  (edited)" : ""}
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div>
              <RailHeading>Profiles (derived)</RailHeading>
              <table className="w-full text-[11px]">
                <tbody>
                  {list.map((p) => (
                    <tr key={p.path ?? p.id} className="align-top">
                      <td className="py-[2px] pr-2">{p.name}</td>
                      <td className="text-muted py-[2px] pr-2 font-mono break-all">
                        {p.id}
                      </td>
                      <td className="text-muted py-[2px] text-right font-mono tabular-nums whitespace-nowrap">
                        {p.excluded ? (
                          <span style={{ color: "var(--danger)" }}>
                            {p.noteCount} stale
                          </span>
                        ) : (
                          `${p.noteCount} notes`
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {list.some((p) => p.excluded) ? (
                <div className="mt-2 text-[11px] leading-snug">
                  <Pill tone="danger">duplicate-profile-id</Pill>{" "}
                  <span className="text-muted">
                    {stale.length} sample notes wait at the unknown-profile
                    backstop
                  </span>
                </div>
              ) : null}

              {state.incoming ? (
                <div className="text-muted mt-3 text-[11px] leading-snug">
                  incoming:{" "}
                  <span className="font-mono">{state.incoming.filename}</span> (
                  {state.incoming.manifest.id} v
                  {state.incoming.manifest.version}) via {state.incoming.source}
                  {" · "}
                  {state.incoming.text.split("\n").length} lines, not written
                </div>
              ) : state.incomingSeed ? (
                <div className="text-muted mt-3 text-[11px] leading-snug">
                  incoming: nothing staged yet
                </div>
              ) : null}

              {state.trash.length ? (
                <div className="text-muted mt-3 text-[11px] leading-snug">
                  trash:{" "}
                  {state.trash.map((f) => f.path.split("/").pop()).join(", ")}
                </div>
              ) : null}

              {state.activeFile ? (
                <div className="text-muted mt-3 font-mono text-[11px] leading-snug break-all">
                  {state.activeFile}
                </div>
              ) : null}
            </div>

            <div className="min-h-0">
              <RailHeading>Log</RailHeading>
              <div className="flex flex-col gap-[3px]">
                {state.log.length === 0 ? (
                  <div className="text-muted text-[11px]">nothing yet</div>
                ) : (
                  state.log.slice(0, 12).map((e, i) => (
                    <div
                      key={i}
                      className="flex gap-2 text-[11px] leading-snug"
                    >
                      <span className="text-muted font-mono tabular-nums">
                        {e.t}
                      </span>
                      <span className="min-w-0 flex-1">{e.text}</span>
                    </div>
                  ))
                )}
              </div>
            </div>
          </aside>
        );
      }
      // --- Shared END ---

      // --- App ---
      // --- Variant A ---
      // A — Drop it in. No import seam and no new dialog: the file explorer does every write,
      // and ZotLit only says, in place, what the file became. Export is a context-menu item on
      // the Profile document; import is paste + move; a second edition is the duplicate-ID
      // diagnostic rendered as a banner on both files; going back is the Obsidian trash.
      function VariantA() {
        const { state } = useProtoState();
        const [menu, setMenu] = useState(null); // { x, y, path }
        const [palette, setPalette] = useState(false);
        const [prompt, setPrompt] = useState(null); // { kind, path, value }
        const [settings, setSettings] = useState(false);
        const [pane, setPane] = useState(null); // "share" | "preview"
        const [share, setShare] = useState(null); // { path, text }
        const [overwrite, setOverwrite] = useState(null); // { from, to, id }

        const list = profiles(state);
        const collided = list.filter(
          (p) => p.excluded === "duplicate-profile-id",
        );
        const activeFile = activeFileRecord(state);
        const activeProfile =
          activeFile && activeFile.manifest
            ? (list.find((p) => p.path === activeFile.path) ?? null)
            : null;
        const recognized =
          activeProfile &&
          !activeProfile.excluded &&
          activeFile.kind === "profile"
            ? activeProfile
            : null;

        // --- the six doors, each one a file operation -------------------------
        const shareCopy = (id) => {
          const out = actions.exportProfile(id, {
            includeFolders: false,
            target: "file",
          });
          if (!out) return;
          setShare(out);
          setPane("share");
          actions.notify(
            "Shareable copy created · partials bundled · your folders left out",
            {
              label: "Copy to clipboard",
              onClick: () =>
                actions.exportProfile(id, {
                  includeFolders: false,
                  target: "clipboard",
                }),
            },
          );
        };

        // Paste door: the text lands in a new note at the vault root. Not a profile yet —
        // it is outside templates/ and its name carries no prefix.
        const pasteToRoot = () => {
          if (!state.incomingSeed) return;
          actions.stageIncoming("paste");
          const file = actions.writeIncoming({});
          if (!file) return;
          actions.renameFile(file.path, "Pasted.md");
          actions.pushLog(
            "Pasted the text into a new note at the vault root — nothing recognizes it yet",
          );
          setPane(null);
        };

        // Move door: drag it into templates/. Recognition is the rename landing, nothing else.
        const moveIntoTemplates = (path) => {
          const file = state.files.find((f) => f.path === path);
          if (!file) return;
          const name = path.slice(path.lastIndexOf("/") + 1);
          const target = name.startsWith("zotlit-profile.")
            ? `${state.templateFolder}/${name}`
            : `${state.templateFolder}/zotlit-profile.${slugOf(
                file.manifest?.name ?? name.replace(/\.md$/, ""),
              )}.md`;
          if (state.files.some((f) => f.path === target)) {
            setOverwrite({ from: path, to: target, id: file.manifest?.id });
            return;
          }
          actions.dropFileIntoTemplates(path);
        };

        // "Set folder…" edits the manifest's folder key by rewriting the document.
        const setFolder = (p, value) => {
          if (!state.incomingSeed) return;
          actions.trashFile(p.path);
          actions.stageIncoming("edit");
          actions.writeIncoming({
            folder: value,
            style: p.manifest?.citationStyle,
          });
          actions.pushLog(
            `Set folder: ${value || "your default"} in the manifest — none of your notes change`,
          );
        };

        const openMenu = (path, e) =>
          setMenu({ x: e.clientX, y: e.clientY, path });

        const menuItems = (path) => {
          const file = state.files.find((f) => f.path === path);
          const isProfile = file?.kind === "profile";
          const inTemplates = path.startsWith(`${state.templateFolder}/`);
          const items = [];
          if (isProfile && file.manifest)
            items.push({
              label: "Create shareable copy",
              icon: Copy,
              onClick: () => shareCopy(file.manifest.id),
            });
          if (file && !inTemplates)
            items.push({
              label: "Move to templates/",
              icon: ArrowRight,
              onClick: () => moveIntoTemplates(path),
            });
          if (file)
            items.push(
              "separator",
              {
                label: "Rename…",
                icon: FileIcon,
                onClick: () =>
                  setPrompt({
                    kind: "rename",
                    path,
                    value: path.slice(path.lastIndexOf("/") + 1),
                  }),
              },
              {
                label: "Delete",
                icon: Trash2,
                destructive: true,
                onClick: () => actions.trashFile(path),
              },
            );
          if (items.length === 0)
            items.push({
              label: "Delete",
              icon: Trash2,
              destructive: true,
              onClick: () =>
                actions.pushLog(`${path} is a note, not a file record`),
            });
          return items;
        };

        // --- surfaces rendered above the editor -------------------------------
        const collisionBanner = () => {
          if (collided.length < 2) return null;
          const mine = collided[0];
          const theirs = collided[1];
          const arrived =
            state.scenario === "sync" ? "arrived by sync" : "you moved it in";
          const choose = (choice) => actions.resolveCollision(mine.id, choice);
          return (
            <Banner
              tone="danger"
              text={
                <div className="flex flex-col gap-2">
                  <div>
                    Two files carry the {mine.name} ID (
                    <span className="font-mono text-[12px]">{mine.id}</span>) —{" "}
                    {mine.noteCount} notes wait until you pick one.
                  </div>
                  <div className="text-muted font-mono text-[11px] leading-relaxed break-all">
                    {mine.path.split("/").pop()} (yours, folder {mine.folder})
                    <br />
                    {theirs.path.split("/").pop()} ({arrived})
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {[
                      { label: "Keep mine", key: "mine" },
                      { label: "Take theirs", key: "theirs" },
                      { label: "Keep both as separate profiles", key: "both" },
                    ].map((b) => (
                      <button
                        key={b.key}
                        onClick={() => choose(b.key)}
                        className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[4px] text-[12px]"
                      >
                        {b.label}
                      </button>
                    ))}
                  </div>
                  <div className="text-muted">
                    Whichever you pick, {mine.noteCount} notes re-render on
                    their next update. The file you drop goes to the Obsidian
                    trash.
                  </div>
                </div>
              }
            />
          );
        };

        const recognizedBanner = () => {
          if (!recognized) return null;
          const m = recognized.manifest;
          const style = recognized.style;
          const installed = state.installedStyles.includes(style);
          return (
            <Banner
              tone="accent"
              text={
                <div className="flex flex-col gap-2">
                  <div>
                    Profile · {m.name} v{m.version}
                    {m.author ? ` by ${m.author}` : ""} ·{" "}
                    {m.folder
                      ? `folder: ${m.folder} (from the file)`
                      : `folder: your default (${state.defaults.folder})`}{" "}
                    · style: {style}
                    {installed ? "" : " — not installed"}
                  </div>
                  <div className="text-muted">
                    {recognized.noteCount > 0
                      ? `${recognized.noteCount} notes render from this file; they re-render on their next update.`
                      : "None of your notes change."}
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={() =>
                        setPane(pane === "preview" ? null : "preview")
                      }
                      className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[4px] text-[12px]"
                    >
                      Preview a note
                    </button>
                    <button
                      onClick={() =>
                        setPrompt({
                          kind: "folder",
                          path: recognized.path,
                          value: m.folder ?? "",
                        })
                      }
                      className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[4px] text-[12px]"
                    >
                      Set folder…
                    </button>
                  </div>
                </div>
              }
            />
          );
        };

        // Surface 4, honestly: this variant has no consent step. The write already happened.
        const consentNote = () => (
          <div className="border-line text-muted mb-4 rounded-md border border-dashed px-3 py-[10px] text-[13px] leading-relaxed">
            Consent before the write: none. Moving the file into{" "}
            {state.templateFolder}/ is the write, and the file explorer did it.
            What you get instead is the banner above, after the fact — and it is
            reversible, because it is a file. None of your notes change until
            you keep or drop one.
          </div>
        );

        const paneNode = () => {
          if (pane === "share" && share)
            return (
              <div className="border-line bg-ground-2 w-[420px] shrink-0 overflow-y-auto border-r px-3 py-3">
                <div className="mb-2 flex items-center gap-2">
                  <div className="flex-1 text-[12px] font-semibold">
                    New file, outside {state.templateFolder}/
                  </div>
                  <button
                    onClick={() => setPane(null)}
                    aria-label="Close the shareable copy"
                    className="text-muted cursor-pointer"
                  >
                    <X size={13} />
                  </button>
                </div>
                <FileText path={share.path} source={share.text} />
                <div className="text-muted mt-2 text-[11px] leading-snug">
                  partials bundled (authors) · no folder: key · this is the
                  whole thing you send
                </div>
              </div>
            );
          if (pane === "preview" && recognized)
            return (
              <div className="border-line bg-ground-2 w-[360px] shrink-0 overflow-y-auto border-r px-3 py-3">
                <div className="mb-2 flex items-center gap-2">
                  <div className="flex-1 text-[12px] font-semibold">
                    One of your own items
                  </div>
                  <button
                    onClick={() => setPane(null)}
                    aria-label="Close the preview"
                    className="text-muted cursor-pointer"
                  >
                    <X size={13} />
                  </button>
                </div>
                <NotePreview
                  title={state.previewItem.title}
                  lines={renderNote(recognized, state.previewItem)}
                />
                <div className="text-muted mt-2 text-[11px] leading-snug">
                  Nothing is written by looking. None of your notes change.
                </div>
              </div>
            );
          return null;
        };

        const overlay = () => {
          if (settings)
            return (
              <SettingsModal open onClose={() => setSettings(false)}>
                <ProfilesPage
                  onAdd={() =>
                    actions.notify(
                      `Add a profile by putting a file in ${state.templateFolder}/ named zotlit-profile.<name>.md`,
                    )
                  }
                  onOpen={(path) => {
                    actions.openFile(path);
                    setSettings(false);
                  }}
                  onDuplicate={(id) =>
                    actions.notify(
                      "Duplicate copies the file and mints a fresh ID — none of your notes change",
                    )
                  }
                  onDelete={(id) => {
                    const p = profileById(state, id);
                    if (p?.path) actions.trashFile(p.path);
                  }}
                />
              </SettingsModal>
            );
          if (overwrite)
            return (
              <Dialog
                width={470}
                title="A file already exists"
                body={
                  <div className="flex flex-col gap-2">
                    <div>
                      <span className="font-mono text-[12px] break-all">
                        {overwrite.to}
                      </span>{" "}
                      already exists in this vault.
                    </div>
                    <div className="text-muted">
                      This prompt is Obsidian's, not ZotLit's. Replace
                      overwrites the bytes — the edit in your copy goes with the
                      old file, and the {state.tally[overwrite.id]?.notes ?? 0}{" "}
                      notes on this profile re-render on their next update.
                    </div>
                  </div>
                }
                actions={[
                  { label: "Cancel", onClick: () => setOverwrite(null) },
                  {
                    label: "Keep both",
                    onClick: () => {
                      const file = state.files.find(
                        (f) => f.path === overwrite.from,
                      );
                      actions.renameFile(
                        overwrite.from,
                        `${state.templateFolder}/zotlit-profile.${slugOf(
                          file.manifest.name,
                        )}.${file.manifest.id}.md`,
                      );
                      setOverwrite(null);
                    },
                    cta: true,
                  },
                  {
                    label: "Replace",
                    destructive: true,
                    onClick: () => {
                      actions.trashFile(overwrite.to);
                      actions.renameFile(overwrite.from, overwrite.to);
                      actions.pushLog(
                        "Replaced the file — the old edition and the edit inside it are in the Obsidian trash",
                      );
                      setOverwrite(null);
                    },
                  },
                ]}
              />
            );
          if (prompt) {
            const dir = prompt.path.slice(0, prompt.path.lastIndexOf("/") + 1);
            const commit = () => {
              if (prompt.kind === "rename")
                actions.renameFile(prompt.path, `${dir}${prompt.value}`);
              else {
                const p = list.find((x) => x.path === prompt.path);
                if (p) setFolder(p, prompt.value.trim());
              }
              setPrompt(null);
              setPane(null);
            };
            return (
              <Prompt
                placeholder={
                  prompt.kind === "rename"
                    ? "File name"
                    : "Literature note folder"
                }
                value={prompt.value}
                onChange={(v) => setPrompt({ ...prompt, value: v })}
                onKeyDown={(e) => {
                  if (e.key === "Enter") commit();
                  if (e.key === "Escape") setPrompt(null);
                }}
                instructions={[
                  { command: "↵", purpose: "save" },
                  { command: "esc", purpose: "cancel" },
                ]}
              >
                <div className="text-muted px-3 py-2 text-[13px] leading-relaxed">
                  {prompt.kind === "rename" ? (
                    <>
                      Renaming is the whole registry. A name that keeps{" "}
                      <span className="font-mono text-[12px]">
                        zotlit-profile.
                      </span>{" "}
                      inside {state.templateFolder}/ stays a profile; anything
                      else leaves it, and the banner goes with it.
                    </>
                  ) : (
                    <>
                      Writes{" "}
                      <span className="font-mono text-[12px]">
                        folder: {prompt.value || "(none — your default)"}
                      </span>{" "}
                      into the file's frontmatter. New notes on this profile
                      land there; none of your notes change.
                    </>
                  )}
                </div>
              </Prompt>
            );
          }
          if (palette)
            return (
              <CommandPalette
                open
                onClose={() => setPalette(false)}
                items={[
                  ...(state.incomingSeed
                    ? [
                        {
                          label: "Paste — create a note from the clipboard",
                          onSelect: () => {
                            setPalette(false);
                            pasteToRoot();
                          },
                        },
                      ]
                    : []),
                  ...(recognized
                    ? [
                        {
                          label: `Create shareable copy of ${recognized.name}`,
                          onSelect: () => {
                            setPalette(false);
                            shareCopy(recognized.id);
                          },
                        },
                      ]
                    : []),
                  {
                    label: "Open settings — literature note profiles",
                    onSelect: () => {
                      setPalette(false);
                      setSettings(true);
                    },
                  },
                ]}
              />
            );
          return null;
        };

        const steps = {
          send: [
            <>
              Right-click{" "}
              <span className="font-mono text-[11px]">
                zotlit-profile.reading-group.md
              </span>{" "}
              in the file tree.
            </>,
            <>
              Pick <b>Create shareable copy</b>. It writes{" "}
              <span className="font-mono text-[11px]">
                Reading group (share).md
              </span>{" "}
              outside {state.templateFolder}/ and opens it beside the document.
            </>,
            <>
              Read the copy: the manifest has{" "}
              <span className="font-mono text-[11px]">partials:</span> with the
              authors source and no{" "}
              <span className="font-mono text-[11px]">folder:</span>.
            </>,
            <>
              Use <b>Copy to clipboard</b> in the notice to paste it into a chat
              window.
            </>,
          ],
          take: [
            <>
              Press <Kbd>Ctrl+V</Kbd> — open the command palette from the status
              bar and run <b>Paste</b>. The text lands in{" "}
              <span className="font-mono text-[11px]">Pasted.md</span> at the
              vault root. Still not a profile.
            </>,
            <>
              Right-click{" "}
              <span className="font-mono text-[11px]">Pasted.md</span> and pick{" "}
              <b>Move to templates/</b> — the drag, done with the mouse.
            </>,
            <>
              The banner appears the moment the file lands: name, version,
              author, your default folder, and chicago-note not installed.
            </>,
            <>
              Try <b>Preview a note</b> against your own item, then{" "}
              <b>Set folder…</b> to write a folder key into the file.
            </>,
            <>
              Right-click the document, <b>Rename…</b> to{" "}
              <span className="font-mono text-[11px]">reading-group.md</span> —
              the banner goes, because the file left the registry.
            </>,
          ],
          sync: [
            <>
              Nothing was clicked to get here: the laptop's copy arrived beside
              the desktop's. Both files carry one ID, so both are out and 40
              notes wait.
            </>,
            <>
              The red banner sits on the document itself. Open either file in
              the tree — it is on both.
            </>,
            <>
              Open <b>Settings — literature note profiles</b> from the status
              bar: the excluded pair is listed with the same diagnostic.
            </>,
            <>
              Pick <b>Keep mine</b>, <b>Take theirs</b> or{" "}
              <b>Keep both as separate profiles</b>. The dropped file goes to
              the trash and can be restored.
