        const [importStep, setImportStep] = useState(null); // "paste" | "consent"
        const [paste, setPaste] = useState("");
        const [folderDraft, setFolderDraft] = useState("");
        const [styleDraft, setStyleDraft] = useState("");
        const [palette, setPalette] = useState(false);
        const [offer, setOffer] = useState(null); // { oldId, newId, label }
        const [move, setMove] = useState(null); // { fromId, toId, mode, options }

        const incoming = state.incoming;
        const held = incoming
          ? list.find((p) => !p.isDefault && p.id === incoming.manifest.id)
          : null;

        // Scenario switch resets this variant's own surfaces.
        useEffect(() => {
          setMenu(null);
          setShare(null);
          setExported(null);
          setImportStep(null);
          setPaste("");
          setOffer(null);
          setMove(null);
          setPalette(false);
          // SYNC arrives with no seam crossed, so the window — and its Notice — is what
          // the researcher is looking at. Every other scenario starts on the settings page.
          setSettingsOpen(state.scenario !== "sync");
        }, [state.scenario]);

        // SYNC, in place: two files carry one ID and nobody crossed a seam. Nothing is ever
        // replaced here, so ZotLit settles it by itself — a fresh ID into the newer file, a
        // rename, and an offer. The 40 notes stay on the profile they were already on.
        useEffect(() => {
          if (state.scenario !== "sync") return;
          const dup = list.find((p) => p.excluded === "duplicate-profile-id");
          if (!dup) return;
          actions.resolveCollision(dup.id, "both");
          const fresh = profiles(getSnapshot()).find((p) =>
            p.name.endsWith("(2)"),
          );
          if (!fresh) return;
          const renamed = `${state.templateFolder}/zotlit-profile.reading-group (2).md`;
          actions.renameFile(fresh.path, renamed);
          setOffer({ oldId: dup.id, newId: fresh.id, label: fresh.name });
          actions.notify(
            "Reading group arrived twice — kept both; “Reading group (2)” has no notes.",
            {
              label: "Move notes…",
              onClick: () => openMove(dup.id, fresh.id, "move"),
            },
          );
        }, [state.scenario, state.files]);

        const openMove = (fromId, toId, mode) =>
          setMove({
            fromId,
            toId,
            mode,
            options: { moveFiles: true, includeImported: true },
          });

        const openImport = () => {
          const staged = actions.stageIncoming("paste");
          setPaste(staged ? staged.text : "");
          setFolderDraft("");
          setStyleDraft(staged?.manifest.citationStyle ?? "");
          setImportStep("paste");
          setSettingsOpen(true);
        };

        const addProfile = () => {
          const existing = held;
          const written = actions.writeIncoming({
            folder: folderDraft,
            style: styleDraft,
            asNewId: !!existing,
          });
          setImportStep(null);
          if (!existing || !written) return;
          setSettingsOpen(false); // so the follow-up Notice is readable over the new file
          const label = `${existing.name} ${written.manifest.version}`;
          setOffer({ oldId: existing.id, newId: written.manifest.id, label });
          actions.notify(
            `Move the ${existing.noteCount} notes on ${existing.name} (${existing.manifest.version}) to ${label}?`,
            {
              label: "Move notes…",
              onClick: () => openMove(existing.id, written.manifest.id, "move"),
            },
          );
        };

        // --- Surface 1: Share… on every profile row -------------------------------
        const sharing = share ? profileById(state, share.profileId) : null;
        const shareSheet = sharing ? (
          <Dialog
            width={460}
            title={`Share ${sharing.name}`}
            body={
              <div className="flex flex-col gap-3">
                <label className="flex items-center gap-3">
                  <span className="w-[110px] shrink-0">Version</span>
                  <input
                    value={share.version}
                    onChange={(e) =>
                      setShare({ ...share, version: e.target.value })
                    }
                    className="border-line bg-ground-2 w-[110px] rounded border px-2 py-[4px] font-mono text-[12px] outline-none"
                  />
                </label>
                <p className="text-muted leading-relaxed">
                  Your folders are left out. The person who takes this keeps
                  their own literature note folder and imported note folder.
                </p>
                <p className="text-muted leading-relaxed">
                  The <span className="font-mono text-[12px]">authors</span>{" "}
                  partial travels inside the copy, so nothing renders blank on
                  the other side.
                </p>
                <p className="leading-relaxed">
                  This writes a copy. Your own file{" "}
                  <span className="font-mono text-[12px]">
                    {sharing.document.split("/").pop()}
                  </span>{" "}
                  is not changed, and none of your notes change.
                </p>
              </div>
            }
            actions={[
              { label: "Cancel", onClick: () => setShare(null) },
              {
                label: "Copy as text",
                onClick: () => {
                  actions.exportProfile(sharing.id, {
                    target: "clipboard",
                    version: share.version,
                  });
                  setShare(null);
                },
              },
              {
                label: "Save file…",
                cta: true,
                onClick: () => {
                  const out = actions.exportProfile(sharing.id, {
                    target: "file",
                    version: share.version,
                  });
                  setShare(null);
                  setSettingsOpen(false);
                  setExported(out);
                },
              },
            ]}
          />
        ) : null;

        // --- Surfaces 3 + 4 + 5: one dialog, one outcome --------------------------
        const styleMissing =
          styleDraft && !state.installedStyles.includes(styleDraft);
        const slug = incoming ? slugOf(incoming.manifest.name) : "";
        const taken =
          incoming &&
          state.files.some(
            (f) =>
              f.path === `${state.templateFolder}/zotlit-profile.${slug}.md`,
          );
        const writtenPath = incoming
          ? taken
            ? `${state.templateFolder}/zotlit-profile.${slug}.<new id>.md`
            : `${state.templateFolder}/zotlit-profile.${slug}.md`
          : "";

        const pasteSheet =
          importStep === "paste" ? (
            <Dialog
              width={560}
              title="Add profile from text or file"
              body={
                <div className="flex flex-col gap-3">
                  <p className="text-muted leading-relaxed">
                    Paste the text you were sent, or drop the file here. Nothing
                    is written until you have read what it does.
                  </p>
                  <textarea
                    value={paste}
                    onChange={(e) => setPaste(e.target.value)}
                    spellCheck={false}
                    className="border-line bg-ground-2 text-ink/85 h-[220px] w-full resize-none rounded border px-3 py-2 font-mono text-[11px] leading-[1.6] outline-none"
                    placeholder="---&#10;id: …&#10;name: …"
                  />
                  {incoming ? (
                    <p className="text-muted leading-relaxed">
                      {incoming.filename} · {incoming.text.split("\n").length}{" "}
                      lines · arrived by {incoming.source}. None of your notes
                      change.
                    </p>
                  ) : (
                    <p className="text-muted leading-relaxed">
                      This vault has nothing waiting to be pasted —{" "}
                      {state.persona.name} is the sender here, not the
                      recipient. Switch to TAKE or EDITION to walk the seam.
                    </p>
                  )}
                </div>
              }
              actions={[
                { label: "Cancel", onClick: () => setImportStep(null) },
                {
                  label: "Continue",
                  cta: true,
                  disabled: !incoming,
                  onClick: () => setImportStep("consent"),
                },
              ]}
            />
          ) : null;

        const consentSheet =
          importStep === "consent" && incoming ? (
            <Dialog
              width={620}
              title="Add profile"
              body={
                <div className="flex flex-col gap-4">
                  <ManifestHeader manifest={incoming.manifest} />

                  {held ? (
                    <div className="border-line bg-ground-2 rounded-md border px-3 py-[10px] leading-relaxed">
                      You already have {held.name} (v{held.manifest.version} ·{" "}
                      {held.noteCount} notes
                      {held.edited ? ", edited by you" : ""}). This adds{" "}
                      <strong>
                        {held.name} {incoming.manifest.version}
                      </strong>{" "}
                      as a separate profile with a fresh ID; your notes stay
                      where they are.
                    </div>
                  ) : null}

                  <NotePreview
                    title={`Your own item, rendered — ${state.previewItem.title}`}
                    lines={renderNote(
                      { body: incoming.body },
                      state.previewItem,
                    )}
                  />

                  <div>
                    <YourSettingsRow
                      label="Literature note folder"
                      senderValue={
                        /^folder:/m.test(incoming.text)
                          ? incoming.manifest.folder
                          : "left out"
                      }
                      yourValue={folderDraft}
                      onChangeYourValue={setFolderDraft}
                    />
                    <YourSettingsRow
                      label="Citation style"
                      senderValue={
                        incoming.manifest.citationStyle ?? "left out"
                      }
                      yourValue={styleDraft}
                      onChangeYourValue={setStyleDraft}
                    />
                    {styleMissing ? (
                      <p className="text-muted mt-2 leading-relaxed">
                        <span style={{ color: "var(--danger)" }}>
                          {styleDraft} is not installed.
                        </span>{" "}
                        Notes render in {state.defaults.style} until you install
                        it.{" "}
                        <button
                          onClick={() => actions.installStyle(styleDraft)}
                          className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[2px] text-[12px]"
                        >
                          Install {styleDraft}
                        </button>
                      </p>
                    ) : null}
                    <p className="text-muted mt-2 leading-relaxed">
                      Empty means your Default: {state.defaults.folder} ·{" "}
                      {state.defaults.style}.
                    </p>
                  </div>

                  <EntersYourVault
                    files={[{ path: writtenPath, verdict: "new" }]}
                    fields={(incoming.manifest.frontmatter ?? []).map(
                      (f) => f.key,
                    )}
                  />

                  <p className="leading-relaxed">
                    This always adds a profile. None of your notes change.
                  </p>
                </div>
              }
              actions={[
                { label: "Back", onClick: () => setImportStep("paste") },
                { label: "Add profile", cta: true, onClick: addProfile },
              ]}
            />
          ) : null;

        // --- Surface 6: going back is the same gesture ----------------------------
        const moveFrom = move ? profileById(state, move.fromId) : null;
        const moveTo = move ? profileById(state, move.toId) : null;
        const moveDialog =
          move && moveFrom && moveTo ? (
            <MoveNotesDialog
              from={moveFrom}
              to={moveTo}
              onTo={(id) => setMove({ ...move, toId: id })}
              options={move.options}
              onOptions={(o) => setMove({ ...move, options: o })}
              title={
                move.mode === "delete"
                  ? `Delete ${moveFrom.name}`
                  : `Move notes off ${moveFrom.name}`
              }
              cta={
                move.mode === "delete" ? "Move notes and delete" : "Move notes"
              }
              ctaDestructive={move.mode === "delete"}
              intro={
                <p className="leading-relaxed">
                  {moveFrom.noteCount} notes re-render on their next update.
                  Moving them back is the same gesture, so this is reversible;
                  no profile file is overwritten either way.
                </p>
              }
              onCancel={() => setMove(null)}
              onConfirm={() => {
                actions.moveNotes(move.fromId, move.toId, {
                  imported: move.options.includeImported,
                });
                if (move.mode === "delete" && moveFrom.path)
                  actions.trashFile(moveFrom.path);
                setMove(null);
                setOffer(null);
              }}
            />
          ) : null;

        // --- The settings page ----------------------------------------------------
        const syncBanner =
          state.scenario === "sync" && offer ? (
            <Banner
              tone="accent"
              text={
                <>
                  Reading group arrived twice. ZotLit kept both files and gave
                  the newer one a fresh ID — it is “Reading group (2)”, saved as{" "}
                  <span className="font-mono text-[12px]">
                    zotlit-profile.reading-group (2).md
                  </span>{" "}
                  with 0 notes. Your 40 notes stay on the profile they were
                  already on. None of your notes change.
                </>
              }
              action={{
                label: "Move notes…",
                onClick: () => openMove(offer.oldId, offer.newId, "move"),
              }}
            />
          ) : null;

        const settings = (
          <SettingsModal
            open={settingsOpen}
            onClose={() => setSettingsOpen(false)}
          >
            <ProfilesPage
              banner={syncBanner}
              header={
                <button
                  onClick={(e) => {
                    // ContextMenu closes on the next window click; open after this one.
                    const { clientX: x, clientY: y } = e;
                    setTimeout(() => setMenu({ x, y }), 0);
                  }}
                  className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[4px] text-[12px] whitespace-nowrap"
                >
                  Add profile ▾
                </button>
              }
              onAdd={openImport}
              onOpen={(path) => {
                if (!path) return;
                actions.openFile(path);
                setSettingsOpen(false);
                setExported(null);
              }}
              onDuplicate={(id) =>
                actions.pushLog(
                  `Duplicated "${profileById(state, id).name}" — a new file with a fresh ID; none of your notes changed`,
                )
              }
              onDelete={(id) => {
                const target =
                  offer && offer.newId === id
                    ? offer.oldId
                    : (discovered.find((p) => p.id !== id)?.id ?? DEFAULT_ID);
                openMove(id, target, "delete");
              }}
              extraRowActions={(p) => (
                <>
                  <Pill tone="muted">v{p.manifest?.version ?? "—"}</Pill>
                  {offer && offer.newId === p.id ? (
                    <button
                      onClick={() => openMove(offer.oldId, offer.newId, "move")}
                      className="cursor-pointer rounded border px-2 py-[4px] text-[12px] whitespace-nowrap"
                      style={{
                        borderColor: "var(--accent)",
                        color: "var(--accent)",
                      }}
                    >
                      Move notes here…
                    </button>
                  ) : null}
                  <button
                    onClick={() =>
                      setShare({ profileId: p.id, version: p.manifest.version })
                    }
                    className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[4px] text-[12px] whitespace-nowrap"
                  >
                    Share…
                  </button>
                </>
              )}
              footer={
                <p className="text-muted mt-4 text-[13px] leading-relaxed">
                  Taking a profile in never replaces one. There is no
                  consequences dialog here, because nothing on this page can
                  re-render a note — only Move notes… does, and it says how
                  many.
                </p>
              }
            />
          </SettingsModal>
        );

        const dropdown = menu ? (
          <ContextMenu
            x={menu.x}
            y={menu.y}
            onClose={() => setMenu(null)}
            items={[
              {
                label: "From text or file…",
                icon: Download,
                onClick: openImport,
              },
              {
                label: "Empty profile",
                icon: Plus,
                onClick: () =>
                  actions.pushLog("Add profile: empty (not prototyped)"),
              },
            ]}
          />
        ) : null;

        const commandPalette = (
          <CommandPalette
            open={palette}
            onClose={() => setPalette(false)}
            items={[
              {
                label: "ZotLit: Add profile from text or file…",
                onSelect: () => {
                  setPalette(false);
                  openImport();
                },
              },
              {
                label: "ZotLit: Open literature note profiles",
                onSelect: () => {
                  setPalette(false);
                  setSettingsOpen(true);
                },
              },
            ]}
          />
        );

        // One dialog at a time, stacked over the settings page rather than replacing it.
        const topDialog =
          moveDialog ??
          consentSheet ??
          pasteSheet ??
          shareSheet ??
          (palette ? commandPalette : null);

        const overlay =
          settingsOpen || topDialog || dropdown ? (
            <div className="relative flex h-full w-full items-center justify-center">
              {settingsOpen ? settings : null}
              {topDialog ? (
                <div
                  className="absolute inset-0 flex items-center justify-center"
                  style={{ background: "rgba(0,0,0,0.28)" }}
                >
                  {topDialog}
                </div>
              ) : null}
              {dropdown}
            </div>
          ) : null;

        // --- Surface 2: the shareable copy, as plain text -------------------------
        const exportedView = exported ? (
          <div className="flex flex-col gap-3">
            <Banner
              tone="accent"
              text={
                <>
                  This is the copy that leaves your vault — partials bundled in,
                  your folders left out. Your own profile file is unchanged.
                </>
              }
              action={{
                label: "Back to profiles",
                onClick: () => {
                  setExported(null);
                  setSettingsOpen(true);
                },
              }}
            />
            <FileText path={exported.path} source={exported.text} />
          </div>
        ) : null;

        const STEPS = {
          send: [
            "Settings is open on Profiles. Find the Reading group row.",
            "Press Share… — set the version, read “Your folders are left out”.",
            "Press Save file… — the copy opens as plain text, manifest shaded.",
            "Open Add profile ▾ → From text or file… to see the other door; this vault has nothing to paste.",
            "Nothing was written. Your file and your 40 notes are untouched.",
          ],
          take: [
            "Press Add profile ▾ → From text or file… (the command palette has the same entry).",
            "The paste box already holds the text from the blog post. Press Continue.",
            "Read the sheet: your own item rendered, one new file, “None of your notes change.”",
            "chicago-note is not installed — install it, or leave the folder empty for your Default.",
            "Press Add profile. One file appears in templates/; zero notes moved.",
          ],
          sync: [
            "ZotLit already settled it: read the notice and the banner on Profiles.",
            "Both files are kept. The newer one is Reading group (2) with 0 notes.",
            "Press Move notes here… on its row to bring the 40 notes over.",
            "Going back: Delete profile on Reading group (2) moves them back and trashes the file.",
          ],
          edition: [
            "Press Add profile ▾ → From text or file… — Anna's v1.1 is staged.",
            "Continue. The sheet says, calmly, that you already have v1.0 and that you edited it.",
            "Press Add profile — a separate profile with a fresh ID. Your “## Key quotes” stays in the old file.",
            "Take the follow-up offer: Move notes… moves 40 notes; they re-render on their next update.",
            "Undo it with Move notes here… on the old row, or Delete profile on the new one.",
          ],
        };

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              overlay={overlay}
              footer={
                <button
                  onClick={() => setPalette(true)}
                  className="text-muted cursor-pointer underline decoration-dotted"
                >
                  Command palette
                </button>
              }
              statusItems={
                <button
                  onClick={() => setSettingsOpen(true)}
                  className="text-muted cursor-pointer underline decoration-dotted"
                >
                  Profiles
                </button>
              }
            >
              {exportedView}
            </ObsidianFrame>

            <Rail
              thesis="A shared profile can only add; your notes change only when you move them, and moving back is the undo."
              answers={[
                {
                  q: "What do I send?",
                  a: "A copy with your folders left out and the authors partial bundled in. Your own file never changes.",
                },
                {
                  q: "What do I do with this file?",
                  a: "Add profile ▾ → From text or file…, read one sheet, and it becomes one new file in templates/.",
                },
                {
                  q: "Which of my notes change if I accept?",
                  a: "None, ever. An import only adds a profile; notes change when you move them, behind a stated count.",
                },
                {
                  q: "Can I take it back?",
                  a: "Move the notes back, or Delete profile — the same gesture, undone. The old file was never touched.",
                },
                {
                  q: "Is this the one I already have?",
                  a: "The sheet says so and adds the new edition beside it with a fresh ID; in place, ZotLit does the same by itself.",
                },
              ]}
              steps={STEPS[state.scenario] ?? []}
              extras={
                <div>
                  <div className="font-display text-muted mb-2 text-[11px] font-semibold tracking-[0.08em] uppercase">
                    Deliberately absent
                  </div>
                  <p className="text-muted leading-relaxed">
                    No consequences dialog, no Replace, no before/after diff.
                    Nothing here can re-render a stamped note, so there is
                    nothing to weigh — only Move notes… changes a note, and it
                    states the count first.
                  </p>
                </div>
              }
            />
          </div>
        );
      }
      // --- Variant D END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Drop it in", component: VariantA },
        { key: "B", name: "Import sheet", component: VariantB },
        { key: "C", name: "Open it first", component: VariantC },
        { key: "D", name: "Always additive", component: VariantD },
      ];

      const SCENARIO_PRESETS = [
        {
          id: "send",
          label: "SEND",
          hint: "Anna (postdoc) — what do I send?",
        },
        {
          id: "take",
          label: "TAKE",
          hint: "Ben (first year) — what do I do with this?",
        },
        {
          id: "sync",
          label: "SYNC",
          hint: "Dr. Reyes (supervisor) — is this the one I already have?",
        },
        {
          id: "edition",
          label: "EDITION",
          hint: "Chen (PhD candidate) — can I take the revision?",
        },
      ];

      function App() {
        const { state } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        return (
          <div className="bg-ground text-ink font-body flex h-screen flex-col">
            <div
              style={{
                flex: "none",
                background: "#1e293b",
                color: "#f8fafc",
                padding: "0.4rem 1rem",
                display: "flex",
                alignItems: "center",
                gap: "1rem",
                fontSize: "0.875rem",
                zIndex: 9999,
              }}
            >
              <button
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={{
                  background: "none",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  fontSize: "1.25rem",
                }}
              >
                ←
              </button>
              <span style={{ whiteSpace: "nowrap" }}>
                {V.key} — {V.name}
              </span>
              <button
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={{
                  background: "none",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  fontSize: "1.25rem",
                }}
              >
                →
              </button>
              <span
                style={{
                  width: "1px",
                  alignSelf: "stretch",
                  background: "rgba(248,250,252,0.25)",
                }}
              />
              {SCENARIO_PRESETS.map((p) => (
                <button
                  key={p.id}
                  title={p.hint}
                  onClick={() => actions.setScenario(p.id)}
                  style={{
                    background:
                      state.scenario === p.id ? "#f8fafc" : "transparent",
                    color: state.scenario === p.id ? "#1e293b" : "inherit",
                    border: "1px solid rgba(248,250,252,0.25)",
                    borderRadius: "9999px",
                    padding: "0.15rem 0.6rem",
                    cursor: "pointer",
                    fontSize: "0.75rem",
                    whiteSpace: "nowrap",
                  }}
                >
                  {p.label}
                </button>
              ))}
              <span style={{ opacity: 0.7, fontSize: "0.75rem" }}>
                {state.persona.name} · {state.persona.role}
              </span>
            </div>
            <div className="min-h-0 flex-1">
              <V.component />
            </div>
          </div>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      // A console handle on the store, so the browser can be asked what the vault derives.
      window.proto = {
        getSnapshot,
        actions,
        profiles,
        profileById,
        stampLabel,
        shareableText,
        renderNote,
        diffLines,
        staleNotes,
        fileText,
      };

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
