            </>,
          ],
          edition: [
            <>
              Run <b>Paste</b> from the palette — Anna's v1.1 lands in{" "}
              <span className="font-mono text-[11px]">Pasted.md</span>.
            </>,
            <>
              Right-click it and pick <b>Move to templates/</b>. Obsidian's own
              prompt says the file exists: <b>Replace</b> or <b>Keep both</b>.
            </>,
            <>
              <b>Keep both</b> gives the second file the ID-suffixed name — and
              both files now carry one ID, so the collision banner is the
              second-edition surface here too.
            </>,
            <>
              <b>Replace</b> is Obsidian's only guard: it overwrites the bytes,
              your "## Key quotes" edit goes to the trash with the old file, and
              40 notes re-render on their next update.
            </>,
          ],
        }[state.scenario];

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              sidePane={paneNode()}
              overlay={overlay()}
              onFileMenu={openMenu}
              statusItems={
                <div className="flex items-center gap-3">
                  <button
                    onClick={() => setPalette(true)}
                    className="text-muted flex cursor-pointer items-center gap-[6px]"
                  >
                    <Kbd>⌘P</Kbd> commands
                  </button>
                  <button
                    onClick={() => setSettings(true)}
                    className="text-muted flex cursor-pointer items-center gap-[6px]"
                  >
                    <Settings size={12} /> profiles
                  </button>
                </div>
              }
              footer={
                <span>
                  {list.filter((p) => !p.excluded && !p.isDefault).length}{" "}
                  profiles in {state.templateFolder}/
                </span>
              }
            >
              {collisionBanner()}
              {recognizedBanner()}
              {state.scenario === "take" || state.scenario === "edition"
                ? consentNote()
                : null}
              {menu ? (
                <ContextMenu
                  x={menu.x}
                  y={menu.y}
                  items={menuItems(menu.path)}
                  onClose={() => setMenu(null)}
                />
              ) : null}
            </ObsidianFrame>

            <Rail
              thesis="The format already carries the whole flow; every door is a file operation the researcher already knows. ZotLit adds no seam and no dialog — it only says, in place, what the file became."
              answers={[
                {
                  q: "what do I send",
                  a: "One file. Right-click the profile document → Create shareable copy: partials bundled in, your folders left out.",
                },
                {
                  q: "what do I do with this file",
                  a: "Paste it into a note and move it into templates/. The move is the install.",
                },
                {
                  q: "which of my notes change if I accept",
                  a: "None on arrival. Notes only re-render when a file with an ID they already carry replaces the one they render from.",
                },
                {
                  q: "can I take it back",
                  a: "Delete it, or rename it out of the prefix. Obsidian's trash holds it; ZotLit adds nothing here.",
                },
                {
                  q: "is this the one I already have",
                  a: "The ID answers it. Two files with one ID are both excluded and both carry the red banner until you pick.",
                },
              ]}
              steps={steps}
              extras={
                <>
                  <div>
                    <div className="font-display text-muted mb-2 text-[11px] font-semibold tracking-[0.08em] uppercase">
                      Consent
                    </div>
                    <p className="leading-relaxed">
                      This variant has no consent step and does not pretend to:
                      the file explorer writes, then the banner reports. The
                      guard is that arriving costs zero notes, and Obsidian's
                      own overwrite prompt is the only thing standing between a
                      matching filename and a lost edit.
                    </p>
                  </div>
                  <div>
                    <div className="font-display text-muted mb-2 text-[11px] font-semibold tracking-[0.08em] uppercase">
                      Going back
                    </div>
                    {state.trash.length === 0 ? (
                      <p className="text-muted leading-relaxed">
                        Trash is empty. Delete from the file menu puts a file
                        here; ZotLit keeps no records of its own and adds
                        nothing to this route.
                      </p>
                    ) : (
                      <div className="flex flex-col gap-1">
                        {state.trash.map((f) => (
                          <div
                            key={f.path}
                            className="flex items-start gap-2 leading-snug"
                          >
                            <span className="text-muted min-w-0 flex-1 font-mono text-[11px] break-all">
                              {f.path.split("/").pop()}
                            </span>
                            <button
                              onClick={() => actions.restoreFromTrash(f.path)}
                              className="text-accent shrink-0 cursor-pointer text-[11px]"
                            >
                              Restore
                            </button>
                          </div>
                        ))}
                        <p className="text-muted mt-1 leading-relaxed">
                          Obsidian's trash, not ZotLit's. Restoring a file whose
                          ID is still held brings the collision banner back.
                        </p>
                      </div>
                    )}
                  </div>
                </>
              }
            />
          </div>
        );
      }
      // --- Variant A END ---

      // --- Variant B ---
      // B — Import sheet. Settings-first, the Zotero "install style from file" model: one
      // modal per act. Share… on a Profile row opens the Share sheet; `Add profile` opens the
      // Import sheet, which FLIPS from a paste box to the consent step, or to the
      // second-edition sheet when the arriving ID is already in the vault. The in-place
      // collision (SYNC) has no seam, so a Notice and the diagnostic row both open the same
      // second-edition sheet with a fourth choice.

      function B_Btn({
        label,
        tone = "muted",
        cta = false,
        onClick,
        disabled,
      }) {
        return (
          <button
            onClick={onClick}
            disabled={disabled}
            className="cursor-pointer rounded border px-2 py-[4px] text-[12px] whitespace-nowrap"
            style={{
              opacity: disabled ? 0.45 : 1,
              cursor: disabled ? "not-allowed" : "pointer",
              borderColor: "var(--line)",
              background: cta ? "var(--accent)" : "var(--ground)",
              color: cta
                ? "#ffffff"
                : tone === "danger"
                  ? "var(--danger)"
                  : "var(--ink)",
            }}
          >
            {label}
          </button>
        );
      }

      function B_Field({ label, value, onChange, mono = true, area = false }) {
        const cls = `border-line bg-ground-2 text-ink w-full rounded border px-2 py-[4px] text-[12px] outline-none ${
          mono ? "font-mono" : ""
        }`;
        return (
          <label className="flex items-start gap-3 py-[5px] text-[13px]">
            <span className="w-[150px] shrink-0 pt-[5px]">{label}</span>
            {area ? (
              <textarea
                value={value}
                rows={2}
                onChange={(e) => onChange(e.target.value)}
                className={cls}
              />
            ) : (
              <input
                value={value}
                onChange={(e) => onChange(e.target.value)}
                className={cls}
              />
            )}
          </label>
        );
      }

      // One choice in the second-edition sheet: a heading and the sentence that states the
      // consequence in notes, not in files.
      function B_Choice({ label, line, tone = "muted", onClick }) {
        return (
          <button
            onClick={onClick}
            className="border-line bg-ground w-full cursor-pointer rounded-md border px-3 py-2 text-left"
          >
            <div
              className="text-[13px] font-semibold"
              style={{
                color: tone === "danger" ? "var(--danger)" : "var(--ink)",
              }}
            >
              {label}
            </div>
            <div className="text-muted mt-[2px] text-[12px] leading-relaxed">
              {line}
            </div>
          </button>
        );
      }

      function B_bump(v) {
        const parts = String(v ?? "1.0").split(".");
        const i = parts.length > 1 ? 1 : 0;
        parts[i] = String(Number(parts[i] ?? 0) + 1);
        return parts.join(".");
      }

      function B_partials(body) {
        return [...(body ?? "").matchAll(/\{%\s*render\s+"([^"]+)"/g)].map(
          (m) => m[1],
        );
      }

      function VariantB() {
        const { state } = useProtoState();
        const list = profiles(state);
        const shared = list.filter((p) => !p.isDefault);
        const dflt = list.find((p) => p.isDefault);
        const excluded = list.filter((p) => p.excluded);

        const [settingsOpen, setSettingsOpen] = useState(true);
        const [menuOpen, setMenuOpen] = useState(false);
        const [paletteOpen, setPaletteOpen] = useState(false);
        // sheet: {kind:"share", id} | {kind:"import"} | {kind:"second", id, mode}
        const [sheet, setSheet] = useState(null);
        const [phase, setPhase] = useState("paste");
        const [paste, setPaste] = useState("");
        const [share, setShare] = useState({
          version: "",
          author: "",
          description: "",
          includeFolders: false,
        });
        const [folderDraft, setFolderDraft] = useState("");
        const [styleDraft, setStyleDraft] = useState("");
        const [exportView, setExportView] = useState(false);
        const [restored, setRestored] = useState(null);

        // Every scenario is a different vault; the sheets start closed on the switch.
        useEffect(() => {
          setSheet(null);
          setPhase("paste");
          setPaste("");
          setMenuOpen(false);
          setPaletteOpen(false);
          setExportView(false);
          setRestored(null);
          setSettingsOpen(true);
        }, [state.scenario]);

        // SYNC: the file simply appeared, so no seam was crossed. ZotLit says so itself.
        const notified = useRef(null);
        useEffect(() => {
          if (notified.current === state.scenario) return;
          notified.current = state.scenario;
          if (state.scenario !== "sync") return;
          const dup = profiles(state).find((p) => p.excluded);
          if (!dup) return;
          actions.notify(
            `${dup.name} arrived twice — ${dup.noteCount} notes wait`,
            {
              label: "Resolve…",
              onClick: () => {
                setSettingsOpen(true);
                setSheet({ kind: "second", id: dup.id, mode: "collision" });
              },
            },
          );
        }, [state.scenario]);

        const openShare = (p) => {
          setMenuOpen(false);
          setShare({
            version: B_bump(p.manifest?.version ?? "1.0"),
            author: p.manifest?.author ?? state.persona.name,
            description: p.manifest?.description ?? "",
            includeFolders: false,
          });
          setSheet({ kind: "share", id: p.id });
        };

        const openImport = () => {
          setMenuOpen(false);
          setPaletteOpen(false);
          setSettingsOpen(true);
          setPaste("");
          setPhase("paste");
          setSheet({ kind: "import" });
        };

        // The one flip: staged text either becomes a consent step or a second edition.
        const advance = (inc) => {
          if (!inc) return;
          const held = profiles(state).find(
            (p) => !p.isDefault && p.id === inc.manifest.id,
          );
          if (held) {
            setSheet({ kind: "second", id: held.id, mode: "edition" });
            return;
          }
          setFolderDraft("");
          setStyleDraft(inc.manifest.citationStyle ?? "");
          setPhase("consent");
        };

        const showExport = () => {
          setSheet(null);
          setSettingsOpen(false);
          setExportView(true);
        };

        // --- Surface 1: the Share sheet ------------------------------------
        const shareSheet = () => {
          const p = profileById(state, sheet.id);
          if (!p) return null;
          const names = B_partials(p.body);
          if (!p.manifest) {
            return (
              <Dialog
                width={560}
                title={`Share ${p.name}`}
                body={
                  <div className="flex flex-col gap-2">
                    <p>
                      Default has no template document yet, so there is no file
                      to share. Customize the template document first.
                    </p>
                    <p className="text-muted">
                      The copy leaves as a normal profile file with a freshly
                      minted profile ID — recipients get a profile beside their
                      own Default, never a new Default. None of your notes
                      change.
                    </p>
                  </div>
                }
                actions={[
                  { label: "Cancel", onClick: () => setSheet(null) },
                  { label: "Save file…", disabled: true, cta: true },
                ]}
              />
            );
          }
          const run = (target) => {
            const res = actions.exportProfile(p.id, {
              includeFolders: share.includeFolders,
              target,
              version: share.version,
            });
            setSheet(null);
            if (!res) return;
            if (target === "file") {
              setSettingsOpen(false);
              setExportView(true);
              return;
            }
            actions.notify(
              `Copied ${p.name} v${share.version} as text — ${
                res.text.split("\n").length
              } lines, the ${names.join(", ")} partial inside, your folders ${
                share.includeFolders ? "included" : "left out"
              }.`,
              { label: "Show", onClick: showExport },
            );
          };
          return (
            <Dialog
              width={600}
              title={`Share ${p.name}`}
              body={
                <div className="flex max-h-[46vh] flex-col gap-1 overflow-y-auto pr-1">
                  <B_Field
                    label="Name"
                    value={p.name}
                    onChange={() => {}}
                    mono={false}
                  />
                  <B_Field
                    label="Version"
                    value={share.version}
                    onChange={(v) => setShare({ ...share, version: v })}
                  />
                  <div className="text-muted pl-[162px] text-[12px] leading-relaxed">
                    The version tells recipients this is a newer edition. Yours
                    is v{p.manifest.version}.
                  </div>
                  <B_Field
                    label="Author"
                    value={share.author}
                    onChange={(v) => setShare({ ...share, author: v })}
                    mono={false}
                  />
                  <B_Field
                    label="Description"
                    value={share.description}
                    onChange={(v) => setShare({ ...share, description: v })}
                    mono={false}
                    area
                  />
                  <div className="text-muted mt-2 text-[13px]">
                    Partials bundled: {names.length ? names.join(", ") : "none"}
                  </div>
                  <div className="text-muted text-[12px] leading-relaxed">
                    A partial lives beside the document, so a hand copy-paste
                    loses it. It travels inside this copy.
                  </div>
                </div>
              }
              checkboxes={[
                {
                  label: `Include my folders (${p.folder}, ${p.importFolder})`,
                  note: "Off: recipients keep their own folders.",
                  checked: share.includeFolders,
                  onChange: (v) => setShare({ ...share, includeFolders: v }),
                },
              ]}
              actions={[
                { label: "Cancel", onClick: () => setSheet(null) },
                { label: "Copy as text", onClick: () => run("clipboard") },
                { label: "Save file…", cta: true, onClick: () => run("file") },
              ]}
            />
          );
        };

        // --- Surfaces 3 and 4: the Import sheet, both phases -----------------
        const importSheet = () => {
          const inc = state.incoming;
          if (phase === "paste") {
            const nothing = !state.incomingSeed;
            return (
              <Dialog
                width={600}
                title="Add profile from text or file"
                body={
                  <div className="flex flex-col gap-3">
                    {nothing ? (
                      <p className="text-muted">
                        Nothing arrived from outside this vault in this
                        scenario, so there is no text to stage. The sheet is the
                        only import door in this variant; switch to TAKE or
                        EDITION to walk it.
                      </p>
                    ) : (
                      <p className="text-muted">
                        Paste the text of a profile, or choose the file you were
                        sent. Nothing is written until you have read the next
                        step.
                      </p>
                    )}
                    <textarea
                      value={paste}
                      onChange={(e) => setPaste(e.target.value)}
                      rows={7}
                      placeholder="---&#10;id: …&#10;name: …&#10;---"
                      className="border-line bg-ground-2 text-ink/85 w-full rounded border px-2 py-2 font-mono text-[11px] leading-[1.6] outline-none"
                    />
                    {inc ? (
                      <div className="text-muted text-[12px]">
                        {inc.filename} · {inc.text.split("\n").length} lines ·
                        nothing written yet
                      </div>
                    ) : null}
                  </div>
                }
                actions={[
                  { label: "Cancel", onClick: () => setSheet(null) },
                  {
                    label: "Paste",
                    disabled: nothing,
                    onClick: () => {
                      const got = actions.stageIncoming("paste");
                      if (got) setPaste(got.text);
                    },
                  },
                  {
                    label: "Choose file…",
                    disabled: nothing,
                    onClick: () => {
                      const got = actions.stageIncoming("file");
                      if (!got) return;
                      setPaste(got.text);
                      advance(got);
                    },
                  },
                  {
                    label: "Continue",
                    cta: true,
                    disabled: !inc,
                    onClick: () => advance(inc),
                  },
                ]}
              />
            );
          }

          if (!inc) return null;
          const lines = renderNote({ body: inc.body }, state.previewItem);
          const installed = state.installedStyles.includes(styleDraft);
          // What the TEXT carries, not what the sender's own file holds: a copy made with
          // "Include my folders" off has no folder key at all.
          const sentFolder = inc.text.includes("\nfolder: ")
            ? inc.manifest.folder
            : "left out — your folders stay";
          const fields = (inc.manifest.frontmatter ?? []).map((f) => f.key);
          const names = B_partials(inc.body);
          return (
            <Dialog
              width={640}
              title="Add profile"
              body={
                <div className="flex max-h-[52vh] flex-col gap-3 overflow-y-auto pr-1">
                  <ManifestHeader manifest={inc.manifest} />
                  <NotePreview
                    title={`${state.previewItem.title} — one of your own items, rendered with this profile`}
                    lines={lines}
                  />
                  <div>
                    <div className="text-muted mb-1 text-[11px] tracking-[0.06em] uppercase">
                      Your settings
                    </div>
                    <YourSettingsRow
                      label="Literature note folder"
                      senderValue={sentFolder}
                      yourValue={folderDraft}
                      onChangeYourValue={setFolderDraft}
                    />
                    <div className="text-muted py-1 text-[12px]">
                      Empty means same as Default ({dflt.folder}).
                    </div>
                    <YourSettingsRow
                      label="Citation style"
                      senderValue={inc.manifest.citationStyle ?? "left out"}
                      yourValue={styleDraft}
                      onChangeYourValue={setStyleDraft}
                    />
                    {styleDraft && !installed ? (
                      <div className="flex items-center gap-2 py-1 text-[12px]">
                        <span style={{ color: "var(--danger)" }}>
                          {styleDraft} is not installed — notes render with the
                          built-in style until you add it.
                        </span>
                        <B_Btn
                          label="Install…"
                          onClick={() => actions.installStyle(styleDraft)}
                        />
                      </div>
                    ) : null}
                  </div>
                  <EntersYourVault
                    files={[
                      {
                        path: `${state.templateFolder}/${inc.filename}`,
                        verdict: "new",
                      },
                    ]}
                    fields={fields}
                  />
                  <div className="text-muted text-[12px]">
                    {names.length
                      ? `${names.length} partial (${names.join(", ")}) travels inside the file.`
                      : "No partials travel with this file."}
                  </div>
                  <div className="text-[13px] font-semibold">
                    None of your notes change.
                  </div>
                </div>
              }
              actions={[
                { label: "Cancel", onClick: () => setSheet(null) },
                {
                  label: "Add profile",
                  cta: true,
                  onClick: () => {
                    const name = inc.manifest.name;
                    actions.writeIncoming({
                      folder: folderDraft,
                      style: styleDraft,
                    });
                    setSheet(null);
                    setPhase("paste");
                    setSettingsOpen(true);
                    actions.notify(
                      `${name} was added. None of your notes change.`,
                    );
                  },
                },
              ]}
            />
          );
        };

        // --- Surface 5: the second-edition sheet, from the seam and in place ---
        const secondSheet = () => {
          const held = profileById(state, sheet.id);
          if (!held) return null;
          const collision = sheet.mode === "collision";
          const clash = state.files.filter(
            (f) => f.kind === "profile" && f.manifest?.id === sheet.id,
          );
          const theirs = collision
            ? clash[1]
            : state.incoming
              ? { manifest: state.incoming.manifest, body: state.incoming.body }
              : null;
          if (!theirs) return null;
          const before = renderNote({ body: held.body }, state.previewItem);
          const after = renderNote({ body: theirs.body }, state.previewItem);
          const prevPath = `${state.templateFolder}/${held.name} (before ${theirs.manifest.version}).md`;
          const choices = collision
            ? [
                {
                  label: "Replace mine",
                  tone: "danger",
                  line: `Their file wins; your file goes to the Obsidian trash. ${held.noteCount} notes re-render on their next update, in ${theirs.manifest.folder ?? dflt.folder}.`,
                  onClick: () => {
                    actions.resolveCollision(sheet.id, "theirs");
                    setSheet(null);
                  },
                },
                {
                  label: "Keep mine",
                  line: `Their file goes to the Obsidian trash. Your folder ${held.folder} stays and the ${held.noteCount} notes resolve again on their next update.`,
                  onClick: () => {
                    actions.resolveCollision(sheet.id, "mine");
                    setSheet(null);
                  },
                },
                {
                  label: "Keep both as separate profiles",
                  line: `The second file gets a fresh ID and the name "${held.name} (2)" with 0 notes. Your ${held.noteCount} notes stay on the first.`,
                  onClick: () => {
                    actions.resolveCollision(sheet.id, "both");
                    setSheet(null);
                  },
                },
              ]
            : [
                {
                  label: "Replace mine",
                  tone: "danger",
                  line: `${held.noteCount} notes re-render on their next update. Your current file is kept as ${prevPath.split("/").pop()} outside the registry.`,
                  onClick: () => {
                    actions.replaceProfile(sheet.id, { keepPrevious: true });
                    setRestored({
                      id: sheet.id,
                      prevPath,
                      from: held.manifest.version,
                      to: theirs.manifest.version,
                    });
                    setSheet(null);
                    setPhase("paste");
                    actions.notify(
                      `${held.name} is now v${theirs.manifest.version}. ${held.noteCount} notes re-render on their next update.`,
                    );
                  },
                },
                {
                  label: "Add as separate profile",
                  line: `A new profile "${held.name} (${theirs.manifest.author ?? "theirs"} ${theirs.manifest.version})" with a fresh ID, in its own file. None of your notes change.`,
                  onClick: () => {
                    actions.writeIncoming({ asNewId: true });
                    setSheet(null);
                    setPhase("paste");
                    actions.notify(
                      "Added as a separate profile with 0 notes. None of your notes change.",
                    );
                  },
                },
              ];
          return (
            <Dialog
              width={660}
              title={`You already have ${held.name}`}
              body={
                <div className="flex max-h-[52vh] flex-col gap-3 overflow-y-auto pr-1">
                  <p>
                    You already have {held.name} (v{held.manifest.version} ·{" "}
                    {held.noteCount} notes · {held.importedCount} imported
                    notes). The arriving file carries the same profile ID, so it
                    is a second edition of this profile — never a new one.
                  </p>
                  <div className="text-muted font-mono text-[11px] break-all">
                    {held.id} · v{held.manifest.version} → v
                    {theirs.manifest.version}
                    {collision ? ` · ${clash[1].path}` : ""}
                  </div>
                  <NotePreview
                    title={`${state.previewItem.title} — your own note, before and after`}
                    lines={after}
                    diffAgainst={before}
                  />
                  {held.edited ? (
                    <div
                      className="text-[13px] leading-relaxed"
                      style={{ color: "var(--danger)" }}
                    >
                      Your own line “## Key quotes” sits inside the managed
                      block. Replacing loses it — the struck-through line above.
                    </div>
                  ) : null}
                  {collision ? (
                    <div className="text-muted text-[12px] leading-relaxed">
                      No dialog asked you first: the file arrived beside yours
                      by sync. Until you pick, both files are out of the
                      registry and the {held.noteCount} notes wait.
                    </div>
                  ) : null}
                  <div className="flex flex-col gap-2">
                    {choices.map((c) => (
                      <B_Choice key={c.label} {...c} />
                    ))}
                  </div>
                </div>
              }
              actions={[{ label: "Cancel", onClick: () => setSheet(null) }]}
            />
          );
        };

        const sheetNode =
          sheet?.kind === "share"
            ? shareSheet()
            : sheet?.kind === "import"
              ? importSheet()
              : sheet?.kind === "second"
                ? secondSheet()
                : null;

        // --- Surface 6: going back ------------------------------------------
        const restorePrevious = () => {
          const cur = profileById(state, restored.id);
          if (!cur?.path) return;
          const target = cur.path;
          actions.trashFile(target);
          actions.renameFile(restored.prevPath, target);
          actions.notify(
            `Restored v${restored.from}. ${cur.noteCount} notes re-render on their next update.`,
          );
          setRestored(null);
        };

        const rowActions = (p) => (
          <>
            {p.excluded ? (
              <B_Btn
                label="Resolve…"
                onClick={() =>
                  setSheet({ kind: "second", id: p.id, mode: "collision" })
                }
              />
            ) : (
              <B_Btn label="Share…" onClick={() => openShare(p)} />
            )}
            {restored && restored.id === p.id ? (
              <>
                <span className="text-muted text-[11px] whitespace-nowrap">
                  Replaced v{restored.from} → v{restored.to} · previous file:{" "}
                  {restored.prevPath.split("/").pop()}
                </span>
                <B_Btn label="Restore previous" onClick={restorePrevious} />
              </>
            ) : null}
          </>
        );

        const settings = (
          <SettingsModal
            open={settingsOpen}
            onClose={() => setSettingsOpen(false)}
          >
            <ProfilesPage
              banner={
                excluded.length ? (
                  <Banner
                    tone="danger"
                    text={`Two files carry the ${excluded[0].name} ID, so both are out of the registry and ${excluded[0].noteCount} notes wait.`}
                    action={{
                      label: "Resolve…",
                      onClick: () =>
                        setSheet({
                          kind: "second",
                          id: excluded[0].id,
                          mode: "collision",
                        }),
                    }}
                  />
                ) : null
              }
              header={
                <div className="relative">
                  {menuOpen ? (
                    <div className="border-line bg-ground absolute top-5 right-0 z-20 w-[250px] overflow-hidden rounded-md border py-1 shadow-2xl">
                      <button
                        onClick={() => {
                          setMenuOpen(false);
                          actions.pushLog(
                            "New profile… — a blank profile document",
                          );
                        }}
                        className="text-ink flex w-full cursor-pointer items-center gap-2 px-3 py-[6px] text-left text-[13px]"
                      >
                        <Plus size={14} className="text-muted" /> New profile…
                      </button>
                      <button
                        onClick={openImport}
                        className="text-ink flex w-full cursor-pointer items-center gap-2 px-3 py-[6px] text-left text-[13px]"
                      >
                        <Download size={14} className="text-muted" /> From text
                        or file…
                      </button>
                    </div>
                  ) : null}
                </div>
              }
              onAdd={() => setMenuOpen((v) => !v)}
              onOpen={(path) => {
                setSettingsOpen(false);
                setExportView(false);
                actions.openFile(path);
              }}
              onDuplicate={(id) =>
                actions.pushLog(
                  `Duplicate "${profileById(state, id)?.name}" — a copy with a fresh ID`,
                )
              }
              onDelete={(id) => {
                const p = profileById(state, id);
                if (!p?.path) return;
                actions.trashFile(p.path);
                actions.notify(
                  p.noteCount === 0
                    ? `${p.name} was deleted. It held 0 notes, so none of your notes change.`
                    : `${p.name} was deleted. ${p.noteCount} notes re-render on their next update.`,
                );
              }}
              extraRowActions={rowActions}
              footer={
                <div className="border-line mt-4 flex items-center gap-3 border-t pt-3">
                  <div className="min-w-0 flex-1 text-[13px]">
                    Share the Default profile
                    <div className="text-muted mt-[2px] text-[12px]">
                      It leaves as a normal profile file with a fresh profile
                      ID.
                    </div>
                  </div>
                  <B_Btn label="Share…" onClick={() => openShare(dflt)} />
                </div>
              }
            />
          </SettingsModal>
        );

        const palette = (
          <CommandPalette
            open={paletteOpen}
            onClose={() => setPaletteOpen(false)}
            items={[
              { label: "ZotLit: Import profile…", onSelect: openImport },
              {
                label: "ZotLit: Share profile…",
                onSelect: () => {
                  setPaletteOpen(false);
                  setSettingsOpen(true);
                  openShare(shared[0] ?? dflt);
                },
              },
              {
                label: "ZotLit: Open literature note profiles",
                onSelect: () => {
                  setPaletteOpen(false);
                  setExportView(false);
                  setSettingsOpen(true);
                },
              },
            ]}
          />
        );

        const overlay =
          settingsOpen || sheetNode || paletteOpen ? (
            <div className="relative flex h-full w-full items-center justify-center">
              {settingsOpen ? settings : null}
              {sheetNode ? (
                <div
                  className="absolute inset-0 flex items-center justify-center"
                  style={{ background: "rgba(0,0,0,0.28)" }}
                >
                  {sheetNode}
                </div>
              ) : null}
              {paletteOpen ? (
                <div className="absolute inset-0 flex items-start justify-center pt-16">
                  {palette}
                </div>
              ) : null}
            </div>
          ) : null;

        // --- Surface 2: the shareable copy as plain text --------------------
        const exp = state.lastExport;
        const body =
          exportView && exp ? (
            <div>
              <Banner
                tone="accent"
                text={`This is the copy that leaves your vault — ${exp.text.split("\n").length} lines, the authors partial inside. None of your notes change.`}
                action={{
                  label: "Back to settings",
                  onClick: () => {
                    setExportView(false);
                    setSettingsOpen(true);
                  },
                }}
              />
              <FileText path={exp.path} source={exp.text} />
            </div>
          ) : null;

        const STEPS = {
          send: [
            "Settings → ZotLit is open. The Reading group row carries Share… beside Open.",
            "The Share sheet prefills a bumped version (1.0 → 1.1) and says the version is what tells recipients this is a newer edition.",
            "Leave “Include my folders” off — Reading/lit and Reading/imports stay yours.",
            "Save file… closes the modal and opens the copy as plain text: the manifest is shaded, the authors partial is inside it.",
            "Copy as text posts a notice naming what was copied, with Show for the same view.",
            "The Default has Share… too, under the list: it would leave with a fresh profile ID.",
          ],
          take: [
            "Add profile → From text or file… (the command palette has ZotLit: Import profile… as well).",
            "Click Paste: the box fills from the blog post. Nothing is written.",
            "Continue flips the SAME sheet to consent — no wizard, no second modal.",
            "The preview renders one of Ben's OWN items, not Anna's.",
            "chicago-note is not installed: install it, or notes render with the built-in style.",
            "Folder empty = same as Default (literatures). Add profile writes one file; none of Ben's notes change.",
          ],
          sync: [
            "The notice already arrived: “Reading group arrived twice — 40 notes wait · Resolve…”.",
            "The page also carries the diagnostic banner and a Resolve… button on each excluded row.",
            "All three open the same second-edition sheet, with a fourth choice: Keep both as separate profiles.",
            "Keep both mints a fresh ID into the laptop's file and names it “Reading group (2)” with 0 notes.",
            "The import sheet is honest here: nothing came through the seam, so there is nothing staged.",
          ],
          edition: [
            "Add profile → From text or file… → Choose file… stages Anna's v1.1.",
            "The ID is already in the vault, so the sheet flips to the second-edition sheet instead of consent.",
            "The before/after renders Chen's own item; his “## Key quotes” line is struck through — replacing loses it.",
            "Replace mine states 40 notes re-render, and keeps the current file as “Reading group (before 1.1).md”, out of the registry.",
            "The row then shows Restore previous — renaming that file back is the only undo, and it lasts as long as the file.",
            "Add as separate profile instead: a fresh ID, 0 notes, and Delete profile on that row is the undo.",
          ],
        };

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              title={exportView && exp ? exp.path : undefined}
              overlay={overlay}
              statusItems={
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setPaletteOpen(true)}
                    className="text-muted cursor-pointer"
                  >
                    <Kbd>⌘P</Kbd> commands
                  </button>
                  <button
                    onClick={() => {
                      setExportView(false);
                      setSettingsOpen(true);
                    }}
                    className="text-muted flex cursor-pointer items-center gap-1"
                  >
                    <Settings size={12} /> profiles
                  </button>
                </div>
              }
            >
              {body}
            </ObsidianFrame>

            <Rail
              thesis="Taking a profile in is one sheet, like installing a citation style; changing one you already have is a second sheet that states the count."
              answers={[
                {
                  q: "What do I send?",
                  a: "Share… on the row: one sheet with version, author, description, the bundled partial named, and your folders left out unless you tick them.",
                },
                {
                  q: "What do I do with this file?",
                  a: "Add profile → From text or file…, or the ZotLit: Import profile… command, or the #904 switch-profile picker's New profile… row. All open the same sheet.",
                },
                {
                  q: "Which of my notes change if I accept?",
                  a: "A new profile: none. A second edition: the sheet names the count before you choose.",
                },
                {
                  q: "Can I take it back?",
                  a: "Replace keeps your previous file beside it, out of the registry; renaming it back is the undo. A separate profile is undone by deleting it while it holds 0 notes.",
                },
                {
                  q: "Is this the one I already have?",
                  a: "The sheet answers it for you: the same ID means the second-edition sheet, never a new profile.",
                },
              ]}
              steps={STEPS[state.scenario] ?? []}
              extras={
                <div>
                  <RailHeading>Doors into the sheet</RailHeading>
                  <div className="text-muted flex flex-col gap-1 text-[11px] leading-snug">
                    <div>Settings → Add profile ▾ → From text or file…</div>
                    <div>Command palette → ZotLit: Import profile…</div>
                    <div>#904 switch-profile picker → New profile… row</div>
                    <div>SYNC only: the notice and the diagnostic row</div>
                  </div>
                </div>
              }
            />
          </div>
        );
      }
      // --- Variant B END ---

      // --- Variant C ---
      // --- Variant C — Open it first ---------------------------------------------
      // The workspace tab is the consent surface. ADR 0017 ("the file is the editor") taken
      // literally: every act — sending, taking, weighing a second edition, going back — happens
      // in a tab that shows the actual text, and the tab's banner is the only consent UI.
      // A "virtual tab" is the frame showing text that is NOT in state.files: the draft lives in
      // this component's UI state, and state.activeFile carries the virtual tab's name, so the
      // frame's own editor body says "No file is open" underneath — which is the literal truth.

      function C_Btn({
        label,
        cta = false,
        danger = false,
        onClick,
        disabled = false,
      }) {
        return (
          <button
            onClick={onClick}
            disabled={disabled}
            className="cursor-pointer rounded border px-2 py-[3px] text-[12px] whitespace-nowrap"
            style={{
              opacity: disabled ? 0.45 : 1,
              cursor: disabled ? "not-allowed" : "pointer",
              ...(cta
                ? {
                    background: "var(--accent)",
                    color: "#ffffff",
                    borderColor: "var(--accent)",
                  }
                : danger
                  ? {
                      background: "var(--ground)",
                      color: "var(--danger)",
                      borderColor: "var(--danger)",
                    }
                  : {
                      background: "var(--ground)",
                      color: "var(--ink)",
                      borderColor: "var(--line)",
                    }),
            }}
          >
            {label}
          </button>
        );
      }

      // Source | Preview: the same tab, read as text or as one of the recipient's own notes.
      function C_Toggle({ value, onChange }) {
        return (
          <span className="border-line inline-flex overflow-hidden rounded border">
            {[
              ["source", "Source"],
              ["preview", "Preview"],
            ].map(([v, label]) => (
              <button
                key={v}
                onClick={() => onChange(v)}
                className="cursor-pointer px-2 py-[3px] text-[12px]"
                style={
                  value === v
                    ? { background: "var(--accent)", color: "#ffffff" }
                    : { background: "var(--ground)", color: "var(--ink)" }
                }
              >
                {label}
              </button>
            ))}
          </span>
        );
      }

      function C_Field({ label, children, note = null }) {
        return (
          <label className="flex items-center gap-2 text-[12px]">
            <span className="text-muted w-[52px] shrink-0">{label}</span>
            {children}
            {note ? <span className="text-muted">{note}</span> : null}
          </label>
        );
      }

      // The pane left of the editor: the file the vault already holds, beside the arriving text.
      function C_SidePane({ title, path, source }) {
        return (
          <div className="border-line bg-ground-2 w-[330px] shrink-0 overflow-y-auto border-r px-3 py-3">
            <div className="mb-2 flex items-center gap-2 text-[12px] font-semibold">
              <span className="truncate">{title}</span>
            </div>
            <FileText path={path} source={source} />
          </div>
        );
      }

      // The blog post the link comes from — the third import door, above the window.
      function C_Blog({ enabled, onOpen }) {
        return (
          <div className="border-line bg-ground-2 flex shrink-0 items-center gap-3 border-b px-4 py-[7px] text-[12px]">
            <span className="text-muted font-mono text-[11px]">
              annaeriksson.net/reading-group-notes
            </span>
            {enabled ? (
              <>
                <span className="text-ink truncate">
                  “…here is the profile we use every Thursday —”
                </span>
                <button
                  onClick={onOpen}
                  className="text-accent cursor-pointer truncate font-mono text-[11px] underline"
                >
                  obsidian://zotlit?profile=reading-group
                </button>
              </>
            ) : (
              <span className="text-muted">
                Nothing is arriving from outside in this scenario.
              </span>
            )}
          </div>
        );
      }

      function VariantC() {
        const { state } = useProtoState();
        const list = profiles(state);
        const incoming = state.incoming;

        // Which of my Profiles the arriving text claims to be. Same ID = a second edition.
        const held = incoming
          ? (list.find(
              (p) => !p.isDefault && p.id === incoming.manifest.id && p.path,
            ) ?? null)
          : null;

        // SYNC: two files, one ID, no seam crossed.
        const clashing = state.files.filter(
          (f) =>
            f.kind === "profile" &&
            f.manifest &&
            state.files.filter(
              (o) => o.kind === "profile" && o.manifest?.id === f.manifest.id,
            ).length > 1,
        );

        const [tab, setTab] = useState(null); // {kind:"share"|"incoming"|"compare"|"previous", …}
        const [view, setView] = useState("source");
        const [includeFolders, setIncludeFolders] = useState(false);
        const [folder, setFolder] = useState("");
        const [style, setStyle] = useState("");
        const [menu, setMenu] = useState(null);
        const [palette, setPalette] = useState(false);
        const [settings, setSettings] = useState(false);
        const [returnTo, setReturnTo] = useState(null);

        // A new scenario is a new vault: drop every draft.
        useEffect(() => {
          setTab(null);
          setView("source");
          setIncludeFolders(false);
          setMenu(null);
          setPalette(false);
          setSettings(false);
          setReturnTo(null);
        }, [state.scenario]);

        // The fields rest where the sender left them: folder empty (= your Default), style theirs.
        useEffect(() => {
          setFolder("");
          setStyle(incoming?.manifest.citationStyle ?? "");
        }, [incoming?.manifest.id, incoming?.manifest.version]);

        const openTab = (next, virtualName) => {
          setReturnTo(state.activeFile);
          setView("source");
          setTab(next);
          actions.openFile(virtualName);
        };
        const closeTab = () => {
          setTab(null);
          actions.openFile(returnTo);
        };

        const openShare = (profileId) => {
          const p = profileById(state, profileId);
          if (!p) return;
          openTab({ kind: "share", profileId }, `${p.name} (shareable)`);
        };

        const openIncoming = (source) => {
          const staged = actions.stageIncoming(source);
          if (!staged) {
            actions.notify("Your clipboard has no profile text.");
            return;
          }
          setSettings(false);
          openTab(
            { kind: "incoming" },
            `${staged.manifest.name} (not in your vault yet)`,
          );
        };

        const openCompare = () => {
          if (clashing.length < 2) return;
          openTab(
            {
              kind: "compare",
              mine: clashing[0].path,
              theirs: clashing[1].path,
            },
            `${clashing[0].manifest.name} — compare`,
          );
        };

        // After a collision is resolved the compare tab has nothing left to compare: land the
        // researcher on the file they kept.
        const resolveFromCompare = (id, choice) => {
          const keptPath = choice === "theirs" ? tab.theirs : tab.mine;
          actions.resolveCollision(id, choice);
          setTab(null);
          actions.openFile(keptPath);
        };

        const shareProfile = list.find((p) => !p.isDefault && p.path) ?? null;

        const commands = [
          {
            label: "ZotLit: Open shareable copy",
            onSelect: () => {
              setPalette(false);
              if (!shareProfile) {
                actions.notify("No profile document in this vault yet.");
                return;
              }
              openShare(shareProfile.id);
            },
          },
          {
            label: "ZotLit: Open profile from clipboard",
            onSelect: () => {
              setPalette(false);
              openIncoming("paste");
            },
          },
          {
            label: "ZotLit: Open literature note profiles",
            onSelect: () => {
              setPalette(false);
              setSettings(true);
            },
          },
        ];

        // --- the tab's content: title, banner, body, side pane ---------------------
        let title = null;
        let banner = null;
        let body = null;
        let sidePane = null;

        if (tab?.kind === "share") {
          const p = profileById(state, tab.profileId);
          const text = shareableText(p, { includeFolders });
          const bundled = [
            ...(p?.body ?? "").matchAll(/\{%\s*render\s+"([^"]+)"/g),
          ].map((m) => m[1]);
          title = `${p.name} (shareable)`;
          banner = (
            <Banner
              tone="accent"
              text={
                <div className="flex flex-col gap-2">
                  <div>
                    Shareable copy of {p.name} v{p.manifest.version}
                    {" · "}
                    {bundled.length
                      ? `partials bundled (${bundled.join(", ")})`
                      : "no partials to bundle"}
                    {" · "}
                    {includeFolders
                      ? `your folders included (${p.manifest.folder}, ${p.manifest.importFolder})`
                      : "your folders left out"}
                  </div>
                  <div className="text-muted">
                    Read only. Nothing leaves your vault until you copy or save
                    it.
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <C_Btn
                      label={
                        includeFolders ? "Leave folders out" : "Include folders"
                      }
                      onClick={() => setIncludeFolders((v) => !v)}
                    />
                    <C_Btn
                      label="Copy"
                      cta
                      onClick={() =>
                        actions.exportProfile(p.id, {
                          includeFolders,
                          target: "clipboard",
                        })
                      }
                    />
                    <C_Btn
                      label="Save as…"
                      onClick={() =>
                        actions.exportProfile(p.id, {
                          includeFolders,
                          target: "file",
                        })
                      }
                    />
                    <C_Btn label="Close" onClick={closeTab} />
                  </div>
                </div>
              }
            />
          );
          body = <FileText path={`${p.name} (share).md`} source={text} />;
        } else if (tab?.kind === "incoming" && incoming) {
          const slug = incoming.manifest.name
            .trim()
            .toLowerCase()
            .replace(/\s+/g, "-");
          const writePath = `${state.templateFolder}/zotlit-profile.${slug}.md`;
          const installed = state.installedStyles.includes(style);
          const incomingLines = renderNote(
            { body: incoming.body },
            state.previewItem,
          );
          title = `${incoming.manifest.name} (not in your vault yet)`;

          if (held) {
            // Second edition, reached at the seam: the arriving ID is already in the vault.
            const heldLines = renderNote(held, state.previewItem);
            sidePane = (
              <C_SidePane
                title={`Your file · v${held.manifest.version}${held.edited ? " · edited" : ""}`}
                path={held.path}
                source={fileText(state.files.find((f) => f.path === held.path))}
              />
            );
            banner = (
              <Banner
                tone="danger"
                text={
                  <div className="flex flex-col gap-2">
                    <div>
                      You already have {held.name} (v{held.manifest.version} ·{" "}
                      {held.noteCount} notes). Replacing re-renders{" "}
                      {held.noteCount} notes on their next update.
                    </div>
                    <div className="text-muted">
                      Your “## Key quotes” heading is inside the managed block,
                      so it is struck through in the preview: replacing drops
                      it.
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                      <C_Toggle value={view} onChange={setView} />
                      <C_Btn
                        label="Replace"
                        danger
                        onClick={() => {
                          const prevPath = `${state.templateFolder}/${held.name} (before ${incoming.manifest.version}).md`;
                          actions.replaceProfile(held.id, {
                            keepPrevious: true,
                          });
                          setTab({
                            kind: "previous",
                            path: prevPath,
                            livePath: held.path,
                          });
                          actions.openFile(prevPath);
                        }}
                      />
                      <C_Btn
                        label="Keep both"
                        onClick={() => {
                          actions.writeIncoming({
                            folder,
                            style,
                            asNewId: true,
                          });
                          setTab(null);
                        }}
                      />
                      <C_Btn label="Close" onClick={closeTab} />
                    </div>
                    <div className="text-muted">
                      Keep both writes a second file with a fresh ID — none of
                      your notes change.
                    </div>
                  </div>
                }
              />
            );
            body =
              view === "source" ? (
                <FileText
                  path={`${incoming.filename} · arriving v${incoming.manifest.version}`}
                  source={incoming.text}
                />
              ) : (
                <NotePreview
                  title={`${state.previewItem.title} — one of your ${held.noteCount} notes`}
                  lines={incomingLines}
                  diffAgainst={heldLines}
                />
              );
          } else {
            // First take: nothing in this vault carries that ID, so no note is at risk.
            banner = (
              <Banner
                tone="accent"
                text={
                  <div className="flex flex-col gap-2">
                    <div>
                      {incoming.manifest.name} v{incoming.manifest.version} by{" "}
                      {incoming.manifest.author} arrived from {incoming.source}{" "}
                      — it is not in your vault yet.
                    </div>
                    <div className="flex flex-wrap items-center gap-3">
                      <C_Toggle value={view} onChange={setView} />
                      <C_Field label="Folder">
                        <input
                          value={folder}
                          onChange={(e) => setFolder(e.target.value)}
                          placeholder={`Same as Default (${state.defaults.folder})`}
                          className="border-line bg-ground w-[190px] rounded border px-2 py-[3px] font-mono text-[11px] outline-none"
                        />
                      </C_Field>
                      <C_Field
                        label="Style"
                        note={
                          installed ? null : (
                            <span className="flex items-center gap-2">
                              <Pill tone="danger">not installed</Pill>
                              <C_Btn
                                label="Install"
                                onClick={() => actions.installStyle(style)}
                              />
                            </span>
                          )
                        }
                      >
                        <select
                          value={style}
                          onChange={(e) => setStyle(e.target.value)}
                          className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[3px] text-[12px] outline-none"
                        >
                          {[
                            ...new Set([
                              incoming.manifest.citationStyle,
                              ...state.installedStyles,
                            ]),
                          ].map((s) => (
                            <option key={s} value={s}>
                              {s}
                            </option>
                          ))}
                        </select>
                      </C_Field>
                    </div>
                    <div className="font-mono text-[11px]">
                      Writes {writePath} · None of your notes change.
                    </div>
                    <div className="flex flex-wrap items-center gap-2">
                      <C_Btn
                        label="Add to my vault"
                        cta
                        onClick={() => {
                          actions.writeIncoming({ folder, style });
                          setTab(null);
                        }}
                      />
                      <C_Btn label="Close" onClick={closeTab} />
                    </div>
                  </div>
                }
              />
            );
            body =
              view === "source" ? (
                <FileText path={incoming.filename} source={incoming.text} />
              ) : (
                <NotePreview
                  title={`${state.previewItem.title} — rendered against your own item`}
                  lines={incomingLines}
                />
              );
          }
        } else if (tab?.kind === "compare" && clashing.length > 1) {
          // SYNC: the same diff tab, but between two files that are both already on disk.
          const mine = state.files.find((f) => f.path === tab.mine);
          const theirs = state.files.find((f) => f.path === tab.theirs);
          const id = mine?.manifest.id;
          const waiting = state.tally[id]?.notes ?? 0;
          title = `${mine?.manifest.name} — compare`;
          sidePane = (
            <C_SidePane
              title="The file you had"
              path={mine.path}
              source={fileText(mine)}
            />
          );
          banner = (
            <Banner
              tone="danger"
              text={
                <div className="flex flex-col gap-2">
                  <div>
                    Two files carry this profile’s ID — {waiting} notes wait.
                    Keeping one makes them resolve again; they re-render on
                    their next update.
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <C_Btn
                      label="Keep the left one"
                      onClick={() => resolveFromCompare(id, "mine")}
                    />
                    <C_Btn
                      label="Keep the right one"
                      onClick={() => resolveFromCompare(id, "theirs")}
                    />
                    <C_Btn
                      label="Keep both"
                      onClick={() => resolveFromCompare(id, "both")}
                    />
                    <C_Btn label="Close" onClick={closeTab} />
                  </div>
                  <div className="text-muted">
                    Keep both mints a fresh ID into the file on the right — it
                    starts with 0 notes and none of your notes change.
                  </div>
                </div>
              }
            />
          );
          body = <FileText path={theirs.path} source={fileText(theirs)} />;
        } else if (tab?.kind === "previous") {
          // Going back: the edition you replaced, still open, still readable.
          const kept = state.files.find((f) => f.path === tab.path);
          title = tab.path.split("/").pop().replace(/\.md$/, "");
          banner = (
            <Banner
              tone="muted"
              text={
                <div className="flex flex-col gap-2">
                  <div>
                    This text is no longer one of your profiles · it sits beside
                    the new file until you close this tab or delete it.
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <C_Btn
                      label="Save as…"
                      onClick={() =>
                        actions.notify(
                          `Saved ${tab.path.split("/").pop()} outside the vault`,
                        )
                      }
                    />
                    <C_Btn
                      label="Put it back"
                      onClick={() => {
                        actions.trashFile(tab.livePath);
                        actions.renameFile(tab.path, tab.livePath);
                        setTab(null);
                      }}
                    />
                    <C_Btn
                      label="Close"
                      onClick={() => {
                        actions.trashFile(tab.path);
                        setTab(null);
                      }}
                    />
                  </div>
                </div>
              }
            />
          );
          body = kept ? null : (
            <div className="text-muted text-[13px]">This text is gone.</div>
          );
        } else if (clashing.some((f) => f.path === state.activeFile)) {
          // SYNC in place: no seam was crossed, so the banner meets the researcher on the file.
          const open = clashing.find((f) => f.path === state.activeFile);
          const other = clashing.find((f) => f.path !== state.activeFile);
          const id = open.manifest.id;
          const waiting = state.tally[id]?.notes ?? 0;
          banner = (
            <Banner
              tone="danger"
              text={
                <div className="flex flex-col gap-2">
                  <div>
                    Two files carry this profile’s ID — {waiting} notes wait.
                    Neither file renders a note until you pick one.
                  </div>
                  <div className="text-muted font-mono text-[11px]">
                    {open.path} · {other.path}
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <C_Btn label="Compare" cta onClick={openCompare} />
                    <C_Btn
                      label="Keep this one"
                      onClick={() =>
                        actions.resolveCollision(
                          id,
                          open.path === clashing[0].path ? "mine" : "theirs",
                        )
                      }
                    />
                    <C_Btn
                      label="Keep the other"
                      onClick={() =>
                        actions.resolveCollision(
                          id,
                          open.path === clashing[0].path ? "theirs" : "mine",
                        )
                      }
                    />
                    <C_Btn
                      label="Keep both"
                      onClick={() => actions.resolveCollision(id, "both")}
                    />
                  </div>
                </div>
              }
            />
          );
        } else {
          // A profile document that is simply a file of yours: the banner collapses to one line.
          const openProfile = list.find(
            (p) => p.path && p.path === state.activeFile && !p.excluded,
          );
          if (openProfile)
            banner = (
              <div className="border-line text-muted flex items-center gap-2 rounded-md border px-3 py-[6px] text-[12px]">
                <span className="text-ink">Profile</span>
                <span>·</span>
                <span>{openProfile.noteCount} notes</span>
                <span>·</span>
                <span className="font-mono text-[11px]">{openProfile.id}</span>
                <div className="flex-1" />
                <C_Btn
                  label="Open shareable copy"
                  onClick={() => openShare(openProfile.id)}
                />
              </div>
            );
        }

        const steps = {
          send: [
            "Right-click templates/zotlit-profile.reading-group.md in the file tree → Open shareable copy.",
            "Read the tab: the manifest is shaded, the authors partial is bundled into it, Reading/lit is absent.",
            "Press Include folders to see the two lines that would travel, then Copy or Save as…",
            "Nothing arrives in this scenario, so the import tab is not reachable — the palette says so if you try.",
          ],
          take: [
            "Click the obsidian://zotlit link in the blog strip — or run ZotLit: Open profile from clipboard from the status bar.",
            "The tab is titled “not in your vault yet”. Read the source, then press Preview to see it on The Second Sex.",
            "Folder rests at Same as Default; chicago-note is marked not installed — Install it, or leave it.",
            "Add to my vault writes one file. The banner collapses to “Profile · 0 notes”.",
          ],
          sync: [
            "The desktop opens on zotlit-profile.reading-group.md and the red banner is already there — no dialog was ever shown.",
            "Press Compare: your file on the left, the file that synced in on the right.",
            "Keep the left one / Keep the right one trashes the other; Keep both mints a fresh ID into it (0 notes).",
            "Click the other file in the tree: the same banner, the same three choices.",
          ],
          edition: [
            "Run ZotLit: Open profile from clipboard (status bar) — the file is v1.1 and carries the ID you already hold.",
            "The tab opens as a diff: your v1.0 on the left, Anna's v1.1 in the editor.",
            "Press Preview: your “## Key quotes” line is struck through — that is what Replace drops.",
            "Replace re-renders 40 notes and leaves the old edition open in its own tab; Put it back undoes it.",
          ],
        }[state.scenario];

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <div className="flex min-w-0 flex-col">
              <C_Blog
                enabled={!!state.incomingSeed}
                onOpen={() => openIncoming("link")}
              />
              <div className="min-h-0 flex-1">
                <ObsidianFrame
                  title={title}
                  sidePane={sidePane}
                  onFileMenu={(path, e) =>
                    setMenu({ x: e.clientX, y: e.clientY, path })
                  }
                  footer={
                    <button
                      onClick={() => setPalette(true)}
                      className="text-muted cursor-pointer"
                    >
                      <Kbd>⌘P</Kbd> commands
                    </button>
                  }
                  statusItems={
                    <button
                      onClick={() => setSettings(true)}
                      className="text-muted cursor-pointer"
                    >
                      Profiles
                    </button>
                  }
                  overlay={
                    settings ? (
                      <SettingsModal open onClose={() => setSettings(false)}>
                        <ProfilesPage
                          onAdd={() => openIncoming("paste")}
                          onOpen={(path) => {
                            setSettings(false);
                            setTab(null);
                            actions.openFile(path);
                          }}
                          onDuplicate={(id) =>
                            actions.notify(
                              "Duplicated — not this ticket's surface.",
                            )
                          }
                          onDelete={(id) =>
                            actions.notify("Delete profile — #911's surface.")
                          }
                          header={
                            <C_Btn
                              label="Add profile ▾"
                              onClick={(e) =>
                                setMenu({
                                  x: e.clientX,
                                  y: e.clientY,
                                  add: true,
                                })
                              }
                            />
                          }
                          extraRowActions={(p) =>
                            p.path && !p.excluded ? (
                              <C_Btn
                                label="Share…"
                                onClick={() => {
                                  setSettings(false);
                                  openShare(p.id);
                                }}
                              />
                            ) : null
                          }
                          footer={
                            <p className="text-muted mt-4 text-[12px] leading-relaxed">
                              Every door here opens a tab, never a sheet: you
                              read the file before it is in your vault.
                            </p>
                          }
                        />
                      </SettingsModal>
                    ) : palette ? (
                      <CommandPalette
                        open
                        items={commands}
                        onClose={() => setPalette(false)}
                      />
                    ) : null
                  }
                >
                  {banner || body ? (
                    <>
                      {banner}
                      {body}
                    </>
                  ) : null}
                </ObsidianFrame>
              </div>
            </div>

            {menu ? (
              <ContextMenu
                x={menu.x}
                y={menu.y}
                onClose={() => setMenu(null)}
                items={
                  menu.add
                    ? [
                        {
                          label: "From clipboard…",
                          icon: Copy,
                          onClick: () => openIncoming("paste"),
                        },
                        {
                          label: "From file…",
                          icon: Download,
                          onClick: () => openIncoming("file"),
                        },
                      ]
                    : [
                        {
                          label: "Open",
                          icon: FileIcon,
                          onClick: () => {
                            setTab(null);
                            actions.openFile(menu.path);
                          },
                        },
                        ...(list.some((p) => p.path === menu.path)
                          ? [
                              "separator",
                              {
                                label: "Open shareable copy",
                                icon: Copy,
                                onClick: () => {
                                  const p = list.find(
                                    (x) => x.path === menu.path,
                                  );
                                  openShare(p.id);
                                },
                              },
                            ]
                          : []),
                      ]
                }
              />
            ) : null}

            <Rail
              thesis="A researcher reads a file before trusting it; give them the file as a tab, and the tab's banner is the only consent UI."
              answers={[
                {
                  q: "what do I send",
                  a: "A read-only tab of the exact text — partials bundled, your folders left out until you ask for them.",
                },
                {
                  q: "what do I do with this file",
                  a: "It opens as a tab that is not in your vault yet; read it, set folder and style in the banner, then Add to my vault.",
                },
                {
                  q: "which of my notes change if I accept",
                  a: "None on a first take. On a second edition the banner counts them before Replace, and Preview strikes through what goes.",
                },
                {
                  q: "can I take it back",
                  a: "The edition you replaced stays open in its own tab with Save as… and Put it back.",
                },
                {
                  q: "is this the one I already have",
                  a: "The same ID opens as a diff beside your file; two files in place raise the same red banner on both.",
                },
              ]}
              steps={steps}
              extras={
                <div>
                  <RailHeading>The honest limit</RailHeading>
                  <p className="text-muted leading-relaxed">
                    Going back lasts only while that tab is open. Replace keeps
                    the previous edition beside the new file, out of the
                    registry, so Put it back can restore it — close the tab and
                    the file goes to the Obsidian trash with it. There is no
                    install record to revert.
                  </p>
                </div>
              }
            />
          </div>
        );
      }
      // --- Variant C END ---

      // --- Variant D ---
      function VariantD() {
        const { state } = useProtoState();
        const list = profiles(state);
        const discovered = list.filter((p) => !p.isDefault && !p.excluded);

        // Only UI state lives here: which sheet is open and the two field drafts.
        const [settingsOpen, setSettingsOpen] = useState(true);
        const [menu, setMenu] = useState(null); // the Add profile ▾ dropdown
        const [share, setShare] = useState(null); // { profileId, version }
        const [exported, setExported] = useState(null); // { path, text }
