<!doctype html>
<!--
  Prototype — Profile export and import from the academic user side (ticket #913, map #835)

  DESIGN QUESTION
  A researcher shaped a Literature Note Profile and wants four lab mates to have it. Another
  researcher reads a blog post that says "here is my ZotLit setup" and wants those notes
  without understanding any of it. What do the two experience — and which export/import
  semantics follow from that experience, not from the Pack lifecycle the plugin already ships?

  FIRST PRINCIPLES (academic user)
  The sender thinks "my setup", never "my Profile" — a word she learned last week. "My setup"
  includes the folder and the citation style, because to her the note IS the thing that lands
  in Reading/lit in Chicago style. The recipient must be able to say afterwards "I now have a
  new kind of note I can make", not "my vault changed": the sender thinks in wholes, the
  recipient must be protected from the sender's vault. Every researcher-shares-configuration
  precedent (Obsidian theme, Zotero CSL style, Pandoc defaults file, shared .bib, competitor's
  copy-paste template) agrees on three things: the unit is a file the researcher can see and
  open; taking it in is additive; identity, where it exists, is a name inside the file. None of
  the five can do what ZotLit can — render the candidate against the recipient's own item before
  anything is written. That is this plugin's genuine advantage, and every variant must exercise
  it. The one place ZotLit is more dangerous than all five: a Profile's document drives the
  Managed Block and Managed Frontmatter of every note stamped with it, so an import that CREATES
  a Profile is safe and additive, but one that CHANGES a Profile the researcher already has
  re-renders N notes on their next update — the same consequence class as #904's Switch Profile
  and #911's delete-as-move, and it belongs behind the same stated count and re-render line.
  Which values may travel: look travels as content (body, Managed Block, Annotation Block,
  Managed Frontmatter, filename template); look-but-named travels as a suggestion (citation
  style — a portable name the recipient may not have installed); location is always asked
  (literature folder, imported-note folder); the two annotation booleans are the genuinely
  ambiguous pair, and the variants disagree about them on purpose.

  Four researchers, four questions — the scenario presets of this prototype:
    1. SEND     Anna (postdoc) sends "Reading group" (40 notes, 6 Imported Notes) to four lab
                mates. "What do I send?"                        → her document renders a
                partial (authors), so copy-pasting the file by hand silently loses it.
    2. TAKE     Ben (first year) found a blog post with Anna's file. He has only the Default
                Profile; chicago-note is not installed; Reading/lit does not exist.
                "What do I do with this file?"                  → zero notes are at risk, and
                he must be told so.
    3. SYNC     The supervisor keeps "Reading group" on a laptop and a desktop, both at v1.0,
                with a locally changed folder on the desktop.
                "Is this the same one I already have?"           → second-edition detection by
                pack id, not by filename.
    4. EDITION  Chen has v1.0 and edited the template body himself; Anna publishes v1.1.
                "Can I take the revision without losing my edit, and which of my notes change
                if I accept?"                                    → the shipped `refuse` verdict
                on a user-edited file, met by a researcher.
  Consequences:
    a. Taking a shared Profile in is always additive; changing one you already have is a
       second, explicit act with the count stated.
    b. The open questions the variants disagree about: where the doors are, what the unit is
       called, and how much ceremony each act carries.
    c. Six surfaces every variant renders: the export entry, the exported file opened as plain
       text, the import entry, the consent step before anything is written, the second-edition
       surface, and the revert surface.

  VARIANTS
    A  Baseline: no door        — today. Anna selects-all and pastes into Slack, losing the
                                  `authors` partial with no message; Ben hand-builds a Profile
                                  from her screenshot; second edition overwrites Chen's edit
                                  silently; no revert. The OZI copy-paste path, honestly rendered.
    B  "Install a style"        — settings-first, add-only. Profiles → + Add profile ▾ (Blank /
                                  From a file… / From pasted text…); one install sheet: manifest
                                  header, live preview against Ben's own item, "What enters your
                                  vault", "Your settings" (folder/style, editable), "None of your
                                  existing notes change." Export lives on the row: Share… Second
                                  edition grows a `v1.1 available` pill with rendered before/after
                                  and a stated re-render count; revert stays on the row.
    C  "The file is the profile" — vault-first, no import step. Any .md carrying a manifest IS a
                                  template document; opening one shows a note-top banner with
                                  Use as profile / Preview. Export is symmetrical: Copy shareable
                                  template bundles partials in. Second edition = Obsidian's own
                                  overwrite prompt, met by a Notice with What changes? / Undo.
    D  "Share link and receipt page" — URL-first, dedicated full-page consent. obsidian://zotlit
                                  link opens a full workspace tab: identity, live preview, a
                                  two-column "what enters your vault" vs. "what you decide" table,
                                  one button. Afterwards, a Shared profiles settings page: source,
                                  version, date taken in, Check for updates, Revert.
    E  "Adopt or keep mine"     — a ledger, maximum explicitness. The sender curates a checklist
                                  of what travels; the recipient meets a row-per-setting ledger:
                                  setting · sender's value · your value · Use theirs / Keep mine.
                                  Second edition brings the ledger back, marked with what changed
                                  and what the recipient overrode last time.
-->

      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }

      // The literature-note-template.ts manifest schema, hand-filled: id/name/version/author/
      // description/contract (an integer, not a semver), filename, profileDefaults (folder +
      // citationStyle — suggestions, not bindings), language, partials, Managed Frontmatter.
      const AUTHORS_PARTIAL = {
        name: "authors",
        language: "liquid",
        source:
          "{% for a in zt.creators %}{{ a.name }}{% unless forloop.last %}, {% endunless %}{% endfor %}",
      };

      const MANIFEST_V1 = {
        id: "anna.reading-group",
        name: "Reading group",
        version: "1.0.0",
        author: "Anna",
        description:
          "Chicago-style notes for the weekly reading group, with a shared author-list partial.",
        contract: 1,
        filename: "{{ zt.citekey }}.md",
        profileDefaults: {
          folder: "Reading/lit",
          citationStyle: "chicago-note",
        },
        language: "liquid",
        partials: [AUTHORS_PARTIAL],
        frontmatter: [
          { key: "citekey", expr: "zt.citekey" },
          { key: "year", expr: "zt.date | date: '%Y'" },
          { key: "tags", value: ["reading-group"] },
          { key: "read-by", expr: "zt.dateAdded | date: '%Y-%m-%d'" },
        ],

      const BODY_V1 = `# {{ zt.title }}

{% render "authors" %}

- **Year:** {{ zt.date | date: '%Y' }}
- **Style:** Chicago (note)
- **Folder:** Reading/lit

{% managed %}

      );

      function stamp() {
        const d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))

      function folderOf(profiles, id) {

            },
            previewItem: {
              key: "coserConflict1956",
              title: "The Functions of Social Conflict",
              creators: [{ name: "Lewis Coser" }],
              date: "1956",
            },
            previewBefore: [
              "# The Functions of Social Conflict",
              "",
              "Lewis Coser",
              "",
              "- Year: 1956",
              "- Style: Chicago (note)",
              "- Folder: Reading/lit",
              "",
              "This week",
              "- Discussion date:",
              "- Led by:",
              "",
              "Key quotes",
              '- "Conflict … prevents the ossification of the social system."',
            ],
            previewAfter: [
              "# The Functions of Social Conflict",
              "",
              "Lewis Coser",
              "",
              "- Year: 1956",
              "- Style: Chicago (note)",
              "- Folder: Reading/lit",
              "",
              "This week",
              "- Discussion date:",
              "- Led by:",
              "- Key themes:",
              "",
              "Key quotes",
              '- "Conflict … prevents the ossification of the social system."',
            ],
            installRecords: {
              [READING]: {
                packId: "anna.reading-group",
                version: "1.0.0",
                installedAt: "14:40:21",
                files: [
                  { path: "templates/reading-group.md", previous: BODY_V1 },
                ],
              },
            },
            notes: withPaths(profiles, notesForProfiles([null, READING])),
            activeNoteKey: "andersonImagined1983",
          };
        },
      };

      function seed(scenario) {
        const build = SCENARIO_SEEDS[scenario] ?? SCENARIO_SEEDS.send;
        return {
          scenario,
          ...build(),
          search: null,
          notices: [],
          log: [],
        };
      }

      let state = seed("send");
      const listeners = new Set();

      function subscribe(fn) {
        listeners.add(fn);
        return () => listeners.delete(fn);
      }

      function getSnapshot() {
        return state;
      }

      function setState(next) {
        state = next;
        for (const fn of listeners) fn();
      }

      function logged(next, text) {
        return {
          ...next,
          log: [{ t: stamp(), text }, ...next.log].slice(0, 40),
        };
      }

      export function useProtoState() {
        const snapshot = useSyncExternalStore(subscribe, getSnapshot);
        return { state: snapshot, actions };
      }

      export function profileById(s, id) {
        return s.profiles.find((p) => p.id === (id ?? null)) ?? null;
      }

      export function stampLabel(s, note) {
        if (!note) return null;
        const p = profileById(s, note.profileId);
        if (!p)
          return {
            label: "Unknown profile",
            secondary: note.profileId,
            status: "unknown",
          };
        return {
          label: p.label,
          secondary: packLabel(p) ?? p.id ?? "(built-in default)",
          status: "active",
        };
      }

      export function PROFILE_DISPLAY(profile) {
        return [
          profile.folder,
          profile.style,
          profile.document ?? "Bindings only",
        ].join(" · ");
      }

      export function activeNote(s) {
        return s.notes.find((n) => n.key === s.activeNoteKey) ?? null;
      }

      export function notesOf(s, profileId) {
        return s.notes.filter((n) => n.profileId === (profileId ?? null));
      }

      // Null for a hand-made Profile (packId null) — only a Profile that travelled as a Pack
      // has anything to label. "from {author}" is left off the sender's own copy of it.
      export function packLabel(profile) {
        if (!profile || !profile.packId) return null;
        return `${profile.label} v${profile.packVersion}${
          profile.author ? ` · from ${profile.author}` : ""
        }`;
      }

      // The six rows both B's "Your settings" and E's ledger read: does the value describe the
      // look of the note (content), a look that is only a portable name (suggestion), or the
      // shape of the recipient's own vault (location)?
      export function travellingValues(state) {
        const incoming = state.incoming;
        if (!incoming) return [];
        const manifest = incoming.manifest;
        const existing =
          state.profiles.find((p) => p.packId === manifest.id) ?? null;
        const fallback = state.profiles.find((p) => p.id === null) ?? null;
        const yourFolder = existing?.folder ?? fallback?.folder ?? "";
        const yourStyle = existing?.style ?? fallback?.style ?? "";
        return [
          {
            key: "document",
            label: "Template document",
            kind: "content",
            senderValue: incoming.filename,
            yourValue: existing ? existing.document : "(new file)",
          },
          {
            key: "frontmatter",
            label: "Frontmatter fields",
            kind: "content",
            senderValue: manifest.frontmatter.map((f) => f.key).join(", "),
            yourValue: existing ? "already managed" : "(new fields)",
          },
          {
            key: "citationStyle",
            label: "Citation style",
            kind: "suggestion",
            senderValue: manifest.profileDefaults.citationStyle,
            yourValue: yourStyle,
          },
          {
            key: "literatureFolder",
            label: "Literature folder",
            kind: "location",
            senderValue: manifest.profileDefaults.folder,
            yourValue: yourFolder,
          },
          {
            key: "importFolder",
            label: "Imported-note folder",
            kind: "location",
            senderValue: manifest.profileDefaults.folder,
            yourValue: existing ? existing.folder : yourFolder,
          },
          {
            key: "annotationRendering",
            label: "Colored highlights / annotations as template",
            kind: "suggestion",
            senderValue: "on",
            yourValue: existing ? "on" : "vault default",
          },
        ];
      }

      // Assembles the file exactly as a recipient would meet it on disk: the manifest as YAML
      // frontmatter, fenced, then the body. FileText renders whatever text it is given, so this
      // is the one place that turns a manifest + body pair into that text.
      export function manifestFileText(manifest, body) {
        const yaml = [
          `id: ${manifest.id}`,
          `name: ${manifest.name}`,
          `version: ${manifest.version}`,
          `author: ${manifest.author}`,
          `description: ${manifest.description}`,
          `contract: ${manifest.contract}`,
          `filename: ${manifest.filename}`,
          `profileDefaults:`,
          `  folder: ${manifest.profileDefaults.folder}`,
          `  citationStyle: ${manifest.profileDefaults.citationStyle}`,
          `language: ${manifest.language}`,
          `partials:`,
          ...manifest.partials.flatMap((p) => [
            `  - name: ${p.name}`,
            `    language: ${p.language}`,
          ]),
          `frontmatter:`,
          ...manifest.frontmatter.flatMap((f) => [
            `  - key: ${f.key}`,
            f.expr !== undefined
              ? `    expr: ${f.expr}`
              : `    value: ${JSON.stringify(f.value)}`,
          ]),
        ].join("\n");
        return `---\n${yaml}\n---\n\n${body}`;
      }

      let noticeSeq = 0;

      function pushNotice(s, text, action) {
        const id = ++noticeSeq;
        setTimeout(() => actions.dismissNotice(id), action ? 10000 : 6000);
        return { ...s, notices: [...s.notices, { id, text, action }] };
      }

      export const actions = {
        setScenario(scenario) {
          setState(logged(seed(scenario), `Scenario: ${scenario}`));
        },

        // TAKE: creates a new local Profile from the incoming file. Touches zero existing
        // notes — the additive half of the design's one asymmetry.
        importAsNewProfile(overrides) {
          const incoming = state.incoming;
          if (!incoming) return;
          const { folder, style } = overrides ?? {};
          const id =
            typeof crypto !== "undefined" && crypto.randomUUID
              ? crypto.randomUUID()
              : `local-${Date.now()}`;
          const profile = {
            id,
            label: incoming.manifest.name,
            folder: folder ?? incoming.manifest.profileDefaults.folder,
            style: style ?? incoming.manifest.profileDefaults.citationStyle,
            document: `templates/${incoming.manifest.name
              .toLowerCase()
              .replace(/\s+/g, "-")}.md`,
            noteCount: 0,
            importedCount: 0,
            packId: incoming.manifest.id,
            packVersion: incoming.manifest.version,
            author: incoming.manifest.author,
            documentEdited: false,
            updateAvailable: null,
          };
          setState(
            logged(
              {
                ...state,
                profiles: [...state.profiles, profile],
                installRecords: {
                  ...state.installRecords,
                  [id]: {
                    packId: incoming.manifest.id,
                    version: incoming.manifest.version,
                    installedAt: stamp(),
                    files: [{ path: profile.document, previous: null }],
                  },
                },
                incoming: null,
              },
              `Added the "${profile.label}" profile from ${incoming.filename}; none of your existing notes changed`,
            ),
          );
          return profile;
        },

        // SYNC / EDITION: the second, explicit act. Refuses over a user-edited document unless
        // told to overwrite it, and always states the re-render count.
        updateExistingProfile(profileId, options) {
          const { overwriteEdited = false } = options ?? {};
          const p = profileById(state, profileId);
          const incoming = state.incoming;
          if (!p || !incoming) return;
          if (p.documentEdited && !overwriteEdited) return;
          const profiles = state.profiles.map((x) =>
            x.id === profileId
              ? {
                  ...x,
                  packVersion: incoming.manifest.version,
                  documentEdited: false,
                  updateAvailable: null,
                }
              : x,
          );
          setState(
            logged(
              {
                ...state,
                profiles,
                installRecords: {
                  ...state.installRecords,
                  [profileId]: {
                    ...state.installRecords[profileId],
                    version: incoming.manifest.version,
                    installedAt: stamp(),
                  },
                },
                incoming: null,
              },
              `Updated "${p.label}" to v${incoming.manifest.version}; ${p.noteCount} notes re-render on their next update`,
            ),
          );
        },

        // SYNC / EDITION: declines the incoming version. Nothing changes.
        keepMine(profileId) {
          const p = profileById(state, profileId);
          if (!p) return;
          setState(
            logged(
              { ...state, incoming: null },
              `Kept your own "${p.label}"; the incoming file was not installed`,
            ),
          );
        },

        // Reverts a Profile's document to the bytes recorded at install time.
        revertProfile(profileId) {
          const p = profileById(state, profileId);
          const record = state.installRecords[profileId];
          if (!p || !record) return;
          const profiles = state.profiles.map((x) =>
            x.id === profileId
              ? {
                  ...x,
                  packVersion: record.version,
                  documentEdited: false,
                  updateAvailable: null,
                }
              : x,
          );
          setState(
            logged(
              { ...state, profiles },
              `Reverted "${p.label}" to v${record.version}; ${p.noteCount} notes re-render on their next update`,
            ),
          );
        },

        // The zero-note delete of #911: undoing an import made moments ago, before any note
        // used the Profile.
        removeJustAddedProfile(profileId) {
          const p = profileById(state, profileId);
          if (!p || p.noteCount > 0) return;
          const profiles = state.profiles.filter((x) => x.id !== profileId);
          const installRecords = { ...state.installRecords };
          delete installRecords[profileId];
          setState(
            logged(
              { ...state, profiles, installRecords },
              `Removed the "${p.label}" profile; it had 0 notes`,
            ),
          );
        },

        // SEND: the sender's export menu choice.
        exportProfile(profileId, options) {
          const { bindings = null, target = "file" } = options ?? {};
          const p = profileById(state, profileId);
          if (!p) return;
          const verb =
            target === "file"
              ? "Saved"
              : target === "clipboard"
                ? "Copied"
                : "Copied a share link for";
          const boundText = bindings ? ` with ${bindings.join(", ")}` : "";
          setState(
            logged(
              state,
              `${verb} "${p.label}"${boundText} (${p.packId ?? "no pack id yet"})`,
            ),
          );
        },

        installStyle(name) {
          setState(
            logged(
              { ...state, installedStyles: [...state.installedStyles, name] },
              `Installed the "${name}" citation style`,
            ),
          );
        },

        openFile(path) {
          setState(logged(state, `Opened ${path}`));
        },

        notify(text, action) {
          setState(pushNotice(state, text, action));
        },

        dismissNotice(id) {
          setState({
            ...state,
            notices: state.notices.filter((n) => n.id !== id),
          });
        },

        openNote(key) {
          const note = state.notes.find((n) => n.key === key);
          setState(
            logged(
              { ...state, activeNoteKey: key },
              `Opened ${note ? note.path : key}`,
            ),
          );
        },

        // Closes ObsidianFrame's search side pane. Not in the plan's action list — plumbing the
        // kept-as-is SearchPane primitive still needs.
        closeSearch() {
          setState({ ...state, search: null });
        },
      };

      // --- Primitives: Obsidian's default theme, rebuilt from the plan's tokens only. ---

      export function Kbd({ children }) {
        return (
          <kbd className="font-mono text-[11px] leading-none border-line bg-ground-2 text-muted rounded border px-1 py-[3px]">
            {children}
          </kbd>
        );
      }

      export function Pill({ tone = "muted", children, className = "" }) {
        const tint =
          tone === "accent"
            ? {
                color: "var(--accent)",
                background:
                  "color-mix(in srgb, var(--accent) 14%, transparent)",
              }
            : tone === "danger"
              ? {
                  color: "var(--danger)",
                  background:
                    "color-mix(in srgb, var(--danger) 14%, transparent)",
                }
              : { color: "var(--muted)", background: "var(--ground-2)" };
        return (
          <span
            className={`inline-block rounded-full px-2 py-[2px] text-[11px] leading-none whitespace-nowrap ${className}`}
            style={tint}
          >
            {children}
          </span>
        );
      }

      function TreeFolder({ name, files, activePath, onOpen }) {
        return (
          <div className="mb-[2px]">
            <div className="text-ink/85 flex items-center gap-1 rounded px-1 py-[3px] text-[13px]">
              <ChevronDown size={12} className="text-muted shrink-0" />
              <span className="truncate">{name}</span>
            </div>
            {files.map((f) => (
              <div
                key={f.path}
                onClick={() => (f.key ? onOpen?.(f.key) : undefined)}
                className={`flex items-center gap-1 rounded py-[3px] pr-1 pl-[22px] text-[13px] ${
                  f.key ? "cursor-pointer" : ""
                }`}
                style={
                  f.path === activePath
                    ? {
                        background:
                          "color-mix(in srgb, var(--accent) 12%, transparent)",
                      }
                    : undefined
                }
              >
                <span className="truncate">{f.name}</span>
              </div>
            ))}
          </div>
        );
      }

      export function ObsidianFrame({
        title,
        children,
        overlay = null,
        statusItems = null,
        footer = null,
        stampRender = null,
        sidePane = null,
      }) {
        const { state } = useProtoState();
        const active = activeNote(state);
        const activeInfo = stampLabel(state, active);
        const activeProfile = active
          ? profileById(state, active.profileId)
          : null;

        const tree = useMemo(() => {
          const folders = new Map();
          for (const note of state.notes) {
            const cut = note.path.lastIndexOf("/");
            const dir = note.path.slice(0, cut);
            const name = note.path.slice(cut + 1);
            if (!folders.has(dir)) folders.set(dir, []);
            folders.get(dir).push({ name, path: note.path, key: note.key });
          }
          const documents = new Set();
          for (const p of state.profiles)
            if (p.document && p.document.includes("/"))
              documents.add(p.document);
          folders.set(
            "templates",
            [...documents].sort().map((path) => ({
              name: path.split("/").pop(),
              path,
            })),
          );
          return [...folders.entries()].sort((a, b) =>
            a[0].localeCompare(b[0]),
          );
        }, [state.notes, state.profiles]);

        const pane =
          sidePane ??
          (state.search ? (
            <SearchPane
              query={state.search.query}
              results={notesOf(state, state.search.profileId)}
              total={profileById(state, state.search.profileId)?.noteCount ?? 0}
              onClose={() => actions.closeSearch()}
            />
          ) : null);

        const tabTitle =
          title ?? (active ? active.path.split("/").pop() : "No file open");

        return (
          <div className="bg-ground text-ink font-body relative flex h-full min-w-0 flex-col overflow-hidden text-sm">
            <div className="flex min-h-0 flex-1">
              {/* ribbon */}
              <div className="border-line bg-ground-2 flex w-[44px] shrink-0 flex-col items-center gap-4 border-r py-3">
                <FolderOpen size={17} className="text-ink/70" />
                <Search size={17} className="text-muted" />
                <Bookmark size={17} className="text-muted" />
                <Files size={17} className="text-muted" />
                <div className="flex-1" />
                <HelpCircle size={16} className="text-muted" />
                <Settings size={16} className="text-muted" />
              </div>

              {/* file tree */}
              <div className="border-line bg-ground-2 text-ink/90 w-[200px] shrink-0 overflow-y-auto border-r px-2 py-2">
                {tree.map(([folder, files]) => (
                  <TreeFolder
                    key={folder}
                    name={folder}
                    files={files}
                    activePath={active?.path}
                    onOpen={(key) => actions.openNote(key)}
                  />
                ))}
              </div>

              {/* search pane */}
              {pane}

              {/* main pane */}
              <div className="flex min-w-0 flex-1 flex-col">
                <div className="border-line flex shrink-0 items-center gap-2 border-b px-3 py-[6px]">
                  <div className="border-line bg-ground flex items-center gap-2 rounded-md border px-3 py-1 text-[13px]">
                    <FileIcon size={13} className="text-muted" />
                    <span className="max-w-[280px] truncate">{tabTitle}</span>
                    <X size={12} className="text-muted" />
                  </div>
                  <Plus size={14} className="text-muted" />
                  <div className="flex-1" />
                  <PanelLeft size={14} className="text-muted" />
                </div>

                <div className="min-h-0 flex-1 overflow-y-auto px-10 py-6">
                  {children ? <div className="mb-6">{children}</div> : null}
                  {active ? (
                    <>
                      <div className="text-muted mb-4 font-mono text-[11px]">
                        {active.path}
                      </div>
                      <table className="mb-6 w-full max-w-[560px] table-fixed text-[13px]">
                        <tbody>
                          <tr>
                            <td className="text-muted w-[130px] py-1 align-top">
                              zotero-key
                            </td>
                            <td className="py-1 font-mono text-[12px] break-all">
                              {active.key}
                            </td>
                          </tr>
                          <tr>
                            <td className="text-muted py-1 align-top">
                              zotlit-profile
                            </td>
                            <td className="py-1 text-[13px] break-all">
                              {stampRender ? (
                                stampRender(active, activeInfo)
                              ) : (
                                <DefaultStamp info={activeInfo} />
                              )}
                            </td>
                          </tr>
                        </tbody>
                      </table>
                      <h1 className="mb-3 text-2xl font-semibold">
                        {active.title}
                      </h1>
                      <div className="text-muted mb-2 font-mono text-[11px]">
                        %%zt-managed%%
                      </div>
                      <p className="text-ink/80 max-w-[60ch] leading-relaxed">
                        Rendered from{" "}
                        {activeProfile?.document ?? "the built-in bindings"}
                        {activeProfile ? ` in ${activeProfile.style}` : ""}. The
                        text below this region is the researcher's own and is
                        never touched by an update.
                      </p>
                      <div className="text-muted mt-2 font-mono text-[11px]">
                        %%zt-managed-end%%
                      </div>
                      <p className="text-ink/80 mt-4 max-w-[60ch] leading-relaxed">
                        My reading notes on this chapter, written by hand.
                      </p>
                    </>
                  ) : (
                    <div className="text-muted pt-10 text-center">
                      No file is open
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* status bar */}
            <div className="border-line bg-ground-2 text-muted flex shrink-0 items-center gap-3 border-t px-3 py-[5px] text-[11px]">
              <span className="truncate">
                {state.persona?.vault ?? "fixture-vault"}
              </span>
              <div className="flex-1" />
              {footer}
              {statusItems}
            </div>

            {/* notices */}
            <div className="absolute right-3 bottom-8 flex flex-col items-end gap-2">
              {state.notices.map((n) => (
                <Notice key={n.id} text={n.text} action={n.action} />
              ))}
            </div>

            {overlay ? (
              <div
                className="absolute inset-0 flex items-center justify-center"
                style={{ background: "rgba(0,0,0,0.28)" }}
              >
                {overlay}
              </div>
            ) : null}
          </div>
        );
      }

      export function DefaultStamp({ info }) {
        if (!info) return null;
        return (
          <span className="inline-flex flex-wrap items-center gap-2">
            <span>{info.label}</span>
            <span className="text-muted font-mono text-[11px] break-all">
              {info.secondary}
            </span>
            {info.status === "unknown" ? (
              <Pill tone="danger">unknown profile</Pill>
            ) : null}
          </span>
        );
      }

      export function Notice({ text, action = null }) {
        return (
          <div className="border-line bg-ground-2 text-ink max-w-[420px] rounded-md border px-3 py-2 text-[13px] shadow-lg">
            <div>{text}</div>
            {action ? (
              <button
                onClick={action.onClick}
                className="border-line bg-ground text-ink mt-2 cursor-pointer rounded border px-2 py-[3px] text-[12px]"
              >
                {action.label}
              </button>
            ) : null}
          </div>
        );
      }

      export function Prompt({
        placeholder = "",
        value = "",
        onChange,
        onKeyDown,
        instructions = [],
        header = null,
        children,
        className = "",
      }) {
        const ref = useRef(null);
        useEffect(() => {
          ref.current?.focus();
        }, []);
        return (
          <div
            className={`border-line bg-ground flex max-h-[70%] w-[560px] flex-col overflow-hidden rounded-lg border shadow-2xl ${className}`}
          >
            <div className="border-line flex shrink-0 items-center gap-2 border-b px-4 py-[10px]">
              <input
                ref={ref}
                className="text-ink placeholder:text-muted min-w-0 flex-1 bg-transparent text-[15px] outline-none"
                placeholder={placeholder}
                value={value}
                onChange={(e) => onChange?.(e.target.value)}
                onKeyDown={onKeyDown}
              />
            </div>
            {header ? (
              <div className="border-line shrink-0 border-b">{header}</div>
            ) : null}
            <div className="min-h-0 flex-1 overflow-y-auto p-2">{children}</div>
            {instructions.length ? (
              <div className="border-line text-muted flex shrink-0 flex-wrap items-center justify-center gap-x-4 gap-y-1 border-t px-4 py-2 text-[11px]">
                {instructions.map((i) => (
                  <span
                    key={i.command + i.purpose}
                    className="flex items-center gap-[6px]"
                  >
                    <Kbd>{i.command}</Kbd>
                    <span>{i.purpose}</span>
                  </span>
                ))}
              </div>
            ) : null}
          </div>
        );
      }

      export function SuggestRow({
        selected = false,
        onClick,
        title,
        aside = null,
        note = null,
        badge = null,
        badgeTone = "accent",

            style={

          >
            <div className="min-w-0 flex-1">
              <div className="flex items-center gap-2">
                <span className="text-ink truncate text-[14px]">{title}</span>
                {badge ? <Pill tone={badgeTone}>{badge}</Pill> : null}
              </div>

      export function CommandPalette({ open, items = [], onClose }) {
        const [query, setQuery] = useState("");
        const [sel, setSel] = useState(0);
        const hits = items.filter((i) =>
          i.label.toLowerCase().includes(query.toLowerCase()),
        );
        useEffect(() => {
          setSel(0);
        }, [query]);
        if (!open) return null;
        const onKeyDown = (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setSel((i) => Math.min(i + 1, hits.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setSel((i) => Math.max(i - 1, 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            hits[sel]?.onSelect?.();
          } else if (e.key === "Escape") {
            e.preventDefault();
            onClose?.();
          }
        };
        return (
          <Prompt
            placeholder="Select a command..."
            value={query}
            onChange={setQuery}
            onKeyDown={onKeyDown}
            instructions={[
              { command: "↑↓", purpose: "navigate" },
              { command: "↵", purpose: "run command" },
              { command: "esc", purpose: "dismiss" },
            ]}
          >
            {hits.map((it, i) => (
              <SuggestRow
                key={it.label}
                title={it.label}
                selected={i === sel}
                onClick={it.onSelect}
              />
            ))}
          </Prompt>
        );
      }

      // The exported file, opened as plain text — line numbers, YAML manifest fenced off from
      // the body by its own "---" lines, so a reader can answer question 2 by looking.
      export function FileText({ path, source, language = "markdown" }) {
        const lines = source.split("\n");
        const firstFence = lines.indexOf("---");
        const secondFence =
          firstFence === -1 ? -1 : lines.indexOf("---", firstFence + 1);
        return (
          <div className="border-line bg-ground overflow-hidden rounded-md border">
            <div className="border-line bg-ground-2 text-muted flex items-center gap-2 border-b px-3 py-[6px] font-mono text-[11px]">

            <div className="max-h-[440px] overflow-y-auto">
              <table className="w-full border-collapse font-mono text-[12px] leading-[1.7]">
                <tbody>
                  {lines.map((l, i) => {
                    const inManifest =
                      secondFence > -1 && i > firstFence && i < secondFence;
                    return (
                      <tr
                        key={i}
                        style={
                          inManifest
                            ? { background: "var(--ground-2)" }
                            : undefined
                        }
                      >
                        <td className="border-line text-muted w-[36px] shrink-0 border-r px-2 text-right align-top tabular-nums select-none">

                        <td className="text-ink/85 px-3 align-top whitespace-pre-wrap">
                          {l === "" ? " " : l}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      // A rendered literature note. With `diffAgainst` (the earlier version's own lines), added
      // lines get an accent rule and removed lines get a struck-through danger rule — the
      // before/after a second edition asks the recipient to weigh.
      export function NotePreview({ title, lines, diffAgainst = null }) {
        const rows = useMemo(() => {
          if (!diffAgainst) return lines.map((l) => ({ text: l, mark: null }));
          const rows = [];
          for (const l of diffAgainst)
            if (!lines.includes(l)) rows.push({ text: l, mark: "removed" });
          for (const l of lines)
            rows.push({
              text: l,
              mark: !diffAgainst.includes(l) ? "added" : null,
            });
          return rows;
        }, [lines, diffAgainst]);
        return (
          <div className="border-line bg-ground overflow-hidden rounded-md border">
            <div className="border-line bg-ground-2 text-ink flex items-center justify-between border-b px-3 py-[6px] text-[12px] font-semibold">
              <span className="truncate">{title}</span>
              {diffAgainst ? <Pill tone="accent">before → after</Pill> : null}
            </div>
            <div className="px-3 py-2 text-[13px] leading-relaxed">
              {rows.map((r, i) => (
                <div
                  key={i}
                  className={`border-l-2 pl-2 ${
                    r.mark === "removed" ? "line-through opacity-60" : ""
                  }`}
                  style={{
                    borderColor:
                      r.mark === "added"
                        ? "var(--accent)"
                        : r.mark === "removed"
                          ? "var(--danger)"
                          : "transparent",
                  }}
                >
                  {r.text || " "}
                </div>
              ))}
            </div>
          </div>
        );
      }

      // --- Variant B ---
      function VariantB() {
        const { state, actions } = useProtoState();

        // Settings surface: null (closed) | { page: "profiles" } | { page: "profile", id }.
        const [settingsPage, setSettingsPage] = useState({ page: "profiles" });
        // The one install sheet: null | { mode: "new" } | { mode: "update", profileId } |
        // { mode: "already", profileId }.
        const [installSheet, setInstallSheet] = useState(null);
        const [overrides, setOverrides] = useState({ folder: "", style: "" });
        const [altPreview, setAltPreview] = useState(false);
        const [approvedOverwrite, setApprovedOverwrite] = useState(false);
        const [shareFor, setShareFor] = useState(null);
        const [shareResult, setShareResult] = useState(null);
        const [addMenuOpen, setAddMenuOpen] = useState(false);
        const [deleteConfirmId, setDeleteConfirmId] = useState(null);
        const [revertConfirmId, setRevertConfirmId] = useState(null);

        const defaultProfile =
          state.profiles.find((p) => p.id === null) ?? null;

        // TAKE / SYNC / EDITION already have a file waiting — this is the researcher having just
        // picked "From a file..." or "From pasted text...". SYNC's same pack id + same version
        // collapses straight to "nothing to do"; EDITION's differing version opens update mode;
        // TAKE, with no matching pack id, opens the full add-new sheet.
        function openInstallSheetFromIncoming() {
          const incoming = state.incoming;
          if (!incoming) {
            actions.notify(
              "No file is queued in this prototype — switch to Take, Sync, or Edition to try this.",
            );
            return;
          }
          const existing =
            state.profiles.find((p) => p.packId === incoming.manifest.id) ??
            null;
          if (existing && existing.packVersion === incoming.manifest.version) {
            setInstallSheet({ mode: "already", profileId: existing.id });
            return;
          }
          if (existing) {
            setApprovedOverwrite(false);
            setInstallSheet({ mode: "update", profileId: existing.id });
            return;
          }
          setOverrides({
            folder: incoming.manifest.profileDefaults.folder,
            style: incoming.manifest.profileDefaults.citationStyle,
          });
          setAltPreview(false);
          setInstallSheet({ mode: "new" });
        }

        useEffect(() => {
          setInstallSheet(null);
          setOverrides({ folder: "", style: "" });
          setAltPreview(false);
          setApprovedOverwrite(false);
          setShareFor(null);
          setShareResult(null);
          setAddMenuOpen(false);
          setDeleteConfirmId(null);
          setRevertConfirmId(null);
          setSettingsPage({ page: "profiles" });
          if (state.incoming) openInstallSheetFromIncoming();
          // Re-run only when the scenario preset itself changes.
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [state.scenario]);

        // Anna's own document is the same file Ben, Dr. Reyes and Chen all receive — the one
        // bundled markdown the plan asks every "exported file as plain text" surface to show.
        function manifestAndBodyFor(profile) {
          if (profile.packId === MANIFEST_V1.id) {
            if (profile.packVersion === MANIFEST_V1_1.version)
              return { manifest: MANIFEST_V1_1, body: BODY_V1_1 };
            return { manifest: MANIFEST_V1, body: BODY_V1 };
          }
          return { manifest: null, body: null };
        }

        function handleShare(profile, target) {
          actions.exportProfile(profile.id, {
            bindings: ["literature folder", "citation style"],
            target,
          });
          const { manifest, body } = manifestAndBodyFor(profile);
          setShareFor(null);
          setShareResult({ profile, manifest, body });
        }

        // A rendered candidate for the install sheet's live preview — no Liquid engine here, just
        // the same shape ObsidianFrame's own note view already shows.
        function buildPreviewLines(item, manifest, folder) {
          const creators = (item.creators || []).map((c) => c.name).join(", ");
          return [
            `# ${item.title}`,
            "",
            creators || "(no creators on this item)",
            "",
            `- Year: ${item.date || "—"}`,
            `- Style: ${manifest.profileDefaults.citationStyle}`,
            `- Folder: ${folder}`,
            "",
            "This week",
            "- Discussion date:",
            "- Led by:",
          ];
        }

        // "Preview with another item" cycles to a second item from the recipient's own vault —
        // still the recipient's own data, never a fabricated stranger's.
        const candidateNotes = state.notes.filter((n) => n.profileId === null);
        const altNote =
          candidateNotes.find((n) => n.key !== state.previewItem?.key) ??
          candidateNotes[0] ??
          null;
        const altPreviewItem = altNote
          ? { key: altNote.key, title: altNote.title, creators: [], date: "" }
          : state.previewItem;
        const displayItem = altPreview ? altPreviewItem : state.previewItem;

          const styleInstalled = state.installedStyles.includes(

                <div>
                  <div className="text-muted mb-1 text-[11px] tracking-[0.06em] uppercase">

                    {!styleInstalled ? (

                  {!styleInstalled ? (
                    <div className="text-muted py-2 pl-[162px] text-[12px] leading-relaxed">

                        onClick={() =>
                          setOverrides((o) => ({

                        className="text-accent cursor-pointer underline"
                      >

                    setSettingsPage({ page: "profiles" });

                      actions.notify(
                        `Added "${profile.label}" — none of your existing notes changed.`,
                      );
                  }}
                  className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                  style={{ background: "var(--accent)", color: "#ffffff" }}
                >
                  Add profile
                </button>
              </div>
            </div>
          );

        function renderShareResult() {
          if (!shareResult) return null;
          const { profile, manifest, body } = shareResult;
          return (
            <div className="border-line bg-ground flex max-h-[85%] w-[640px] flex-col overflow-hidden rounded-lg border shadow-2xl">
              <div className="border-line border-b px-5 py-3 text-[16px] font-semibold">
                Shared “{profile.label}”
              </div>
              <div className="flex min-h-0 flex-1 flex-col gap-3 overflow-y-auto px-5 py-4 text-[13px]">
                {manifest ? <ManifestHeader manifest={manifest} /> : null}
                <p className="text-ink/85 leading-relaxed">

                </p>

                  className="cursor-pointer rounded-md px-3 py-[6px] text-[13px]"
                  style={{ background: "var(--accent)", color: "#ffffff" }}
                >
                  Done
                </button>
              </div>
            </div>

        }

        function renderDeleteConfirm() {
          const p = profileById(state, deleteConfirmId);
          if (!p) return null;
          return (
            <Dialog
              title={`Remove “${p.label}”?`}
              body={
                <p>
                  {p.noteCount === 0
                    ? "It has no notes yet, so nothing else changes."
                    : `It has ${p.noteCount} notes; removing a profile with notes isn't part of this prototype.`}
                </p>
              }
              actions={[
                { label: "Cancel", onClick: () => setDeleteConfirmId(null) },
                {
                  label: "Remove",
                  destructive: true,
                  onClick: () => {
                    actions.removeJustAddedProfile(p.id);
                    setDeleteConfirmId(null);
                    setSettingsPage({ page: "profiles" });
                  },
                },
              ]}
            />
          );
        }

        function renderRevertConfirm() {
          const p = profileById(state, revertConfirmId);
          const record = state.installRecords[revertConfirmId];
          if (!p || !record) return null;
          return (
            <Dialog
              title={`Revert “${p.label}” to v${record.version}?`}
              body={<p>{p.noteCount} notes re-render on their next update.</p>}
              actions={[
                { label: "Cancel", onClick: () => setRevertConfirmId(null) },
                {
                  label: "Revert",
                  cta: true,
                  onClick: () => {
                    actions.revertProfile(p.id);
                    setRevertConfirmId(null);
                  },
                },
              ]}
            />
          );
        }

        const overlay = deleteConfirmId ? (
          renderDeleteConfirm()
        ) : revertConfirmId ? (
          renderRevertConfirm()
        ) : installSheet ? (
          renderInstallSheet()
        ) : shareResult ? (
          renderShareResult()
        ) : settingsPage ? (
          <SettingsModal
            open
            onClose={() => setSettingsPage(null)}
            title="Literature note profiles"
          >

                onBack={() => setSettingsPage({ page: "profiles" })}
                onDelete={(id) => setDeleteConfirmId(id)}
                footer={renderProfileFooter(settingsPage.id)}
              />
            ) : (
              <ProfilesPage
                onOpen={(id) => setSettingsPage({ page: "profile", id })}
                onDelete={(id) => setDeleteConfirmId(id)}
                rowExtras={renderRowExtras}
                footer={renderAddProfileFooter()}
              />
            )}
          </SettingsModal>
        ) : null;

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              overlay={overlay}
              statusItems={
                <button
                  onClick={() => setSettingsPage({ page: "profiles" })}
                  className="text-muted flex cursor-pointer items-center gap-1"
                >
                  <Settings size={12} /> Profiles
                </button>
              }
            />
            <Rail
              thesis="Taking a shared profile in is like installing a citation style: it adds an entry and changes nothing you already made. Changing one you already have is a second, explicit act with the count stated."
              answers={[
                {
                  q: "What do I send?",
                  a: "Share… on the Reading group row bundles the document and the authors partial into one file — Save it or copy it as text.",
                },
                {
                  q: "What do I do with this file?",
                  a: "Add profile ▾ → From a file… opens one screen: preview against your own item, two settings to decide, then Add profile — nothing else in your vault changes.",
                },
                {
                  q: "Is this the same one I already have?",
                  a: "The row already reads Reading group v1.0.0 · from Anna; importing the same file again reports Already installed — nothing to do.",
                },
                {
                  q: "Can I take the revision without losing my edit?",
                  a: "The v1.1 available pill opens the rendered before/after; because you edited the file, Update stays disabled until you approve overwriting it.",
                },
              ]}
              steps={[
                "SEND — open the Profiles status-bar link, click Share… on Reading group, choose Save file… or Copy as text.",
                "TAKE — click + Add profile ▾ → From a file… to open the install sheet; try Preview with another item, edit the folder, note the Not installed in this vault citation style state, then Add profile.",
                "SYNC — switch the scenario to Sync, then From a file… again with the same file: it reports Already installed — nothing to do.",
                "EDITION — switch to Edition; open the v1.1 available pill on Chen's row to see the rendered before/after and the count; approve the overwrite before Update enables.",
                "Open a just-added profile's row and remove it — zero notes, no consequences.",
                "Open Reading group's profile page and try Revert to v1.0.0.",
              ]}
            />
          </div>
        );
      }
      // --- Variant B END ---

      // --- Variant C ---
      function VariantC() {
        const { state, actions } = useProtoState();
        const scenario = state.scenario;

        // The one Profile that ever travelled as a Pack — looked up by pack id, not by a hardcoded
        // local UUID, so this reads the same across every scenario preset.
        const reading =
          state.profiles.find((p) => p.packId === "anna.reading-group") ?? null;
        const installRecord = reading ? state.installRecords[reading.id] : null;

        // SEND: the context-menu-on-a-file door.
        const [menuOpen, setMenuOpen] = useState(false);
        const [exported, setExported] = useState(false);
        const [viewShareable, setViewShareable] = useState(false);

        // TAKE: the note-top-banner door.
        const [bannerDismissed, setBannerDismissed] = useState(false);
        const [previewOpen, setPreviewOpen] = useState(false);
        const [useDialogOpen, setUseDialogOpen] = useState(false);
        const [label, setLabel] = useState(state.incoming?.manifest.name ?? "");
        const [folder, setFolder] = useState(
          state.incoming?.manifest.profileDefaults.folder ?? "",
        );
        const [style, setStyle] = useState(
          state.incoming?.manifest.profileDefaults.citationStyle ?? "",
        );

        // EDITION: the overwrite-and-notice door.
        const [dropConfirmOpen, setDropConfirmOpen] = useState(false);
        const [overwritten, setOverwritten] = useState(false);
        const [whatChangesOpen, setWhatChangesOpen] = useState(false);

        // Discovery path, reachable from any scenario: Settings → ZotLit → Profiles.
        const [settingsOpen, setSettingsOpen] = useState(false);

        useEffect(() => {
          setMenuOpen(false);
          setExported(false);
          setViewShareable(false);
          setBannerDismissed(false);
          setPreviewOpen(false);
          setUseDialogOpen(false);
          setLabel(state.incoming?.manifest.name ?? "");
          setFolder(state.incoming?.manifest.profileDefaults.folder ?? "");
          setStyle(
            state.incoming?.manifest.profileDefaults.citationStyle ?? "",
          );
          setDropConfirmOpen(false);
          setOverwritten(false);
          setWhatChangesOpen(false);
          setSettingsOpen(false);
          // eslint-disable-next-line react-hooks/exhaustive-deps
        }, [scenario]);

        // Every .md in the vault carrying a template manifest — the "make a profile" list a
        // researcher who dropped the file in and forgot would meet in Settings.
        function templateDocuments() {
          const docs = [];
          for (const p of state.profiles)
            if (p.document && p.packId)
              docs.push({ path: p.document, used: true, label: p.label });
          if (state.incoming) {
            const already = state.profiles.some(
              (p) => p.packId === state.incoming.manifest.id,
            );
            if (!already)
              docs.push({ path: state.incoming.filename, used: false });
          }
          return docs;
        }

        // A plausible rendering of the incoming template against one of Ben's own items — writes
        // nothing, just what he would see if he pointed a note at it.
        function previewLines() {
          const item = state.previewItem;
          const manifest = state.incoming?.manifest;
          if (!item || !manifest) return [];
          return [
            `# ${item.title}`,
            "",
            (item.creators ?? []).map((c) => c.name).join(", "),
            "",
            `- Year: ${(item.date ?? "").slice(0, 4)}`,
            `- Style: ${manifest.profileDefaults.citationStyle}`,
            `- Folder: ${manifest.profileDefaults.folder}`,
            "",
            "This week",
            "- Discussion date:",
            "- Led by:",
          ];
        }

        let content;
        if (scenario === "send") {
          content = (
            <div className="flex flex-col gap-4">
              <p className="text-ink/80 max-w-[60ch] leading-relaxed">
                Anna wants to hand "Reading group" to four lab mates. There is
                no export command — the door is the file tree itself.
              </p>
              <div className="border-line bg-ground relative w-[340px] rounded-md border">
                <div className="flex items-center justify-between gap-2 px-3 py-2 text-[13px]">
                  <span className="truncate font-mono text-[12px]">
                    templates/reading-group.md
                  </span>
                  <button
                    onClick={() => setMenuOpen((v) => !v)}
                    aria-label="More options"
                    className="text-muted cursor-pointer rounded px-1"
                  >
                    •••
                  </button>
                </div>
                {menuOpen ? (
                  <div className="border-line bg-ground absolute top-9 right-2 z-10 w-[230px] overflow-hidden rounded-md border shadow-2xl">
                    <button
                      onClick={() => {
                        setMenuOpen(false);
                        setExported(true);
                        actions.exportProfile(reading?.id, { target: "file" });
                      }}
                      className="text-ink flex w-full cursor-pointer items-center px-3 py-2 text-left text-[13px]"
                    >
                      Copy shareable template
                    </button>
                  </div>
                ) : null}
              </div>

              {exported ? (
                <div className="flex flex-col gap-2">
                  <div className="border-line bg-ground flex items-center justify-between gap-2 rounded-md border px-3 py-2 text-[13px]">
                    <span className="truncate font-mono text-[12px]">
                      templates/Reading group (shareable).md
                    </span>
                    <Pill tone="accent">new</Pill>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    <button
                      onClick={() =>
                        actions.exportProfile(reading?.id, {
                          target: "clipboard",
                        })
                      }
                      className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[5px] text-[12px]"
                    >
                      Copy to clipboard
                    </button>
                    <button
                      onClick={() =>
                        actions.notify(
                          'Revealed "Reading group (shareable).md" in Finder',
                        )
                      }
                      className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[5px] text-[12px]"
                    >
                      Reveal in Finder
                    </button>
                    <button
                      onClick={() => setViewShareable((v) => !v)}
                      className="cursor-pointer rounded px-2 py-[5px] text-[12px]"
                      style={{ background: "var(--accent)", color: "#ffffff" }}
                    >
                      {viewShareable ? "Hide file" : "Open as text"}
                    </button>
                  </div>
                </div>
              ) : null}

              {viewShareable ? (
                <div className="flex flex-col gap-3">
                  <p className="text-muted text-[12px] leading-relaxed">
                    The shareable copy differs from the working file by one
                    thing: the <code>partials:</code> block is now inlined, so
                    nothing outside this file is needed to render it correctly.
                  </p>
                  <FileText
                    path="templates/reading-group.md (working file)"
                    source={BODY_V1}
                    language="liquid"
                  />

                "Open Settings → ZotLit → Profiles to see the vault-wide Template documents section.",
                "SYNC: read the banner recognizing the file already backs a profile.",
