<!doctype html>
<!--
  Prototype — Profile deletion from the academic user side (ticket #911, map #835)

  DESIGN QUESTION
  A Literature Note Profile goes away while notes still carry its stamp. What does the
  academic user experience at that moment, and which deletion semantics follow from that
  experience — not from the current settings dialog?

  FIRST PRINCIPLES (academic user)
  A Profile is "a kind of note" to the researcher: folder + citation style + look. A note is
  their durable work; forty notes outlive any configuration. The stamp is a pointer from the
  durable thing to the configuration, so deleting the configuration leaves a dangling pointer.
  The classic resolutions are the same three every system has: RESTRICT (refuse),
  SET DEFAULT / re-point (move), or soft delete (tombstone).

  Three researchers, three questions — the scenario presets of this prototype:
    1. FOLD    "Book chapters" (40 notes, 6 Imported Notes) folds back into Default.
               "What happens to my forty notes?"            → intent is a MOVE.
    2. RETIRE  "Thesis" (12 notes, 3 Imported Notes) after graduating.
               "Can I still update them, if I ever need to?" → intent is ARCHIVE.
    3. OOPS    "Articles" (23 notes) deleted by mistake while tidying settings.
               "How do I get it back?"                       → intent is UNDO.
  Consequences:
    a. Nobody wants a note that "cannot update". A stale stamp is a state the plugin invents.
       If it must exist it has to be harmless at rest and speak only at use time, in the
       researcher's words, with the fix one click away.
    b. "Recreate the profile with the same ID" is not in the researcher's vocabulary and is not
       doable by hand (UUID). Recovery must be a button, not an instruction.
    c. "Never change a note's appearance silently" makes folding 40 notes into Default a
       consented re-stamp with the consequences stated — #904's Switch Profile dialog, batched.
    d. Obsidian's own idioms (delete a file, delete a folder, disable a plugin) never refuse;
       all are reversible and show the consequence where the user meets it.
    e. The count turns an abstract warning into the researcher's own situation, and the search
       query ["zotlit-profile":<id>] is the researcher-facing "show these notes".
    f. Six surfaces every variant renders: the settings Profiles list, the delete dialog, the
       note Properties stamp, "Update from Zotero" on that note, and the Switch Profile picker.

  VARIANTS
    A  Baseline (today)          — one confirm dialog, no count, no consequence; the stale stamp
                                   renders as a raw UUID; "Update from Zotero" fails with the
                                   current notice; recovery: none in the UI.
    B  Refuse while referenced   — the dialog names the count and offers "Show these notes" and
                                   "Move 40 notes to…"; Delete stays disabled until the count is
                                   0; a 0-note Profile deletes at once. Nothing is ever stale.
    C  Delete, visibly stale     — the dialog names the count and the consequence in note words;
                                   afterwards a banner on the Profiles page, a danger pill on the
                                   stamp, and a use-time notice carrying "Switch profile…".
    D  Delete = move             — the dialog IS the batched Switch Profile consequences dialog;
                                   CTA "Delete and move 40 notes"; a Notice offers Undo. No stale
                                   state exists; the template document is never deleted.
    E  Retire (self-cleaning)    — deleting a referenced Profile retires it: out of the pickers,
                                   notes keep updating, greyed in settings under "Retired · 40
                                   notes" with Restore / Move notes to… / Delete anyway. It
                                   disappears by itself when the last note leaves.
-->
<html lang="en">
  <head>

    <title>Profile deletion UX</title>

    <style type="text/tailwindcss">

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",

  <body>
    <div id="root"></div>

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, {
        useState,
        useEffect,
        useMemo,
        useRef,
        useSyncExternalStore,
      } from "react";
      import { createRoot } from "react-dom/client";
      import {
        Search,
        ChevronDown,
        ChevronRight,
        FolderOpen,
        FileText,
        Files,
        Bookmark,
        PanelLeft,
        Settings,
        HelpCircle,
        X,
        Plus,
        Trash2,
        RotateCcw,
        ArrowRight,
        ArrowLeft,
        AlertTriangle,
        Archive,
      } from "lucide-react"; // any lucide icon; <Search size={16} className="text-muted" />


      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---


      // --- Shared ---
      // The prototype store: one module-level object, a listener set, and useSyncExternalStore.
      // Variants never receive props — they read `useProtoState()` and call `actions`.

      const ART = "3f1c8a52-9d47-4b6e-8c21-5a0e7d94b311";
      const BOOK = "a72e4d19-6c58-4f03-9b7d-1e83c6a2f450";
      const THESIS = "d5b90c37-2a14-4e8f-b6c9-70f1d8e34a26";
      const SCRATCH = "6c02f8b4-51de-4a97-83f0-9b2e47c1da85";

      const ALL_PROFILES = [
        {
          id: null,
          label: "Default",
          folder: "literatures",
          style: "Built-in default",
          document: "Built-in template",
          noteCount: 118,
          importedCount: 12,
          status: "active",
        },
        {
          id: ART,
          label: "Articles",
          folder: "literatures/articles",
          style: "apa",
          document: "templates/articles.md",
          noteCount: 23,
          importedCount: 4,
          status: "active",
        },
        {
          id: BOOK,
          label: "Book chapters",
          folder: "literatures/book-chapters",
          style: "chicago-note",
          document: "templates/book-chapter.md",
          noteCount: 40,
          importedCount: 6,
          status: "active",
        },
        {
          id: THESIS,
          label: "Thesis",
          folder: "projects/thesis/reading",
          style: "chicago-author-date",
          document: null, // bindings-only Profile: no template document
          noteCount: 12,
          importedCount: 3,
          status: "active",
        },
        {
          id: SCRATCH,
          label: "Scratch",
          folder: "inbox",
          style: "Built-in default",
          document: "Built-in template",
          noteCount: 0,
          importedCount: 0,
          status: "active",
        },
      ];

      // ~4 sample notes per Profile. The counts on the Profile records are the truth; this
      // list is only what the file tree, the search pane and the readout can show.
      const SAMPLE_NOTES = [
        { key: "kuhnStructure1962", title: "The structure of scientific revolutions", profileId: null, imported: 2 },
        { key: "latourLaboratory1979", title: "Laboratory life", profileId: null, imported: 0 },
        { key: "popperLogic1959", title: "The logic of scientific discovery", profileId: null, imported: 1 },
        { key: "mertonNormative1973", title: "The normative structure of science", profileId: null, imported: 0 },

        { key: "smithCitation2021", title: "Citation practices in the digital humanities", profileId: ART, imported: 1 },
        { key: "garciaOpenAccess2022", title: "Open access and the long tail of citation", profileId: ART, imported: 0 },
        { key: "nakamuraPeerReview2020", title: "Peer review at scale", profileId: ART, imported: 2 },
        { key: "olsenPreprint2023", title: "Preprints and the speed of correction", profileId: ART, imported: 0 },

        { key: "smithChapter2021", title: "Reading machines: a chapter on distant reading", profileId: BOOK, imported: 2 },
        { key: "weberBureaucracy1978", title: "Bureaucracy, chapter 11", profileId: BOOK, imported: 0 },
        { key: "ecoOpenWork1989", title: "The poetics of the open work", profileId: BOOK, imported: 1 },
        { key: "bourdieuField1993", title: "The field of cultural production", profileId: BOOK, imported: 0 },

        { key: "arendtCondition1958", title: "The human condition", profileId: THESIS, imported: 1 },
        { key: "foucaultArchaeology1969", title: "The archaeology of knowledge", profileId: THESIS, imported: 0 },
        { key: "harawaySituated1988", title: "Situated knowledges", profileId: THESIS, imported: 1 },
        { key: "stengersCosmopolitics2010", title: "Cosmopolitics I", profileId: THESIS, imported: 0 },
      ];

      const SCENARIOS = {
        fold: { subjectProfileId: BOOK, activeNoteKey: "smithChapter2021" },
        retire: { subjectProfileId: THESIS, activeNoteKey: "arendtCondition1958" },
        oops: { subjectProfileId: ART, activeNoteKey: "smithCitation2021" },
      };

      function stamp() {
        const d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
      }

      function folderOf(profiles, id) {
        const p = profiles.find((x) => x.id === (id ?? null));
        return p ? p.folder : "literatures";
      }

      function seed(scenario) {
        const preset = SCENARIOS[scenario] ?? SCENARIOS.fold;
        const profiles = ALL_PROFILES.map((p) => ({ ...p }));
        return {
          scenario,
          subjectProfileId: preset.subjectProfileId,
          profiles,
          deletedProfiles: {},
          notes: SAMPLE_NOTES.map((n) => ({
            ...n,
            path: `${folderOf(profiles, n.profileId)}/${n.key}.md`,
          })),
          activeNoteKey: preset.activeNoteKey,
          search: null,
          notices: [],
          log: [],
        };
      }

      let state = seed("fold");
      const listeners = new Set();

      function subscribe(fn) {
        listeners.add(fn);
        return () => listeners.delete(fn);
      }

      function getSnapshot() {
        return state;
      }

      function setState(next) {
        state = next;
        for (const fn of listeners) fn();
      }

      function logged(next, text) {
        return {
          ...next,
          log: [{ t: stamp(), text }, ...next.log].slice(0, 40),
        };
      }

      export function useProtoState() {
        const snapshot = useSyncExternalStore(subscribe, getSnapshot);
        return { state: snapshot, actions };
      }

      // Looks in the live Profiles first, then in the tombstones — a deleted record comes
      // back with status "deleted" so every surface can render it without special-casing.
      export function profileById(s, id) {
        const live = s.profiles.find((p) => p.id === (id ?? null));
        if (live) return live;
        const gone = s.deletedProfiles[id];
        if (gone) return { ...gone, id, status: "deleted" };
        return null;
      }

      export function stampLabel(s, note) {
        if (!note) return null;
        const p = profileById(s, note.profileId);
        if (!p)
          return {
            label: "Unknown profile",
            secondary: note.profileId,
            status: "deleted",
          };
        return {
          label: p.label,
          secondary: p.id ?? "(built-in default)",
          status: p.status,
        };
      }

      export function PROFILE_DISPLAY(profile) {
        return [
          profile.folder,
          profile.style,
          profile.document ?? "Bindings only",
        ].join(" · ");
      }

      export function activeNote(s) {
        return s.notes.find((n) => n.key === s.activeNoteKey) ?? null;
      }

      export function notesOf(s, profileId) {
        return s.notes.filter((n) => n.profileId === (profileId ?? null));
      }

      export const UNKNOWN_PROFILE_NOTICE = (id) =>
        `This literature note uses an unknown profile (${id}). Re-stamp the note or recreate the profile with the same ID.`;

      let noticeSeq = 0;

      function pushNotice(s, text, action) {
        const id = ++noticeSeq;
        setTimeout(
          () => actions.dismissNotice(id),
          action ? 10000 : 6000,
        );
        return { ...s, notices: [...s.notices, { id, text, action }] };
      }

      export const actions = {
        setScenario(scenario) {
          setState(logged(seed(scenario), `Scenario: ${scenario}`));
        },

        // Removes the record and remembers it, so a stale stamp can still say a name (C)
        // and so Undo has something to put back (D). The notes keep their stamp.
        deleteProfile(id) {
          const p = profileById(state, id);
          if (!p || p.id === null) return;
          const rest = state.profiles.filter((x) => x.id !== id);
          setState(
            logged(
              {
                ...state,
                profiles: rest,
                deletedProfiles: {
                  ...state.deletedProfiles,
                  [id]: {
                    label: p.label,
                    folder: p.folder,
                    style: p.style,
                    document: p.document,
                    noteCount: p.noteCount,
                    importedCount: p.importedCount,
                    deletedAt: stamp(),
                  },
                },
              },
              `Deleted the "${p.label}" profile; its ${p.noteCount} notes keep the stamp`,
            ),
          );
        },

        // E: the Profile leaves the pickers but its notes keep updating exactly as before.
        retireProfile(id) {
          const p = profileById(state, id);
          if (!p || p.id === null) return;
          setState(
            logged(
              {
                ...state,
                profiles: state.profiles.map((x) =>
                  x.id === id ? { ...x, status: "retired" } : x,
                ),
              },
              `Retired "${p.label}"; it is out of the pickers, its ${p.noteCount} notes still update`,
            ),
          );
        },

        // Back from retired (E) or back from the tombstone (D undo, A recreate).
        restoreProfile(id) {
          const retired = state.profiles.find((x) => x.id === id);
          if (retired) {
            setState(
              logged(
                {
                  ...state,
                  profiles: state.profiles.map((x) =>
                    x.id === id ? { ...x, status: "active" } : x,
                  ),
                },
                `Restored "${retired.label}"; it is back in the pickers`,
              ),
            );
            return;
          }
          const gone = state.deletedProfiles[id];
          if (!gone) return;
          const { deletedAt, ...record } = gone;
          const revived = { ...record, id, status: "active" };
          const order = ALL_PROFILES.map((p) => p.id);
          const profiles = [...state.profiles, revived].sort(
            (a, b) => order.indexOf(a.id) - order.indexOf(b.id),
          );
          const deletedProfiles = { ...state.deletedProfiles };
          delete deletedProfiles[id];
          setState(
            logged(
              { ...state, profiles, deletedProfiles },
              `Brought "${revived.label}" back with the same ID; its ${revived.noteCount} notes work again`,
            ),
          );
        },

        recreateProfileWithSameId(id) {
          actions.restoreProfile(id);
        },

        // Re-stamps every note of `fromId` — counts, samples and paths — and says so in the
        // researcher's words. A retired Profile that hits zero notes disappears by itself (E).
        moveNotes(fromId, toId, options) {
          const { moveFiles = false, includeImported = true } = options ?? {};
          const from = profileById(state, fromId);
          const to = profileById(state, toId);
          if (!from || !to) return;
          const moved = from.noteCount;
          const movedImported = includeImported ? from.importedCount : 0;

          const profiles = state.profiles.map((p) => {
            if (p.id === (toId ?? null))
              return {
                ...p,
                noteCount: p.noteCount + moved,
                importedCount: p.importedCount + movedImported,
              };
            if (p.id === fromId)
              return {
                ...p,
                noteCount: 0,
                importedCount: p.importedCount - movedImported,
              };
            return p;
          });

          const notes = state.notes.map((n) =>
            n.profileId === (fromId ?? null)
              ? {
                  ...n,
                  profileId: toId ?? null,
                  path: moveFiles ? `${to.folder}/${n.key}.md` : n.path,
                }
              : n,
          );

          // A retired source that has nothing left cleans itself up (E); a tombstone that has
          // nothing left stops haunting the settings page (C).
          const emptied = profiles.find((p) => p.id === fromId);
          const nextProfiles =
            emptied && emptied.status === "retired"
              ? profiles.filter((p) => p.id !== fromId)
              : profiles;
          const deletedProfiles = { ...state.deletedProfiles };
          if (deletedProfiles[fromId]) delete deletedProfiles[fromId];

          const line = `Moved ${moved} notes from ${from.label} to ${to.label}; files ${
            moveFiles ? `moved to ${to.folder}/` : "stay in place"
          }${movedImported ? `; ${movedImported} imported notes moved too` : ""}`;

          setState(
            logged(
              { ...state, profiles: nextProfiles, notes, deletedProfiles },
              line,
            ),
          );
          return { moved, movedImported, line };
        },

        // The use-time diagnostic. A deleted Profile is the only failure; a retired one
        // updates like any other (E). `silent` lets a variant word the failure its own way.
        updateFromZotero(noteKey, options) {
          const { silent = false } = options ?? {};
          const note = state.notes.find((n) => n.key === noteKey);
          if (!note) return { ok: false, kind: "no-note" };
          const p = profileById(state, note.profileId);
          if (!p || p.status === "deleted") {
            const id = note.profileId;
            const result = { ok: false, kind: "unknown-profile", id };
            setState(
              logged(
                silent
                  ? state
                  : pushNotice(state, UNKNOWN_PROFILE_NOTICE(id)),
                `Update from Zotero on ${note.path} — refused, unknown profile`,
              ),
            );
            return result;
          }
          setState(
            logged(
              silent ? state : pushNotice(state, `Updated ${note.path} from Zotero`),
              `Update from Zotero on ${note.path} — done under ${p.label}`,
            ),
          );
          return { ok: true };
        },

        showNotes(profileId) {
          const p = profileById(state, profileId);
          setState(
            logged(
              {
                ...state,
                search: {
                  query: `["zotlit-profile":${profileId}]`,
                  profileId: profileId ?? null,
                },
              },
              `Searched the vault for notes stamped ${p ? p.label : profileId}`,
            ),
          );
        },

        closeSearch() {
          setState({ ...state, search: null });
        },

        notify(text, action) {
          setState(pushNotice(state, text, action));
        },

        dismissNotice(id) {
          setState({
            ...state,
            notices: state.notices.filter((n) => n.id !== id),
          });
        },

        openNote(key) {
          const note = state.notes.find((n) => n.key === key);
          setState(
            logged(
              { ...state, activeNoteKey: key },
              `Opened ${note ? note.path : key}`,
            ),
          );
        },
      };

      // --- Primitives: Obsidian's default theme, rebuilt from the plan's tokens only. ---

      export function Kbd({ children }) {
        return (
          <kbd className="font-mono text-[11px] leading-none border-line bg-ground-2 text-muted rounded border px-1 py-[3px]">
            {children}
          </kbd>
        );
      }

      export function Pill({ tone = "muted", children, className = "" }) {
        const tint =
          tone === "accent"
            ? {
                color: "var(--accent)",
                background:
                  "color-mix(in srgb, var(--accent) 14%, transparent)",
              }
            : tone === "danger"
              ? {
                  color: "var(--danger)",
                  background:
                    "color-mix(in srgb, var(--danger) 14%, transparent)",
                }
              : { color: "var(--muted)", background: "var(--ground-2)" };
        return (
          <span
            className={`inline-block rounded-full px-2 py-[2px] text-[11px] leading-none whitespace-nowrap ${className}`}
            style={tint}
          >
            {children}
          </span>
        );
      }

      function TreeFolder({ name, files, activePath, onOpen }) {
        return (
          <div className="mb-[2px]">
            <div className="text-ink/85 flex items-center gap-1 rounded px-1 py-[3px] text-[13px]">
              <ChevronDown size={12} className="text-muted shrink-0" />
              <span className="truncate">{name}</span>
            </div>
            {files.map((f) => (
              <div

      export function ObsidianFrame({

        const { state } = useProtoState();
        const active = activeNote(state);
        const activeInfo = stampLabel(state, active);
        const activeProfile = active ? profileById(state, active.profileId) : null;

        const tree = useMemo(() => {
          const folders = new Map();
          for (const note of state.notes) {
            const cut = note.path.lastIndexOf("/");
            const dir = note.path.slice(0, cut);
            const name = note.path.slice(cut + 1);
            if (!folders.has(dir)) folders.set(dir, []);
            folders.get(dir).push({ name, path: note.path, key: note.key });
          }
          const documents = new Set();
          for (const p of state.profiles)
            if (p.document && p.document.includes("/")) documents.add(p.document);
          for (const p of Object.values(state.deletedProfiles))
            if (p.document && p.document.includes("/")) documents.add(p.document);
          folders.set(
            "templates",
            [...documents].sort().map((path) => ({
              name: path.split("/").pop(),
              path,
            })),
          );
          return [...folders.entries()].sort((a, b) =>
            a[0].localeCompare(b[0]),
          );
        }, [state.notes, state.profiles, state.deletedProfiles]);

        const pane =
          sidePane ??
          (state.search ? (
            <SearchPane
              query={state.search.query}
              results={notesOf(state, state.search.profileId)}
              total={
                profileById(state, state.search.profileId)?.noteCount ?? 0

              {/* file tree */}

                  <TreeFolder

                    activePath={active?.path}
                    onOpen={(key) => actions.openNote(key)}

                ))}
              </div>

              {/* search pane */}

              {/* main pane */}
              <div className="flex min-w-0 flex-1 flex-col">
                <div className="border-line flex shrink-0 items-center gap-2 border-b px-3 py-[6px]">
                  <div className="border-line bg-ground flex items-center gap-2 rounded-md border px-3 py-1 text-[13px]">
                    <FileText size={13} className="text-muted" />
                    <span className="max-w-[280px] truncate">{tabTitle}</span>
                    <X size={12} className="text-muted" />
                  </div>
                  <Plus size={14} className="text-muted" />
                  <div className="flex-1" />

                </div>

                <div className="min-h-0 flex-1 overflow-y-auto px-10 py-6">
                  {children ? <div className="mb-6">{children}</div> : null}
                  {active ? (
                    <>
                      <div className="text-muted mb-4 font-mono text-[11px]">
                        {active.path}
                      </div>
                      <table className="mb-6 w-full max-w-[560px] table-fixed text-[13px]">
                        <tbody>
                          <tr>
                            <td className="text-muted w-[130px] py-1 align-top">
                              zotero-key

      export function CommandPalette({ open, items = [], onClose }) {
        const [query, setQuery] = useState("");
        const [sel, setSel] = useState(0);
        const hits = items.filter((i) =>
          i.label.toLowerCase().includes(query.toLowerCase()),
        );
        useEffect(() => {
          setSel(0);
        }, [query]);
        if (!open) return null;
        const onKeyDown = (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setSel((i) => Math.min(i + 1, hits.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setSel((i) => Math.max(i - 1, 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            hits[sel]?.onSelect?.();
          } else if (e.key === "Escape") {
            e.preventDefault();
            onClose?.();
          }
        };
        return (
          <Prompt
            placeholder="Select a command..."
            value={query}
            onChange={setQuery}
            onKeyDown={onKeyDown}
            instructions={[
              { command: "↑↓", purpose: "navigate" },
              { command: "↵", purpose: "run command" },
              { command: "esc", purpose: "dismiss" },
            ]}
          >
            {hits.map((it, i) => (
              <SuggestRow
                key={it.label}
                title={it.label}
                selected={i === sel}
                onClick={it.onSelect}
              />
            ))}
          </Prompt>
        );
      }

      // --- App ---
      // --- Variant A ---
      // --- Variant A ---
      // Variant A — Baseline: today's plugin, reproduced faithfully.

      // raw UUID; "Update from Zotero" refuses with the current notice; recovery: none in the UI.

      /** Keyboard for every Prompt: ↑↓ move, ↵ choose, Esc close. */
      function va_navKeys(evt, { count, index, setIndex, onChoose, onClose }) {
        if (evt.key === "ArrowDown") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index + 1) % count);
        } else if (evt.key === "ArrowUp") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index - 1 + count) % count);
        } else if (evt.key === "Enter") {
          evt.preventDefault();
          if (count > 0) onChoose(index);
        } else if (evt.key === "Escape") {
          evt.preventDefault();
          onClose();
        }
      }

      /** Profile picker filter — label only, exactly like the real modal. */
      function va_matchProfiles(profiles, query) {
        const q = query.trim().toLocaleLowerCase();
        if (!q) return profiles;
        return profiles.filter((p) => p.label.toLocaleLowerCase().includes(q));
      }

      /**
       * One row of the Profiles list as it stands today: name, the folder · style · document
       * line, and a trash icon. Nothing counts the notes, so no count can appear on the row.
       * Called as a function (not a JSX tag) so the `va_` prefix stays intact.
       */
      function va_profileRow(profile, { onOpen, onDelete }) {
        return (
          <div
            key={profile.label}
            onClick={profile.id ? () => onOpen(profile.id) : undefined}
            className={`border-line flex items-center gap-4 border-b py-3 ${
              profile.id ? "cursor-pointer" : ""
            }`}
          >
            <div className="min-w-0 flex-1">

            </div>
            <div className="flex shrink-0 items-center gap-2">
              {profile.id ? (
                <IconButton
                  label={`Delete ${profile.label}`}
                  tone="danger"
                  onClick={(e) => {
                    e.stopPropagation();
                    onDelete(profile.id);
                  }}
                >
                  <Trash2 size={14} />
                </IconButton>
              ) : null}
            </div>
          </div>
        );
      }

      /** The Properties stamp today: the raw UUID, no label, no pill. */
      function va_rawStamp(note) {
        return (
          <span className="font-mono text-[12px] break-all">
            {note.profileId ?? "(empty)"}
          </span>
        );
      }

      function VariantA() {

        useEffect(() => {

        const deletedIds = Object.keys(state.deletedProfiles);

        // Label-only rows; a deleted Profile is simply absent from the list.
        const choices = useMemo(

        function closeTop() {

        // --- Overlays ----------------------------------------------------------

        const overlay =
          settingsOpen || top ? (
            <>
              {settingsLayer}
              {top ? (
                <div
                  className="absolute inset-0 flex items-center justify-center"
                  style={{ background: "rgba(0,0,0,0.28)" }}
                >
                  {top}
                </div>
              ) : null}
            </>
          ) : null;

        const statusItems = (
          <div className="flex items-center gap-2">
            <button
              type="button"
              className="border-line text-ink hover:bg-ground-2 cursor-pointer rounded border px-2 py-[2px]"
              onClick={openSettings}
            >
              Settings
            </button>
            <button
              type="button"
              className="border-line text-muted hover:bg-ground-2 cursor-pointer rounded border px-2 py-[2px]"
              onClick={openPalette}

              ⌘P
            </button>
          </div>
        );

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              title="ZotLit — baseline (today)"
              statusItems={statusItems}
              overlay={overlay}
              stampRender={(activeNoteRecord) => va_rawStamp(activeNoteRecord)}
            />
            <Rail
              thesis="Today the dialog warns in system vocabulary and the plugin forgets the profile the moment it is deleted; the note carries a UUID nobody can act on."
              answers={[
                {
                  q: "What happens to my forty notes?",
                  a: "They keep their text and their stamp, and nothing ever tells you there are forty of them.",
                },

              steps={[

                "Read the rows: name, folder · style · document. Nothing counts the notes.",

                "Read the dialog: it speaks of stamps and IDs, never of your notes. Confirm.",

                "⌘P → “Switch literature note profile…”: labels only, and the deleted one is simply absent.",

      // --- Variant A END ---

      // --- Variant B ---
      // Variant B — "Refuse while referenced" (referential integrity).
      // A Profile that notes still point at cannot be deleted. The trash icon opens a dialog that
      // counts the notes in the researcher's words, shows them, and offers to move them; the Delete
      // button stays disabled until the count is zero. Nothing is ever stale, so the stamp is the
      // default stamp, "Update from Zotero" always works, and the picker never has to explain a
      // missing Profile. The bill for that guarantee is paid by the researcher who only wanted to
      // tidy: RETIRE has to move 12 finished notes before the Profile can go.

      function vb_notesLine(count) {
        return count === 1 ? "1 literature note" : `${count} literature notes`;
      }

      function vb_importedLine(count) {
        return count === 1 ? "1 imported note" : `${count} imported notes`;
      }

      /** The dialog body, in note words: the count is the researcher's own situation. */
      function vb_deleteBody(profile) {
        if (profile.noteCount === 0)
          return "No notes use it.";
        const imported =
          profile.importedCount > 0
            ? ` (and ${vb_importedLine(profile.importedCount)})`
            : "";
        return `${vb_notesLine(profile.noteCount)}${imported} use this profile. Move them to another profile first, then delete it.`;
      }

      /** ↑↓ / ↵ / Esc for the Switch Profile picker. */
      function vb_navKeys(evt, { count, index, setIndex, onChoose, onClose }) {
        if (evt.key === "ArrowDown") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index + 1) % count);
        } else if (evt.key === "ArrowUp") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index - 1 + count) % count);
        } else if (evt.key === "Enter") {
          evt.preventDefault();
          if (count > 0) onChoose(index);
        } else if (evt.key === "Escape") {
          evt.preventDefault();
          onClose();
        }
      }

      function VariantB() {
        const { state, actions } = useProtoState();

        // Settings modal: closed | { page: "profiles" } | { page: "profile", profileId }
        const [settings, setSettings] = useState(null);
        // The delete dialog reads the live record every render — { profileId } or null.
        const [deleteFor, setDeleteFor] = useState(null);
        // The batched Switch Profile dialog — { fromId } or null.
        const [moveFor, setMoveFor] = useState(null);
        const [moveToId, setMoveToId] = useState(null);
        const [moveOptions, setMoveOptions] = useState({
          moveFiles: false,
          includeImported: true,
        });
        // null | "palette" | "picker"
        const [surface, setSurface] = useState(null);
        const [pickerQuery, setPickerQuery] = useState("");
        const [pickerIndex, setPickerIndex] = useState(0);

        const subject = profileById(state, state.subjectProfileId);
        const note = activeNote(state);
        const noteProfile = note ? profileById(state, note.profileId) : null;

        // The scenario preset reseeds the store; every local surface goes back to closed.
        useEffect(() => {
          setSettings(null);
          setDeleteFor(null);
          setMoveFor(null);
          setMoveToId(null);
          setMoveOptions({ moveFiles: false, includeImported: true });
          setSurface(null);
          setPickerQuery("");
          setPickerIndex(0);
        }, [state.scenario]);

        // Esc closes the topmost surface, in stacking order.
        useEffect(() => {
          const onKey = (e) => {
            if (e.key !== "Escape") return;
            if (moveFor) setMoveFor(null);
            else if (deleteFor) setDeleteFor(null);
            else if (surface) setSurface(null);
            else if (settings) setSettings(null);
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        }, [moveFor, deleteFor, surface, settings]);

        function openSettings(page = { page: "profiles" }) {
          setSurface(null);
          setSettings(page);
        }

        function askDelete(id) {
          setDeleteFor({ profileId: id });
        }

        function openMove(fromId) {
          setMoveToId(null); // Default is the target the fold scenario wants
          setMoveOptions({ moveFiles: false, includeImported: true });
          setMoveFor({ fromId });
        }

        function showNotesOf(id) {
          const p = profileById(state, id);
          const back = settings ?? { page: "profiles" };
          // The search pane lives in the workspace, behind the settings modal: close settings so
          // the researcher can read the result, and offer the way back in one click.
          setDeleteFor(null);
          setSettings(null);
          actions.showNotes(id);
          actions.notify(
            `${vb_notesLine(p.noteCount)} are stamped “${p.label}”.`,
            {
              label: "Back to profile settings",
              onClick: () => {
                setSettings(back);
                setDeleteFor({ profileId: id });
              },
            },
          );
        }

        function confirmMove() {
          const from = profileById(state, moveFor.fromId);
          const to = profileById(state, moveToId);
          const result = actions.moveNotes(moveFor.fromId, moveToId, moveOptions);
          setMoveFor(null);
          // Straight back to the delete dialog, which now counts zero notes.
          setDeleteFor({ profileId: from.id });
          if (result)
            actions.notify(
              `Moved ${result.moved} notes to ${to.label}. “${from.label}” has no notes now.`,
            );
        }

        function confirmDelete(id) {
          const p = profileById(state, id);
          actions.deleteProfile(id);
          setDeleteFor(null);
          setSettings({ page: "profiles" });
          actions.notify(`Deleted the “${p.label}” profile.`);
        }

        function updateActiveNote() {
          if (!note) return;
          // Nothing is ever stale in this variant, so the plain result is the whole story.
          actions.updateFromZotero(note.key);
          if (note.imported > 0)
            actions.notify(
              `Its ${vb_importedLine(note.imported)} updated under the same profile, “${
                noteProfile ? noteProfile.label : "Default"
              }”.`,
            );
        }

        // --- Switch Profile picker ---------------------------------------------
        const pickerRows = useMemo(() => {
          const q = pickerQuery.trim().toLocaleLowerCase();
          const rows = state.profiles.filter((p) => p.status === "active");
          return q
            ? rows.filter((p) => p.label.toLocaleLowerCase().includes(q))
            : rows;
        }, [state.profiles, pickerQuery]);

        function choosePickerRow(i) {
          const p = pickerRows[i];
          if (!p) return;
          setSurface(null);
          setPickerQuery("");
          setPickerIndex(0);
          actions.notify(
            `“${p.label}” — a single-note re-stamp is the Switch Profile flow (#904); this deletion prototype leaves the stamp as it is.`,
          );
        }

        // --- Overlays ------------------------------------------------------------
        // The settings modal is the bottom layer; a dialog, the palette or the picker sits on
        // top of it on its own scrim, the way Obsidian stacks a confirm over an open settings tab.
        let settingsNode = null;
        let topNode = null;

        if (settings) {
          settingsNode = (
            <SettingsModal
              open
              onClose={() => setSettings(null)}
              title="Literature note profiles"
            >
              {settings.page === "profiles" ? (
                <ProfilesPage
                  onDelete={askDelete}
                  onOpen={(id) => setSettings({ page: "profile", profileId: id })}
                  banner={
                    <Banner
                      tone="muted"
                      text="A profile can be deleted once no note points at it. The note count on each row is what the delete dialog checks."
                    />
                  }
                />
              ) : (
                <ProfilePage
                  profileId={settings.profileId}
                  onBack={() => setSettings({ page: "profiles" })}
                  onDelete={askDelete}
                />
              )}
            </SettingsModal>
          );
        }

        if (surface === "palette") {
          topNode = (
            <CommandPalette
              open
              onClose={() => setSurface(null)}
              items={[
                {
                  label: "Open settings → Literature note profiles",
                  onSelect: () => openSettings(),
                },
                {
                  label: "Update literature note from Zotero",
                  onSelect: () => {
                    setSurface(null);
                    updateActiveNote();
                  },
                },
                {

      // --- Variant C ---
      // Variant C — Delete, visibly stale.
      // Deletion is allowed and immediate, exactly as today. What changes is that the cost is
      // named everywhere the researcher meets it: the delete dialog states it in note words, a
      // danger banner on the Profiles page counts the orphaned notes and offers the batch move,
      // the Properties stamp carries a "deleted profile" pill plus an inline switch, the
      // use-time notice carries a "Switch profile…" button, and the picker never lists the
      // deleted Profile. Recovery = batch move from the banner, or a per-note switch.

      /** Keyboard for every Prompt: ↑↓ move, ↵ choose, Esc close. */
      function vc_navKeys(evt, { count, index, setIndex, onChoose, onClose }) {
        if (evt.key === "ArrowDown") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index + 1) % count);
        } else if (evt.key === "ArrowUp") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index - 1 + count) % count);
        } else if (evt.key === "Enter") {
          evt.preventDefault();
          if (count > 0) onChoose(index);
        } else if (evt.key === "Escape") {
          evt.preventDefault();
          onClose();
        }
      }

      /** "40 literature notes and 6 imported notes" — the researcher's own situation. */
      function vc_countPhrase(profile) {
        const notes = `${profile.noteCount} literature note${profile.noteCount === 1 ? "" : "s"}`;
        if (!profile.importedCount) return notes;
        return `${notes} and ${profile.importedCount} imported note${
          profile.importedCount === 1 ? "" : "s"
        }`;
      }

      /** The imported-note twin line of the use-time diagnostic. */
      function vc_importedTwin(count) {
        return count === 1
          ? "1 imported note of this item waits for the same switch."
          : `${count} imported notes of this item wait for the same switch.`;
      }

      /** The first tombstone that still owns notes — the one the banner speaks for. */
      function vc_staleTombstone(state) {
        const entry = Object.entries(state.deletedProfiles).find(
          ([, rec]) => rec.noteCount > 0,
        );
        return entry ? { id: entry[0], ...entry[1] } : null;
      }

      function VariantC() {

        // Switch Profile picker for the active note.

        const [query, setQuery] = useState("");
        const [index, setIndex] = useState(0);
        // The topmost modal: null
        //   | { kind: "delete", id }
        //   | { kind: "move", fromId, toId, options }
        //   | { kind: "switch", targetId, moveFile, includeImported }
        const [dialog, setDialog] = useState(null);

        // The scenario preset reseeds the store, so every local surface goes back to closed.
        useEffect(() => {
          setSettings(null);
          setPalette(false);
          setPicker(false);
          setDialog(null);
          setQuery("");
          setIndex(0);

        const note = activeNote(state);

        const subject = profileById(state, state.subjectProfileId);

        // Only live Profiles are offered anywhere; a deleted one is never a target.
        const choices = useMemo(() => {
          const q = query.trim().toLocaleLowerCase();
          const live = state.profiles.filter((p) => p.status === "active");
          return q
            ? live.filter((p) => p.label.toLocaleLowerCase().includes(q))
            : live;
        }, [state.profiles, query]);

        function closeTopmost() {
          if (dialog) setDialog(null);
          else if (picker) setPicker(false);
          else if (palette) setPalette(false);
          else if (settings) setSettings(null);
        }

        // Esc closes the topmost modal. The Prompt-based surfaces also close themselves; both
        // paths land on the same state, so the double handling is harmless.
        useEffect(() => {
          const onKey = (e) => {
            if (e.key !== "Escape") return;
            closeTopmost();
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        });

        function openPicker() {
          setDialog(null);
          setSettings(null);
          setPalette(false);
          setQuery("");
          setIndex(0);
          setPicker(true);
        }

        function openMove(fromId) {

        function showNotesOf(id) {
          actions.showNotes(id);
          setDialog(null);

        // --- Use-time diagnostic ------------------------------------------------

          if (!note) return;

          const result = actions.updateFromZotero(note.key, { silent: true });

        // --- Overlays -----------------------------------------------------------

        if (settings) {

          overlay = (
            <SettingsModal
              open

            >
              {settings.page === "profile" ? (
                <ProfilePage
                  profileId={settings.id}
                  onBack={() => setSettings({ page: "profiles" })}

                />
              ) : (
                <ProfilesPage
                  banner={banner}
                  onOpen={(id) => setSettings({ page: "profile", id })}
                  onDelete={(id) => setDialog({ kind: "delete", id })}
                />

        if (palette) {

              open
              onClose={() => setPalette(false)}
              items={[

                  onSelect: () => {

        if (picker) {

          overlay = (
            <Prompt

              onChange={(v) => {

              onKeyDown={(e) =>

        if (dialog?.kind === "delete") {
          const p = profileById(state, dialog.id);
          const referenced = p && p.noteCount > 0;
          overlay = (
            <Dialog
              width={470}
              title={`Delete “${p?.label}” profile?`}
              body={
                <div className="flex flex-col gap-3">

                    {referenced
                      ? `${vc_countPhrase(p)} use this profile. They keep their text and open normally. Updating them from Zotero pauses until you move them to another profile.`
                      : "No notes use this profile. Deleting it changes nothing else."}

                    >
                      Move notes first…

                  ) : null}
                </div>
              }
              actions={[
                { label: "Cancel", onClick: () => setDialog(null) },

                {

                    actions.deleteProfile(dialog.id);
                    setDialog(null);
                    setSettings({ page: "profiles" });
                  },
                },

            />
          );
        }

        if (dialog?.kind === "move") {
          // The source can be a tombstone: profileById returns it with status "deleted", and the
          // base moveNotes re-stamps its notes and drops the tombstone when it empties.
          const from = profileById(state, dialog.fromId);
          const to = profileById(state, dialog.toId);
          overlay = (
            <MoveNotesDialog
              from={from}
              to={to}
              onTo={(id) => setDialog({ ...dialog, toId: id })}
              options={dialog.options}
              onOptions={(o) => setDialog({ ...dialog, options: o })}
              onCancel={() => setDialog(null)}
              onConfirm={() => {
                const result = actions.moveNotes(dialog.fromId, dialog.toId, dialog.options);
                setDialog(null);

              title={

              intro={

          overlay = (

                    // log instead of mutating the store. The batch move from the banner is the
                    // path that really changes state.

              >

        const statusItems = (
          <div className="flex items-center gap-2">

              consent="Delete asks once and states the consequence in note words; the re-stamp itself is never silent — it happens only through a move or a switch the researcher confirms."
              answers={[
                {

                  a: "They stay as they are; updates pause; a banner and each note tell you and offer the move.",
                },

                "Open the picker (stamp link, notice button, or ⌘P). The deleted profile is not listed; the header says it is the current one.",
                "Re-open Settings and press “Move them…” on the banner to re-stamp all of them at once; the banner disappears.",
              ]}
              extras={
