        );
      }
      // --- Variant C END ---

      // --- Variant D ---
      // Variant D — Delete = move.
      // Deleting a referenced Profile IS the #904 Switch Profile consequences dialog, batched:
      // pick the target, state the consequences, re-stamp all of its notes, then drop the record.
      // A stale stamp never comes into existence, so no surface has to render one. A 10-second
      // Notice offers Undo; this prototype restores the record and says out loud that re-stamping
      // the notes back is only simulated (see vd_undo).

      function vd_label(p) {
        return p ? p.label : "Default";
      }

      /** Keyboard for the Switch Profile picker: ↑↓ move, ↵ choose, Esc close. */
      function vd_navKeys(evt, { count, index, setIndex, onChoose, onClose }) {
        if (evt.key === "ArrowDown") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index + 1) % count);
        } else if (evt.key === "ArrowUp") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index - 1 + count) % count);
        } else if (evt.key === "Enter") {
          evt.preventDefault();
          if (count > 0) onChoose(index);
        } else if (evt.key === "Escape") {
          evt.preventDefault();
          onClose();
        }
      }

      function vd_noteWord(n) {
        return n === 1 ? "note" : "notes";
      }

      /** "40 literature notes and 6 imported notes use it." — the researcher's own numbers. */
      function vd_useLine(p) {
        const notes = `${p.noteCount} literature ${vd_noteWord(p.noteCount)}`;
        if (p.importedCount > 0)
          return `${notes} and ${p.importedCount} imported ${vd_noteWord(p.importedCount)} use it.`;
        return `${notes} use it.`;
      }

      function VariantD() {
        const { state, actions } = useProtoState();

        const [settingsOpen, setSettingsOpen] = useState(false);
        const [page, setPage] = useState("profiles"); // "profiles" | profileId
        // null | { kind: "move" | "simple", id }
        const [dialog, setDialog] = useState(null);
        const [target, setTarget] = useState(null); // last active choice; Default at first
        const [options, setOptions] = useState({ moveFiles: false, includeImported: true });
        const [pickerOpen, setPickerOpen] = useState(false);
        const [pickerQuery, setPickerQuery] = useState("");
        const [pickerIndex, setPickerIndex] = useState(0);
        const [paletteOpen, setPaletteOpen] = useState(false);

        // The scenario preset reseeds the store; drop every piece of local UI state with it.
        useEffect(() => {
          setSettingsOpen(false);
          setPage("profiles");
          setDialog(null);
          setTarget(null);
          setOptions({ moveFiles: false, includeImported: true });
          setPickerOpen(false);
          setPickerQuery("");
          setPickerIndex(0);
          setPaletteOpen(false);
        }, [state.scenario]);

        function closeTopmost() {
          if (dialog) setDialog(null);
          else if (pickerOpen) setPickerOpen(false);
          else if (paletteOpen) setPaletteOpen(false);
          else if (settingsOpen) setSettingsOpen(false);
        }

        useEffect(() => {
          const onKey = (e) => {
            if (e.key !== "Escape") return;
            if (dialog || pickerOpen || paletteOpen || settingsOpen) {
              e.preventDefault();
              closeTopmost();
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        });

        const note = activeNote(state);

        // --- Delete ------------------------------------------------------------
        function openDelete(id) {
          const p = profileById(state, id);
          if (!p) return;
          if (p.noteCount === 0) {
            setDialog({ kind: "simple", id });
            return;
          }
          // Default target: Default, or the last target the researcher chose.
          const stillThere = state.profiles.some(
            (x) => x.status === "active" && x.id === target && x.id !== id,
          );
          setTarget(stillThere ? target : null);
          setOptions({ moveFiles: false, includeImported: true });
          setDialog({ kind: "move", id });
        }

        // Restores the tombstoned record. It comes back with 0 notes, because the notes really
        // did move — the base `moveNotes` re-stamps EVERY note of a Profile, so moving them back
        // would drag the target's own notes along with them. An honest Undo needs the plugin to
        // remember which notes this one deletion moved (a per-deletion record); the prototype
        // says so instead of faking it.
        function vd_undo(id, moved) {
          actions.restoreProfile(id);
          actions.notify(
            `Undo restored the profile; re-stamping back the ${moved} ${vd_noteWord(moved)} is simulated`,
          );
        }

        function confirmDelete() {
          const id = dialog.id;
          const from = profileById(state, id);
          const to = profileById(state, target);
          if (!from || !to) return;
          const strandedImported = options.includeImported ? 0 : from.importedCount;
          const result = actions.moveNotes(id, target, options);
          actions.deleteProfile(id);
          const moved = result?.moved ?? from.noteCount;
          actions.notify(
            `Deleted “${from.label}”; ${moved} ${vd_noteWord(moved)} moved to ${to.label}.`,
            { label: "Undo", onClick: () => vd_undo(id, moved) },
          );
          if (strandedImported > 0)
            actions.notify(
              `${strandedImported} imported ${vd_noteWord(strandedImported)} stayed behind on the deleted profile — leave the checkbox on to keep nothing stale.`,
            );
          setDialog(null);
          setPage("profiles");
          // The frame paints its overlay above the notices, so a settings modal left open would
          // bury the Undo button. Deletion closes settings and hands the researcher the notice.
          setSettingsOpen(false);
        }

        function confirmSimpleDelete() {
          const p = profileById(state, dialog.id);
          actions.deleteProfile(dialog.id);
          if (p) actions.notify(`Deleted “${p.label}”.`);
          setDialog(null);
          setPage("profiles");
          setSettingsOpen(false);
        }

        // --- Update from Zotero (always ok in D) + the Imported Note twin -------
        function runUpdate() {
          if (!note) {
            actions.notify("Open a literature note first.");
            return;
          }
          const profile = profileById(state, note.profileId);
          const result = actions.updateFromZotero(note.key, { silent: true });
          if (result.ok) {
            actions.notify(
              `Updated ${note.path} from Zotero under “${vd_label(profile)}”.`,
            );
            if (note.imported > 0)
              actions.notify(
                `${note.imported} imported ${vd_noteWord(note.imported)} of this item updated under “${vd_label(profile)}” too.`,
              );
          } else {
            // Unreachable in D: deletion always moves the notes first, so no stamp is ever stale.
            actions.notify(UNKNOWN_PROFILE_NOTICE(result.id));
          }
        }

        // --- Overlays -----------------------------------------------------------
        const subject = profileById(state, state.subjectProfileId);
        let overlay = null;

        if (dialog?.kind === "move") {
          const from = profileById(state, dialog.id);
          const to = profileById(state, target);
          const keepsFile = from?.document && from.document.includes("/");
          overlay = (
            <MoveNotesDialog
              from={from}
              to={to}
              onTo={setTarget}
              options={options}
              onOptions={setOptions}
              onConfirm={confirmDelete}
              onCancel={() => setDialog(null)}
              title={`Delete “${from.label}” profile?`}
              cta={`Delete and move ${from.noteCount} ${vd_noteWord(from.noteCount)}`}
              ctaDestructive
              intro={
                <div className="flex flex-col gap-2">
                  <p className="leading-relaxed">
                    {vd_useLine(from)} Choose the profile they move to.
                  </p>
                  <p className="text-muted leading-relaxed">
                    {keepsFile
                      ? `The template file ${from.document} stays in your vault.`
                      : "This profile has no template document of its own; nothing leaves your vault."}
                  </p>
                  {from.importedCount > 0 && !options.includeImported ? (
                    <p className="text-danger leading-relaxed">
                      Leaving them behind strands {from.importedCount} imported{" "}
                      {vd_noteWord(from.importedCount)} on a profile that no longer exists.
                    </p>
                  ) : null}
                </div>
              }
            />
          );
        } else if (dialog?.kind === "simple") {
          const p = profileById(state, dialog.id);
          overlay = (
            <Dialog
              title={`Delete “${p.label}” profile?`}
              body="No notes use it."
              actions={[
                { label: "Cancel", onClick: () => setDialog(null) },
                { label: "Delete profile", onClick: confirmSimpleDelete, destructive: true },
              ]}
            />
          );
        } else if (pickerOpen) {
          const q = pickerQuery.trim().toLocaleLowerCase();
          const choices = state.profiles.filter(
            (p) => p.status === "active" && p.label.toLocaleLowerCase().includes(q),
          );
          const tombstones = Object.entries(state.deletedProfiles);
          const choose = (i) => {
            const p = choices[i];
            if (!p) return;
            if (note && p.id === (note.profileId ?? null)) {
              actions.notify(`This note already uses “${p.label}”.`);
            } else {
              actions.notify(
                `Switching one note to “${p.label}” is the same consequences dialog, unbatched (ticket #904); this prototype only shows the batched one.`,
              );
            }
            setPickerOpen(false);
          };
          overlay = (
            <Prompt
              placeholder="Choose a profile…"
              value={pickerQuery}
              onChange={(v) => {
                setPickerQuery(v);
                setPickerIndex(0);
              }}
              onKeyDown={(e) =>
                vd_navKeys(e, {
                  count: choices.length,
                  index: pickerIndex,
                  setIndex: setPickerIndex,
                  onChoose: choose,
                  onClose: () => setPickerOpen(false),
                })
              }
              instructions={[
                { command: "↑↓", purpose: "to navigate" },
                { command: "↵", purpose: "to choose" },
                { command: "esc", purpose: "to dismiss" },
              ]}
            >
              {choices.map((p, i) => (
                <SuggestRow
                  key={p.label}
                  selected={i === pickerIndex}
                  onClick={() => choose(i)}
                  title={p.label}
                  note={PROFILE_DISPLAY(p)}
                  aside={`${p.noteCount} notes`}
                  badge={note && p.id === (note.profileId ?? null) ? "current" : null}
                />
              ))}
              {tombstones.length ? (
                <div className="text-muted border-line mt-2 border-t px-3 pt-2 text-[12px] leading-relaxed">
                  {tombstones.map(([id, rec]) => (
                    <div key={id}>
                      “{rec.label}” was deleted; its notes already moved, so it never appears in
                      this list.
                    </div>
                  ))}
                </div>
              ) : null}
            </Prompt>
          );
        } else if (paletteOpen) {
          overlay = (
            <CommandPalette
              open
              onClose={() => setPaletteOpen(false)}
              items={[
                {
                  label: "Open settings → Literature note profiles",
                  onSelect: () => {
                    setPaletteOpen(false);
                    setPage("profiles");
                    setSettingsOpen(true);
                  },
                },
                {
                  label: "Update literature note from Zotero",
                  onSelect: () => {
                    setPaletteOpen(false);
                    runUpdate();
                  },
                },
                {
                  label: "Switch literature note profile…",
                  onSelect: () => {
                    setPaletteOpen(false);
                    setPickerQuery("");
                    setPickerIndex(0);
                    setPickerOpen(true);
                  },
                },
              ]}
            />
          );
        } else if (settingsOpen) {
          overlay = (
            <SettingsModal
              open
              onClose={() => setSettingsOpen(false)}
              title={
                page === "profiles"
                  ? "Literature note profiles"
                  : (profileById(state, page)?.label ?? "Profile")
              }
            >
              {page === "profiles" ? (
                <ProfilesPage onDelete={openDelete} onOpen={(id) => setPage(id)} />
              ) : (
                <ProfilePage
                  profileId={page}
                  onBack={() => setPage("profiles")}
                  onDelete={openDelete}
                />
              )}
            </SettingsModal>
          );
        }

        const statusItems = (
          <div className="flex items-center gap-2">
            <button
              type="button"
              className="border-line text-ink cursor-pointer rounded border px-2 py-[2px]"
              onClick={() => {
                setPage("profiles");
                setSettingsOpen(true);
              }}
            >
              Settings
            </button>
            <button
              type="button"
              className="border-line text-muted cursor-pointer rounded border px-2 py-[2px]"
              onClick={() => setPaletteOpen(true)}
            >
              ⌘P
            </button>
            <button
              type="button"
              className="border-line text-muted cursor-pointer rounded border px-2 py-[2px]"
              onClick={runUpdate}
            >
              Update from Zotero
            </button>
          </div>
        );

        return (
          <div className="grid h-full" style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}>
            <ObsidianFrame
              title="ZotLit — delete = move"
              statusItems={statusItems}
              overlay={overlay}
              stampRender={(n, info) => <DefaultStamp info={info} />}
            />
            <Rail
              thesis="Deleting a profile is moving its notes; the delete dialog is the Switch Profile dialog, batched, and nothing is ever stale."
              consent="Every deletion that touches notes is a consented re-stamp: the target, the folder move, the imported notes and the re-render are stated before the button is pressed."
              answers={[
                {
                  q: "What happens to my forty notes?",
                  a: "They move to the profile you pick, in the same dialog, with the consequences stated.",
                },
                {
                  q: "Can I still update them?",
                  a: "Yes — under the new profile; the managed part re-renders on the next update, text outside stays.",
                },
                {
                  q: "How do I get it back?",
                  a: "Undo in the notice for 10 s; after that: Add profile, point it at the kept template file, switch notes back.",
                },
              ]}
              steps={[
                "Open Settings from the status bar (or ⌘P → “Open settings → Literature note profiles”).",
                `Press the trash icon on “${subject?.label ?? "the subject profile"}” — the delete dialog IS the Switch Profile dialog, batched.`,
                "Change the target, toggle “Move files to …/” and “Also move N imported notes”; the consequence line follows the target.",
                "Press “Delete and move N notes”. Watch the state table: the target gains the notes, the record leaves.",
                "Press “Update literature note from Zotero” on the note — it works, under the new profile, and the imported notes report in their own notice.",
                "Open “Switch literature note profile…”: the deleted profile is not in the list, because it has no notes left to point at it.",
                "Press Undo in the notice: it restores the profile record only. Re-stamping the notes back is SIMULATED — the real Undo needs the plugin to remember which notes this deletion moved (a per-deletion record); without it, moving back would drag the target's own notes along.",
                "Delete “Scratch” (0 notes) for the other branch: a plain confirm, no target, no consequences.",
              ]}
              extras={
                <div className="text-muted leading-relaxed">
                  <p>
                    The stamp is always{" "}
                    <span className="text-ink">DefaultStamp</span> with an active profile — D
                    never produces a stale one.
                  </p>
                  <p className="mt-2">
                    The template document file survives the deletion: the file tree keeps{" "}
                    <span className="text-ink font-mono text-[11px]">
                      {subject?.document ?? "its template"}
                    </span>
                    .
                  </p>
                </div>
              }
            />
          </div>
        );
      }
      // --- Variant D END ---

      // --- Variant E ---
      // Variant E — Retire: a tombstone that cleans itself up.
      // Deleting a Profile that notes still point at RETIRES it. The record stays alive for the
      // notes that remember it (they render and update exactly as before) and leaves every
      // surface that offers a Profile for new work. It is restorable with one click, and it
      // removes itself the moment its last note moves away. A Profile nobody points at is
      // deleted outright, with a one-line confirm.

      /** "12 literature notes and 3 imported notes" — the researcher's own situation, in words. */
      function ve_uses(profile) {
        const notes = `${profile.noteCount} literature note${profile.noteCount === 1 ? "" : "s"}`;
        if (!profile.importedCount) return notes;
        const imported = `${profile.importedCount} imported note${
          profile.importedCount === 1 ? "" : "s"
        }`;
        return `${notes} and ${imported}`;
      }

      function ve_notesLabel(count) {
        return `${count} note${count === 1 ? "" : "s"}`;
      }

      /** Keyboard for every Prompt: ↑↓ move, ↵ choose, Esc close. */
      function ve_navKeys(evt, { count, index, setIndex, onChoose, onClose }) {
        if (evt.key === "ArrowDown") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index + 1) % count);
        } else if (evt.key === "ArrowUp") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index - 1 + count) % count);
        } else if (evt.key === "Enter") {
          evt.preventDefault();
          if (count > 0) onChoose(index);
        } else if (evt.key === "Escape") {
          evt.preventDefault();
          onClose();
        }
      }

      /** A settings row for the Retired group: greyed name, the same description line, actions. */
      function ve_RetiredRow({ profile, onRestore, onMove, onDelete }) {
        return (
          <div className="border-line flex items-center gap-4 border-b py-3">
            <div className="min-w-0 flex-1">
              <div className="text-muted text-[14px]">{profile.label}</div>
              <div className="text-muted mt-[2px] truncate font-mono text-[11px]">
                {PROFILE_DISPLAY(profile)}
              </div>
            </div>
            <div className="flex shrink-0 items-center gap-2">
              <Pill tone="muted">{ve_notesLabel(profile.noteCount)}</Pill>
              <button
                onClick={onRestore}
                className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[4px] text-[12px]"
              >
                Restore
              </button>
              <button
                onClick={onMove}
                className="border-line bg-ground text-ink cursor-pointer rounded border px-2 py-[4px] text-[12px]"
              >
                Move notes…
              </button>
              <button
                onClick={onDelete}
                className="border-line bg-ground cursor-pointer rounded border px-2 py-[4px] text-[12px]"
                style={{ color: "var(--muted)" }}
              >
                Delete anyway
              </button>
            </div>
          </div>
        );
      }

      function VariantE() {
        const { state, actions } = useProtoState();

        // Settings surface: closed, the Profiles list, or one Profile's page.
        const [settingsOpen, setSettingsOpen] = useState(false);
        const [pageId, setPageId] = useState(null);
        // Confirmations: { kind: "retire" | "delete-empty" | "delete-anyway", id }
        const [dialog, setDialog] = useState(null);
        // Batch move: { fromId, mode: "and-delete" | "retired", toId, options }
        const [move, setMove] = useState(null);
        // Modeless overlays: null | "palette" | "switch"
        const [surface, setSurface] = useState(null);
        const [query, setQuery] = useState("");
        const [index, setIndex] = useState(0);

        // The scenario preset reseeds the store, so every local surface goes back to rest.
        useEffect(() => {
          setSettingsOpen(false);
          setPageId(null);
          setDialog(null);
          setMove(null);
          setSurface(null);
          setQuery("");
          setIndex(0);
        }, [state.scenario]);

        const note = activeNote(state);
        const noteInfo = stampLabel(state, note);
        const subject = profileById(state, state.subjectProfileId);
        const retired = state.profiles.filter((p) => p.status === "retired");

        function closeTop() {
          if (move) return setMove(null);
          if (dialog) return setDialog(null);
          if (surface) {
            setSurface(null);
            setQuery("");
            setIndex(0);
            return;
          }
          if (pageId) return setPageId(null);
          if (settingsOpen) return setSettingsOpen(false);
        }

        // Esc closes the topmost modal. The Prompts handle their own Esc while focused; this
        // covers the dialogs and the settings modal, which have no text field.
        useEffect(() => {
          const onKey = (e) => {
            if (e.key !== "Escape") return;
            if (!(move || dialog || surface || settingsOpen)) return;
            e.preventDefault();
            closeTop();
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        });

        // --- The delete gesture ------------------------------------------------
        // A Profile no note points at is deleted outright; a used one is offered retirement.
        function requestDelete(id) {
          const p = profileById(state, id);
          if (!p) return;
          setDialog({ kind: p.noteCount === 0 ? "delete-empty" : "retire", id });
        }

        function openMove(fromId, mode) {
          setMove({ fromId, mode, toId: null, options: { moveFiles: false, includeImported: true } });
          setDialog(null);
        }

        function confirmMove() {
          const from = profileById(state, move.fromId);
          const to = profileById(state, move.toId);
          if (!from || !to) return;
          const label = from.label;
          const moved = from.noteCount;
          actions.moveNotes(from.id, to.id, move.options);
          if (move.mode === "and-delete") {
            actions.deleteProfile(from.id);
            actions.notify(
              `Moved ${ve_notesLabel(moved)} to “${to.label}” and deleted “${label}”`,
            );
          } else {
            actions.notify(
              `Moved ${ve_notesLabel(moved)} to “${to.label}”; “${label}” is gone now that no note uses it`,
            );
          }
          setMove(null);
          setPageId(null);
        }

        // --- Use time: a retired Profile updates like any other ------------------
        function updateActiveNote() {
          if (!note) return;
          const result = actions.updateFromZotero(note.key);
          if (note.imported > 0) {
            const one = note.imported === 1;
            const twin = `${note.imported} imported note${one ? "" : "s"}`;
            actions.notify(
              result.ok
                ? `Updated ${twin} of ${note.key} from Zotero`
                : `${twin} of ${note.key} ${one ? "uses" : "use"} the same unknown profile and ${
                    one ? "was" : "were"
                  } left alone`,
            );
          }
          setSurface(null);
        }

        // --- Overlays ------------------------------------------------------------
        const switchTargets = state.profiles.filter((p) => p.status === "active");
        const switchHits = switchTargets.filter((p) =>
          p.label.toLocaleLowerCase().includes(query.trim().toLocaleLowerCase()),
        );

        function chooseSwitchTarget(i) {
          const target = switchHits[i];
          if (!target || !note) return;
          actions.notify(`Switched ${note.path} to “${target.label}”`);
          setSurface(null);
          setQuery("");
          setIndex(0);
        }

        let prompt = null;
        if (surface === "palette") {
          prompt = (
            <CommandPalette
              open
              onClose={() => setSurface(null)}
              items={[
                {
                  label: "Open settings → Literature note profiles",
                  onSelect: () => {
                    setSettingsOpen(true);
                    setPageId(null);
                    setSurface(null);
                  },
                },
                {
                  label: "Update literature note from Zotero",
                  onSelect: updateActiveNote,
                },
                {
                  label: "Switch literature note profile…",
                  onSelect: () => {
                    setSurface("switch");
                    setQuery("");
                    setIndex(0);
                  },
                },
              ]}
            />
          );
        } else if (surface === "switch") {
          prompt = (
            <Prompt
              placeholder="Choose a profile…"
              value={query}
              onChange={(v) => {
                setQuery(v);
                setIndex(0);
              }}
              onKeyDown={(e) =>
                ve_navKeys(e, {
                  count: switchHits.length,
                  index,
                  setIndex,
                  onChoose: chooseSwitchTarget,
                  onClose: () => setSurface(null),
                })
              }
              header={
                <div className="text-muted px-4 py-2 text-[12px]">
                  Current: {noteInfo ? noteInfo.label : "—"}
                  {noteInfo && noteInfo.status !== "active"
                    ? ` (${noteInfo.status})`
                    : ""}
                </div>
              }
              instructions={[
                { command: "↑↓", purpose: "to navigate" },
                { command: "↵", purpose: "to choose" },
                { command: "esc", purpose: "to dismiss" },
              ]}
            >
              {switchHits.map((p, i) => (
                <SuggestRow
                  key={p.id ?? "default"}
                  selected={i === index}
                  onClick={() => chooseSwitchTarget(i)}
                  title={p.label}
                  note={PROFILE_DISPLAY(p)}
                  badge={note && p.id === note.profileId ? "current" : null}
                />
              ))}
            </Prompt>
          );
        }

        let dialogNode = null;
        if (dialog) {
          const p = profileById(state, dialog.id);
          if (p && dialog.kind === "retire") {
            dialogNode = (
              <Dialog
                width={480}
                title={`Retire “${p.label}” profile?`}
                body={`${ve_uses(p)} use it. They keep updating exactly as before. “${p.label}” leaves the profile list for new notes and stays here as retired until its last note moves.`}
                actions={[
                  { label: "Cancel", onClick: () => setDialog(null) },
                  {
                    label: "Move notes and delete…",
                    onClick: () => openMove(p.id, "and-delete"),
                  },
                  {
                    label: "Retire",
                    cta: true,
                    onClick: () => {
                      actions.retireProfile(p.id);
                      setDialog(null);
                      setPageId(null);
                    },
                  },
                ]}
              />
            );
          } else if (p && dialog.kind === "delete-empty") {
            dialogNode = (
              <Dialog
                title={`Delete “${p.label}” profile?`}
                body="No notes use it."
                actions={[
                  { label: "Cancel", onClick: () => setDialog(null) },
                  {
                    label: "Delete",
                    destructive: true,
                    onClick: () => {
                      actions.deleteProfile(p.id);
                      setDialog(null);
                      setPageId(null);
                    },
                  },
                ]}
              />
            );
          } else if (p && dialog.kind === "delete-anyway") {
            dialogNode = (
              <Dialog
                width={470}
                title={`Delete “${p.label}” anyway?`}
                body={`Its ${ve_notesLabel(p.noteCount)} keep their text and open normally. Update from Zotero pauses for them until you move them to another profile.`}
                actions={[
                  { label: "Cancel", onClick: () => setDialog(null) },
                  {
                    label: "Delete anyway",
                    destructive: true,
                    onClick: () => {
                      actions.deleteProfile(p.id);
                      setDialog(null);
                      setPageId(null);
                    },
                  },
                ]}
              />
            );
          }
        }

        if (move) {
          const from = profileById(state, move.fromId);
          const targets = state.profiles.filter(
            (p) => p.status === "active" && p.id !== move.fromId,
          );
          const to =
            profileById(state, move.toId) ??
            targets.find((p) => p.id === null) ??
            targets[0] ??
            null;
          if (from && to) {
            dialogNode = (
              <MoveNotesDialog
                from={from}
                to={to}
                onTo={(id) => setMove({ ...move, toId: id })}
                options={move.options}
                onOptions={(options) => setMove({ ...move, options })}
                onConfirm={() => confirmMove()}
                onCancel={() => setMove(null)}
                title={
                  move.mode === "and-delete"
                    ? `Move ${ve_notesLabel(from.noteCount)} and delete “${from.label}”`
                    : `Move ${ve_notesLabel(from.noteCount)} from “${from.label}”`
                }
                cta={
                  move.mode === "and-delete"
                    ? "Move and delete"
                    : `Move ${ve_notesLabel(from.noteCount)}`
                }
                intro={
                  move.mode === "and-delete" ? (
                    <p className="leading-relaxed">
                      “{from.label}” goes away as soon as its notes are somewhere else.
                    </p>
                  ) : (
                    <p className="leading-relaxed">
                      “{from.label}” disappears by itself once its last note has moved.
                    </p>
                  )
                }
              />
            );
          }
        }

        // --- Settings ------------------------------------------------------------
        const retiredSection = retired.length ? (
          <div className="mt-6">
            <div className="text-muted mb-1 text-[11px] font-semibold tracking-[0.08em] uppercase">
              Retired
            </div>
            <div className="text-muted mb-2 text-[12px] leading-relaxed">
              A retired profile disappears when its last note moves.
            </div>
            {retired.map((p) => (
              <div key={p.id}>
                {ve_RetiredRow({
                  profile: p,
                  onRestore: () => actions.restoreProfile(p.id),
                  onMove: () => openMove(p.id, "retired"),
                  onDelete: () => setDialog({ kind: "delete-anyway", id: p.id }),
                })}
              </div>
            ))}
          </div>
        ) : null;

        const pageProfile = pageId ? profileById(state, pageId) : null;

        const settingsNode = (
          <SettingsModal
            open={settingsOpen}
            onClose={() => {
              setSettingsOpen(false);
              setPageId(null);
            }}
            title={
              pageProfile ? `Profile — ${pageProfile.label}` : "Literature note profiles"
            }
          >
            {pageProfile ? (
              <ProfilePage
                profileId={pageId}
                onBack={() => setPageId(null)}
                onDelete={requestDelete}
                footer={
                  pageProfile.status === "retired" ? (
                    <div className="flex items-center gap-2">
                      <Pill tone="muted">retired</Pill>
                      <button
                        onClick={() => actions.restoreProfile(pageProfile.id)}
                        className="border-line bg-ground text-ink cursor-pointer rounded border px-3 py-[6px] text-[13px]"
                      >
                        Restore
                      </button>
                      <button
                        onClick={() => openMove(pageProfile.id, "retired")}
                        className="border-line bg-ground text-ink cursor-pointer rounded border px-3 py-[6px] text-[13px]"
                      >
                        Move notes…
                      </button>
                      <button
                        onClick={() =>
                          setDialog({ kind: "delete-anyway", id: pageProfile.id })
                        }
                        className="border-line bg-ground cursor-pointer rounded border px-3 py-[6px] text-[13px]"
                        style={{ color: "var(--muted)" }}
                      >
                        Delete anyway
                      </button>
                    </div>
                  ) : null
                }
              />
            ) : (
              <ProfilesPage
                onDelete={requestDelete}
                onOpen={(id) => setPageId(id)}
                retiredSection={retiredSection}
              />
            )}
          </SettingsModal>
        );

        // The frame dims the window whenever `overlay` is not null, so an empty stack stays null.
        const overlay = !(settingsOpen || prompt || dialogNode) ? null : (
          <>
            {settingsOpen ? settingsNode : null}
            {prompt}
            {dialogNode ? (
              <div
                className="absolute inset-0 flex items-center justify-center"
                style={{ background: "rgba(0,0,0,0.28)" }}
              >
                {dialogNode}
              </div>
            ) : null}
          </>
        );

        const statusItems = (
          <div className="flex items-center gap-2">
            <button
              type="button"
              className="border-line text-ink hover:bg-ground-2 cursor-pointer rounded border px-2 py-[2px]"
              onClick={() => {
                setSettingsOpen(true);
                setPageId(null);
              }}
            >
              Settings
            </button>
            <button
              type="button"
              className="border-line text-muted hover:bg-ground-2 cursor-pointer rounded border px-2 py-[2px]"
              onClick={() => {
                setSurface("palette");
                setQuery("");
                setIndex(0);
              }}
            >
              ⌘P
            </button>
            <button
              type="button"
              className="border-line text-muted hover:bg-ground-2 cursor-pointer rounded border px-2 py-[2px]"
              onClick={updateActiveNote}
            >
              Update from Zotero
            </button>
          </div>
        );

        const subjectLabel = subject ? subject.label : "this profile";

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              title={activeNote(state)?.path.split("/").pop() ?? "No file open"}
              statusItems={statusItems}
              overlay={overlay}
              stampRender={(n, info) =>
                info ? (
                  <span className="inline-flex flex-wrap items-center gap-2">
                    <span>{info.label}</span>
                    <span className="text-muted font-mono text-[11px] break-all">
                      {info.secondary}
                    </span>
                    {info.status === "retired" ? (
                      <Pill tone="muted">retired</Pill>
                    ) : info.status === "deleted" ? (
                      <Pill tone="danger">deleted profile</Pill>
                    ) : null}
                  </span>
                ) : null
              }
            />
            <Rail
              thesis="A profile cannot really be gone while notes remember it, so deleting a used profile retires it: invisible to new notes, alive for old ones, restorable, and gone by itself when the last note leaves."
              consent="Retiring asks for nothing beyond the retire dialog, because no note changes; consent is only asked for the move, where the notes do change."
              answers={[
                {
                  q: "What happens to my forty notes?",
                  a: "Nothing happens to them; retire now, move them whenever you like, or move and delete in one step.",
                },
                {
                  q: "Can I still update them?",
                  a: "Yes, unchanged — a retired profile still renders its notes.",
                },
                {
                  q: "How do I get it back?",
                  a: "Restore, one click, as long as any note still uses it.",
                },
              ]}
              steps={[
                `Open Settings and find “${subjectLabel}” in the profiles list.`,
                "Press its trash icon: the dialog offers Retire, or Move notes and delete.",
                "Choose Retire. The row leaves the list and comes back under “Retired”.",
                "Open the note and read its Properties: the stamp says the name with a muted “retired” pill.",
                "Run “Update literature note from Zotero”: it updates, and says nothing about the profile.",
                "Open “Switch literature note profile…”: the retired profile is not a target; the header states it as the current one.",
                "In Settings, press Restore on the retired row to bring it straight back, or Move notes… to empty it and let it disappear.",
                "Press “Delete anyway” to see the stale state this design exists to avoid.",
              ]}
              extras={
                <p className="text-muted leading-relaxed">
                  Creation never offers a retired profile: the informed picker of #904
                  lists targets for new notes, and a retired profile is not one.
                </p>
              }
            />
          </div>
        );
      }
      // --- Variant E END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Baseline (today)", component: VariantA },
        { key: "B", name: "Refuse while referenced", component: VariantB },
        { key: "C", name: "Delete, visibly stale", component: VariantC },
        { key: "D", name: "Delete = move", component: VariantD },
        { key: "E", name: "Retire (self-cleaning)", component: VariantE },
      ];

      const SCENARIO_PRESETS = [
        { id: "fold", label: "Fold: Book chapters → Default (40)" },
        { id: "retire", label: "Retire: Thesis (12 · 3 imported)" },
        { id: "oops", label: "Oops: Articles deleted by mistake (23)" },
      ];

      function App() {
        const { state } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        return (
          <div className="h-screen bg-ground text-ink font-body flex flex-col">
            <div
              style={{
                flex: "none",
                background: "#1e293b",
                color: "#f8fafc",
                padding: "0.4rem 1rem",
                display: "flex",
                alignItems: "center",
                gap: "1rem",
                fontSize: "0.875rem",
                zIndex: 9999,
              }}
            >
              <button
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={{
                  background: "none",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  fontSize: "1.25rem",
                }}
              >
                ←
              </button>
              <span>
                {V.key} — {V.name}
              </span>
              <button
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={{
                  background: "none",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  fontSize: "1.25rem",
                }}
              >
                →
              </button>
              <span
                style={{
                  width: "1px",
                  alignSelf: "stretch",
                  background: "rgba(248,250,252,0.25)",
                }}
              />
              {SCENARIO_PRESETS.map((p) => (
                <button
                  key={p.id}
                  onClick={() => actions.setScenario(p.id)}
                  style={{
                    background:
                      state.scenario === p.id ? "#f8fafc" : "transparent",
                    color: state.scenario === p.id ? "#1e293b" : "inherit",
                    border: "1px solid rgba(248,250,252,0.25)",
                    borderRadius: "9999px",
                    padding: "0.15rem 0.6rem",
                    cursor: "pointer",
                    fontSize: "0.75rem",
                    whiteSpace: "nowrap",
                  }}
                >
                  {p.label}
                </button>
              ))}
            </div>
            <div className="min-h-0 flex-1">
              <V.component />
            </div>
          </div>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
