<!doctype html>
<!--
  Prototype — Profile deletion from the academic user side (ticket #911, map #835)

  VERDICT (2026-08-29)
  Winner: D — "Delete = move". Chosen by the user; no rationale was given with the pick.
  The full five-variant gallery is docs/research/issue-911-profile-deletion-gallery.html on
  the prototype/profile-deletion branch; this file keeps only the winner.

  DESIGN QUESTION
  A Literature Note Profile goes away while notes still carry its stamp. What does the
  academic user experience at that moment, and which deletion semantics follow from that
  experience — not from the current settings dialog?

  FIRST PRINCIPLES (academic user)
  A Profile is "a kind of note" to the researcher: folder + citation style + look. A note is
  their durable work; forty notes outlive any configuration. The stamp is a pointer from the
  durable thing to the configuration, so deleting the configuration leaves a dangling pointer.
  The classic resolutions are the same three every system has: RESTRICT (refuse),
  SET DEFAULT / re-point (move), or soft delete (tombstone).

  Three researchers, three questions — the scenario presets of this prototype:
    1. FOLD    "Book chapters" (40 notes, 6 Imported Notes) folds back into Default.
               "What happens to my forty notes?"            → intent is a MOVE.
    2. RETIRE  "Thesis" (12 notes, 3 Imported Notes) after graduating.
               "Can I still update them, if I ever need to?" → intent is ARCHIVE.
    3. OOPS    "Articles" (23 notes) deleted by mistake while tidying settings.
               "How do I get it back?"                       → intent is UNDO.
  Consequences:
    a. Nobody wants a note that "cannot update". A stale stamp is a state the plugin invents.
       If it must exist it has to be harmless at rest and speak only at use time, in the
       researcher's words, with the fix one click away.
    b. "Recreate the profile with the same ID" is not in the researcher's vocabulary and is not
       doable by hand (UUID). Recovery must be a button, not an instruction.
    c. "Never change a note's appearance silently" makes folding 40 notes into Default a
       consented re-stamp with the consequences stated — #904's Switch Profile dialog, batched.
    d. Obsidian's own idioms (delete a file, delete a folder, disable a plugin) never refuse;
       all are reversible and show the consequence where the user meets it.
    e. The count turns an abstract warning into the researcher's own situation, and the search
       query ["zotlit-profile":<id>] is the researcher-facing "show these notes".
    f. Six surfaces every variant renders: the settings Profiles list, the delete dialog, the
       note Properties stamp, "Update from Zotero" on that note, and the Switch Profile picker.

  VARIANTS
    A  Baseline (today)          — one confirm dialog, no count, no consequence; the stale stamp
                                   renders as a raw UUID; "Update from Zotero" fails with the
                                   current notice; recovery: none in the UI.
    B  Refuse while referenced   — the dialog names the count and offers "Show these notes" and
                                   "Move 40 notes to…"; Delete stays disabled until the count is
                                   0; a 0-note Profile deletes at once. Nothing is ever stale.
    C  Delete, visibly stale     — the dialog names the count and the consequence in note words;
                                   afterwards a banner on the Profiles page, a danger pill on the
                                   stamp, and a use-time notice carrying "Switch profile…".
    D  Delete = move             — the dialog IS the batched Switch Profile consequences dialog;
                                   CTA "Delete and move 40 notes"; a Notice offers Undo. No stale
                                   state exists; the template document is never deleted.
    E  Retire (self-cleaning)    — deleting a referenced Profile retires it: out of the pickers,
                                   notes keep updating, greyed in settings under "Retired · 40
                                   notes" with Restore / Move notes to… / Delete anyway. It
                                   disappears by itself when the last note leaves.
-->

    <div id="root"></div>

    <!-- Diagram sources go here: one <script type="text/mermaid" id="..."> per diagram. -->

    <script type="text/jsx" id="app">
      import React, {
        useState,
        useEffect,
        useMemo,
        useRef,
        useSyncExternalStore,
      } from "react";
      import { createRoot } from "react-dom/client";
      import {
        Search,
        ChevronDown,
        ChevronRight,
        FolderOpen,
        FileText,
        Files,
        Bookmark,
        PanelLeft,
        Settings,
        HelpCircle,
        X,
        Plus,
        Trash2,
        RotateCcw,
        ArrowRight,
        ArrowLeft,
        AlertTriangle,
        Archive,
      } from "lucide-react"; // any lucide icon; <Search size={16} className="text-muted" />


      // --- Diagram ---
      // Diagrams are authored as <script type="text/mermaid" id="..."> blocks in the body —
      // plain text, no escaping — and rendered with <Diagram src="thatId" />. Indentation is
      // stripped, so the block can sit at whatever depth reads well. beautiful-mermaid loads
      // on first mount, so a page with no diagram never fetches it; bg/fg are var() so
      // diagrams follow the theme instead of re-rendering.
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---


      // --- Shared ---
      // The prototype store: one module-level object, a listener set, and useSyncExternalStore.
      // Variants never receive props — they read `useProtoState()` and call `actions`.

      const ART = "3f1c8a52-9d47-4b6e-8c21-5a0e7d94b311";
      const BOOK = "a72e4d19-6c58-4f03-9b7d-1e83c6a2f450";
      const THESIS = "d5b90c37-2a14-4e8f-b6c9-70f1d8e34a26";
      const SCRATCH = "6c02f8b4-51de-4a97-83f0-9b2e47c1da85";

      const ALL_PROFILES = [
        {
          id: null,
          label: "Default",
          folder: "literatures",
          style: "Built-in default",
          document: "Built-in template",
          noteCount: 118,
          importedCount: 12,
          status: "active",
        },
        {
          id: ART,
          label: "Articles",
          folder: "literatures/articles",
          style: "apa",
          document: "templates/articles.md",
          noteCount: 23,
          importedCount: 4,
          status: "active",
        },
        {
          id: BOOK,
          label: "Book chapters",
          folder: "literatures/book-chapters",
          style: "chicago-note",
          document: "templates/book-chapter.md",
          noteCount: 40,
          importedCount: 6,
          status: "active",
        },
        {
          id: THESIS,
          label: "Thesis",
          folder: "projects/thesis/reading",
          style: "chicago-author-date",
          document: null, // bindings-only Profile: no template document
          noteCount: 12,
          importedCount: 3,
          status: "active",
        },
        {
          id: SCRATCH,
          label: "Scratch",
          folder: "inbox",
          style: "Built-in default",
          document: "Built-in template",
          noteCount: 0,
          importedCount: 0,
          status: "active",
        },
      ];

      // ~4 sample notes per Profile. The counts on the Profile records are the truth; this
      // list is only what the file tree, the search pane and the readout can show.
      const SAMPLE_NOTES = [
        { key: "kuhnStructure1962", title: "The structure of scientific revolutions", profileId: null, imported: 2 },
        { key: "latourLaboratory1979", title: "Laboratory life", profileId: null, imported: 0 },
        { key: "popperLogic1959", title: "The logic of scientific discovery", profileId: null, imported: 1 },
        { key: "mertonNormative1973", title: "The normative structure of science", profileId: null, imported: 0 },

        { key: "smithCitation2021", title: "Citation practices in the digital humanities", profileId: ART, imported: 1 },
        { key: "garciaOpenAccess2022", title: "Open access and the long tail of citation", profileId: ART, imported: 0 },
        { key: "nakamuraPeerReview2020", title: "Peer review at scale", profileId: ART, imported: 2 },
        { key: "olsenPreprint2023", title: "Preprints and the speed of correction", profileId: ART, imported: 0 },

        { key: "smithChapter2021", title: "Reading machines: a chapter on distant reading", profileId: BOOK, imported: 2 },
        { key: "weberBureaucracy1978", title: "Bureaucracy, chapter 11", profileId: BOOK, imported: 0 },
        { key: "ecoOpenWork1989", title: "The poetics of the open work", profileId: BOOK, imported: 1 },
        { key: "bourdieuField1993", title: "The field of cultural production", profileId: BOOK, imported: 0 },

        { key: "arendtCondition1958", title: "The human condition", profileId: THESIS, imported: 1 },
        { key: "foucaultArchaeology1969", title: "The archaeology of knowledge", profileId: THESIS, imported: 0 },
        { key: "harawaySituated1988", title: "Situated knowledges", profileId: THESIS, imported: 1 },
        { key: "stengersCosmopolitics2010", title: "Cosmopolitics I", profileId: THESIS, imported: 0 },
      ];

      const SCENARIOS = {
        fold: { subjectProfileId: BOOK, activeNoteKey: "smithChapter2021" },
        retire: { subjectProfileId: THESIS, activeNoteKey: "arendtCondition1958" },
        oops: { subjectProfileId: ART, activeNoteKey: "smithCitation2021" },
      };

      function stamp() {
        const d = new Date();
        return [d.getHours(), d.getMinutes(), d.getSeconds()]
          .map((n) => String(n).padStart(2, "0"))
          .join(":");
      }

      function folderOf(profiles, id) {
        const p = profiles.find((x) => x.id === (id ?? null));
        return p ? p.folder : "literatures";
      }

      function seed(scenario) {
        const preset = SCENARIOS[scenario] ?? SCENARIOS.fold;
        const profiles = ALL_PROFILES.map((p) => ({ ...p }));
        return {
          scenario,
          subjectProfileId: preset.subjectProfileId,
          profiles,
          deletedProfiles: {},
          notes: SAMPLE_NOTES.map((n) => ({
            ...n,
            path: `${folderOf(profiles, n.profileId)}/${n.key}.md`,
          })),
          activeNoteKey: preset.activeNoteKey,
          search: null,
          notices: [],
          log: [],
        };
      }

      let state = seed("fold");
      const listeners = new Set();

      function subscribe(fn) {
        listeners.add(fn);
        return () => listeners.delete(fn);
      }

      function getSnapshot() {
        return state;
      }

      function setState(next) {
        state = next;
        for (const fn of listeners) fn();
      }

      function logged(next, text) {
        return {
          ...next,
          log: [{ t: stamp(), text }, ...next.log].slice(0, 40),
        };
      }

      export function useProtoState() {
        const snapshot = useSyncExternalStore(subscribe, getSnapshot);
        return { state: snapshot, actions };
      }

      // Looks in the live Profiles first, then in the tombstones — a deleted record comes
      // back with status "deleted" so every surface can render it without special-casing.
      export function profileById(s, id) {
        const live = s.profiles.find((p) => p.id === (id ?? null));
        if (live) return live;
        const gone = s.deletedProfiles[id];
        if (gone) return { ...gone, id, status: "deleted" };
        return null;
      }

      export function stampLabel(s, note) {
        if (!note) return null;
        const p = profileById(s, note.profileId);
        if (!p)
          return {
            label: "Unknown profile",
            secondary: note.profileId,
            status: "deleted",
          };
        return {
          label: p.label,
          secondary: p.id ?? "(built-in default)",
          status: p.status,
        };
      }

      export function PROFILE_DISPLAY(profile) {
        return [
          profile.folder,
          profile.style,
          profile.document ?? "Bindings only",
        ].join(" · ");
      }

      export function activeNote(s) {
        return s.notes.find((n) => n.key === s.activeNoteKey) ?? null;
      }

      export function notesOf(s, profileId) {
        return s.notes.filter((n) => n.profileId === (profileId ?? null));
      }

      export const UNKNOWN_PROFILE_NOTICE = (id) =>
        `This literature note uses an unknown profile (${id}). Re-stamp the note or recreate the profile with the same ID.`;

      let noticeSeq = 0;

      function pushNotice(s, text, action) {
        const id = ++noticeSeq;
        setTimeout(
          () => actions.dismissNotice(id),
          action ? 10000 : 6000,
        );
        return { ...s, notices: [...s.notices, { id, text, action }] };
      }

      export const actions = {
        setScenario(scenario) {
          setState(logged(seed(scenario), `Scenario: ${scenario}`));
        },

        // Removes the record and remembers it, so a stale stamp can still say a name (C)
        // and so Undo has something to put back (D). The notes keep their stamp.
        deleteProfile(id) {
          const p = profileById(state, id);
          if (!p || p.id === null) return;
          const rest = state.profiles.filter((x) => x.id !== id);
          setState(
            logged(
              {
                ...state,
                profiles: rest,
                deletedProfiles: {
                  ...state.deletedProfiles,
                  [id]: {
                    label: p.label,
                    folder: p.folder,
                    style: p.style,
                    document: p.document,
                    noteCount: p.noteCount,
                    importedCount: p.importedCount,
                    deletedAt: stamp(),
                  },
                },
              },
              `Deleted the "${p.label}" profile; its ${p.noteCount} notes keep the stamp`,
            ),
          );
        },

        // E: the Profile leaves the pickers but its notes keep updating exactly as before.
        retireProfile(id) {
          const p = profileById(state, id);
          if (!p || p.id === null) return;
          setState(
            logged(
              {
                ...state,
                profiles: state.profiles.map((x) =>
                  x.id === id ? { ...x, status: "retired" } : x,
                ),
              },
              `Retired "${p.label}"; it is out of the pickers, its ${p.noteCount} notes still update`,
            ),
          );
        },

        // Back from retired (E) or back from the tombstone (D undo, A recreate).
        restoreProfile(id) {
          const retired = state.profiles.find((x) => x.id === id);
          if (retired) {
            setState(
              logged(
                {
                  ...state,
                  profiles: state.profiles.map((x) =>
                    x.id === id ? { ...x, status: "active" } : x,
                  ),
                },
                `Restored "${retired.label}"; it is back in the pickers`,
              ),
            );
            return;
          }
          const gone = state.deletedProfiles[id];
          if (!gone) return;
          const { deletedAt, ...record } = gone;
          const revived = { ...record, id, status: "active" };
          const order = ALL_PROFILES.map((p) => p.id);
          const profiles = [...state.profiles, revived].sort(
            (a, b) => order.indexOf(a.id) - order.indexOf(b.id),
          );
          const deletedProfiles = { ...state.deletedProfiles };
          delete deletedProfiles[id];
          setState(
            logged(
              { ...state, profiles, deletedProfiles },
              `Brought "${revived.label}" back with the same ID; its ${revived.noteCount} notes work again`,
            ),
          );
        },

        recreateProfileWithSameId(id) {
          actions.restoreProfile(id);
        },

        // Re-stamps every note of `fromId` — counts, samples and paths — and says so in the
        // researcher's words. A retired Profile that hits zero notes disappears by itself (E).
        moveNotes(fromId, toId, options) {
          const { moveFiles = false, includeImported = true } = options ?? {};
          const from = profileById(state, fromId);
          const to = profileById(state, toId);
          if (!from || !to) return;
          const moved = from.noteCount;
          const movedImported = includeImported ? from.importedCount : 0;

          const profiles = state.profiles.map((p) => {
            if (p.id === (toId ?? null))
              return {
                ...p,
                noteCount: p.noteCount + moved,
                importedCount: p.importedCount + movedImported,
              };
            if (p.id === fromId)
              return {
                ...p,
                noteCount: 0,
                importedCount: p.importedCount - movedImported,
              };
            return p;
          });

          const notes = state.notes.map((n) =>
            n.profileId === (fromId ?? null)
              ? {
                  ...n,
                  profileId: toId ?? null,
                  path: moveFiles ? `${to.folder}/${n.key}.md` : n.path,
                }
              : n,
          );

          // A retired source that has nothing left cleans itself up (E); a tombstone that has
          // nothing left stops haunting the settings page (C).
          const emptied = profiles.find((p) => p.id === fromId);
          const nextProfiles =
            emptied && emptied.status === "retired"
              ? profiles.filter((p) => p.id !== fromId)
              : profiles;
          const deletedProfiles = { ...state.deletedProfiles };
          if (deletedProfiles[fromId]) delete deletedProfiles[fromId];

          const line = `Moved ${moved} notes from ${from.label} to ${to.label}; files ${
            moveFiles ? `moved to ${to.folder}/` : "stay in place"
          }${movedImported ? `; ${movedImported} imported notes moved too` : ""}`;

          setState(
            logged(
              { ...state, profiles: nextProfiles, notes, deletedProfiles },
              line,
            ),
          );
          return { moved, movedImported, line };
        },

        // The use-time diagnostic. A deleted Profile is the only failure; a retired one
        // updates like any other (E). `silent` lets a variant word the failure its own way.
        updateFromZotero(noteKey, options) {
          const { silent = false } = options ?? {};
          const note = state.notes.find((n) => n.key === noteKey);
          if (!note) return { ok: false, kind: "no-note" };
          const p = profileById(state, note.profileId);
          if (!p || p.status === "deleted") {
            const id = note.profileId;
            const result = { ok: false, kind: "unknown-profile", id };
            setState(
              logged(
                silent
                  ? state
                  : pushNotice(state, UNKNOWN_PROFILE_NOTICE(id)),
                `Update from Zotero on ${note.path} — refused, unknown profile`,
              ),
            );
            return result;
          }
          setState(
            logged(
              silent ? state : pushNotice(state, `Updated ${note.path} from Zotero`),
              `Update from Zotero on ${note.path} — done under ${p.label}`,
            ),
          );
          return { ok: true };
        },

        showNotes(profileId) {
          const p = profileById(state, profileId);
          setState(
            logged(
              {
                ...state,
                search: {
                  query: `["zotlit-profile":${profileId}]`,
                  profileId: profileId ?? null,
                },
              },
              `Searched the vault for notes stamped ${p ? p.label : profileId}`,
            ),
          );
        },

        closeSearch() {
          setState({ ...state, search: null });
        },

        notify(text, action) {
          setState(pushNotice(state, text, action));
        },

        dismissNotice(id) {
          setState({
            ...state,
            notices: state.notices.filter((n) => n.id !== id),
          });
        },

        openNote(key) {
          const note = state.notes.find((n) => n.key === key);
          setState(
            logged(
              { ...state, activeNoteKey: key },
              `Opened ${note ? note.path : key}`,
            ),
          );
        },
      };

      // --- Primitives: Obsidian's default theme, rebuilt from the plan's tokens only. ---

      export function Kbd({ children }) {
        return (
          <kbd className="font-mono text-[11px] leading-none border-line bg-ground-2 text-muted rounded border px-1 py-[3px]">
            {children}
          </kbd>
        );
      }

      export function Pill({ tone = "muted", children, className = "" }) {
        const tint =
          tone === "accent"
            ? {
                color: "var(--accent)",
                background:
                  "color-mix(in srgb, var(--accent) 14%, transparent)",
              }
            : tone === "danger"
              ? {
                  color: "var(--danger)",
                  background:
                    "color-mix(in srgb, var(--danger) 14%, transparent)",
                }
              : { color: "var(--muted)", background: "var(--ground-2)" };
        return (
          <span
            className={`inline-block rounded-full px-2 py-[2px] text-[11px] leading-none whitespace-nowrap ${className}`}
            style={tint}
          >
            {children}
          </span>
        );
      }

      function TreeFolder({ name, files, activePath, onOpen }) {
        return (

      export function ObsidianFrame({

        const { state } = useProtoState();
        const active = activeNote(state);

        const activeProfile = active ? profileById(state, active.profileId) : null;

        const tree = useMemo(() => {
          const folders = new Map();
          for (const note of state.notes) {
            const cut = note.path.lastIndexOf("/");
            const dir = note.path.slice(0, cut);
            const name = note.path.slice(cut + 1);
            if (!folders.has(dir)) folders.set(dir, []);
            folders.get(dir).push({ name, path: note.path, key: note.key });
          }
          const documents = new Set();
          for (const p of state.profiles)
            if (p.document && p.document.includes("/")) documents.add(p.document);
          for (const p of Object.values(state.deletedProfiles))
            if (p.document && p.document.includes("/")) documents.add(p.document);
          folders.set(
            "templates",
            [...documents].sort().map((path) => ({
              name: path.split("/").pop(),
              path,
            })),
          );
          return [...folders.entries()].sort((a, b) =>
            a[0].localeCompare(b[0]),
          );
        }, [state.notes, state.profiles, state.deletedProfiles]);

        const pane =
          sidePane ??
          (state.search ? (
            <SearchPane
              query={state.search.query}
              results={notesOf(state, state.search.profileId)}
              total={
                profileById(state, state.search.profileId)?.noteCount ?? 0

                  <TreeFolder

                    activePath={active?.path}

              {/* search pane */}

              {/* main pane */}
              <div className="flex min-w-0 flex-1 flex-col">

                <div className="min-h-0 flex-1 overflow-y-auto px-10 py-6">
                  {children ? <div className="mb-6">{children}</div> : null}
                  {active ? (
                    <>
                      <div className="text-muted mb-4 font-mono text-[11px]">
                        {active.path}
                      </div>
                      <table className="mb-6 w-full max-w-[560px] table-fixed text-[13px]">
                        <tbody>
                          <tr>
                            <td className="text-muted w-[130px] py-1 align-top">

      export function CommandPalette({ open, items = [], onClose }) {
        const [query, setQuery] = useState("");
        const [sel, setSel] = useState(0);
        const hits = items.filter((i) =>
          i.label.toLowerCase().includes(query.toLowerCase()),
        );
        useEffect(() => {
          setSel(0);
        }, [query]);
        if (!open) return null;
        const onKeyDown = (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setSel((i) => Math.min(i + 1, hits.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setSel((i) => Math.max(i - 1, 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            hits[sel]?.onSelect?.();
          } else if (e.key === "Escape") {
            e.preventDefault();
            onClose?.();
          }
        };
        return (
          <Prompt
            placeholder="Select a command..."
            value={query}
            onChange={setQuery}
            onKeyDown={onKeyDown}
            instructions={[
              { command: "↑↓", purpose: "navigate" },
              { command: "↵", purpose: "run command" },
              { command: "esc", purpose: "dismiss" },
            ]}
          >
            {hits.map((it, i) => (
              <SuggestRow
                key={it.label}
                title={it.label}
                selected={i === sel}
                onClick={it.onSelect}
              />
            ))}
          </Prompt>
        );
      }

                      {targets.map((p) => (
                        <option key={p.label} value={p.id ?? ""}>
                          {p.label}
                        </option>
                      ))}
                    </select>
                    <ChevronDown
                      size={12}
                      className="text-muted pointer-events-none absolute right-2"
                    />
                  </span>
                </label>
                {to ? (
                  <p className="text-muted leading-relaxed">
                    Managed content and properties re-render from{" "}
                    {to.document ?? "the built-in template"} on the next update.
                    Text outside the managed region stays unchanged.
                  </p>
                ) : null}
              </div>
            }
            checkboxes={checkboxes}
            actions={[
              { label: "Cancel", onClick: onCancel },
              {
                label: cta,
                onClick: onConfirm,
                cta: !ctaDestructive,
                destructive: ctaDestructive,
              },
            ]}
          />
        );
      }

      // --- Rail --------------------------------------------------------------

      function RailHeading({ children }) {
        return (
          <div className="font-display text-muted mb-2 text-[11px] font-semibold tracking-[0.08em] uppercase">
            {children}
          </div>
        );
      }

      export function Rail({
        thesis,
        answers = [],
        steps = [],
        consent = null,
        extras = null,
      }) {
        const { state } = useProtoState();
        const active = activeNote(state);
        const info = stampLabel(state, active);
        const deleted = Object.entries(state.deletedProfiles);
        return (
          <aside className="border-line bg-ground-2 text-ink font-body flex h-full min-h-0 flex-col gap-5 overflow-y-auto border-l px-4 py-4 text-[13px]">
            <div>
              <RailHeading>Thesis</RailHeading>
              <p className="leading-relaxed">{thesis}</p>
            </div>

            {answers.length ? (
              <div>
                <RailHeading>Three researchers</RailHeading>
                <div className="flex flex-col gap-2">
                  {answers.map((a) => (
                    <div key={a.q} className="leading-relaxed">
                      <div className="text-muted">“{a.q}”</div>
                      <div>{a.a}</div>
                    </div>
                  ))}
                </div>
              </div>
            ) : null}

            {consent ? (
              <div>
                <RailHeading>Consent rule</RailHeading>
                <p className="text-ink/85 leading-relaxed">{consent}</p>
              </div>
            ) : null}

            {steps.length ? (
              <div>
                <RailHeading>Steps</RailHeading>
                <ol className="flex flex-col gap-[6px]">
                  {steps.map((s, i) => (
                    <li key={i} className="flex gap-2 leading-relaxed">
                      <span className="text-muted font-mono text-[11px] tabular-nums">
                        {String(i + 1).padStart(2, "0")}
                      </span>
                      <span className="min-w-0 flex-1">{s}</span>
                    </li>
                  ))}
                </ol>
              </div>
            ) : null}

            {extras}

            <div>
              <RailHeading>State</RailHeading>
              <table className="w-full text-[11px]">
                <tbody>
                  {state.profiles.map((p) => (
                    <tr key={p.label} className="align-top">
                      <td className="py-[2px] pr-2">
                        {p.label}
                        {p.id === state.subjectProfileId ? (
                          <span className="text-accent"> ·</span>
                        ) : null}
                      </td>
                      <td className="py-[2px] pr-2">
                        {p.status === "retired" ? (
                          <Pill tone="muted">retired</Pill>
                        ) : (
                          <Pill tone="accent">active</Pill>
                        )}
                      </td>
                      <td className="text-muted py-[2px] pr-1 text-right font-mono tabular-nums">
                        {p.noteCount}
                      </td>
                      <td className="text-muted py-[2px] text-right font-mono tabular-nums">
                        {p.importedCount}i
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>

              {deleted.length ? (
                <div className="mt-3 flex flex-col gap-1">
                  {deleted.map(([id, rec]) => (
                    <div key={id} className="text-[11px] leading-snug">
                      <Pill tone="danger">deleted</Pill>{" "}
                      <span>{rec.label}</span>{" "}
                      <span className="text-muted font-mono break-all">
                        {id}
                      </span>
                    </div>
                  ))}
                </div>
              ) : null}

              {active && info ? (
                <div className="text-muted mt-3 text-[11px] leading-snug">
                  <span className="font-mono break-all">{active.path}</span>
                  {" — "}
                  {info.label} ({info.status})
                </div>
              ) : null}
            </div>

            <div className="min-h-0">
              <RailHeading>Log</RailHeading>
              <div className="flex flex-col gap-[3px]">
                {state.log.length === 0 ? (
                  <div className="text-muted text-[11px]">nothing yet</div>
                ) : (
                  state.log.slice(0, 12).map((e, i) => (
                    <div key={i} className="flex gap-2 text-[11px] leading-snug">
                      <span className="text-muted font-mono tabular-nums">
                        {e.t}
                      </span>
                      <span className="min-w-0 flex-1">{e.text}</span>
                    </div>
                  ))
                )}
              </div>
            </div>
          </aside>
        );
      }
      // --- Shared END ---

      // --- App ---
      // --- Variant D ---
      // Variant D — Delete = move.
      // Deleting a referenced Profile IS the #904 Switch Profile consequences dialog, batched:
      // pick the target, state the consequences, re-stamp all of its notes, then drop the record.
      // A stale stamp never comes into existence, so no surface has to render one. A 10-second
      // Notice offers Undo; this prototype restores the record and says out loud that re-stamping
      // the notes back is only simulated (see vd_undo).

      function vd_label(p) {
        return p ? p.label : "Default";
      }

      /** Keyboard for the Switch Profile picker: ↑↓ move, ↵ choose, Esc close. */
      function vd_navKeys(evt, { count, index, setIndex, onChoose, onClose }) {
        if (evt.key === "ArrowDown") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index + 1) % count);
        } else if (evt.key === "ArrowUp") {
          evt.preventDefault();
          setIndex(count === 0 ? 0 : (index - 1 + count) % count);
        } else if (evt.key === "Enter") {
          evt.preventDefault();
          if (count > 0) onChoose(index);
        } else if (evt.key === "Escape") {
          evt.preventDefault();
          onClose();
        }
      }

      function vd_noteWord(n) {
        return n === 1 ? "note" : "notes";
      }

      /** "40 literature notes and 6 imported notes use it." — the researcher's own numbers. */
      function vd_useLine(p) {
        const notes = `${p.noteCount} literature ${vd_noteWord(p.noteCount)}`;
        if (p.importedCount > 0)
          return `${notes} and ${p.importedCount} imported ${vd_noteWord(p.importedCount)} use it.`;
        return `${notes} use it.`;
      }

      function VariantD() {
        const { state, actions } = useProtoState();

        const [settingsOpen, setSettingsOpen] = useState(false);
        const [page, setPage] = useState("profiles"); // "profiles" | profileId
        // null | { kind: "move" | "simple", id }
        const [dialog, setDialog] = useState(null);
        const [target, setTarget] = useState(null); // last active choice; Default at first
        const [options, setOptions] = useState({ moveFiles: false, includeImported: true });
        const [pickerOpen, setPickerOpen] = useState(false);
        const [pickerQuery, setPickerQuery] = useState("");
        const [pickerIndex, setPickerIndex] = useState(0);
        const [paletteOpen, setPaletteOpen] = useState(false);

        // The scenario preset reseeds the store; drop every piece of local UI state with it.
        useEffect(() => {
          setSettingsOpen(false);
          setPage("profiles");
          setDialog(null);
          setTarget(null);
          setOptions({ moveFiles: false, includeImported: true });
          setPickerOpen(false);
          setPickerQuery("");
          setPickerIndex(0);
          setPaletteOpen(false);
        }, [state.scenario]);

        function closeTopmost() {
          if (dialog) setDialog(null);
          else if (pickerOpen) setPickerOpen(false);
          else if (paletteOpen) setPaletteOpen(false);
          else if (settingsOpen) setSettingsOpen(false);
        }

        useEffect(() => {
          const onKey = (e) => {
            if (e.key !== "Escape") return;
            if (dialog || pickerOpen || paletteOpen || settingsOpen) {
              e.preventDefault();
              closeTopmost();
            }
          };
          window.addEventListener("keydown", onKey);
          return () => window.removeEventListener("keydown", onKey);
        });

        const note = activeNote(state);

        // --- Delete ------------------------------------------------------------
        function openDelete(id) {
          const p = profileById(state, id);
          if (!p) return;
          if (p.noteCount === 0) {
            setDialog({ kind: "simple", id });
            return;
          }
          // Default target: Default, or the last target the researcher chose.
          const stillThere = state.profiles.some(
            (x) => x.status === "active" && x.id === target && x.id !== id,
          );
          setTarget(stillThere ? target : null);
          setOptions({ moveFiles: false, includeImported: true });
          setDialog({ kind: "move", id });
        }

        // Restores the tombstoned record. It comes back with 0 notes, because the notes really
        // did move — the base `moveNotes` re-stamps EVERY note of a Profile, so moving them back
        // would drag the target's own notes along with them. An honest Undo needs the plugin to
        // remember which notes this one deletion moved (a per-deletion record); the prototype
        // says so instead of faking it.
        function vd_undo(id, moved) {
          actions.restoreProfile(id);
          actions.notify(
            `Undo restored the profile; re-stamping back the ${moved} ${vd_noteWord(moved)} is simulated`,
          );
        }

        function confirmDelete() {
          const id = dialog.id;
          const from = profileById(state, id);
          const to = profileById(state, target);
          if (!from || !to) return;
          const strandedImported = options.includeImported ? 0 : from.importedCount;
          const result = actions.moveNotes(id, target, options);
          actions.deleteProfile(id);
          const moved = result?.moved ?? from.noteCount;
          actions.notify(
            `Deleted “${from.label}”; ${moved} ${vd_noteWord(moved)} moved to ${to.label}.`,
            { label: "Undo", onClick: () => vd_undo(id, moved) },
          );
          if (strandedImported > 0)
            actions.notify(
              `${strandedImported} imported ${vd_noteWord(strandedImported)} stayed behind on the deleted profile — leave the checkbox on to keep nothing stale.`,
            );
          setDialog(null);
          setPage("profiles");
          // The frame paints its overlay above the notices, so a settings modal left open would
          // bury the Undo button. Deletion closes settings and hands the researcher the notice.
          setSettingsOpen(false);
        }

        function confirmSimpleDelete() {
          const p = profileById(state, dialog.id);
          actions.deleteProfile(dialog.id);
          if (p) actions.notify(`Deleted “${p.label}”.`);
          setDialog(null);
          setPage("profiles");
          setSettingsOpen(false);
        }

        // --- Update from Zotero (always ok in D) + the Imported Note twin -------
        function runUpdate() {
          if (!note) {
            actions.notify("Open a literature note first.");
            return;
          }
          const profile = profileById(state, note.profileId);
          const result = actions.updateFromZotero(note.key, { silent: true });
          if (result.ok) {
            actions.notify(
              `Updated ${note.path} from Zotero under “${vd_label(profile)}”.`,
            );
            if (note.imported > 0)
              actions.notify(
                `${note.imported} imported ${vd_noteWord(note.imported)} of this item updated under “${vd_label(profile)}” too.`,
              );
          } else {
            // Unreachable in D: deletion always moves the notes first, so no stamp is ever stale.
            actions.notify(UNKNOWN_PROFILE_NOTICE(result.id));
          }
        }

        // --- Overlays -----------------------------------------------------------
        const subject = profileById(state, state.subjectProfileId);
        let overlay = null;

        if (dialog?.kind === "move") {
          const from = profileById(state, dialog.id);
          const to = profileById(state, target);
          const keepsFile = from?.document && from.document.includes("/");
          overlay = (
            <MoveNotesDialog
              from={from}
              to={to}
              onTo={setTarget}
              options={options}
              onOptions={setOptions}
              onConfirm={confirmDelete}
              onCancel={() => setDialog(null)}
              title={`Delete “${from.label}” profile?`}
              cta={`Delete and move ${from.noteCount} ${vd_noteWord(from.noteCount)}`}
              ctaDestructive
              intro={
                <div className="flex flex-col gap-2">
                  <p className="leading-relaxed">
                    {vd_useLine(from)} Choose the profile they move to.
                  </p>
                  <p className="text-muted leading-relaxed">
                    {keepsFile
                      ? `The template file ${from.document} stays in your vault.`
                      : "This profile has no template document of its own; nothing leaves your vault."}
                  </p>
                  {from.importedCount > 0 && !options.includeImported ? (
                    <p className="text-danger leading-relaxed">
                      Leaving them behind strands {from.importedCount} imported{" "}
                      {vd_noteWord(from.importedCount)} on a profile that no longer exists.
                    </p>
                  ) : null}
                </div>
              }
            />
          );
        } else if (dialog?.kind === "simple") {
          const p = profileById(state, dialog.id);
          overlay = (
            <Dialog
              title={`Delete “${p.label}” profile?`}
              body="No notes use it."
              actions={[
                { label: "Cancel", onClick: () => setDialog(null) },
                { label: "Delete profile", onClick: confirmSimpleDelete, destructive: true },
              ]}
            />
          );
        } else if (pickerOpen) {
          const q = pickerQuery.trim().toLocaleLowerCase();
          const choices = state.profiles.filter(
            (p) => p.status === "active" && p.label.toLocaleLowerCase().includes(q),
          );
          const tombstones = Object.entries(state.deletedProfiles);
          const choose = (i) => {
            const p = choices[i];
            if (!p) return;
            if (note && p.id === (note.profileId ?? null)) {
              actions.notify(`This note already uses “${p.label}”.`);
            } else {
              actions.notify(
                `Switching one note to “${p.label}” is the same consequences dialog, unbatched (ticket #904); this prototype only shows the batched one.`,
              );
            }
            setPickerOpen(false);
          };
          overlay = (
            <Prompt
              placeholder="Choose a profile…"
              value={pickerQuery}
              onChange={(v) => {
                setPickerQuery(v);
                setPickerIndex(0);
              }}
              onKeyDown={(e) =>
                vd_navKeys(e, {
                  count: choices.length,
                  index: pickerIndex,
                  setIndex: setPickerIndex,
                  onChoose: choose,
                  onClose: () => setPickerOpen(false),
                })
              }
              instructions={[
                { command: "↑↓", purpose: "to navigate" },
                { command: "↵", purpose: "to choose" },
                { command: "esc", purpose: "to dismiss" },
              ]}
            >
              {choices.map((p, i) => (
                <SuggestRow
                  key={p.label}
                  selected={i === pickerIndex}
                  onClick={() => choose(i)}
                  title={p.label}
                  note={PROFILE_DISPLAY(p)}
                  aside={`${p.noteCount} notes`}
                  badge={note && p.id === (note.profileId ?? null) ? "current" : null}
                />
              ))}
              {tombstones.length ? (
                <div className="text-muted border-line mt-2 border-t px-3 pt-2 text-[12px] leading-relaxed">
                  {tombstones.map(([id, rec]) => (
                    <div key={id}>
                      “{rec.label}” was deleted; its notes already moved, so it never appears in
                      this list.
                    </div>
                  ))}
                </div>
              ) : null}
            </Prompt>
          );
        } else if (paletteOpen) {
          overlay = (
            <CommandPalette
              open
              onClose={() => setPaletteOpen(false)}
              items={[
                {
                  label: "Open settings → Literature note profiles",
                  onSelect: () => {
                    setPaletteOpen(false);
                    setPage("profiles");
                    setSettingsOpen(true);
                  },
                },
                {
                  label: "Update literature note from Zotero",
                  onSelect: () => {
                    setPaletteOpen(false);
                    runUpdate();
                  },
                },
                {
                  label: "Switch literature note profile…",
                  onSelect: () => {
                    setPaletteOpen(false);
                    setPickerQuery("");
                    setPickerIndex(0);
                    setPickerOpen(true);
                  },
                },
              ]}
            />
          );
        } else if (settingsOpen) {
          overlay = (
            <SettingsModal
              open
              onClose={() => setSettingsOpen(false)}
              title={
                page === "profiles"
                  ? "Literature note profiles"
                  : (profileById(state, page)?.label ?? "Profile")
              }
            >
              {page === "profiles" ? (
                <ProfilesPage onDelete={openDelete} onOpen={(id) => setPage(id)} />
              ) : (
                <ProfilePage
                  profileId={page}
                  onBack={() => setPage("profiles")}
                  onDelete={openDelete}
                />
              )}
            </SettingsModal>
          );
        }

        const statusItems = (
          <div className="flex items-center gap-2">
            <button
              type="button"
              className="border-line text-ink cursor-pointer rounded border px-2 py-[2px]"
              onClick={() => {
                setPage("profiles");
                setSettingsOpen(true);
              }}
            >
              Settings
            </button>
            <button
              type="button"
              className="border-line text-muted cursor-pointer rounded border px-2 py-[2px]"
              onClick={() => setPaletteOpen(true)}
            >
              ⌘P
            </button>
            <button
              type="button"
              className="border-line text-muted cursor-pointer rounded border px-2 py-[2px]"
              onClick={runUpdate}
            >
              Update from Zotero
            </button>
          </div>
        );

        return (
          <div className="grid h-full" style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}>
            <ObsidianFrame
              title="ZotLit — delete = move"
              statusItems={statusItems}
              overlay={overlay}
              stampRender={(n, info) => <DefaultStamp info={info} />}
            />
            <Rail
              thesis="Deleting a profile is moving its notes; the delete dialog is the Switch Profile dialog, batched, and nothing is ever stale."
              consent="Every deletion that touches notes is a consented re-stamp: the target, the folder move, the imported notes and the re-render are stated before the button is pressed."
              answers={[
                {
                  q: "What happens to my forty notes?",
                  a: "They move to the profile you pick, in the same dialog, with the consequences stated.",
                },
                {
                  q: "Can I still update them?",
                  a: "Yes — under the new profile; the managed part re-renders on the next update, text outside stays.",
                },
                {
                  q: "How do I get it back?",
                  a: "Undo in the notice for 10 s; after that: Add profile, point it at the kept template file, switch notes back.",
                },
              ]}
              steps={[
                "Open Settings from the status bar (or ⌘P → “Open settings → Literature note profiles”).",
                `Press the trash icon on “${subject?.label ?? "the subject profile"}” — the delete dialog IS the Switch Profile dialog, batched.`,
                "Change the target, toggle “Move files to …/” and “Also move N imported notes”; the consequence line follows the target.",
                "Press “Delete and move N notes”. Watch the state table: the target gains the notes, the record leaves.",
                "Press “Update literature note from Zotero” on the note — it works, under the new profile, and the imported notes report in their own notice.",
                "Open “Switch literature note profile…”: the deleted profile is not in the list, because it has no notes left to point at it.",
                "Press Undo in the notice: it restores the profile record only. Re-stamping the notes back is SIMULATED — the real Undo needs the plugin to remember which notes this deletion moved (a per-deletion record); without it, moving back would drag the target's own notes along.",
                "Delete “Scratch” (0 notes) for the other branch: a plain confirm, no target, no consequences.",
              ]}
              extras={
                <div className="text-muted leading-relaxed">
                  <p>
                    The stamp is always{" "}
                    <span className="text-ink">DefaultStamp</span> with an active profile — D
                    never produces a stale one.
                  </p>
                  <p className="mt-2">
                    The template document file survives the deletion: the file tree keeps{" "}
                    <span className="text-ink font-mono text-[11px]">
                      {subject?.document ?? "its template"}
                    </span>
                    .
                  </p>
                </div>
              }
            />
          </div>
        );
      }
      // --- Variant D END ---

      // --- App END ---

      const SCENARIO_PRESETS = [
        { id: "fold", label: "Fold: Book chapters → Default (40)" },
        { id: "retire", label: "Retire: Thesis (12 · 3 imported)" },
        { id: "oops", label: "Oops: Articles deleted by mistake (23)" },
      ];
      function TrimmedApp() {
        const { state } = useProtoState();
        return (
          <div className="h-screen bg-ground text-ink font-body flex flex-col">
            <div style={{ flex: "none", background: "#1e293b", color: "#f8fafc", padding: "0.4rem 1rem", display: "flex", alignItems: "center", gap: "1rem", fontSize: "0.875rem" }}>
              <span>D — Delete = move (winner)</span>
              {SCENARIO_PRESETS.map((p) => (
                <button key={p.id} onClick={() => actions.setScenario(p.id)} style={{ background: state.scenario === p.id ? "#f8fafc" : "transparent", color: state.scenario === p.id ? "#1e293b" : "inherit", border: "1px solid rgba(248,250,252,0.25)", borderRadius: "9999px", padding: "0.15rem 0.6rem", cursor: "pointer", fontSize: "0.75rem", whiteSpace: "nowrap" }}>{p.label}</button>
              ))}
            </div>
            <div className="min-h-0 flex-1"><VariantD /></div>
          </div>
        );
      }
      createRoot(document.getElementById("root")).render(<TrimmedApp />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
