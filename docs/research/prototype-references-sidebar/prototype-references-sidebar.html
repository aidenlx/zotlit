<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>References Sidebar Prototype</title>

    <!--
      Design question: What References Sidebar layout and interaction pattern
      makes Literature Note Citations easy to inspect and navigate?

      Winner: A — Navigate-first (flat bibliography + hover chevron to open note).

      Decisions from this prototype:
      - Layout: flat bibliography list, citeproc order, hanging-indent with ref number column.
      - Ref numbers: quiet 11px muted text, baseline-aligned with first line of CSL entry.
      - Editor widgets: CSL-formatted inline citations (not fixed 1/2/3), read-only (no click interception on wikilinks).
      - Interaction: click entry → scroll to next occurrence (cycle); hover reveals open-note chevron.
      - Occurrence counter: shows "1/2" as user cycles, plain count otherwise.
      - Styling: Obsidian CSS variables via app.css, works in both light and dark themes.
    -->

    <link rel="stylesheet" href="obsidian-app.css" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-ground: var(--background-primary);
        --color-surface: var(--background-secondary);
        --color-border: var(--background-modifier-border);
        --color-ink: var(--text-normal);
        --color-muted: var(--text-muted);
        --color-accent: var(--text-accent);
        --color-error: var(--text-error);
        --color-highlight: var(--text-highlight-bg);
        --font-display: var(--font-interface);
        --font-body: var(--font-interface);
        --font-bib: var(--font-text);
      }
    </style>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: var(--font-interface);
        color: var(--text-normal);
        background: var(--background-primary);
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19",
          "react-dom/client": "https://esm.sh/react-dom@19/client",
          "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
          "lucide-react": "https://esm.sh/lucide-react@1?external=react",
          "beautiful-mermaid": "https://esm.sh/beautiful-mermaid@1"
        }
      }
    </script>
  </head>
  <body class="theme-dark mod-macos">
    <div id="root"></div>

    <script type="text/jsx" id="app">
      import React, {
        useState,
        useEffect,
        useMemo,
        useCallback,
        useRef,
        useSyncExternalStore,
      } from "react";
      import { createRoot } from "react-dom/client";
      import {
        BookOpen,
        AlertTriangle,
        ChevronRight,
        Loader2,
        FileText,
        Hash,
        ArrowUp,
        ArrowDown,
        TriangleAlert,
        RefreshCw,
      } from "lucide-react";

      // --- Diagram ---
      function decodeEntities(s) {
        const el = document.createElement("textarea");
        el.innerHTML = s;
        return el.value;
      }

      function dedent(s) {
        const lines = s.replace(/\t/g, "  ").split("\n");
        const widths = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^ */)[0].length);
        const pad = widths.length ? Math.min(...widths) : 0;
        return lines
          .map((l) => l.slice(pad))
          .join("\n")
          .trim();
      }

      let mermaidMod = null;
      export function Diagram({ src }) {
        const [mod, setMod] = useState(mermaidMod);
        useEffect(() => {
          if (!mod)
            import("beautiful-mermaid").then((m) => {
              mermaidMod = m;
              setMod(m);
            });
        }, [mod]);
        const { svg, error } = useMemo(() => {
          const el = document.getElementById(src);
          if (!el)
            return {
              svg: null,
              error: `no <script type="text/mermaid" id="${src}"> in this page`,
            };
          if (!mod) return { svg: null, error: null };
          try {
            const opts = {
              bg: "var(--ground)",
              fg: "var(--ink)",
              transparent: true,
            };
            return {
              svg: mod.renderMermaidSVG(
                decodeEntities(dedent(el.textContent)),
                opts,
              ),
              error: null,
            };
          } catch (e) {
            return { svg: null, error: String(e) };
          }
        }, [mod, src]);
        if (error)
          return (
            <pre className="text-accent text-sm whitespace-pre-wrap">
              {error}
            </pre>
          );
        return (
          <div
            className="overflow-x-auto"
            dangerouslySetInnerHTML={{ __html: svg ?? "" }}
          />
        );
      }
      // --- Diagram END ---

      // ═══════════════════════════════════════════════════════════════════
      // Shared store — scenario presets, mock data, navigation state
      // ═══════════════════════════════════════════════════════════════════

      const MOCK_REFERENCES = [
        {
          id: "doe2020",
          indexedKey: "DOE2020A",
          citationKey: "doe2020",
          refNumber: 1,
          cslHtml:
            "Doe, J. (2020). Machine learning approaches to natural language understanding. <i>Journal of Artificial Intelligence Research</i>, <i>68</i>, 245–278.",
          shortLabel: "Doe 2020",
          status: "ok",
        },
        {
          id: "brown2019",
          indexedKey: "BROWN2019",
          citationKey: "brown2019",
          refNumber: 2,
          cslHtml:
            "Brown, C. (2019). <i>Statistical methods for experimental design</i>. Academic Press.",
          shortLabel: "Brown 2019",
          status: "ok",
        },
        {
          id: "smith2021",
          indexedKey: "SMITH2021",
          citationKey: "smith-jones2021",
          refNumber: 3,
          cslHtml:
            "Smith, A., &amp; Jones, B. (2021). Deep learning for computational linguistics: A comprehensive survey. <i>Computational Linguistics</i>, <i>47</i>(3), 501–542.",
          shortLabel: "Smith & Jones 2021",
          status: "ok",
        },
        {
          id: "garcia2022",
          indexedKey: "GARCIA2022",
          citationKey: "garcia-chen2022",
          refNumber: 4,
          cslHtml:
            "García, M., &amp; Chen, L. (2022). Quantum computing foundations and applications. <i>Nature Reviews Physics</i>, <i>4</i>(1), 12–28.",
          shortLabel: "García & Chen 2022",
          status: "ok",
        },
        {
          id: "invalid1",
          indexedKey: "ABCD1234",
          citationKey: null,
          refNumber: 5,
          cslHtml: null,
          shortLabel: "[[Missing Item]]",
          status: "error",
          errorMessage:
            'Item not found — Indexed Key "ABCD1234" does not exist in the database',
        },
      ];

      const BIBLIOGRAPHY_ORDER = [
        "brown2019",
        "doe2020",
        "garcia2022",
        "invalid1",
        "smith2021",
      ];

      const MOCK_DOCUMENT_LINES = [
        {
          type: "heading",
          text: "Hybrid Approaches to Language Understanding",
        },
        { type: "blank" },
        { type: "text", text: "Recent advances in machine learning", refs: [] },
        {
          type: "text",
          text: "have transformed how we approach natural language processing.",
          refs: [{ id: "doe2020", label: "Doe 2020" }],
        },
        {
          type: "text",
          text: "Building on earlier statistical foundations,",
          refs: [{ id: "brown2019", label: "Brown 2019" }],
        },
        {
          type: "text",
          text: "researchers have shown that deep learning models",
          refs: [{ id: "smith2021", label: "Smith & Jones 2021" }],
        },
        {
          type: "text",
          text: "can achieve remarkable results across diverse benchmarks.",
        },
        { type: "blank" },
        {
          type: "text",
          text: "The intersection of quantum computing",
          refs: [{ id: "garcia2022", label: "García & Chen 2022" }],
        },
        {
          type: "text",
          text: "and artificial intelligence opens new possibilities.",
        },
        {
          type: "text",
          text: "As Doe noted,",
          refs: [{ id: "doe2020", label: "Doe 2020" }],
        },
        {
          type: "text",
          text: "hybrid approaches combining classical statistical methods",
          refs: [{ id: "brown2019", label: "Brown 2019" }],
        },
        {
          type: "text",
          text: "with neural architectures show particular promise.",
        },
        { type: "blank" },
        {
          type: "text",
          text: "Several groups have cited the importance of",
          refs: [{ id: "invalid1", label: "Missing Item" }],
        },
        {
          type: "text",
          text: "in this context, though the evidence remains inconclusive.",
        },
        {
          type: "text",
          text: "Smith and Jones",
          refs: [{ id: "smith2021", label: "Smith & Jones 2021" }],
        },
        {
          type: "text",
          text: "provide a thorough review of the competing methodologies.",
        },
      ];

      function buildOccurrences(lines) {
        const occ = {};
        lines.forEach((line, lineIdx) => {
          if (line.refs) {
            line.refs.forEach((ref) => {
              if (!occ[ref.id]) occ[ref.id] = [];
              occ[ref.id].push(lineIdx);
            });
          }
        });
        return occ;
      }

      const SCENARIOS = {
        normal: { label: "Normal", description: "5 refs, duplicates, 1 error" },
        empty: { label: "Empty", description: "No citations" },
        loading: { label: "Loading", description: "Data loading" },
        single: { label: "Single", description: "One citation" },
        allErrors: { label: "All errors", description: "Every ref is broken" },
      };

      let _store = {
        scenario: "normal",
        selectedRefId: null,
        highlightedLineIdx: null,
        cycleIndex: {},
        toast: null,
      };
      let _listeners = new Set();

      function getSnapshot() {
        return _store;
      }
      function subscribe(fn) {
        _listeners.add(fn);
        return () => _listeners.delete(fn);
      }
      function setStore(update) {
        _store =
          typeof update === "function"
            ? update(_store)
            : { ..._store, ...update };
        _listeners.forEach((fn) => fn());
      }

      function useProtoState() {
        return useSyncExternalStore(subscribe, getSnapshot);
      }

      function getScenarioData(scenario) {
        switch (scenario) {
          case "empty":
            return {
              references: [],
              bibOrder: [],
              lines: [
                { type: "heading", text: "An Essay Without Citations" },
                { type: "blank" },
                {
                  type: "text",
                  text: "This document contains no Literature Note citations.",
                },
                {
                  type: "text",
                  text: "The References Sidebar has nothing to show.",
                },
              ],
            };
          case "loading":
            return {
              references: null,
              bibOrder: null,
              lines: MOCK_DOCUMENT_LINES,
            };
          case "single":
            return {
              references: [MOCK_REFERENCES[0]],
              bibOrder: ["doe2020"],
              lines: [
                { type: "heading", text: "A Brief Note" },
                { type: "blank" },
                {
                  type: "text",
                  text: "As Doe observed,",
                  refs: [{ id: "doe2020", label: "Doe 2020" }],
                },
                {
                  type: "text",
                  text: "machine learning continues to advance.",
                },
              ],
            };
          case "allErrors": {
            const errRefs = MOCK_REFERENCES.map((r) => ({
              ...r,
              status: "error",
              cslHtml: null,
              errorMessage:
                r.id === "invalid1"
                  ? r.errorMessage
                  : `Citation Key empty — Item "${r.indexedKey}" has no Citation Key assigned`,
            }));
            return {
              references: errRefs,
              bibOrder: BIBLIOGRAPHY_ORDER,
              lines: MOCK_DOCUMENT_LINES,
            };
          }
          default:
            return {
              references: MOCK_REFERENCES,
              bibOrder: BIBLIOGRAPHY_ORDER,
              lines: MOCK_DOCUMENT_LINES,
            };
        }
      }

      function useScenarioData() {
        const { scenario } = useProtoState();
        return useMemo(() => {
          const data = getScenarioData(scenario);
          const occurrences = data.lines ? buildOccurrences(data.lines) : {};
          return { ...data, occurrences };
        }, [scenario]);
      }

      function navigateToOccurrence(refId, lineIdx) {
        setStore({ selectedRefId: refId, highlightedLineIdx: lineIdx });
        const el = document.querySelector(`[data-line="${lineIdx}"]`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      function cycleOccurrence(refId) {
        const data = getScenarioData(_store.scenario);
        const occ = buildOccurrences(data.lines);
        const lines = occ[refId] || [];
        if (lines.length === 0) return;
        const currentCycle = _store.cycleIndex[refId] ?? -1;
        const nextCycle = (currentCycle + 1) % lines.length;
        setStore((s) => ({
          ...s,
          selectedRefId: refId,
          highlightedLineIdx: lines[nextCycle],
          cycleIndex: { ...s.cycleIndex, [refId]: nextCycle },
        }));
        const el = document.querySelector(`[data-line="${lines[nextCycle]}"]`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      // ═══════════════════════════════════════════════════════════════════
      // Mock Editor (shared across all variants)
      // ═══════════════════════════════════════════════════════════════════

      function RefBadge({ refId, isError, cslCite }) {
        const state = useProtoState();
        const isSelected = state.selectedRefId === refId;
        return (
          <span
            className={[
              "transition-colors font-bib",
              isError
                ? "text-error/70"
                : isSelected
                  ? "text-accent"
                  : "text-muted",
            ].join(" ")}
            style={{ fontSize: "0.75em" }}
            title={isError ? "Invalid reference" : cslCite}
          >
            {isError ? "(⚠ ?)" : `(${cslCite})`}
          </span>
        );
      }

      function MockEditor() {
        const { lines, references } = useScenarioData();
        const state = useProtoState();
        const refMap = useMemo(() => {
          const m = {};
          if (references)
            references.forEach((r) => {
              m[r.id] = r;
            });
          return m;
        }, [references]);

        return (
          <div className="flex-1 min-w-0 overflow-y-auto bg-ground p-6 font-body text-sm leading-relaxed">
            <div className="max-w-2xl">
              {lines.map((line, i) => {
                const isHighlighted = state.highlightedLineIdx === i;
                if (line.type === "heading") {
                  return (
                    <h1
                      key={i}
                      data-line={i}
                      className="text-xl font-semibold text-ink mb-2"
                    >
                      {line.text}
                    </h1>
                  );
                }
                if (line.type === "blank")
                  return <div key={i} data-line={i} className="h-4" />;
                return (
                  <span
                    key={i}
                    data-line={i}
                    className={[
                      "transition-colors duration-300",
                      isHighlighted ? "bg-highlight rounded px-1 -mx-1" : "",
                    ].join(" ")}
                  >
                    {line.text}
                    {line.refs &&
                      line.refs.map((ref) => {
                        const r = refMap[ref.id];
                        return (
                          <span key={ref.id + "-" + i}>
                            {" "}
                            <RefBadge
                              refId={ref.id}
                              isError={r ? r.status === "error" : true}
                              cslCite={r ? r.shortLabel : "?"}
                            />
                          </span>
                        );
                      })}{" "}
                  </span>
                );
              })}
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════════
      // Shell — wraps editor + sidebar, shared across all variants
      // ═══════════════════════════════════════════════════════════════════

      function Shell({ sidebar }) {
        return (
          <div className="flex h-full bg-ground text-ink font-body">
            <MockEditor />
            <div className="w-px bg-border flex-shrink-0" />
            <div className="w-[340px] flex-shrink-0 bg-surface flex flex-col overflow-hidden">
              {sidebar}
            </div>
          </div>
        );
      }

      // ═══════════════════════════════════════════════════════════════════
      // Shared sidebar pieces (header, loading, empty, footer, entry layout)
      // ═══════════════════════════════════════════════════════════════════

      function openLitNote(ref) {
        setStore((s) => ({
          ...s,
          toast: `Opening Literature Note: ${ref.shortLabel}`,
        }));
        setTimeout(() => setStore((s) => ({ ...s, toast: null })), 1500);
      }

      function SidebarHeader({ count }) {
        return (
          <div className="flex items-center gap-2 px-3 py-2 border-b border-border shrink-0">
            <BookOpen className="w-4 h-4 text-muted" />
            <span className="text-xs font-medium text-muted uppercase tracking-wider">
              References
            </span>
            <span
              className="ml-auto text-[11px] text-muted"
              style={{ fontVariantNumeric: "tabular-nums" }}
            >
              {count}
            </span>
          </div>
        );
      }

      function SidebarLoading() {
        return Array.from({ length: 4 }).map((_, i) => (
          <div
            key={i}
            className="flex items-start gap-2 px-3 py-2 border-b border-border"
          >
            <div className="min-w-[1.5rem] h-[1.5rem] rounded-full animate-pulse bg-border/50 shrink-0" />
            <div className="flex-1 space-y-1 pt-0.5">
              <div className="h-3 w-[90%] animate-pulse bg-border/50 rounded" />
              <div className="h-3 w-[60%] animate-pulse bg-border/50 rounded" />
            </div>
          </div>
        ));
      }

      function SidebarEmpty() {
        return (
          <div className="flex flex-col items-center justify-center gap-2 h-full py-12 text-muted">
            <FileText className="w-6 h-6" />
            <span className="text-xs">No citations in this document</span>
          </div>
        );
      }

      function SidebarFooter() {
        return (
          <div className="px-3 py-1.5 border-t border-border text-[10px] text-muted shrink-0">
            Formatted with citeproc-js (CPAL-1.0)
          </div>
        );
      }

      function Toast() {
        const { toast } = useProtoState();
        if (!toast) return null;
        return (
          <div
            style={{
              position: "fixed",
              top: "1rem",
              left: "50%",
              transform: "translateX(-50%)",
              background: "var(--background-modifier-message)",
              color: "var(--text-on-accent)",
              borderRadius: "var(--radius-m)",
              padding: "0.5rem 1rem",
              fontSize: "0.8rem",
              zIndex: 9999,
            }}
          >
            {toast}
          </div>
        );
      }

      function useOrderedRefs() {
        const { references, bibOrder, occurrences } = useScenarioData();
        const orderedRefs = useMemo(() => {
          if (!references) return null;
          const byId = new Map(references.map((ref) => [ref.id, ref]));
          return bibOrder.map((id) => byId.get(id)).filter(Boolean);
        }, [references, bibOrder]);
        return { orderedRefs, references, occurrences };
      }

      // ═══════════════════════════════════════════════════════════════════
      // Variant A — "Navigate-first"
      // Click entry → scroll to next occurrence (cycle).
      // Small open-note icon at the trailing edge of each entry.
      // ═══════════════════════════════════════════════════════════════════

      // --- App ---
      // --- Variant A ---
      function VariantA() {
        const { selectedRefId } = useProtoState();
        const { orderedRefs, references, occurrences } = useOrderedRefs();
        const count = references ? references.length : 0;

        const sidebar = (
          <div className="flex flex-col h-full bg-surface">
            <SidebarHeader count={count} />
            <div className="overflow-y-auto flex-1">
              {orderedRefs === null && <SidebarLoading />}
              {orderedRefs !== null && orderedRefs.length === 0 && (
                <SidebarEmpty />
              )}
              {orderedRefs !== null &&
                orderedRefs.length > 0 &&
                orderedRefs.map((ref) => {
                  const isSelected = ref.id === selectedRefId;
                  const occCount = occurrences[ref.id]?.length ?? 0;
                  const isError = ref.status === "error";
                  const cycleIdx = useProtoState().cycleIndex[ref.id];
                  return (
                    <div
                      key={ref.id}
                      onClick={() => cycleOccurrence(ref.id)}
                      className={`group flex items-baseline gap-2 px-3 py-2 border-b border-border cursor-pointer
                        ${isSelected ? "bg-highlight/50" : "hover:bg-ground/50"}`}
                    >
                      <span
                        className={`w-5 text-right shrink-0 text-[11px] ${isError ? "text-error" : "text-muted"}`}
                        style={{ fontVariantNumeric: "tabular-nums" }}
                      >
                        {isError ? "⚠" : ref.refNumber}
                      </span>
                      <div className="flex-1 min-w-0">
                        {isError ? (
                          <div className="text-error text-xs">
                            {ref.errorMessage}
                          </div>
                        ) : (
                          <div
                            className="font-bib text-[13px] leading-snug text-ink"
                            dangerouslySetInnerHTML={{ __html: ref.cslHtml }}
                          />
                        )}
                      </div>
                      <div className="flex items-center gap-1 shrink-0 self-start mt-0.5">
                        {occCount > 1 && (
                          <span
                            className="text-muted text-[11px]"
                            style={{ fontVariantNumeric: "tabular-nums" }}
                          >
                            {cycleIdx != null ? `${cycleIdx + 1}/` : ""}
                            {occCount}
                          </span>
                        )}
                        {!isError && (
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              openLitNote(ref);
                            }}
                            className="opacity-0 group-hover:opacity-100 transition-opacity text-muted hover:text-accent"
                            style={{
                              background: "none",
                              border: "none",
                              padding: "2px",
                              cursor: "var(--cursor-link)",
                            }}
                            aria-label={`Open ${ref.shortLabel}`}
                          >
                            <ChevronRight className="w-3.5 h-3.5" />
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
            </div>
            <SidebarFooter />
          </div>
        );
        return <Shell sidebar={sidebar} />;
      }
      // --- Variant A END ---

      // ═══════════════════════════════════════════════════════════════════
      // Variant B — "Open-first"
      // Click CSL text → open Literature Note (the natural reference action).
      // A locate icon near the ref number scrolls to occurrences.
      // ═══════════════════════════════════════════════════════════════════

      // ═══════════════════════════════════════════════════════════════════
      // Variant C — "Split affordance"
      // Click ref number column → scroll to next occurrence.
      // Click CSL text → open Literature Note.
      // Both zones have distinct hover states to signal the split.
      // ═══════════════════════════════════════════════════════════════════

      // --- App END ---

      createRoot(document.getElementById("root")).render(<VariantA />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
