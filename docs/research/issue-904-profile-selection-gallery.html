      function vd_matchItems(items, query) {
        const q = query.trim().toLowerCase();
        if (!q) return items;
        return items.filter((it) =>
          `${it.title} ${it.authors} ${it.key} ${it.type}`
            .toLowerCase()
            .includes(q),
        );
      }

      /** ↑↓ ↵ ⇧↵ Esc, shared by every Prompt in this variant. */
      function vd_keys(
        e,
        { length, sel, setSel, onEnter, onShiftEnter, onEsc },
      ) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          setSel((s) => (length ? (s + 1) % length : 0));
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          setSel((s) => (length ? (s - 1 + length) % length : 0));
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (e.shiftKey) onShiftEnter?.();
          else onEnter?.();
        } else if (e.key === "Escape") {
          e.preventDefault();
          onEsc?.();
        }
      }

      function vd_stamp(note, profile) {
        return (
          <span className="inline-flex items-baseline gap-2">
            <span>{profile ? profile.label : "Unknown"}</span>
            <span className="font-mono text-muted text-[11px]">
              {note.profileId ?? "—"}
            </span>
          </span>
        );
      }

      function VariantD() {
        const { state, actions } = useProtoState();
        const [mode, setMode] = useState(null); // search | override | switchPick | palette
        const [query, setQuery] = useState("");
        const [sel, setSel] = useState(0);
        const [pendingKey, setPendingKey] = useState(null); // item awaiting a one-off Profile
        const [switchTo, setSwitchTo] = useState(undefined); // profileId chosen in the Switch flow
        const [moveFile, setMoveFile] = useState(true);
        const [includeImported, setIncludeImported] = useState(true);

        const extras = state.profiles.length > 1;
        const items = vd_matchItems(state.items, query);
        const activeKey = state.activeNoteKey;
        const activeNote = activeKey ? state.notes[activeKey] : null;
        const activeItem = state.items.find((i) => i.key === activeKey) ?? null;

        const close = () => {
          setMode(null);
          setQuery("");
          setSel(0);
          setPendingKey(null);
        };

        const openSearch = () => {
          setMode("search");
          setQuery("");
          setSel(0);
        };

        const resolvedFor = (item) =>
          profileById(state, actions.resolveRule(item));

        const create = (item, profile, viaRule) => {
          const { path } = actions.createNote(item.key, profile.id);
          actions.notify(
            viaRule
              ? `Created ${path} under ${profile.label} (rule: ${vd_ruleText(profile.rule)})`
              : `Created ${path} under ${profile.label} (one-off override)`,
          );
          close();
        };

        const chooseItem = (item) => {
          if (!item) return;
          const note = state.notes[item.key];
          if (note) {
            actions.openNote(item.key);
            actions.notify(`Opened ${note.path}`);
            close();
            return;
          }
          create(item, resolvedFor(item), true);
        };

        const overrideItem = (item) => {
          if (!item) return;
          if (state.notes[item.key]) {
            chooseItem(item);
            return;
          }
          setPendingKey(item.key);
          setQuery("");
          setMode("override");
          setSel(
            state.profiles.findIndex((p) => p.id === actions.resolveRule(item)),
          );
        };

        const startSwitch = () => {
          if (!activeKey) {
            actions.notify("Open a literature note first.");
            return;
          }
          setMode("switchPick");
          setQuery("");
          setSel(
            state.profiles.findIndex((p) => p.id === activeNote?.profileId),
          );
        };

        // --- settings panel (editor area) ---
        const panel = (
          <div className="flex flex-col gap-4">
            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={openSearch}
                className="border-line bg-ground-2 text-ink rounded border px-2 py-1 text-[13px]"
              >
                Search your library
              </button>
              <button
                type="button"
                onClick={startSwitch}
                className="border-line bg-ground-2 text-ink rounded border px-2 py-1 text-[13px]"
              >
                Switch Profile…
              </button>
              <button
                type="button"
                onClick={() => {
                  setMode("palette");
                  setSel(0);
                }}
                className="border-line text-muted rounded border px-2 py-1 text-[13px]"
              >
                <Kbd>⌘P</Kbd>
              </button>
            </div>

            <div>
              <div className="text-ink text-[15px] font-semibold">
                Literature note profiles
              </div>
              <div className="text-muted text-[13px]">
                Each profile says which items it applies to. ZotLit picks the
                first matching profile when you create a note; everything else
                falls to Default.
              </div>
            </div>

            <div className="border-line divide-line divide-y rounded border">
              {state.profiles.map((p) => (
                <div
                  key={p.id ?? "default"}
                  className="flex items-start gap-3 px-3 py-2.5"
                >
                  <div className="min-w-0 flex-1">
                    <div className="text-ink text-[13px] font-semibold">
                      {p.label}
                    </div>
                    <div className="text-muted font-mono text-[11px]">
                      {PROFILE_DISPLAY(p)}
                    </div>
                  </div>
                  <div className="flex w-[220px] shrink-0 flex-col gap-1">
                    <div className="text-muted text-[11px] tracking-wide uppercase">
                      Applies to
                    </div>
                    {p.id === null ? (
                      <div className="text-ink text-[13px]">
                        Everything else
                      </div>
                    ) : (
                      <select
                        value={vd_encodeRule(p.rule)}
                        onChange={(e) =>
                          actions.setRule(p.id, vd_decodeRule(e.target.value))
                        }
                        className="border-line bg-ground text-ink rounded border px-1.5 py-1 text-[13px]"
                      >
                        {vd_RULE_OPTIONS.map((o) => (
                          <option key={o.value} value={o.value}>
                            {o.label}
                          </option>
                        ))}
                      </select>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );

        // --- overlays ---
        let overlay = null;

        if (mode === "search") {
          overlay = (
            <Prompt
              placeholder="Search your library…"
              value={query}
              onChange={(v) => {
                setQuery(v);
                setSel(0);
              }}
              onKeyDown={(e) =>
                vd_keys(e, {
                  length: items.length,
                  sel,
                  setSel,
                  onEnter: () => chooseItem(items[sel]),
                  onShiftEnter: () => overrideItem(items[sel]),
                  onEsc: close,
                })
              }
              instructions={[
                { command: "↑↓", purpose: "navigate" },
                { command: "↵", purpose: "create under the resolved profile" },
                { command: "⇧↵", purpose: "choose another profile" },
                { command: "esc", purpose: "dismiss" },
              ]}
            >
              {items.map((item, i) => {
                const note = state.notes[item.key];
                const profile = note
                  ? profileById(state, note.profileId)
                  : resolvedFor(item);
                return (
                  <SuggestRow
                    key={item.key}
                    selected={i === sel}
                    onClick={() => {
                      setSel(i);
                      chooseItem(item);
                    }}
                    title={item.title}
                    note={`${item.authors} · ${item.year} · ${item.type} · ${item.library}`}
                    badge={
                      extras ? (
                        <Pill tone={note ? "muted" : "accent"}>
                          {profile?.label ?? "Unknown"}
                        </Pill>
                      ) : undefined
                    }
                    aside={
                      note ? (
                        <span className="text-muted">opens note</span>
                      ) : (
                        <span className="font-mono">
                          {notePath(state, item.key, profile?.id)}
                        </span>
                      )
                    }
                  />
                );
              })}
            </Prompt>
          );
        }

        if (mode === "override" && pendingKey) {
          const item = state.items.find((i) => i.key === pendingKey);
          const ruleId = actions.resolveRule(item);
          overlay = (
            <Prompt
              placeholder={`Choose a profile for ${item.title}…`}
              value={query}
              onChange={setQuery}
              onKeyDown={(e) =>
                vd_keys(e, {
                  length: state.profiles.length,
                  sel,
                  setSel,
                  onEnter: () => create(item, state.profiles[sel], false),
                  onEsc: () => {
                    setPendingKey(null);
                    setQuery("");
                    setSel(0);
                    setMode("search");
                  },
                })
              }
              instructions={[
                { command: "↑↓", purpose: "navigate" },
                { command: "↵", purpose: "create under this profile once" },
                { command: "esc", purpose: "back to search" },
              ]}
            >
              {state.profiles.map((p, i) => (
                <SuggestRow
                  key={p.id ?? "default"}
                  selected={i === sel}
                  onClick={() => {
                    setSel(i);
                    create(item, p, false);
                  }}
                  title={p.label}
                  note={PROFILE_DISPLAY(p)}
                  badge={
                    p.id === ruleId ? (
                      <Pill tone="accent">by rule</Pill>
                    ) : undefined
                  }
                  aside={
                    <span className="font-mono">
                      {notePath(state, item.key, p.id)}
                    </span>
                  }
                />
              ))}
            </Prompt>
          );
        }

        if (mode === "palette") {
          const commands = [
            { label: "ZotLit: Search your library", onSelect: openSearch },
            ...(activeKey
              ? [
                  {
                    label: "ZotLit: Switch literature note profile…",
                    onSelect: startSwitch,
                  },
                ]
              : []),
          ];
          overlay = <CommandPalette open items={commands} onClose={close} />;
        }

        if (mode === "switchPick" && activeNote) {
          overlay = (
            <Prompt
              placeholder="Choose a profile…"
              value={query}
              onChange={setQuery}
              onKeyDown={(e) =>
                vd_keys(e, {
                  length: state.profiles.length,
                  sel,
                  setSel,
                  onEnter: () => {
                    const p = state.profiles[sel];
                    setSwitchTo(p.id);
                    setMoveFile(true);
                    setIncludeImported(true);
                    setMode(null);
                  },
                  onEsc: close,
                })
              }
              instructions={[
                { command: "↑↓", purpose: "navigate" },
                { command: "↵", purpose: "review the switch" },
                { command: "esc", purpose: "dismiss" },
              ]}
            >
              {state.profiles.map((p, i) => (
                <SuggestRow
                  key={p.id ?? "default"}
                  selected={i === sel}
                  onClick={() => {
                    setSel(i);
                    setSwitchTo(p.id);
                    setMoveFile(true);
                    setIncludeImported(true);
                    setMode(null);
                  }}
                  title={p.label}
                  note={PROFILE_DISPLAY(p)}
                  badge={
                    p.id === activeNote.profileId ? (
                      <Pill tone="muted">current</Pill>
                    ) : undefined
                  }
                  aside={
                    <span className="font-mono">
                      {notePath(state, activeKey, p.id)}
                    </span>
                  }
                />
              ))}
            </Prompt>
          );
        }

        if (switchTo !== undefined && activeNote) {
          const current = profileById(state, activeNote.profileId);
          const target = profileById(state, switchTo);
          const folderDiffers = current.folder !== target.folder;
          const imported = activeNote.importedNotes ?? 0;
          const ruleTarget = activeItem
            ? profileById(state, actions.resolveRule(activeItem))
            : null;
          const checkboxes = [];
          if (folderDiffers) {
            checkboxes.push({
              label: `Move to ${target.folder}/`,
              checked: moveFile,
              onChange: setMoveFile,
              note: `Leave it off to keep the file at ${activeNote.path}.`,
            });
          }
          if (imported > 0) {
            checkboxes.push({
              label:
                imported === 1
                  ? "Also switch this item's 1 imported note"
                  : `Also switch this item's ${imported} imported notes`,
              checked: includeImported,
              onChange: setIncludeImported,
            });
          }
          const closeDialog = () => setSwitchTo(undefined);
          overlay = (
            <Dialog
              title={`Switch to “${target.label}” profile?`}
              body={
                <div className="flex flex-col gap-2">
                  <div>
                    This note uses “{current.label}”. ZotLit re-renders its
                    managed content from{" "}
                    <span className="font-mono">
                      {target.document ?? "the built-in template"}
                    </span>{" "}
                    and re-stamps it as “{target.label}”. Text outside the
                    managed region stays unchanged.
                  </div>
                  {ruleTarget && ruleTarget.id !== target.id ? (
                    <div className="text-muted">
                      The rules resolve this item to “{ruleTarget.label}” (
                      {vd_ruleText(ruleTarget.rule)}
                      ).
                    </div>
                  ) : null}
                </div>
              }
              checkboxes={checkboxes}
              actions={[
                ...(ruleTarget && ruleTarget.id !== target.id
                  ? [
                      {
                        label: "Re-apply rules",
                        onClick: () => setSwitchTo(ruleTarget.id),
                      },
                    ]
                  : []),
                { label: `Keep “${current.label}”`, onClick: closeDialog },
                {
                  label: `Switch to “${target.label}”`,
                  cta: true,
                  onClick: () => {
                    actions.switchNoteProfile(activeKey, target.id, {
                      moveFile: folderDiffers && moveFile,
                      includeImported: imported > 0 && includeImported,
                    });
                    actions.notify(`Switched this note to ${target.label}`);
                    closeDialog();
                  },
                },
              ]}
            />
          );
        }

        const statusItems = (
          <span className="text-muted text-[12px]">
            {extras ? "ZotLit · rules on" : "ZotLit · one profile"}
          </span>
        );

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              title="Settings — Literature note profiles"
              stampRender={vd_stamp}
              statusItems={statusItems}
              overlay={overlay}
            >
              {panel}
            </ObsidianFrame>
            <Rail
              thesis="Profiles are context — item type, collection, library — so the system decides and shows its decision on every hit; the user only overrides."
              consent="Creation never re-stamps; a rule change never touches existing notes; re-stamping only through Switch Profile after one dialog."
              steps={[
                "Open Settings → Literature note profiles and give each profile an “Applies to” rule.",
                "Press “Search your library”. Every row carries the profile the rules resolve to, plus the path the note will take.",
                "↵ creates the note under that profile silently — or opens the note when the item already has one.",
                "⇧↵ opens the informed one-off picker; the rule-resolved profile is marked “by rule”.",
                "To re-stamp an existing note, run “Switch literature note profile…” and confirm the one dialog.",
              ]}
              extras={
                <div className="flex flex-col gap-1">
                  <div className="text-muted text-[11px] tracking-wide uppercase">
                    Live rules
                  </div>
                  {state.profiles.map((p) => (
                    <div
                      key={p.id ?? "default"}
                      className="flex justify-between gap-2 text-[12px]"
                    >
                      <span className="text-ink">{p.label}</span>
                      <span className="text-muted font-mono">
                        {p.id === null
                          ? "everything else"
                          : vd_ruleText(p.rule)}
                      </span>
                    </div>
                  ))}
                </div>
              }
            />
          </div>
        );
      }
      // --- Variant D END ---

      // --- Variant E ---
      // Variant E — Profile inside the search box (format first, integrated).
      // One Quick Switch whose header slot is a segmented tab row of Profiles. The tab is sticky
      // between openings (module-level ve_selected), Tab cycles it, and every row's aside shows the
      // path the selected tab would produce — so the choice is visible before Enter.

      // Sticky across openings AND across variant remounts, initialised from state.lastUsedProfileId.
      let ve_selected;

      function ve_extras(state) {
        // Profiles beyond Default; the tab row exists only when this is non-empty.
        return state.profiles.filter((p) => p.id !== null);
      }

      function ve_resolve(state, id) {
        return state.profiles.find((p) => p.id === id) ?? state.profiles[0];
      }

      function ve_matches(item, query) {
        const q = query.trim().toLowerCase();
        if (!q) return true;
        return [item.title, item.authors, item.key, String(item.year)]
          .join(" ")
          .toLowerCase()
          .includes(q);
      }

      function ve_stamp(note, profile) {
        return (
          <span className="font-mono">
            {profile.label}
            {profile.id ? (
              <span className="text-muted"> {profile.id}</span>
            ) : null}
          </span>
        );
      }

      function VariantE() {
        const { state, actions } = useProtoState();

        const [quickOpen, setQuickOpen] = React.useState(true);
        const [query, setQuery] = React.useState("");
        const [cursor, setCursor] = React.useState(0);
        const [paletteOpen, setPaletteOpen] = React.useState(false);
        const [pickerOpen, setPickerOpen] = React.useState(false);
        const [pickerQuery, setPickerQuery] = React.useState("");
        const [pickerCursor, setPickerCursor] = React.useState(0);
        const [pending, setPending] = React.useState(null); // {id} awaiting the Switch dialog, or null
        const [moveFile, setMoveFile] = React.useState(true);
        const [includeImported, setIncludeImported] = React.useState(true);
        const [hovered, setHovered] = React.useState(null);

        if (ve_selected === undefined)
          ve_selected = state.lastUsedProfileId ?? null;
        const [selectedId, setSelectedId] = React.useState(ve_selected);

        const tabs = state.profiles;
        const hasTabs = ve_extras(state).length > 0;
        const selected = ve_resolve(state, selectedId);

        const chooseTab = (id) => {
          ve_selected = id;
          setSelectedId(id);
        };

        // Scenario switches can drop the sticky Profile; fall back to Default without losing stickiness.
        React.useEffect(() => {
          if (selected.id !== selectedId) chooseTab(selected.id);
        }, [state.scenario]);

        const hits = state.items.filter((item) => ve_matches(item, query));
        const active = hits[Math.min(cursor, Math.max(hits.length - 1, 0))];

        const runHit = (item) => {
          if (!item) return;
          const note = state.notes[item.key];
          if (note) {
            actions.openNote(item.key);
            setQuickOpen(false);
            return;
          }
          const { path } = actions.createNote(item.key, selected.id);
          actions.setLastUsed(selected.id);
          actions.openNote(item.key);
          setQuickOpen(false);
          actions.notify(`Created ${path} under ${selected.label}`);
        };

        const onQuickKey = (e) => {
          if (e.key === "Tab") {
            e.preventDefault();
            if (!hasTabs) return;
            const at = tabs.findIndex((p) => p.id === selected.id);
            chooseTab(tabs[(at + 1) % tabs.length].id);
            return;
          }
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setCursor((c) => Math.min(c + 1, hits.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setCursor((c) => Math.max(c - 1, 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            runHit(active);
          } else if (e.key === "Escape") {
            e.preventDefault();
            setQuickOpen(false);
          }
        };

        // --- Switch Profile… command -------------------------------------------------
        const activeKey = state.activeNoteKey;
        const activeNote = activeKey ? state.notes[activeKey] : null;
        const currentProfile = activeNote
          ? ve_resolve(state, activeNote.profileId)
          : null;

        const openPicker = () => {
          setPaletteOpen(false);
          setPickerQuery("");
          setPickerCursor(0);
          setPickerOpen(true);
        };

        const pickerRows = state.profiles.filter(
          (p) =>
            !pickerQuery.trim() ||
            p.label.toLowerCase().includes(pickerQuery.trim().toLowerCase()),
        );
        const pickerActive =
          pickerRows[
            Math.min(pickerCursor, Math.max(pickerRows.length - 1, 0))
          ];

        const proposeSwitch = (profile) => {
          if (!profile || !currentProfile) return;
          if (profile.id === currentProfile.id) {
            setPickerOpen(false);
            actions.notify(`This note already uses ${profile.label}`);
            return;
          }
          setMoveFile(profile.folder !== currentProfile.folder);
          setIncludeImported(true);
          setPending({ id: profile.id });
          setPickerOpen(false);
        };

        const onPickerKey = (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setPickerCursor((c) => Math.min(c + 1, pickerRows.length - 1));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setPickerCursor((c) => Math.max(c - 1, 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            proposeSwitch(pickerActive);
          } else if (e.key === "Escape") {
            e.preventDefault();
            setPickerOpen(false);
          }
        };

        const target = pending ? ve_resolve(state, pending.id) : null;

        const confirmSwitch = () => {
          actions.switchNoteProfile(activeKey, target.id, {
            moveFile,
            includeImported,
          });
          actions.notify(`Switched this note to ${target.label}`);
          setPending(null);
        };

        // --- Overlay ------------------------------------------------------------------
        const quickSwitch = (
          <Prompt
            placeholder="Search your library"
            value={query}
            onChange={(v) => {
              setQuery(v);
              setCursor(0);
            }}
            onKeyDown={onQuickKey}
            instructions={[
              { command: "↑↓", purpose: "navigate" },
              { command: "⇥", purpose: "profile" },
              { command: "↵", purpose: "create or open" },
              { command: "esc", purpose: "dismiss" },
            ]}
            header={
              hasTabs ? (
                <div className="border-line flex gap-1 border-b px-2 pt-2 pb-2">
                  {tabs.map((p) => {
                    const on = p.id === selected.id;
                    const show = on || hovered === p.id;
                    return (
                      <button
                        key={p.id ?? "default"}
                        type="button"
                        onMouseEnter={() => setHovered(p.id)}
                        onMouseLeave={() => setHovered(null)}
                        onClick={() => chooseTab(p.id)}
                        className={`flex min-w-24 flex-col items-start gap-0.5 rounded-sm px-3 py-1.5 text-left leading-tight ${
                          on
                            ? "bg-accent text-white"
                            : "text-muted hover:bg-ground-2"
                        }`}
                      >
                        <span className="text-sm">{p.label}</span>
                        <span
                          className={`font-mono text-[10px] ${on ? "text-white/70" : "text-muted"} ${
                            show ? "" : "invisible"
                          }`}
                        >
                          {p.folder}/
                        </span>
                      </button>
                    );
                  })}
                </div>
              ) : null
            }
          >
            {hits.map((item, i) => {
              const note = state.notes[item.key];
              return (
                <SuggestRow
                  key={item.key}
                  selected={item === active}
                  onClick={() => {
                    setCursor(i);
                    runHit(item);
                  }}
                  title={item.title}
                  note={`${item.authors} · ${item.year} · ${item.key}`}
                  badge={note ? <Pill tone="muted">noted</Pill> : null}
                  aside={
                    note ? (
                      <span>
                        opens note ·{" "}
                        <span className="font-mono">
                          {ve_resolve(state, note.profileId).label}
                        </span>
                      </span>
                    ) : (
                      <span className="font-mono">
                        {notePath(state, item.key, selected.id)}
                      </span>
                    )
                  }
                />
              );
            })}
            {hits.length === 0 ? (
              <div className="text-muted px-3 py-4 text-sm">
                No items match “{query}”.
              </div>
            ) : null}
          </Prompt>
        );

        const picker = (
          <Prompt
            placeholder="Choose a profile…"
            value={pickerQuery}
            onChange={(v) => {
              setPickerQuery(v);
              setPickerCursor(0);
            }}
            onKeyDown={onPickerKey}
            instructions={[
              { command: "↑↓", purpose: "navigate" },
              { command: "↵", purpose: "review the switch" },
              { command: "esc", purpose: "dismiss" },
            ]}
          >
            {pickerRows.map((p) => (
              <SuggestRow
                key={p.id ?? "default"}
                selected={p === pickerActive}
                onClick={() => proposeSwitch(p)}
                title={p.label}
                note={PROFILE_DISPLAY(p)}
                badge={
                  currentProfile && p.id === currentProfile.id ? (
                    <Pill tone="accent">current</Pill>
                  ) : null
                }
                aside={
                  <span className="font-mono">
                    {notePath(state, activeKey, p.id)}
                  </span>
                }
              />
            ))}
          </Prompt>
        );

        const switchDialog =
          pending && activeNote && currentProfile ? (
            <Dialog
              title={`Switch this note to “${target.label}”?`}
              body={
                <div className="flex flex-col gap-2 text-sm">
                  <p>
                    This note uses “{currentProfile.label}”. Its managed content
                    is re-rendered from{" "}
                    <span className="font-mono">
                      {target.document ?? "the built-in template"}
                    </span>
                    . Text outside the managed region stays unchanged.
                  </p>
                  <p className="text-muted font-mono text-xs">
                    {notePath(state, activeKey, currentProfile.id)} →{" "}
                    {notePath(state, activeKey, target.id)}
                  </p>
                </div>
              }
              checkboxes={[
                ...(target.folder !== currentProfile.folder
                  ? [
                      {
                        label: `Move to ${target.folder}/`,
                        checked: moveFile,
                        onChange: setMoveFile,
                        note: "Leave this off to keep the file where it is.",
                      },
                    ]
                  : []),
                ...(activeNote.importedNotes > 0
                  ? [
                      {
                        label:
                          activeNote.importedNotes === 1
                            ? "Also switch this item's 1 imported note"
                            : `Also switch this item's ${activeNote.importedNotes} imported notes`,
                        checked: includeImported,
                        onChange: setIncludeImported,
                        note: "The new profile applies the next time you update them from Zotero.",
                      },
                    ]
                  : []),
              ]}
              actions={[
                {
                  label: `Keep “${currentProfile.label}”`,
                  onClick: () => setPending(null),
                },
                { label: "Switch", cta: true, onClick: confirmSwitch },
              ]}
            />
          ) : null;

        const palette = (
          <CommandPalette
            open={paletteOpen}
            onClose={() => setPaletteOpen(false)}
            items={[
              {
                label: "ZotLit: Search your library",
                onSelect: () => {
                  setPaletteOpen(false);
                  setQuery("");
                  setCursor(0);
                  setQuickOpen(true);
                },
              },
              ...(activeKey
                ? [
                    {
                      label: "ZotLit: Switch Literature Note Profile…",
                      onSelect: openPicker,
                    },
                  ]
                : []),
            ]}
          />
        );

        const overlay = quickOpen
          ? quickSwitch
          : pickerOpen
            ? picker
            : switchDialog
              ? switchDialog
              : paletteOpen
                ? palette
                : null;

        return (
          <div
            className="grid h-full"
            style={{ gridTemplateColumns: "minmax(0,1fr) 300px" }}
          >
            <ObsidianFrame
              title="ZotLit — Variant E"
              stampRender={ve_stamp}
              overlay={overlay}
              statusItems={
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    className="border-line text-muted hover:text-ink rounded-sm border px-2 py-0.5 text-xs"
                    onClick={() => {
                      setQuery("");
                      setCursor(0);
                      setQuickOpen(true);
                    }}
                  >
                    Search your library
                  </button>
                  <button
                    type="button"
                    className="border-line text-muted hover:text-ink rounded-sm border px-2 py-0.5 text-xs disabled:opacity-40"
                    disabled={!activeKey}
                    onClick={openPicker}
                  >
                    Switch Profile…
                  </button>
                  <button
                    type="button"
                    className="border-line text-muted hover:text-ink rounded-sm border px-2 py-0.5 text-xs"
                    onClick={() => setPaletteOpen(true)}
                  >
                    <Kbd>⌘P</Kbd>
                  </button>
                </div>
              }
            />
            <Rail
              thesis="Choose the format first, inside the same box, and keep it chosen; the path preview makes the tab's effect visible before Enter."
              consent="Creation never re-stamps; re-stamping only through Switch Profile after one dialog."
              steps={[
                "Open “Search your library”. The Profile tabs sit above the results; the selected tab is the one you used last.",
                "Press ⇥ (or click) to move between Default, Articles and Thesis. Every row's right-hand path changes with the tab.",
                "Press ↵ on a new item: the note is created under the selected tab, opened, and a notice names the path and the profile.",
                "Press ↵ on a row marked “noted”: the note opens. The tab has no effect on it — creation never re-stamps.",
                "To re-stamp, run “Switch Profile…”, pick a profile, and confirm the one dialog that states the consequences.",
                "In the zero-extra scenario the tab row is hidden, so a single-profile vault sees a plain search box.",
              ]}
              extras={
                <div className="text-muted text-xs">
                  Selected tab (sticky):{" "}
                  <span className="text-ink font-mono">{selected.label}</span>
                  <div className="font-mono">{selected.folder}/</div>
                </div>
              }
            />
          </div>
        );
      }
      // --- Variant E END ---

      // --- Switcher ---
      const VARIANTS = [
        { key: "A", name: "Baseline (today)", component: VariantA },
        { key: "B", name: "Ask, but informed", component: VariantB },
        { key: "C", name: "Current Profile mode", component: VariantC },
        { key: "D", name: "Rules decide", component: VariantD },
        { key: "E", name: "Profile tabs in search", component: VariantE },
      ];

      const SCENARIO_PRESETS = [
        { id: "one-extra", label: "1 extra Profile" },
        { id: "three-with-noted", label: "3 Profiles · 1 noted" },
        { id: "zero-extra", label: "0 extra Profiles" },
      ];

      function App() {
        const { state } = useProtoState();
        const [idx, setIdx] = useState(() => {
          const h = location.hash.slice(1);
          const i = VARIANTS.findIndex((v) => v.key === h);
          return i >= 0 ? i : 0;
        });

        useEffect(() => {
          location.hash = VARIANTS[idx].key;
          const onHash = () => {
            const i = VARIANTS.findIndex(
              (v) => v.key === location.hash.slice(1),
            );
            if (i >= 0) setIdx(i);
          };
          window.addEventListener("hashchange", onHash);
          const onKey = (e) => {
            if (
              ["INPUT", "TEXTAREA"].includes(e.target.tagName) ||
              e.target.isContentEditable
            )
              return;
            if (e.key === "ArrowLeft")
              setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length);
            if (e.key === "ArrowRight")
              setIdx((i) => (i + 1) % VARIANTS.length);
          };
          window.addEventListener("keydown", onKey);
          return () => {
            window.removeEventListener("hashchange", onHash);
            window.removeEventListener("keydown", onKey);
          };
        }, [idx]);

        const V = VARIANTS[idx];
        return (
          <div className="h-screen bg-ground text-ink font-body">
            <V.component />
            <div
              style={{
                position: "fixed",
                top: "0.75rem",
                left: "50%",
                transform: "translateX(-50%)",
                background: "#1e293b",
                color: "#f8fafc",
                borderRadius: "9999px",
                padding: "0.5rem 1.25rem",
                display: "flex",
                alignItems: "center",
                gap: "1rem",
                fontSize: "0.875rem",
                zIndex: 9999,
                boxShadow: "0 4px 12px rgba(0,0,0,0.3)",
              }}
            >
              <button
                onClick={() =>
                  setIdx((i) => (i - 1 + VARIANTS.length) % VARIANTS.length)
                }
                style={{
                  background: "none",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  fontSize: "1.25rem",
                }}
              >
                ←
              </button>
              <span>
                {V.key} — {V.name}
              </span>
              <button
                onClick={() => setIdx((i) => (i + 1) % VARIANTS.length)}
                style={{
                  background: "none",
                  border: "none",
                  color: "inherit",
                  cursor: "pointer",
                  fontSize: "1.25rem",
                }}
              >
                →
              </button>
              <span
                style={{
                  width: "1px",
                  alignSelf: "stretch",
                  background: "rgba(248,250,252,0.25)",
                }}
              />
              {SCENARIO_PRESETS.map((p) => (
                <button
                  key={p.id}
                  onClick={() => actions.setScenario(p.id)}
                  style={{
                    background:
                      state.scenario === p.id ? "#f8fafc" : "transparent",
                    color: state.scenario === p.id ? "#1e293b" : "inherit",
                    border: "1px solid rgba(248,250,252,0.25)",
                    borderRadius: "9999px",
                    padding: "0.15rem 0.6rem",
                    cursor: "pointer",
                    fontSize: "0.75rem",
                    whiteSpace: "nowrap",
                  }}
                >
                  {p.label}
                </button>
              ))}
            </div>
          </div>
        );
      }
      // --- Switcher END ---
      // --- App END ---

      createRoot(document.getElementById("root")).render(<App />);
    </script>
    <script type="module">
      import { transform } from "https://esm.sh/sucrase@3";
      const src = document.getElementById("app").textContent;
      const { code } = transform(src, {
        transforms: ["jsx"],
        production: true,
      });
      const url = URL.createObjectURL(
        new Blob([code], { type: "text/javascript" }),
      );
      await import(url);
    </script>
  </body>
</html>
