key: date-read
merge: keep
value:
  {
    "$let":
      {
        "latest":
          {
            "$reduce": { "$eval": "zt.annotations" },
            "initial": "",
            "each(latest, annotation)":
              {
                "$if": "annotation.dateAdded > latest",
                "then": { "$eval": "annotation.dateAdded" },
              },
          },
      },
    "in": { "$if": "latest", "then": { "$eval": "latest[:10]" } },
  }
