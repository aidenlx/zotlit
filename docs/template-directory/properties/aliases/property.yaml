key: aliases
merge: append
value:
  {
    "$let":
      {
        "aliases":
          {
            "$if": "len(zt.authors) > 0",
            "then":
              [
                {
                  "$if": "zt.date && zt.date.year",
                  "then": "${zt.authorsShort} ${zt.date.year}",
                },
                {
                  "$if": "zt.title",
                  "then":
                    {
                      "$if": "zt.authors[0].literal",
                      "then": "${zt.authors[0].literal} – ${zt.title}",
                      "else": "${zt.authors[0].family} – ${zt.title}",
                    },
                },
              ],
            "else": [],
          },
      },
    "in": { "$if": "len(aliases) > 0", "then": { "$eval": "aliases" } },
  }
